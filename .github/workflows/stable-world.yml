name: Promote stable world
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/stable-world.yml'
      - 'jit/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: stable-root
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble pinned, independent Hermeticon release
        env:
          SOURCE_SHA: f39cda62551ad4b7fbef2f9e630cb002d0152d4b
        run: |
          set -euo pipefail
          mkdir -p /tmp/hermeticon-source
          curl -fLsS --retry 3 "https://api.github.com/repos/bonoj/Hermeticon/tarball/${SOURCE_SHA}" | tar xz --strip-components=1 -C /tmp/hermeticon-source
          python3 - <<'PY'
          import os, pathlib, shutil, re, json
          sha=os.environ['SOURCE_SHA']
          source=pathlib.Path('/tmp/hermeticon-source')
          site=pathlib.Path('site')
          site.mkdir()
          # Stamp JIT builds from the exact deployed repository commit.
          deployed_sha=os.environ['GITHUB_SHA']
          door=site/'jit/hundred-doors'
          # The JIT directory is copied below before stamping.
          # Preserve the existing independent /jit/ projects.
          if pathlib.Path('jit').is_dir(): shutil.copytree('jit',site/'jit')
          chaos=site/'jit/chaos'
          chaos_html=chaos/'index.html'
          if chaos_html.is_file():
              source_html=chaos_html.read_text()
              marker='var BUILD = "pending";'
              assert source_html.count(marker)==1, 'Chaos build stamp missing or ambiguous'
              chaos_html.write_text(source_html.replace(marker, 'var BUILD = "'+deployed_sha+'";'))
              (chaos/'build.json').write_text(json.dumps({'sha':deployed_sha})+'\n')
          music=site/'jit/music'
          music_html=music/'index.html'
          if music_html.is_file():
              source_html=music_html.read_text()
              marker='const MUSIC_BUILD = "pending";'
              assert source_html.count(marker)==1, 'Music build stamp missing or ambiguous'
              music_html.write_text(source_html.replace(marker, 'const MUSIC_BUILD = "'+deployed_sha+'";'))
              (music/'build.json').write_text(json.dumps({'sha':deployed_sha})+'\\n')
          lattice=site/'jit/lattice'
          lattice_html=lattice/'index.html'
          if lattice_html.is_file():
              source_html=lattice_html.read_text()
              marker="VERSION='pending'"
              footer='BUILD · pending'
              assert source_html.count(marker)==1 and source_html.count(footer)==1, 'Lattice identity stamp missing or ambiguous'
              lattice_html.write_text(source_html.replace(marker,"VERSION='"+deployed_sha[:8]+"'").replace(footer,'BUILD · '+deployed_sha[:8]))
              (lattice/'build.json').write_text(json.dumps({'sha':deployed_sha})+'\n')
          evermore=site/'jit/evermore-2'
          evermore_html=evermore/'index.html'
          if evermore_html.is_file():
              source_html=evermore_html.read_text()
              marker='var BUILD = "pending";'
              assert source_html.count(marker)==1, 'Evermore II build stamp missing or ambiguous'
              evermore_html.write_text(source_html.replace(marker, 'var BUILD = "'+deployed_sha+'";'))
              (evermore/'build.json').write_text(json.dumps({'sha':deployed_sha})+'\n')
          if (site/'jit/hundred-doors/index.html').is_file():
              door_html=site/'jit/hundred-doors/index.html'
              door_html.write_text(door_html.read_text().replace('<span id="build">pending</span>', '<span id="build">'+deployed_sha[:8]+'</span>'))
              (door/'build.json').write_text(json.dumps({'sha':deployed_sha})+'\n')
          for folder in ('arcana','athanor','codex'):
              shutil.copytree(source/folder,site/folder)
          for filename in ('index.html','favicon.svg'):
              shutil.copy2(source/filename,site/filename)
          # The root is now a real, standalone copy. No Hermeticon path is fetched at runtime.
          (site/'build.json').write_text(json.dumps({'sha':sha})+'\n')
          entry=site/'index.html'
          html=entry.read_text()
          html=html.replace('https://bonoj.github.io/Hermeticon/preview.svg','https://bonoj.github.io/preview.svg')
          entry.write_text(html)
          # Stamp all relative module imports, including transitive imports.
          for module in site.rglob('*.js'):
              js=module.read_text()
              js=re.sub(r"""(['"])(\.{1,2}/[^'"\n]+?\.js(?:\?[^'"\n]*)?)\1""",
                lambda m:m.group(1)+m.group(2).split('?')[0]+'?v='+sha+m.group(1),js)
              module.write_text(js)
          for path in (site/'index.html',site/'athanor/index.html'):
              html=path.read_text()
              html=re.sub(r'(compose\.js|interface\.css)(?:\?v=[^"\']+)?',lambda m:m.group(1)+'?v='+sha,html)
              path.write_text(html)
          assert 'HERMETICON' in entry.read_text()
          assert 'location.replace' not in entry.read_text()
          assert (site/'jit/hundred-doors/index.html').is_file()
          assert (site/'jit/hundred-doors/build.json').is_file()
          assert (site/'athanor/compose.js').is_file()
          assert (site/'codex/genesis/world.js').is_file()
          print('PINNED RELEASE',sha)
          PY
      - name: Syntax check
        run: |
          find site/arcana site/athanor site/codex -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('site/jit/lattice/index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          assert scripts, 'Lattice inline script missing'
          Path('/tmp/lattice-runtime.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/lattice-runtime.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Recover the orphaned Pages deployment left by the 2026-11-04 timeout.
      # This is a Pages backend deployment, not a running Actions job.
      - name: Clear orphaned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/0d311ce3e5eb9cdf3c8170ad660f1a5ae7b6031a"
          code=$(curl -sS -o /tmp/pages-state.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${endpoint}")
          echo "Orphaned deployment status HTTP ${code}"
          cat /tmp/pages-state.json || true
          if [ "${code}" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"(succeed|failed|cancelled|canceled|errored)"' /tmp/pages-state.json; then
            echo "Already terminal; no cancellation needed"
          else
            code=$(curl -sS -o /tmp/pages-cancel.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${endpoint}/cancel")
            echo "Orphan cancellation HTTP ${code}"
            cat /tmp/pages-cancel.json || true
            test "${code}" = "204" || test "${code}" = "404"
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public root
        env:
          SOURCE_SHA: f39cda62551ad4b7fbef2f9e630cb002d0152d4b
        run: |
          python3 - <<'PY'
          import os,time,urllib.request,json
          sha=os.environ['SOURCE_SHA']
          for i in range(36):
              try:
                  url='https://bonoj.github.io/build.json?verify='+sha+'&attempt='+str(i)
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as r: data=json.load(r)
                  assert data['sha']==sha,(data,sha)
                  with urllib.request.urlopen('https://bonoj.github.io/?verify='+sha+'&attempt='+str(i),timeout=15) as r: html=r.read().decode()
                  assert 'HERMETICON' in html and 'location.replace' not in html
                  with urllib.request.urlopen('https://bonoj.github.io/jit/lattice/build.json?verify='+os.environ['GITHUB_SHA']+'&attempt='+str(i),timeout=15) as r: lattice_build=json.load(r)
                  assert lattice_build['sha']==os.environ['GITHUB_SHA'], ('Lattice stale deployment',lattice_build)
                  with urllib.request.urlopen('https://bonoj.github.io/jit/lattice/index.html?verify='+os.environ['GITHUB_SHA']+'&attempt='+str(i),timeout=15) as r: lattice_html=r.read().decode()
                  assert 'BUILD · '+os.environ['GITHUB_SHA'][:8] in lattice_html, 'Lattice HTML stamp stale'
                  # Validate immutable assets as well as the entry document.
                  with urllib.request.urlopen('https://bonoj.github.io/athanor/compose.js?v='+sha,timeout=15) as r: module=r.read().decode()
                  assert len(module)>100 and 'import' in module
                  print('ROOT PUBLIC RELEASE VERIFIED',sha)
                  break
              except Exception as e:
                  if i==35: raise
                  print('Awaiting public root',i+1,str(e))
                  time.sleep(10)
          PY
