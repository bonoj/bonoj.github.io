name: Observatory OMNI 2024 acquisition
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/observatory-omni-2024.yml'
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch bounded NASA OMNI measurements
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,pathlib,datetime,hashlib,traceback
          root=pathlib.Path('jit/observatory/events/2024-05-storm-data')
          root.mkdir(parents=True,exist_ok=True)
          base='https://cdaweb.gsfc.nasa.gov/hapi/'
          status={'schema':'hermeticon-omni-acquisition/v1','utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'dataset':'OMNI_HRO_1MIN','window':['2024-05-10T00:00:00Z','2024-05-12T00:00:00Z'],'state':'STARTED'}
          def get(url,maxbytes=8*1024*1024):
            req=urllib.request.Request(url,headers={'User-Agent':'HermeticonObservatory/1.0'})
            with urllib.request.urlopen(req,timeout=40) as response:
              length=response.headers.get('Content-Length')
              if length and int(length)>maxbytes: raise ValueError('Content-Length exceeds bound')
              data=response.read(maxbytes+1)
              if len(data)>maxbytes: raise ValueError('Response exceeds bound')
              return data
          try:
            info_url=base+'info?'+urllib.parse.urlencode({'id':'OMNI_HRO_1MIN'})
            info=json.loads(get(info_url))
            (root/'omni-info.json').write_text(json.dumps(info,indent=2))
            names=[p['name'] for p in info.get('parameters',[])]
            status['parameterNames']=names
            # HAPI standard parameter names are case sensitive; select only actual names.
            candidates=[('BZ_GSM','bz_gsm'),('Pressure','pressure'),('flow_speed','speed'),('proton_density','density'),('SYM_H','sym_h')]
            wanted={x for x,_ in candidates}
            selected=[x for x in names if x in wanted]
            status['selectedParameters']=selected
            if not selected: raise ValueError('No requested physical parameters present; inspect metadata')
            params={'id':'OMNI_HRO_1MIN','time.min':'2024-05-10T00:00:00Z','time.max':'2024-05-12T00:00:00Z','parameters':','.join(selected),'format':'csv'}
            data_url=base+'data?'+urllib.parse.urlencode(params)
            data=get(data_url)
            import csv,io
            rows=list(csv.reader(io.StringIO(data.decode('utf-8-sig'))))
            if len(rows)<1000 or any(len(row)!=len(selected)+1 for row in rows): raise ValueError('HAPI data malformed or insufficient rows: '+data[:250].decode('utf-8','replace'))
            if not rows[0][0].startswith('2024-05-10T'): raise ValueError('Unexpected first observation timestamp: '+str(rows[0][0]))
            if not rows[-1][0].startswith('2024-05-11T'): raise ValueError('Unexpected final observation timestamp: '+str(rows[-1][0]))
            (root/'omni-2024-05-10_11.csv').write_bytes(data)
            status.update(state='BYTES_ACQUIRED_NOT_VALIDATED',url=data_url,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),lineCount=len(rows),firstTime=rows[0][0],lastTime=rows[-1][0])
          except Exception as e:
            status.update(state='BLOCKED',error=str(e),traceback=traceback.format_exc()[-1600:])
          (root/'acquisition.json').write_text(json.dumps(status,indent=2))
          print(json.dumps(status,indent=2))
          PY
      - name: Persist evidence and measurements
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jit/observatory/events/2024-05-storm-data
          if ! git diff --cached --quiet; then
            git commit -m 'Observatory: acquire bounded 2024 OMNI archive evidence'
            git push
          fi
