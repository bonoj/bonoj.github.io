name: JIT MCP Android build
on:
  push:
    branches: [master]
    paths:
      - 'jit/mcp/android/**'
      - 'jit/mcp/runtime/**'
      - '.github/workflows/jit-mcp-android-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu Android SDK is preinstalled. setup-android@v3 defaults to
      # the removed SDK package `tools`, causing sdkmanager exit 1 before Gradle.
      - name: Verify runner Android SDK
        run: |
          test -n "${ANDROID_HOME:-}" || { echo 'ANDROID_HOME missing'; exit 1; }
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Install required Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Browser runtime regression
        run: node --test jit/mcp/runtime/v6.test.mjs
      - name: Build unsigned release
        working-directory: jit/mcp/android
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify output
        run: test -s jit/mcp/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jit-mcp-android-v6-unsigned
          path: jit/mcp/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
