name: Job Lattice intake
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: job-lattice-intake
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and normalize public job feeds
        run: python jit/job-lattice/ingest.py
      - name: Publish snapshot only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jit/job-lattice/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Job Lattice public feed"
            git push
          fi
