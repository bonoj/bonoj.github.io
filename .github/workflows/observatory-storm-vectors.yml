name: Observatory May 2024 vector diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/observatory-storm-vectors.yml'
permissions:
  contents: write
jobs:
  vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install readers
        run: python3 -m pip install --quiet h5py numpy
      - name: Inspect GOES GSM components and flags
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,pathlib,tempfile,datetime
          import numpy as np,h5py
          root=pathlib.Path('jit/observatory/events/2024-05-storm-data')
          result={'schema':'hermeticon-goes-vector-diagnostics/v1','status':'STARTED','createdAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
            vectors=[];magnitudes=[];flags=[];quality=[];shapes={}
            for day in ['20240510','20240511']:
              url='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes18/l2/data/magn-l2-avg1m/2024/05/dn_magn-l2-avg1m_g18_d'+day+'_v2-0-2.nc'
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'HermeticonObservatory/1.0'}),timeout=50).read(3*1024*1024)
              expected={'20240510':'7080fbaf864dc47dc74a84dc7bcc2cbe6efe26a214d7e57c16d29220c2d2e84c','20240511':'77564c7cd75381b6439f7cbfa06ed2b186b51fe3d371ce0bca1a1c0b5e4564a6'}[day]
              if hashlib.sha256(data).hexdigest()!=expected: raise ValueError('Archive hash mismatch '+day)
              with tempfile.NamedTemporaryFile(suffix='.nc') as f:
                f.write(data);f.flush()
                with h5py.File(f.name) as h:
                  for name in ['b_gsm','b_total','DQF','b_quality']:
                    ds=h[name]
                    shapes[name]={'shape':list(ds.shape),'dtype':str(ds.dtype),'attrs':{str(k):str(v)[:300] for k,v in ds.attrs.items()}}
                  vectors.extend(np.asarray(h['b_gsm'][:],dtype=float).reshape(1440,-1).tolist())
                  magnitudes.extend(np.asarray(h['b_total'][:],dtype=float).reshape(-1).tolist())
                  flags.extend(np.asarray(h['DQF'][:]).reshape(-1).tolist())
                  quality.extend(np.asarray(h['b_quality'][:]).reshape(-1).tolist())
            vec=np.asarray(vectors);mag=np.asarray(magnitudes);dqf=np.asarray(flags,dtype=np.int64);q=np.asarray(quality)
            result['datasets']=shapes
            result['vectorColumns']=int(vec.shape[1])
            result['flagCounts']={str(int(x)):int(np.sum(dqf==x)) for x in np.unique(dqf)}
            result['qualityCounts']={str(int(x)):int(np.sum(q==x)) for x in np.unique(q)}
            result['components']=[{'index':i,'minimum':float(np.min(vec[:,i])),'maximum':float(np.max(vec[:,i])),'mean':float(np.mean(vec[:,i]))} for i in range(vec.shape[1])]
            if vec.shape[1]==3:
              norm=np.linalg.norm(vec,axis=1)
              residual=norm-mag
              result['normVsTotal']={'medianAbsDifference_nT':float(np.median(np.abs(residual))),'maxAbsDifference_nT':float(np.max(np.abs(residual)))}
            result['eventVectors']={}
            for label,idx in [('goesMinimum',int(np.argmin(mag))),('goesMaximum',int(np.argmax(mag))),('minimumBz',1476),('minimumSymH',1574),('maximumPressure',2022)]:
              result['eventVectors'][label]={'minuteIndex':idx,'GSMComponents_nT':vec[idx].tolist(),'total_nT':float(mag[idx]),'DQF':int(dqf[idx]),'quality':int(q[idx])}
            result['status']='DESCRIPTIVE_ONLY_NOT_VALIDATED'
            result['warnings']=['Vector column labels and DQF bit semantics must be checked against NOAA documentation before physical interpretation.','No component-level lag inference, background subtraction, or independent-event validation performed.']
          except Exception as e:
            result.update(status='BLOCKED',error=str(e))
          (root/'vectors.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Persist vector diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jit/observatory/events/2024-05-storm-data/vectors.json
          if ! git diff --cached --quiet; then
            git commit -m 'Observatory: preserve GOES GSM vector and flag diagnostics'
            git push
          fi
