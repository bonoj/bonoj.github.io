name: Lattice provider checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'jit/lattice/channels.json'
      - 'jit/lattice/normalize.mjs'
      - 'jit/lattice/normalize.test.mjs'
      - 'jit/lattice/provider.test.mjs'
      - '.github/workflows/lattice-checks.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic manifest and normalization tests
        run: node jit/lattice/normalize.test.mjs
      - name: Real public provider HTTP and schema probes
        run: node jit/lattice/provider.test.mjs
