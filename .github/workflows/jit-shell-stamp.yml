name: Deploy JIT Shell
on:
  push:
    branches: [master]
    paths:
      - 'jit/shell/index.html'
      - '.github/workflows/jit-shell-stamp.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: jit-shell-stamp
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/jit-pages"
          tar --exclude=.git --exclude=.github -cf - . | tar -xf - -C "$RUNNER_TEMP/jit-pages"
          touch "$RUNNER_TEMP/jit-pages/.nojekyll"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/jit-pages
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed JIT Shell
        run: |
          python3 - <<'PY'
          import time,urllib.request
          url='https://bonoj.github.io/jit/shell/?fresh='
          for attempt in range(30):
              try:
                  req=urllib.request.Request(url+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      html=response.read().decode()
                  assert 'HUNDRED DOORS' in html and 'CAMPAIGN SNAPSHOT' in html
                  print('PUBLIC SIEVE JIT SHELL VERIFIED')
                  break
              except Exception as exc:
                  if attempt==29:raise
                  print('Waiting for deployment',attempt+1,str(exc))
                  time.sleep(10)
          PY
