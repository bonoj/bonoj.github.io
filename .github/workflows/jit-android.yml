name: JIT Android companion build
on:
  workflow_dispatch:
  push:
    paths:
      - 'jit/mcp/android/**'
      - 'jit/mcp/runtime/**'
      - '.github/workflows/jit-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: jit/mcp/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Sign and verify installable APK
        env:
          JIT_APK_KEYSTORE_BASE64: ${{ secrets.JIT_APK_KEYSTORE_BASE64 }}
          JIT_APK_KEYSTORE_PASSWORD: ${{ secrets.JIT_APK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$JIT_APK_KEYSTORE_BASE64" ] || [ -z "$JIT_APK_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing JIT APK signing secrets. Configure both repository Actions secrets."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/jit-release.jks"
          printf '%s' "$JIT_APK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          APK="jit/mcp/android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="jit/mcp/android/app/build/outputs/apk/debug/jit-browser-signed.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias jit-browser --ks-pass env:JIT_APK_KEYSTORE_PASSWORD --key-pass env:JIT_APK_KEYSTORE_PASSWORD --out "$OUT" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT"
          rm -f "$KEYSTORE" "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: jit-android-signed
          path: jit/mcp/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
