name: Observatory scalar versus vector aggregation test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/observatory-storm-aggregation-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy h5py
      - name: Evaluate aggregation inequalities and metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,tempfile,pathlib,json,datetime
          import numpy as np,h5py
          root=pathlib.Path('jit/observatory/events/2024-05-storm-data')
          out={'schema':'hermeticon-aggregation-test/v1','status':'STARTED','createdAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
            vectors=[];total=[];points=[];metadata={}
            for day in ['20240510','20240511']:
              url='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes18/l2/data/magn-l2-avg1m/2024/05/dn_magn-l2-avg1m_g18_d'+day+'_v2-0-2.nc'
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'HermeticonObservatory/1.0'}),timeout=50).read(3000000)
              expected={'20240510':'7080fbaf864dc47dc74a84dc7bcc2cbe6efe26a214d7e57c16d29220c2d2e84c','20240511':'77564c7cd75381b6439f7cbfa06ed2b186b51fe3d371ce0bca1a1c0b5e4564a6'}[day]
              if hashlib.sha256(data).hexdigest()!=expected: raise ValueError('Checksum mismatch '+day)
              with tempfile.NamedTemporaryFile(suffix='.nc') as f:
                f.write(data);f.flush()
                with h5py.File(f.name) as h:
                  vectors.extend(np.asarray(h['b_gsm'][:]).tolist())
                  total.extend(np.asarray(h['b_total'][:]).tolist())
                  if 'num_points' in h: points.extend(np.asarray(h['num_points'][:]).reshape(-1).tolist())
                  if day=='20240510':
                    for name in ['b_gsm','b_total','num_points']:
                      if name in h:
                        metadata[name]={'shape':list(h[name].shape),'attributes':{str(k):str(v)[:800] for k,v in h[name].attrs.items() if str(k) not in ['DIMENSION_LIST']}}
                    metadata['globalAttributes']={str(k):str(v)[:1000] for k,v in h.attrs.items()}
            vec=np.asarray(vectors,dtype=float);mag=np.asarray(total,dtype=float)
            norm=np.linalg.norm(vec,axis=1)
            gap=mag-norm
            out['metadata']=metadata
            out['counts']={'minutes':int(len(gap)),'scalarGreaterThanVectorBy1nT':int(np.sum(gap>1)),'scalarLessThanVectorBy1nT':int(np.sum(gap< -1)),'scalarGreaterThanVectorBy5nT':int(np.sum(gap>5)),'scalarLessThanVectorBy5nT':int(np.sum(gap< -5))}
            out['gapStatistics_nT']={'minimum':float(np.min(gap)),'maximum':float(np.max(gap)),'median':float(np.median(gap)),'p95':float(np.percentile(gap,95)),'p99':float(np.percentile(gap,99))}
            if points:
              p=np.asarray(points)
              out['numPoints']={'shape':list(p.shape),'min':float(np.min(p)),'max':float(np.max(p)),'uniqueCount':int(len(np.unique(p)))}
            out['windows']=[]
            for label,lo,hi in [('preShock',0,996),('shockToMidnight',996,1440),('stormDay',1440,2880)]:
              g=gap[lo:hi]
              out['windows'].append({'name':label,'minutes':int(len(g)),'above5nT':int(np.sum(g>5)),'belowMinus5nT':int(np.sum(g< -5)),'medianGap_nT':float(np.median(g)),'maximumGap_nT':float(np.max(g))})
            out['hypothesis']='If b_total is mean instantaneous magnitude while b_gsm is mean vector, Jensen triangle inequality predicts scalar >= vector norm before corrections, within numerical tolerance.'
            out['status']='DESCRIPTIVE_ONLY_NOT_VALIDATED'
            out['warnings']=['A compatible sign pattern is necessary but insufficient to establish the aggregation mechanism.','Raw higher-cadence vectors and exact NOAA processing specification are required for direct reconstruction.']
          except Exception as e:
            out.update(status='BLOCKED',error=str(e))
          (root/'aggregation-test.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Persist evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jit/observatory/events/2024-05-storm-data/aggregation-test.json
          if ! git diff --cached --quiet; then
            git commit -m 'Observatory: test sign and storm localization of scalar-vector aggregation gap'
            git push
          fi
