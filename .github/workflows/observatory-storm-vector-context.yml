name: Observatory vector anomaly context
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/observatory-storm-vector-context.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy h5py
      - name: Inspect adjacent minutes and coordinate representations
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,tempfile,pathlib,json,datetime
          import numpy as np,h5py
          root=pathlib.Path('jit/observatory/events/2024-05-storm-data')
          out={'schema':'hermeticon-vector-context/v1','status':'STARTED'}
          try:
            data_arrays={name:[] for name in ['b_gsm','b_gse','b_eci','b_brf','b_epn','b_vdh','b_total','DQF','b_quality']}
            for day in ['20240510','20240511']:
              url='https://data.ngdc.noaa.gov/platforms/solar-space-observing-satellites/goes/goes18/l2/data/magn-l2-avg1m/2024/05/dn_magn-l2-avg1m_g18_d'+day+'_v2-0-2.nc'
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'HermeticonObservatory/1.0'}),timeout=50).read(3000000)
              expected={'20240510':'7080fbaf864dc47dc74a84dc7bcc2cbe6efe26a214d7e57c16d29220c2d2e84c','20240511':'77564c7cd75381b6439f7cbfa06ed2b186b51fe3d371ce0bca1a1c0b5e4564a6'}[day]
              if hashlib.sha256(data).hexdigest()!=expected: raise ValueError('Archive SHA mismatch '+day)
              with tempfile.NamedTemporaryFile(suffix='.nc') as f:
                f.write(data);f.flush()
                with h5py.File(f.name) as h:
                  for name in data_arrays:
                    if name in h: data_arrays[name].extend(np.asarray(h[name][:]).tolist())
            a={k:np.asarray(v) for k,v in data_arrays.items() if v}
            out['coordinateNormComparison']={}
            total=a['b_total'].reshape(-1)
            for name in ['b_gsm','b_gse','b_eci','b_brf','b_epn','b_vdh']:
              if name not in a: continue
              vec=a[name].reshape(2880,-1)
              out['coordinateNormComparison'][name]={'columns':int(vec.shape[1])}
              if vec.shape[1]==3:
                d=np.linalg.norm(vec,axis=1)-total
                out['coordinateNormComparison'][name].update(medianAbsResidual_nT=float(np.median(np.abs(d))),above5nT=int(np.sum(np.abs(d)>5)),maxAbsResidual_nT=float(np.max(np.abs(d))))
            out['anomalyNeighborhoods']={}
            for label,index in [('May10_1720',1040),('May11_0041',1481)]:
              entries=[]
              for i in range(index-5,index+6):
                entry={'timeUTC':(datetime.datetime(2024,5,10,tzinfo=datetime.timezone.utc)+datetime.timedelta(minutes=i)).isoformat(),'total_nT':float(total[i]),'DQF':int(a['DQF'][i]),'quality':int(a['b_quality'][i])}
                for name in ['b_gsm','b_gse','b_eci','b_brf','b_epn','b_vdh']:
                  if name in a:
                    vec=a[name][i].reshape(-1)
                    entry[name]={'components':vec.tolist(),'norm_nT':float(np.linalg.norm(vec))} if len(vec)==3 else {'components':vec.tolist()}
                entries.append(entry)
              out['anomalyNeighborhoods'][label]=entries
            out['status']='DESCRIPTIVE_ONLY_NOT_VALIDATED'
            out['warning']='Different frame norms and neighborhood behavior may localize inconsistencies but do not independently establish NOAA algorithm cause.'
          except Exception as e:
            out.update(status='BLOCKED',error=str(e))
          (root/'vector-context.json').write_text(json.dumps(out,indent=2))
          print(json.dumps({'status':out['status'],'coordinateNormComparison':out.get('coordinateNormComparison'),'error':out.get('error')},indent=2))
          PY
      - name: Persist evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jit/observatory/events/2024-05-storm-data/vector-context.json
          if ! git diff --cached --quiet; then
            git commit -m 'Observatory: preserve multi-frame norm and anomaly-neighborhood diagnostics'
            git push
          fi
