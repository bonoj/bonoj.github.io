name: JIT Gestalt Runtime Eyes APK
on:
  push:
    branches: [gestalt-covenant-fixture]
    paths:
      - 'jit/gestalt/android/**'
      - 'jit/gestalt/covenant-fixture/**'
      - '.github/workflows/jit-gestalt-eyes.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout independently pinned canonical authority
        uses: actions/checkout@v4
        with:
          ref: fb682e3329fa908830ddd944e400ab6f7df80617
          path: trusted-authority
          persist-credentials: false
      - name: Reject candidate changes to canonical authority
        run: |
          python3 trusted-authority/jit/gestalt/covenant-fixture/verify_candidate.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enforce canonical UI and negative controls
        run: GESTALT_CANDIDATE_ROOT="$GITHUB_WORKSPACE/jit/gestalt" python3 trusted-authority/jit/gestalt/covenant-fixture/check_canonical.py
      - name: Build debug APK
        working-directory: jit/gestalt/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jit-gestalt-eyes-debug-apk
          path: jit/gestalt/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
