name: JIT Gestalt Android APK
on:
  push:
    branches: [master]
    paths:
      - 'jit/gestalt/android/**'
      - '.github/workflows/jit-gestalt-android.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: jit/gestalt/android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jit-gestalt-debug-apk
          path: jit/gestalt/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
