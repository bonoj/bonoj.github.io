<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="John Bono — Systems Architect & Software Engineer. AI, Interactive Systems, R&D & Prototyping.">
  <title>John Bono</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f7f7f4;
      color: #151515;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main {
      position: relative;
      width: min(90vw, 760px);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(48px, 9vh, 96px) 20px 32px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4.5vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }
    .title {
      margin: 14px 0 0;
      font-size: clamp(1.75rem, 4.6vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }
    .fields {
      margin: 10px 0 0;
      font-size: .92rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .62;
    }
    .lab {
      position: absolute;
      top: 56%;
      transform: translateY(-50%);
      display: inline-block;
      padding: 18px 28px;
      color: inherit;
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: .12em;
      text-decoration: none;
      border: 1px solid currentColor;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }
    .lab:hover, .lab:focus-visible {
      transform: translateY(calc(-50% - 2px));
      background: #151515;
      color: #f7f7f4;
      outline: none;
    }
    footer {
      margin-top: auto;
      display: flex;
      gap: 24px;
      justify-content: center;
      font-size: .9rem;
    }
    footer a {
      color: inherit;
      text-underline-offset: 4px;
      opacity: .7;
    }
    footer a:hover, footer a:focus-visible { opacity: 1; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      .lab:hover, .lab:focus-visible { background: #eee; color: #111; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>John Bono</h1>
      <p class="title">Systems Architect &amp; Software Engineer</p>
      <p class="fields">AI · Interactive Systems · R&amp;D · Prototyping</p>
    </header>

    <a class="lab" href="https://bonoj.github.io/world-lab/">WORLD LAB</a>

    <footer>
      <a href="https://github.com/bonoj">GitHub</a>
      <a href="https://www.linkedin.com/in/bonoj">LinkedIn</a>
    </footer>
  </main>
</body>
</html>
