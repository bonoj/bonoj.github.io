<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="John Bono — Principal R&D Architect. Applied AI, Interactive Systems & Prototyping.">
  <title>John Bono</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #f7f7f4;
      color: #151515;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main {
      width: min(90vw, 760px);
      min-height: 100dvh;
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      justify-items: center;
      padding: clamp(48px, 9vh, 96px) 20px 32px;
    }
    header {
      align-self: start;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4.5vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.1;
    }
    .title {
      margin: 14px 0 0;
      font-size: clamp(1.75rem, 4.6vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }
    .fields {
      margin: 18px 0 0;
      font-size: .92rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .62;
    }
    .lab {
      align-self: center;
      display: inline-block;
      padding: 18px 28px;
      color: inherit;
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: .12em;
      text-decoration: none;
      border: 1px solid currentColor;
    }
    .lab:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }
    footer {
      align-self: end;
      display: flex;
      gap: 24px;
      justify-content: center;
      font-size: .9rem;
    }
    footer a {
      color: inherit;
      text-underline-offset: 4px;
      opacity: .7;
    }
    footer a:focus-visible { opacity: 1; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>John Bono</h1>
      <p class="title">Principal R&amp;D Architect</p>
      <p class="fields">Applied AI · Interactive Systems · Prototyping</p>
    </header>

    <a class="lab" href="https://bonoj.github.io/world-lab/">WORLD LAB</a>

    <footer>
      <a href="https://github.com/bonoj">GitHub</a>
      <a href="https://www.linkedin.com/in/bonoj">LinkedIn</a>
    </footer>
  </main>
</body>
</html>
