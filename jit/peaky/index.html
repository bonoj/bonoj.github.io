s:repeat(3,1fr);gap:12px}.card{border:1px solid #566254;padding:16px;background:#222c25;border-radius:4px}.card h3{margin:0 0 8px}.card p{font-size:13px;color:#c6c8b9}.chip{font:700 11px 'Barlow Condensed';letter-spacing:.13em;color:#f2c28e;border:1px solid #98785a;padding:4px 8px;display:inline-block;margin:3px 3px 3px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.line{border-left:2px solid #a07b58;margin:10px 0 10px 9px;padding-left:18px}.entry{position:relative;padding:7px 0 14px}.entry:before{content:'';position:absolute;left:-25px;top:14px;width:11px;height:11px;background:#b87955;border:2px solid #1b241f;border-radius:50%}.entry h3{margin:0}.entry p{margin:5px 0;color:#c5c8b9;font-size:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.truth{padding:12px;border-left:3px solid #a6ad8b;background:#28342b}.fiction{padding:12px;border-left:3px solid #bc624e;background:#332825}.truth b,.fiction b{font:800 13px 'Barlow Condensed';letter-spacing:.15em}.filter{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.filter button{border:1px solid #707968;background:#29362e;color:var(--ink);border-radius:4px;padding:7px 10px}.filter button.on{background:#b7a074;color:#1c211c}.source{font-size:12px;line-height:1.7;padding:9px 0;border-bottom:1px solid #455047}.source a{text-decoration:none}.source a:hover{text-decoration:underline}.footer{text-align:center;font:11px/1.7 system-ui;color:#9b9f90;margin:25px 0}.warning{border-left:3px solid #c18b55;padding:9px 13px;background:#393024;color:#e8d8b8;font-size:13px}.stat{font:800 38px 'Barlow Condensed';color:var(--gold)}.question{font:700 21px 'Barlow Condensed';margin:14px 0}.answer{padding:13px;border:1px solid #5c6c5b;background:#26362b;margin:10px 0}.hide{display:none!important}input[type=range]{width:100%;accent-color:#c8a36d}.year{font:800 54px 'Barlow Condensed';color:var(--gold)}@media(max-width:700px){.grid,.columns,.split{grid-template-columns:1fr}.hero{min-height:260px}.hero h1{font-size: const seasons=[
{n:1,y:'1919',title:'The return from war',story:'A stolen shipment of guns destabilizes Birmingham. Tommy Shelby attempts to convert a street betting operation into something larger while a police inspector and an undercover agent enter the picture.',history:'Demobilization, postwar trauma, labor tension, policing, and the racecourse economy.',motif:'The trench follows the soldiers home.'},
{n:2,y:'1921–1922',title:'The road to London',story:'The family pushes beyond Birmingham, encountering London racketeers and the dangerous intersections of Irish politics, policing, and organized crime.',history:'The Anglo-Irish Treaty and subsequent divisions; racing syndicates; London gang rivalries.',motif:'Territory becomes a network.'},
{n:3,y:'1924',title:'The aristocratic trap',story:'Marriage, wealth, Russian émigrés, and political conspiracies draw Tommy into a world where class privilege and covert power are inseparable.',history:'Britain’s first Labour government, anticommunism, émigré politics, and class hierarchy.',motif:'Respectability is another battlefield.'},
{n:4,y:'1925–1927',title:'Blood and industry',story:'An American vendetta threatens the family as factory labor disputes and parliamentary ambitions collide with private violence.',history:'The 1926 General Strike; trade union organizing; the politics of industrial Birmingham.',motif:'A factory can be both a livelihood and a weapon.'},
{n:5,y:'1929',title:'The crash and the blackshirts',story:'Financial catastrophe meets Tommy’s political entanglement with Oswald Mosley. The family’s divisions become increasingly dangerous.',history:'Wall Street Crash, interwar fascism, the British political establishment, financial speculation.',motif:'Power is not the same as control.'},
{n:6,y:'1933–1934',title:'The cost of survival',story:'A final reckoning with family, illness, betrayal, and the advance of fascism reshapes Tommy’s choices.',history:'The rise of Nazism in Germany; British fascism; the repeal of US Prohibition in 1933.',motif:'What remains when victory no longer satisfies?'}
];
const people=[
['Thomas Shelby','Fictional','The invented central figure: war veteran, strategist, bookmaker, industrialist, and politician. His career compresses several distinct historical worlds into one character.'],
['Polly Gray','Fictional','Family matriarch and financial mind. Her authority highlights the show’s interest in women’s power inside and against patriarchal institutions.'],

['Ada Shelby','Fictional','A counterpoint to the family’s criminal enterprise through politics, independence, and moral dissent.'],

['When were the real Peaky Blinders most active?',['The 1890s','The 1930s','The 1960s'],0,'The real gang belongs mainly to late-Victorian Birmingham, not the interwar Shelby chronology.'],

const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=(t,b)=>'<div class="card"><h3>'+t+'</h3>'+b+'</div>';function heading(k,t,sub){return '<div class="eyebrow">'+k+'</div><h2>'+t+'</h2>'+(sub?'<p class="lede">'+sub+'</p>':'')}
function front(){return '<section class="hero"><div class="eyebrow">ANATOMY OF A LEGEND · 1890—1940</div><h1>PEAKY<br>BLINDERS.</h1><p>One city. Two histories. A fictional dynasty built upon a real criminal past—and the fractured century that made both possible.</p></section><div class="grid">'+card('01 / THE DRAMA','<p>Six seasons, 1919–1934. The Shelby family rises from street betting to industry and Parliament.</p>')+card('02 / THE HISTORY','<p>The real gang’s heyday was decades earlier, in the 1890s. The Shelbys never existed.</p>')+card('03 / THE CENTURY','<p>War, revolution, labor conflict, organized crime, economic collapse, and fascism.</p>')+'</div><section class="panel">'+heading('THE CENTRAL DISTINCTION','A true city. An invented dynasty.','Peaky Blinders is most revealing when we read it simultaneously as drama and as an interpretation of British history.')+'<div class="split"><div class="truth"><b>HISTORICALLY GROUNDED</b><p>Birmingham’s industrial landscape; street gangs; bookmakers; class conflict; the 1926 General Strike; Mosley and the rise of fascism.</p></div><div class="fiction"><b>DRAMATIC INVENTION</b><p>Tommy Shelby, the family empire, most intimate plots, and the gang’s post-1918 dominance.</p></div></div></section><section class="panel">'+heading('THE QUESTION','What is the show really about?')+'<p>Its machinery is not merely organized crime. It is the conversion of violence into legitimacy: street power becomes capital, capital becomes political access, and political access becomes another kind of violence. Yet the protagonist cannot convert success into peace.</p><p>The result is a drama about the limits of control, told through a city transforming under industrial modernity.</p></section>'}
function seasonView(){return '<section class="panel">'+heading('THE DRAMATIC RECORD','Six seasons of ascent and fracture','Select a season to open its dramatic and historical layers.')+'<div class="warning">Season descriptions contain broad plot developments. Turn on deeper spoilers for more detail.</div><p><label><input type="checkbox" id="spoiler" '+(spoilers?'checked':'')+'> Show extended analysis</label></p><div class="grid">'+seasons.map(s=>card('<span class="chip">SERIES '+s.n+' · '+s.y+'</span><br>'+s.title,'<p>'+s.story+'</p><div class="muted">HISTORY</div><p>'+s.history+'</p>'+(spoilers?'<div class="muted">READING</div><p>'+s.motif+'</p>':''))).join('')+'</div></section><section class="panel">'+heading('AFTER THE SERIES','The Immortal Man · 2026')+'<p>The film continues the fictional Shelby story into 1940, amid the Second World War. It was released on Netflix in March 2026. It is a continuation, not a seventh television season.</p><p><a target="_blank" rel="noopener" href="https://www.netflix.com/tudum/articles/peaky-blinders-the-immortal-man-release-date-photos-news">Official film dossier ↗</a></p></section>'}
function history(){return '<section class="panel">'+heading('FACT / FICTION','The gang behind the name','The central historical twist is that the real Peaky Blinders mostly belong to a different generation.')+'<div class="split"><div class="truth"><b>REAL · LATE 19TH CENTURY</b><p>Young working-class street gangs operated in Birmingham, especially around Small Heath and other districts. Violence, petty crime, gambling, and territorial identity figured in their reputation.</p></div><div class="fiction"><b>FICTION · AFTER 1918</b><p>The Shelby brothers return from the Great War and build a far-reaching criminal and commercial organization. This is Steven Knight’s invention, not a reconstruction of a documented family.</p></div></div>'+card('🧢 The razor-blade cap','<p>The peaked caps are historically plausible; sewn-in disposable razor blades are widely regarded as a doubtful legend. Historian Carl Chinn has noted that such blades were costly in the relevant era and difficult to wield effectively from soft caps. The series turns an uncertain tale into a visual signature.</p>')+card('🏇 Racecourse rackets','<p>Bookmaking, racecourse protection, and territorial disputes connect the fictional world to real criminal networks. Billy Kimber and Darby Sabini were historical figures, but the show rewrites their relationships and fates.</p>')+card('🏭 Industrial Birmingham','<p>Foundries, canals, factories, workshops, and crowded working-class neighborhoods supply more than scenery. They help explain the social environment in which labor organization, poverty, wealth, and street violence intersected.</p>')+card('⚒️ Labor and the General Strike','<p>The nationwide General Strike of May 1926 followed a conflict over coal-industry wages and conditions. Jessie Eden was a real Birmingham labor organizer; the show blends her historical identity with invented personal entanglements.</p>')+card('⚫ Fascism in the interwar years','<p>Oswald Mosley was a real politician who founded the British Union of Fascists in 1932. His appearances anchor the drama in a dangerous political movement, while the Shelby plot surrounding him remains fiction.</p>')+'</section>'}
function personView(){return '<section class="panel">'+heading('A CAST OF SHADOWS','Who existed?','Separate historical people from the fictional and loosely inspired figures who share their world.')+'<div class="filter">'+['all','Fictional','Historical','Inspired'].map(x=>'<button data-filter="'+x+'" class="'+(filter===x?'on':'')+'">'+(x==='all'?'ALL':x.toUpperCase())+'</button>').join('')+'</div><div class="grid">'+people.filter(p=>filter==='all'||p[1]===filter).map(p=>card(p[0]+'<br><span class="chip">'+p[1].toUpperCase()+'</span>','<p>'+p[2]+'</p>')).join('')+'</div></section>'}
function chronology(){return '<section class="panel">'+heading('THE DOUBLE CLOCK','History against fiction','Follow the documented world and the invented Shelby story as they intersect.')+'<div class="year" id="yearlabel">'+year+'</div><input type="range" min="1890" max="1940" value="'+year+'" id="years" aria-label="Timeline year"><div id="yeartext" class="notice"></div><div class="line">'+events.map(e=>'<div class="entry"><div class="eyebrow">'+e[0]+' · '+e[1]+'</div><h3>'+e[2]+'</h3></div>').join('')+'</div></section>'}
function themes(){return '<section class="panel">'+heading('THE ENGINE UNDER THE DRAMA','Five systems of power','An analytical reading of the show, rather than a claim about the creator’s singular intent.')+'<div class="grid">'+card('01 / TRAUMA','<p>War is not finished when soldiers return. Tommy and Arthur carry battlefield habits into domestic life, business, and intimacy.</p>')+card('02 / LEGITIMACY','<p>Criminal capital buys factories, status, and political influence. Respectability changes the costume of coercion.</p>')+card('03 / FAMILY','<p>Kinship is the enterprise’s core infrastructure—and its greatest vulnerability. Loyalty can function as both love and captivity.</p>')+card('04 / CLASS','<p>The ascent from Small Heath to elite society reveals how much power depends on birth, education, property, and access.</p>')+card('05 / HISTORY','<p>Major events are not just background. Each historical turn changes what the family can exploit and what threatens it.</p>')+card('06 / STYLE','<p>Contemporary music, extreme tailoring, smoke, and choreographed violence turn period drama into myth. The look is deliberately not a neutral documentary.</p>')+'</div></section><section class="panel">'+heading('A THOUGHT EXPERIMENT','Remove Tommy Shelby.')+'<p>What remains? A city, an industrial economy, rival bookmakers, veterans, trade unionists, police, class hierarchy, and fascist politics. That historical world is the show’s real skeleton. Tommy is the fictional instrument used to move through it.</p><p>Now remove Birmingham and history instead. What remains is a compelling but much less distinctive gangster story.</p></section>'}
function quizView(){let q=quiz[qi];return '<section class="panel">'+heading('THE ARCHIVIST’S EXAM','Distinguish the record from the legend','Six questions. No wagering with the family.')+'<div class="muted">QUESTION '+(qi+1)+' / '+quiz.length+' · SCORE '+score+'</div><div class="question">'+q[0]+'</div><div class="filter">'+q[1].map((a,i)=>'<button data-answer="'+i+'" '+(answered?'disabled':'')+'>'+E(a)+'</button>').join('')+'</div><div id="feedback"></div><div style="margin-top:15px">'+(answered?'<button data-next>Next question →</button>':'')+'</div></section>'}
function sourceView(){return '<section class="panel">'+heading('THE ARCHIVE','Sources and further reading','Editorial starting points, with direct links so every historical claim can be pursued beyond this dossier.')+sources.map((s,i)=>'<div class="source"><b>'+(i+1)+'. <a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+' ↗</a></b><br><span class="muted">'+s[2]+'</span></div>').join('')+'<div class="warning" style="margin-top:15px">Editorial note: the show’s chronology, especially transitional dates within seasons, is sometimes summarized differently across sources. This dossier uses approximate narrative periods and distinguishes them from dated historical events. Historical characters’ screen interactions are not evidence of actual meetings.</div></section>'}
function render(){nav.innerHTML=sections.map(([id,t])=>'<button data-nav="'+id+'" class="'+(id===current?'on':'')+'">'+t+'</button>').join('');root.innerHTML=({front, seasons:seasonView,history,people:personView,chronology,themes,quiz:quizView,sources:sourceView})[current]();if(current==='chronology')updateYear();window.scrollTo({top:0,behavior:'instant'})}
function updateYear(){let a=events.filter(e=>e[0]<=year).slice(-1)[0];document.getElementById('yearlabel').textContent=year;document.getElementById('yeartext').textContent=a?a[0]+' · '+a[2]:'Before the dossier begins.'}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){current=b.dataset.nav;render()}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.answer!==undefined&&!answered){answered=true;let i=+b.dataset.answer,q=quiz[qi],good=i===q[2];if(good)score++;document.getElementById('feedback').innerHTML='<div class="answer"><b>'+(good?'CORRECT.':'NOT QUITE.')+'</b><p>'+q[3]+'</p></div>';let next=document.createElement('button');next.dataset.next='';next.textContent=qi===quiz.length-1?'Final result →':'Next question →';document.getElementById('feedback').appendChild(next);root.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true)}if(b.hasAttribute('data-next')){if(qi===quiz.length-1){root.innerHTML='<section class="panel"><div class="eyebrow">EXAM COMPLETE</div><h2>'+score+' / '+quiz.length+'</h2><p>'+(score===6?'The archives acknowledge your mastery.':'History is always more complicated than the legend.')+'</p><button id="again">Try again</button></section>'}else{qi++;answered=false;render()}}if(b.id==='again'){qi=0;score=0;answered=false;render()}});
document.addEventListener('change',e=>{if(e.target.id==='spoiler'){spoilers=e.target.checked;render()}});document.addEventListener('input',e=>{if(e.target.id==='years'){year=+e.target.value;updateYear()}});render()})();
