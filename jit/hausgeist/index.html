0,1fr) 290px;gap:40px}.prose{max-width:700px;font:17px/1.85 Georgia,serif;color:#4d493f}.dataGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0}.metric{padding:19px;border:1px solid var(--line)}.metric b{display:block;font:normal 27px Georgia,serif}.metric span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#777267}.panel{background:#ece8df;padding:24px;margin-bottom:16px}.panel h3{font:normal 25px Georgia,serif;margin:4px 0 10px}.panel p{font-size:12px;color:#666258}.panel button{width:100%;margin-top:12px}.notice{padding:15px;border-left:2px solid var(--red);background:#efe9e4;margin:18px 0;font-size:12px}.record{padding:19px 0;border-bottom:1px solid var(--line);cursor:pointer}.record .date{font-size:10px;letter-spacing:.14em;color:var(--red)}.record h3{font:normal 23px Georgia,serif;margin:7px 0}.record p{font-size:13px;color:#777267;margin:0}.article{max-width:780px;margin:30px auto}.article h1{font:normal clamp(35px,6vw,64px)/1.1 Georgia,serif}.article .body{font:18px/1.9 Georgia,serif}.plan{background:#e6e0d4;padding:25px;margin:18px 0}.plan svg{width:100%;max-width:660px;display:block;margin:auto}.plan rect{fill:#f7f4ed;stroke:#746c60;stroke-width:2}.plan text{font:12px system-ui;fill:#5c554c;text-anchor:middle;pointer-events:none}.plan g{cursor:pointer}.plan g:hover rect{fill:#e8dbd1}.plan .extra rect{fill:#e9e0d7;stroke:var(--red)}.compare{overflow-x:auto}.compare table{border-collapse:collapse;width:100%;min-width:580px}.compare th,.compare td{padding:16px;text-align:left;border-bottom:1px solid var(--line);font-weight:400}.compare th{font-family:Georgia,serif;font-size:20px}.msg{padding:13px 17px;margin:12px 0;max-width:90%;background:#e8e4db}.msg.me{margin-left:auto;background:#ddd5c9}.choices{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.choices button{border:1px solid #c9c1b4;background:none;padding:10px 12px;font-size:12px}.footer{padding:50px 0 10px;margin-top:60px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#777267;font-size:11px}.empty{padding:50px 0;color:#777267}.fade{animation:fade .35s ease}@keyframes fade{from{opacity:.55}to{opacity:1}}@media(max-width:800px){.head{min-height:64px;padding:10px 15px;flex-wrap:wrap;gap:9px}.brand{font-size:25px}.nav{gap:12px}.nav button{font-size:9px}.shell{padding:0 14px 65px}.hero{grid-template-columns:1fr;margin-top:14px}.heroImage{min-height:230px;order:-1}.heroCopy{padding:27px}.hero h1{font-size:39px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile .photo{height:190px}.tile h3{font-size:20px}.detailHero{height:270px}.cols{grid-template-columns:1fr}.detailTop{flex-wrap:wrap}.dataGrid{gap:6px}.metric{padding:12px}.metric b{font-size:21px}.tabs{gap:18px}.footer{flex-wrap:wrap}}@media(max-width:470px){.grid{grid-template-columns:1fr}.tile .photo{height:250px}.nav{width:100%;justify-content:space-between}.detailHero{height:225px}.detailHero .side{display:none}.detailHero{grid-template-columns:1fr}.dataGrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class="head"><div class="brand" id="home">HAUSGEIST<small>EXCEPTIONAL PROPERTIES · PERSISTENT HISTORIES</small></div><nav class="nav"><button data-route="discover">Properties</button><button data-route="saved">Saved</button><button data-route="compare">Compare</button><button data-route="records">Journal</button></nav></div></header><main id="app" class="shell"></main><script>
(function(){'use strict';
const IMG='https://images.unsplash.com/';
const houses=[
{id:'ashcroft',name:'The Ashcroft Residence',city:'Pittsburgh, Pennsylvania',price:1285000,beds:4,baths:3.5,area:3820,tag:'SIGNATURE COLLECTION',img:'photo-1600596542815-ffad4c1539a9',alt:'photo-1600607687920-4e2a09cf159d',type:'estate',anomaly:'Occupancy discrepancy',hint:'A fifth bedroom is included in the current appraisal. Its location is subject to confirmation.',intro:'A distinguished stone residence with generous formal rooms, restored millwork and established gardens. A rare opportunity to steward an extraordinary architectural legacy.',case:'The additional bedroom appears in successive surveys without a corresponding construction permit.',agent:'Eleanor Vale',room:'North bedroom',origin:1978},
{id:'mercer',name:'The Mercer House',city:'Philadelphia, Pennsylvania',price:895000,beds:4,baths:2,area:2640,tag:'PRIVATE OFFERING',img:'photo-1600566753190-17f0baa2a6c3',alt:'photo-1600210492486-724fe5c67fb0',type:'townhouse',anomaly:'Lower-level survey pending',hint:'The lower level extends beyond the surveyed parcel. Adjacent ownership is not established.',intro:'A carefully appointed city residence with tall windows, graceful proportions and original hardwood floors. The finished lower level is exceptionally spacious.',case:'Basement dimensions exceed the exterior building footprint.',agent:'Julian March',room:'Lower gallery',origin:1962},
{id:'bellwether',name:'Bellwether Hall',city:'Hudson, New York',price:2175000,beds:6,baths:4,area:5180,tag:'COUNTRY ESTATES',img:'photo-1600607687939-ce8a6c25118c',alt:'photo-1600607687920-4e2a09cf159d',type:'estate',anomaly:'Daylight variance',hint:'Sunlight does not consistently enter the west conservatory during scheduled viewing hours.',intro:'An elegant country estate with a glass conservatory, mature grounds and a remarkable succession of beautifully proportioned reception rooms.',case:'The conservatory has experienced several intervals of unrecorded darkness.',agent:'Eleanor Vale',room:'West conservatory',origin:1931},
{id:'harrow',name:'Harrow & Finch',city:'Providence, Rhode Island',price:742000,beds:3,baths:2.5,area:2290,tag:'ARCHITECTURAL HERITAGE',img:'photo-1600585154340-be6161a56a0c',alt:'photo-1600607688969-a5bfcd646154',type:'townhouse',anomaly:'Historic occupancy unresolved',hint:'A former resident continues to appear in the current property census.',intro:'A beautifully preserved period house with a private garden and refined contemporary upgrades, located on a quiet residential street.',case:'A census entry has remained active for ninety-three years.',agent:'Julian March',room:'Upper landing',origin:1933},
{id:'glassmere',name:'Glassmere House',city:'Portland, Maine',price:1120000,beds:4,baths:3,area:3160,tag:'WATERFRONT COLLECTION',img:'photo-1600566753086-00f18fb6b3ea',alt:'photo-1600566752355-35792bedcfea',type:'estate',anomaly:'Hydrological review',hint:'Water is periodically observed ascending the interior stairwell.',intro:'A luminous coastal residence with panoramic views, natural stone finishes and serene spaces designed for effortless year-round living.',case:'The stairwell exhibits water movement inconsistent with the surrounding grade.',agent:'Eleanor Vale',room:'East stair',origin:2004},
{id:'morrow',name:'Morrow Court',city:'Savannah, Georgia',price:1635000,beds:5,baths:4,area:4410,tag:'DISTINGUISHED HOMES',img:'photo-1600607687644-c7171b42498f',alt:'photo-1600566753051-f0b89df2dd90',type:'estate',anomaly:'Interior access review',hint:'Two doorways currently share a destination that is not represented on either floor plan.',intro:'A gracious residence combining generous living spaces, secluded courtyards and meticulous restoration of its historic interior.',case:'Interior doors have been documented opening into rooms at other listed properties.',agent:'Julian March',room:'Drawing room',origin:1896}
];
const archive=[
{id:'ash-1978',house:'ashcroft',date:'17 NOVEMBER 1978',paper:'THE ALDER REGISTER',title:'Renovation Crew Reports Sealed Room Behind North Wall',summary:'Contractors halted work following an unexpected discovery.',body:['A routine renovation at the Ashcroft residence was interrupted after workers reported an additional room beyond the north bedroom wall.','The room was described as furnished, dry, and apparently occupied despite the absence of any access from the surrounding hallway.','Municipal surveyors have requested the original plans. The owners declined to comment on the discrepancy.']},
{id:'ash-1982',house:'ashcroft',date:'09 APRIL 1982',paper:'MUNICIPAL SURVEY OFFICE',title:'Supplemental Survey Finds No Fifth Bedroom',summary:'Inspection contradicts earlier reports.',body:['A supplemental inspection has found no evidence of the room described in the 1978 renovation report.','The property is confirmed to contain four bedrooms. The north wall appears original and undisturbed.','A second inspection is not recommended.']},
{id:'mercer-1962',house:'mercer',date:'02 MAY 1962',paper:'THE CITY LEDGER',title:'Surveyors Unable to Establish Basement Boundary',summary:'A lower-level extension raises ownership questions.',body:['A residential survey has found that the Mercer property extends an estimated forty-seven feet beyond the mapped parcel.','Investigators were unable to identify an exterior entrance to the additional space. The basement remains accessible from the interior.','The neighboring property owner reports no corresponding encroachment.']},
{id:'bell-1931',house:'bellwether',date:'13 AUGUST 1931',paper:'HUDSON EVENING JOURNAL',title:'Conservatory Remains Dark During Solar Noon',summary:'Witnesses describe a temporary loss of daylight.',body:['Visitors to Bellwether Hall reported that the west conservatory remained in complete darkness despite clear skies at midday.','Photographs taken from outside the room show normal daylight through the same windows.','The owners have postponed afternoon receptions pending further assessment.']},
{id:'harrow-1933',house:'harrow',date:'26 OCTOBER 1933',paper:'PROVIDENCE CIVIC RECORD',title:'Resident Declared Absent, Census Entry Persists',summary:'Records continue to list a woman who has not been seen for decades.',body:['The household census continues to record Miss Ada Finch as resident despite her reported disappearance earlier this year.','Multiple attempts to amend the record have been reversed without an identifiable filing.','The upper landing remains listed as an occupied room.']},
{id:'glass-2004',house:'glassmere',date:'08 JANUARY 2004',paper:'COASTAL INSPECTION REVIEW',title:'Water Ascends Stairwell During Routine Assessment',summary:'An unusual drainage event is documented.',body:['An inspector recorded a continuous stream of water flowing upward along the eastern staircase.','Samples taken from the upper landing were consistent with seawater. The property stands above the floodplain.','The event ended when the inspector stepped outside.']},
{id:'morrow-1896',house:'morrow',date:'21 SEPTEMBER 1896',paper:'SAVANNAH EVENING DISPATCH',title:'Drawing Room Door Opens Onto Distant Residence',summary:'An interior passage is closed after a peculiar incident.',body:['Guests at Morrow Court reported that a drawing room door opened onto a furnished chamber bearing no resemblance to the adjoining rooms.','A letter recovered from the chamber carried a Pittsburgh postmark dated seventy years in the future.','The doorway was subsequently sealed. Its location has since been disputed.']}
];
const $=s=>document.querySelector(s),app=$('#app'),key='hausgeist-world-v1';
let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||!state.cases)state={cases:{},saved:[],compare:[],seen:{},events:[],messages:{},visits:{},filters:{q:'',kind:'all'},version:1};
for(const h of houses)if(!state.cases[h.id])state.cases[h.id]={rev:0,rooms:0,area:0,occupants:0,observed:0};
let route='discover',selected=null,tab='overview',observer=null,modalRecord=null;
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function photo(id,w=1200){return IMG+id+'?auto=format&fit=crop&w='+w+'&q=80'}
function house(id){return houses.find(h=>h.id===id)}
function current(h){const c=state.cases[h.id];return{beds:h.beds+c.rooms,area:h.area+c.area,baths:h.baths,price:h.price,rev:c.rev,occupants:c.occupants}}
function money(n){return '$'+n.toLocaleString('en-US')}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function routeTo(r,id,sub){leave();route=r;selected=id||null;tab=sub||'overview';render();window.scrollTo(0,0)}
function leave(){if(observer){observer.disconnect();observer=null}if(route==='property'&&selected){const c=state.cases[selected];c.observed++;state.seen[selected]=true;state.visits[selected]=(state.visits[selected]||0)+1;persist()}}
function mutate(h,source){const c=state.cases[h.id];if(c.observed<1)return;const count=state.visits[h.id]||0;if(count%2!==0)return;if(c.rev>=4)return;c.rev++;if(h.id==='ashcroft'||h.id==='morrow'){c.rooms++;c.area+=218;c.occupants=1}else if(h.id==='mercer'){c.area+=347;c.occupants=1}else if(h.id==='bellwether'){c.area+=72}else if(h.id==='harrow'){c.occupants++;c.rooms+=1;c.area+=110}else if(h.id==='glassmere'){c.area+=86;c.occupants=1}state.events.unshift({id:h.id,rev:c.rev,source,at:Date.now()});if(state.events.length>30)state.events.pop();persist()}
function observe(){if(!('IntersectionObserver'in window))return;observer=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting&&e.intersectionRatio>.45){const k=e.target.dataset.evidence;if(k&&!state.seen[k]){state.seen[k]=true;persist()}}}},{threshold:[.45]});document.querySelectorAll('[data-evidence]').forEach(el=>observer.observe(el))}
function card(h){const c=current(h),saved=state.saved.includes(h.id);return '<article class="tile" data-open="'+h.id+'"><div class="photo" style="background-image:url('+photo(h.img,900)+')"><span class="tag">'+h.tag+'</span><button class="heart" data-save="'+h.id+'" aria-label="Save property">'+(saved?'♥':'♡')+'</button></div><h3>'+h.name+'</h3><div class="loc">'+h.city+'</div><div class="price">'+money(c.price)+'</div><div class="facts">'+c.beds+' bedrooms · '+c.baths+' baths · '+c.area.toLocaleString()+' sq ft</div><div class="anomaly">PROPERTY REVIEW · '+h.anomaly+(c.rev?' · UPDATED':'')+'</div></article>'}
function footer(){return '<footer class="footer"><span>HAUSGEIST · EXCEPTIONAL PROPERTIES · PERSISTENT HISTORIES</span><span>Private collection · Case records maintained independently</span></footer>'}
function discover(){const q=state.filters.q.toLowerCase(),kind=state.filters.kind;const list=houses.filter(h=>(h.name+' '+h.city).toLowerCase().includes(q)&&(kind==='all'||h.type===kind));return '<section class="hero"><div class="heroCopy"><div class="eyebrow">The art of extraordinary living</div><h1>A home is never just a place.</h1><p>Explore a curated portfolio of exceptional residences, each with its own distinct character and documented history.</p><button class="solid" data-scroll="collection" style="align-self:flex-start;margin-top:15px">Explore the collection</button></div><div class="heroImage" style="background-image:url('+photo('photo-1600596542815-ffad4c1539a9')+')"></div></section><div class="eyebrow">Private property search</div><div class="filter"><input id="search" placeholder="Search by property or location" value="'+escape(state.filters.q)+'"><select id="kind"><option value="all">All residences</option><option value="estate" '+(kind==='estate'?'selected':'')+'>Estates</option><option value="townhouse" '+(kind==='townhouse'?'selected':'')+'>Townhouses</option></select><button id="searchGo">Search properties</button></div><section id="collection"><div class="sectionHead"><h2>Selected residences</h2><span class="subtle">'+list.length+' exceptional properties</span></div><div class="grid">'+list.map(card).join('')+'</div></section>'+footer()}
function detail(h){const c=current(h);return '<button class="back" data-route="discover">← All properties</button><div class="detailHero"><div class="big" style="background-image:url('+photo(h.img)+')"></div><div class="side"><div class="small" style="background-image:url('+photo(h.alt,700)+')"></div><div class="small" style="background-image:url('+photo('photo-1600210492486-724fe5c67fb0',700)+')"></div></div></div><div class="detailTop"><div><div class="eyebrow">'+h.tag+'</div><h1>'+h.name+'</h1><div class="subtle">'+h.city+' · Property HG-'+String(houses.indexOf(h)+41).padStart(4,'0')+'</div></div><div><div class="price">'+money(c.price)+'</div><button class="quiet" data-save="'+h.id+'">'+(state.saved.includes(h.id)?'♥ Saved':'♡ Save residence')+'</button><button class="quiet" data-compare="'+h.id+'">'+(state.compare.includes(h.id)?'✓ Comparing':'+ Compare')+'</button></div></div><div class="dataGrid" data-evidence="facts-'+h.id+'"><div class="metric"><b>'+c.beds+'</b><span>Bedrooms</span></div><div class="metric"><b>'+c.baths+'</b><span>Bathrooms</span></div><div class="metric"><b>'+c.area.toLocaleString()+'</b><span>Square feet</span></div></div><div class="tabs">'+['overview','floor plan','history','records','inquiries'].map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'selected':'')+'">'+t.toUpperCase()+'</button>').join('')+'</div><div class="cols"><div class="fade">'+tabContent(h)+'</div><aside><div class="panel"><div class="eyebrow">Private client services</div><h3>'+h.agent+'</h3><p>Property advisor · HAUSGEIST</p><p>Our team is available to discuss the residence, its history and current conditions.</p><button class="solid" data-tab="inquiries">Contact advisor</button></div><div class="panel"><div class="eyebrow">Property condition</div><h3>Additional review</h3><p>'+h.hint+'</p><button class="quiet" data-tab="records">View records →</button></div></aside></div>'+footer()}
function tabContent(h){const c=current(h);if(tab==='overview')return '<div class="eyebrow">The residence</div><p class="prose">'+h.intro+'</p><div class="notice" data-evidence="disclosure-'+h.id+'"><b>Additional property disclosure</b><p>'+h.hint+'</p><p>Current review HG-'+String(houses.indexOf(h)+41).padStart(4,'0')+' · Revision '+String(c.rev+1).padStart(2,'0')+'</p></div><h2 class="pageTitle" style="font-size:32px">Property particulars</h2><div class="dataGrid"><div class="metric"><b>'+c.occupants+'</b><span>Unregistered occupancy</span></div><div class="metric"><b>'+c.rev+'</b><span>Survey amendments</span></div><div class="metric"><b>'+h.origin+'</b><span>Earliest case record</span></div></div><p class="subtle">Underlying property inventory is a fictional demonstration collection. Anomaly records are part of the Hausgeist case archive.</p>';
if(tab==='floor plan')return '<div class="eyebrow">Architectural documentation</div><h2 class="pageTitle" style="font-size:34px">Current floor plan</h2><p class="subtle">Select a room to inspect its description. Dimensions reflect the most recent internal survey.</p><div class="plan" data-evidence="plan-'+h.id+'"><svg viewBox="0 0 620 360" role="img" aria-label="Interactive floor plan"><g data-room="Entrance hall"><rect x="12" y="12" width="175" height="160"/><text x="99" y="95">ENTRANCE HALL</text></g><g data-room="Drawing room"><rect x="191" y="12" width="228" height="160"/><text x="305" y="95">DRAWING ROOM</text></g><g data-room="Kitchen"><rect x="423" y="12" width="185" height="160"/><text x="515" y="95">KITCHEN</text></g><g data-room="Primary suite"><rect x="12" y="176" width="244" height="172"/><text x="134" y="263">PRIMARY SUITE</text></g><g data-room="'+h.room+'"><rect x="260" y="176" width="174" height="172"/><text x="347" y="263">'+h.room.toUpperCase()+'</text></g>'+(c.rev?'<g class="extra" data-room="Unrecorded room"><rect x="438" y="176" width="170" height="172"/><text x="523" y="253">ROOM '+(c.beds)+'</text><text x="523" y="273">SURVEY PENDING</text></g>':'<g data-room="Utility"><rect x="438" y="176" width="170" height="172"/><text x="523" y="263">UTILITY</text></g>')+'</svg></div><div class="notice" id="roomInfo">Select a room for details.</div><p class="subtle">Plan revision '+(c.rev+1)+' · Gross interior area '+c.area.toLocaleString()+' sq ft</p>';
if(tab==='history')return '<div class="eyebrow">Provenance</div><h2 class="pageTitle" style="font-size:34px">Property history</h2>'+archive.filter(a=>a.house===h.id).map(record).join('')+'<div class="record"><div class="date">CURRENT SURVEY · REVISION '+(c.rev+1)+'</div><h3>Recorded interior area: '+c.area.toLocaleString()+' sq ft</h3><p>Updated from latest available documentation.</p></div>';
if(tab==='records')return '<div class="eyebrow">The case archive</div><h2 class="pageTitle" style="font-size:34px">Records & correspondence</h2>'+archive.filter(a=>a.house===h.id).map(record).join('')+'<div class="notice"><b>Current disclosure</b><p>'+h.hint+'</p><p>'+h.case+'</p></div>';
return '<div class="eyebrow">Private correspondence</div><h2 class="pageTitle" style="font-size:34px">Contact '+h.agent+'</h2><p class="subtle">Our advisors are familiar with the circumstances of each residence.</p><div id="messages">'+(state.messages[h.id]||[{who:'agent',text:'Welcome to HAUSGEIST. How may I assist with your interest in '+h.name+'?'}]).map(m=>'<div class="msg '+(m.who==='me'?'me':'')+'">'+escape(m.text)+'</div>').join('')+'</div><div class="choices">'+['Is the property occupied?','Can I see the floor plan?','What happened here?','Schedule a viewing'].map(q=>'<button data-ask="'+escape(q)+'">'+q+'</button>').join('')+'</div>'}
function record(a){return '<article class="record" data-article="'+a.id+'"><div class="date">'+a.paper+' · '+a.date+'</div><h3>'+a.title+'</h3><p>'+a.summary+'</p></article>'}
function article(a){const h=house(a.house),related=archive.filter(b=>b.id!==a.id&&(b.house===a.house||b.house==='morrow')).slice(0,3);return '<button class="back" data-route="records">← Records archive</button><article class="article"><div class="eyebrow">'+a.paper+' · ARCHIVE</div><h1>'+a.title+'</h1><div class="subtle">'+a.date+' · Case HG-'+String(houses.indexOf(h)+41).padStart(4,'0')+'</div><hr style="border:0;border-top:1px solid var(--line);margin:30px 0"><div class="body">'+a.body.map(p=>'<p>'+p+'</p>').join('')+'</div><div class="notice">Filed in connection with <a href="#property/'+h.id+'" data-link-house="'+h.id+'">'+h.name+'</a>. Case materials are maintained in the Hausgeist archive.</div><h2 class="pageTitle" style="font-size:31px">Related records</h2>'+related.map(record).join('')+'</article>'+footer()}
function records(){return '<button class="back" data-route="discover">← Properties</button><div class="eyebrow">Research & provenance</div><h1 class="pageTitle">The Hausgeist Journal</h1><p class="prose">A living record of architecture, occupancy, preservation and exceptional circumstances.</p>'+archive.map(record).join('')+footer()}
function saved(){const list=houses.filter(h=>state.saved.includes(h.id));return '<button class="back" data-route="discover">← Properties</button><div class="eyebrow">Your collection</div><h1 class="pageTitle">Saved residences</h1>'+(list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<p class="empty">Your private collection is awaiting its first residence.</p>')+footer()}
function compare(){const list=houses.filter(h=>state.compare.includes(h.id));return '<button class="back" data-route="discover">← Properties</button><div class="eyebrow">Private comparison</div><h1 class="pageTitle">Compare residences</h1>'+(list.length?'<div class="compare"><table><tr><th>Property</th>'+list.map(h=>'<th><a href="#property/'+h.id+'" data-link-house="'+h.id+'">'+h.name+'</a></th>').join('')+'</tr>'+[['Asking price',h=>money(h.price)],['Bedrooms',h=>current(h).beds],['Interior area',h=>current(h).area.toLocaleString()+' sq ft'],['Unregistered occupants',h=>current(h).occupants],['Current survey revision',h=>current(h).rev+1],['Condition',h=>h.anomaly]].map(([label,fn])=>'<tr><td>'+label+'</td>'+list.map(h=>'<td>'+fn(h)+'</td>').join('')+'</tr>').join('')+'</table></div>':'<p class="empty">Select Compare on individual property pages to build a private comparison.</p>')+footer()}
function render(){app.innerHTML=route==='discover'?discover():route==='property'?detail(house(selected)):route==='article'?article(archive.find(a=>a.id===selected)):route==='records'?records():route==='saved'?saved():compare();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===route));observe()}
function ask(q){const h=house(selected),c=current(h);const answers={'Is the property occupied?':c.occupants?'The latest occupancy review indicates '+c.occupants+' additional resident. No corresponding tenancy documentation has been located.':'There is no registered tenancy at present. Historical occupancy records are available on request.','Can I see the floor plan?':'Certainly. The most recent survey reflects '+c.beds+' bedrooms and '+c.area.toLocaleString()+' square feet. Earlier plans may differ.','What happened here?':h.case+' We recommend reviewing the attached historical records before your visit.','Schedule a viewing':'I would be delighted to arrange a private viewing. Daylight appointments are recommended, subject to the residence’s availability.'};const messages=state.messages[h.id]||(state.messages[h.id]=[{who:'agent',text:'Welcome to HAUSGEIST. How may I assist with your interest in '+h.name+'?'}]);messages.push({who:'me',text:q},{who:'agent',text:answers[q]});persist();render()}
document.addEventListener('click',e=>{const target=e.target.closest('button,[data-open],[data-article],[data-room],[data-link-house]');if(!target)return;
if(target.dataset.save){e.stopPropagation();const id=target.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];persist();render();return}
if(target.dataset.compare){const id=target.dataset.compare;state.compare=state.compare.includes(id)?state.compare.filter(x=>x!==id):[...state.compare,id];persist();render();return}
if(target.dataset.open){const id=target.dataset.open;mutate(house(id),'return');routeTo('property',id);return}
if(target.dataset.linkHouse){e.preventDefault();mutate(house(target.dataset.linkHouse),'record-return');routeTo('property',target.dataset.linkHouse);return}
if(target.dataset.article){routeTo('article',target.dataset.article);return}
if(target.dataset.route){routeTo(target.dataset.route);return}
if(target.dataset.tab){tab=target.dataset.tab;render();return}
if(target.dataset.room){$('#roomInfo').textContent=target.dataset.room==='Unrecorded room'?'Room included in the latest survey. Access arrangements have not been confirmed.':target.dataset.room+' · Included in current architectural schedule.';return}
if(target.dataset.ask){ask(target.dataset.ask);return}
if(target.dataset.scroll){$('#'+target.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}
if(target.id==='searchGo'){state.filters.q=$('#search').value;state.filters.kind=$('#kind').value;persist();render();return}
});
document.addEventListener('change',e=>{if(e.target.id==='kind'){state.filters.kind=e.target.value;persist();render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='search'&&e.key==='Enter'){state.filters.q=e.target.value;persist();render()}});
$('#home').onclick=()=>routeTo('discover');
window.addEventListener('pagehide',leave);
render();
})();
</script></body></html>
