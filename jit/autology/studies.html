<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autology · Studies</title><style>*{box-sizing:border-box}body{margin:0;background:#10151b;color:#e1ece6;font:14px system-ui,sans-serif}main{max-width:880px;margin:auto;padding:20px 14px}h1{font:normal 32px Georgia,serif;margin:0}p{color:#a4b5b0}nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}button,a.chip{border:1px solid #435d53;background:#192c27;color:#dce9e3;border-radius:8px;padding:11px 13px;font:inherit;cursor:pointer;text-decoration:none}button.active{background:#dce9e3;color:#102019}canvas{width:100%;height:430px;border:1px solid #33453f;border-radius:12px;display:block;touch-action:manipulation}.bar{display:flex;align-items:center;gap:10px;margin:12px 0;flex-wrap:wrap}#status{margin-left:auto;color:#9fb2ac;font:12px monospace}#hint{min-height:40px}</style></head><body><main><h1>Autology</h1><p>Language made physical · five independent studies</p><nav id="bank"><a class="chip" href="./">DECAY ↗</a><button data-mode="fracture">FRACTURE</button><button data-mode="melt">MELT</button><button data-mode="erode">ERODE</button><button data-mode="unravel">UNRAVEL</button><button data-mode="bloom">BLOOM</button></nav><canvas id="c"></canvas><div class="bar"><button id="go">Begin</button><button id="reset">Reset</button><span id="status"></span></div><p id="hint"></p></main><script>
(()=>{'use strict';const c=document.querySelector('#c'),ctx=c.getContext('2d'),status=document.querySelector('#status'),hint=document.querySelector('#hint'),go=document.querySelector('#go');let mode='fracture',W=0,H=430,dpr=1,off,og,ink=[],parts=[],shards=[],threads=[],branches=[],running=false,start=0,prev=0,raf=0,seed=1,fontSize=110,baseY=225,originX=0;const names={fracture:'Brittle ceramic: cracks propagate, then the glyphs break into rigid shards.',melt:'Ink liquefies from the top, gathering into viscous drops under gravity.',erode:'Wind strips grains from exposed ink; the surviving letters remain precise.',unravel:'A filament pulls free from the letterforms, tracing a continuous wandering thread.',bloom:'Veins colonize the glyphs, then branch outward into living flowers.'};function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function r(a,b){return a+(b-a)*random()}function size(){W=Math.max(280,c.getBoundingClientRect().width);dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}function setup(){cancelAnimationFrame(raf);seed=2191;size();running=false;start=0;prev=0;parts=[];shards=[];threads=[];branches=[];off=document.createElement('canvas');off.width=Math.ceil(W);off.height=H;og=off.getContext('2d',{willReadFrequently:true});const word=mode;let f=Math.min(126,(W-34)/(word.length*.67));fontSize=f;og.font=f+'px Georgia';og.textAlign='center';og.textBaseline='middle';originX=W/2;baseY=H*.43;og.fillStyle='#dce9e3';og.fillText(word,originX,baseY);const data=og.getImageData(0,0,off.width,H).data;ink=[];for(let y=50;y<H-40;y+=3)for(let x=10;x<W-10;x+=3)if(data[(y*off.width+x)*4+3]>128)ink.push({x,y});if(mode==='fracture'){for(let i=0;i<ink.length;i+=12){let p=ink[i];shards.push({x:p.x,y:p.y,dx:0,dy:0,vx:r(-2,2),vy:r(-3,-.4),angle:0,spin:r(-.07,.07),radius:r(7,17),delay:r(.15,.95)})}}else if(mode==='unravel'){for(let i=0;i<ink.length;i+=7){let p=ink[i];threads.push({x:p.x,y:p.y,phase:r(0,6.28),order:i/ink.length})}threads.sort((a,b)=>a.x-b.x||b.y-a.y)}else if(mode==='bloom'){for(let i=0;i<36;i++){let p=ink[Math.floor(random()*ink.length)];if(p)branches.push({x:p.x,y:p.y,angle:r(-2.8,-.3),length:r(18,65),phase:r(.1,.85),flower:random()>.35})}}else{for(let i=0;i<ink.length;i+=mode==='melt'?2:1){let p=ink[i];parts.push({x:p.x,y:p.y,ox:p.x,oy:p.y,vx:0,vy:0,delay:mode==='melt'?(p.y-85)/200+r(-.12,.12):r(.02,.98),radius:mode==='melt'?r(1.7,3.2):r(.7,1.5)})}}go.textContent='Begin';status.textContent=ink.length+' ink samples';hint.textContent=names[mode];document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));draw(0)}function glyph(alpha=1){ctx.globalAlpha=alpha;ctx.drawImage(off,0,0);ctx.globalAlpha=1}function disk(x,y,rad,col='#dce9e3'){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill()}function draw(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='#10151b';ctx.fillRect(0,0,W,H);if(!running){glyph();return}if(mode==='fracture'){// Intact glyphs remain visible until cracks and fragment release.
let breakAt=.33;glyph(t<breakAt?1:Math.max(0,1-(t-breakAt)*5));ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();for(const s of shards){if(t<s.delay*.55)continue;const dt=Math.max(0,t-s.delay*.55);s.dx+=s.vx*(.35+dt);s.dy+=s.vy+dt*2.7;s.angle+=s.spin;const x=s.x+s.dx,y=Math.min(H-12,s.y+s.dy);ctx.save();ctx.translate(x,y);ctx.rotate(s.angle);ctx.fillStyle='#dce9e3';ctx.beginPath();ctx.moveTo(-s.radius*.7,-s.radius*.6);ctx.lineTo(s.radius*.9,-s.radius*.45);ctx.lineTo(s.radius*.45,s.radius*.9);ctx.lineTo(-s.radius*.8,s.radius*.3);ctx.closePath();ctx.fill();ctx.restore()}ctx.restore();if(t<.5){ctx.strokeStyle='#10151b';ctx.lineWidth=1.7;for(let i=0;i<22;i++){let x=W*.2+i*W*.027,y=baseY-55+Math.sin(i*2.7)*32;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+14,y+14);ctx.stroke()}}}else if(mode==='melt'||mode==='erode'){// Preserve unreleased glyph raster with a moving pixel mask.
const cut=mode==='melt'?Math.max(0,baseY-85+t*145):W*(1-Math.min(1,t*.65));ctx.save();ctx.beginPath();if(mode==='melt')ctx.rect(0,cut,W,H-cut);else ctx.rect(0,0,cut,H);ctx.clip();glyph();ctx.restore();const dt=Math.min(.04,(performance.now()-prev)/1000||.016);for(const p of parts){const released=mode==='melt'?p.oy<cut:p.ox>cut;if(!released)continue;if(mode==='melt'){p.vy+=.22;p.vx+=(W/2-p.x)*.00013;p.vx*=.985;p.vy*=.99}else{p.vx+=.035;p.vy+=.016+Math.sin(p.x*.07)*.006;p.vx*=.994}p.x+=p.vx;p.y+=p.vy;if(p.y>H-9){p.y=H-9;p.vy*=-.22;p.vx*=.87}if(p.x>W-6){p.x=W-6;p.vx*=-.25}disk(p.x,p.y,p.radius,mode==='melt'?'#c3d9ce':'#dce9e3')}if(mode==='melt'){ctx.strokeStyle='#8fa99d';ctx.beginPath();ctx.moveTo(0,H-5);ctx.lineTo(W,H-5);ctx.stroke()}}else if(mode==='unravel'){const frac=Math.min(1,t*.3);glyph(1-frac);ctx.lineWidth=1.5;ctx.strokeStyle='#dce9e3';ctx.beginPath();let n=Math.floor(threads.length*frac);for(let i=0;i<n;i++){let p=threads[i],x=p.x+Math.sin(t*2+p.phase)*25+t*10,y=p.y+Math.sin(t*1.4+i*.09)*23-t*18;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();for(let i=0;i<n;i+=18){let p=threads[i];disk(p.x+Math.sin(t*2+p.phase)*25+t*10,p.y+Math.sin(t*1.4+i*.09)*23-t*18,1.5)}}else if(mode==='bloom'){glyph(Math.max(.12,1-t*.14));for(const b of branches){let progress=Math.min(1,Math.max(0,(t-b.phase)*1.5));if(!progress)continue;const len=b.length*progress,x2=b.x+Math.cos(b.angle)*len,y2=b.y+Math.sin(b.angle)*len;ctx.strokeStyle='#7eb59a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.quadraticCurveTo(b.x+len*.1,b.y-len*.4,x2,y2);ctx.stroke();if(progress>.55){for(let j=0;j<2;j++){let a=b.angle+(j?1:-1)*.75;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2+Math.cos(a)*len*.3,y2+Math.sin(a)*len*.3);ctx.stroke()}}if(b.flower&&progress>.9){for(let k=0;k<5;k++){let a=k*Math.PI*2/5;disk(x2+Math.cos(a)*4,y2+Math.sin(a)*4,3,'#e6c7ae')}disk(x2,y2,2,'#e7e0a3')}}}}function tick(now){if(!running)return;const t=Math.min(8,(now-start)/1000);draw(t);prev=performance.now();status.textContent=t.toFixed(1)+'s · '+ink.length+' ink samples';raf=requestAnimationFrame(tick)}function begin(){if(running)return;running=true;start=performance.now();prev=start;go.textContent='Running';raf=requestAnimationFrame(tick)}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;setup()}));go.addEventListener('click',begin);document.querySelector('#reset').addEventListener('click',setup);window.addEventListener('resize',setup);setup()})();
</script></body></html>
