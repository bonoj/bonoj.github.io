<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151b"><title>Autology · DECAY → GROWTH</title><style>*{box-sizing:border-box}body{margin:0;background:#10151b;color:#e1ece6;font:14px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 16px}h1{font:normal 32px Georgia,serif;margin:0 0 4px}p{color:#9fb2ac}canvas{display:block;width:100%;height:420px;touch-action:manipulation;border:1px solid #33453f;border-radius:12px}button{padding:11px 20px;background:#224d3c;color:#e1ece6;border:1px solid #52715f;border-radius:8px;font:inherit;cursor:pointer}button+button{background:transparent}.bar{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}#count{margin-left:auto;color:#9fb2ac;font:12px monospace}</style></head><body><main><h1>Autology</h1><p>Language made physical · DECAY → GROWTH · conserved BB matter</p><canvas id="scene"></canvas><div class="bar"><button id="go">Decay</button><button id="reset">Reset</button><span id="count"></span></div><p id="inventory"></p></main><script>
(()=>{'use strict';const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),count=document.querySelector('#count'),inv=document.querySelector('#inventory');const word='decay';let W,H,dpr,mask,balls=[],n=0,active=false,start=0,last=0,raf=0,counts=[],phase='ready',growthTargets={},growthStart=0,glyphs=[],growthPlan=[],growthBudget=0;const rand=(a,b)=>a+Math.random()*(b-a);
function init(){cancelAnimationFrame(raf);W=Math.max(260,canvas.getBoundingClientRect().width);H=420;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const m=document.createElement('canvas');m.width=Math.ceil(W);m.height=180;const g=m.getContext('2d',{willReadFrequently:true});let s=Math.min(120,(W-28)/3.1);g.font='900 '+s+'px Georgia,serif';while(g.measureText(word).width>W-22){s--;g.font='900 '+s+'px Georgia,serif'}const left=(W-g.measureText(word).width)/2,base=146;g.fillStyle='#e1ece6';g.fillText(word,left,base);let spans=[],x=left;for(const ch of word){let w=g.measureText(ch).width;spans.push([x,x+w]);x+=w}const data=g.getImageData(0,0,m.width,m.height).data;balls=[];counts=[0,0,0,0,0];for(let y=0;y<m.height;y+=2.2)for(let x=0;x<m.width;x+=2.2){if(Math.random()>data[(Math.floor(y)*m.width+Math.floor(x))*4+3]/255)continue;let li=spans.findIndex(([a,b])=>x>=a&&x<b);if(li<0)li=4;balls.push({x,y,ox:x,oy:y,vx:0,vy:0,r:rand(.85,1.3),li,free:false,sleep:false});counts[li]++}mask=m;n=balls.length;active=false;phase='ready';growthTargets=[];start=last=0;document.querySelector('#go').textContent='Decay';inv.textContent=word.split('').map((c,i)=>c+': '+counts[i]).join('  ·  ');draw(0)}
function draw(t){ctx.fillStyle='#10151b';ctx.fillRect(0,0,W,H);const floor=H-16;ctx.strokeStyle='#52665e';ctx.beginPath();ctx.moveTo(8,floor+.5);ctx.lineTo(W-8,floor+.5);ctx.stroke();let cut=active?-15+(t-start)*.055:-999;if(phase==='ready')ctx.drawImage(mask,0,0);else if(phase==='decay'&&cut<mask.height){ctx.save();ctx.beginPath();ctx.rect(0,Math.max(0,cut),W,Math.max(0,mask.height-cut));ctx.clip();ctx.drawImage(mask,0,0);ctx.restore()}let freed=0;for(const b of balls){if(!b.free||b.planted)continue;freed++;ctx.fillStyle=['#d5e6df','#c4ddd4','#e1e9e2','#c2d5d0','#d8e3d8'][b.li];ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}count.textContent=phase==='growth'||phase==='grown'?growthBudget+' / '+n+' BBs incorporated':freed+' / '+n+' BBs released'}
function frame(t){if(phase==='growth'){growFrame(t);return}const dt=Math.min(.03,(t-(last||t))/1000);last=t;const cut=-15+(t-start)*.055,floor=H-16;for(const b of balls){if(!b.free&&b.oy<=cut){b.free=true;b.vx=rand(-30,30)+(b.ox-W/2)*.04;b.vy=rand(-12,8)}if(!b.free||b.sleep)continue;b.vy+=720*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<4+b.r){b.x=4+b.r;b.vx=Math.abs(b.vx)*.5}if(b.x>W-4-b.r){b.x=W-4-b.r;b.vx=-Math.abs(b.vx)*.5}if(b.y>floor-b.r){b.y=floor-b.r;b.vy=-Math.abs(b.vy)*.24;b.vx*=.85;if(Math.abs(b.vy)<14)b.sleep=true}}
const cell=3.4,buckets=new Map();for(let i=0;i<balls.length;i++){let b=balls[i];if(!b.free)continue;let key=Math.floor(b.x/cell)+','+Math.floor(b.y/cell);if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(i)}for(let i=0;i<balls.length;i++){const a=balls[i];if(!a.free)continue;let gx=Math.floor(a.x/cell),gy=Math.floor(a.y/cell);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){for(const j of buckets.get((gx+dx)+','+(gy+dy))||[]){if(j<=i)continue;const b=balls[j],xx=b.x-a.x,yy=b.y-a.y,rr=a.r+b.r,dd=xx*xx+yy*yy;if(dd>=rr*rr||dd<.00001)continue;const dist=Math.sqrt(dd),nx=xx/dist,ny=yy/dist,over=rr-dist;a.x-=nx*over*.5;b.x+=nx*over*.5;a.y-=ny*over*.5;b.y+=ny*over*.5;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const impulse=-rv*.2;a.vx-=nx*impulse;a.vy-=ny*impulse;b.vx+=nx*impulse;b.vy+=ny*impulse}a.sleep=b.sleep=false}}if(a.y>floor-a.r){a.y=floor-a.r;if(a.vy>0)a.vy*=-.2;a.vx*=.96;if(Math.abs(a.vy)<8&&Math.abs(a.vx)<3)a.sleep=true}}draw(t);if(phase==='decay'&&cut>mask.height+5&&t-start>7000){phase='settling'}if(phase==='settling'&&t-start>10000){phase='decayed';document.querySelector('#go').textContent='Growth';active=false;draw(t);return}raf=requestAnimationFrame(frame)}


function buildGrowthTargets(){
 const m=document.createElement('canvas');m.width=Math.ceil(W);m.height=230;const g=m.getContext('2d',{willReadFrequently:true});let size=Math.min(110,(W-24)/3.85);
 g.font='900 '+size+'px Georgia,serif';while(g.measureText('growth').width>W-20){size--;g.font='900 '+size+'px Georgia,serif'}
 const text='growth',left=(W-g.measureText(text).width)/2;g.fillStyle='#e1ece6';g.fillText(text,left,190);
 glyphs=[];let x=left;for(const ch of text){const w=g.measureText(ch).width;glyphs.push({x,w,points:[],filled:0,cutoff:230});x+=w}
 const data=g.getImageData(0,0,m.width,m.height).data;
 for(let y=0;y<230;y+=2.2)for(let x=0;x<m.width;x+=2.2){
  if(data[(Math.floor(y)*m.width+Math.floor(x))*4+3]<128)continue;
  const i=glyphs.findIndex(z=>x>=z.x&&x<z.x+z.w);if(i>=0)glyphs[i].points.push({x,y:y+15});
 }
 const order=[2,3,1,4,0,5];growthPlan=[];let remaining=n;
 for(let k=0;k<order.length;k++){const gi=order[k],z=glyphs[gi];z.points.sort((a,b)=>b.y-a.y||Math.abs(a.x-z.x-z.w/2)-Math.abs(b.x-z.x-z.w/2));const allocation=Math.min(remaining,z.points.length);growthPlan.push({gi,allocation,start:k*950,used:0});remaining-=allocation}
 growthTargets={mask:m};
}
function drawGrowthGlyphs(){
 if(!growthTargets.mask)return;
 for(const z of glyphs){if(!z.filled)continue;ctx.save();ctx.beginPath();ctx.rect(z.x-1,z.cutoff,z.w+2,240-z.cutoff);ctx.clip();ctx.drawImage(growthTargets.mask,0,15);ctx.restore()}
}
function beginGrowth(){
 phase='growth';active=true;growthStart=performance.now();last=growthStart;growthBudget=0;buildGrowthTargets();
 for(const b of balls){b.planted=false;b.sleep=false;b.vx=0;b.vy=0}
 document.querySelector('#go').textContent='Growing…';raf=requestAnimationFrame(frame);
}
function growFrame(t){
 const dt=Math.min(.04,(t-(last||t))/1000);last=t;const elapsed=t-growthStart;let wanted=0;
 for(const p of growthPlan){const z=glyphs[p.gi],fraction=Math.min(1,Math.max(0,(elapsed-p.start)/2800));p.used=Math.max(p.used,Math.floor(p.allocation*fraction));wanted+=p.used;if(p.used){z.filled=p.used;z.cutoff=z.points[p.used-1].y-1.1}}
 let needed=wanted-growthBudget;
 if(needed>0)for(const b of balls){if(!needed)break;if(b.planted)continue;b.planted=true;growthBudget++;needed--}
 const current=growthPlan.find(p=>p.used<p.allocation&&elapsed>=p.start)||growthPlan.find(p=>p.used<p.allocation),tip=current?glyphs[current.gi]:null;
 for(const b of balls){if(b.planted)continue;b.x+=(W/2-b.x)*Math.min(1,dt*2.5);b.y+=(H-26-b.y)*Math.min(1,dt*1.8);
  if(tip&&elapsed>400){const lift=Math.min(1,(elapsed-400)/1900),bx=tip.x+tip.w/2,by=tip.points.length?tip.points[0].y:100;
   const tx=W/2+(bx-W/2)*lift*lift,ty=H-26+(by-(H-26))*lift;
   b.x+=(tx-b.x)*Math.min(1,dt*.55);b.y+=(ty-b.y)*Math.min(1,dt*.55)}
 }
 draw(t);
 if(growthPlan.every(p=>p.used===p.allocation)&&elapsed>growthPlan[growthPlan.length-1].start+2900){phase='grown';active=false;document.querySelector('#go').textContent='Reset';return}
 raf=requestAnimationFrame(frame);
}
document.querySelector('#go').onclick=()=>{if(active)return;if(phase==='decayed'||phase==='grown'){if(phase==='grown'){init();return}beginGrowth();return}active=true;phase='decay';start=last=performance.now();raf=requestAnimationFrame(frame)};document.querySelector('#reset').onclick=init;window.addEventListener('resize',()=>{if(!active)init()});init()})();
</script></body></html>
