<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#151927"><title>🦒🏁🎨</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151927;color:#fff;font-family:system-ui;touch-action:manipulation}main{height:100dvh;display:flex;flex-direction:column;padding:8px;gap:7px}header{display:flex;justify-content:space-between;align-items:center;font-size:27px;min-height:42px}button{background:#293246;color:white;border:1px solid #56627b;border-radius:16px;font-size:28px;padding:4px 15px}#track{flex:1;min-height:160px;position:relative;border-radius:15px;overflow:hidden;background:#49744b;touch-action:none} .lane{position:absolute;left:0;right:0;height:16.6667%;border-bottom:2px dashed #c7e1b36b;background:linear-gradient(90deg,#8b6b4d,#b58a62);overflow:hidden}.runner{position:absolute;left:0;top:50%;font-size:clamp(29px,9vw,48px);transform:translate(-5%,-50%);will-change:left;filter:drop-shadow(2px 3px 2px #38251e)}.trail{position:absolute;inset:0;pointer-events:none}.finish{position:absolute;right:8%;top:0;bottom:0;width:10px;background:repeating-conic-gradient(#fff 0% 25%,#222 0% 50%) 0 0/10px 10px;opacity:.8}.splash{position:absolute;pointer-events:none;font-size:29px;animation:fade .8s forwards}@keyframes fade{to{opacity:0;transform:scale(2)}}#gallery{height:31%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:6px}.art{min-height:0;background:#f7f0df;border:3px solid #ad8550;border-radius:8px;position:relative;overflow:hidden}.art canvas{width:100%;height:100%;display:block}.art span{position:absolute;left:3px;top:2px;font-size:19px;text-shadow:0 1px 2px #fff}#winner{font-size:27px;min-width:80px;text-align:center}#zoom{display:none;position:fixed;inset:0;background:#111e;z-index:5;align-items:center;justify-content:center;padding:16px}#zoom canvas{width:95vw;height:70vh;background:#f7f0df;object-fit:contain;border:8px solid #ad8550;border-radius:10px}</style></head><body><main><header><span>🦒 🏁 🎨</span><span id="winner"></span><button id="restart" aria-label="Restart">🔄</button></header><div id="track"><div class="finish"></div></div><div id="gallery"></div></main><div id="zoom"><canvas width="600" height="450"></canvas></div><script>
(()=>{'use strict';const track=document.querySelector('#track'),gallery=document.querySelector('#gallery'),winner=document.querySelector('#winner');const symbols=['🦒','🦒','🦒','🦒','👨🏻‍🎨','👨🏼‍🎨'];const palettes=[['#ec537a','#f5b544','#383d8c'],['#388ee8','#ebcb45','#e65b63'],['#9a5de4','#55c9aa','#f09c43'],['#e74d4d','#333','#e7b53d'],['#c69764','#4c7198','#d65858'],['#edba38','#368dd0','#e7536e']];let actors=[],running=false,last=0,seed=741,frame=0;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function paint(a){let c=a.ctx,w=240,h=150,t=a.t++,p=a.palette; c.lineCap='round';c.strokeStyle=p[Math.floor(random()*p.length)];c.fillStyle=c.strokeStyle;c.globalAlpha=.7+random()*.3;let x=random()*w,y=random()*h;if(a.i===5){c.lineWidth=2+random()*6;c.beginPath();c.arc(x,y,3+random()*22,0,Math.PI*2);c.stroke();c.beginPath();c.moveTo(x,y);c.lineTo(x+random()*65-32,y+random()*65-32);c.stroke()}else if(a.i===4){c.lineWidth=3+random()*5;c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+20,y-35,x-25,y+35,x+random()*60-30,y+random()*70-35);c.stroke()}else{c.lineWidth=2+random()*12;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+random()*80-40,y+random()*70-35,x+random()*70-35,y+random()*80-40);c.stroke()}c.globalAlpha=1}
function reset(){seed=741;frame=0;last=0;running=true;winner.textContent='';gallery.replaceChildren();track.querySelectorAll('.lane,.splash').forEach(n=>n.remove());actors=[];for(let i=0;i<6;i++){let lane=document.createElement('div');lane.className='lane';lane.style.top=(i*100/6)+'%';let runner=document.createElement('span');runner.className='runner';runner.textContent=symbols[i];lane.append(runner);track.append(lane);let art=document.createElement('div');art.className='art';let canvas=document.createElement('canvas');canvas.width=240;canvas.height=150;let label=document.createElement('span');label.textContent=i===4?'🕰️':i===5?'🔶':'🦒';art.append(canvas,label);gallery.append(art);let ctx=canvas.getContext('2d');ctx.fillStyle='#f7f0df';ctx.fillRect(0,0,240,150);let a={i,x:0,speed:.075+random()*.03,energy:1,t:0,ctx,canvas,runner,palette:palettes[i],boost:0};actors.push(a);art.addEventListener('click',()=>{running=false;let z=document.querySelector('#zoom');z.style.display='flex';z.querySelector('canvas').getContext('2d').drawImage(canvas,0,0,600,450)});lane.addEventListener('pointerdown',e=>{if(!running)return;a.boost+=.045;let spl=document.createElement('span');spl.className='splash';spl.textContent='🎨';spl.style.left=(e.clientX-lane.getBoundingClientRect().left)+'px';spl.style.top=(i*100/6)+'%';track.append(spl);setTimeout(()=>spl.remove(),850);for(let j=0;j<7;j++)paint(a)})}requestAnimationFrame(tick)}
function tick(ts){if(!running)return;if(!last)last=ts;let dt=Math.min((ts-last)/1000,.05);last=ts;frame++;let leader=null;for(let a of actors){a.x+=dt*(a.speed+a.boost)*(.8+.4*random());a.boost*=.95;a.runner.style.left=(Math.min(a.x,1)*83+3)+'%';a.runner.style.transform='translate(-5%,-50%) rotate('+(Math.sin(frame*.23+a.i)*5)+'deg)';if(frame%4===0)paint(a);if(a.x>=1&&(!leader||a.x>leader.x))leader=a}if(leader){running=false;winner.textContent=(leader.i<4?'🦒':leader.i===4?'🕰️':'🔶')+'🏆'}else requestAnimationFrame(tick)}
document.querySelector('#restart').addEventListener('click',reset);document.querySelector('#zoom').addEventListener('click',e=>{e.currentTarget.style.display='none';if(!actors.some(a=>a.x>=1)){running=true;last=0;requestAnimationFrame(tick)}});reset()})();
</script></body></html>
