<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>JIT Music · Laboratory</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101923;color:#eadbc1;font-family:system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;max-width:960px;margin:auto;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom)}header{padding:16px 0 10px;border-bottom:1px solid #394654;display:flex;align-items:center;justify-content:space-between}h1{font:normal 23px Georgia,serif;margin:0}small,.muted{color:#a9b4be}nav{display:flex;gap:8px;padding:12px 0}nav button{border:1px solid #c7a779;background:#453d34;color:#f6dfbd;border-radius:9px;padding:10px 13px}main{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}.panel{border:1px solid #3e4c59;border-radius:17px;padding:15px;background:#17232e}.eyebrow{font-size:11px;letter-spacing:.15em;color:#c8a77b}.heading{font:normal 28px Georgia,serif;margin:7px 0}.desc{font-size:13px;color:#acb8c2;margin:0 0 12px}canvas{width:100%;height:150px;display:block;border-radius:10px;background:#101923}.actions{display:flex;gap:8px;margin:12px 0}.actions button{border-radius:9px;border:1px solid #697a87;background:#273845;color:#e9dbc6;padding:12px;min-height:45px}.actions #play{flex:1;background:#d1af85;color:#16202a;font-weight:650}.controls{display:grid;gap:18px;margin:18px 0 8px}.control{display:grid;gap:7px}.control label{display:flex;justify-content:space-between;font-size:13px}.control output{color:#e4c193;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#d1af85;touch-action:pan-x}.segments{display:flex;gap:6px;flex-wrap:wrap}.segments button{border:1px solid #4d6070;background:#21313f;color:#e5d8c3;border-radius:8px;padding:10px 12px;flex:1;min-width:85px}.segments button[aria-pressed=true]{background:#6a533d;border-color:#d8b88a}footer{font-size:11px;color:#8fa0ad;padding:9px 0;border-top:1px solid #394654;display:flex;justify-content:space-between}.hidden{display:none}
</style></head><body><div id="app"><header><div><small>JIT / LABORATORIES</small><h1>♫ Music</h1></div><small id="build">MUSIC / 01</small></header><nav aria-label="Experiences"><button aria-current="page">01 · Sustain Laboratory</button></nav><main><section class="panel"><div class="eyebrow">EXPERIMENT 001 · CONTINUITY</div><h2 class="heading">Sustain Laboratory</h2><p class="desc">Long notes, overlapping voices, slow harmonic movement. Listen for continuity between attacks.</p><canvas id="scope"></canvas><div class="actions"><button id="play">▶ Play evolving passage</button><button id="stop" aria-label="Stop">■</button></div><p id="status" class="desc" role="status">Ready · headphones recommended</p><div class="controls"><div class="control"><label>Voice</label><div class="segments" id="voices"><button data-kind="strings" aria-pressed="true">Bowed strings</button><button data-kind="glass" aria-pressed="false">Glass</button><button data-kind="flute" aria-pressed="false">Flute</button></div></div><div class="control"><label for="duration">Note duration <output id="duration-val">3.5 seconds</output></label><input id="duration" type="range" min=".5" max="8" step=".5" value="3.5"></div><div class="control"><label for="overlap">Note overlap <output id="overlap-val">65%</output></label><input id="overlap" type="range" min="0" max=".9" step=".05" value=".65"></div></div></section></main><footer><span>One page · navigable experiments · Web Audio</span><span>001 / 001</span></footer></div><script>
'use strict';const $=id=>document.getElementById(id),cv=$('scope'),g=cv.getContext('2d'),play=$('play'),stop=$('stop'),status=$('status');let ac,master,analyser,timer,active=false,next=0,step=0,kind='strings',duration=3.5,overlap=.65,session=0;const midi=n=>440*2**((n-69)/12),progression=[[48,55,60,64,67],[45,52,57,60,64],[41,48,53,57,60],[43,50,55,59,62]];
function init(){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.24;const compressor=ac.createDynamicsCompressor();compressor.threshold.value=-16;compressor.ratio.value=2;analyser=ac.createAnalyser();analyser.fftSize=1024;master.connect(compressor);compressor.connect(analyser);analyser.connect(ac.destination)}
function tone(note,t,len,voice,amp,output){const f=midi(note),out=ac.createGain();out.gain.setValueAtTime(.0001,t);const attack=voice==='strings'?.65:voice==='glass'?.8:.18;out.gain.linearRampToValueAtTime(amp,t+attack);out.gain.setValueAtTime(amp*.78,t+Math.max(attack+.05,len-.45));out.gain.linearRampToValueAtTime(.0001,t+len+.75);out.connect(output);const count=voice==='strings'?9:voice==='glass'?6:4;for(let j=1;j<=count;j++){const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(f*j*(voice==='glass'?(1+.0009*j*j):1),t);v.gain.value=(voice==='strings'?.5:.7)/(j**(voice==='strings'?1.15:voice==='glass'?1.7:2.1));if(voice==='strings'){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=4.2+note%5*.17;lg.gain.value=2.5;l.connect(lg);lg.connect(o.detune);l.start(t);l.stop(t+len+1)}o.connect(v);v.connect(out);o.start(t);o.stop(t+len+1)}}
function schedule(){if(!active)return;const spacing=Math.max(.35,duration*(1-overlap));while(next<ac.currentTime+.18){const chord=progression[Math.floor(step/5)%progression.length],note=chord[step%5]+(step%10===9?12:0);tone(note,next,duration,kind,step%5===0?.28:.17,master);status.textContent=kind+' · MIDI '+note+' · '+duration.toFixed(1)+'s duration · '+Math.round(overlap*100)+'% overlap';next+=spacing;step++}}
play.onclick=async()=>{try{if(!ac)init();await ac.resume();if(active)return;active=true;next=ac.currentTime+.06;step=0;master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(.24,ac.currentTime,.03);schedule();timer=setInterval(schedule,60);play.textContent='♫ Playing'}catch(e){status.textContent='Audio unavailable: '+e.message}};
stop.onclick=()=>{active=false;clearInterval(timer);if(master){const old=master;old.gain.cancelScheduledValues(ac.currentTime);old.gain.setTargetAtTime(0,ac.currentTime,.09);master=ac.createGain();master.gain.value=.24;master.connect(analyser)}play.textContent='▶ Play evolving passage';status.textContent='Stopped'};
$('duration').oninput=e=>{duration=+e.target.value;$('duration-val').textContent=duration.toFixed(1)+' seconds'};$('overlap').oninput=e=>{overlap=+e.target.value;$('overlap-val').textContent=Math.round(overlap*100)+'%'};$('voices').onclick=e=>{const b=e.target.closest('[data-kind]');if(!b)return;kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};
function render(){const w=cv.clientWidth,h=cv.clientHeight,d=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=w*d;cv.height=h*d}g.setTransform(d,0,0,d,0,0);g.fillStyle='#101923';g.fillRect(0,0,w,h);const data=new Uint8Array(512);if(analyser)analyser.getByteTimeDomainData(data);else data.fill(128);g.strokeStyle='#d7b891';g.lineWidth=1.5;g.beginPath();for(let i=0;i<w;i++){const v=data[Math.floor(i/w*512)]/128-1,y=h/2+v*h*.4;if(i===0)g.moveTo(i,y);else g.lineTo(i,y)}g.stroke();requestAnimationFrame(render)}render();
</script></body></html>
