<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070c17"><title>LIGHTHUGGER · JIT</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070c17;color:#d9e6ef;font-family:system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}.world{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 74% 50%,#3b231b 0%,#151321 29%,#070c17 75%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.hud button{pointer-events:auto;border:1px solid #8ba4bd4d;background:#101b2b99;border-radius:11px;min-width:44px;min-height:40px;font-size:22px;backdrop-filter:blur(8px)}#build{font:600 12px ui-monospace,monospace;letter-spacing:.05em;padding:9px 11px;min-width:94px;color:#bdd5e8}#status{font-size:19px;letter-spacing:5px;opacity:.85}#eye{font-size:24px}#pause{font-size:21px}#toast{position:absolute;bottom:68px;left:16px;right:16px;text-align:center;font:12px ui-monospace,monospace;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:.8}</style></head><body><main class="world"><canvas id="scene" aria-label="Lighthugger crossing a stellar debris field"></canvas><div class="hud"><div class="top"><button id="build" aria-label="Executing source commit" title="GitHub source revision">········</button><span id="status">✦ ✦ ✦</span><button id="eye" aria-label="Download observation report">👁</button></div><div class="bottom"><button id="pause" aria-label="Pause or resume">⏸</button><span>🧊　☀️　🚀</span><button id="reset" aria-label="Reset voyage">↻</button></div><div id="toast"></div></div></main><script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
let W=1,H=1,dpr=1,last=0,paused=false,seconds=0,frame=0,impacts=0,ice=100,events=[],particles=[],stars=[],revision=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:95},(_,i)=>({x:(i*73.27%101)/101*W,y:(i*31.19%97)/97*H,r:.3+(i%4)*.25}))}
addEventListener('resize',resize);resize();
function log(type,detail={}){events.push({t:+seconds.toFixed(2),type,...detail});if(events.length>2500)events.shift()}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function reset(){seconds=0;frame=0;impacts=0;ice=100;particles=[];events=[];paused=false;$('pause').textContent='⏸';log('reset')}
function ship(){const unit=Math.min(W/470,H/420,1.35),x=W*.45,y=H*.53;ctx.save();ctx.translate(x,y);ctx.scale(unit,unit);ctx.rotate(-Math.PI/2);
const body=ctx.createLinearGradient(-26,0,26,0);body.addColorStop(0,'#263f52');body.addColorStop(.24,'#9bb9c4');body.addColorStop(.55,'#e3d8c4');body.addColorStop(1,'#334b62');
ctx.fillStyle='#1c3044';ctx.strokeStyle='#99adba';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-198);ctx.bezierCurveTo(32,-173,28,-120,26,115);ctx.lineTo(17,152);ctx.lineTo(-17,152);ctx.lineTo(-26,115);ctx.bezierCurveTo(-28,-120,-32,-173,0,-198);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle=body;ctx.fillRect(-20,-123,40,235);
for(let i=0;i<15;i++){const yy=-115+i*16;ctx.fillStyle=i%3===0?'#b7a48c':'#526b7c';ctx.fillRect(-25,yy,50,3);ctx.fillStyle='#89d3e0';ctx.fillRect(-9,yy+5,18,2)}
ctx.fillStyle='#bde8fa';ctx.beginPath();ctx.ellipse(0,-157,21,38,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#7ac2e0';ctx.fillRect(-12,45,24,45);ctx.fillStyle='#e5ae77';ctx.fillRect(-21,99,42,18);
ctx.fillStyle='#a4d9f0';ctx.beginPath();ctx.moveTo(-18,151);ctx.lineTo(-10,175+Math.sin(seconds*13)*5);ctx.lineTo(0,163);ctx.lineTo(10,180+Math.cos(seconds*11)*6);ctx.lineTo(18,151);ctx.fill();
ctx.fillStyle='#d1f4ff';ctx.font='22px system-ui';ctx.textAlign='center';ctx.fillText('🧊',0,-179);
ctx.restore();return{x,y,unit}}
function draw(dt){ctx.clearRect(0,0,W,H);ctx.fillStyle='#d9e8ff';for(const s of stars){ctx.globalAlpha=.25+.35*Math.sin(seconds*.3+s.x);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;
const sunX=W*.83,sunY=H*.47,rad=Math.min(W,H)*.12;const glow=ctx.createRadialGradient(sunX,sunY,4,sunX,sunY,rad*3.5);glow.addColorStop(0,'#ffe0a688');glow.addColorStop(.24,'#e58e3e66');glow.addColorStop(1,'#e58e3e00');ctx.fillStyle=glow;ctx.fillRect(sunX-rad*3.5,sunY-rad*3.5,rad*7,rad*7);ctx.fillStyle='#ffe5aa';ctx.beginPath();ctx.arc(sunX,sunY,rad,0,7);ctx.fill();
const s=ship();
if(!paused){if(frame++%13===0){const yy=(frame*47%Math.max(H,1));particles.push({x:-15,y:yy,vx:1.6+frame%3,vy:.8+frame%5*.13,r:1.5+frame%3})}for(const p of particles){p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;if(Math.hypot(p.x-s.x,p.y-s.y)<19*s.unit&&p.y<s.y){impacts++;ice=Math.max(0,ice-.14);log('ice-ablation',{x:Math.round(p.x),y:Math.round(p.y),ice:+ice.toFixed(2)});p.x=W+100}}particles=particles.filter(p=>p.x<W+20&&p.y<H+20)}
for(const p of particles){ctx.strokeStyle='#e4b884';ctx.lineWidth=p.r;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*7,p.y-p.vy*7);ctx.stroke()}
ctx.fillStyle='#c5d6e9';ctx.font='11px ui-monospace,monospace';ctx.textAlign='center';ctx.globalAlpha=.55;ctx.fillText('↑',s.x,s.y-245*s.unit);ctx.globalAlpha=1}
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(!paused)seconds+=dt;draw(dt);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'⏸';log(paused?'pause':'resume')};$('reset').onclick=reset;
$('eye').onclick=()=>{log('observation-download');const data={schema:'lighthugger-shell-observer/v1',sourceCommit:revision,runSeconds:+seconds.toFixed(2),paused,impacts,ice,events,geometry:'shell-only; visual meteor vectors and preliminary ice ablation; not a full physical collision simulation'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='icarus-'+(revision?revision.slice(0,8):'unverified')+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('👁 ↓')};
async function resolveBuild(){try{const u='https://api.github.com/repos/bonoj/bonoj.github.io/commits?path=jit%2Ficarus%2Findex.html&per_page=1';const response=await fetch(u,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw Error('API '+response.status);const commits=await response.json();if(!commits[0]?.sha)throw Error('missing commit');revision=commits[0].sha;$('build').textContent=revision.slice(0,8);$('build').title='Source commit '+revision}catch(e){$('build').textContent='unverified';$('build').title=String(e)}}resolveBuild();$('build').onclick=()=>toast(revision?revision.slice(0,8):'unverified');
})();
</script></body></html>
