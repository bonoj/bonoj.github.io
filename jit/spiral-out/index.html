    dx+=(p.seed-.5)*field*100;dy+=(p.seed2-.5)*field*120;force+=field;
   }
   const shimmer=Math.sin(pulse*.72+k*1.4+p.seed*TAU)*s.amp*(3+accent*6);
   const x=centerX+rx+dx+shimmer,y=centerY+ry+dy+Math.sin(pulse*.4+p.seed2*TAU)*s.amp*4;
   const opacity=Math.max(0,Math.min(1,(x+50)/80,(W+50-x)/80))*(.34+.58*s.amp);
   ctx.fillStyle=force>.25?'rgba(238,189,127,'+opacity+')':'rgba(153,215,198,'+opacity+')';
   ctx.fillRect(x,y,1.4+Math.min(1.6,force),1.4+Math.min(1.6,force));sum+=Math.max(0,1-Math.min(1,force));
  }
 }
 coherence=sum/Math.max(1,particles.length);
 // The bar length shifts the score's breathing rather than stopping it.
 const phase=(pulse%12)/12;
 ctx.strokeStyle='rgba(225,174,112,'+(.14+accent*.17)+')';ctx.beginPath();ctx.moveTo(cx+(phase-.5)*scale*.25,cy-band*1.65);ctx.lineTo(cx+(phase-.5)*scale*.25,cy+band*1.65);ctx.stroke();
}


// Fixed inventory: all glyph configurations share the same persistent particles.
// Every particle follows a closed 3D elliptical orbit, approaching the reading plane
// only during its assigned stanza. The orbit itself never resets on stanza changes.
let balladShapes=null,balladInventory=0;
function prepareBallad(){
 if(balladShapes)return;
 balladShapes=[];
 const font=44,step=3;
 for(const lines of BALLAD){
  const shape=[];
  for(let row=0;row<4;row++){
   sc.font='600 '+font+'px system-ui,sans-serif';
   const width=Math.ceil(sc.measureText(lines[row]).width)+12;
   scratch.width=width;scratch.height=64;
   sc.font='600 '+font+'px system-ui,sans-serif';sc.fillStyle='#fff';sc.textBaseline='middle';sc.fillText(lines[row],6,32);
   const pix=sc.getImageData(0,0,width,64).data;
   for(let y=0;y<64;y+=step)for(let x=0;x<width;x+=step){
    if(pix[(y*width+x)*4+3]<110)continue;
    shape.push({row,x:(x-width/2)/font,y:(y-32)/font});
   }
  }
  balladShapes.push(shape);balladInventory=Math.max(balladInventory,shape.length);
 }
 balladParticles=Array.from({length:balladInventory},(_,id)=>({
  seed:hash(id*3+19),seed2:hash(id*7+29),seed3:hash(id*13+47),
  // A tiny proportion of particles occupy near-camera return orbits.
  lane:hash(id*17+61)<.035?2:hash(id*19+71)<.22?1:0
 }));
}
function renderBallad(){
 prepareBallad();
 const per=12,n=Math.min(53,Math.floor(t/per)),phase=(t%per)/per;
 const cx=W*.5,cy=H*.52,shape=balladShapes[n];
 sc.font='600 44px system-ui,sans-serif';
 const longest=Math.max(...BALLAD[n].map(line=>sc.measureText(line).width/44),1);
 const fontPixels=Math.min(26,Math.max(10,(W-34)/(longest+.3)));
 const lineHeight=Math.min(54,Math.max(28,fontPixels*1.8));
 const travel=(phase-.5)*H*.25;
 // For readability, the typography sits on a front-facing plane.
 // In the return leg the same particles sweep around the sides of the vessel.
 const drawn=[];
 for(let id=0;id<balladInventory;id++){
  const p=balladParticles[id],glyph=shape[id],lane=p.lane;
  // Unbroken, long-period elliptical orbital trajectory; phase is not reset
  // by a new stanza. Alternate sides, with a rare foreground flyby.
  const theta=t*TAU/(per*(1.08+p.seed*.36))+p.seed2*TAU;
  const rx=W*(lane===2?.73:lane===1?.59:.55)+(p.seed-.5)*W*.11;
  const ry=H*(.54+p.seed3*.11);
  const ox=cx+Math.cos(theta)*rx;
  const oy=cy+Math.sin(theta)*ry;
  const oz=(lane===2?1.65:lane===1?-.95:-1.8)+Math.cos(theta)*.55;
  // New glyphs assemble out of the stream and eventually dissolve back into it.
  // Excess inventory stays in orbit; no particles are spawned or deleted.
  const entry=smooth(.015,.25,phase),exit=1-smooth(.76,.98,phase);
  const blend=glyph?entry*exit:0;
  const gx=cx+(glyph?glyph.x*fontPixels:0);
  const gy=cy+(glyph?(glyph.row-1.5)*lineHeight+glyph.y*fontPixels:0)+travel;
  const x=ox+(gx-ox)*blend,y=oy+(gy-oy)*blend,z=oz*(1-blend);
  const depth=3.6/(3.6+z*.35);
  const sx=cx+(x-cx)*depth,sy=cy+(y-cy)*depth;
  const inView=sx>-8&&sx<W+8&&sy>-8&&sy<H+8;
  if(!inView)continue;
  const orbitAlpha=lane===2?.34:lane===1?.18:.09;
  const alpha=orbitAlpha+(0.83-orbitAlpha)*blend;
  drawn.push({sx,sy,z,alpha,size:blend>.65?1.45:lane===2?2.1:1.05,lane});
 }
 // Back planes first; occasional foreground return particles cross in front.
 drawn.sort((a,b)=>a.z-b.z);
 for(const p of drawn){
  ctx.fillStyle=p.lane===2&&p.z>.4?'rgba(175,223,211,'+p.alpha+')':'rgba(221,209,178,'+p.alpha+')';
  ctx.fillRect(p.sx,p.sy,p.size,p.size);
 }
 return smooth(.02,.25,phase)*(1-smooth(.76,.98,phase));
}

function frame(ms){
 const dt=Math.min(.05,(ms-last)/1000||.016);last=ms;t+=dt;
 if(t>=SONGS[song].duration){t=0;impulses=[];}
 ctx.fillStyle='#090d16';ctx.fillRect(0,0,W,H);
 const aura=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.min(W,H)*.7);aura.addColorStop(0,'#304b4a28');aura.addColorStop(1,'#090d1600');ctx.fillStyle=aura;ctx.fillRect(0,0,W,H);
 if(song===0)renderLateralus();else if(song===1)renderSchism();else coherence=renderBallad();
 impulses=impulses.filter(i=>t-i.t<3.6);
 led.style.background='hsl('+(154-90*coherence)+' 77% '+(38+coherence*40)+'%)';
 led.style.boxShadow='0 0 '+(6+coherence*18)+'px hsl(150 83% 67% / '+(.3+coherence*.65)+')';
 led.style.transform='scale('+(0.9+coherence*.55)+')';
 clock.textContent=fmt(t);requestAnimationFrame(frame);
}
document.getElementById('prev').onclick=()=>setSong(song-1);
document.getElementById('next').onclick=()=>setSong(song+1);
document.getElementById('shuffle').onclick=()=>setSong((song+1+Math.floor(Math.random()*(SONGS.length-1)))%SONGS.length);
const active=new Map(),surface=document.getElementById('touchsurface');
surface.addEventListener('pointerdown',e=>{
 if(song!==1||active.size>=3)return;
 e.preventDefault();surface.setPointerCapture(e.pointerId);
 const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 active.set(e.pointerId,{t,x,y});impulses.push({t,x,y,power:.65});
});
surface.addEventListener('pointermove',e=>{
 const v=active.get(e.pointerId);if(!v)return;
 const r=canvas.getBoundingClientRect();v.x=e.clientX-r.left;v.y=e.clientY-r.top;
});
function release(e){
 const v=active.get(e.pointerId);if(!v)return;
 const held=Math.max(0,t-v.t);impulses.push({t,x:v.x,y:v.y,power:Math.min(2.8,.75+held*1.4)});
 active.delete(e.pointerId);
}
surface.addEventListener('pointerup',release);surface.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
window.addEventListener('resize',resize);resize();setSong(0);requestAnimationFrame(frame);
</script></body></html>
