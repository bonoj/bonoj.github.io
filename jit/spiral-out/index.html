<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>SPIRAL OUT · lyrical dreaming</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#f2e9dc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit}#app{height:100dvh;min-height:420px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#1c2432 0%,#0c111b 43%,#07090f 82%)}#stage{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.95}#app:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(#090c14bd 0%,transparent 25%,transparent 58%,#080b12b5 82%,#080b12f5 100%)}#grain{position:absolute;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E")}main{height:100%;display:flex;flex-direction:column;position:relative;z-index:2;padding:clamp(18px,4vw,36px);padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.mark{font-size:11px;font-weight:750;letter-spacing:.27em;color:#d3a978}.status{font-size:10px;letter-spacing:.17em;color:#8bb6ad;display:flex;align-items:center;gap:8px}.led{width:6px;height:6px;border-radius:50%;background:#91e1be;box-shadow:0 0 14px #70e9b2;animation:blink 2.7s ease-in-out infinite}@keyframes blink{50%{opacity:.3}}.identity{padding-top:clamp(18px,5vh,48px);text-align:center}.eyebrow{color:#9c9c9b;font-size:10px;letter-spacing:.24em;margin-bottom:12px}.song{font-size:clamp(34px,7.7vw,78px);font-weight:650;letter-spacing:-.055em;line-height:1.04;text-wrap:balance;text-shadow:0 3px 30px #0008}.artist{margin-top:12px;font-size:clamp(17px,3vw,25px);color:#e0ad78;font-weight:480;letter-spacing:.06em}.album{font-size:11px;color:#a5a6aa;letter-spacing:.15em;margin-top:8px}.void{flex:1;min-height:30px}.lyric-area{max-width:650px;width:100%;margin:0 auto 4vh;text-align:center}.small{font-size:10px;color:#9ca6a9;letter-spacing:.2em;margin-bottom:16px}.fragments{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 20px;min-height:100px}.fragment{border:0;background:transparent;color:#c8c9c8;font-size:clamp(18px,4.5vw,27px);font-weight:350;letter-spacing:.01em;line-height:1.55;padding:4px 2px;cursor:default;transition:color .5s,text-shadow .5s,transform .35s}.fragment.link{color:#e2cba4;cursor:pointer;text-shadow:0 0 16px #d9a86a3b;animation:glimmer 6s ease-in-out infinite}.fragment.link:nth-child(even){animation-delay:-2.7s}.fragment.link:hover,.fragment.link:focus-visible{color:#fff0d1;text-shadow:0 0 18px #ffca85b8;outline:none}.fragment.link:active{transform:scale(1.07)}@keyframes glimmer{50%{color:#f4e0bc;text-shadow:0 0 20px #e5ad7080}}.bottom{font-size:10px;letter-spacing:.12em;color:#8c959c;min-height:35px}.tiny{background:none;border:1px solid #5e68705c;border-radius:50%;width:36px;height:36px;color:#b9c7c7;cursor:pointer;font-size:17px}.tiny:focus-visible{outline:2px solid #d5b282}.meta{display:flex;align-items:center;gap:12px}.note{font-size:10px;color:#a0aaa8;text-align:center;min-height:16px;margin-top:8px}.transit .identity,.transit .fragments{animation:arrive .7s ease both}@keyframes arrive{from{opacity:.15;filter:blur(9px);transform:translateY(8px)}to{opacity:1;filter:blur(0);transform:none}}@media(max-height:650px){.identity{padding-top:9px}.song{font-size:clamp(29px,6vw,53px)}.lyric-area{margin-bottom:1vh}.fragments{min-height:62px;gap:4px 14px}.fragment{font-size:clamp(16px,3.5vw,21px)}.small{margin-bottom:5px}}@media(prefers-reduced-motion:reduce){.fragment.link,.led{animation:none}.transit .identity,.transit .fragments{animation:none}}

/* One-song instrument: typography is the visible material of the sculpture. */
.mark{display:none}.identity{pointer-events:none;position:relative;z-index:3}.identity .song{font-size:clamp(38px,9vw,83px)}.top{min-height:16px}.status{margin-left:auto}.led{display:block;width:8px;height:8px;transition:background .12s,box-shadow .12s,transform .12s;animation:none}.bottom{position:relative;z-index:3;padding-bottom:3px}.track{opacity:.55}.tiny{width:34px;height:34px;font-size:15px}.void{pointer-events:none}#stage{z-index:0}#app:before{z-index:1;opacity:.8}#grain{z-index:1}.identity{padding-top:clamp(5px,3vh,32px)}@media(max-height:600px){.identity{padding-top:4px}} 
button,a,[role="button"]{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid #d5b282;outline-offset:3px} .transport{display:flex;gap:7px;align-items:center}.transport .tiny{border:0;font-size:22px;color:#b9c7c7;min-width:42px;min-height:42px}.transport #shuffle{font-size:20px}.fingerboard{position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:13%;display:flex;gap:clamp(14px,6vw,34px)}.finger{width:clamp(64px,20vw,88px);height:clamp(64px,20vw,88px);border:1px solid #8bb6ad55;border-radius:50%;background:#111b23a8;color:#c1d8d1;font-size:23px;touch-action:none;user-select:none;cursor:pointer;transition:background .1s,border-color .1s}.finger.down{background:#bc9c6c66;border-color:#f6c58a}.fingerboard[hidden]{display:none}.finger:focus-visible{outline:2px solid #f6c58a}.identity{z-index:5}.bottom{z-index:6}  #touchsurface{position:absolute;inset:0;z-index:2;touch-action:none}main{pointer-events:none}.bottom button{pointer-events:auto} </style></head><body><div id="app"><canvas id="stage" aria-hidden="true"></canvas><div id="grain"></div><div id="touchsurface" aria-label="Interactive music sculpture"></div><main><div class="top"><span class="mark" aria-hidden="true"></span><span class="status"><i class="led" id="led"></i></span></div><section class="identity"><div class="eyebrow">NOW DREAMING · 2001</div><div class="song">Lateralus</div><div class="artist">TOOL</div></section><div class="void"></div><div class="bottom"><span id="time">00:00</span><span class="track">◉ <span id="duration">09:24</span></span><div class="transport"><button class="tiny" id="prev" aria-label="Previous song">‹</button><button class="tiny" id="shuffle" aria-label="Shuffle song">⤨</button><button class="tiny" id="next" aria-label="Next song">›</button></div></div></main></div>
<script>
'use strict';
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false}),led=document.getElementById('led'),clock=document.getElementById('time'),duration=document.getElementById('duration'),board=null;
const scratch=document.createElement('canvas'),sc=scratch.getContext('2d',{willReadFrequently:true});
const TAU=Math.PI*2;
const SONGS=[
 {title:'Lateralus',duration:564,phrases:['black then white','red and yellow','reaching out to me','there is so much more','over thinking over analyzing','separates the body from the mind','feel the moment','embrace this moment','feel the rhythm','spiral out','keep going','swing on the spiral']},
 {title:'Schism',duration:403,phrases:['the pieces fit','communication','between supposed lovers','cold silence','rediscover communication','the pieces','fit','fall apart','between us','the pieces fit','communication','reassemble','the pieces fit']}
];
let song=0,t=0,last=0,W=0,H=0,dpr=1,particles=[],groups=[],impulses=[],fingers=[null,null,null],coherence=0;
function hash(n){const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x);}
function smooth(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x);}
function build(){
 particles=[];groups=[];
 const font=44,step=3;
 for(let k=0;k<SONGS[song].phrases.length;k++){
  const str=SONGS[song].phrases[k];sc.font='600 '+font+'px system-ui,sans-serif';
  const width=Math.ceil(sc.measureText(str).width)+14;
  scratch.width=width;scratch.height=64;sc.font='600 '+font+'px system-ui,sans-serif';sc.textBaseline='middle';sc.fillStyle='#fff';sc.fillText(str,7,32);
  const px=sc.getImageData(0,0,width,64).data,start=particles.length;
  for(let y=1;y<64;y+=step)for(let x=1;x<width;x+=step){
   if(px[(y*width+x)*4+3]<100)continue;
   const id=particles.length;particles.push({k,rx:(x-width/2)/font,ry:(y-32)/font,seed:hash(id*3+11),seed2:hash(id*7+3),seed3:hash(id*13+5)});
  }
  groups.push({start,end:particles.length,width:width/font});
 }
}
function resize(){dpr=Math.min(devicePixelRatio||1,1.6);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);build();}
function setSong(index){
 song=(index+SONGS.length)%SONGS.length;t=0;last=0;impulses=[];fingers=[null,null,null];active.clear();
 document.querySelector('.song').textContent=SONGS[song].title;duration.textContent=fmt(SONGS[song].duration);build();
}
function fmt(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function renderLateralus(){
 const scale=Math.min(W*.48,H*.34,330),cx=W*.5,cy=H*.51;
 const states=groups.map((g,k)=>{const q=t*.21+k*2.39996;return{x:Math.sin(q*.79+k*.41)*.67+Math.sin(q*.39+k*1.7)*.21,y:Math.cos(q*.67+k*.7)*.49+Math.sin(q*.44+k*.13)*.15,z:Math.sin(q*.91+k*1.13)*.85,close:smooth(.55,.92,(Math.sin(t*.31-k*.94)+1)/2)};});
 let sum=0;const projected=[];
 for(const p of particles){
  const s=states[p.k],a=t*.45+p.k*.73,rx=p.rx*.17,ry=p.ry*.19,twist=a+p.rx*1.7,turb=.20+.14*Math.sin(t*.33+p.k),local=s.close*(.85+.15*Math.sin(t*.19+p.k)),dist=1-local;
  const x=s.x+rx*local+((rx*Math.cos(twist)-ry*Math.sin(twist))+Math.sin(p.rx*3.4+t*.68+p.seed*TAU)*turb+(p.seed-.5)*.22)*dist;
  const y=s.y+ry*local+((rx*Math.sin(twist)+ry*Math.cos(twist))+Math.cos(p.ry*4.1-t*.51+p.seed2*TAU)*turb+(p.seed2-.5)*.22)*dist;
  const z=s.z*.65+Math.sin(p.rx*5.7+t*.38+p.seed3*TAU)*.42*dist,depth=2.7/(2.7+z);
  projected.push({x:cx+x*scale*depth,y:cy+y*scale*depth,z,local,depth});sum+=local;
 }
 projected.sort((a,b)=>b.z-a.z);
 for(const p of projected){const alpha=(.13+.82*p.local)*(.35+.65*Math.max(0,Math.min(1,(1.35-p.z)/2.7)));ctx.fillStyle=p.local>.58?'rgba(246,215,165,'+alpha+')':'rgba(117,191,176,'+alpha+')';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.55,(.75+p.local*.55)*p.depth),0,TAU);ctx.fill();}
 coherence=sum/Math.max(1,particles.length);
}
function section(sec){
 if(sec<36)return{meter:[5,7],amp:.25,rate:1};
 if(sec<110)return{meter:[5,7],amp:.56,rate:1};
 if(sec<193)return{meter:[7,6,7,6],amp:.83,rate:1};
 if(sec<226)return{meter:[5,7,11],amp:.72,rate:1};
 if(sec<302)return{meter:[6,6,6,3,6],amp:.28,rate:.78};
 if(sec<348)return{meter:[9,10,6,7],amp:.72,rate:1};
 return{meter:[5,7,6,2],amp:.97,rate:1.06};
}
function renderSchism(){
 const cx=W*.5,cy=H*.47,scale=Math.min(W*.39,300),s=section(t),eighth=.28/s.rate;
 const pulse=t/eighth,beat=Math.floor(pulse),meter=s.meter[beat%s.meter.length];
 // A continuous score made of particle words, moving on an asymmetrically accented eighth-note clock.
 const accent=([1,.3,.6,.25,.85,1,.3,.75,.35,.7,.4,.8][beat%12]||.5);
 const flow=pulse*.115,span=groups.length,view=Math.max(1.8,Math.min(3.1,W/180));
 const wave=1+.10*Math.sin(pulse*TAU/12),band=scale*.18;
 ctx.lineWidth=1;
 for(let line=-2;line<=2;line++){
  ctx.strokeStyle='rgba(139,182,173,'+(.09+s.amp*.09)+')';ctx.beginPath();
  for(let x=0;x<=W;x+=7){const y=cy+line*band*.44+Math.sin(x*.008+t*.7+line*.7)*5*s.amp;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();
 }
 let sum=0;
 for(let k=0;k<span;k++){
  const g=groups[k],position=((k-flow)%(span+2)+(span+2))%(span+2)-1;
  if(position>view+1)continue;
  const centerX=cx+(position-1.1)*scale*.94*wave;
  const centerY=cy+Math.sin(k*1.8+t*.21)*band*.9;
  const perspective=.75+.25*Math.sin(k*1.3+t*.12);
  const widthFactor=Math.min(.31,1.35/Math.max(3,g.width));
  for(let i=g.start;i<g.end;i++){
   const p=particles[i],rx=p.rx*scale*widthFactor*perspective,ry=p.ry*scale*.25*perspective;
   let dx=0,dy=0,force=0;
   for(const impulse of impulses){
    const age=t-impulse.t;if(age<0||age>3.6)continue;
    const dist=Math.hypot(centerX+rx-impulse.x,centerY+ry-impulse.y),reach=75+age*95;
    const field=Math.exp(-Math.pow((dist-age*110)/reach,2))*impulse.power*Math.exp(-age*1.05);
    dx+=(p.seed-.5)*field*115;dy+=(p.seed2-.5)*field*125;force+=field;
   }
   for(const hold of active.values()){
    const age=t-hold.t,power=Math.min(1.7,.35+age*.9);
    const dist=Math.hypot(centerX+rx-hold.x,centerY+ry-hold.y),field=Math.exp(-dist*dist/(150*150))*power;
    dx+=(p.seed-.5)*field*100;dy+=(p.seed2-.5)*field*120;force+=field;
   }
   const shimmer=Math.sin(pulse*.72+k*1.4+p.seed*TAU)*s.amp*(3+accent*6);
   const x=centerX+rx+dx+shimmer,y=centerY+ry+dy+Math.sin(pulse*.4+p.seed2*TAU)*s.amp*4;
   const opacity=Math.max(0,Math.min(1,(x+50)/80,(W+50-x)/80))*(.34+.58*s.amp);
   ctx.fillStyle=force>.25?'rgba(238,189,127,'+opacity+')':'rgba(153,215,198,'+opacity+')';
   ctx.fillRect(x,y,1.4+Math.min(1.6,force),1.4+Math.min(1.6,force));sum+=Math.max(0,1-Math.min(1,force));
  }
 }
 coherence=sum/Math.max(1,particles.length);
 // The bar length shifts the score's breathing rather than stopping it.
 const phase=(pulse%12)/12;
 ctx.strokeStyle='rgba(225,174,112,'+(.14+accent*.17)+')';ctx.beginPath();ctx.moveTo(cx+(phase-.5)*scale*.25,cy-band*1.65);ctx.lineTo(cx+(phase-.5)*scale*.25,cy+band*1.65);ctx.stroke();
}
function frame(ms){
 const dt=Math.min(.05,(ms-last)/1000||.016);last=ms;t+=dt;
 if(t>=SONGS[song].duration){t=0;impulses=[];}
 ctx.fillStyle='#090d16';ctx.fillRect(0,0,W,H);
 const aura=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.min(W,H)*.7);aura.addColorStop(0,'#304b4a28');aura.addColorStop(1,'#090d1600');ctx.fillStyle=aura;ctx.fillRect(0,0,W,H);
 if(song===0)renderLateralus();else renderSchism();
 impulses=impulses.filter(i=>t-i.t<3.6);
 led.style.background='hsl('+(154-90*coherence)+' 77% '+(38+coherence*40)+'%)';
 led.style.boxShadow='0 0 '+(6+coherence*18)+'px hsl(150 83% 67% / '+(.3+coherence*.65)+')';
 led.style.transform='scale('+(0.9+coherence*.55)+')';
 clock.textContent=fmt(t);requestAnimationFrame(frame);
}
document.getElementById('prev').onclick=()=>setSong(song-1);
document.getElementById('next').onclick=()=>setSong(song+1);
document.getElementById('shuffle').onclick=()=>setSong(song===0?1:0);
const active=new Map(),surface=document.getElementById('touchsurface');
surface.addEventListener('pointerdown',e=>{
 if(song!==1||active.size>=3)return;
 e.preventDefault();surface.setPointerCapture(e.pointerId);
 const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 active.set(e.pointerId,{t,x,y});impulses.push({t,x,y,power:.65});
});
surface.addEventListener('pointermove',e=>{
 const v=active.get(e.pointerId);if(!v)return;
 const r=canvas.getBoundingClientRect();v.x=e.clientX-r.left;v.y=e.clientY-r.top;
});
function release(e){
 const v=active.get(e.pointerId);if(!v)return;
 const held=Math.max(0,t-v.t);impulses.push({t,x:v.x,y:v.y,power:Math.min(2.8,.75+held*1.4)});
 active.delete(e.pointerId);
}
surface.addEventListener('pointerup',release);surface.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
window.addEventListener('resize',resize);resize();setSong(0);requestAnimationFrame(frame);
</script></body></html>
