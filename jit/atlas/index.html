<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172a29"><title>The Atlas of Everything · Wikipedia, Elsewhere</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap');
:root{color-scheme:dark;--ink:#f3e5bc;--muted:#b4bfae;--gold:#f0c877;--edge:#60766d;--panel:#1c3331}*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;background:#102321;color:var(--ink);font:15px Nunito,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:var(--gold)}.shell{max-width:1120px;margin:auto;padding:16px 15px 45px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}.seal{font-size:32px;filter:drop-shadow(0 2px 8px #c7a35c66)}h1,h2,h3{font-family:'IM Fell English',Georgia,serif;font-weight:400}h1{font-size:clamp(23px,4.4vw,37px);margin:0;line-height:1.05}.sub{font-size:10px;letter-spacing:.18em;color:#b8c5ad;text-transform:uppercase}.badge{border:1px solid #6d7c69;padding:7px 10px;border-radius:30px;font-size:11px;color:#b9c6b0;text-decoration:none}.search{display:flex;gap:8px;margin:19px 0 12px}.search input{min-width:0;flex:1;background:#e7d7aa;color:#23302b;border:2px solid #b89d68;border-radius:12px;padding:13px 14px;outline:none}.search button,.action{background:#a96f44;color:#fff3d2;border:1px solid #e2b778;border-radius:12px;padding:10px 15px;font-weight:800}.search button:active,.action:active{transform:scale(.98)}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}.bar button{background:#28443d;color:#ebd9b4;border:1px solid #60776b;border-radius:99px;padding:8px 12px;font-size:12px}.bar button:hover,.tile:hover,.link:hover{border-color:#e3bd77;background:#355044}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,1fr);gap:14px}.map{min-height:500px;position:relative;overflow:hidden;border:2px solid #987a51;border-radius:18px;background:radial-gradient(ellipse at 46% 50%,#567a69 0%,#31594e 36%,#1b3b37 75%);box-shadow:inset 0 0 70px #071917,0 15px 30px #071a1788}.map:before{content:'';position:absolute;inset:0;opacity:.17;background:repeating-linear-gradient(0deg,transparent 0 30px,#e9dcb3 31px 32px),repeating-linear-gradient(90deg,transparent 0 30px,#e9dcb3 31px 32px);pointer-events:none}.map:after{content:'';position:absolute;inset:9px;border:1px solid #d5c28a60;border-radius:12px;pointer-events:none}.continent{position:absolute;inset:0;width:100%;height:100%;opacity:.42;pointer-events:none}.compass{position:absolute;right:20px;top:20px;font:27px Georgia;color:#ebd69b;opacity:.8}.map-title{position:absolute;top:26px;left:24px;font:italic 22px 'IM Fell English',Georgia;color:#f9df9f;text-shadow:0 2px 5px #112}.location{position:absolute;transform:translate(-50%,-50%);border:1px solid #f1d69c99;border-radius:13px;padding:8px 9px;background:#18362bd9;color:#fff0c8;box-shadow:0 5px 16px #0a1c18bb;min-width:92px;max-width:130px;text-align:center;line-height:1.25}.location .emoji{font-size:25px;display:block}.location .name{font:15px 'IM Fell English',Georgia}.location:hover{background:#45694c;border-color:#ffe4a1;z-index:2}.panel{border:1px solid #688074;border-radius:16px;background:linear-gradient(145deg,#24413b,#172b2b);padding:17px;min-height:270px;overflow-wrap:anywhere}.panel h2{font-size:28px;margin:0 0 8px;color:#f5d99e}.panel p{line-height:1.7;color:#e4dfc8;margin:9px 0}.panel .eyebrow{font-size:11px;letter-spacing:.14em;color:#d3b77b;text-transform:uppercase}.results{display:flex;flex-direction:column;gap:7px;margin-top:14px}.link,.tile{display:block;width:100%;text-align:left;background:#203c37;border:1px solid #58766a;color:#f7e4b5;padding:11px 12px;border-radius:10px;text-decoration:none}.link small{display:block;color:#bbccbc;margin-top:3px;font-size:11px}.tile{padding:13px}.article{grid-column:1/-1;min-height:350px}.article h2{font-size:clamp(28px,6vw,45px)}.article p{max-width:76ch}.article .article-body{white-space:pre-line;line-height:1.85}.article img{max-width:170px;max-height:150px;float:right;object-fit:contain;margin:0 0 12px 16px;border:1px solid #7e806a;border-radius:9px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.status{font-size:12px;color:#bbccb8;margin:13px 3px}.foot{margin-top:20px;text-align:center;font-size:11px;color:#9bb1a7}.empty{font-style:italic;color:#c3c3aa}.crumb{color:#d7c78f;font-size:12px;margin-bottom:8px}.error{color:#ffbf9e}.loading{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.5}}@media(max-width:700px){.layout{grid-template-columns:1fr}.map{min-height:440px}.panel{min-height:0}.columns{grid-template-columns:1fr}.location{min-width:80px;padding:7px 5px}.location .emoji{font-size:22px}.location .name{font-size:13px}.map-title{font-size:19px}.badge{font-size:10px}}
</style></head><body><div class="shell"><header class="mast"><a class="brand" href="#home"><span class="seal">🗺️</span><span><h1>The Atlas of Everything</h1><span class="sub">An impossible geography of human knowledge</span></span></a><a class="badge" href="https://en.wikipedia.org/" target="_blank" rel="noopener">Powered by Wikipedia ↗</a></header>
<form class="search" id="search"><input id="query" type="search" placeholder="Seek a person, place, creature, or impossible thing…" aria-label="Search Wikipedia" autocomplete="off"><button type="submit">🔎 Seek</button></form>
<nav class="bar"><button data-go="home">🏡 Atlas</button><button data-random>🎲 Teleport</button><button data-go="category:Science">🔭 Science</button><button data-go="category:History">📜 History</button><button data-go="category:Arts">🎨 Arts</button><button data-go="category:Geography">🌍 Geography</button><button id="back">↶ Back</button></nav>
<main id="view" aria-live="polite"></main><div class="status" id="status">Every door opens onto real knowledge.</div><footer class="foot">An unofficial cartographic costume for Wikipedia · The original encyclopedia remains the source · JIT / ATLAS 01</footer></div>
<script>
(()=>{'use strict';const view=document.getElementById('view'),status=document.getElementById('status'),query=document.getElementById('query');let token=0;const spots=[['🌿','The Living Woods','Biology',18,28],['🏰','The Kingdoms','History',68,24],['🪐','The Celestial Sea','Astronomy',82,55],['⚗️','The Alchemists','Chemistry',38,56],['🐉','The Bestiary','Zoology',16,75],['🎭','The Painted Isles','Art',62,79],['🧭','The Far Lands','Geography',48,37],['⚙️','The Clockwork Vale','Technology',85,86]];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const enc=s=>encodeURIComponent(s).replace(/%20/g,'_');function route(kind,value){location.hash=kind==='home'?'home':kind+':'+enc(value)}function anchor(kind,value,label,cls='link'){return '<a class="'+cls+'" href="#'+kind+':'+enc(value)+'">'+esc(label)+'</a>'}function setStatus(s){status.textContent=s}async function api(params){const u=new URL('https://en.wikipedia.org/w/api.php');const q={action:'query',format:'json',formatversion:'2',origin:'*',...params};Object.entries(q).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{mode:'cors'});if(!r.ok)throw Error('Wikipedia returned '+r.status);return r.json()}function load(){view.innerHTML='<section class="panel article"><h2 class="loading">Unrolling the parchment…</h2><p>Following a trail through the encyclopedia.</p></section>'}function fail(e){view.innerHTML='<section class="panel article"><h2>The fog is thick today</h2><p class="error">'+esc(e.message)+'</p><p>Wikipedia could not be reached. The atlas itself is still here.</p><button class="action" data-go="home">Return to the Atlas</button></section>';setStatus('Connection unavailable · try again')}
function home(){view.innerHTML='<div class="layout"><section class="map"><svg class="continent" viewBox="0 0 600 500" preserveAspectRatio="none"><path fill="#b5be84" d="M55 93Q122 8 194 72T312 83Q346 124 304 166T253 252Q203 290 147 240T68 251Q7 194 55 93ZM336 205Q414 123 501 165T548 292Q495 351 443 310T357 345Q307 285 336 205ZM166 349Q235 288 294 340T326 432Q265 490 192 451T166 349Z"/><path fill="none" stroke="#e9d9a3" stroke-width="4" stroke-dasharray="6 9" d="M110 130Q270 300 510 200M145 390Q290 250 515 410"/></svg><div class="map-title">Here Be Everything</div><div class="compass">✦ N</div>'+spots.map(([emoji,name,title,x,y])=>'<button class="location" style="left:'+x+'%;top:'+y+'%" data-article="'+esc(title)+'"><span class="emoji">'+emoji+'</span><span class="name">'+esc(name)+'</span></button>').join('')+'</section><aside class="panel"><div class="eyebrow">Field guide · Volume ∞</div><h2>Where shall we wander?</h2><p>Every landmark is a door into the living encyclopedia. Follow a trail of links, discover neighboring ideas, or leap to a random corner of knowledge.</p><div class="results">'+anchor('article','Wikipedia','📖 The Great Encyclopedia')+anchor('article','Voynich manuscript','🔮 An undeciphered mystery')+anchor('article','Bioluminescence','✨ Creatures that make light')+anchor('article','Antikythera mechanism','⚙️ An ancient machine')+'</div><p class="empty">There is no edge to this map.</p></aside></div>';setStatus('Eight landmarks · endless destinations · all roads lead to Wikipedia')}
async function article(title){const id=++token;load();setStatus('Consulting the archives…');try{const d=await api({titles:title,redirects:'1',prop:'extracts|pageimages|links|categories',explaintext:'1',exsectionformat:'plain',pithumbsize:'320',pllimit:'max',cllimit:'max'});if(id!==token)return;const p=d.query?.pages?.[0];if(!p||p.missing)throw Error('No article found for '+title);const links=(p.links||[]).filter(x=>x.ns===0).slice(0,32);const cats=(p.categories||[]).filter(x=>x.title).slice(0,15);const paragraphs=(p.extract||'').split(/\n\s*\n/).filter(Boolean);const body=paragraphs.slice(0,30).map(s=>'<p>'+esc(s)+'</p>').join('')||'<p>This article has no plain-text extract. Open its original page for the complete entry.</p>';view.innerHTML='<section class="panel article"><div class="crumb">'+anchor('home','','← Atlas')+' / Article</div><div class="eyebrow">A discovered territory</div><h2>'+esc(p.title)+'</h2>'+(p.thumbnail?.source?'<img alt="" src="'+esc(p.thumbnail.source)+'">':'')+'<div class="article-body">'+body+'</div><p><a target="_blank" rel="noopener" href="https://en.wikipedia.org/wiki/'+enc(p.title)+'">View original article ↗</a></p><div class="columns"><div><h3>🧭 Roads onward</h3><div class="results">'+(links.length?links.map(l=>anchor('article',l.title,l.title)).join(''):'<p>No roads charted here.</p>')+'</div></div><div><h3>🗂️ Neighboring regions</h3><div class="results">'+(cats.length?cats.map(c=>anchor('category',c.title.replace(/^Category:/,''),c.title.replace(/^Category:/,''))).join(''):'<p>No categories charted here.</p>')+'</div></div></div></section>';setStatus('Reading '+p.title+' · '+links.length+' onward links · '+cats.length+' categories')}catch(e){if(id===token)fail(e)}}
async function search(term){const id=++token;load();setStatus('Searching the atlas…');try{const d=await api({generator:'search',gsrsearch:term,gsrlimit:'25',prop:'pageimages|extracts',exintro:'1',explaintext:'1',exsentences:'2',pithumbsize:'100'});if(id!==token)return;const pages=(d.query?.pages||[]).sort((a,b)=>(a.index||0)-(b.index||0));view.innerHTML='<section class="panel article"><div class="eyebrow">Expedition results</div><h2>Trails for “'+esc(term)+'”</h2><div class="results">'+(pages.length?pages.map(p=>anchor('article',p.title,'📍 '+p.title, 'link')).join(''):'<p>No matching places found. Try another name.</p>')+'</div></section>';setStatus(pages.length+' possible destinations')}catch(e){if(id===token)fail(e)}}
async function category(name){const id=++token;load();setStatus('Charting the region…');try{const title='Category:'+name;const d=await api({list:'categorymembers',cmtitle:title,cmlimit:'50',cmtype:'page|subcat'});if(id!==token)return;const items=d.query?.categorymembers||[];view.innerHTML='<section class="panel article"><div class="eyebrow">Province of knowledge</div><h2>🗺️ '+esc(name)+'</h2><p>Paths branching from this category:</p><div class="results">'+(items.length?items.map(p=>anchor(p.ns===14?'category':'article',p.ns===14?p.title.replace(/^Category:/,''):p.title,(p.ns===14?'🌲 ':'📜 ')+p.title.replace(/^Category:/,''))).join(''):'<p>No paths charted. Try a different province.</p>')+'</div></section>';setStatus(items.length+' paths in '+name)}catch(e){if(id===token)fail(e)}}
async function random(){const id=++token;setStatus('Casting the teleportation spell…');try{const d=await api({generator:'random',grnnamespace:'0',grnlimit:'1'});if(id!==token)return;const p=d.query?.pages?.[0];if(p)route('article',p.title)}catch(e){if(id===token)fail(e)}}
function navigate(){const raw=decodeURIComponent(location.hash.slice(1).replace(/_/g,' '));const i=raw.indexOf(':'),kind=i<0?raw:raw.slice(0,i),val=i<0?'':raw.slice(i+1);if(kind==='article'&&val)article(val);else if(kind==='search'&&val){query.value=val;search(val)}else if(kind==='category'&&val)category(val);else{token++;home()}}
document.getElementById('search').onsubmit=e=>{e.preventDefault();const q=query.value.trim();if(q)route('search',q)};document.getElementById('back').onclick=()=>history.back();document.body.addEventListener('click',e=>{const b=e.target.closest('[data-article],[data-go],[data-random]');if(!b)return;if(b.dataset.article)route('article',b.dataset.article);else if(b.hasAttribute('data-random'))random();else if(b.dataset.go){const s=b.dataset.go;if(s.includes(':')){const i=s.indexOf(':');route(s.slice(0,i),s.slice(i+1))}else route(s,'')}});window.addEventListener('hashchange',navigate);navigate();
})();
</script></body></html>
