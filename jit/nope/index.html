<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0d12"><title>NOPE — Make the burden disappear</title>
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none}button,a{-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent}button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}button:focus-visible,a:focus-visible{outline:2px solid #ff8585;outline-offset:3px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0c0d12;color:#f3f0e9;font-family:system-ui,-apple-system,sans-serif}body{background:radial-gradient(ellipse at 50% 24%,#351719 0,transparent 55%),#0c0d12}main{height:100dvh;max-width:720px;margin:auto;padding:12px 14px 12px;text-align:center;display:flex;flex-direction:column;justify-content:space-around;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:.3em;color:#aa9e9a;font-weight:700}h1{font-size:clamp(66px,18vw,136px);letter-spacing:-.09em;line-height:1;margin:4px 0 2px;font-weight:950}p{color:#bbb4af;line-height:1.55}.tag{margin:0 auto 6px;max-width:360px}.button-wrap{padding:5px 0 8px}#nope{position:relative;width:min(36dvh,48vw,210px);height:min(36dvh,48vw,210px);border-radius:50%;border:12px solid #26252b;background:radial-gradient(circle at 35% 24%,#ff7670 0,#f02b2d 32%,#a40013 78%);box-shadow:0 13px 0 #61000a,0 22px 38px #000b,inset 0 5px 10px #fff5;cursor:pointer;color:white;font-weight:950;font-size:clamp(37px,10vw,66px);letter-spacing:-.07em;text-shadow:0 3px 3px #5c000b;touch-action:manipulation;transition:transform .1s,box-shadow .1s}#nope:active,#nope.pressed{transform:translateY(10px);box-shadow:0 3px 0 #61000a,0 8px 20px #000b,inset 0 4px 12px #fff4}#message{min-height:30px;font-size:13px;letter-spacing:.08em;color:#e6b8b3;font-weight:700}.divider{margin:5px 0;border:0;border-top:1px solid #383037}.intro{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#afa5a1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}.tile{border:1px solid #393136;background:#19171d;border-radius:14px;padding:7px 6px;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:inherit}.tile:hover{border-color:#9f5253}.emoji{font-size:clamp(16px,3dvh,25px)}.name{font-size:clamp(10px,1.65dvh,13px);font-weight:800}.soon{font-size:10px;letter-spacing:.18em;color:#ff7778;font-weight:800}.footer{font-size:11px;color:#8b8588;margin-top:7px}.flash{animation:flash .28s}@keyframes flash{50%{filter:brightness(2)}}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-height:650px){h1{font-size:clamp(48px,10dvh,85px)}.tag{font-size:12px}.footer{font-size:9px}.tile{padding:4px}.eyebrow{font-size:9px}#nope{width:min(28dvh,42vw);height:min(28dvh,42vw);font-size:36px}.grid{gap:4px}}\n</style></head><body><main><div class="eyebrow">RAVNICA / DISENCHANT</div><h1>NOPE<span style="color:#f23b3f">.</span></h1><p class="tag">Make the burden disappear.<br>Not merely easier to carry.</p><div class="button-wrap"><button id="nope" aria-label="Press the NOPE button">NOPE</button></div><div id="message" aria-live="polite">PRESS TO REJECT THE ABSURD</div><hr class="divider"><div class="intro">Choose a tollbooth to dismantle</div><section class="grid" id="grid"></section><p class="footer">NO ACCOUNTS · NO ADS · NO TELEMETRY · NO FALSE CLAIMS<br>Everything below is a promise of intent. Nothing is live yet.</p></main>
<script>
const entries=[["🧾","Medical bills"],["💊","Healthcare access"],["💧","Clean water"],["🔒","Vendor lock-in"],["💸","Subscription traps"],["🏛️","Bureaucracy"],["🛠️","Repair barriers"],["📚","Knowledge gates"],["⚡","Energy tollbooths"]];
const grid=document.querySelector("#grid"),msg=document.querySelector("#message"),button=document.querySelector("#nope");
entries.forEach(([icon,name])=>{const b=document.createElement("button");b.className="tile";b.innerHTML='<span class="emoji">'+icon+'</span><span class="name">'+name+'</span><span class="soon">COMING SOON</span>';b.addEventListener("click",()=>{msg.textContent="NOPE TO "+name.toUpperCase()+". COMING SOON.";button.classList.add("pressed");setTimeout(()=>button.classList.remove("pressed"),140)});grid.appendChild(b)});
const sayings=["NOPE.","NOT YOUR BURDEN.","TOLLBOOTH REJECTED.","OBLIGATION DECLINED.","MAKE IT UNNECESSARY.","THE WAND BELONGS TO EVERYONE."];
let count=0;button.addEventListener("click",()=>{msg.textContent=sayings[count++%sayings.length];button.classList.add("pressed");document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash");setTimeout(()=>button.classList.remove("pressed"),150)});
</script></body></html>
