:root{--ink:#17201b;--ivory:#f4eddf;--brass:#d9b981;--dim:#e4dcccbb}*{box-sizing:border-box}html,body{height:100%;overflow:hidden;margin:0;background:var(--ink);color:var(--ivory);font-family:system-ui,-apple-system,sans-serif}a,a:link,a:visited,a:active{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}button,a,.scene,.image-control,.hotspot{-webkit-tap-highlight-color:transparent}button:focus:not(:focus-visible),a:focus:not(:focus-visible){outline:none}button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:3px}img{-webkit-user-drag:none;user-select:none}button{touch-action:manipulation}#app{position:relative;width:100%;height:100svh;overflow:hidden;isolation:isolate;touch-action:pan-x}.scene{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 40%,#4d5144,#18211c 85%)}.scene:active{cursor:grabbing}.backdrop{position:absolute;inset:-7%;background-position:center;background-size:cover;transform:translate3d(var(--pan,0px),var(--tilt,0px),0) scale(1.11);transition:opacity .9s ease,filter .5s ease;will-change:transform;filter:brightness(var(--brightness,.8)) saturate(1.03)}.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0e1817dd 0%,transparent 47%,#0d1515aa 100%)}.light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at var(--sun-x,75%) var(--sun-y,38%),#f8d8a12e,transparent 65%);mix-blend-mode:screen;transition:background .3s}.glass{position:absolute;bottom:10%;left:12%;width:44%;height:30%;background:conic-gradient(from 80deg,#e5ad6330,#7c9f8b22,#a45d9a2b,#d7b75c33,#e5ad6330);filter:blur(26px);transform:skew(-30deg) rotate(-8deg) translateX(var(--glass-x,0px));opacity:var(--glass-opacity,.3);pointer-events:none;transition:opacity .3s,transform .3s}.grain{position:absolute;inset:0;opacity:.08;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 150 1 </style></head><body><div id="app"><div class="scene" id="scene" aria-label="Explore Shakespeare Chateau architectural scenes" role="region"><div class="backdrop" id="photo"></div><div class="light" id="light"></div><div class="glass" id="glass"></div><div class="grain"></div><div class="frame"></div><div class="hotspots" id="hotspots"></div></div><header class="top"><div class="brand">SC <span style="color:var(--brass)">·</span> 1885<small>SHAKESPEARE CHATEAU</small></div><div class="icons"><button class="icon" id="timeBtn" aria-label="Light and time">☼</button><button class="icon" id="mapBtn" aria-label="Explore places">⌖</button><button class="icon" id="infoBtn" aria-label="Property information">ⓘ</button></div></header><div class="content"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="description"></p></div><div class="caption" id="caption"></div><footer class="bottom"><button class="action" id="backBtn" aria-label="Go back">← Back</button><div class="progress" id="progress"></div><button class="action primary" id="nextBtn">Enter →</button></footer><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Architectural discovery"><button class="close" id="closeBtn" aria-label="Close">×</button><div id="sheetBody"></div></section></div><script>
const base='https://media.relahq.com/public/styles/image_manage_preview/s3/property-images/prop-nid-238404426/';
const scenes=[
{id:'arrival',name:'The Approach',eyebrow:'809 Hall Street · St. Joseph, Missouri',title:'A house beyond time.',desc:'An extraordinary American inheritance. Come closer.',img:base+'005-809_hall_st_2026-104_wts_211.jpg',next:'threshold',action:'Approach',caption:'The estate · 1885',hot:[{x:73,y:49,label:'The estate',kind:'estate'}]},
{id:'threshold',name:'The Threshold',eyebrow:'Chapter I · Arrival',title:'Cross the threshold.',desc:'An invitation into a century of wood, stone, glass and light.',img:base+'022-809_hall_st_2026-14_140.jpg',next:'hall',action:'Enter',caption:'Original architectural detail',hot:[{x:48,y:43,label:'Woodwork',kind:'wood'},{x:80,y:55,label:'History',kind:'history'}]},
{id:'hall',name:'The Music Room',eyebrow:'Chapter II · The Living Interior',title:'Walls that remember.',desc:'A room of carved timber, filtered daylight and an extraordinary painted landscape.',img:base+'016-809_hall_st_2026-8_788.jpg',next:'panorama',action:'Explore the panorama',caption:'Zuber Eldorado · installed circa 1920',hot:[{x:29,y:38,label:'Eldorado',kind:'wallpaper'},{x:79,y:42,label:'Stained glass',kind:'glass'},{x:55,y:66,label:'Craftsmanship',kind:'wood'}]},
{id:'panorama',name:'The Eldorado Panorama',eyebrow:'Chapter III · Craft Across Centuries',title:'A landscape in layers.',desc:'An immense hand-printed panorama, made to transform a room into another world.',img:base+'017-809_hall_st_2026-9_629.jpg',next:'arrival',action:'Return outside',caption:'The music room · Zuber panorama',hot:[{x:24,y:43,label:'Printing layers',kind:'wallpaper'},{x:72,y:47,label:'The estate',kind:'estate'}]}
];
const facts={
estate:['The estate','The Chateau stands on 1.83 acres and encompasses the main residence, a carriage house with three apartments, and the companion building at 819 Hall Street. The official listing currently identifies the property as pending / under contract.'],
wood:['Carved by hand','The interiors preserve elaborate original woodwork in cherry, mahogany, oak and walnut. The stairway features carved dragon newel posts. The visual route between photographs is interpretive, not a measured walkthrough.'],
history:['The long nineteenth century','Completed in 1885, the Chateau was designed by architect Edmund Jacques Eckel for Colonel Nathan Phipps Ogden. Its historic Hall Street setting was once known as Millionaires’ Row.'],
wallpaper:['Eldorado · Zuber','Installed circa 1920, the rare Eldorado panoramic wallpaper was made using 1,554 hand-carved woodblocks and 210 colors, according to the listing materials. Imagine each color registered, printed, and layered by hand.'],
glass:['Forty-seven windows','The estate retains 47 original stained-glass windows. As sunlight changes, their colors animate the interior. The projected light in this experience is interpretive, not a surveyed solar simulation.']
};
let idx=0,stack=[],sun=.63,pan=0,tilt=0,drag=null,view='';const $=id=>document.getElementById(id),motion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){const s=scenes[idx];$('eyebrow').textContent=s.eyebrow;$('title').textContent=s.title;$('description').textContent=s.desc;$('caption').textContent=s.caption;$('nextBtn').textContent=s.action+' →';$('backBtn').disabled=!stack.length;$('backBtn').style.opacity=stack.length?'1':'.35';$('photo').style.backgroundImage='url("'+s.img+'")';$('hotspots').innerHTML='';s.hot.forEach(h=>{const b=document.createElement('button');b.className='hotspot';b.style.left=h.x+'%';b.style.top=h.y+'%';b.setAttribute('aria-label','Discover '+h.label);b.innerHTML='<span>'+h.label+'</span>';b.onclick=()=>openFact(h.kind);$('hotspots').append(b)});$('progress').innerHTML='<div class="dots">'+scenes.map((_,i)=>'<span class="'+(i===idx?'on':'')+'"></span>').join('')+'</div><span>'+String(idx+1).padStart(2,'0')+' / 04</span>';applySun();history.replaceState({idx,stack},'',location.pathname+location.search+'#'+s.id);try{localStorage.setItem('chateau-world-v1',JSON.stringify({idx,sun}))}catch{}}
function go(i,push=true){if(push)stack.push(idx);idx=i;pan=0;tilt=0;$('photo').style.setProperty('--pan','0px');$('photo').style.setProperty('--tilt','0px');closeSheet();render()}function back(){if(view){closeSheet();return}if(stack.length){go(stack.pop(),false)}else go(0,false)}
function openSheet(html,name){view=name;$('sheetBody').innerHTML=html;$('sheet').classList.add('open');$('sheet').scrollTop=0}function closeSheet(){view='';$('sheet').classList.remove('open')}
function openFact(kind){const [title,body]=facts[kind];let extra='';if(kind==='wallpaper')extra='<div class="glassDemo" id="layersDemo"></div><input class="range" id="layers" aria-label="Printing layers" type="range" min="0" max="6" value="6"><div class="timeLabels"><span>Blank paper</span><span>Layered printing · interpretive</span></div>';if(kind==='glass')extra='<div class="glassDemo"></div><button class="action" style="color:#263128;border-color:#826a48" id="openTime">Move the sunlight ↗</button>';openSheet('<div class="kicker">Architectural discovery</div><h2>'+title+'</h2><p>'+body+'</p>'+extra+'<p class="source">Explore the <a target="_blank" rel="noopener" href="https://www.shakespeareonhall.com/">official property archive ↗</a></p>',kind);if(kind==='wallpaper')$('layers').oninput=e=>{$('layersDemo').style.opacity=.2+Number(e.target.value)/7};if(kind==='glass')$('openTime').onclick=openTime}
function applySun(){const v=sun;$('photo').style.setProperty('--brightness',(.43+v*.73).toFixed(2));$('light').style.setProperty('--sun-x',(12+v*77)+'%');$('light').style.setProperty('--sun-y',(28+(1-v)*25)+'%');$('glass').style.setProperty('--glass-opacity',idx>0?(.15+v*.7):.06);$('glass').style.setProperty('--glass-x',(v*85-40)+'px');$('timeBtn').textContent=v<.27?'☾':'☼'}
function openTime(){openSheet('<div class="kicker">The breathing house</div><h2>Move the light.</h2><p>Draw the sun through the day. Watch the color and atmosphere of the room change. A poetic simulation of daylight, not a surveyed solar model.</p><input id="sun" class="range" type="range" min="0" max="100" value="'+Math.round(sun*100)+'" aria-label="Time of day"><div class="timeLabels"><span>Dawn</span><span>Midday</span><span>Dusk</span></div>','time');$('sun').oninput=e=>{sun=Number(e.target.value)/100;applySun()}}
function openMap(){openSheet('<div class="kicker">Spatial journey · interpretive route</div><h2>Where shall we go?</h2><div class="navlist">'+scenes.map((s,i)=>'<button data-go="'+i+'">'+String(i+1).padStart(2,'0')+' &nbsp; '+s.name+'</button>').join('')+'</div><p class="source">These are connected editorial viewpoints, not a measured floor plan. <a target="_blank" rel="noopener" href="https://www.shakespeareonhall.com/">View the official floor plans and 3D tour ↗</a></p>','map');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)))}
function openInfo(){openSheet('<div class="kicker">809 Hall Street · Missouri</div><h2>Shakespeare Chateau.</h2><p>1885 · 9,850 sq ft · 1.83 acres · 47 original stained-glass windows. The estate includes a carriage house and the 819 Hall Street companion structure.</p><p>The official property website currently marks the listing <strong>Pending / Under Contract</strong>. This independent architectural study is not a live offer or an authorized brokerage website.</p><div class="navlist"><a class="action" href="https://www.shakespeareonhall.com/" target="_blank" rel="noopener">Official property and agent ↗</a><a class="action" href="https://www.shakespeareonhall.com/" target="_blank" rel="noopener">119 photos · plans · 3D tour ↗</a></div>','info')}
$('nextBtn').onclick=()=>go(scenes.findIndex(s=>s.id===scenes[idx].next));$('backBtn').onclick=back;$('closeBtn').onclick=closeSheet;$('timeBtn').onclick=openTime;$('mapBtn').onclick=openMap;$('infoBtn').onclick=openInfo;document.addEventListener('keydown',e=>{if(e.key==='Escape')back();if(e.key==='ArrowRight'&&!view)go((idx+1)%scenes.length);if(e.key==='ArrowLeft'&&!view)back()});
const scene=$('scene');scene.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,px:pan,py:tilt};scene.setPointerCapture(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;pan=Math.max(-45,Math.min(45,drag.px+(e.clientX-drag.x)*.17));tilt=Math.max(-25,Math.min(25,drag.py+(e.clientY-drag.y)*.10));$('photo').style.setProperty('--pan',pan+'px');$('photo').style.setProperty('--tilt',tilt+'px')});scene.addEventListener('pointerup',()=>drag=null);scene.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('popstate',()=>{const i=scenes.findIndex(s=>'#'+s.id===location.hash);if(i>=0){idx=i;stack=[];closeSheet();render()}});try{const p=JSON.parse(localStorage.getItem('chateau-world-v1')||'{}');if(typeof p.sun==='number')sun=p.sun}catch{}const hash=scenes.findIndex(s=>'#'+s.id===location.hash);if(hash>=0)idx=hash;render();if(!motion){let last=0;function tick(t){if(t-last>110){last=t;const v=Math.sin(t/3700)*2;$('light').style.opacity=(.89+v*.03).toFixed(3)}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script></body></html>
