<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d19"><title>Djinn · Lamp</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#100d19;color:#eee7d8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#302143,#100d19 68%)}main{width:min(100%,560px);display:grid;gap:16px}h1{font-family:Georgia,serif;font-weight:400;letter-spacing:.08em;font-size:clamp(2.4rem,9vw,4rem);text-align:center;margin:0;color:#e8c68d}small{color:#a99cba;text-align:center}textarea{width:100%;min-height:140px;resize:vertical;background:#1b1726;border:1px solid #665476;border-radius:14px;color:#fff1dd;padding:17px;font:inherit;font-size:1.1rem}button{cursor:pointer;border:1px solid #a88350;background:#33253b;color:#f7dfb4;border-radius:14px;padding:15px;font:inherit;font-size:1rem}button:disabled{opacity:.45;cursor:wait}.buttons{display:grid;grid-template-columns:1fr auto;gap:10px}#result{white-space:pre-wrap;overflow-wrap:anywhere;min-height:110px;padding:18px;border:1px solid #42384c;border-radius:14px;background:#161320;line-height:1.5}#status{min-height:1.4em;text-align:center;color:#b4a2bf}#disconnect{border-color:#544761;padding-inline:20px}a{color:#d9b679}footer{text-align:center;font-size:.75rem;color:#a69ab2}
</style></head><body><main><h1>✦ Djinn ✦</h1><small>One intention. Borrowed cognition. A bottled result.</small><div class="buttons"><button id="connect">Connect a lamp</button><button id="disconnect" hidden title="Disconnect">✕</button></div><textarea id="intent" placeholder="What shall we make?">Imagine a tiny dragon that learns to fly. Describe the first playable interaction in three sentences.</textarea><button id="rub" disabled>Rub the lamp ✧</button><div id="status" role="status">Not connected</div><button id="eye" aria-expanded="false" aria-controls="diagnostics" title="Observation">👁</button><pre id="diagnostics" hidden style="white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#211a2c;border-radius:12px;font-size:.78rem"></pre><section id="result" aria-live="polite">The lamp is waiting.</section><footer>Authorization belongs to you. Djinn never sends your credentials to its own server. <a href="https://openrouter.ai" target="_blank" rel="noopener">Powered by your OpenRouter account</a>.</footer></main>
<script>
(()=>{'use strict';
const base=location.origin+location.pathname, $=id=>document.getElementById(id), status=$('status'), result=$('result');
let key=sessionStorage.getItem('djinn.openrouter.key')||'',busy=false;
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
function random(n){const bytes=crypto.getRandomValues(new Uint8Array(n));return Array.from(bytes,b=>alphabet[b%alphabet.length]).join('')}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function state(){ $('rub').disabled=!key||busy;$('connect').textContent=key?'Lamp connected ✓':'Connect a lamp';$('connect').disabled=!!key||busy;$('disconnect').hidden=!key; }
function message(t){status.textContent=t}
$('eye').onclick=()=>{const d=$('diagnostics');d.hidden=!d.hidden;$('eye').setAttribute('aria-expanded',String(!d.hidden))};
$('connect').onclick=async()=>{try{const verifier=random(64),nonce=random(24);sessionStorage.setItem('djinn.pkce',JSON.stringify({verifier,nonce,created:Date.now()}));const challenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));const url=new URL('https://openrouter.ai/auth');url.searchParams.set('callback_url',base);url.searchParams.set('code_challenge',challenge);url.searchParams.set('code_challenge_method','S256');url.searchParams.set('state',nonce);url.searchParams.set('key_label','JIT Djinn');location.assign(url.href)}catch(e){message('Cannot begin authorization: '+e.message)}};
$('disconnect').onclick=()=>{key='';sessionStorage.removeItem('djinn.openrouter.key');state();message('Disconnected. Revoke the key in OpenRouter settings if desired.')};
async function callback(){const u=new URL(location.href),code=u.searchParams.get('code'),error=u.searchParams.get('error');if(!code&&!error)return;history.replaceState(null,'',base);if(error){message('Authorization declined: '+error);return}const pending=JSON.parse(sessionStorage.getItem('djinn.pkce')||'null');sessionStorage.removeItem('djinn.pkce');if(!pending||pending.nonce!==u.searchParams.get('state')||Date.now()-pending.created>600000){message('Authorization expired or state mismatch. Reconnect.');return}busy=true;state();message('Opening the lamp…');try{const r=await fetch('https://openrouter.ai/api/v1/auth/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,code_verifier:pending.verifier,code_challenge_method:'S256'})});const data=await r.json();if(!r.ok||!data.key)throw Error(data.error?.message||'Key exchange failed ('+r.status+')');key=data.key;sessionStorage.setItem('djinn.openrouter.key',key);message('Lamp connected.')}catch(e){message('Connection failed: '+e.message)}finally{busy=false;state()}}
$('rub').onclick=async()=>{if(!key||busy)return;busy=true;state();message('Thinking…');result.textContent='✧';$('diagnostics').textContent='Awaiting provider response…';try{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),90000);let r;try{r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal:ctrl.signal,headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','HTTP-Referer':base,'X-Title':'JIT Djinn'},body:JSON.stringify({model:'openrouter/free',messages:[{role:'system',content:'You are Djinn, a creative prototyping collaborator. Be concrete, imaginative and concise.'},{role:'user',content:$('intent').value}],stream:false})})}finally{clearTimeout(timer)}const data=await r.json();if(!r.ok)throw Error(data.error?.message||'Provider unavailable ('+r.status+')');const choice=data.choices?.[0],msg=choice?.message||{};result.textContent=typeof msg.content==='string'?msg.content:(Array.isArray(msg.content)?msg.content.map(p=>p.text||'').join(''):'')||'The lamp returned no text.';$('diagnostics').textContent=JSON.stringify({requestedModel:'openrouter/free',servedModel:data.model||null,responseId:data.id||null,finishReason:choice?.finish_reason||null,role:msg.role||null,contentType:typeof msg.content,contentLength:result.textContent.length,reasoningPresent:!!msg.reasoning,refusalPresent:!!msg.refusal,usage:data.usage?{promptTokens:data.usage.prompt_tokens,completionTokens:data.usage.completion_tokens}:null},null,2);message('✧')}catch(e){result.textContent='The lamp did not answer.';$('diagnostics').textContent=JSON.stringify({error:e.name,message:e.message},null,2);message(e.name==='AbortError'?'Timed out. Try again.':e.message)}finally{busy=false;state()}};
state();callback();
})();
</script></body></html>
