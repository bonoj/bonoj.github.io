<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09131c"><title>JOB LATTICE · Hunt</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#09131c;color:#e5f2f2}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}#app{height:100%;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #244250;gap:8px}header strong{letter-spacing:.16em}button,input,select{font:inherit;color:inherit;background:#132c3b;border:1px solid #386071;border-radius:9px;padding:10px}button{cursor:pointer}button:disabled{opacity:.4}main{flex:1;min-height:0;display:flex;flex-direction:column}#filters{display:flex;gap:6px;padding:10px;overflow-x:auto}#filters input{min-width:120px;flex:1}#filters select{max-width:145px}#stats{padding:0 12px 10px;color:#a1c0ca;font-size:12px}#jobs{flex:1;min-height:0;overflow:auto;padding:0 10px 10px;display:grid;align-content:start;gap:8px}.job{border:1px solid #284a59;background:#102633;border-radius:12px;padding:12px;display:grid;gap:8px}.job h3{font-size:15px;margin:0}.meta{font-size:11px;color:#a9c3cd}.summary{font-size:12px;line-height:1.5;color:#d2e1e4;max-height:5em;overflow:hidden}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button,.actions a{padding:7px 9px;font-size:12px;border-radius:8px;border:1px solid #426678;color:#e7f4f5;text-decoration:none;background:#193746}.actions .chosen{background:#30556a}#status{font-size:11px;color:#a8bec7}footer{border-top:1px solid #244250;border-bottom:0}#eye{position:fixed;inset:0;background:#09131c;padding:14px;display:none;flex-direction:column;gap:10px;z-index:2}#eye.open{display:flex}#eye textarea{flex:1;min-height:0;width:100%;background:#102633;color:#d8eeee;font:11px monospace;padding:12px}
</style></head><body><div id="app"><header><strong>◈ JOB LATTICE</strong><span id="status">Loading</span><button id="refresh" title="Refresh feed">↻</button></header><main><div id="filters"><input id="query" placeholder="Role, company, keyword"><select id="state"><option value="new">New</option><option value="saved">Saved</option><option value="applied">Applied</option><option value="passed">Passed</option><option value="all">All</option></select><select id="sort"><option value="score">Fit</option><option value="date">Newest</option></select></div><div id="stats"></div><div id="jobs"></div></main><footer><span id="build">PUBLIC FEED · local decisions</span><button id="eyeButton">👁</button></footer></div><section id="eye"><button id="close">Close</button><button id="export">Copy decisions JSON</button><textarea id="json" readonly></textarea></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),storageKey='job-lattice.decisions.v1';let jobs=[],feed={},decisions={};
try{decisions=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
const terms=[['interactive',6],['simulation',7],['research',5],['prototype',6],['creative',5],['systems architect',7],['principal',5],['staff',3],['r&d',7],['graphics',4],['game',4],['tools',4],['android',2],['kotlin',2],['unity',3],['three.js',3]];
function score(j){const t=(j.title+' '+j.description).toLowerCase();return terms.reduce((s,[term,w])=>s+(t.includes(term)?w:0),0)}
function text(tag,value,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=value;return e}
function save(id,status){decisions[id]={status,at:new Date().toISOString()};localStorage.setItem(storageKey,JSON.stringify(decisions));render()}
function render(){const q=$('query').value.toLowerCase(),state=$('state').value;let list=jobs.filter(j=>(j.title+' '+j.company+' '+j.description).toLowerCase().includes(q)&& (state==='all'||(decisions[j.id]?.status||'new')===state));list.sort($('sort').value==='date'?(a,b)=>String(b.published).localeCompare(String(a.published)):(a,b)=>score(b)-score(a));$('stats').textContent=jobs.length+' ingested · '+list.length+' shown · '+Object.values(decisions).filter(x=>x.status==='applied').length+' applied · '+(feed.fetched_at||'no feed');const root=$('jobs');root.replaceChildren();for(const j of list.slice(0,200)){const card=text('article','', 'job'),title=text('h3',j.title),meta=text('div',j.company+' · '+j.location+' · '+(j.published||'undated')+' · fit '+score(j),'meta'),summary=text('div',j.description.slice(0,330),'summary'),actions=text('div','','actions');for(const [label,st] of [['☆ Save','saved'],['✓ Applied','applied'],['✕ Pass','passed'],['↶ Reset','new']]){const b=text('button',label,decisions[j.id]?.status===st?'chosen':'');b.onclick=()=>save(j.id,st);actions.append(b)}const a=text('a','↗ Apply');a.href=j.apply_url;a.target='_blank';a.rel='noopener noreferrer';actions.prepend(a);card.append(title,meta,summary,actions);root.append(card)}if(!list.length)root.append(text('p','No matching jobs.'))}
async function load(){ $('status').textContent='Fetching';try{const r=await fetch('./jobs.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);feed=await r.json();jobs=Array.isArray(feed.jobs)?feed.jobs.filter(j=>j.id&&j.apply_url):[];$('status').textContent=jobs.length+' jobs';render()}catch(e){$('status').textContent='Feed unavailable';$('stats').textContent=String(e)}}
for(const id of ['query','state','sort'])$(id).addEventListener(id==='query'?'input':'change',render);
$('refresh').onclick=load;$('eyeButton').onclick=()=>{const e=$('eye');e.classList.add('open');$('json').value=JSON.stringify({schema:'job-lattice-eye/v1',feed:{fetched_at:feed.fetched_at,count:jobs.length,sources:feed.sources},decisions},null,2)};$('close').onclick=()=>$('eye').classList.remove('open');$('export').onclick=()=>navigator.clipboard.writeText($('json').value).then(()=>{$('export').textContent='Copied ✓'}).catch(()=>{$('json').focus();$('json').select()});load();
})();
</script></body></html>
