<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172a29"><title>Hilltop · Rock Paper Saddam</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c1a;color:#f1f0e5;font-family:system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}header,.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:18px;margin:0}button{cursor:pointer;touch-action:manipulation;color:inherit}.pill{background:#293c37;border:1px solid #52665c;border-radius:99px;padding:8px 12px}.arena{position:relative;width:100%;height:min(51vh,390px);min-height:280px;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at center,#44573c 0%,#283c32 42%,#172a29 100%);border:1px solid #53675b}.paths{position:absolute;inset:0;width:100%;height:100%;opacity:.24}.hill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;background:radial-gradient(circle,#d6bc75,#8b7945 62%,#554b36 80%,transparent 82%);border:3px dashed #e8d8a088;box-shadow:0 0 35px #d6b96933}.hill:after{content:"👑";position:absolute;left:50%;top:3px;transform:translateX(-50%);font-size:22px}.unit{position:absolute;transform:translate(-50%,-50%);font-size:31px;line-height:1;pointer-events:none;filter:drop-shadow(0 3px 2px #0006)}.unit.king{filter:drop-shadow(0 0 8px #ffdd66)}.impact{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:23px;animation:pop .55s ease-out forwards}@keyframes pop{0%{opacity:1;scale:.5}60%{opacity:1;scale:1.3}100%{opacity:0;scale:1.8}}.tag{position:absolute;font-size:11px;color:#e4e8d9}.banner{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);background:#13251edb;color:white;padding:6px 12px;border-radius:99px;font-size:12px;white-space:nowrap}.banks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.bank{border:1px solid #43574d;border-radius:13px;padding:8px;min-width:0;background:#1c302b}.bank h2{font-size:12px;margin:0 0 7px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.choices button{background:#30453c;border:1px solid #53675b;border-radius:9px;font-size:26px;min-height:46px}.choices button:active{transform:scale(.9)}.score,.hint{font-size:11px;color:#b7c4b9}.score{margin-top:7px}.foot{align-items:flex-start}.foot .hint{max-width:70%}
</style></head><body><main>
<header><h1>👑 Hilltop <span style="font-weight:400;font-size:12px;color:#a6b8ab">Rock Paper Saddam</span></h1><button class="pill" id="reset">↺ Reset</button></header>
<section class="arena" id="field" aria-label="Three faction king of the hill battlefield">
<svg class="paths" viewBox="0 0 360 315" preserveAspectRatio="none"><path d="M180 158 L55 55 M180 158 L305 55 M180 158 L180 290" stroke="#d9d4b3" stroke-width="25" stroke-linecap="round" fill="none"/><path d="M180 158 L55 55 M180 158 L305 55 M180 158 L180 290" stroke="#665b41" stroke-width="2" stroke-dasharray="5 7" fill="none"/></svg>
<div class="hill"></div><div id="units" style="position:absolute;inset:0"></div><div id="effects" style="position:absolute;inset:0;pointer-events:none"></div>
<div class="tag" style="top:10px;left:12px">🟥 RED</div><div class="tag" style="top:10px;right:12px">🟦 BLUE</div><div class="tag" style="bottom:10px;left:50%;transform:translateX(-50%)">🟩 GREEN</div><div id="banner" class="banner">The hill awaits a champion</div>
</section>
<section class="banks" id="banks"></section>
<div class="foot"><span class="hint" id="status">Tap any emoji to deploy. Tap repeatedly for a swarm.</span><button class="pill" id="chaos">🎲 Chaos</button></div>
</main>
<script>
(()=>{
const field=document.querySelector('#field'),layer=document.querySelector('#units'),fx=document.querySelector('#effects'),banner=document.querySelector('#banner'),status=document.querySelector('#status'),banks=document.querySelector('#banks');
const teams=[
{name:'Beasts',emoji:['🦖','🦍','🦂','🐝'],power:[5,4,2,1],speed:[.75,1,1.35,1.9],start:[.13,.16],color:'#e36c60'},
{name:'Ocean',emoji:['🦈','🐙','🦀','🐡'],power:[5,4,2,1],speed:[1.2,.9,1.45,1.65],start:[.87,.16],color:'#6d9bea'},
{name:'Oddities',emoji:['🛸','🍄','🔥','🪨'],power:[4,2,3,5],speed:[1.8,.8,1.5,.55],start:[.5,.89],color:'#6cc58b'}];
let units=[],king=null,scores=[0,0,0],last=0,seq=0;
const random=(a,b)=>a+Math.random()*(b-a),center=()=>({x:field.clientWidth*.5,y:field.clientHeight*.5});
function place(u){u.el.style.left=u.x+'px';u.el.style.top=u.y+'px'}
function deploy(t,k){
if(units.length>=55){status.textContent='Arena crowded! Wait for the melee.';return}
const team=teams[t],w=field.clientWidth,h=field.clientHeight,el=document.createElement('div');el.className='unit';el.textContent=team.emoji[k];layer.appendChild(el);
const u={id:++seq,t,k,el,x:w*team.start[0]+random(-15,15),y:h*team.start[1]+random(-12,12),hp:team.power[k]*2+3,atk:team.power[k],speed:team.speed[k]*70,attackAt:0};units.push(u);place(u);status.textContent=team.emoji[k]+' marches from '+team.name;
}
function pop(x,y,s){const e=document.createElement('div');e.className='impact';e.textContent=s;e.style.left=x+'px';e.style.top=y+'px';fx.appendChild(e);setTimeout(()=>e.remove(),550)}
function remove(u){u.el.remove();units=units.filter(v=>v!==u);if(king===u){king=null;banner.textContent='👑 The hill is vacant'}}
function crown(u){if(king===u)return;if(king)king.el.classList.remove('king');king=u;u.el.classList.add('king');scores[u.t]++;banner.textContent='👑 '+teams[u.t].emoji[u.k]+' holds the hill!';scores.forEach((n,i)=>document.querySelector('#score-'+i).textContent=n+' crowns');pop(u.x,u.y,'👑')}
function clash(a,b,now){
if(now<a.attackAt||now<b.attackAt)return;
a.attackAt=now+random(500,900);b.attackAt=now+random(500,900);
b.hp-=a.atk*random(.65,1.4);a.hp-=b.atk*random(.65,1.4);
pop((a.x+b.x)/2,(a.y+b.y)/2,Math.random()<.25?'💫':'💥');
const dead=[a,b].filter(u=>u.hp<=0);
for(const u of dead){pop(u.x,u.y,['💀','🦴','💨','✨'][Math.floor(Math.random()*4)]);remove(u)}
if(dead.length===1){const survivor=dead[0]===a?b:a;status.textContent=survivor.el.textContent+' defeated '+dead[0].el.textContent}
}
function frame(now){
const dt=Math.min((now-last)/1000||.016,.06);last=now;const c=center();
for(const u of [...units]){
if(!units.includes(u))continue;
let target=null,dist=Infinity;
for(const v of units){if(v===u||v.t===u.t)continue;const d=Math.hypot(v.x-u.x,v.y-u.y);if(d<dist){dist=d;target=v}}
if(target&&dist<39)clash(u,target,now);
else if(u!==king){
let tx=c.x,ty=c.y;
if(king&&king.t!==u.t){tx=king.x;ty=king.y}
else if(target&&dist<75){tx=target.x;ty=target.y}
const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy)||1,step=Math.min(d,u.speed*dt);u.x+=dx/d*step;u.y+=dy/d*step;
}else{u.x+=(c.x-u.x)*Math.min(1,dt*2);u.y+=(c.y-u.y)*Math.min(1,dt*2)}
if(units.includes(u))place(u);
}
if(!king){const candidates=units.filter(u=>Math.hypot(u.x-c.x,u.y-c.y)<26);if(candidates.length){candidates.sort((a,b)=>b.hp-a.hp);crown(candidates[0])}}
requestAnimationFrame(frame)
}
teams.forEach((team,t)=>{
const bank=document.createElement('div');bank.className='bank';bank.style.borderTop='3px solid '+team.color;bank.innerHTML='<h2>'+['🟥','🟦','🟩'][t]+' '+team.name+'</h2><div class="choices"></div><div class="score" id="score-'+t+'">0 crowns</div>';banks.appendChild(bank);
team.emoji.forEach((e,k)=>{const b=document.createElement('button');b.textContent=e;b.title='Deploy '+e;b.addEventListener('click',()=>deploy(t,k));bank.querySelector('.choices').appendChild(b)})
});
document.querySelector('#reset').addEventListener('click',()=>{units.forEach(u=>u.el.remove());units=[];king=null;scores=[0,0,0];scores.forEach((n,i)=>document.querySelector('#score-'+i).textContent='0 crowns');banner.textContent='The hill awaits a champion';status.textContent='A fresh battlefield.';fx.replaceChildren()});
document.querySelector('#chaos').addEventListener('click',()=>{for(let t=0;t<3;t++)for(let j=0;j<3;j++)deploy(t,Math.floor(Math.random()*4))});
requestAnimationFrame(frame);
})();
</script></body></html>
