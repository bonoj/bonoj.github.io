<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autology / Iron — Eiffel Tower</title><style>*{box-sizing:border-box}body{margin:0;background:#101922;color:#e0e7e9;font:14px system-ui}main{max-width:820px;margin:auto;padding:18px}h1{font-size:23px;font-weight:500}canvas{width:100%;height:68vh;min-height:360px;max-height:690px;display:block;background:#101922;touch-action:none;border:1px solid #40515c;border-radius:12px}button{background:#293c49;border:1px solid #58707c;color:#e0e7e9;padding:10px 13px;border-radius:8px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}small{color:#a9b9c2}input{accent-color:#c7a37d}</style><main><h1>AUTOLOGY / IRON</h1><p>Structural lattice · conserved BB matter · Eiffel Tower study</p><canvas id="scene"></canvas><nav><button id="strike">Aerial strike</button><button id="pause">Pause</button><button id="reset">Rebuild</button><button id="camera">Camera: orbit</button></nav><label>Impact radius <input id="radius" type="range" min="3" max="16" value="8"><output id="rv">8</output></label><p><small id="stats"></small></p><p><small id="log">Drag to orbit · tap a beam to target · strike · wheel to zoom</small></p></main><script>(()=>{'use strict';const $=s=>document.querySelector(s),cv=$('#scene'),ctx=cv.getContext('2d');let W,H,dpr,az=.65,el=.32,zoom=1,beams=[],joints=[],particles=[],shots=[],selected=null,playing=true,impactRadius=8,last=performance.now(),inventory=0,released=0,mode=0,drag=false,moved=false,lx=0,ly=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),V=(x,y,z)=>({x,y,z}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);function resize(){let b=cv.getBoundingClientRect();W=b.width;H=b.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}function proj(p){let ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el),x=p.x*ca-p.z*sa,z=p.x*sa+p.z*ca,y=p.y*ce-z*se,depth=p.y*se+z*ce,scale=Math.min(W*.39,H*.39)/55*zoom;return[W/2+x*scale,H*.89-y*scale,depth]}function joint(x,y,z,anchor=false){let id=joints.length;joints.push({x,y,z,anchor});return id}function beam(a,b,thick=1,kind='brace'){if(a===b)return;let A=joints[a],B=joints[b],mass=Math.max(2,Math.round(dist(A,B)*thick*1.25));beams.push({a,b,thick,kind,mass,alive:true});inventory+=mass}function stats(){let alive=beams.filter(b=>b.alive).length;$('#stats').textContent=alive+' / '+beams.length+' beams · '+released+' / '+inventory+' BBs released · '+(100*alive/beams.length).toFixed(1)+'% intact'}function tower(){joints=[];beams=[];particles=[];shots=[];inventory=0;released=0;const levels=Array.from({length:26},(_,i)=>i*4),rings=[];function half(y){if(y<35)return 20-13*Math.pow(y/35,.73);if(y<75)return 7-4.5*(y-35)/40;return Math.max(.45,2.5-(y-75)*.075)}for(let k=0;k<levels.length;k++){let y=levels[k],r=half(y),ids=[];for(let c=0;c<4;c++){let sx=c===0||c===3?-1:1,sz=c<2?-1:1;ids.push(joint(sx*r,y,sz*r,k===0))}rings.push(ids)}for(let k=0;k<rings.length-1;k++){let a=rings[k],b=rings[k+1];for(let c=0;c<4;c++){beam(a[c],b[c],k<9?1.8:1.2,'leg');beam(a[c],b[(c+1)%4],.55,'diagonal');beam(a[(c+1)%4],b[c],.55,'diagonal');beam(a[c],a[(c+1)%4],.7,'ring')}}for(let k=0;k<rings.length;k++){if(k%2!==0&&k!==9&&k!==19)continue;let a=rings[k];for(let c=0;c<4;c++){beam(a[c],a[(c+1)%4],1,'deck');beam(a[c],a[(c+2)%4],.55,'cross')}}for(const k of [9,19,24]){let y=levels[k],r=half(y)*1.17,ids=[];for(let c=0;c<4;c++){let sx=c===0||c===3?-1:1,sz=c<2?-1:1;ids.push(joint(sx*r,y,sz*r))}for(let c=0;c<4;c++){beam(ids[c],ids[(c+1)%4],1.9,'platform');beam(ids[c],rings[k][c],1.3,'platform')}}let top=joint(0,107,0);for(let c=0;c<4;c++)beam(rings.at(-1)[c],top,.85,'spire');selected=beams[Math.floor(beams.length*.22)];playing=true;$('#pause').textContent='Pause';$('#log').textContent='Tower reconstructed. Select a beam.';stats()}function kill(b,blast){if(!b.alive)return;b.alive=false;released+=b.mass;let a=joints[b.a],c=joints[b.b];for(let i=0;i<b.mass;i++){let t=Math.random(),p=V(a.x+(c.x-a.x)*t,a.y+(c.y-a.y)*t,a.z+(c.z-a.z)*t),dx=p.x-blast.x,dy=p.y-blast.y,dz=p.z-blast.z,d=Math.hypot(dx,dy,dz)||1;particles.push({...p,vx:dx/d*rand(.12,.8)+rand(-.2,.2),vy:dy/d*rand(.15,.8)+rand(0,.5),vz:dz/d*rand(.12,.8)+rand(-.2,.2),r:rand(.2,.42),sleep:false})}}function strike(){if(!selected)return;let a=joints[selected.a],b=joints[selected.b],target=V((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2),from=V(target.x+rand(-42,42),target.y+rand(35,65),target.z+rand(38,65));shots.push({from,target,t:0});$('#log').textContent='Projectile inbound.'}function impact(p){let destroyed=0;for(const b of beams){if(!b.alive)continue;let a=joints[b.a],c=joints[b.b],dx=c.x-a.x,dy=c.y-a.y,dz=c.z-a.z,l2=dx*dx+dy*dy+dz*dz||1,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy+(p.z-a.z)*dz)/l2,0,1),d=Math.hypot(a.x+dx*t-p.x,a.y+dy*t-p.y,a.z+dz*t-p.z);if(d<impactRadius){kill(b,p);destroyed++}}let connected=new Set(joints.map((j,i)=>j.anchor?i:-1).filter(i=>i>=0)),changed=true;while(changed){changed=false;for(const b of beams){if(!b.alive)continue;let A=connected.has(b.a),B=connected.has(b.b);if(A&&!B){connected.add(b.b);changed=true}else if(B&&!A){connected.add(b.a);changed=true}}}let cascade=0;for(const b of beams)if(b.alive&&!connected.has(b.a)&&!connected.has(b.b)){kill(b,p);cascade++}$('#log').textContent=destroyed+' members struck · '+cascade+' unsupported members detached';stats()}function update(dt){for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.t+=dt*.017;if(s.t>=1){impact(s.target);shots.splice(i,1)}}for(const p of particles){if(p.sleep)continue;p.vy-=.018*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vx*=.996;p.vz*=.996;if(p.y<0){p.y=0;p.vy=Math.abs(p.vy)*.25;p.vx*=.78;p.vz*=.78;if(Math.abs(p.vy)<.07)p.sleep=true}}}function draw(){ctx.fillStyle='#101922';ctx.fillRect(0,0,W,H);let grd=ctx.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,W*.7);grd.addColorStop(0,'#263743');grd.addColorStop(1,'#101922');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);let ground=[V(-60,0,-60),V(60,0,-60),V(60,0,60),V(-60,0,60)].map(proj);ctx.beginPath();ground.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='rgba(94,106,98,.15)';ctx.fill();ctx.strokeStyle='rgba(129,150,144,.25)';ctx.stroke();let lines=[];for(const b of beams){if(!b.alive)continue;let a=proj(joints[b.a]),c=proj(joints[b.b]);lines.push({a,c,depth:(a[2]+c[2])/2,b})}lines.sort((a,b)=>b.depth-a.depth);for(const l of lines){ctx.beginPath();ctx.moveTo(l.a[0],l.a[1]);ctx.lineTo(l.c[0],l.c[1]);ctx.lineWidth=Math.max(.55,l.b.thick*zoom*.8);ctx.strokeStyle=l.b===selected?'#f4cb88':l.b.kind==='platform'?'#d4b18b':'#ad9982';ctx.stroke()}for(const p of particles){let v=proj(p);if(v[0]<-5||v[0]>W+5||v[1]<-5||v[1]>H+5)continue;ctx.beginPath();ctx.arc(v[0],v[1],Math.max(.5,p.r*zoom*1.4),0,Math.PI*2);ctx.fillStyle=p.sleep?'#8b7969':'#d6bca0';ctx.fill()}for(const s of shots){let k=Math.min(1,s.t),p=V(s.from.x+(s.target.x-s.from.x)*k,s.from.y+(s.target.y-s.from.y)*k,s.from.z+(s.target.z-s.from.z)*k),v=proj(p);ctx.beginPath();ctx.arc(v[0],v[1],4,0,Math.PI*2);ctx.fillStyle='#ffc27b';ctx.fill()}if(selected&&selected.alive){let a=joints[selected.a],b=joints[selected.b],v=proj(V((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2));ctx.beginPath();ctx.arc(v[0],v[1],7,0,Math.PI*2);ctx.strokeStyle='#ffdfaa';ctx.lineWidth=1;ctx.stroke()}}function frame(now){let dt=Math.min(2,(now-last)/16.67);last=now;if(playing)update(dt);draw();requestAnimationFrame(frame)}cv.addEventListener('pointerdown',e=>{drag=true;moved=false;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lx,dy=e.clientY-ly;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;az+=dx*.009;el=clamp(el+dy*.006,-.35,1.2);lx=e.clientX;ly=e.clientY});cv.addEventListener('pointerup',e=>{if(!moved){let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,best=1e9;for(const b of beams){if(!b.alive)continue;let a=proj(joints[b.a]),c=proj(joints[b.b]),dx=c[0]-a[0],dy=c[1]-a[1],t=clamp(((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1),0,1),d=Math.hypot(a[0]+t*dx-x,a[1]+t*dy-y);if(d<best){best=d;selected=b}}$('#log').textContent='Structural member selected.'}drag=false});cv.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*(e.deltaY>0?.9:1.1),.45,2.8)},{passive:false});$('#strike').onclick=strike;$('#pause').onclick=()=>{playing=!playing;$('#pause').textContent=playing?'Pause':'Resume'};$('#reset').onclick=tower;$('#camera').onclick=()=>{mode=(mode+1)%3;[az,el,zoom]=[[.65,.32,1],[.78,.85,1.05],[1.4,.1,1.2]][mode];$('#camera').textContent='Camera: '+['orbit','high','low'][mode]};$('#radius').oninput=e=>{impactRadius=+e.target.value;$('#rv').textContent=e.target.value};resize();tower();requestAnimationFrame(frame);new ResizeObserver(resize).observe(cv)})();</script></html>
