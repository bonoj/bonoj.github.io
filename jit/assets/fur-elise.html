<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Für Elise · Self-playing Piano</title><style>*{box-sizing:border-box}body{margin:0;background:#15141a;color:#eee;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{width:min(95vw,760px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}small{opacity:.65}button{cursor:pointer}#play{background:#d6ad70;color:#18120d;border:0;border-radius:9px;padding:12px 22px;font-weight:bold}#keyboard{height:clamp(150px,32vw,230px);position:relative;display:flex;overflow:hidden;border-radius:7px;background:#222;touch-action:manipulation}.white{flex:1;min-width:0;background:linear-gradient(#fff,#e6e2db);border:1px solid #777;border-radius:0 0 4px 4px}.black{position:absolute;z-index:2;top:0;height:61%;background:linear-gradient(#333,#080808);border:1px solid #000;border-radius:0 0 4px 4px}#status{margin-top:14px;opacity:.7;font-size:13px}</style></head><body><main><header><div><h2 style="margin:0">Für Elise</h2><small>Beethoven · opening theme</small></div><button id="play">▶ Play</button></header><div id="keyboard"></div><div id="status">Tap Play, or touch a key.</div></main><script>
(()=>{'use strict';const keyboard=document.querySelector('#keyboard'),button=document.querySelector('#play'),status=document.querySelector('#status');let audio,playing=false,timer,step=0;const whites=[60,62,64,65,67,69,71,72,74,76,77,79,81,83,84,86,88],blackSet=new Set([1,3,6,8,10]),keys=new Map();whites.forEach(m=>{const k=document.createElement('button');k.className='white';k.setAttribute('aria-label','MIDI '+m);keyboard.append(k);keys.set(m,k);k.addEventListener('pointerdown',()=>note(m,.4))});for(let m=61;m<=87;m++){if(!blackSet.has(m%12))continue;const below=whites.indexOf(m-1);if(below<0)continue;const k=document.createElement('button');k.className='black';k.style.left=((below+1)/whites.length*100-1.8)+'%';k.style.width='3.6%';k.setAttribute('aria-label','MIDI '+m);keyboard.append(k);keys.set(m,k);k.addEventListener('pointerdown',e=>{e.stopPropagation();note(m,.4)})}
function note(m,d=.22){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const t=audio.currentTime,f=440*Math.pow(2,(m-69)/12),g=audio.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.009);g.gain.exponentialRampToValueAtTime(.035,t+.18);g.gain.exponentialRampToValueAtTime(.0001,t+d+.35);g.connect(audio.destination);[1,2,3].forEach((h,i)=>{const o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.value=f*h;v.gain.value=[.8,.15,.06][i];o.connect(v);v.connect(g);o.start(t);o.stop(t+d+.4)});const k=keys.get(m);if(k){k.style.background='#cda46c';setTimeout(()=>k.style.background='',Math.max(100,d*550))}}catch(e){status.textContent='Audio unavailable: '+e.message}}
const tune=[76,75,76,75,76,71,74,72,69,60,64,69,71,64,68,71,72,64,76,75,76,75,76,71,74,72,69,60,64,69,71,64,72,71,69],long=new Set([8,12,16,26,30,34]);function stop(){playing=false;clearTimeout(timer);button.textContent='▶ Play';status.textContent='Stopped'}function advance(){if(!playing)return;if(step>=tune.length){stop();status.textContent='Finished';return}const d=long.has(step)?.46:.22;note(tune[step],d);status.textContent='Note '+(step+1)+' of '+tune.length;step++;timer=setTimeout(advance,d*1000)}button.addEventListener('click',()=>{if(playing){stop();return}step=0;playing=true;button.textContent='■ Stop';advance()})})();
</script></body></html>
