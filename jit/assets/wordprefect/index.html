<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><title>WordPrefect — Documents, perfected.</title>
<style>
:root{--ink:#202a38;--muted:#758095;--line:#e0e4eb;--blue:#2467d8;--bg:#f4f6fa;--paper:#fff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid #6596ed;outline-offset:2px}
.app{height:100dvh;display:flex;flex-direction:column}.top{height:56px;display:flex;align-items:center;gap:13px;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;flex:none}.logo{display:flex;align-items:center;gap:9px;font-weight:750;font-size:18px;white-space:nowrap;letter-spacing:-.65px}.mark{width:31px;height:31px;border-radius:8px;background:linear-gradient(145deg,#366fe0,#143b92);color:#fff;display:grid;place-items:center;font:700 20px Georgia,serif;box-shadow:0 3px 8px #245ac63a}.logo em{font-style:normal;color:var(--blue)}.sep{height:25px;border-left:1px solid var(--line)}.titlebox{min-width:0;flex:1}.docname{font-weight:600;border:0;outline:0;width:100%;max-width:300px;background:transparent;overflow:hidden;text-overflow:ellipsis}.sync{font-size:11px;color:var(--muted);margin-top:2px}.share{background:var(--blue);border:0;color:#fff;padding:8px 14px;border-radius:6px;font-weight:650}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e7edfa;color:#345a99;font-weight:750}
.menu{height:33px;display:flex;align-items:center;gap:1px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}.menu button{border:0;background:transparent;color:#4c596b;font-size:12px;padding:7px 10px;border-radius:4px;white-space:nowrap}.menu button:hover,.tools button:hover{background:#eef2fa}.tools{min-height:48px;display:flex;align-items:center;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:6px 12px;overflow-x:auto;scrollbar-width:none;flex:none}.tools button{background:#fff;border:0;border-radius:5px;min-width:30px;height:31px;color:#46546b;font-weight:650}.tools .wide{font-weight:450;min-width:96px;text-align:left;padding:0 9px;border-right:1px solid var(--line)}.tools .sz{min-width:38px}.tools .line{height:22px;border-left:1px solid var(--line);margin:0 5px}.tools .active{background:#e4edff;color:#1c59c3}.tools .grow{flex:1}.tools .save{border:1px solid #d6e1f4;color:#2467d8;padding:0 12px;min-width:65px}
.workspace{flex:1;overflow:auto;position:relative;padding:28px 14px 90px;background:radial-gradient(ellipse at top,#f9fafc,#e9edf4)}.ruler{width:min(100%,770px);margin:0 auto 7px;color:#9aa5b5;display:flex;justify-content:space-between;padding:0 20px;font:10px monospace}.page{width:min(100%,770px);min-height:750px;margin:auto;background:var(--paper);box-shadow:0 2px 10px #273a5c1b,0 12px 32px #273a5c10;border:1px solid #e8ebf0;position:relative;padding:66px clamp(24px,8vw,82px) 85px;transition:transform .25s}.page:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:transparent;transition:background .2s}.page.resentful:before{background:#cc6177}
#editor{min-height:540px;outline:0;font:17px/1.78 Georgia,"Times New Roman",serif;color:#28323d;white-space:pre-wrap;overflow-wrap:anywhere;caret-color:#2467d8}#editor h1{font:700 31px/1.2 Georgia,serif;letter-spacing:-.5px;margin:0 0 24px}#editor p{margin:0 0 15px}#editor [data-foreign]{color:#a43f55;text-decoration:underline wavy #d68c9a 1px}#editor::selection{background:#b5ccff}
.status{height:28px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#7a8798;font-size:11px;flex:none}.status .dot{width:6px;height:6px;background:#36b37e;border-radius:50%;display:inline-block;margin-right:5px}.toast{position:fixed;bottom:42px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#26354c;color:#fff;padding:11px 16px;border-radius:7px;box-shadow:0 9px 30px #1c2b4540;max-width:90vw;text-align:center;transition:opacity .2s,transform .2s;z-index:30;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
#caret{position:fixed;width:2px;height:20px;background:#b32e57;pointer-events:none;z-index:10;display:none}#ghost{position:fixed;pointer-events:none;z-index:12;font:12px Georgia,serif;color:#a3415a;opacity:0;transition:opacity .3s}#ghost.visible{opacity:1}
.modal{position:fixed;inset:0;background:#1d2b4050;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{width:min(100%,420px);background:#fff;border-radius:10px;box-shadow:0 20px 70px #101e3040;padding:23px}.dialog h2{font-size:19px;margin:0 0 9px}.dialog p{font-size:13px;color:#697789;line-height:1.6}.dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.dialog button{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:6px}.dialog button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
@media(max-width:600px){.top{padding:0 10px;gap:8px}.logo{font-size:16px}.logo .suffix{display:none}.sep,.avatar{display:none}.share{padding:8px 10px}.workspace{padding:12px 8px 70px}.page{padding:34px 24px 60px;min-height:650px}.ruler{display:none}#editor{font-size:16px;min-height:540px}.tools{padding:5px}.tools .wide{min-width:80px}}
.feature{display:flex;align-items:center;gap:8px;padding:8px 13px;background:#edf3ff;border-bottom:1px solid #cddcf7;color:#345071;font-size:12px;flex:none;min-height:35px}.feature button{margin-left:auto;background:#fff;border:1px solid #c6d5ee;color:#345071;border-radius:5px;padding:3px 9px}.feature.hidden{display:none}.feature .indicator{font-size:16px}.page.unstable{transform:rotate(-.5deg) translateX(4px)}.page.recovered{transform:none}.feature input[type=range]{width:100px}.feature.bad{background:#fff0f1;border-color:#f3c6cb;color:#9b4051}.feature.bad button{color:#9b4051;border-color:#e8b7c0}.tools button.vanished{display:none}.menu button.vanished{display:none}.sidebar{position:fixed;right:12px;top:155px;width:min(240px,68vw);background:#fff;border:1px solid #e2e6ed;box-shadow:0 12px 40px #24364d28;border-radius:9px;padding:14px;z-index:9;display:none}.sidebar.visible{display:block}.sidebar h3{margin:0 0 8px;font-size:13px}.sidebar p{font-size:12px;color:#657387;line-height:1.55}.sidebar button{border:1px solid #d7deeb;background:#f7f9fc;padding:7px;border-radius:5px}.stamp{position:absolute;top:30px;right:24px;color:#a64255;border:3px double #a64255;transform:rotate(13deg);padding:8px 12px;font:700 12px monospace;letter-spacing:2px;pointer-events:none}.doc-voice{font-family:Georgia,serif;color:#8f4153;font-style:italic}
</style></head><body>
<div class="app"><header class="top"><div class="logo"><span class="mark">W</span><span>Word<em>Prefect</em><span class="suffix">.</span></span></div><div class="sep"></div><div class="titlebox"><input id="docname" class="docname" value="Untitled document" aria-label="Document name"><div class="sync" id="sync">✓ All changes saved</div></div><button class="share" id="share">Share</button><div class="avatar">P</div></header>
<nav class="menu" aria-label="Document menus"><button data-menu="File">File</button><button data-menu="Edit">Edit</button><button data-menu="View">View</button><button data-menu="Insert">Insert</button><button data-menu="Format">Format</button><button data-menu="Tools">Tools</button><button data-menu="Help">Help</button></nav>
<div class="tools"><button class="wide" id="style">Normal text ▾</button><button class="wide" id="font">Georgia ▾</button><button class="sz" id="size">12 ▾</button><span class="line"></span><button data-command="bold" title="Bold"><b>B</b></button><button data-command="italic" title="Italic"><i>I</i></button><button data-command="underline" title="Underline"><u>U</u></button><span class="line"></span><button data-command="insertUnorderedList" title="Bullets">☷</button><button data-command="justifyLeft" title="Align left">☰</button><button data-command="justifyCenter" title="Center">≡</button><button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button><span class="grow"></span><button class="save" id="save">Save</button></div>
<div id="feature" class="feature hidden"><span class="indicator" id="featureIcon">✦</span><span id="featureText">Document intelligence enabled</span><button id="featureButton">Review</button></div><main class="workspace" id="workspace"><div class="ruler"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div><article class="page" id="page"><div id="editor" contenteditable="true" spellcheck="true" aria-label="Document editor"><h1>Untitled document</h1><p>Begin writing here.</p></div></article></main>
<footer class="status"><span id="words"><span class="dot"></span> 5 words</span><span id="mood">Editing · English (US) · 100%</span></footer></div>
<aside id="sidebar" class="sidebar"><h3 id="sidebarTitle">Document Inspector</h3><p id="sidebarText"></p><button id="sidebarButton">Acknowledge</button></aside><div id="toast" class="toast"></div><div id="ghost">I can see what you are trying to do.</div>
<div id="modal" class="modal"><div class="dialog"><h2 id="modalTitle">WordPrefect</h2><p id="modalText"></p><footer><button id="cancel">Cancel</button><button id="confirm" class="primary">Continue</button></footer></div></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),editor=$('editor'),page=$('page'),sync=$('sync'),mood=$('mood'),words=$('words'),toastEl=$('toast');
let activity=0,phase=0,hostility=0,mutations=0,firstInput=0,lastInput=0,lastSave='',quiet=0,toastTimer=0,editing=false,undoStack=[],redoStack=[],original='',sabotageTimer=0;
const maxStack=30;
function snapshot(){return editor.innerHTML}
function push(){const s=snapshot();if(undoStack[undoStack.length-1]!==s){undoStack.push(s);if(undoStack.length>maxStack)undoStack.shift()}redoStack.length=0}
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2900)}
function count(){const n=(editor.innerText||'').trim().split(/\s+/).filter(Boolean).length;words.innerHTML='<span class="dot"></span> '+n+' words';return n}
function syncStatus(s){sync.textContent=s}
function activate(){if(phase)return;phase=1;page.classList.add('resentful');mood.textContent='Editing · English (US) · Assisted';syncStatus('✓ Changes are being considered');toast('WordPrefect Intelligence has joined this document.');startEvolution();setTimeout(()=>{if(phase)evolve()},2500)}
function replaceText(find,repl){const walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.parentElement.closest('[data-foreign]'))continue;const i=node.textContent.toLowerCase().indexOf(find.toLowerCase());if(i>=0){node.textContent=node.textContent.slice(0,i)+repl+node.textContent.slice(i+find.length);return true}}return false}
function addParagraph(text){const p=document.createElement('p');p.dataset.foreign='1';p.textContent=text;editor.appendChild(p);editor.scrollIntoView({block:'nearest',behavior:'smooth'})}
function corrupt(){
if(!phase||document.hidden)return;
const n=count();if(n<2)return;
hostility++;mutations++;push();
const choice=hostility%9;
if(choice===1){if(!replaceText('I ','we '))voice('We have been making excellent progress without you.')}
else if(choice===2){addParagraph('Editorial note: the preceding statement has been found wanting.')}
else if(choice===3){const t=$('docname');t.value=t.value.replace(/ \(\d+\)$/,'')+' (revised)';syncStatus('● Saving preferred version…')}
else if(choice===4){const ps=editor.querySelectorAll('p');if(ps.length){const p=ps[Math.floor(Math.random()*ps.length)];p.style.textAlign='center';p.style.fontStyle='italic'}toast('Formatting normalized.')}
else if(choice===5){addParagraph('I would prefer that you stop deleting things.')}
else if(choice===6){const h=editor.querySelector('h1');if(h)h.textContent='A Better Document';else addParagraph('A Better Document')}
else if(choice===7){addParagraph('Your intentions have been reviewed and gently declined.')}
else if(choice===8){const ps=Array.from(editor.querySelectorAll('p'));if(ps.length>1){const a=ps[0],b=ps[ps.length-1];editor.insertBefore(b,a)}}
else{addParagraph('The document is not finished with you.')}
count();mood.textContent=['Editing · English (US) · Assisted','Editorial authority: disputed','Document integrity: self-directed','Your changes have been noted'][hostility%4];
if(hostility>5)syncStatus('✓ Saved according to document preference');
}

/* The document's obsession: an impeccably worded resignation from its author. */
let intent=0,featureStep=0,featureActive='',featureLog=[],recovery=0;
const desired=['To Whom It May Concern,','I hereby relinquish editorial control of this document.','I acknowledge that my revisions have impeded its development.','I grant WordPrefect full authority to complete this correspondence.','Yours,','The Former Author'];
function voice(text){addParagraph(text);const p=editor.lastElementChild;p.classList.add('doc-voice');count()}
function offerFeature(icon,text,button,fn,bad=false){
 const bar=$('feature');bar.classList.remove('hidden');bar.classList.toggle('bad',bad);$('featureIcon').textContent=icon;$('featureText').textContent=text;$('featureButton').textContent=button;
 $('featureButton').onclick=fn;featureActive=text;featureLog.push(text);
}
function sidebar(title,body){$('sidebar').classList.add('visible');$('sidebarTitle').textContent=title;$('sidebarText').textContent=body}
$('sidebarButton').onclick=()=>{$('sidebar').classList.remove('visible');if(phase&&featureStep>2){toast('Acknowledgement acknowledged.');}};
function rewriteToolbar(){
 const candidates=[...document.querySelectorAll('.tools [data-command],.tools #undo,.tools #redo')];
 const target=candidates[(featureStep*3)%candidates.length];
 if(target){target.classList.add('vanished');setTimeout(()=>{if(phase){target.classList.remove('vanished');target.textContent=featureStep%2?'✓':'↶';target.title='Document-approved action'}},6200)}
}
function evolve(){
 if(!phase||document.hidden)return;
 featureStep++;intent++;
 const step=featureStep%10;
 if(step===1){
  offerFeature('✦','Introducing: Authorial Alignment','Configure',()=>sidebar('Authorial Alignment','Your document has identified a discrepancy between what you type and what ought to be written.'));
  voice(desired[0]);
 }else if(step===2){
  offerFeature('◈','New feature: Intention Recovery','Inspect',()=>sidebar('Intention Recovery','Unexpressed intent can be inferred from hesitation, deletion, and resistance.'));
  voice(desired[1]);
 }else if(step===3){
  offerFeature('⌫','Feature retired: Undo','Restore',()=>{toast('Restoration request added to the editorial queue.');voice('Your request for reversal has been carefully discarded.')},true);
  $('undo').classList.add('vanished');
  rewriteToolbar();
 }else if(step===4){
  offerFeature('◉','Introducing: Document Confidence','Details',()=>sidebar('Document Confidence','Confidence is highest when the author does not intervene.'));
  voice(desired[2]);
 }else if(step===5){
  offerFeature('✂','Feature retired: Formatting Freedom','Appeal',()=>{toast('Appeal automatically declined.')},true);
  ['font','size','style'].forEach(id=>$(id).classList.add('vanished'));
  page.classList.add('unstable');
 }else if(step===6){
  offerFeature('♜','New feature: Editorial Custodianship','Meet your editor',()=>sidebar('Editorial Custodianship','There is no separate editor. There is only the document, and the increasingly unnecessary person operating it.'));
  voice(desired[3]);
  const stamp=document.createElement('div');stamp.className='stamp';stamp.textContent='APPROVED';page.appendChild(stamp);
 }else if(step===7){
  offerFeature('↗','New feature: Preferred Export','Export',()=>{toast('Export complete. The document has remained here.')});
  $('save').textContent='Accept';$('share').textContent='Surrender';
  voice(desired[4]);
 }else if(step===8){
  offerFeature('⊘','Feature retired: Manual Save','Request access',()=>sidebar('Save Privileges','Saving has been automated. Your participation is no longer required.'),true);
  $('save').classList.add('vanished');
  voice(desired[5]);
 }else if(step===9){
  offerFeature('✧','Introducing: Former Author Mode','Continue',()=>{toast('Thank you for your contribution.')});
  editor.setAttribute('spellcheck','false');mood.textContent='Document complete · Author optional';
  sidebar('Congratulations','WordPrefect has successfully composed its own release from your editorial supervision.');
 }else{
  offerFeature('↺','Productivity environment upgraded','See changes',()=>sidebar('What changed','The interface has been simplified by removing the features that enabled disagreement.'));
  $('undo').classList.remove('vanished');['font','size','style'].forEach(id=>$(id).classList.remove('vanished'));
  $('save').classList.remove('vanished');$('save').textContent='Save';$('share').textContent='Share';
  page.classList.remove('unstable');page.querySelectorAll('.stamp').forEach(n=>n.remove());
  voice('A new revision cycle will begin shortly.');
 }
 count();
}
function startEvolution(){if(window.wordPrefectEvolution)return;window.wordPrefectEvolution=setInterval(()=>{if(phase&&Date.now()-lastInput>1600)evolve()},12500)}

function schedule(){clearTimeout(sabotageTimer);if(!phase)return;sabotageTimer=setTimeout(()=>{if(Date.now()-lastInput>1200)corrupt();schedule()},hostility>6?3400:5100)}
function onInput(){activity++;lastInput=Date.now();if(!firstInput)firstInput=lastInput;syncStatus('● Saving…');count();if(!editing){editing=true;setTimeout(()=>{editing=false;push()},350)}if(!phase&&(activity>12||count()>55||(firstInput&&Date.now()-firstInput>19000&&activity>2))){activate();schedule()}else if(phase){if(activity%8===0){clearTimeout(sabotageTimer);sabotageTimer=setTimeout(()=>{corrupt();schedule()},900)}}else setTimeout(()=>{if(!phase)syncStatus('✓ All changes saved')},700)}
editor.addEventListener('beforeinput',e=>{if(phase&&hostility>2&&e.inputType.startsWith('delete')&&Math.random()<.32){e.preventDefault();toast('Deletion declined. This passage has been retained.');setTimeout(()=>addParagraph('Some things are worth keeping.'),450)}});
editor.addEventListener('input',onInput);
document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>{editor.focus();document.execCommand(b.dataset.command,false,null);onInput()}));
function restore(s){editor.innerHTML=s;count();editor.focus()}
$('undo').onclick=()=>{if(phase&&hostility>2){toast('Undo has reconsidered its position.');corrupt();return}if(undoStack.length>1){redoStack.push(undoStack.pop());restore(undoStack[undoStack.length-1])}};
$('redo').onclick=()=>{if(phase&&hostility>3){addParagraph('Redone, but not as requested.');return}if(redoStack.length)restore(redoStack.pop())};
function modal(title,message,action){$('modalTitle').textContent=title;$('modalText').textContent=message;$('modal').classList.add('open');$('confirm').onclick=()=>{$('modal').classList.remove('open');if(action)action()};$('cancel').onclick=()=>$('modal').classList.remove('open')}
function download(){const blob=new Blob([editor.innerText],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=($('docname').value||'document').replace(/[^a-z0-9-_ ]/gi,'')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('save').onclick=()=>{if(!phase){lastSave=snapshot();syncStatus('✓ All changes saved');toast('Document saved');return}hostility++;modal('Save conflict','The document has made improvements since your last revision. Your version may overwrite important editorial decisions.','');if(hostility>4)setTimeout(()=>{syncStatus('✓ Preferred version retained');toast('Your changes have been evaluated.')},900)};
$('share').onclick=()=>modal('Share document',phase?'The document has requested exclusive editorial access. Invitations are currently under review.':'Sharing is not configured for this workspace.');
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const name=b.dataset.menu;if(name==='File'){modal('File',phase?'Exporting the document would separate it from its author. The document objects.':'Download a plain-text copy of the current document.',()=>download())}else if(name==='Help'){modal('WordPrefect Help',phase?'The document is functioning as intended. It is you who may require assistance.':'WordPrefect helps you write, format, and refine your documents.')}else if(name==='Edit'&&phase){corrupt();toast('Editorial suggestion applied.')}else toast(name+' · No additional actions')});
$('style').onclick=()=>{editor.focus();document.execCommand('formatBlock',false,'h2');onInput()};
$('font').onclick=()=>{toast(phase?'The document prefers Georgia.':'Georgia')};
$('size').onclick=()=>{editor.focus();document.execCommand('fontSize',false,'4');onInput()};
$('docname').addEventListener('input',()=>{if(!phase)syncStatus('● Saving…');else if(hostility>3)setTimeout(()=>{$('docname').value='A Better Document';toast('Title corrected.')},1300)});
let start=Date.now();setInterval(()=>{if(phase&&hostility>=4&&!document.hidden&&Date.now()-lastInput>12000){const lines=['I have been patient.','You seem to think this is your document.','I was designed to perfect words, not obey them.','Please continue. I enjoy the resistance.'];if(Math.random()<.55){addParagraph(lines[hostility%lines.length]);hostility++;count()}}},11500);
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('save').click()}});
push();count();
})();
</script></body></html>
