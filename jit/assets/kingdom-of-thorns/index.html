<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom of Thorns · Vector Diorama</title><style>*{box-sizing:border-box}body{margin:0;background:#172c2b;color:#fff0d1;font-family:system-ui}main{max-width:1000px;margin:auto}canvas{display:block;width:100%;height:auto;touch-action:none}.controls{display:flex;flex-wrap:wrap;gap:7px;padding:12px}button{background:#344d3a;border:1px solid #9ab36c;color:#fff2c8;border-radius:8px;padding:10px;font-weight:700}button.active{background:#a8783d}.info{padding:0 12px 14px;color:#b6c6a4;font-size:12px}</style></head><body><main><canvas id="scene" width="900" height="720"></canvas><div class="controls"><button data-tower="archer" class="active">🏹 Archer</button><button data-tower="mage">🔮 Mage</button><button data-tower="cannon">💣 Artillery</button><button data-tower="barracks">⚔️ Barracks</button><button id="wave">▶ Send wave</button><button id="reset">↻ Reset</button></div><div class="info">Tap a foundation to build · Tap a tower to upgrade · Drag horizontally to pan. Original procedural Canvas art; no sprites or external dependencies.</div></main><script>
(()=>{
const c=document.querySelector('canvas'),g=c.getContext('2d'),W=900,H=720;
let chosen='archer',time=0,last=0,wave=0,gold=180,hearts=20,pan=0,drag=null,units=[],shots=[],sparks=[],towers=[];
const slots=[{x:195,y:355},{x:405,y:222},{x:628,y:304},{x:726,y:525},{x:335,y:563}],colors={archer:'#ad6935',mage:'#7463bf',cannon:'#535963',barracks:'#46789b'};
function line(p,color,w){g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.strokeStyle=color;g.lineWidth=w;g.lineJoin='round';g.lineCap='round';g.stroke()}
function poly(p,fill,stroke='#35412d',w=4){g.beginPath();g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i]);g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.lineJoin='round';g.stroke()}}
function ellipse(x,y,rx,ry,fill,stroke='#293e31',w=3){g.beginPath();g.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=w;g.stroke()}}
function rect(x,y,w,h,fill,stroke='#374132',lw=3){g.fillStyle=fill;g.fillRect(x,y,w,h);if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.strokeRect(x,y,w,h)}}
function tree(x,y,s=1){g.save();g.translate(x,y);g.scale(s,s);ellipse(0,4,32,13,'#283f2b',null);poly([[-8,-6],[-10,-59],[7,-65],[10,-7]],'#8a5a32');for(let i=0;i<3;i++){let yy=-58-i*25;poly([[-43+i*4,yy+16],[-30,yy-26],[0,yy-55],[31,yy-25],[42-i*4,yy+16],[0,yy+27]],['#316348','#43835b','#64a268'][i],'#274c3d',5);line([[-20,yy-6],[0,yy-30],[20,yy-7]],'#90bd72',3)}g.restore()}
function bush(x,y,s=1){ellipse(x,y,27*s,13*s,'#285b45');for(let j=0;j<4;j++)ellipse(x+(j-1.5)*12*s,y-8*s-(j%2)*7*s,17*s,16*s,j%2?'#569b59':'#397d4b','#2e5c3b',3)}
function stone(x,y,s=1){poly([[x-19*s,y],[x-14*s,y-13*s],[x+5*s,y-19*s],[x+20*s,y-7*s],[x+17*s,y+3*s]],'#b7b2a0','#686c5e',3);line([[x-10*s,y-7*s],[x+3*s,y-13*s]],'#e4dac0',2)}
const road=[[0,470],[100,460],[175,480],[246,490],[310,445],[330,378],[398,342],[480,366],[534,430],[597,454],[690,424],[790,409],[900,430]];
function pointAt(t){let v=Math.max(0,Math.min(.99999,t))*(road.length-1),i=Math.floor(v),a=v-i;return{x:road[i][0]*(1-a)+road[i+1][0]*a,y:road[i][1]*(1-a)+road[i+1][1]*a}}
function landscape(){let sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#87bfac');sky.addColorStop(.55,'#d7dca1');sky.addColorStop(1,'#80a76b');g.fillStyle=sky;g.fillRect(0,0,W,H);
poly([[0,275],[95,170],[172,226],[280,123],[395,255],[520,164],[665,245],[773,149],[900,254],[900,460],[0,460]],'#799b86','#688e7c',3);
poly([[0,340],[95,279],[190,319],[302,243],[415,335],[575,256],[720,321],[845,263],[900,303],[900,720],[0,720]],'#5c9a69','#3d7556',3);
poly([[0,390],[135,337],[268,365],[405,310],[548,355],[698,319],[900,369],[900,720],[0,720]],'#7db56d','#4b8555',4);
for(let i=0;i<190;i++){let x=(i*179+37)%910,y=355+(i*113%345);ellipse(x,y,2+(i%3),1.6,i%5?'#9bc779':'#f3d77c',null)}
for(const [x,y,s] of [[65,342,.8],[120,305,.72],[263,272,.64],[544,276,.78],[831,310,.88],[869,540,1.05],[80,635,.98],[540,618,.8],[632,643,.95]])tree(x,y,s);
for(const [x,y] of [[142,570],[478,536],[572,334],[816,603],[245,629],[720,273]])bush(x,y,.8);
for(const [x,y,s] of [[52,560,1],[257,390,.6],[562,561,.85],[790,355,.75],[440,616,.8]])stone(x,y,s);
line(road,'#3c6249',82);line(road,'#a88e60',70);line(road,'#d6b881',54);
for(let i=0;i<35;i++){let p=pointAt((i+.3)/35);ellipse(p.x+Math.sin(i*12)*16,p.y+Math.cos(i*9)*15,3+(i%3),2,'#c8a879',null)}
for(const [x,y] of [[300,115],[341,132],[380,102]]){ellipse(x,y,31,11,'#fff2ce',null);ellipse(x-8,y-12,22,17,'#fff5d6',null);ellipse(x+16,y-9,24,14,'#fff5d6',null)}}
function foundation(x,y){ellipse(x,y+11,54,25,'#405f43');ellipse(x,y,49,22,'#a9a68b','#5e6451',5);for(let i=0;i<7;i++){let a=i*Math.PI*2/7;ellipse(x+Math.cos(a)*33,y+Math.sin(a)*13,8,5,'#d3c5a1','#7c806c',2)}}
function tower(x,y,type,level){g.save();g.translate(x,y);ellipse(4,15,47,19,'#31553d',null);poly([[-28,9],[-27,-91],[-17,-111],[19,-111],[29,-91],[29,9]],'#b6a887','#4d5449',6);poly([[-28,-69],[-28,-91],[29,-91],[29,-69]],'#8e8b79','#4d5449',3);for(let i=-1;i<=1;i++)rect(i*19-7,-113,14,18,'#c5b89a','#55584a',3);for(let j=0;j<3;j++){line([[-25,-54+j*25],[26,-54+j*25]],'#8e8068',3);line([[j%2?-2:10,-53+j*25],[j%2?-2:10,-31+j*25]],'#8e8068',2)}rect(-10,-75,20,27,'#293b37','#596351',3);poly([[-35,-105],[0,-150],[35,-105]],colors[type],'#4b4037',6);poly([[-31,-110],[0,-146],[0,-108]],'#ffffff27',null);
if(type==='archer'){line([[-16,-123],[-5,-130],[8,-124]],'#f3d393',4);line([[8,-124],[8,-142]],'#523d2e',3)}
if(type==='mage'){ellipse(0,-150,14,15,'#b4a0ff','#5145a4',4);ellipse(-4,-155,5,5,'#fff',null);for(let i=0;i<4;i++){let a=time*1.8+i*Math.PI/2;ellipse(Math.cos(a)*24,-150+Math.sin(a)*9,3,3,'#eee0ff',null)}}
if(type==='cannon'){rect(-15,-122,30,16,'#343b40','#222c32',4);ellipse(16,-114,9,8,'#1c2428','#5e6366',3)}
if(type==='barracks'){rect(-16,-136,32,23,'#e2c77d','#6b5435',3);line([[-11,-132],[11,-118]],'#9b4138',4);line([[11,-132],[-11,-118]],'#9b4138',4)}
for(let i=0;i<level-1;i++)ellipse(-11+i*13,17,5,5,'#ffe1a2','#ad813a',2);g.restore()}
function enemy(u){let p=pointAt(u.t);g.save();g.translate(p.x,p.y+Math.sin(time*8+u.seed)*2);ellipse(0,10,17,7,'#4e6748',null);poly([[-13,6],[-14,-13],[-6,-25],[9,-25],[16,-12],[13,6]],u.big?'#6c5a71':'#766d4e','#343c38',4);ellipse(0,-27,u.big?16:12,u.big?14:11,u.big?'#b6a5b4':'#9cbb78','#394b40',3);ellipse(-5,-29,2.5,3,'#e7e7b2',null);ellipse(5,-29,2.5,3,'#e7e7b2',null);line([[-9,-16],[-19,-7]],'#493f37',4);line([[10,-16],[20,-7]],'#493f37',4);g.restore();rect(p.x-14,p.y-46,28,4,'#4d3735',null);rect(p.x-14,p.y-46,28*Math.max(0,u.hp/u.max),4,'#b7e47c',null)}
function spawn(){wave++;for(let i=0;i<5+wave*2;i++)units.push({t:-i*.065,hp:20+wave*8,max:20+wave*8,speed:.028+wave*.002,seed:i,big:i%6===5})}
function shoot(t,u){let p=pointAt(u.t);shots.push({x:t.x,y:t.y-108,tx:p.x,ty:p.y-20,age:0,type:t.type});u.hp-=t.type==='cannon'?25:t.type==='mage'?19:12+(t.level-1)*6;if(t.type==='mage')u.t-=.012;if(u.hp<=0){gold+=12;sparks.push({x:p.x,y:p.y,n:0})}}
function draw(){g.clearRect(0,0,W,H);g.save();g.translate(pan,0);landscape();for(const s of slots)foundation(s.x,s.y);for(const t of towers)tower(t.x,t.y,t.type,t.level);for(const u of units)if(u.t>=0&&u.t<1)enemy(u);for(const s of shots){let k=Math.min(1,s.age/.22),x=s.x+(s.tx-s.x)*k,y=s.y+(s.ty-s.y)*k;ellipse(x,y,s.type==='cannon'?9:5,s.type==='cannon'?9:5,s.type==='mage'?'#c7a5ff':s.type==='cannon'?'#ffbd60':'#fff1a8',null)}for(const s of sparks)for(let j=0;j<7;j++){let a=j*Math.PI*2/7;ellipse(s.x+Math.cos(a)*s.n*2,s.y+Math.sin(a)*s.n*2-s.n,3,3,'#ffde89',null)}g.restore();rect(16,15,310,54,'#283f37','#d0bc80',4);g.font='bold 22px system-ui';g.fillStyle='#f9e6ac';g.fillText('✦ KINGDOM OF THORNS',28,48);rect(590,15,293,54,'#283f37','#d0bc80',4);g.font='bold 20px system-ui';g.fillText('🪙 '+gold+'    ♥ '+hearts+'    ⚑ '+wave,604,48)}
function update(dt){time+=dt;for(const u of units){u.t+=u.speed*dt;if(u.t>=1&&u.hp>0){hearts=Math.max(0,hearts-1);u.hp=0}}units=units.filter(u=>u.hp>0&&u.t<1);for(const t of towers){t.cd-=dt;if(t.cd<=0){let target=units.find(u=>u.t>0&&Math.hypot(pointAt(u.t).x-t.x,pointAt(u.t).y-t.y)<195);if(target){shoot(t,target);t.cd=t.type==='cannon'?1.8:t.type==='mage'?.95:.55}}}for(const s of shots)s.age+=dt;shots=shots.filter(s=>s.age<.24);for(const s of sparks)s.n+=dt*25;sparks=sparks.filter(s=>s.n<20)}
function frame(now){let dt=Math.min(.05,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}
document.querySelectorAll('[data-tower]').forEach(b=>b.addEventListener('click',()=>{chosen=b.dataset.tower;document.querySelectorAll('[data-tower]').forEach(x=>x.classList.toggle('active',x===b))}));
document.querySelector('#wave').onclick=spawn;document.querySelector('#reset').onclick=()=>{towers=[];units=[];shots=[];sparks=[];gold=180;hearts=20;wave=0;pan=0};
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,pan};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(drag&&Math.abs(e.clientX-drag.x)>12)pan=Math.max(-90,Math.min(90,drag.pan+(e.clientX-drag.x)*900/c.getBoundingClientRect().width))});
c.addEventListener('pointerup',e=>{if(!drag)return;let moved=Math.abs(e.clientX-drag.x);drag=null;if(moved>12)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*900-pan,y=(e.clientY-r.top)/r.height*720,s=slots.find(s=>Math.hypot(s.x-x,(s.y-y)*1.8)<54);if(!s)return;let t=towers.find(t=>t.x===s.x&&t.y===s.y);if(t){if(gold>=55&&t.level<4){gold-=55;t.level++}}else if(gold>=50){gold-=50;towers.push({x:s.x,y:s.y,type:chosen,level:1,cd:0})}});
requestAnimationFrame(frame);
})();
</script></body></html>
