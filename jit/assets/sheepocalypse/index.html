<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bde8ff"><title>🐑💥 Sheepocalypse</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui}#field{position:relative;width:100%;height:100dvh;overflow:hidden;touch-action:manipulation;user-select:none;background:linear-gradient(#bde8ff 0%,#e8f7ff 61%,#b5d78b 61%,#75ad60 100%)}.critter,.particle{position:absolute;transform:translate(-50%,-50%);will-change:transform,left,top}.critter{font-size:38px;cursor:pointer}.particle{pointer-events:none}.hud{position:absolute;z-index:3;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;color:#35563a;font-size:13px;font-weight:700}.controls{position:absolute;z-index:5;bottom:max(18px,env(safe-area-inset-bottom));left:14px;display:flex;gap:9px}button{border:1px solid #ffffff99;background:#ffffffdf;border-radius:22px;padding:10px 16px;color:#35563a;font-size:16px;font-weight:700}</style></head><body><main id="field"><div style="position:absolute;right:30px;top:48px;font-size:42px">☀️</div><div class="hud"><span>🐑 <b id="sheep">0</b> · 🦅 <b id="pops">0</b> · 🍖 <b id="collected">0</b></span><span>Tap pasture to summon hawk</span></div><div class="controls"><button id="more">+ 🐑</button><button id="reset">↻</button></div></main><script>(()=>{'use strict';const root=document.querySelector('#field'),$=id=>document.getElementById(id),W=()=>root.clientWidth,H=()=>root.clientHeight,rnd=(a,b)=>a+Math.random()*(b-a);let sheep=[],bits=[],meat=[],hawks=[],pops=0,score=0,last=performance.now(),hawkClock=0;function el(txt,cls){const e=document.createElement('div');e.className=cls;e.textContent=txt;root.appendChild(e);return e}function pos(e,x,y,rot=0,scale=1){e.style.left=x+'px';e.style.top=y+'px';e.style.transform='translate(-50%,-50%) rotate('+rot+'deg) scale('+scale+')'}function refresh(){$('sheep').textContent=sheep.length;$('pops').textContent=pops;$('collected').textContent=score}function addSheep(){const x=rnd(35,Math.max(36,W()-35)),y=rnd(H()*.67,H()*.85),e=el('🐑','critter'),s={e,x,y,phase:rnd(0,7),vx:rnd(-12,12),vy:rnd(-7,7),heading:rnd(0,7),hungry:rnd(0,3)};e.addEventListener('pointerdown',ev=>{ev.stopPropagation();summon(s)});sheep.push(s);refresh()}function particle(txt,x,y,vx,vy,life,size,gravity=250,spin=0){const e=el(txt,'particle');e.style.fontSize=size+'px';bits.push({e,x,y,vx,vy,life,max:life,gravity,spin,rot:rnd(0,360)})}function meatChunk(x,y,vx,vy){const e=el('🍖','particle');e.style.fontSize='27px';meat.push({e,x,y,vx,vy,rot:rnd(0,360),spin:rnd(-480,480),landed:false,claimed:false})}function explode(s,h){if(!sheep.includes(s))return;s.e.remove();sheep=sheep.filter(v=>v!==s);if(h){h.e.remove();hawks=hawks.filter(v=>v!==h)}pops++;particle('💥',s.x,s.y,0,-18,.38,43,0,120);for(let i=0;i<7;i++){let a=rnd(-Math.PI,0),v=rnd(65,215);meatChunk(s.x+rnd(-8,8),s.y,Math.cos(a)*v,Math.sin(a)*v-40)}for(let i=0;i<5;i++){let a=rnd(-Math.PI,0),v=rnd(80,220);particle(i%2?'🪶':'🍗',s.x,s.y,Math.cos(a)*v,Math.sin(a)*v-45,rnd(.9,1.8),rnd(16,23),300,rnd(-650,650))}refresh();setTimeout(()=>{if(sheep.length<12)addSheep()},rnd(1700,3500))}function summon(target){if(!target||hawks.length>3)return;const e=el('🦅','critter');e.style.fontSize='39px';const fromLeft=Math.random()<.5;hawks.push({e,target,x:fromLeft?-55:W()+55,y:rnd(H()*.12,H()*.3),speed:rnd(280,370),phase:0})}root.addEventListener('pointerdown',ev=>{if(ev.target.closest('button')||ev.target.classList.contains('critter'))return;if(sheep.length){let x=ev.clientX-root.getBoundingClientRect().left;let target=sheep.slice().sort((a,b)=>Math.abs(a.x-x)-Math.abs(b.x-x))[0];summon(target)}});$('more').onclick=()=>{for(let i=0;i<3;i++)addSheep()};$('reset').onclick=()=>{[...sheep,...bits,...meat,...hawks].forEach(o=>o.e.remove());sheep=[];bits=[];meat=[];hawks=[];pops=score=0;for(let i=0;i<12;i++)addSheep();refresh()};for(let i=0;i<12;i++)addSheep();function tick(t){const dt=Math.min((t-last)/1000,.045);last=t;const ground=H()*.88;hawkClock+=dt;if(hawkClock>rnd(3.2,5.8)&&sheep.length&&hawks.length<2){hawkClock=0;summon(sheep[Math.floor(Math.random()*sheep.length)])}sheep.forEach(s=>{s.phase+=dt;s.hungry+=dt;const food=meat.filter(m=>m.landed&&!m.claimed).sort((a,b)=>Math.hypot(a.x-s.x,a.y-s.y)-Math.hypot(b.x-s.x,b.y-s.y))[0];if(food){const dx=food.x-s.x,dy=food.y-s.y,d=Math.hypot(dx,dy);if(d<22){food.claimed=true;food.e.remove();meat=meat.filter(m=>m!==food);score++;refresh()}else{s.vx+=(dx/d*35-s.vx)*dt*.7;s.vy+=(dy/d*20-s.vy)*dt*.7}}else{const others=sheep.filter(o=>o!==s),cx=others.reduce((a,o)=>a+o.x,0)/(others.length||1),cy=others.reduce((a,o)=>a+o.y,0)/(others.length||1);s.vx+=(Math.sin(s.phase*.7+s.heading)*15+(cx-s.x)*.12-s.vx)*dt*.6;s.vy+=(Math.cos(s.phase*.4+s.heading)*7+(cy-s.y)*.1-s.vy)*dt*.6}for(const o of sheep){if(o===s)continue;const dx=s.x-o.x,dy=s.y-o.y,d=Math.hypot(dx,dy);if(d>0&&d<34){s.vx+=dx/d*24*dt;s.vy+=dy/d*16*dt}}s.x=Math.max(22,Math.min(W()-22,s.x+s.vx*dt));s.y=Math.max(H()*.65,Math.min(H()*.89,s.y+s.vy*dt));pos(s.e,s.x,s.y+Math.sin(s.phase*5)*2,0,1+Math.sin(s.phase*5)*.025)});for(let i=hawks.length-1;i>=0;i--){const h=hawks[i];if(!sheep.includes(h.target)){h.e.remove();hawks.splice(i,1);continue}h.phase+=dt;const dx=h.target.x-h.x,dy=h.target.y-h.y,d=Math.hypot(dx,dy);if(d<23){explode(h.target,h);continue}h.x+=dx/d*h.speed*dt;h.y+=dy/d*h.speed*dt;pos(h.e,h.x,h.y,dx>0?18:-18,1.12)};for(let i=bits.length-1;i>=0;i--){const b=bits[i];b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=b.gravity*dt;b.rot+=b.spin*dt;pos(b.e,b.x,b.y,b.rot);b.e.style.opacity=Math.max(0,b.life/b.max);if(b.life<=0){b.e.remove();bits.splice(i,1)}}meat.forEach(m=>{if(!m.landed){m.x+=m.vx*dt;m.y+=m.vy*dt;m.vy+=350*dt;m.rot+=m.spin*dt;if(m.y>=ground){m.y=ground;m.landed=true;m.rot=rnd(-35,35)}}pos(m.e,m.x,m.y,m.rot)});requestAnimationFrame(tick)}requestAnimationFrame(tick)})();</script></body></html>
