<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bde8ff"><title>🐑💥 Sheepocalypse</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui}#field{position:relative;width:100%;height:100dvh;overflow:hidden;touch-action:manipulation;user-select:none;background:linear-gradient(#bde8ff 0%,#e8f7ff 61%,#b5d78b 61%,#75ad60 100%)}.critter,.particle{position:absolute;transform:translate(-50%,-50%);will-change:transform,left,top}.critter{font-size:38px;cursor:pointer}.particle{pointer-events:none}.hud{position:absolute;z-index:3;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;color:#35563a;font-size:13px;font-weight:700}.controls{position:absolute;z-index:5;bottom:max(18px,env(safe-area-inset-bottom));left:14px;display:flex;gap:9px}button{border:1px solid #ffffff99;background:#ffffffdf;border-radius:22px;padding:10px 16px;color:#35563a;font-size:16px;font-weight:700}</style></head><body><main id="field"><div style="position:absolute;right:30px;top:48px;font-size:42px">☀️</div><div class="hud"><span>🐑 <b id="sheep">0</b> · 💥 <b id="pops">0</b> · 🍖 <b id="collected">0</b></span><span>Tap the sheep!</span></div><div class="controls"><button id="more">+ 🐑</button><button id="reset">↻</button></div></main><script>(()=>{'use strict';const root=document.querySelector('#field'),$=id=>document.getElementById(id),W=()=>root.clientWidth,H=()=>root.clientHeight,rnd=(a,b)=>a+Math.random()*(b-a);let sheep=[],bits=[],meat=[],scav=[],pops=0,score=0,last=performance.now();function el(txt,cls){const e=document.createElement('div');e.className=cls;e.textContent=txt;root.appendChild(e);return e}function pos(e,x,y,rot=0,scale=1){e.style.left=x+'px';e.style.top=y+'px';e.style.transform='translate(-50%,-50%) rotate('+rot+'deg) scale('+scale+')'}function refresh(){$('sheep').textContent=sheep.length;$('pops').textContent=pops;$('collected').textContent=score}function addSheep(){const x=rnd(35,Math.max(36,W()-35)),y=rnd(H()*.67,H()*.85),e=el('🐑','critter'),s={e,x,y,phase:rnd(0,7),dir:Math.random()<.5?-1:1};e.addEventListener('pointerdown',ev=>{ev.stopPropagation();explode(s)});sheep.push(s);refresh()}function particle(txt,x,y,vx,vy,life,size,gravity=250,spin=0){const e=el(txt,'particle');e.style.fontSize=size+'px';bits.push({e,x,y,vx,vy,life,max:life,gravity,spin,rot:rnd(0,360)})}function explode(s){if(!sheep.includes(s))return;s.e.remove();sheep=sheep.filter(v=>v!==s);pops++;particle('💥',s.x,s.y,0,-15,.35,42,0,100);for(let i=0;i<20;i++){const a=rnd(0,Math.PI*2),v=rnd(70,260);particle(i%3?'🩸':'💧',s.x,s.y,Math.cos(a)*v,Math.sin(a)*v-90,rnd(.55,1.25),rnd(12,22),300,rnd(-900,900))}for(let i=0;i<4;i++){const a=rnd(-Math.PI,0),v=rnd(45,170),e=el('🍖','particle');e.style.fontSize='27px';meat.push({e,x:s.x+rnd(-10,10),y:s.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50,rot:rnd(0,360),spin:rnd(-450,450),landed:false,claimed:false})}if(scav.length<5){const e=el(Math.random()<.5?'🦊':'🐺','critter');scav.push({e,x:Math.random()<.5?-35:W()+35,y:rnd(H()*.76,H()*.89),speed:rnd(45,85),phase:rnd(0,6)})}refresh();setTimeout(()=>{if(sheep.length<6)addSheep()},1100)}$('more').onclick=()=>{for(let i=0;i<3;i++)addSheep()};$('reset').onclick=()=>{[...sheep,...bits,...meat,...scav].forEach(o=>o.e.remove());sheep=[];bits=[];meat=[];scav=[];pops=score=0;for(let i=0;i<5;i++)addSheep();refresh()};for(let i=0;i<5;i++)addSheep();function tick(t){const dt=Math.min((t-last)/1000,.045);last=t;const ground=H()*.88;sheep.forEach(s=>{s.phase+=dt;s.x+=s.dir*dt*7;if(s.x<26||s.x>W()-26)s.dir*=-1;pos(s.e,s.x,s.y+Math.sin(s.phase*2)*3,0,1+Math.sin(s.phase*2)*.025)});for(let i=bits.length-1;i>=0;i--){const b=bits[i];b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=b.gravity*dt;b.rot+=b.spin*dt;pos(b.e,b.x,b.y,b.rot);b.e.style.opacity=Math.max(0,b.life/b.max);if(b.life<=0){b.e.remove();bits.splice(i,1)}}meat.forEach(m=>{if(!m.landed){m.x+=m.vx*dt;m.y+=m.vy*dt;m.vy+=350*dt;m.rot+=m.spin*dt;if(m.y>=ground){m.y=ground;m.landed=true;m.rot=rnd(-35,35)}}pos(m.e,m.x,m.y,m.rot)});for(let i=scav.length-1;i>=0;i--){const a=scav[i];a.phase+=dt;const target=meat.filter(m=>m.landed&&!m.claimed).sort((u,v)=>Math.hypot(u.x-a.x,u.y-a.y)-Math.hypot(v.x-a.x,v.y-a.y))[0];if(target){const dx=target.x-a.x,dy=target.y-a.y,d=Math.hypot(dx,dy);if(d<21){target.claimed=true;target.e.remove();meat=meat.filter(m=>m!==target);score++;refresh()}else{a.x+=dx/d*a.speed*dt;a.y+=dy/d*a.speed*dt}}else{a.x+=(a.x<W()/2?-1:1)*a.speed*dt;if(a.x< -55||a.x>W()+55){a.e.remove();scav.splice(i,1);continue}}pos(a.e,a.x,a.y+Math.sin(a.phase*9)*2)}requestAnimationFrame(tick)}requestAnimationFrame(tick)})();</script></body></html>
