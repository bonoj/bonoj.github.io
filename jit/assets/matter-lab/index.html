<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matter Lab · Six Procedural Treatments</title><style>body{margin:0;background:#111a1c;color:#e7e7e2;font:12px monospace}main{max-width:1000px;margin:auto;padding:12px}canvas{display:block;width:100%;height:min(65vh,650px);image-rendering:auto;touch-action:none;border-radius:10px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}button{background:#263638;color:#e2f2ef;border:1px solid #567b79;border-radius:6px;padding:10px;cursor:pointer}button.active{background:#366c69}section{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input{flex:1}p{line-height:1.5}</style><main><h2>Matter Lab / 001</h2><canvas id="c"></canvas><nav id="tabs"></nav><section>Detail <input id="detail" type="range" min="1" max="5" value="3">Activity <input id="activity" type="range" min="0" max="100" value="55"><button id="seed">Reseed</button><button id="pause">Pause</button></section><p id="description"></p><small id="metric"></small></main><script>
(()=>{const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),tabs=document.querySelector('#tabs'),desc=document.querySelector('#description'),metric=document.querySelector('#metric'),detail=document.querySelector('#detail'),activity=document.querySelector('#activity');
const names=['Pigment Bloom','Reaction Skin','Mineral Veins','Fluid Marbling','Corrosion Front','Fungal Network'],descs=['Pigment diffuses through paper fibers, accumulating at wet boundaries.','Gray–Scott reaction diffusion: two chemicals compete to create moving spots and labyrinths.','Warped mineral strata, crystalline highlights and pressure fractures.','Dye fields transported by a rotating flow, with gradients at pigment interfaces.','Oxidation advances preferentially along moist porous boundaries.','Nutrient-driven local colonization and branching filaments.'];
let mode=0,W=320,H=220,N=W*H,seed=1,tick=0,paused=false,down=false,last=null;let a,b,c,d,aa,bb,cc,img,px;
const fract=x=>x-Math.floor(x),rnd=i=>fract(Math.sin(i*127.1+seed*311.7)*43758.5453),clamp=x=>Math.max(0,Math.min(1,x)),mix=(x,y,t)=>x+(y-x)*t,smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a));return t*t*(3-2*t)},idx=(x,y)=>((y+H)%H)*W+((x+W)%W);
function noise(x,y){let ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);let h=(xx,yy)=>fract(Math.sin(xx*127.1+yy*311.7+seed*13.7)*43758.5453);return mix(mix(h(ix,iy),h(ix+1,iy),fx),mix(h(ix,iy+1),h(ix+1,iy+1),fx),fy)}
function fbm(x,y){let v=0,amp=.5;for(let k=0;k<4;k++){v+=amp*noise(x,y);let nx=x*1.67-y*1.13;y=x*1.13+y*1.67;x=nx;amp*=.5}return v}
function lap(z,x,y){return .2*(z[idx(x-1,y)]+z[idx(x+1,y)]+z[idx(x,y-1)]+z[idx(x,y+1)])+.05*(z[idx(x-1,y-1)]+z[idx(x+1,y-1)]+z[idx(x-1,y+1)]+z[idx(x+1,y+1)])-z[idx(x,y)]}
function sample(z,x,y){let ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;return mix(mix(z[idx(ix,iy)],z[idx(ix+1,iy)],fx),mix(z[idx(ix,iy+1)],z[idx(ix+1,iy+1)],fx),fy)}
function init(){W=mode===1?210:320;H=mode===1?150:220;N=W*H;a=new Float32Array(N);b=new Float32Array(N);c=new Float32Array(N);d=new Float32Array(N);aa=new Float32Array(N);bb=new Float32Array(N);cc=new Float32Array(N);img=ctx.createImageData(W,H);px=img.data;tick=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,u=x/W,v=y/H,n=fbm(u*8,v*8),f=fbm(u*19,v*19);if(mode===0){a[i]=.08+.11*n;b[i]=.35+.4*f;c[i]=n;d[i]=f}else if(mode===1){a[i]=1;b[i]=0;c[i]=n;d[i]=f;if((x-W*.5)**2+(y-H*.5)**2<900){b[i]=.75+rnd(i)*.2;a[i]=.25}}else if(mode===2){a[i]=n;b[i]=f;c[i]=fbm(u*5+3,v*5-7)}else if(mode===3){a[i]=clamp(smooth(.25,.7,n)+.2*Math.sin(u*22+v*15));b[i]=smooth(.35,.75,fbm(u*6+7,v*6+2));c[i]=smooth(.3,.8,fbm(u*9-3,v*9+8));d[i]=n}else if(mode===4){a[i]=Math.hypot((u-.5)*1.2,(v-.5)*1.5)<.18?.9:.02;b[i]=.15+.8*n;c[i]=f}else{a[i]=(x-W*.5)**2+(y-H*.5)**2<120?1:0;b[i]=.4+.6*n;c[i]=f}}if(mode===0)for(let k=0;k<7;k++)splat(rnd(k+80)*W,rnd(k+130)*H,10+rnd(k+210)*26,1)}
function splat(x,y,r,s=1){for(let yy=Math.max(0,Math.floor(y-r));yy<=Math.min(H-1,Math.ceil(y+r));yy++)for(let xx=Math.max(0,Math.floor(x-r));xx<=Math.min(W-1,Math.ceil(x+r));xx++){let q=Math.hypot(xx-x,yy-y)/r;if(q>=1)continue;let k=(1-q*q)**2*s,i=yy*W+xx;if(mode===1){b[i]=clamp(b[i]+k*.9);a[i]=clamp(a[i]-k*.55)}else if(mode===0)a[i]=clamp(a[i]+k*.8);else if(mode===2)d[i]+=k*.6;else if(mode===3){a[i]=clamp(a[i]+k*.8);b[i]=clamp(b[i]+k*.3)}else if(mode===4){a[i]=clamp(a[i]+k*.7);b[i]=clamp(b[i]+k*.25)}else{a[i]=clamp(a[i]+k*.9);b[i]=clamp(b[i]+k*.2)}}}
function step(){tick++;let speed=+activity.value/100;if(mode===1){let feed=.029+speed*.012,kill=.055+speed*.008;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,A=a[i],B=b[i],reaction=A*B*B;aa[i]=clamp(A+.92*lap(a,x,y)-reaction+feed*(1-A));bb[i]=clamp(B+.45*lap(b,x,y)+reaction-(kill+feed)*B)}[a,aa]=[aa,a];[b,bb]=[bb,b]}else if(mode===0){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,wet=b[i];aa[i]=clamp(a[i]+lap(a,x,y)*(.05+wet*.3)*speed-.0003*(1-wet));bb[i]=clamp(wet+.07*lap(b,x,y)-.0002*speed)}[a,aa]=[aa,a];[b,bb]=[bb,b]}else if(mode===3){let t=tick*.004*speed;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,u=x/W,v=y/H,vx=Math.sin(v*16+t)*.9+Math.cos((u+v)*13-t)*.5,vy=Math.cos(u*14-t)*.9-Math.sin((u-v)*11+t)*.5;aa[i]=sample(a,x-vx*speed*1.5,y-vy*speed*1.5);bb[i]=sample(b,x-vx*speed*1.5,y-vy*speed*1.5);cc[i]=sample(c,x-vx*speed*1.5,y-vy*speed*1.5)}[a,aa]=[aa,a];[b,bb]=[bb,b];[c,cc]=[cc,c]}else if(mode===4){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,wet=b[i];aa[i]=clamp(a[i]+Math.max(0,lap(a,x,y))*(.16+wet*.6)*speed+.00003*wet*speed);bb[i]=clamp(wet+.03*lap(b,x,y))}[a,aa]=[aa,a];[b,bb]=[bb,b]}else if(mode===5){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,neighbors=Math.max(a[idx(x-1,y)],a[idx(x+1,y)],a[idx(x,y-1)],a[idx(x,y+1)]),opp=Math.max(0,neighbors-a[i])*b[i],branch=.35+.65*fbm(x*.043+tick*.0003,y*.043);aa[i]=clamp(a[i]+opp*branch*.13*speed);bb[i]=clamp(b[i]-opp*.002)}[a,aa]=[aa,a];[b,bb]=[bb,b]}}
function paint(){let detailLevel=+detail.value;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=y*W+x,u=x/W,v=y/H,r=0,g=0,bl=0;if(mode===0){let pig=a[i],paper=c[i],grain=d[i],edge=Math.abs(pig-a[idx(x+1,y)])+Math.abs(pig-a[idx(x,y+1)]),pool=smooth(.02,.18,edge)*.3,fiber=noise(x*.8,y*.15)*12;r=232-155*pig-38*pool+14*grain-fiber;g=218-147*pig-22*pool+13*paper-fiber;bl=190-112*pig+14*grain-fiber}else if(mode===1){let B=b[i],edge=smooth(.02,.25,Math.abs(B-b[idx(x+1,y)])+Math.abs(B-b[idx(x,y+1)]));r=18+140*B+95*edge;g=30+97*B+105*edge;bl=39+72*B+83*edge}else if(mode===2){let X=u*detailLevel*1.7,Y=v*detailLevel*1.7,warp=fbm(X*1.9,Y*1.9),fold=Math.sin((X+warp*.75)*18+fbm(X*3,Y*3)*6),layer=Math.sin((Y*.8+X*.4+warp*.3)*36),vein=Math.pow(Math.max(0,1-Math.abs(fold)),10),strata=Math.pow(Math.max(0,layer),7),fracture=Math.pow(Math.max(0,1-Math.abs(Math.sin((X-Y*.7+fbm(X*4,Y*4))*13))),22),n=fbm(X*12,Y*12),light=.55+.45*fbm(X*4+2,Y*4);r=(57+110*n+65*strata+105*vein-45*fracture)*light+d[i]*40;g=(65+100*n+58*strata+82*vein-40*fracture)*light+d[i]*26;bl=(68+94*n+47*strata+52*vein-32*fracture)*light}else if(mode===3){let A=a[i],B=b[i],C=c[i],edge=Math.abs(A-a[idx(x+1,y)])+Math.abs(B-b[idx(x,y+1)]),sheen=smooth(.03,.3,edge);r=18+204*A+62*C+32*sheen;g=24+112*B+65*C+55*sheen;bl=43+155*B+100*(1-A)+28*sheen}else if(mode===4){let ox=a[i],wet=b[i],n=c[i],rim=smooth(.015,.18,Math.abs(ox-a[idx(x+1,y)])+Math.abs(ox-a[idx(x,y+1)]));r=mix(66+34*n,177+45*n,ox)+48*rim-wet*13;g=mix(89+27*n,77+46*n,ox)+24*rim-wet*16;bl=mix(95+24*n,32+20*n,ox)+10*rim-wet*18}else{let org=a[i],n=c[i],fil=smooth(.006,.08,Math.abs(org-a[idx(x+1,y)])+Math.abs(org-a[idx(x,y+1)]));r=31+39*n+140*org+44*fil;g=42+44*n+156*org+52*fil;bl=39+26*n+85*org+29*fil}let j=i*4;px[j]=Math.max(0,Math.min(255,r));px[j+1]=Math.max(0,Math.min(255,g));px[j+2]=Math.max(0,Math.min(255,bl));px[j+3]=255}buffer.width=W;buffer.height=H;buffer.getContext('2d').putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(buffer,0,0,canvas.width,canvas.height)}
const buffer=document.createElement('canvas');function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(canvas.clientWidth*d);canvas.height=Math.round(canvas.clientHeight*d)}function select(i){mode=i;desc.textContent=descs[i];[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));init()}names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+name;b.onclick=()=>select(i);tabs.append(b)});
function coords(e){let r=canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}canvas.onpointerdown=e=>{down=true;canvas.setPointerCapture(e.pointerId);last=coords(e);splat(...last,mode===1?10:14)};canvas.onpointermove=e=>{if(!down)return;let p=coords(e),dx=p[0]-last[0],dy=p[1]-last[1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/4));for(let j=1;j<=n;j++)splat(last[0]+dx*j/n,last[1]+dy*j/n,mode===1?8:12,.5);last=p};canvas.onpointerup=canvas.onpointercancel=()=>down=false;document.querySelector('#seed').onclick=()=>{seed=Math.random()*1000;init()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};function frame(){if(!paused)for(let j=0;j<(mode===1?3:1);j++)step();paint();metric.textContent=W+' × '+H+' simulation cells · '+(paused?'paused':'evolving');requestAnimationFrame(frame)}new ResizeObserver(resize).observe(canvas);resize();select(0);frame()})();
</script></html>
