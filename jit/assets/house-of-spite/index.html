<script>(function(){
var el=function(id){return document.getElementById(id)};
var devices={light:{x:177,home:true},window:{x:70,home:false},fan:{x:278,home:false},tv:{x:72,home:false},tap:{x:158,home:false},door:{x:306,home:false}};
var state={},pending=[],x=223,goal=223,job=null,phase='eat',elapsed=0,last=0,bites=0,fixes=0,fanRotation=0;
Object.keys(devices).forEach(function(k){state[k]=devices[k].home});
function paint(){el('lamp').setAttribute('fill',state.light?'#ffe18b':'#77746c');el('dark').setAttribute('opacity',state.light?'0':'.43');el('window').setAttribute('fill',state.window?'#bce9e8':'#9fc7d1');el('door').setAttribute('d',state.door?'M284 156L304 165V268L284 279Z':'M284 156H329V279H284Z');el('knob').setAttribute('opacity',state.door?'0':'1');el('screen').setAttribute('fill',state.tv?'#84b3c7':'#202c29');el('tvLabel').textContent=state.tv?'📺':'';el('water').setAttribute('opacity',state.tap?'1':'0');el('score').textContent='🍝 '+bites+' · ↶ '+fixes;el('queue').textContent=pending.length?pending.length+' disturbances':'HOUSE IN EQUILIBRIUM'}
function toggle(k){state[k]=!state[k];if(state[k]!==devices[k].home){if(pending.indexOf(k)<0)pending.push(k)}else pending=pending.filter(function(v){return v!==k});paint()}
document.querySelectorAll('[data-device]').forEach(function(node){var k=node.getAttribute('data-device');node.addEventListener('click',function(){toggle(k)});node.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle(k)}})});
function choose(){if(!pending.length)return null;pending.sort(function(a,b){return Math.abs(devices[a].x-x)-Math.abs(devices[b].x-x)});return pending[0]}
function frame(ms){var dt=last?Math.min(.05,(ms-last)/1000):0;last=ms;elapsed+=dt;
if(phase==='eat'){if(pending.length){job=choose();goal=devices[job].x;phase='walk';elapsed=0}else if(elapsed>.85){bites++;elapsed=0;paint()}}
else if(phase==='walk'||phase==='return'){if(phase==='return'&&pending.length){job=choose();goal=devices[job].x;phase='walk'}var d=goal-x,step=Math.min(Math.abs(d),dt*82);x+=Math.sign(d)*step;if(Math.abs(goal-x)<.5){phase=phase==='walk'?'operate':'eat';elapsed=0}}
else if(phase==='operate'&&elapsed>.42){if(job&&state[job]!==devices[job].home){state[job]=devices[job].home;fixes++}pending=pending.filter(function(v){return v!==job});job=null;phase='return';goal=223;elapsed=0;paint()}
el('actor').setAttribute('transform','translate('+x.toFixed(1)+' 284)');var walking=phase==='walk'||phase==='return',swing=walking?Math.sin(ms*.018)*7:0;
el('legs').setAttribute('d','M-6 -17L'+(-10+swing).toFixed(1)+' 0M6 -17L'+(10-swing).toFixed(1)+' 0');el('arm').setAttribute('d',phase==='operate'?'M9 -43L17 -69':phase==='eat'?'M9 -43L1 -57':'M9 -43L17 -29');el('thought').textContent=phase==='eat'?'All I want is my spaghetti.':phase==='walk'?'Not again.':phase==='operate'?'Absolutely not.':'Finally.';
if(state.fan){fanRotation+=dt*330;el('blades').setAttribute('transform','translate(278 53) rotate('+fanRotation.toFixed(1)+')')}requestAnimationFrame(frame)}
paint();requestAnimationFrame(frame);
})();</script></html>
