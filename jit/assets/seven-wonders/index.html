<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seven Wonders · Ruin Laboratory</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e9e0c9;font:14px system-ui}main{max-width:860px;margin:auto;padding:18px}header,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font-size:20px;margin:4px 0}p{color:#abb5b6;margin:4px 0 12px}canvas{width:100%;height:65vh;max-height:570px;min-height:310px;display:block;background:linear-gradient(#101923,#34352f);border:1px solid #4a514d;border-radius:12px;touch-action:none}button{background:#2b343c;color:#e9e0c9;border:1px solid #56616a;border-radius:9px;padding:10px 13px;font:inherit}button:active{background:#58616a}#tabs{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}#tabs button{padding:7px 10px}#tabs button[aria-pressed=true]{background:#65533c}small{color:#9da8a7}</style></head><body><main><header><div><h1 id="title">Seven Wonders · Ruin Laboratory</h1><p id="material"></p></div><small id="number">01 / 07</small></header><canvas id="scene" aria-label="Interactive structural destruction simulation"></canvas><div class="controls" style="margin-top:12px"><button id="prev">← Previous</button><button id="reset">Reassemble</button><button id="quake">Quake</button><button id="next">Next →</button></div><div class="controls" style="margin-top:12px"><label>Impact radius <input id="radius" type="range" min="12" max="85" value="36"></label><small id="integrity">100% bonded</small></div><div id="tabs"></div><p style="margin-top:12px">Tap to fracture · drag to carve · load-bearing bonds can break under strain. A deliberately crude 2D material study, not historical reconstruction.</p><p><a href="../" style="color:#c7ae7d">← JIT Assets</a></p></main><script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#scene'),ctx=canvas.getContext('2d');
const wonders=[['Great Pyramid of Giza','Limestone · bonded masonry','#d4b987'],['Hanging Gardens of Babylon','Terraces · brick · vegetation','#9caa78'],['Statue of Zeus at Olympia','Ivory · gold · timber','#e5d5a6'],['Temple of Artemis','Marble · columns · lintels','#c9d2d4'],['Mausoleum at Halicarnassus','Stone · stepped monument','#c7b5a2'],['Colossus of Rhodes','Bronze · iron framework','#a88d69'],['Lighthouse of Alexandria','Stone · stacked towers','#c8c3af']];
let idx=0,nodes=[],links=[],initial=0,W=400,H=400,ground=360,radius=36,active=false,last=0;
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);ground=H-33}
function node(x,y,r=5,col){nodes.push({x,y,px:x,py:y,r,col:col||wonders[idx][2]});return nodes.length-1}
function bond(a,b,strength=1){const A=nodes[a],B=nodes[b];links.push({a,b,len:Math.hypot(A.x-B.x,A.y-B.y),strength,alive:true})}
function grid(x,y,cols,rows,dx,dy,mask,col,strength=1){const ids=Array.from({length:rows},()=>Array(cols).fill(-1));for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)if(!mask||mask(i,j))ids[j][i]=node(x+i*dx,y+j*dy,Math.min(dx,dy)*.43,col);for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=ids[j][i];if(a<0)continue;for(const [di,dj] of [[1,0],[0,1],[1,1],[-1,1]]){const b=ids[j+dj]?.[i+di];if(b>=0)bond(a,b,strength)}}}
function bar(x1,y1,x2,y2,width=10,col=null,strength=1){const len=Math.hypot(x2-x1,y2-y1)||1,steps=Math.max(2,Math.ceil(len/9)),nx=-(y2-y1)/len*width/2,ny=(x2-x1)/len*width/2;let prev=[];for(let k=0;k<=steps;k++){const t=k/steps,cx=x1+(x2-x1)*t,cy=y1+(y2-y1)*t,cur=[node(cx+nx,cy+ny,Math.max(3,width/3),col),node(cx-nx,cy-ny,Math.max(3,width/3),col)];bond(cur[0],cur[1],strength);if(prev.length){bond(prev[0],cur[0],strength);bond(prev[1],cur[1],strength);bond(prev[0],cur[1],strength);bond(prev[1],cur[0],strength)}prev=cur}}
function build(){nodes=[];links=[];active=false;const cx=W/2,base=ground-5,s=wonders[idx][2],scale=Math.min(1,(W-24)/290);function B(x1,y1,x2,y2,w=10,c=null,t=1){bar(cx+(x1-cx)*scale,base+(y1-base)*scale,cx+(x2-cx)*scale,base+(y2-base)*scale,w*scale,c,t)}function G(x,y,c,r,dx,dy,m,col,t){grid(cx+(x-cx)*scale,base+(y-base)*scale,c,r,dx*scale,dy*scale,m,col,t)}
if(idx===0){G(cx-125,base-195,26,20,10,10,(i,j)=>Math.abs(i-12.5)<(j+1)*.65+1,s,1.3)}
else if(idx===1){for(let t=0;t<4;t++){let ww=225-t*40,y=base-30-t*54;B(cx-ww/2,y,cx+ww/2,y,15,'#b99a76',1.4);for(let xx=cx-ww/2+12;xx<cx+ww/2-10;xx+=17)B(xx,y-2,xx+4,y-18-(t%2)*9,5,'#688a59',.6);if(t<3)for(let x of [cx-ww/2+14,cx+ww/2-14])B(x,y,x,y-50,12,'#b99a76',1.3)}}
else if(idx===2){B(cx-90,base,cx+90,base,18,'#a78c69');for(let x of [-55,55])B(cx+x,base-5,cx+x,base-100,14,s);B(cx-70,base-110,cx+70,base-110,14,'#bd9b50');B(cx-26,base-100,cx-36,base-38,19,s);B(cx+26,base-100,cx+36,base-38,19,s);B(cx-30,base-105,cx-28,base-172,26,s);B(cx-28,base-172,cx+15,base-172,23,s);B(cx+15,base-172,cx+28,base-105,24,s);B(cx-30,base-190,cx-30,base-217,25,'#d7bd69');B(cx+28,base-145,cx+72,base-165,10,s)}
else if(idx===3){for(let k=0;k<3;k++)B(cx-132-k*5,base-k*9,cx+132+k*5,base-k*9,11,s);for(let x=cx-105;x<=cx+105;x+=42)B(x,base-30,x,base-180,14,s,1.6);B(cx-124,base-187,cx+124,base-187,16,s);B(cx-125,base-192,cx,base-245,12,s);B(cx,base-245,cx+125,base-192,12,s)}
else if(idx===4){G(cx-110,base-50,23,5,10,10,null,s,1.3);for(let x=cx-86;x<=cx+86;x+=43)B(x,base-55,x,base-150,12,s,1.4);for(let k=0;k<4;k++)B(cx-115+k*14,base-157-k*13,cx+115-k*14,base-157-k*13,13,s);B(cx-15,base-210,cx-15,base-240,12,s)}
else if(idx===5){B(cx-65,base,cx-25,base-130,22,s,1.4);B(cx+65,base,cx+25,base-130,22,s,1.4);B(cx-25,base-130,cx+25,base-130,32,s,1.5);B(cx-20,base-135,cx-30,base-210,24,s);B(cx+20,base-135,cx+30,base-210,24,s);B(cx-25,base-205,cx+25,base-205,26,s);B(cx,base-205,cx,base-246,22,s);B(cx-28,base-192,cx-87,base-137,13,s);B(cx+28,base-192,cx+87,base-137,13,s)}
else{G(cx-88,base-76,18,8,10,10,null,s,1.4);G(cx-57,base-174,12,10,10,10,null,s,1.4);G(cx-35,base-226,8,6,10,10,null,s,1.4);B(cx-45,base-228,cx,base-262,12,s);B(cx,base-262,cx+45,base-228,12,s)}
initial=links.length;$('#title').textContent=wonders[idx][0];$('#material').textContent=wonders[idx][1];$('#number').textContent=String(idx+1).padStart(2,'0')+' / 07';update();document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===idx?'true':'false'))}
function update(){const pct=Math.round(100*links.filter(l=>l.alive).length/Math.max(1,initial));$('#integrity').textContent=pct+'% bonded'}
function strike(x,y,rad=radius,power=8){active=true;for(const l of links){if(!l.alive)continue;const a=nodes[l.a],b=nodes[l.b];if(Math.hypot((a.x+b.x)/2-x,(a.y+b.y)/2-y)<rad)l.alive=false}for(const n of nodes){const dx=n.x-x,dy=n.y-y,d=Math.hypot(dx,dy);if(d<rad*1.7&&d>1){const f=(1-d/(rad*1.7))*power;n.px-=dx/d*f;n.py-=dy/d*f-1.5}}update()}
function simulate(){if(!active)return;for(const n of nodes){const vx=(n.x-n.px)*.992,vy=(n.y-n.py)*.992;n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+.19;if(n.y>ground-n.r){n.y=ground-n.r;n.px=n.x-vx*.72;n.py=n.y+vy*.18}if(n.x<n.r){n.x=n.r;n.px=n.x+vx*.4}if(n.x>W-n.r){n.x=W-n.r;n.px=n.x+vx*.4}}for(let k=0;k<5;k++)for(const l of links){if(!l.alive)continue;const a=nodes[l.a],b=nodes[l.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,delta=(d-l.len)/d;if(Math.abs(delta)>.85/l.strength&&d>l.len+8){l.alive=false;continue}const f=delta*.46;a.x+=dx*f;a.y+=dy*f;b.x-=dx*f;b.y-=dy*f}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#424038';ctx.fillRect(0,ground,W,H-ground);simulate();ctx.lineCap='round';for(const l of links){if(!l.alive)continue;const a=nodes[l.a],b=nodes[l.b];ctx.strokeStyle=a.col;ctx.lineWidth=Math.max(2,(a.r+b.r)*.82);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(const n of nodes){ctx.fillStyle=n.col;ctx.beginPath();ctx.arc(n.x,n.y,n.r*.83,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}
function hit(e){const r=canvas.getBoundingClientRect(),t=performance.now();if(t-last<28)return;last=t;strike((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height)}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);hit(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons)hit(e)});
$('#prev').onclick=()=>{idx=(idx+6)%7;build()};$('#next').onclick=()=>{idx=(idx+1)%7;build()};$('#reset').onclick=build;$('#quake').onclick=()=>{active=true;for(const l of links)if(Math.random()<.24)l.alive=false;for(const n of nodes){n.px-=Math.random()*14-7;n.py+=Math.random()*5}update()};$('#radius').oninput=e=>radius=+e.target.value;
wonders.forEach((w,i)=>{const b=document.createElement('button');b.textContent=['△','🌿','♛','▥','▱','♙','♜'][i];b.title=w[0];b.dataset.w=i;b.onclick=()=>{idx=i;build()};$('#tabs').appendChild(b)});
resize();build();draw();new ResizeObserver(()=>{const old=W;resize();if(Math.abs(old-W)>5)build()}).observe(canvas);
})();
</script></body></html>
