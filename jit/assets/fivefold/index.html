<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fivefold — Material Defense</title><style>*{box-sizing:border-box}body{margin:0;background:#080b13;color:#eee9db;font-family:system-ui,Segoe UI,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;padding:12px;display:flex;justify-content:space-between;gap:8px;text-shadow:0 2px 5px #000}#hud>div{background:#090e19bd;border:1px solid #ffffff24;border-radius:10px;padding:7px 10px;font-size:12px}b{font-size:16px}#hand{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px;width:min(98vw,610px);justify-content:center}button{color:#f7f3e7;background:#151c2c;border:1px solid #6c7893;border-radius:12px;touch-action:manipulation}button.card{position:relative;flex:1;min-width:0;height:99px;padding:5px 2px 7px;border-top:4px solid var(--c);box-shadow:0 5px 14px #000a;display:flex;flex-direction:column;align-items:center;justify-content:space-around}button.card.selected{transform:translateY(-12px);background:#263044;box-shadow:0 0 0 2px var(--c),0 9px 20px #000b}.glyph{font-size:27px}.nm{font-weight:700;font-size:11px}.cost{font-size:10px;color:#bfc8d8}#tip{position:fixed;bottom:119px;left:50%;transform:translateX(-50%);font-size:12px;max-width:90vw;text-align:center;background:#070c15c9;border:1px solid #ffffff24;border-radius:20px;padding:7px 13px;pointer-events:none}#actions{position:fixed;right:9px;top:75px;display:flex;flex-direction:column;gap:6px}#actions button{padding:8px 10px;font-size:12px;background:#121b2ccc}#notice{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);background:#080d18e8;border:1px solid #a9b6cf88;border-radius:16px;padding:22px;text-align:center;max-width:85vw;display:none;pointer-events:none}#notice h2{margin:0 0 8px}#notice p{margin:0;font-size:13px;line-height:1.5}</style></head><body><canvas id="view"></canvas><div id="hud"><div><b>FIVEFOLD</b><div id="wave">Wave 1 · Material Plane</div></div><div style="text-align:right"><b id="mana">✦ 12 / 20</b><div id="life">♥ 20 · ✧ 0</div></div></div><div id="actions"><button id="start">▶ Send wave</button><button id="rotate">⟳ Orbit</button><button id="reset">↺ Reset</button></div><div id="tip">Choose a color, then tap a glowing foundation. Drag the world to orbit.</div><div id="hand"></div><div id="notice"><h2 id="noticeTitle"></h2><p id="noticeBody"></p></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const defs=[{id:'W',name:'BASTION',glyph:'☼',color:'#e9d7a7',cost:4,desc:'Shield nearby towers · slow foes'},{id:'U',name:'TIDE',glyph:'◈',color:'#6acbff',cost:4,desc:'Push enemies backward'},{id:'B',name:'CRYPT',glyph:'☠',color:'#b990e7',cost:5,desc:'Harvest fallen foes for mana'},{id:'R',name:'EMBER',glyph:'✹',color:'#ff7957',cost:4,desc:'Burn crowds · spread fire'},{id:'G',name:'GROVE',glyph:'❧',color:'#81d991',cost:4,desc:'Root enemies · grow thorns'}];
const hand=document.querySelector('#hand'),tip=document.querySelector('#tip');let selected=3,mana=12,lives=20,souls=0,wave=1,active=false,spawned=0,spawnClock=0,ended=false,clock=0,orbit=0.13,autoOrbit=false;let enemies=[],effects=[],towers=[];
defs.forEach((d,i)=>{const b=document.createElement('button');b.className='card'+(i===selected?' selected':'');b.style.setProperty('--c',d.color);b.innerHTML=`<span class="glyph" style="color:${d.color}">${d.glyph}</span><span class="nm">${d.name}</span><span class="cost">✦ ${d.cost}</span>`;b.onclick=()=>{selected=i;document.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('selected',i===j));tip.textContent=d.desc+' · Tap a foundation';};hand.append(b)});
const scene=new THREE.Scene();scene.background=new THREE.Color('#090f1c');scene.fog=new THREE.Fog('#090f1c',24,54);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;scene.add(new THREE.HemisphereLight(0x9bc3ff,0x241a20,2));const light=new THREE.DirectionalLight(0xffdfb0,3);light.position.set(-6,13,7);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-16;light.shadow.camera.right=16;light.shadow.camera.top=16;light.shadow.camera.bottom=-16;scene.add(light);
function mat(c,metal=0,rough=.7){return new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough})}function mesh(g,m,x,y,z,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}const stone=mat('#394557'),dark=mat('#202b39'),ground=mat('#202c35'),pathmat=mat('#6e655a'),gold=mat('#d2bc84',.5),soil=mat('#3b473d');mesh(new THREE.BoxGeometry(25,.85,15),ground,0,-.58,0);mesh(new THREE.BoxGeometry(24.3,.12,14.3),soil,0,-.08,0);const path=[[-11,-2.3],[-8,-2.3],[-5,-1],[-2,-1],[1,1.3],[4,1.3],[7,-1.2],[11,-1.2]];function at(t){const s=Math.min(path.length-1.00001,Math.max(0,t)*(path.length-1)),i=Math.floor(s),f=s-i;return new THREE.Vector3(THREE.MathUtils.lerp(path[i][0],path[i+1][0],f),.14,THREE.MathUtils.lerp(path[i][1],path[i+1][1],f))}const curve=new THREE.CatmullRomCurve3(path.map(([x,z])=>new THREE.Vector3(x,.03,z)));const road=mesh(new THREE.TubeGeometry(curve,160,.76,8,false),pathmat,0,0,0);road.receiveShadow=true;const grid=new THREE.GridHelper(24,24,0x61716b,0x35403c);grid.position.y=.01;scene.add(grid);
const spots=[[-9,1.3],[-6,-4.1],[-3,2.4],[0,-3.2],[2.2,4.1],[5.1,-2.7],[8,2.1],[9,-4.2]];const bases=[];const ringmat=new THREE.MeshStandardMaterial({color:'#8d9db4',emissive:'#203347',emissiveIntensity:.6,metalness:.5,roughness:.35});spots.forEach(([x,z],i)=>{const g=new THREE.Group();g.position.set(x,.13,z);scene.add(g);mesh(new THREE.CylinderGeometry(.83,1,.32,8),stone,0,.08,0,g);const ring=mesh(new THREE.TorusGeometry(.65,.047,5,48),ringmat,0,.3,0,g);ring.rotation.x=Math.PI/2;const hit=mesh(new THREE.CylinderGeometry(.86,.86,.15,12),new THREE.MeshBasicMaterial({visible:false}),0,.2,0,g);hit.userData.spot=i;bases.push({x,z,g,ring,hit,tower:null})});
function decorate(){const rng=(i)=>{const x=Math.sin(i*127.1+17)*43758.5453;return x-Math.floor(x)};for(let i=0;i<58;i++){const x=(rng(i+5)-.5)*23,z=(rng(i+67)-.5)*13;let near=false;for(let j=0;j<=40;j++){const p=curve.getPoint(j/40);if(Math.hypot(x-p.x,z-p.z)<1.4)near=true}if(bases.some(b=>Math.hypot(x-b.x,z-b.z)<1.5))near=true;if(near)continue;const h=.4+rng(i+31)*1.2;if(rng(i+44)>.5){mesh(new THREE.ConeGeometry(.25+h*.16,h,5),mat('#3a675a'),x,h/2,z)}else mesh(new THREE.DodecahedronGeometry(.2+rng(i+91)*.28),stone,x,.18,z)}}decorate();
const gate=new THREE.Group();gate.position.set(11,.3,-1.2);scene.add(gate);mesh(new THREE.BoxGeometry(.8,2,.7),stone,-.6,1,0,gate);mesh(new THREE.BoxGeometry(.8,2,.7),stone,.6,1,0,gate);mesh(new THREE.BoxGeometry(2,.4,.8),gold,0,2.1,0,gate);const crystal=mesh(new THREE.OctahedronGeometry(.45),new THREE.MeshStandardMaterial({color:0x91e6ff,emissive:0x247ac0,emissiveIntensity:1.5}),0,1.2,0,gate);
function build(b,i){const d=defs[i],g=new THREE.Group();g.position.set(b.x,.5,b.z);scene.add(g);const col=new THREE.Color(d.color);const m=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.3,metalness:.28,roughness:.32});mesh(new THREE.CylinderGeometry(.36,.54,1.4,6),stone,0,.7,0,g);mesh(new THREE.CylinderGeometry(.48,.4,.18,6),gold,0,1.48,0,g);let top;if(i===0){top=mesh(new THREE.OctahedronGeometry(.5),m,0,2.0,0,g);mesh(new THREE.TorusGeometry(.64,.065,5,36),m,0,1.85,0,g)}else if(i===1){top=mesh(new THREE.IcosahedronGeometry(.49,1),m,0,1.94,0,g);mesh(new THREE.TorusGeometry(.55,.05,5,32),m,0,1.9,0,g)}else if(i===2){top=mesh(new THREE.DodecahedronGeometry(.47),m,0,1.94,0,g)}else if(i===3){top=mesh(new THREE.ConeGeometry(.48,.94,5),m,0,1.96,0,g)}else{top=mesh(new THREE.IcosahedronGeometry(.51,0),m,0,1.96,0,g);for(let a=0;a<4;a++){const ang=a*Math.PI/2;const v=mesh(new THREE.ConeGeometry(.15,.72,4),m,Math.cos(ang)*.46,1.55,Math.sin(ang)*.46,g);v.rotation.z=Math.cos(ang)*.5;v.rotation.x=Math.sin(ang)*.5}}const glow=new THREE.PointLight(col,2.2,5);glow.position.y=1.8;g.add(glow);b.tower={i,g,top,glow,cool:Math.random()*.4,range:i===0?4.4:i===1?4.1:i===2?4.4:i===3?3.6:4.2};b.ring.material=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.3,metalness:.5});}
const enemyMats=[mat('#dcbf97'),mat('#ba8890'),mat('#8eafb7')];function spawn(){const p=at(0);const hp=3+wave*1.7;const o=mesh(new THREE.DodecahedronGeometry(.36,0),enemyMats[spawned%3],p.x,.55,p.z);const eye=mesh(new THREE.OctahedronGeometry(.13),mat('#ffcc82'),0,.14,.3,o);enemies.push({o,t:0,hp,max:hp,speed:(.035+Math.random()*.011)*(1+wave*.07),slow:0,burn:0,root:0,dead:false});spawned++}
function pulse(x,z,color,rad=.22){const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9,depthWrite:false});const o=mesh(new THREE.SphereGeometry(rad,10,8),m,x,.6,z);effects.push({o,age:0,dur:.42,kind:'pulse'})}function beam(a,b,color){const dir=new THREE.Vector3().subVectors(b,a),o=mesh(new THREE.CylinderGeometry(.045,.09,dir.length(),5),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}),...(a.clone().add(b).multiplyScalar(.5).toArray()));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());effects.push({o,age:0,dur:.22,kind:'beam'})}function damage(e,n,i){if(e.dead)return;e.hp-=n;if(i===3)e.burn=Math.max(e.burn,2.7);if(e.hp<=0){e.dead=true;scene.remove(e.o);souls++;let harvest=0;for(const b of bases)if(b.tower?.i===2&&Math.hypot(e.o.position.x-b.x,e.o.position.z-b.z)<b.tower.range)harvest++;if(harvest){mana=Math.min(20,mana+harvest);pulse(e.o.position.x,e.o.position.z,'#b990e7',.45)}else mana=Math.min(20,mana+.22);}}
function attack(b,t){const x=b.x,z=b.z;let targets=enemies.filter(e=>!e.dead&&Math.hypot(e.o.position.x-x,e.o.position.z-z)<t.range);if(!targets.length)return;targets.sort((a,b)=>b.t-a.t);const e=targets[0],p=e.o.position;const from=new THREE.Vector3(x,2.4,z);if(t.i===0){targets.slice(0,3).forEach(q=>{q.slow=Math.max(q.slow,1.5);damage(q,.35,0)});beam(from,p,'#f5e9bd')}if(t.i===1){e.t=Math.max(0,e.t-.042);e.slow=.35;damage(e,.7,1);beam(from,p,'#69d3ff');pulse(p.x,p.z,'#69d3ff')}if(t.i===2){damage(e,1.4,2);beam(from,p,'#ba8be9')}if(t.i===3){targets.slice(0,4).filter(q=>Math.hypot(q.o.position.x-p.x,q.o.position.z-p.z)<2).forEach(q=>damage(q,1.1,3));beam(from,p,'#ff6b39');pulse(p.x,p.z,'#ff713e',.5)}if(t.i===4){targets.slice(0,2).forEach(q=>{q.root=Math.max(q.root,1.5);damage(q,.65,4)});beam(from,p,'#8ee7a4');pulse(p.x,p.z,'#73c68c')}
}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,orbit};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(down&&Math.abs(e.clientX-down.x)>5){orbit=down.orbit+(e.clientX-down.x)*.006;autoOrbit=false}});canvas.addEventListener('pointerup',e=>{if(!down)return;const drag=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(drag>12)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(bases.map(b=>b.hit));if(!hits.length)return;const b=bases[hits[0].object.userData.spot],d=defs[selected];if(b.tower){tip.textContent='Occupied foundation · Choose another';return}if(mana<d.cost){tip.textContent='Not enough mana · Defeat creatures or wait';return}mana-=d.cost;build(b,selected);tip.textContent=d.name+' awakened · '+d.desc;});
function show(title,body){const n=document.querySelector('#notice');document.querySelector('#noticeTitle').textContent=title;document.querySelector('#noticeBody').textContent=body;n.style.display='block';setTimeout(()=>n.style.display='none',2500)}document.querySelector('#start').onclick=()=>{if(ended)return;if(active){tip.textContent='Wave already moving';return}active=true;spawned=0;spawnClock=.1;tip.textContent='Wave '+wave+' approaches · Each color changes the battlefield';};document.querySelector('#rotate').onclick=()=>autoOrbit=!autoOrbit;document.querySelector('#reset').onclick=()=>location.reload();
let prev=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-prev)/1000,.05);prev=now;clock+=dt;if(autoOrbit)orbit+=dt*.16;camera.position.set(Math.sin(orbit)*23,18,Math.cos(orbit)*23);camera.lookAt(0,.4,0);if(active){spawnClock-=dt;if(spawned<6+wave*3&&spawnClock<=0){spawn();spawnClock=.76-Math.min(.4,wave*.035)}if(spawned>=6+wave*3&&!enemies.some(e=>!e.dead)){active=false;wave++;mana=Math.min(20,mana+4);show('WAVE CLEARED','The land remembers. Four mana restored.');tip.textContent='Rebuild your defenses · Send the next wave when ready'}}mana=Math.min(20,mana+dt*.16);for(const b of bases){b.ring.rotation.z+=dt*.3;const t=b.tower;if(!t)continue;t.top.rotation.y+=dt*(t.i===1?1.4:.5);t.top.position.y=1.96+Math.sin(clock*2+b.x)*.09;t.glow.intensity=1.5+Math.sin(clock*3+b.z)*.6;t.cool-=dt;if(t.cool<=0&&active){attack(b,t);t.cool=[1.1,1.3,1.7,.95,1.3][t.i]}}for(const e of enemies){if(e.dead)continue;if(e.burn>0){e.burn-=dt;e.hp-=dt*.48;if(e.hp<=0){damage(e,1,3);continue}}e.slow=Math.max(0,e.slow-dt);e.root=Math.max(0,e.root-dt);const speed=e.root>0?.07:e.slow>0?.45:1;e.t+=e.speed*dt*speed;if(e.t>=1){e.dead=true;scene.remove(e.o);lives--;pulse(11,-1.2,'#ff7777',.8);if(lives<=0){ended=true;active=false;show('THE GATE FALLS','Refresh to reshape the fivefold defense.')}}else{const p=at(e.t);e.o.position.set(p.x,.52+Math.sin(clock*9+e.t*10)*.09,p.z);e.o.rotation.y+=dt*2;e.o.scale.setScalar(.85+.15*e.hp/e.max)}}enemies=enemies.filter(e=>!e.dead);for(const f of effects){f.age+=dt;f.o.material.opacity=Math.max(0,1-f.age/f.dur);if(f.kind==='pulse')f.o.scale.setScalar(1+f.age*3)}effects=effects.filter(f=>{if(f.age>=f.dur){scene.remove(f.o);f.o.geometry.dispose();f.o.material.dispose();return false}return true});crystal.rotation.y+=dt;crystal.position.y=1.2+Math.sin(clock*2)*.12;document.querySelector('#mana').textContent='✦ '+Math.floor(mana)+' / 20';document.querySelector('#life').textContent='♥ '+lives+' · ✧ '+souls;document.querySelector('#wave').textContent='Wave '+wave+' · '+(active?'Under siege':'Material Plane');renderer.render(scene,camera)}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});show('FIVEFOLD','Five colors. Eight foundations. One living battlefield.');
</script></body></html>
