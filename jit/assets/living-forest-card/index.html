<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest · Living Land</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a17;color:#e9dec4;font:13px Georgia}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;top:12px;left:14px;letter-spacing:.14em;pointer-events:none}footer{position:absolute;bottom:12px;left:14px;pointer-events:none}button{position:absolute;bottom:10px;right:12px;background:#273a2e;color:#eee2c6;border:1px solid #72846c;border-radius:7px;padding:8px 13px}</style><canvas id="view"></canvas><header>FOREST · LIVING LAND</header><footer>Drag to orbit · Pinch to zoom</footer><button id="reset">Reset</button><script type="module">
const canvas=document.querySelector('#view');
try{
const THREE=await import('https://esm.sh/three@0.170.0');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(0x101a17);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x101a17,9,19);
const camera=new THREE.PerspectiveCamera(42,1,.05,100);let az=.6,el=.8,dist=5.5;const target=new THREE.Vector3(0,.24,0);
function positionCamera(){camera.position.set(dist*Math.cos(el)*Math.sin(az),target.y+dist*Math.sin(el),dist*Math.cos(el)*Math.cos(az));camera.lookAt(target)}positionCamera();
scene.add(new THREE.HemisphereLight(0xdce9ff,0x453d2d,2.2));const sun=new THREE.DirectionalLight(0xffe8bc,3);sun.position.set(-3,7,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-5;sun.shadow.camera.right=5;sun.shadow.camera.top=5;sun.shadow.camera.bottom=-5;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1});
function mesh(geo,m,x=0,y=0,z=0){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
mesh(new THREE.BoxGeometry(30,.2,30),mat(0x352a22),0,-.22,0).castShadow=false;
mesh(new THREE.BoxGeometry(2.25,.045,3.3),mat(0x756044),0,-.025,0);
mesh(new THREE.BoxGeometry(2.21,.014,3.26),mat(0xd8c69c),0,.006,0);
mesh(new THREE.BoxGeometry(1.94,.018,2.38),mat(0x183e2a),0,.022,-.27);
mesh(new THREE.BoxGeometry(1.88,.16,2.32),mat(0x4b3826),0,.12,-.27);
mesh(new THREE.BoxGeometry(1.88,.035,2.32),mat(0x345d37),0,.22,-.27);
const tc=document.createElement('canvas');tc.width=512;tc.height=256;const tg=tc.getContext('2d');tg.fillStyle='#e0cfa9';tg.fillRect(0,0,512,256);tg.strokeStyle='#67593b';tg.lineWidth=9;tg.strokeRect(8,8,496,240);tg.fillStyle='#30291f';tg.font='bold 55px Georgia';tg.fillText('Forest',38,78);tg.font='26px Georgia';tg.fillText('Basic Land — Forest',38,134);tg.font='34px Georgia';tg.fillText('Add one green mana.',38,195);
const tex=new THREE.CanvasTexture(tc);tex.colorSpace=THREE.SRGBColorSpace;const label=new THREE.Mesh(new THREE.PlaneGeometry(2.08,1.04),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));label.rotation.x=-Math.PI/2;label.position.set(0,.035,1.05);scene.add(label);
let seed=123456;function rand(){seed=(1664525*seed+1013904223)>>>0;return seed/4294967296}
const trunkMat=mat(0x59402b),leafMats=[mat(0x244f31),mat(0x356b3d),mat(0x487a46),mat(0x183e2b)],trees=[];
function tree(x,z,h){const group=new THREE.Group();scene.add(group);group.position.set(x,.24,z);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.025,.065,h*.8,8),trunkMat);trunk.position.y=h*.4;trunk.castShadow=true;group.add(trunk);
for(let j=0;j<5;j++){const angle=j*2.399,level=.4+(j%3)*.14,len=h*(.3+rand()*.18),tip=new THREE.Vector3(Math.cos(angle)*len,h*level+len*.48,Math.sin(angle)*len);const b=new THREE.Mesh(new THREE.CylinderGeometry(.009,.025,tip.length(),6),trunkMat);b.position.copy(tip).multiplyScalar(.5);b.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),tip.clone().normalize());group.add(b);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(h*(.15+rand()*.07),1),leafMats[Math.floor(rand()*4)]);crown.position.copy(tip);crown.castShadow=true;group.add(crown)}
const top=new THREE.Mesh(new THREE.IcosahedronGeometry(h*.19,1),leafMats[Math.floor(rand()*4)]);top.position.y=h*.88;top.castShadow=true;group.add(top);trees.push(group)}
for(let i=0;i<31;i++){const x=(rand()-.5)*1.65,z=(rand()-.5)*2.04-.27;if(Math.abs(x-.18*Math.sin(z*2.2))<.16)continue;tree(x,z,.38+rand()*.58)}
const pathMat=mat(0x9d8960);for(let i=0;i<21;i++){const z=-1.35+i*.106,x=.18*Math.sin(z*2.2),p=mesh(new THREE.SphereGeometry(.11,8,5),pathMat,x,.244,z);p.scale.set(1,.07,1.1)}
const stoneMat=mat(0x8c9080);for(let i=0;i<25;i++){const x=(rand()-.5)*1.75,z=(rand()-.5)*2.12-.27,s=mesh(new THREE.DodecahedronGeometry(.025+rand()*.045),stoneMat,x,.25,z);s.scale.y=.55}
const pointers=new Map();let pinch=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){az-=(e.clientX-old.x)*.008;el=Math.max(.12,Math.min(1.48,el+(e.clientY-old.y)*.006));positionCamera()}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)dist=Math.max(2.2,Math.min(10,dist*pinch/d));pinch=d;positionCamera()}});const release=e=>{pointers.delete(e.pointerId);pinch=0};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(2.2,Math.min(10,dist*Math.exp(e.deltaY*.001)));positionCamera()},{passive:false});document.querySelector('#reset').onclick=()=>{az=.6;el=.8;dist=5.5;positionCamera()};
function render(t){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}trees.forEach((tree,i)=>{tree.rotation.z=Math.sin(t*.0007+i*1.4)*.009;tree.rotation.x=Math.cos(t*.0006+i*.8)*.008});renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);
}catch(e){document.querySelector('header').textContent='WebGL unavailable: '+e.message}
</script></html>
