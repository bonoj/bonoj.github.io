<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Leviathan II · Planetbreaker</title><style>*{box-sizing:border-box}body{margin:0;background:#02040a;color:#dce7ed;font:12px monospace}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:16px;left:16px;letter-spacing:2px;pointer-events:none}#status{margin-top:8px;color:#ffad90;letter-spacing:0}nav{position:absolute;bottom:22px;width:100%;display:flex;justify-content:center;gap:10px}button{border:1px solid #cf776d;background:#50232c;color:#ffe8dc;border-radius:30px;padding:15px 25px;font:bold 13px monospace;letter-spacing:2px}button+button{background:#15202d;border-color:#536477}</style><canvas id="view"></canvas><header>LEVIATHAN / PLANETBREAKER<div id="status">CRUST INTACT</div></header><nav><button id="attack">RAVAGE</button><button id="reset">↻</button></nav><script type="module">
import * as T from 'https://esm.sh/three@0.180.0';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setClearColor(0x02040a);
const scene=new T.Scene(),camera=new T.PerspectiveCamera(42,1,.1,100);camera.position.set(0,1,8.8);camera.lookAt(0,0,0);scene.add(new T.HemisphereLight(0x83c9f1,0x07121e,2));const sun=new T.DirectionalLight(0xffdbba,3);sun.position.set(-4,5,7);scene.add(sun);
const world=new T.Group();scene.add(world);const R=2.15,geo=new T.SphereGeometry(R,128,96),pos=geo.attributes.position,base=Float32Array.from(pos.array),elevation=new Float32Array(pos.count),damage=new Float32Array(pos.count),original=new Float32Array(pos.count*3),cols=new T.BufferAttribute(new Float32Array(pos.count*3),3);geo.setAttribute('color',cols);
const noise=(x,y,z)=>Math.sin(x*5.4+Math.cos(z*4))*Math.cos(y*6.1-z*2.8)+.5*Math.sin(x*12+y*8)*Math.cos(z*11)+.24*Math.sin(x*26-z*22)*Math.sin(y*21);
for(let i=0;i<pos.count;i++){let x=base[i*3]/R,y=base[i*3+1]/R,z=base[i*3+2]/R,n=noise(x,y,z),land=n>.23;elevation[i]=land?Math.min(.12,(n-.23)*.09):0;let c=land?(n>.8?[.72,.71,.63]:[.25+.13*n,.39+.16*n,.33+.06*n]):[.025,.14+.025*n,.24+.06*n];original.set(c,i*3)}
const globe=new T.Mesh(geo,new T.MeshStandardMaterial({vertexColors:true,roughness:.85}));world.add(globe);
function update(){for(let i=0;i<pos.count;i++){let r=1+(elevation[i]-damage[i])/R;pos.setXYZ(i,base[i*3]*r,base[i*3+1]*r,base[i*3+2]*r);let d=Math.min(1,damage[i]*13);cols.setXYZ(i,original[i*3]*(1-d)+.84*d,original[i*3+1]*(1-d)+.12*d,original[i*3+2]*(1-d)+.05*d)}pos.needsUpdate=cols.needsUpdate=true;geo.computeVertexNormals()}update();
const creature=new T.Group();scene.add(creature),skin=new T.MeshStandardMaterial({color:0x164351,roughness:.5,metalness:.15}),pale=new T.MeshStandardMaterial({color:0x62a9a0,roughness:.6}),head=new T.Mesh(new T.SphereGeometry(.54,24,18),skin);head.position.z=2.92;head.scale.set(1,.78,.88);creature.add(head);
for(let s of [-1,1]){let eye=new T.Mesh(new T.SphereGeometry(.085,12,10),new T.MeshBasicMaterial({color:0xffd38e}));eye.position.set(s*.3,.13,3.36);creature.add(eye)}
const unit=new T.CylinderGeometry(1,1,1,8),up=new T.Vector3(0,1,0),arms=[];
for(let a=0;a<8;a++){let segs=[];for(let j=0;j<30;j++){let m=new T.Mesh(unit,j%3===0?pale:skin);creature.add(m);segs.push(m)}arms.push({phase:a*Math.PI/4,segs,last:0})}
let yaw=.3,pitch=.15,down=false,px=0,py=0,waves=0,start=-100;const clock=new T.Clock();
function point(arm,u,t,power){let angle=arm.phase+.3*Math.sin(t*.4+arm.phase)+power*.36*Math.sin(u*6-t*2+arm.phase),spread=.33+u*(.8+power*2.2),wave=Math.sin(u*8-t*2+arm.phase)*(.1+.17*u);let v=new T.Vector3(Math.cos(angle)*spread-Math.sin(angle)*wave,Math.sin(angle)*spread*.8+Math.cos(angle)*wave,2.9+Math.sin(u*Math.PI)*(.4+power*.35)-u*(.7+power*2.5));if(power>.2&&u>.6)v.lerp(v.clone().normalize().multiplyScalar(R-.065),power*Math.pow((u-.6)/.4,1.3));return v}
function mark(p){let n=p.clone().normalize();for(let i=0;i<pos.count;i++){let dot=(base[i*3]*n.x+base[i*3+1]*n.y+base[i*3+2]*n.z)/R;if(dot>.973)damage[i]=Math.min(.22,damage[i]+.012*Math.pow((dot-.973)/.027,2))}}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
canvas.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down)return;yaw+=(e.clientX-px)*.006;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-py)*.005));px=e.clientX;py=e.clientY});canvas.addEventListener('pointerup',()=>down=false);
document.querySelector('#attack').onclick=()=>{waves++;start=clock.getElapsedTime();status.textContent='CRUSTAL RUPTURE / WAVE '+String(waves).padStart(2,'0')};document.querySelector('#reset').onclick=()=>{waves=0;start=-100;damage.fill(0);update();status.textContent='CRUST INTACT'};
function tick(){requestAnimationFrame(tick);let t=clock.getElapsedTime(),dt=t-start,power=dt>=0&&dt<5.2?Math.pow(Math.sin(Math.PI*dt/5.2),.6):0;if(!down)yaw+=.0012;world.rotation.set(pitch,yaw,0);creature.rotation.set(pitch,yaw,0);let changed=false;
for(let arm of arms){let points=[];for(let j=0;j<=30;j++)points.push(point(arm,j/30,t,power));for(let j=0;j<30;j++){let p=points[j],q=points[j+1],m=arm.segs[j],d=q.clone().sub(p);m.position.copy(p).add(q).multiplyScalar(.5);m.quaternion.setFromUnitVectors(up,d.clone().normalize());let radius=Math.max(.013,.13*Math.pow(1-j/30,1.45));m.scale.set(radius,d.length()*1.08,radius)}if(power>.46&&t-arm.last>.09){mark(points[30]);arm.last=t;changed=true}}if(changed)update();renderer.render(scene,camera)}tick();
</script></html>
