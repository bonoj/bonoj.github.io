<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12131c"><title>Friction Garden · Hold to Deform</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#12131c;color:#eee9e2;font:14px system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;padding:18px 12px max(18px,env(safe-area-inset-bottom));max-width:680px;margin:auto}header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}h1{font-size:19px;margin:0;font-weight:650}header a{color:#a9a4bb;text-decoration:none;font-size:12px}.sub{font-size:11px;letter-spacing:.13em;color:#b6acb8;margin:7px 0 16px}.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;flex:1;min-height:0;max-height:520px}.col{display:flex;flex-direction:column;align-items:center;min-width:0;touch-action:none;user-select:none;cursor:pointer}.num{font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:6px}.track{position:relative;flex:1;width:100%;background:#20212e;border-radius:9px;overflow:visible;display:flex;align-items:flex-end}.fill{width:100%;border-radius:7px 7px 3px 3px;min-height:0;display:flex;justify-content:center;padding-top:6px;overflow:hidden;transition:height .07s linear}.glyph{font-size:clamp(17px,5vw,27px)}.label{text-align:center;font-size:10px;line-height:1.2;min-height:35px;margin-top:9px;white-space:pre-line}.particle{position:absolute;z-index:5;pointer-events:none;font-size:20px;animation:fall .9s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),100px) rotate(var(--rot));opacity:0}}footer{padding-top:15px;font-size:12px;color:#a9a4bb;display:flex;align-items:center;justify-content:space-between;gap:12px}.hint{font-size:12px;color:#c2b7bf;margin-top:12px;text-align:center}button{border:1px solid #676072;background:#262431;color:#eee9e2;border-radius:9px;padding:8px 13px;font:inherit}</style></head><body><main><header><h1>Corporate Friction Garden™</h1><a href="./">✦ Assets</a></header><div class="sub">HOLD TO DEFORM · RELEASE TO REGROW</div><div class="bars" id="bars"></div><div class="hint">Hold any stack to shed its friction. The others grow untouched.</div><footer><span id="status">🧹 0 irritations removed</span><button id="reset">↻ Reset</button></footer></main><script>
(()=>{'use strict';const seed=[['Paywalls','💰','#b88648',38],['Cookie\nmazes','🍪','#aa6b48',49],['Sign-up\ngates','🔒','#8170b3',34],['Dark\npatterns','🕸️','#b75e79',58],['AI\nslop','🤖','#638ca8',44],['Support\nloops','☎️','#72917b',51]];let shed=0,last=performance.now();const bars=document.getElementById('bars');const data=seed.map(([name,emoji,color,value])=>{const el=document.createElement('div');el.className='col';el.innerHTML='<div class="num"></div><div class="track"><div class="fill"><span class="glyph"></span></div></div><div class="label"></div>';const d={name,emoji,color,v:value,holding:false,el,track:el.querySelector('.track'),fill:el.querySelector('.fill'),glyph:el.querySelector('.glyph'),num:el.querySelector('.num')};d.fill.style.background=color;el.querySelector('.label').textContent=name;el.addEventListener('pointerdown',e=>{e.preventDefault();d.holding=true;el.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>d.holding=false);bars.append(el);return d});
function particle(d){const p=document.createElement('span');p.className='particle';p.textContent=d.emoji;p.style.left=(15+Math.random()*60)+'%';p.style.bottom=Math.min(d.track.clientHeight-12,d.v*d.track.clientHeight/100)+'px';p.style.setProperty('--dx',((Math.random()-.5)*110)+'px');p.style.setProperty('--rot',((Math.random()-.5)*260)+'deg');d.track.append(p);setTimeout(()=>p.remove(),900)}
function frame(t){const dt=Math.min(.12,(t-last)/1000);last=t;data.forEach((d,i)=>{if(d.holding){const loss=Math.min(d.v,27*dt);d.v-=loss;shed+=loss;if(Math.random()<dt*14)particle(d)}else d.v=Math.min(100,d.v+dt*(1.2+i*.14));d.fill.style.height=d.v+'%';d.num.textContent=Math.round(d.v);d.glyph.textContent=d.v>16?d.emoji:''});document.getElementById('status').textContent='🧹 '+Math.floor(shed)+' irritations removed';requestAnimationFrame(frame)}document.getElementById('reset').onclick=()=>{data.forEach((d,i)=>{d.v=seed[i][3];d.holding=false});shed=0};requestAnimationFrame(frame)})();
</script></body></html>
