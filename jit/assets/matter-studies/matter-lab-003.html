<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matter Lab 003</title><style>body{background:#0c1118;color:#e4eeee;font:12px monospace;margin:0}main{max-width:1000px;margin:auto;padding:12px}canvas{width:100%;height:min(65vh,610px);display:block;touch-action:none;border-radius:10px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}button{background:#27383a;color:inherit;border:1px solid #587e82;border-radius:7px;padding:10px 3px}button.active{background:#326e74}section{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input{flex:1;min-width:80px}p{line-height:1.6}</style><main><h2>Matter Lab 003 / Geometry Without Drawing</h2><canvas id="c"></canvas><nav id="tabs"></nav><section>Complexity<input id="complex" type="range" min="1" max="100" value="55">Evolution<input id="rate" type="range" min="0" max="100" value="55"><button id="reset">Reseed</button><button id="pause">Pause</button></section><p id="desc"></p><small id="status"></small></main><script>
(()=>{const cv=document.querySelector('#c'),ctx=cv.getContext('2d',{alpha:false}),tab=document.querySelector('#tabs'),desc=document.querySelector('#desc'),status=document.querySelector('#status'),complex=document.querySelector('#complex'),rate=document.querySelector('#rate');const names=['Power Diagram','Strange Attractor','Optical Caustics','Cellular Life','Hydraulic Erosion','Quasicrystal'],descs=['Weighted nearest-site geometry; touch inserts a site.','Nonlinear iterative trajectories accumulate in a density field; touch alters parameters.','Refracted rays accumulate in folds and cusps; touch adds a lens.','Conway birth and survival rules; touch seeds cells.','Height, water and sediment interact downhill; touch to add rain.','Incommensurate waves create quasiperiodic order; touch shifts phase.'];const W=240,H=164,N=W*H,buf=document.createElement('canvas');buf.width=W;buf.height=H;const bc=buf.getContext('2d');let img=bc.createImageData(W,H),pix=img.data,mode=0,t=0,paused=false,down=false,seed=0,sites=[],lenses=[],rain=[],field,other,water,sed,heat,p={x:.1,y:.1},phase=0,rng=1;const id=(x,y)=>((y+H)%H)*W+((x+W)%W),cl=x=>Math.max(0,Math.min(1,x)),fract=x=>x-Math.floor(x);function rand(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return(rng>>>0)/4294967296}function noise(x,y){let ix=Math.floor(x),iy=Math.floor(y),fx=fract(x),fy=fract(y);fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const h=(x,y)=>fract(Math.sin(x*127.1+y*311.7+seed*7.3)*43758.5453);return(h(ix,iy)*(1-fx)+h(ix+1,iy)*fx)*(1-fy)+(h(ix,iy+1)*(1-fx)+h(ix+1,iy+1)*fx)*fy}function fbm(x,y){let s=0,a=.5;for(let k=0;k<4;k++){s+=a*noise(x,y);x*=2.03;y*=2.03;a*=.5}return s}function splat(x,y,r,fn){for(let yy=Math.max(1,Math.floor(y-r));yy<Math.min(H-1,Math.ceil(y+r));yy++)for(let xx=Math.max(1,Math.floor(x-r));xx<Math.min(W-1,Math.ceil(x+r));xx++){let v=1-Math.hypot(xx-x,yy-y)/r;if(v>0)fn(id(xx,yy),v)}}function site(x,y){sites.push({x,y,w:80+rand()*400,v:rand()});if(sites.length>60)sites.shift()}function init(){rng=(Math.random()*4294967295)|0;seed=rand()*100;t=0;field=new Float32Array(N);other=new Float32Array(N);water=new Float32Array(N);sed=new Float32Array(N);heat=new Float32Array(N);sites=[];lenses=[];rain=[];p={x:.1,y:.1};phase=rand()*3;if(mode===0)for(let k=0;k<22;k++)site(rand()*W,rand()*H);if(mode===2)lenses.push({x:W/2,y:H/2,s:1});if(mode===3)for(let i=0;i<N;i++)field[i]=rand()<.22?1:0;if(mode===4)for(let y=0;y<H;y++)for(let x=0;x<W;x++)field[id(x,y)]=.12+.7*fbm(x*.015,y*.015)+.14*fbm(x*.08,y*.08)}function touch(x,y){if(mode===0)site(x,y);if(mode===1){phase=x/W*2-1;p={x:.1,y:y/H*.2};heat.fill(0)}if(mode===2){lenses.push({x,y,s:rand()<.5?-1:1});if(lenses.length>8)lenses.shift()}if(mode===3)splat(x,y,9,(i,v)=>{if(rand()<v)field[i]=1});if(mode===4)rain.push({x,y,ttl:150});if(mode===5)phase+=.3}function step(){t++;let speed=+rate.value/100,comp=+complex.value/100;if(mode===0)for(let s of sites){s.x+=Math.sin(t*.005+s.v*9)*.04*speed;s.y+=Math.cos(t*.006+s.v*11)*.04*speed}if(mode===1){let a=1.35+phase*.5,b=-2.1,c=1.4+comp*.8,d=-2.2;for(let k=0;k<9000;k++){let nx=Math.sin(a*p.y)-Math.cos(b*p.x),ny=Math.sin(c*p.x)-Math.cos(d*p.y);p.x=nx;p.y=ny;let x=((nx+2.1)/4.2*W)|0,y=((ny+2.1)/4.2*H)|0;if(x>=0&&x<W&&y>=0&&y<H)heat[id(x,y)]++}if(t%80===0)for(let i=0;i<N;i++)heat[i]*=.94}if(mode===2){heat.fill(0);for(let k=0;k<15000+comp*12000;k++){let x=rand()*W,y=rand()*H,gx=0,gy=0;for(let l of lenses){let dx=x-l.x,dy=y-l.y,rr=dx*dx+dy*dy+250,f=l.s*85000/(rr*rr);gx+=dx*f;gy+=dy*f}gx+=Math.sin(y/H*17+t*.008*speed)*3;gy+=Math.sin(x/W*13-t*.008*speed)*2;let xx=Math.floor(x+gx),yy=Math.floor(y+gy);if(xx>=0&&xx<W&&yy>=0&&yy<H)heat[id(xx,yy)]++}}if(mode===3){for(let z=0;z<1+Math.floor(speed*2);z++){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy)n+=field[id(x+dx,y+dy)];let i=id(x,y);other[i]=field[i]?(n===2||n===3?1:0):(n===3?1:0)}[field,other]=[other,field]}}if(mode===4){for(let z=0;z<1+Math.floor(speed*3);z++){for(let k=0;k<70;k++)water[id(rand()*W|0,rand()*H|0)]+=.018;for(let r of rain){if(r.ttl>0){for(let k=0;k<100;k++){let x=Math.floor(r.x+(rand()-.5)*24),y=Math.floor(r.y+(rand()-.5)*24);if(x>=0&&x<W&&y>=0&&y<H)water[id(x,y)]+=.07}r.ttl--}}for(let k=0;k<18000;k++){let x=1+(rand()*(W-2)|0),y=1+(rand()*(H-2)|0),i=id(x,y);if(water[i]<.005)continue;let best=i,h=field[i]+water[i];for(let j of [id(x-1,y),id(x+1,y),id(x,y-1),id(x,y+1)]){let hh=field[j]+water[j];if(hh<h){h=hh;best=j}}if(best!==i){let amount=Math.min(water[i],Math.max(.002,(field[i]+water[i]-h)*.25));water[i]-=amount;water[best]+=amount;let erode=Math.min(field[i],amount*.003);field[i]-=erode;sed[best]+=sed[i]*Math.min(.5,amount*4)+erode;sed[i]*=.92}else{field[i]+=sed[i]*.02;sed[i]*=.98}water[i]*=.999}}rain=rain.filter(r=>r.ttl>0)}}function render(){let comp=+complex.value/100;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y),r=0,g=0,b=0;if(mode===0){let best=1e10,second=1e10,which=0;for(let k=0;k<sites.length;k++){let s=sites[k],dx=x-s.x,dy=y-s.y,dist=dx*dx+dy*dy-s.w*(.2+comp);if(dist<best){second=best;best=dist;which=k}else if(dist<second)second=dist}let edge=Math.exp(-Math.abs(second-best)*.012),s=sites[which],v=.5+.5*Math.sin(which*2.39),n=noise(x*.14,y*.14);r=36+140*v+70*edge+24*n;g=56+120*(1-v)+75*edge+20*n;b=75+110*s.v+84*edge+20*n}if(mode===1){let v=Math.log1p(heat[i])*.21,edge=Math.log1p(heat[id(x+1,y)]+heat[id(x,y+1)])*.12;r=8+110*v+70*edge;g=12+175*v+80*edge;b=24+235*v+65*edge}if(mode===2){let v=Math.log1p(heat[i])*.65,edge=Math.log1p(heat[id(x+1,y)]+heat[id(x,y+1)])*.18;r=5+115*v+50*edge;g=15+180*v+62*edge;b=35+225*v+85*edge}if(mode===3){let alive=field[i],n=field[id(x-1,y)]+field[id(x+1,y)]+field[id(x,y-1)]+field[id(x,y+1)];r=9+155*alive+55*n*.11;g=15+190*alive+70*n*.11;b=23+145*alive+100*n*.11}if(mode===4){let h=field[i],w=water[i],dx=field[id(x+1,y)]-field[id(x-1,y)],dy=field[id(x,y+1)]-field[id(x,y-1)],light=.75+Math.max(-.4,Math.min(.4,(dx-dy)*4)),moist=Math.min(1,w*8);r=(54+148*h)*light-35*moist;g=(62+125*h)*light+18*moist;b=(48+90*h)*light+110*moist}if(mode===5){let sym=5+Math.floor(comp*7),v=0,xx=(x-W*.5)/W*30,yy=(y-H*.5)/H*22;for(let k=0;k<sym;k++){let ang=k*Math.PI/sym*2;v+=Math.cos(xx*Math.cos(ang)+yy*Math.sin(ang)+phase*k)}v/=sym;let ridge=Math.exp(-Math.abs(v-.15)*13),depth=.5+.5*Math.sin(v*17);r=22+170*depth+75*ridge;g=29+100*(1-depth)+125*ridge;b=53+170*(1-depth)+72*ridge}let j=i*4;pix[j]=Math.max(0,Math.min(255,r));pix[j+1]=Math.max(0,Math.min(255,g));pix[j+2]=Math.max(0,Math.min(255,b));pix[j+3]=255}bc.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(buf,0,0,cv.width,cv.height)}function select(i){mode=i;desc.textContent=descs[i];[...tab.children].forEach((b,j)=>b.classList.toggle('active',i===j));init()}names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+name;b.onclick=()=>select(i);tab.append(b)});function resize(){let d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d)}function pointer(e){let r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);touch(...pointer(e))};cv.onpointermove=e=>{if(down)touch(...pointer(e))};cv.onpointerup=cv.onpointercancel=()=>down=false;document.querySelector('#reset').onclick=init;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};function frame(){if(!paused)step();render();status.textContent=W+' × '+H+' cells · '+t+' updates';requestAnimationFrame(frame)}new ResizeObserver(resize).observe(cv);resize();select(0);frame()})();
</script></html>
