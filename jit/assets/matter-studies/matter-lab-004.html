<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matter Lab 004 · Instability & Organization</title><style>body{margin:0;background:#0a1016;color:#edf0ec;font:12px ui-monospace,monospace}main{max-width:960px;margin:auto;padding:12px}canvas{width:100%;height:min(65vh,600px);display:block;border-radius:9px;touch-action:none}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}button{background:#1d3035;color:inherit;border:1px solid #567979;border-radius:6px;padding:10px 4px}button.active{background:#376b69}section{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input{flex:1;min-width:70px}p{line-height:1.6}</style><main><h2>Matter Lab 004 / Instability & Organization</h2><canvas id="c"></canvas><nav id="tabs"></nav><section>Intensity<input id="intensity" type="range" min="0" max="100" value="55">Resolution<input id="resolution" type="range" min="1" max="5" value="3"><button id="reset">Reseed</button><button id="pause">Pause</button></section><p id="desc"></p><small id="status"></small></main><script>
(()=>{const cv=document.querySelector('#c'),ctx=cv.getContext('2d',{alpha:false}),tabs=document.querySelector('#tabs'),desc=document.querySelector('#desc'),status=document.querySelector('#status'),intensity=document.querySelector('#intensity'),resolution=document.querySelector('#resolution');const names=['Magnetic Domains','Percolation','Dielectric Breakdown','Elastic Membrane','Phase Separation','Transport Network'],descs=['Ising-like neighboring spins align under thermal agitation. Touch magnetizes.','Water invades a porous medium through connected accessible cells. Touch opens pores.','A discharge advances toward grounded electrodes along a noisy potential field. Touch adds an electrode.','A spring lattice carries and damps waves. Touch deforms it.','Conserved concentration separates into domains by chemical-potential diffusion. Touch changes composition.','Agents reinforce routes between resource nodes; unused paths fade. Touch adds a resource.'];const W=216,H=148,N=W*H,buf=document.createElement('canvas');buf.width=W;buf.height=H;const bc=buf.getContext('2d');let img=bc.createImageData(W,H),pix=img.data,mode=0,t=0,paused=false,down=false,rng=1,seed=1,a,b,d,aa,bb,agents=[],nodes=[],targets=[],frontier=[];const id=(x,y)=>((y+H)%H)*W+((x+W)%W),cl=x=>Math.max(0,Math.min(1,x));function rand(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return(rng>>>0)/4294967296}function noise(x,y){return .5+.25*Math.sin(x*.083+y*.127+seed)+.25*Math.sin(x*.21-y*.19+seed*2)}function splat(x,y,r,fn){for(let yy=Math.max(1,Math.floor(y-r));yy<Math.min(H-1,Math.ceil(y+r));yy++)for(let xx=Math.max(1,Math.floor(x-r));xx<Math.min(W-1,Math.ceil(x+r));xx++){let q=1-Math.hypot(xx-x,yy-y)/r;if(q>0)fn(id(xx,yy),q,xx,yy)}}function init(){rng=(Math.random()*4294967295)|0;seed=rand()*100;t=0;a=new Float32Array(N);b=new Float32Array(N);d=new Float32Array(N);aa=new Float32Array(N);bb=new Float32Array(N);agents=[];nodes=[];targets=[];frontier=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y),n=noise(x,y);if(mode===0)a[i]=rand()<.5?-1:1;if(mode===1)a[i]=rand()<.57?1:0;if(mode===2)b[i]=n;if(mode===4)a[i]=rand()*2-1;if(mode===5)b[i]=n}if(mode===1)for(let y=0;y<H;y++)if(a[id(1,y)]>0){b[id(1,y)]=1;frontier.push({x:1,y})}if(mode===2){let x=W>>1;a[id(x,1)]=1;frontier.push({x,y:1});targets=[{x:W*.5,y:H-4}]}if(mode===5){nodes=[{x:W*.5,y:H*.5},{x:W*.2,y:H*.2},{x:W*.8,y:H*.3},{x:W*.3,y:H*.8}];for(let k=0;k<900;k++)agents.push({x:W*.5,y:H*.5,goal:1+(rand()*(nodes.length-1)|0)})}}function touch(x,y){if(mode===0)splat(x,y,13,(i,q)=>{if(rand()<q)a[i]=1});if(mode===1)splat(x,y,9,(i,q,xx,yy)=>{if(rand()<q){a[i]=1;b[i]=1;frontier.push({x:xx,y:yy})}});if(mode===2){targets.push({x,y});if(targets.length>5)targets.shift()}if(mode===3)splat(x,y,12,(i,q)=>a[i]+=q*2);if(mode===4)splat(x,y,13,(i,q)=>a[i]=Math.min(1,a[i]+q*1.5));if(mode===5){nodes.push({x,y});if(nodes.length>12)nodes.shift()}}function lap(z,x,y){return z[id(x-1,y)]+z[id(x+1,y)]+z[id(x,y-1)]+z[id(x,y+1)]-4*z[id(x,y)]}function step(){t++;let e=+intensity.value/100;if(mode===0){let attempts=Math.floor(3500+e*5000),temp=.3+e*3.4;for(let k=0;k<attempts;k++){let x=1+(rand()*(W-2)|0),y=1+(rand()*(H-2)|0),i=id(x,y),spin=a[i],sum=a[id(x-1,y)]+a[id(x+1,y)]+a[id(x,y-1)]+a[id(x,y+1)],delta=2*spin*sum;if(delta<=0||rand()<Math.exp(-delta/temp))a[i]=-spin}}if(mode===1){for(let k=0;k<150+e*900;k++){if(!frontier.length)break;let p=frontier[rand()*frontier.length|0],x=p.x+(rand()<.5?-1:1),y=p.y+(rand()<.5?-1:1);if(x<1||x>=W-1||y<1||y>=H-1)continue;let i=id(x,y);if(a[i]>0&&b[i]===0){b[i]=1;frontier.push({x,y})}}if(frontier.length>12000)frontier.splice(0,frontier.length-10000)}if(mode===2){for(let k=0;k<2+e*9;k++){if(!frontier.length)break;let p=frontier[rand()*frontier.length|0],choices=[];for(let [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){let x=p.x+dx,y=p.y+dy;if(x<1||x>=W-1||y<1||y>=H-1||a[id(x,y)]>0)continue;let dist=targets.reduce((best,q)=>Math.min(best,Math.hypot(q.x-x,q.y-y)),9999),weight=Math.exp(-dist*.025)*(.1+b[id(x,y)]);choices.push({x,y,weight})}if(!choices.length)continue;let total=choices.reduce((s,q)=>s+q.weight,0),v=rand()*total,q=choices[0];for(let ch of choices){v-=ch.weight;if(v<=0){q=ch;break}}a[id(q.x,q.y)]=1;frontier.push({x:q.x,y:q.y});if(frontier.length>10000)frontier.shift()}}if(mode===3){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y),accel=lap(a,x,y)*(.12+e*.13)-b[i]*.035;bb[i]=b[i]+accel;aa[i]=a[i]+bb[i]}[a,aa]=[aa,a];[b,bb]=[bb,b]}if(mode===4){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y),v=a[i];b[i]=v*v*v-v-(.4+e*.4)*lap(a,x,y)}for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y);aa[i]=Math.max(-1.4,Math.min(1.4,a[i]+(.025+e*.035)*lap(b,x,y)))}[a,aa]=[aa,a]}if(mode===5){for(let p of agents){let goal=nodes[p.goal%nodes.length];if(!goal)continue;let dx=goal.x-p.x,dy=goal.y-p.y;if(dx*dx+dy*dy<50){p.goal=(p.goal+1)%nodes.length;continue}let angle=Math.atan2(dy,dx),best=-1e9,chosen=angle;for(let j=-2;j<=2;j++){let dir=angle+j*.28,xx=p.x+Math.cos(dir)*5,yy=p.y+Math.sin(dir)*5;if(xx<2||xx>=W-2||yy<2||yy>=H-2)continue;let score=a[id(xx|0,yy|0)]*.8-Math.abs(j)*.05+rand()*.15;if(score>best){best=score;chosen=dir}}p.x+=Math.cos(chosen)*(1+e);p.y+=Math.sin(chosen)*(1+e);if(p.x<1||p.x>=W-1||p.y<1||p.y>=H-1){p.x=W*.5;p.y=H*.5}a[id(p.x|0,p.y|0)]=Math.min(1,a[id(p.x|0,p.y|0)]+.1)}for(let i=0;i<N;i++)a[i]*=.997}}function paint(){let sc=+resolution.value;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y),v=a[i],r=0,g=0,bl=0,n=noise(x*sc*.4,y*sc*.4);if(mode===0){let boundary=0;for(let j of [id(x+1,y),id(x-1,y),id(x,y+1),id(x,y-1)])if(a[j]!==v)boundary++;let k=(v+1)/2;r=25+153*k+boundary*25+20*n;g=38+83*k+boundary*30+18*n;bl=83+77*(1-k)+boundary*34+15*n}if(mode===1){let pore=a[i],wet=b[i],edge=Math.abs(wet-b[id(x+1,y)])+Math.abs(wet-b[id(x,y+1)]);r=22+80*pore+22*wet+55*edge+20*n;g=26+72*pore+115*wet+75*edge+20*n;bl=32+75*pore+170*wet+85*edge+20*n}if(mode===2){let glow=a[i],near=a[id(x-1,y)]+a[id(x+1,y)]+a[id(x,y-1)]+a[id(x,y+1)];r=10+220*glow+24*near;g=16+222*glow+25*near;bl=38+255*glow+35*near}if(mode===3){let slope=Math.abs(a[id(x+1,y)]-a[id(x-1,y)])+Math.abs(a[id(x,y+1)]-a[id(x,y-1)]),shade=Math.max(-1,Math.min(1,v*.45));r=43+80*shade+115*slope;g=64+102*shade+125*slope;bl=91+133*shade+130*slope}if(mode===4){let k=(v+1)/2,edge=Math.abs(v-a[id(x+1,y)])+Math.abs(v-a[id(x,y+1)]);r=20+177*k+55*edge;g=32+95*(1-k)+85*edge;bl=48+160*(1-k)+90*edge}if(mode===5){let path=v,edge=Math.abs(v-a[id(x+1,y)])+Math.abs(v-a[id(x,y+1)]);r=14+165*path+70*edge+16*n;g=24+181*path+82*edge+17*n;bl=35+111*path+58*edge+18*n}let j=i*4;pix[j]=Math.max(0,Math.min(255,r));pix[j+1]=Math.max(0,Math.min(255,g));pix[j+2]=Math.max(0,Math.min(255,bl));pix[j+3]=255}bc.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(buf,0,0,cv.width,cv.height)}function select(i){mode=i;desc.textContent=descs[i];[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));init()}names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+name;b.onclick=()=>select(i);tabs.append(b)});function resize(){let d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d)}function pointer(e){let r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);touch(...pointer(e))};cv.onpointermove=e=>{if(down)touch(...pointer(e))};cv.onpointerup=cv.onpointercancel=()=>down=false;document.querySelector('#reset').onclick=init;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};function frame(){if(!paused)step();paint();status.textContent=W+' × '+H+' cells · '+t+' updates · '+(paused?'paused':'evolving');requestAnimationFrame(frame)}new ResizeObserver(resize).observe(cv);resize();select(0);frame()})();
