<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solar Lab 007 · A Star That Remembers</title><style>body{background:#090d13;color:#f1e6d4;font:12px monospace;margin:0}main{max-width:960px;margin:auto;padding:12px}canvas{width:100%;height:min(65vh,610px);display:block;touch-action:none;border-radius:10px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}button{background:#392b21;color:inherit;border:1px solid #927552;border-radius:7px;padding:10px 4px}button.active{background:#895d2b}section{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{flex:1;min-width:70px}p{line-height:1.6}#metrics{margin-top:10px;color:#cbbba7}</style><main><h2>Solar Lab 007 · A Star That Remembers</h2><canvas id="c"></canvas><nav id="views"></nav><section>Driving<input id="drive" type="range" min="0" max="100" value="48">Magnetic coupling<input id="couple" type="range" min="0" max="100" value="60"><button id="reset">New star</button><button id="pause">Pause</button></section><p id="desc"></p><div id="metrics"></div><p id="event"></p><small>One persistent coupled cellular approximation · touch to inject heat and twist magnetic flux · not a physical MHD solver.</small></main><script>
(()=>{const cv=document.querySelector('#c'),ctx=cv.getContext('2d',{alpha:false}),views=document.querySelector('#views'),desc=document.querySelector('#desc'),drive=document.querySelector('#drive'),couple=document.querySelector('#couple'),metrics=document.querySelector('#metrics'),eventEl=document.querySelector('#event');const labels=['Photosphere','Temperature','Convection','Magnetic Flux','Stress Map','Reconnection'],descs=['Composite surface: bright upwellings, sinking lanes, magnetic suppression, and releases.','Thermal transport and diffusion.','Flow speed and vorticity.','Signed magnetic polarity carried by flow.','Gradients and magnetic stress indicate instability.','History of local magnetic energy releases.'];const W=128,H=96,N=W*H,buf=document.createElement('canvas');buf.width=W;buf.height=H;const bc=buf.getContext('2d',{alpha:false}),img=bc.createImageData(W,H),pixels=img.data;let T,B,U,V,P,NT,NB,NU,NV,NP,rng=1234,tick=0,mode=0,paused=false,down=false,events=0,stress=0,simMs=0,renderMs=0,lastEvent='Awaiting instability',eventAge=0;const id=(x,y)=>((y+H)%H)*W+((x+W)%W),cl=x=>Math.max(0,Math.min(1,x)),lim=(x,a,b)=>Math.max(a,Math.min(b,x));function rand(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return(rng>>>0)/4294967296}function sample(a,x,y){let ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,p=a[id(ix,iy)]*(1-fx)+a[id(ix+1,iy)]*fx,q=a[id(ix,iy+1)]*(1-fx)+a[id(ix+1,iy+1)]*fx;return p*(1-fy)+q*fy}function init(){rng=(Math.random()*4294967295)|0;tick=0;events=0;stress=0;T=new Float32Array(N);B=new Float32Array(N);U=new Float32Array(N);V=new Float32Array(N);P=new Float32Array(N);NT=new Float32Array(N);NB=new Float32Array(N);NU=new Float32Array(N);NV=new Float32Array(N);NP=new Float32Array(N);for(let i=0;i<N;i++){T[i]=.42+rand()*.25;B[i]=(rand()-.5)*.22;U[i]=(rand()-.5)*.1;V[i]=(rand()-.5)*.1}for(let k=0;k<12;k++){let x=rand()*W,y=rand()*H,sgn=rand()<.5?-1:1;for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){let r2=dx*dx+dy*dy;if(r2<=81)B[id((x+dx)|0,(y+dy)|0)]+=sgn*.7*Math.exp(-r2/35)}}lastEvent='New stellar state initialized';eventAge=0}function touch(x,y){for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){let r2=dx*dx+dy*dy;if(r2>49)continue;let i=id((x+dx)|0,(y+dy)|0),q=Math.exp(-r2/15);T[i]=lim(T[i]+q*.18,.05,1.6);B[i]=lim(B[i]+q*(mode===3||mode===4?1.1:.65)*(dx>=0?1:-1),-2,2);U[i]+=-dy*q*.018;V[i]+=dx*q*.018}}function step(){tick++;let forcing=+drive.value/100,mag=+couple.value/100,sumStress=0,released=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y),l=id(x-1,y),r=id(x+1,y),u=id(x,y-1),d=id(x,y+1),temp=T[i],flux=B[i],vx=U[i],vy=V[i],tLap=T[l]+T[r]+T[u]+T[d]-4*temp,bLap=B[l]+B[r]+B[u]+B[d]-4*flux,gradX=(T[r]-T[l])*.5,gradY=(T[d]-T[u])*.5,bx=(B[r]-B[l])*.5,by=(B[d]-B[u])*.5,ax=x-vx*.75,ay=y-vy*.75,ta=sample(T,ax,ay),ba=sample(B,ax,ay),ua=sample(U,ax,ay),va=sample(V,ax,ay),magnetic=Math.min(1,Math.abs(flux)*.45),driveX=-gradX*(.08+forcing*.12)*(1-mag*magnetic*.75),driveY=-gradY*(.08+forcing*.12)*(1-mag*magnetic*.75),swirl=(T[r]-T[l])*(T[d]-T[u])*.01;NU[i]=lim(ua*.978+driveX+by*flux*mag*.012+swirl,-1.6,1.6);NV[i]=lim(va*.978+driveY-bx*flux*mag*.012-swirl,-1.6,1.6);NT[i]=lim(ta+.065*tLap+(.48-temp)*(.003+forcing*.006)+.002*forcing*(rand()-.5),.02,1.5);NB[i]=lim(ba+.018*bLap+mag*(flux*(U[r]-U[l]+V[d]-V[u]))*.009,-2,2);NP[i]=P[i]*.94;let localStress=Math.abs(flux)*(Math.abs(bx)+Math.abs(by));sumStress+=localStress;if(localStress>(.56+.25*(1-mag))&&rand()<.0007+forcing*.0015){let release=Math.min(.8,localStress*.3);NB[i]*=.45;NT[i]=lim(NT[i]+release,.02,1.5);NP[i]=1;released++;for(let j of [l,r,u,d]){NP[j]=Math.max(NP[j],.45);NT[j]=Math.min(1.5,NT[j]+release*.15)}}}[T,NT]=[NT,T];[B,NB]=[NB,B];[U,NU]=[NU,U];[V,NV]=[NV,V];[P,NP]=[NP,P];stress=sumStress/N;if(released){events+=released;lastEvent=released+' local reconnection event(s) · cycle '+tick;eventAge=0}else eventAge++}function render(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y),temp=T[i],flux=B[i],vx=U[i],vy=V[i],release=P[i],gradient=Math.abs(B[id(x+1,y)]-B[id(x-1,y)])+Math.abs(B[id(x,y+1)]-B[id(x,y-1)]),vorticity=(V[id(x+1,y)]-V[id(x-1,y)]-U[id(x,y+1)]+U[id(x,y-1)])*.5,r=0,g=0,b=0;if(mode===0){let lum=cl((temp-.16)*1.65),dark=Math.min(.75,Math.abs(flux)*.3),hot=cl(lum*(1-dark)+release*.7);r=35+220*hot;g=10+190*hot*hot;b=7+105*Math.pow(hot,4)+release*90}if(mode===1){let h=cl(temp/1.3);r=20+235*h;g=15+185*h*h;b=35+160*Math.pow(h,4)}if(mode===2){let speed=Math.hypot(vx,vy),v=cl(speed*2.8),swirl=cl(Math.abs(vorticity)*3);r=20+200*swirl;g=35+180*v;b=65+175*(1-swirl)*v}if(mode===3){let pos=cl(flux*.8),neg=cl(-flux*.8),edge=cl(gradient*.6);r=18+220*pos+90*edge;g=20+105*edge;b=35+220*neg+90*edge}if(mode===4){let v=cl(Math.abs(flux)*gradient*.65);r=15+230*v;g=12+145*v*v;b=30+105*v*v*v}if(mode===5){let v=cl(release),background=cl(temp*.35);r=15+230*v+70*background;g=15+220*v+30*background;b=28+255*v+18*background}let j=i*4;pixels[j]=lim(r,0,255);pixels[j+1]=lim(g,0,255);pixels[j+2]=lim(b,0,255);pixels[j+3]=255}bc.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(buf,0,0,cv.width,cv.height)}function select(i){mode=i;desc.textContent=descs[i];[...views.children].forEach((b,j)=>b.classList.toggle('active',i===j))}labels.forEach((label,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+label;b.onclick=()=>select(i);views.append(b)});function resize(){let d=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(cv.clientWidth*d));cv.height=Math.max(1,Math.round(cv.clientHeight*d))}function pointer(ev){let r=cv.getBoundingClientRect();return[(ev.clientX-r.left)/r.width*W,(ev.clientY-r.top)/r.height*H]}cv.onpointerdown=ev=>{down=true;cv.setPointerCapture(ev.pointerId);touch(...pointer(ev))};cv.onpointermove=ev=>{if(down)touch(...pointer(ev))};cv.onpointerup=cv.onpointercancel=()=>down=false;document.querySelector('#reset').onclick=init;document.querySelector('#pause').onclick=ev=>{paused=!paused;ev.target.textContent=paused?'Resume':'Pause'};let last=0;function frame(now){if(!paused){let a=performance.now();step();simMs=performance.now()-a}let a=performance.now();render();renderMs=performance.now()-a;if(now-last>180){metrics.textContent='SIM '+simMs.toFixed(1)+' ms · RENDER '+renderMs.toFixed(1)+' ms · RECONNECTIONS '+events+' · STRESS '+stress.toFixed(3);eventEl.textContent=eventAge<180?lastEvent:'Magnetic structure evolving · '+tick+' cycles';last=now}requestAnimationFrame(frame)}new ResizeObserver(resize).observe(cv);resize();init();select(0);requestAnimationFrame(frame)})();
</script></html>
