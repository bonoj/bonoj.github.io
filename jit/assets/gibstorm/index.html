const c=document.querySelector('#c'),g=c.getContext('2d'),$=s=>document.querySelector(s),D=[['SIDEARM','⌁',170,1,18,'#ffe49a'],['SHOTGUN','✹',510,9,10,'#ffb469'],['MINIGUN','≋',65,1,8,'#b4faff'],['RAILGUN','⚡',730,1,100,'#77eaff'],['ROCKET','✦',610,1,65,'#ff8559'],['PLASMA','◈',115,2,16,'#bb8cff']],colors=['#fa4f83','#78ff9c','#e48aff','#ff8d47'];let w,h,gun=0,playing=false,score=0,hp=100,wave=1,combo=1,killTime=0,lastShot=-1000,last=0,now=0,spawnTime=0,shake=0,flash=0,held=false,ax=0,ay=0,targets=[],bits=[],trails=[],labels=[],shells=[];const rnd=(a,b)=>a+Math.random()*(b-a);function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);ax=w/2;ay=h*.43}addEventListener('resize',resize);resize();D.forEach((d,i)=>{let b=document.createElement('button');b.innerHTML='<div style="font-size:20px">'+d[1]+'</div>'+d[0];b.onclick=()=>{gun=i;[...$('#weapons').children].forEach((x,j)=>x.classList.toggle('active',i===j))};$('#weapons').append(b)});$('#weapons').firstChild.classList.add('active');function spawn(){let type=Math.floor(rnd(0,4));targets.push({x:rnd(.08,.92),y:rnd(.4,.65),z:.08,type,hp:[24,45,16,80][type]*(1+wave*.1),max:[24,45,16,80][type]*(1+wave*.1),phase:rnd(0,7),speed:rnd(.055,.11)*(1+wave*.07),hit:0})}function pos(t){let z=t.z;return{x:w/2+(t.x-.5)*w*(.65+z*.7)+Math.sin(now*.0018+t.phase)*9*z,y:h*.34+(t.y-.34)*h*(.45+z*.9)+z*h*.19,r:(14+[8,18,-1,24][t.type])*(.23+z*1.25)*1.55+z*13}}function burst(x,y,col,n,p=1){for(let i=0;i<n&&bits.length<1300;i++){let a=rnd(0,7),v=rnd(45,350)*p;bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-rnd(10,120),life:rnd(.35,1.3),r:rnd(1.5,7)*p,col:Math.random()<.25?'#ffde83':col,chunk:Math.random()<.22})}}function gib(t,p){burst(p.x,p.y,colors[t.type],75,1.2);burst(p.x,p.y,'#b7ffef',20,.6);shake+=11;flash=.12;let points=100*combo;score+=points;combo=Math.min(12,combo+1);killTime=now;labels.push({x:p.x,y:p.y,txt:'+'+points,life:1});$('#score').textContent=Stri er(t=>t.life>0);g.globalAlpha=1;g.shadowBlur=0;for(let s of shells){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=550*dt;s.life-=dt;g.fillStyle='#ffcf77';g.fillRect(s.x,s.y,3,8)}shells=shells.filter(s=>s.life>0);for(let t of labels){t.y-=45*dt;t.life-=dt;g.globalAlpha=Math.max(0,t.life);g.font='bold 18px monospace';g.textAlign='center';g.fillStyle='#ffe49a';g.fillText(t.txt,t.x,t.y)}labels=labels.filter(t=>t.life>0);g.globalAlpha=1;let d=D[gun],kick=Math.max(0,1-(now-lastShot)/160),width=[26,46,58,25,54,48][gun];g.save();g.translate(w*.5,h*.87+kick*h*.035);g.fillStyle='#050610';g.strokeStyle='#7583a1';g.lineWidth=3;g.beginPath();g.moveTo(-width,0);g.lineTo(-width*.7,-h*.17);g.lineTo(-width*.37,-h*.25);g.lineTo(width*.37,-h*.25);g.lineTo(width*.7,-h*.17);g.lineTo(width,0);g.closePath();g.fill();g.stroke();g.fillStyle=d[5];g.shadowColor=d[5];g.shadowBlur=16;g.fillRect(-width*.22,-h*.24,width*.44,h*.16);g.restore();g.strokeStyle='#fff9';g.lineWidth=1.5;g.beginPath();g.arc(ax,ay,12,0,7);for(let [x,y,X,Y] of [[-21,0,-8,0],[8,0,21,0],[0,-21,0,-8],[0,8,0,21]]){g.moveTo(ax+x,ay+y);g.lineTo(ax+X,ay+Y)}g.stroke();if(flash>0){g.fillStyle='rgba(255,200,120,'+(flash*1.4)+')';g.fillRect(0,0,w,h);flash-=dt}g.restore();if(now-killTime>2800&&combo!==1){combo=1;$('#combo').textContent='COMBO ×1'}wave=1+Math.floor(score/3500);$('#wave').textContent='WAVE '+String(wave).padStart(2,'0');if(held)shoot();requestAnimationFrame(frame)}function pointer(e){ax=e.clientX;ay=e.clientY}c.addEventListener('pointerdown',e=>{e.preventDefault();pointer(e);held=true;c.setPointerCapture(e.pointerId);shoot()});c.addEventListener('pointermove',e=>{if(held)pointer(e)});c.addEventListener('pointerup',()=>held=false);c.addEventListener('pointercancel',()=>held=false);$('#play').onclick=()=>{score=0;hp=100;wave=1;combo=1;targets=[];bits=[];trails=[];labels=[];shells=[];lastShot=-1000;spawnTime=0;playing=true;held=false;$('#score').textContent='000000';$('#health').textContent='100 HP';$('#combo').textContent='COMBO ×1';$(
