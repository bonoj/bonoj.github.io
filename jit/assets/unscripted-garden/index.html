<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>046 · The Unscripted Garden</title><style>*{box-sizing:border-box}body{margin:0;background:#101b22;color:#e9f4ed;font:14px system-ui}main{max-width:1000px;margin:auto;padding:12px}h1{font-size:21px;margin:4px 0 10px}.stage{height:min(76vh,650px);min-height:370px;position:relative;overflow:hidden;border-radius:14px;background:#142631;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.status{position:absolute;top:12px;left:12px;pointer-events:none;font-size:12px;background:#0c1d24c9;padding:8px;border-radius:8px}.controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px}button{background:#253844;color:#f0f8f4;border:1px solid #647b79;border-radius:8px;padding:9px;font:12px system-ui}button[aria-pressed=true]{background:#16664f}.notes{color:#b3c7c4;font-size:12px;line-height:1.5}</style></head><body><main><h1>046 · The Unscripted Garden</h1><div class="stage" id="stage"><canvas id="canvas"></canvas><div class="status" id="status">Five forms of motion · one habitat</div><div class="controls"><button data-focus="all" aria-pressed="true">World</button><button data-focus="stone">Stone</button><button data-focus="walker">Walker</button><button data-focus="floater">Floater</button><button data-focus="vine">Vine</button><button data-focus="flock">Flock</button></div></div><p class="notes">One-prompt procedural world: rolling stone, four-legged walker, pulsating floater, climbing vine and flocking creatures. Drag to orbit · pinch to zoom. Preserved as a rough first-pass specimen, not a finished simulation.</p><script type="module">
const $=id=>document.getElementById(id),stage=$('stage'),canvas=$('canvas');try{
const T=await import('https://esm.sh/three@0.160.1');const scene=new T.Scene();scene.background=new T.Color(0x142631);scene.fog=new T.FogExp2(0x142631,.027);const camera=new T.PerspectiveCamera(45,1,.1,150),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;scene.add(new T.HemisphereLight(0xc5e5ec,0x344b36,2.5));const sun=new T.DirectionalLight(0xffe4a8,3.2);sun.position.set(-7,13,8);scene.add(sun);const rim=new T.DirectionalLight(0x82d4e3,1.2);rim.position.set(7,6,-9);scene.add(rim);
const mat=(color,roughness=.75,metalness=0)=>new T.MeshStandardMaterial({color,roughness,metalness});const green=mat(0x3b6958),moss=mat(0x68916b),rock=mat(0x7b8c86),dark=mat(0x334d53),gold=mat(0xf4bd75),teal=mat(0x73d9ce),purple=mat(0xc49ae5);const V=(x=0,y=0,z=0)=>new T.Vector3(x,y,z);function ball(r,m,parent=scene,seg=20){const o=new T.Mesh(new T.SphereGeometry(r,seg,12),m);parent.add(o);return o}function rod(a,b,r,m,parent=scene){const d=b.clone().sub(a),o=new T.Mesh(new T.CylinderGeometry(r,r,d.length(),8),m);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.clone().normalize());parent.add(o);return o}const terrain=(x,z)=>.13*Math.sin(x*.6)*Math.cos(z*.45)+.08*Math.sin(z*.9+x*.3);const gg=new T.PlaneGeometry(45,45,70,70);gg.rotateX(-Math.PI/2);const pa=gg.attributes.position;for(let i=0;i<pa.count;i++)pa.setY(i,terrain(pa.getX(i),pa.getZ(i)));gg.computeVertexNormals();scene.add(new T.Mesh(gg,mat(0x39574b)));const ring=new T.Mesh(new T.TorusGeometry(9.3,.06,8,120),mat(0x719b83));ring.rotation.x=Math.PI/2;ring.position.y=.13;scene.add(ring);for(let i=0;i<90;i++){const a=i*2.39996,r=3+Math.sqrt(i/90)*14,x=Math.cos(a)*r,z=Math.sin(a)*r,p=ball(.07+(i%5)*.025,i%3?rock:moss);p.position.set(x,terrain(x,z)+.06,z);p.scale.set(1.2,.45,1)}for(let i=0;i<22;i++){const a=i*2.39996,r=10+((i*7)%11)*.48,x=Math.cos(a)*r,z=Math.sin(a)*r,h=.7+(i%5)*.25;rod(V(x,terrain(x,z),z),V(x,terrain(x,z)+h,z),.065,green);const p=ball(.3+(i%4)*.09,moss);p.position.set(x,terrain(x,z)+h,z)}
const stoneAnchor=new T.Group();scene.add(stoneAnchor);const stone=new T.Group();stoneAnchor.add(stone);const core=ball(.55,rock,stone,16);core.scale.set(1.15,.86,1);core.position.x=.1;ball(.22,dark,stone).position.set(-.38,.16,.24);
const walker=new T.Group();scene.add(walker);const torso=ball(.58,mat(0xb6c8bc,.5,.24),walker);torso.scale.set(1.35,.55,.9);torso.position.y=1.12;ball(.14,gold,walker).position.set(.67,1.2,.05);const legs=[];for(const x of [-.43,.43])for(const z of [-.38,.38]){legs.push({x,z,upper:rod(V(),V(0,-.6,0),.075,dark,walker),lower:rod(V(),V(0,-.6,0),.05,teal,walker),foot:ball(.11,gold,walker)})}function setRod(o,a,b){const d=b.clone().sub(a);o.position.copy(a).addScaledVector(d,.5);o.scale.y=d.length()/.6;o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize())}function ik(hip,foot,l1,l2,bend){const d=foot.clone().sub(hip),len=Math.max(.001,Math.min(l1+l2-.001,d.length())),dir=d.clone().normalize(),perp=V(0,0,bend).addScaledVector(dir,-bend*dir.z).normalize(),along=(l1*l1-l2*l2+len*len)/(2*len);return hip.clone().addScaledVector(dir,along).addScaledVector(perp,Math.sqrt(Math.max(0,l1*l1-along*along)))}
const floater=new T.Group();scene.add(floater);const bell=new T.Mesh(new T.SphereGeometry(.65,32,20),new T.MeshPhysicalMaterial({color:0x8fdacb,roughness:.28,transparent:true,opacity:.83,side:T.DoubleSide,depthWrite:false}));floater.add(bell);const tendrils=[];for(let i=0;i<9;i++){const line=new T.Line(new T.BufferGeometry(),new T.LineBasicMaterial({color:i%2?0xa4e9dc:0x6dbbb5,transparent:true,opacity:.8}));floater.add(line);tendrils.push(line)}
const pillar=new T.Group();scene.add(pillar);pillar.position.set(4,0,3);rod(V(),V(0,4.4,0),.33,rock,pillar);for(let i=0;i<4;i++){const cap=ball(.44,rock,pillar);cap.position.y=i*1.3+.15;cap.scale.y=.17}const vineLine=new T.Line(new T.BufferGeometry(),new T.LineBasicMaterial({color:0x9fe59b}));pillar.add(vineLine);const leaves=[];for(let i=0;i<22;i++){const leaf=ball(.12,moss,pillar);leaf.scale.set(1.4,.4,.65);leaves.push(leaf)}
const birds=[];const birdMat=[gold,teal,purple];for(let i=0;i<17;i++){const g=new T.Group();scene.add(g);const b=ball(.12,birdMat[i%3],g,12);b.scale.set(1.6,.7,.7);const left=rod(V(-.05,0,0),V(-.2,0,.32),.035,birdMat[i%3],g),right=rod(V(-.05,0,0),V(-.2,0,-.32),.035,birdMat[i%3],g);birds.push({g,left,right,p:V(2+Math.cos(i*2.4)*1.5,3+i%5*.22,-3+Math.sin(i*2.4)*1.5),v:V(Math.cos(i),0,Math.sin(i)).multiplyScalar(.7),seed:i})}
let time=0,last=0,focus='all',yaw=.62,pitch=.38,dist=19,target=V(0,1,0),pinch=null;const pointers=new Map();function cam(){const cp=Math.cos(pitch);camera.position.set(target.x+dist*Math.sin(yaw)*cp,target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*cp);camera.lookAt(target)}function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}}new ResizeObserver(resize).observe(stage);resize();canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...pointers.values()];if(p.length===1){yaw-=(e.clientX-old.x)*.007;pitch=Math.max(-.15,Math.min(1.35,pitch+(e.clientY-old.y)*.006))}else{const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch!==null)dist=Math.max(3,Math.min(35,dist*pinch/Math.max(d,1)));pinch=d}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{pointers.delete(e.pointerId);pinch=null});canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3,Math.min(35,dist*Math.exp(e.deltaY*.001)))},{passive:false});stage.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{focus=b.dataset.focus;stage.querySelectorAll('[data-focus]').forEach(q=>q.setAttribute('aria-pressed',String(q===b)));$('status').textContent=({all:'Five forms of motion · one habitat',stone:'Rolling · eccentric center of mass',walker:'Four legs · procedural foot placement',floater:'Pulsation · trailing filaments',vine:'Helical growth · climbing a pillar',flock:'Separation · alignment · cohesion'})[focus]});
function animate(ms){requestAnimationFrame(animate);const dt=Math.min((ms-last)/1000||0,.04);last=ms;time+=dt;const t=time,sx=-4+1.4*Math.sin(t*.35),sz=-1+1.4*Math.cos(t*.35);stoneAnchor.position.set(sx,terrain(sx,sz)+.55+Math.abs(Math.sin(t*1.3))*.045,sz);stone.rotation.set(t*1.3,0,t*.85);walker.position.set(-1.6+Math.sin(t*.27)*1.1,terrain(-1.6+Math.sin(t*.27)*1.1,1.6)+.03,1.6+Math.cos(t*.27)*.8);walker.rotation.y=Math.sin(t*.27)*.35;torso.position.y=1.12+.045*Math.cos(t*7);for(let i=0;i<legs.length;i++){const l=legs[i],phase=t*4.4+(i===0||i===3?0:Math.PI),lift=Math.max(0,Math.cos(phase))*.26,hip=V(l.x*.9,1.03,l.z),foot=V(l.x+Math.sin(phase)*.25,.12+lift,l.z+Math.cos(phase)*.08),knee=ik(hip,foot,.61,.64,l.z<0?-1:1);setRod(l.upper,hip,knee);setRod(l.lower,knee,foot);l.foot.position.copy(foot)}
floater.position.set(-3+Math.sin(t*.31)*1.1,3+.6*Math.sin(t*.9),-3.2+Math.cos(t*.28)*1.2);floater.rotation.y=t*.16;const pulse=Math.sin(t*2.4);bell.scale.set(1+.12*pulse,.62-.10*pulse,1+.12*pulse);for(let i=0;i<tendrils.length;i++){const a=i/9*Math.PI*2,pts=[];for(let j=0;j<15;j++){const u=j/14;pts.push(V(Math.cos(a)*(.32+u*.2)+Math.sin(t*1.5+i+u*7)*u*.12,-.3-u*(.9+.3*Math.sin(t*1.6+i)),Math.sin(a)*(.32+u*.2)+Math.cos(t*1.2+i+u*5)*u*.12))}tendrils[i].geometry.dispose();tendrils[i].geometry=new T.BufferGeometry().setFromPoints(pts)}
const length=Math.min(4.35,.25+t*.14),pts=[];for(let i=0;i<=100;i++){const y=length*i/100,a=y*3.9;pts.push(V(.39*Math.cos(a),y,.39*Math.sin(a)))}vineLine.geometry.dispose();vineLine.geometry=new T.BufferGeometry().setFromPoints(pts);for(let i=0;i<leaves.length;i++){const y=(i+1)*.19,leaf=leaves[i];leaf.visible=y<length;if(leaf.visible){const a=y*3.9;leaf.position.set(.48*Math.cos(a),y,.48*Math.sin(a));leaf.rotation.y=-a;leaf.scale.x=1.2+.25*Math.sin(t*1.1+i)}}
for(const b of birds){const sep=V(),ali=V(),coh=V();let n=0;for(const o of birds){if(o===b)continue;const d=b.p.distanceTo(o.p);if(d<2.3){n++;ali.add(o.v);coh.add(o.p);if(d<.7&&d>.001)sep.add(b.p.clone().sub(o.p).multiplyScalar(1/(d*d)))}}const desired=V(-Math.sin(t*.22),Math.sin(t*.4+b.seed*.2)*.08,Math.cos(t*.22));if(n){ali.divideScalar(n).sub(b.v).multiplyScalar(.45);coh.divideScalar(n).sub(b.p).multiplyScalar(.16)}const center=V(2+3*Math.cos(t*.22),3.4,-3+3*Math.sin(t*.22));const steer=center.sub(b.p).multiplyScalar(.22).add(desired.multiplyScalar(.35)).add(ali).add(coh).add(sep.multiplyScalar(.6));b.v.addScaledVector(steer,dt);if(b.v.length()>1.6)b.v.setLength(1.6);b.p.addScaledVector(b.v,dt);b.p.y=Math.max(1.6,Math.min(5.5,b.p.y));b.g.position.copy(b.p);b.g.rotation.y=Math.atan2(-b.v.z,b.v.x);const flap=Math.sin(t*11+b.seed*1.7)*.35;b.left.rotation.x=flap;b.right.rotation.x=-flap}
const desiredTarget=focus==='stone'?stoneAnchor.position:focus==='walker'?walker.position.clone().add(V(0,1,0)):focus==='floater'?floater.position:focus==='vine'?V(4,2.1,3):focus==='flock'?birds.reduce((v,b)=>v.add(b.p),V()).divideScalar(birds.length):V(0,1,0);target.lerp(desiredTarget,Math.min(1,dt*2.5));cam();renderer.render(scene,camera)}requestAnimationFrame(animate);
}catch(e){$('status').textContent='3D failed: '+(e.message||e)}
</script></main></body></html>
