<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0d0d"><title>Penguins Game Night · Pittsburgh Trivia</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0c;color:#fff;font-family:system-ui,-apple-system,sans-serif}.shell{max-width:700px;margin:auto;background:#0c0d0d;min-height:100dvh}.hero{min-height:265px;background:linear-gradient(0deg,#0c0d0d 0%,rgba(0,0,0,.15) 90%),url('https://images.unsplash.com/photo-1515703407324-5f753afd8be8?w=1400&q=85') center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:24px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:2.5px;color:#ffca32}h1{font-size:clamp(34px,8vw,56px);line-height:.98;font-weight:950;letter-spacing:-2px;margin:10px 0}.gold{color:#ffca32}.arena{padding:0 20px 24px}.scorebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 20px}.scorebox{background:#1b1c1c;border:1px solid #36332a;border-radius:9px;padding:12px 8px;text-align:center}.scorebox strong{display:block;font-size:24px;font-variant-numeric:tabular-nums}.scorebox small{font-size:10px;letter-spacing:1.4px;color:#aaa}.ice{height:7px;background:#333;border-radius:9px;overflow:hidden;margin:12px 0 22px}.ice div{height:100%;background:#ffca32;transition:width .3s}.question{font-size:clamp(21px,5vw,29px);font-weight:780;line-height:1.3;margin:13px 0 20px}.choice{display:flex;align-items:center;gap:13px;width:100%;background:#1c1d1e;border:1px solid #414141;color:#fff;text-align:left;border-radius:11px;padding:16px 13px;margin:9px 0;font-size:15px;font-weight:650;cursor:pointer}.choice b{width:28px;height:28px;display:grid;place-items:center;border:1px solid #6d6d6d;border-radius:5px;color:#ffca32;flex-shrink:0}.choice:disabled{cursor:default}.choice.correct{border-color:#ffca32;background:#39321a}.choice.wrong{border-color:#a84c4c;background:#3a2020}.mainbtn{width:100%;background:#ffca32;color:#141414;border:0;border-radius:10px;padding:16px;font-size:15px;font-weight:900;letter-spacing:.5px;margin-top:16px;cursor:pointer}.explain{border-left:3px solid #ffca32;background:#24231d;padding:14px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.6;margin-top:18px}.rink{height:78px;background:linear-gradient(90deg,transparent 48%,#b43e42 48%,#b43e42 52%,transparent 52%),repeating-linear-gradient(90deg,transparent 0%,transparent 20%,rgba(68,133,185,.3) 20.5%,transparent 21%),#dce8eb;border-radius:42px;border:3px solid #a4b6bd;position:relative;margin:12px 0;overflow:hidden}.puck{position:absolute;top:26px;left:6%;font-size:25px;transition:left .4s}.net{position:absolute;right:8px;top:18px;font-size:27px}.footer{color:#777;font-size:10px;text-align:center;padding:15px;letter-spacing:1px}.pill{border:1px solid #695c35;border-radius:20px;padding:5px 10px;color:#ffca32;font-size:10px;font-weight:800}.sub{font-size:13px;color:#bbb;line-height:1.6}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">PITTSBURGH • PENNSYLVANIA</div><div style="display:flex;align-items:center;gap:12px"><span style="font-size:34px" aria-hidden="true">🐧</span><h1>PENGUINS<br><span class="gold">GAME NIGHT</span></h1></div><div style="font-size:11px;letter-spacing:2px;font-weight:700">BLACK & GOLD • 2016—2026</div></header><section class="arena"><div class="scorebar"><div class="scorebox"><small>GOALS</small><strong id="goals" class="gold">0</strong></div><div class="scorebox"><small>SHOTS</small><strong id="shots">0</strong></div><div class="scorebox"><small>PERIOD</small><strong id="period">1 / 3</strong></div></div><div id="stage" aria-live="polite"></div></section><footer class="footer">PITTSBURGH HOCKEY • BLACK & GOLD</footer></main><script>
(()=>{'use strict';const qs=[["Who scored the overtime winner in Game 2 of the 2016 Stanley Cup Final against San Jose?",["Sidney Crosby","Phil Kessel","Conor Sheary","Evgeni Malkin"],2,"Conor Sheary scored the overtime winner in Game 2."],["Who scored Pittsburgh's opening goal in the Cup-clinching Game 6 against San Jose in 2016?",["Kris Letang","Brian Dumoulin","Sidney Crosby","Phil Kessel"],1,"Brian Dumoulin opened the scoring on the power play."],["Who completed a hat trick with an overtime winner against Columbus in Game 3 of the 2017 first round?",["Evgeni Malkin","Sidney Crosby","Phil Kessel","Jake Guentzel"],3,"Jake Guentzel completed his hat trick in overtime."],["Who opened the scoring in Pittsburgh's 6–0 Game 5 win over Nashville in the 2017 Stanley Cup Final?",["Sidney Crosby","Justin Schultz","Evgeni Malkin","Phil Kessel"],1,"Justin Schultz scored on a first-period power play."],["Who scored the late Cup-winning goal in Game 6 of the 2017 Stanley Cup Final?",["Sidney Crosby","Evgeni Malkin","Patric Hornqvist","Jake Guentzel"],2,"Patric Hornqvist broke the scoreless tie late in the third period."],["Who sealed the 2017 championship with an empty-net goal?",["Carl Hagelin","Sidney Crosby","Phil Kessel","Evgeni Malkin"],0,"Carl Hagelin scored the empty-net goal in the 2–0 clincher."],["Who scored Pittsburgh's fourth goal in its 6–0 Game 5 win over Nashville in 2017?",["Evgeni Malkin","Sidney Crosby","Conor Sheary","Phil Kessel"],2,"Conor Sheary scored early in the second period."],["Who scored Pittsburgh's sixth goal in that 2017 Game 5 victory?",["Kris Letang","Ron Hainsey","Sidney Crosby","Jake Guentzel"],1,"Ron Hainsey scored Pittsburgh's sixth goal."],["Who earned the primary assist on Hornqvist's Cup-winning goal in 2017?",["Sidney Crosby","Evgeni Malkin","Phil Kessel","Justin Schultz"],3,"Justin Schultz's shot bounced off the boards to Hornqvist."],["Who earned the primary assist on Hagelin's empty-net goal in the 2017 Cup clincher?",["Brian Dumoulin","Sidney Crosby","Evgeni Malkin","Phil Kessel"],0,"Brian Dumoulin assisted on Hagelin's empty-net goal."]];let index=0,goals=0,shots=0,locked=false;const stage=document.getElementById('stage');function stats(){document.getElementById('goals').textContent=goals;document.getElementById('shots').textContent=shots;document.getElementById('period').textContent=Math.min(3,Math.floor(index/4)+1)+' / 3'}function reset(){index=goals=shots=0;locked=false;render()}function render(){stats();if(index>=qs.length){stage.innerHTML='<div style="font-size:54px;text-align:center;padding:24px">'+(goals>=8?'🏆':goals>=5?'🐧':'🏒')+'</div><div class="eyebrow" style="text-align:center">FINAL HORN</div><h2 style="text-align:center;font-size:31px">'+goals+' GOALS ON '+shots+' SHOTS</h2><p class="sub" style="text-align:center">'+(goals>=8?'A championship performance.':goals>=5?'A strong night on the ice.':'Back to the practice rink. The next game awaits.')+'</p><button class="mainbtn" id="restart">PLAY AGAIN ↻</button>';document.getElementById('restart').onclick=reset;return}const q=qs[index];stage.innerHTML='<div class="rink"><span class="puck" id="puck">🏒</span><span class="net">🥅</span></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">QUESTION '+String(index+1).padStart(2,'0')+' / 10</span><span class="pill">'+(index<4?'1ST':index<7?'2ND':'3RD')+' PERIOD</span></div><div class="ice"><div style="width:'+index*10+'%"></div></div><div class="question" id="question"></div><div id="choices"></div><div id="feedback"></div>';document.getElementById('question').textContent=q[0];const box=document.getElementById('choices');q[1].forEach((name,i)=>{const b=document.createElement('button');b.className='choice';const letter=document.createElement('b');letter.textContent=String.fromCharCode(65+i);const label=document.createElement('span');label.textContent=name;b.append(letter,label);b.onclick=()=>choose(i);box.appendChild(b)})}function choose(i){if(locked)return;locked=true;shots++;const q=qs[index];if(i===q[2])goals++;stats();document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('puck').style.left=i===q[2]?'83%':'39%';const fb=document.getElementById('feedback'),info=document.createElement('div');info.className='explain';const title=document.createElement('strong');title.className='gold';title.textContent=i===q[2]?'🚨 GOAL!':'SAVE!';const desc=document.createElement('div');desc.style.marginTop='5px';desc.textContent=q[3];info.append(title,desc);const next=document.createElement('button');next.className='mainbtn';next.textContent=index===qs.length-1?'FINAL HORN':'NEXT FACE-OFF →';next.onclick=()=>{index++;locked=false;render()};fb.append(info,next)}render()})();
</script></body></html>
