<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Strand — Stone & Root</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#243641;font-family:system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:14px;left:14px;color:#f6e9cc;text-shadow:0 2px 8px #0008;font-size:13px;letter-spacing:.12em;pointer-events:none}#status{font:11px monospace;letter-spacing:0;margin-top:8px;background:#16232acb;padding:7px;border-radius:5px}#controls{position:fixed;bottom:max(15px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap}button{background:#29363c;color:#f6e9cc;border:1px solid #8b897c;border-radius:7px;padding:12px;font:13px system-ui;min-height:44px}button:first-child{background:#e7c998;color:#302820;border:0;font-weight:700}</style></head><body><canvas id="view"></canvas><div id="hud">STRAND / STONE & ROOT<div id="status">Loading Three.js…</div></div><div id="controls"><button id="turn">Orbit OFF</button><button id="roof">Roof ON</button><button id="grow">Grow</button></div><script type="module">
const status=document.getElementById('status'),canvas=document.getElementById('view');const say=s=>status.textContent=s;
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
const scene=new T.Scene();scene.background=new T.Color(0x243641);const camera=new T.PerspectiveCamera(37,1,.1,100);const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.65;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
scene.add(new T.HemisphereLight(0xdceafa,0x555044,2.2));const light=new T.DirectionalLight(0xffdb9b,3.3);light.position.set(-7,12,10);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-12;light.shadow.camera.right=12;light.shadow.camera.top=12;light.shadow.camera.bottom=-12;scene.add(light);
let seed=1917;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const rand=(a,b)=>a+(b-a)*rnd();const mat=(c,opts={})=>new T.MeshStandardMaterial({color:c,roughness:1,flatShading:true,...opts});
const stones=[0xb4b2a3,0xc9c3ad,0xaaa99f,0xd2c8b0,0x979f9e,0xb9b8ad,0xe0d0b2].map(c=>mat(c));const rocks=[0x7e8990,0x899397,0x707e84,0x9ca0a0].map(c=>mat(c));const tiles=[0xc98b3e,0xe8a64b,0xf2bc67,0xd99743,0xb97938].map(c=>mat(c));const wood=mat(0x67432c),grass=mat(0x779145,{side:T.DoubleSide}),flowers=[0xffd68a,0xf6b16e,0xf2e6bb].map(c=>mat(c));const world=new T.Group();scene.add(world);
function mesh(g,m,p,x,y,z){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function block(x,y,z,w,h,d,m,b=.065,p=world){const s=new T.Shape();s.moveTo(-w/2+b,-h/2);s.lineTo(w/2-b,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+b);s.lineTo(w/2,h/2-b);s.quadraticCurveTo(w/2,h/2,w/2-b,h/2);s.lineTo(-w/2+b,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-b);s.lineTo(-w/2,-h/2+b);s.quadraticCurveTo(-w/2,-h/2,-w/2+b,-h/2);const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.035,bevelSize:.035,bevelSegments:1,curveSegments:2,steps:1});g.translate(0,0,-d/2);const o=mesh(g,m,p,x,y,z);o.rotation.z=rand(-.012,.012);return o}
mesh(new T.CylinderGeometry(5.3,4.7,.48,11),mat(0x786e52),world,0,-.55,0);mesh(new T.CylinderGeometry(5.38,5.18,.14,11),mat(0x78834a),world,0,-.25,0);
for(let i=0;i<31;i++){const a=rnd()*Math.PI*2,r=rand(2.4,4.5),x=Math.cos(a)*r,z=Math.sin(a)*r;if(z>2.4&&Math.abs(x)<1.5)continue;const o=mesh(new T.DodecahedronGeometry(rand(.3,1.05),0),rocks[Math.floor(rnd()*rocks.length)],world,x,rand(-.06,.34),z);o.scale.set(rand(.8,1.8),rand(.65,1.5),rand(.7,1.5));o.rotation.set(rnd(),rnd(),rnd())}
const W=3.8,D=3.35,H=4.55,base=.22;
for(let course=0;course<11;course++){const h=.38,y=base+course*.39+.2,n=course%2?7:6;for(let i=0;i<n;i++){const w=W/n,x=-W/2+w*(i+.5),door=course<4&&Math.abs(x)<.78,arch=course>=4&&course<=6&&Math.abs(x)<(.78-(course-4)*.23);if(!door&&!arch)block(x,y,D/2,w-.035,h-.025,.36,stones[Math.floor(rnd()*stones.length)]);block(x,y,-D/2,w-.035,h-.025,.35,stones[Math.floor(rnd()*stones.length)])}for(const side of [-1,1])for(let i=0;i<5;i++){const z=-D/2+(i+.5)*D/5;block(side*W/2,y,z,.38,h-.025,D/5-.035,stones[Math.floor(rnd()*stones.length)])}}
const dark=mat(0x24231f);block(0,1.12,D/2-.16,1.35,2.25,.09,dark,.04);block(0,1.07,D/2-.06,1.08,2.08,.11,wood,.035);const seam=mat(0x4b2f20);for(let i=0;i<5;i++)block(-.43+i*.215,1.08,D/2+.012,.015,1.9,.018,seam,.002);
for(let i=0;i<9;i++){const a=Math.PI-i*Math.PI/8,x=Math.cos(a)*.81,y=2.19+Math.sin(a)*.81,o=block(x,y,D/2+.08,.34,.43,.49,stones[i%stones.length],.035);o.rotation.z=a-Math.PI/2}
for(const x of [-W/2,W/2])for(const z of [-D/2,D/2]){for(let j=0;j<5;j++)block(x,base+j*.87+.43,z,.63,.82,.63,stones[Math.floor(rnd()*stones.length)]);block(x,H+.13,z,.88,.48,.85,stones[3])}
for(const x of [-1.15,1.15]){block(x,2.85,D/2+.06,.55,.86,.045,dark,.03);block(x,2.82,D/2+.09,.10,.83,.05,wood,.01);block(x,2.82,D/2+.09,.54,.09,.05,wood,.01)}
const roofGroup=new T.Group();world.add(roofGroup);const ridge=H+1.35,eave=H+.18,half=W/2+.25,rafters=mat(0x6b4829);
for(const z of [-D/2-.17,D/2+.17])for(const side of [-1,1]){const a=new T.Vector3(0,ridge,z),b=new T.Vector3(side*half,eave,z),dir=b.clone().sub(a);const o=mesh(new T.BoxGeometry(.13,dir.length(),.16),rafters,roofGroup,(a.x+b.x)/2,(a.y+b.y)/2,z);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir.normalize())}
for(const side of [-1,1])for(let row=0;row<7;row++){const f=(row+.5)/7,x=side*half*f,y=ridge-(ridge-eave)*f;for(let col=0;col<10;col++){const z=-D/2-.28+(col+.5)*(D+.56)/10;const o=mesh(new T.BoxGeometry(half/7+.07,.055,(D+.56)/10+.025),tiles[Math.floor(rnd()*tiles.length)],roofGroup,x,y+rand(-.025,.025),z);o.rotation.z=-side*Math.atan2(ridge-eave,half);o.rotation.y=rand(-.035,.035)}}
for(let i=0;i<5;i++)block(0,-.10+i*.16,D/2+.7+i*.29,2.25-i*.18,.19,.48,stones[(i+1)%stones.length],.035);
for(let i=0;i<45;i++){const x=rand(-2.4,2.4),z=rand(2.7,4.9),p=mesh(new T.DodecahedronGeometry(rand(.13,.31),0),stones[Math.floor(rnd()*stones.length)],world,x,-.12,z);p.scale.y=.19;p.rotation.y=rnd()*6}
const plants=new T.Group();world.add(plants);
function plant(x,z,flower){const h=rand(.12,.36);for(let k=0;k<4;k++){const o=mesh(new T.ConeGeometry(.035,h,3),grass,plants,x+rand(-.09,.09),h/2-.15,z+rand(-.09,.09));o.rotation.z=rand(-.6,.6)}if(flower)mesh(new T.IcosahedronGeometry(.055,0),flowers[Math.floor(rnd()*flowers.length)],plants,x,h-.04,z)}
for(let i=0;i<160;i++){const a=rnd()*Math.PI*2,r=rand(2.4,5.1),x=Math.cos(a)*r,z=Math.sin(a)*r;if(z>2.2&&Math.abs(x)<1.1)continue;plant(x,z,rnd()<.15)}
const barrel=mesh(new T.CylinderGeometry(.25,.29,.55,9),wood,world,1.35,.07,2.55);barrel.rotation.z=.12;const band=mat(0x8d7851,{metalness:.3,roughness:.8});for(const dy of [-.18,.18])mesh(new T.TorusGeometry(.27,.023,5,12),band,world,1.35,.07+dy,2.55).rotation.x=Math.PI/2;
let angle=.6,elev=.36,dist=13,auto=false,growing=false,grow=1;document.getElementById('turn').onclick=e=>{auto=!auto;e.target.textContent='Orbit '+(auto?'ON':'OFF')};document.getElementById('roof').onclick=e=>{roofGroup.visible=!roofGroup.visible;e.target.textContent='Roof '+(roofGroup.visible?'ON':'OFF')};document.getElementById('grow').onclick=()=>{growing=true;grow=.01;plants.scale.setScalar(.01)};
const touches=new Map();canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{const p=touches.get(e.pointerId);if(!p)return;angle-=(e.clientX-p.x)*.006;elev=Math.max(-.1,Math.min(1.25,elev+(e.clientY-p.y)*.006));touches.set(e.pointerId,{x:e.clientX,y:e.clientY})});for(const n of ['pointerup','pointercancel'])canvas.addEventListener(n,e=>touches.delete(e.pointerId));canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(8,Math.min(24,dist+e.deltaY*.015))},{passive:false});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);
let previous=0,frames=0,stamp=0;function frame(t){const dt=Math.min(.05,(t-previous)/1000||0);previous=t;if(auto)angle+=dt*.2;if(growing){grow=Math.min(1,grow+dt*.4);plants.scale.setScalar(grow);if(grow===1)growing=false}camera.position.set(Math.sin(angle)*Math.cos(elev)*dist,4+Math.sin(elev)*dist*.6,Math.cos(angle)*Math.cos(elev)*dist);camera.lookAt(0,2,0);renderer.render(scene,camera);frames++;if(t-stamp>1500){say('3D ACTIVE · '+Math.round(frames*1000/(t-stamp))+' FPS');frames=0;stamp=t}requestAnimationFrame(frame)}say('Scene assembled · rendering');requestAnimationFrame(frame);
}catch(e){say('ERROR · '+e.message);console.error(e)}
</script></body></html>
