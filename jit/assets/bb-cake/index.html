<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BB Cake · Cascade</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2a;overflow:hidden;font-family:system-ui}canvas{width:100vw;height:100dvh;display:block;touch-action:none}header{position:fixed;top:14px;left:16px;color:#ffdfbc;pointer-events:none}header b{font:600 20px Georgia,serif}header small{display:block;color:#b5becb;margin-top:5px}button{position:fixed;top:14px;right:16px;border:1px solid #52647b;background:#28384b;color:#ffdfbc;border-radius:40px;padding:8px 15px;font-size:22px}footer{position:fixed;bottom:16px;left:16px;color:#d2d9e1;font:12px monospace;pointer-events:none}</style><canvas></canvas><header><b>CAKE / CASCADE</b><small>Tap to fracture · Drag to orbit</small></header><button id="reset">↺</button><footer id="status"></footer><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false}),status=document.querySelector('#status');let W,H,DPR,angle=.34,tilt=.43,balls=[],sparks=[],shots=0,drag=null,last=0;const TAU=Math.PI*2,colors=['#e9a8c1','#f6d6ab','#fff0d7','#c77f9e','#a2d4d0','#e8bc70'];function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function rand(a,b){return a+Math.random()*(b-a)}function ball(x,y,z,r,c,kind='cake'){return{x,y,z,r,c,kind,vx:0,vy:0,vz:0,life:0,burst:0,alive:true}}function build(){balls=[];sparks=[];shots=0;for(let tier=0;tier<2;tier++){const rad=tier===0?2.45:1.63,base=tier===0?.12:1.55,top=tier===0?1.52:2.78,step=.205;for(let y=base;y<top;y+=step){const shell=Math.abs(y-top)<.25||Math.abs(y-base)<.18;for(let x=-rad;x<=rad;x+=step)for(let z=-rad;z<=rad;z+=step){const rr=Math.hypot(x,z),edge=rr>rad-.26;if(rr>rad||(!edge&&!shell&&Math.random()>.20))continue;const c=shell||edge?colors[(tier*2+(Math.random()*2|0))%colors.length]:'#e6ba79';balls.push(ball(x+rand(-.025,.025),y+rand(-.02,.02),z+rand(-.025,.025),.083,c))}}}for(let i=0;i<22;i++){const a=i/22*TAU;for(let j=0;j<5;j++){const t=a+(j-2)*.023;balls.push(ball(Math.cos(t)*1.4,2.84+Math.sin(j*2)*.06,Math.sin(t)*1.4,.115,'#fff0d7'))}}for(let i=0;i<45;i++){const a=rand(0,TAU),r=rand(0,.55);balls.push(ball(Math.cos(a)*r,2.92+rand(0,.25),Math.sin(a)*r,.095,'#d9546e'))}status.textContent=balls.length+' BBs · 0 impacts'}build();function project(x,y,z){const ca=Math.cos(angle),sa=Math.sin(angle),ct=Math.cos(tilt),st=Math.sin(tilt),xx=x*ca-z*sa,zz=x*sa+z*ca,yy=y*ct-zz*st,depth=y*st+zz*ct,scale=Math.min(W/8.8,H/6.9)*(.98+depth*.018);return{x:W/2+xx*scale,y:H*.76-yy*scale,d:depth,s:scale}}function blast(px,py){const targets=[];for(const b of balls){if(b.kind!=='cake')continue;const p=project(b.x,b.y,b.z),d=Math.hypot(p.x-px,p.y-py);if(d<Math.min(W,H)*.19)targets.push({b,d})}targets.sort((a,b)=>a.d-b.d);if(!targets.length)return;const center=targets[0].b,cx=center.x,cy=center.y,cz=center.z;let count=0;for(const {b} of targets){const dist=Math.hypot(b.x-cx,b.y-cy,b.z-cz);if(dist>1.05||Math.random()>.86-dist*.32)continue;b.kind='chunk';b.life=0;b.burst=rand(.55,1.5);const dx=b.x-cx,dz=b.z-cz,mag=Math.hypot(dx,dz)||1;b.vx=dx/mag*rand(2.1,5)+rand(-1.4,1.4);b.vy=rand(3.8,7.8);b.vz=dz/mag*rand(2.1,5)+rand(-1.4,1.4);count++}shots++;for(let i=0;i<24;i++)sparks.push({x:cx,y:cy,z:cz,vx:rand(-5,5),vy:rand(1,7),vz:rand(-5,5),life:rand(.2,.65),c:'#ffe2a4'});status.textContent=balls.filter(b=>b.alive).length+' BBs · '+shots+' impacts · '+count+' displaced'}function physics(dt){const additions=[];for(const b of balls){if(!b.alive||b.kind==='cake')continue;b.life+=dt;b.vy-=10.5*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.48;b.vx*=.83;b.vz*=.83}if(b.kind==='chunk'&&b.life>b.burst){b.alive=false;for(let i=0;i<4;i++){const n=ball(b.x+rand(-.06,.06),b.y,b.z+rand(-.06,.06),.038,b.c,'dust');n.vx=b.vx+rand(-3.8,3.8);n.vy=b.vy+rand(1,5);n.vz=b.vz+rand(-3.8,3.8);additions.push(n)}}if(b.kind==='dust'&&b.life>4)b.alive=false}balls.push(...additions);for(const s of sparks){s.life-=dt;s.vy-=10*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt}sparks=sparks.filter(s=>s.life>0);if(balls.length>9000)balls=balls.filter(b=>b.alive)}function draw(){ctx.fillStyle='#101b2a';ctx.fillRect(0,0,W,H);const floor=project(0,0,0),gradient=ctx.createRadialGradient(floor.x,floor.y,10,floor.x,floor.y,Math.max(W,H)*.55);gradient.addColorStop(0,'#33404a');gradient.addColorStop(1,'#101b2a');ctx.fillStyle=gradient;ctx.beginPath();ctx.ellipse(floor.x,floor.y+15,W*.43,H*.15,0,0,TAU);ctx.fill();const base=project(0,-.04,0);ctx.fillStyle='#bfae94';ctx.beginPath();ctx.ellipse(base.x,base.y,Math.min(W/8.8,H/6.9)*2.8,Math.min(W/8.8,H/6.9)*.85,0,0,TAU);ctx.fill();const visible=[];for(const b of balls){if(!b.alive)continue;const p=project(b.x,b.y,b.z);if(p.x<-15||p.x>W+15||p.y<-15||p.y>H+15)continue;visible.push({b,p})}visible.sort((a,b)=>a.p.d-b.p.d);for(const {b,p} of visible){const r=Math.max(.7,b.r*p.s);ctx.globalAlpha=b.kind==='dust'?Math.max(.2,1-b.life/4):1;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.fill();if(r>2.3){ctx.fillStyle='rgba(255,255,255,.32)';ctx.beginPath();ctx.arc(p.x-r*.3,p.y-r*.35,r*.27,0,TAU);ctx.fill()}}ctx.globalAlpha=1;for(const s of sparks){const p=project(s.x,s.y,s.z);ctx.globalAlpha=Math.min(1,s.life*2);ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,TAU);ctx.fill()}ctx.globalAlpha=1}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,prev:e.clientX,moved:0}});canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.prev;drag.prev=e.clientX;drag.moved+=Math.abs(dx);if(drag.moved>5)angle+=dx*.012});canvas.addEventListener('pointerup',()=>{if(!drag)return;if(drag.moved<9)blast(drag.x,drag.y);drag=null});document.querySelector('#reset').onclick=build;function frame(t){const dt=Math.min(.04,(t-last)/1000||.016);last=t;physics(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
