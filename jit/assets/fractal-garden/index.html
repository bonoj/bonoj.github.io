<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080914"><title>Chromatic Garden</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080914}main{position:relative;width:100%;height:100dvh;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}.tools{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:none}.tools button{pointer-events:auto;background:#0b1025b8;color:#e4d4f5;border:1px solid #d9b9f354;border-radius:50%;width:46px;height:46px;font-size:20px;backdrop-filter:blur(8px)}.tools button:active{background:#7d5ca8}</style></head><body><main><canvas id="garden"></canvas><div class="tools"><button id="palette" aria-label="Change palette">◉</button><button id="bloom" aria-label="New bloom">✧</button><button id="pause" aria-label="Pause">Ⅱ</button></div></main><script>
(()=>{'use strict';const canvas=document.querySelector('#garden'),ctx=canvas.getContext('2d',{alpha:false});let w=0,h=0,dpr=1,clock=0,last=performance.now(),paused=false,palette=0,seed=741,strokes=[],touches=new Map();const palettes=[[276,315,38,190],[192,240,295,42],[16,340,270,52],[120,175,245,300],[42,20,325,255]];
function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(1.5,devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}resize();new ResizeObserver(resize).observe(canvas);
function hash(n){let x=Math.sin(n*127.1+seed*.017)*43758.5453;return x-Math.floor(x)}
function branch(x,y,ang,len,depth,hue,twist,energy){if(depth<=0||len<1.5)return;const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;ctx.strokeStyle='hsla('+hue+',85%,'+(48+depth*3)+'%,'+(.17+depth*.045)+')';ctx.lineWidth=Math.max(.45,depth*.45)*energy;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();if(depth<=2){ctx.fillStyle='hsla('+(hue+35)+',100%,76%,'+(.2+energy*.3)+')';ctx.beginPath();ctx.arc(x2,y2,Math.max(.5,len*.12),0,Math.PI*2);ctx.fill()}const bend=Math.sin(clock*.25+depth*1.7+x*.008)*.12+twist;branch(x2,y2,ang-.46+bend,len*.72,depth-1,hue+9,twist*.85,energy*.86);branch(x2,y2,ang+.52+bend,len*.69,depth-1,hue-7,twist*.85,energy*.82);if(depth>3&&hash(depth*17+x*.1)>.45)branch(x2,y2,ang+bend*.7,len*.55,depth-2,hue+25,twist*.6,energy*.55)}
function flower(x,y,r,phase,shift,alpha=1){ctx.save();ctx.translate(x,y);ctx.rotate(phase);for(let layer=0;layer<4;layer++){const petals=7+layer*3,rad=r*(1-layer*.2);for(let i=0;i<petals;i++){const a=i*Math.PI*2/petals+layer*.37+Math.sin(clock*.18+layer)*.08;ctx.save();ctx.rotate(a);const hue=palettes[palette][(layer+Math.floor(shift))%4]+shift*5,grad=ctx.createLinearGradient(0,0,rad,0);grad.addColorStop(0,'hsla('+hue+',100%,72%,0)');grad.addColorStop(.45,'hsla('+(hue+20)+',95%,60%,'+(.1*alpha)+')');grad.addColorStop(1,'hsla('+(hue+50)+',100%,75%,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(rad*.52,0,rad*.6,rad*.14,0,0,Math.PI*2);ctx.fill();ctx.restore()}}ctx.fillStyle='rgba(255,234,187,'+(.5*alpha)+')';ctx.beginPath();ctx.arc(0,0,r*.055,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.fillStyle='#070b19';ctx.fillRect(0,0,w,h);const bg=ctx.createRadialGradient(w*.52,h*.45,0,w*.52,h*.45,Math.max(w,h)*.72);bg.addColorStop(0,'#252047');bg.addColorStop(.5,'#10152d');bg.addColorStop(1,'#050814');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='screen';const scale=Math.min(w,h);for(let i=0;i<22;i++){const a=i*2.399963+seed*.002,r=scale*(.06+.023*Math.sqrt(i)*3),x=w*.5+Math.cos(a+clock*.015)*r,y=h*.48+Math.sin(a+clock*.015)*r*.83;flower(x,y,scale*(.065+.035*hash(i+3)),clock*.035*(i%2?1:-1)+a,i%4,.75)}for(let i=0;i<13;i++){const a=i*Math.PI*2/13+clock*.012,x=w*.5+Math.cos(a)*scale*.13,y=h*.48+Math.sin(a)*scale*.13;branch(x,y,a,scale*.10,6,palettes[palette][i%4],Math.sin(clock*.18+i)*.11,.7)}for(const s of strokes){const age=clock-s.t,r=(14+age*26)*s.power,alpha=Math.max(0,1-age/8);if(alpha<=0)continue;flower(s.x,s.y,r,age*.3+s.angle,s.hue,alpha);for(let j=0;j<4;j++){const a=j*Math.PI*.5+age*.2+s.angle;branch(s.x,s.y,a,r*.45,5,palettes[palette][j],Math.sin(age+j)*.2,alpha)}}ctx.globalCompositeOperation='source-over';const vign=ctx.createRadialGradient(w*.5,h*.5,scale*.2,w*.5,h*.5,scale*.85);vign.addColorStop(0,'#00000000');vign.addColorStop(1,'#030411a0');ctx.fillStyle=vign;ctx.fillRect(0,0,w,h)}
function perturb(e){const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;strokes.push({x,y,t:clock,power:.65+Math.random()*.6,angle:Math.random()*6.28,hue:Math.floor(Math.random()*4)});if(strokes.length>24)strokes.shift()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,performance.now());perturb(e)});canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;if(performance.now()-touches.get(e.pointerId)>65){touches.set(e.pointerId,performance.now());perturb(e)}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>touches.delete(e.pointerId));document.querySelector('#palette').onclick=()=>palette=(palette+1)%palettes.length;document.querySelector('#bloom').onclick=()=>{seed+=137;strokes=[]};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!paused)clock+=dt;strokes=strokes.filter(s=>clock-s.t<8);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
