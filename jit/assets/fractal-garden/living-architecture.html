<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1014"><title>Living Architecture · Fractal Garden</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1014;color:#d8dfd4;font-family:system-ui}main{position:relative;width:100%;height:100dvh;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;font:11px ui-monospace,monospace}.title{letter-spacing:.18em;color:#b7d2bc}.mode{color:#e0bd85;margin-top:6px}.stats{text-align:right}.age{color:#9daea8;margin-top:6px}.bottom{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:14px;right:14px}.bar{height:3px;background:#39433f;border-radius:8px;overflow:hidden;margin-bottom:10px}.bar>div{height:100%;width:100%;background:#c7aa76}.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.buttons{display:flex;gap:8px}button{border:1px solid #4b6256;border-radius:10px;padding:11px 14px;background:#26322e;color:#f0e5c9;font:13px ui-monospace,monospace}.hint{font:10px ui-monospace,monospace;color:#aab7a8;text-align:right}</style></head><body><main><canvas id="view"></canvas><div class="top"><div><div class="title">LIVING ARCHITECTURE</div><div class="mode" id="mode">GERMINATING</div></div><div class="stats"><div id="budget">100% RESERVE</div><div class="age" id="age">AGE 0</div></div></div><div class="bottom"><div class="bar"><div id="bar"></div></div><div class="actions"><div class="buttons"><button id="pause" aria-label="Pause">Ⅱ</button><button id="speed" aria-label="Speed">1×</button><button id="reset" aria-label="Regrow">↺</button></div><div class="hint">SWIPE TO PRUNE<br>ROOT TO REBIRTH</div></div></div></main><script>
(()=>{'use strict';
const c=document.querySelector('#view'),g=c.getContext('2d'),modeEl=document.querySelector('#mode'),budgetEl=document.querySelector('#budget'),ageEl=document.querySelector('#age'),bar=document.querySelector('#bar');
let W=360,H=570,D=1,seed=741,age=0,budget=1350,capacity=1350,spent=0,segments=[],tips=[],sparks=[],cuts=[],paused=false,speed=1,gesture=null,last=performance.now(),acc=0,cycle=0;
const rand=n=>{let x=Math.sin(n*127.1+seed*.173)*43758.5453;return x-Math.floor(x)},clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rootY=()=>H*.79,rootX=()=>W*.5;
function resize(){let r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(2,devicePixelRatio||1);c.width=Math.round(W*D);c.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0)}new ResizeObserver(resize).observe(c);resize();
function reset(){age=0;spent=0;budget=capacity;segments=[];tips=[];sparks=[];cuts=[];cycle++;seed+=131;tips.push({x:rootX(),y:rootY(),angle:-Math.PI/2,width:7,depth:0,energy:1,phase:rand(seed)*6.28,parent:-1,steps:0})}
function tendency(){let t=age*.016;return {arch:clamp(.35+.35*Math.sin(t*.8+seed*.01)+.2*Math.sin(t*.23),0,1),branch:clamp(.35+.3*Math.sin(t*.65+1.3),.08,.9),curl:Math.sin(t*.37)*.22,leaf:clamp(.5+.5*Math.sin(t*.42-1),0,1)}}
function grow(){if(budget<1||segments.length>2000||tips.length===0)return;age+=.12;let p=tendency(),next=[],limit=Math.min(12,tips.length);for(let i=0;i<limit;i++){let tip=tips.shift();if(!tip)break;if(tip.width<.42||tip.depth>12)continue;let n=segments.length,noise=rand(n*7+cycle*71),h=3.4+tip.width*.32,ang=tip.angle,upward=-Math.PI/2,turn=Math.atan2(Math.sin(upward-ang),Math.cos(upward-ang));ang+=turn*(.045+p.arch*.035)+(noise-.5)*(.24+p.branch*.17)+p.curl*.12;if(p.arch>.52&&tip.depth>1){let side=tip.x<W*.5?1:-1;ang+=side*.07*p.arch}let x=clamp(tip.x+Math.cos(ang)*h,5,W-5),y=clamp(tip.y+Math.sin(ang)*h,12,rootY()+18),cost=h*(.5+tip.width*.12);if(cost>budget){tips.unshift(tip);break}segments.push({x1:tip.x,y1:tip.y,x2:x,y2:y,w:tip.width,parent:tip.parent,alive:true,age,material:p.arch,leaf:p.leaf,depth:tip.depth,cost});budget-=cost;spent+=cost;let t={...tip,x,y,angle:ang,width:tip.width*.994,parent:n,steps:tip.steps+1};next.push(t);if(tip.steps>5&&rand(n*11+17)<.025+p.branch*.105&&tips.length+next.length<75&&budget>30){let side=rand(n*19+3)>.5?1:-1;next.push({...t,angle:ang+side*(.35+rand(n*3)*.7),width:tip.width*(.58+.13*rand(n*8)),depth:tip.depth+1,steps:0})}}tips.push(...next);if(tips.length>90)tips=tips.slice(-90)}
function descendants(id){let set=new Set([id]);for(let i=id+1;i<segments.length;i++)if(set.has(segments[i].parent))set.add(i);return set}
function cut(id){let s=segments[id];if(!s||!s.alive)return;if(s.parent<0){reset();return}let ids=descendants(id),refund=0;for(let j of ids){let q=segments[j];if(q.alive){q.alive=false;refund+=q.cost;sparks.push({x:q.x2,y:q.y2,life:1})}}tips=tips.filter(t=>!ids.has(t.parent));budget=clamp(budget+refund,0,capacity);spent=Math.max(0,spent-refund);let parent=s.parent;if(parent>=0&&segments[parent]?.alive){let q=segments[parent];tips.push({x:q.x2,y:q.y2,angle:Math.atan2(q.y2-q.y1,q.x2-q.x1),width:Math.max(.65,q.w*.8),depth:q.depth,energy:1,parent,steps:0})}}
function distSegment(px,py,s){let dx=s.x2-s.x1,dy=s.y2-s.y1,t=clamp(((px-s.x1)*dx+(py-s.y1)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-s.x1-t*dx,py-s.y1-t*dy)}
function pruneLine(a,b){let dx=b.x-a.x,dy=b.y-a.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/5)),hits=new Set();for(let j=0;j<=n;j++){let x=a.x+dx*j/n,y=a.y+dy*j/n;for(let i=segments.length-1;i>=0;i--){let s=segments[i];if(s.alive&&distSegment(x,y,s)<Math.max(5,s.w*.65))hits.add(i)}}if(hits.size){for(let i of [...hits].sort((a,b)=>a-b))if(segments[i]?.alive)cut(i)}}
function point(e){let r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);gesture=point(e)});c.addEventListener('pointermove',e=>{if(!gesture)return;e.preventDefault();let p=point(e);if(Math.hypot(p.x-gesture.x,p.y-gesture.y)>3){pruneLine(gesture,p);cuts.push({a:gesture,b:p,life:1});gesture=p}});c.addEventListener('pointerup',e=>{if(!gesture)return;let p=point(e);if(Math.hypot(p.x-gesture.x,p.y-gesture.y)<6){if(Math.hypot(p.x-rootX(),p.y-rootY())<24)reset();else pruneLine({x:p.x-5,y:p.y-5},{x:p.x+5,y:p.y+5})}gesture=null});c.addEventListener('pointercancel',()=>gesture=null);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ'};document.querySelector('#speed').onclick=e=>{speed=speed===1?3:speed===3?8:1;e.currentTarget.textContent=speed+'×'};document.querySelector('#reset').onclick=reset;
function draw(dt){g.fillStyle='#0b1014';g.fillRect(0,0,W,H);let grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#17252b');grd.addColorStop(.65,'#10181c');grd.addColorStop(1,'#29251d');g.fillStyle=grd;g.fillRect(0,0,W,H);let p=tendency();g.strokeStyle='#5a5140';g.lineWidth=1;g.beginPath();g.moveTo(0,rootY()+4);g.lineTo(W,rootY()+4);g.stroke();for(let i=0;i<segments.length;i++){let s=segments[i];if(!s.alive)continue;let stone=s.material;g.strokeStyle=stone>.45?'#b3a18a':'#4c6e59';g.lineWidth=Math.max(.8,s.w);g.lineCap='round';g.beginPath();g.moveTo(s.x1,s.y1);g.lineTo(s.x2,s.y2);g.stroke();if(stone>.6&&s.depth<5){g.strokeStyle='#d5c2a355';g.lineWidth=1;g.beginPath();g.moveTo(s.x1-1,s.y1);g.lineTo(s.x2-1,s.y2);g.stroke()}if(s.w<2.4&&s.leaf>.3){let z=Math.sin(age*.1+i)*2,r=2.5+s.leaf*3;g.fillStyle=s.material>.55?'#b6a982a8':'#7eac7d99';g.beginPath();g.ellipse(s.x2+z,s.y2,r,r*.45,i*.9,0,Math.PI*2);g.fill()}}g.fillStyle='#d7b87b';g.beginPath();g.arc(rootX(),rootY(),5,0,7);g.fill();for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.life-=dt;g.fillStyle='rgba(222,186,120,'+clamp(s.life,0,1)+')';g.fillRect(s.x,s.y,2,2);if(s.life<=0)sparks.splice(i,1)}for(let i=cuts.length-1;i>=0;i--){let s=cuts[i];s.life-=dt*3;g.strokeStyle='rgba(248,190,120,'+clamp(s.life,0,1)+')';g.lineWidth=2;g.beginPath();g.moveTo(s.a.x,s.a.y);g.lineTo(s.b.x,s.b.y);g.stroke();if(s.life<=0)cuts.splice(i,1)}modeEl.textContent=p.arch>.66?'VAULT / MASONRY':p.branch>.54?'CANOPY / RAMIFICATION':p.leaf>.65?'BLOOM / FOLIAGE':'TRUNK / LATTICE';budgetEl.textContent=Math.round(budget/capacity*100)+'% RESERVE';ageEl.textContent='AGE '+Math.floor(age)+' · '+segments.filter(s=>s.alive).length+' NODES';bar.style.width=(budget/capacity*100)+'%'}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){acc+=dt*speed;let k=0;while(acc>.018&&k++<35){grow();acc-=.018}}draw(dt);requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
})();
</script></body></html>
