<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1115"><title>Living Architecture II · Fusion</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1115;color:#d8dfd4;font:12px ui-monospace,monospace}main{position:relative;width:100%;height:100dvh;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}.hud b{font-weight:500;letter-spacing:.13em;color:#c4ddcb}.hud small{display:block;color:#d9b987;margin-top:7px}.stats{text-align:right}.footer{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:14px;right:14px}.meter{height:3px;background:#39433f;border-radius:5px;overflow:hidden;margin-bottom:10px}.meter div{height:100%;background:#d6b980}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center}button{background:#26342f;border:1px solid #52695b;border-radius:10px;color:#f0e5c9;padding:11px 13px;font:13px ui-monospace,monospace}.hint{font-size:10px;color:#aeb9ac;text-align:right}</style></head><body><main><canvas id="view"></canvas><div class="hud"><div><b>LIVING ARCHITECTURE / II</b><small id="phase">ROOTS → RIBS → VAULTS</small></div><div class="stats"><div id="stock">100% RESERVE</div><small id="count">0 FUSIONS</small></div></div><div class="footer"><div class="meter"><div id="meter"></div></div><div class="bar"><div><button id="pause">Ⅱ</button> <button id="speed">1×</button> <button id="reset">↺</button></div><span class="hint">SWIPE TO PRUNE<br>ROOT TO REBIRTH</span></div></div></main><script>
(()=>{'use strict';const c=document.querySelector('canvas'),ctx=c.getContext('2d'),phase=document.querySelector('#phase'),stock=document.querySelector('#stock'),count=document.querySelector('#count'),meter=document.querySelector('#meter');let W=360,H=600,dpr=1,seed=741,life=0,capacity=2400,budget=2400,nodes=[],edges=[],tips=[],bridges=[],cuts=[],touch=null,paused=false,speed=1,acc=0,last=performance.now(),epoch=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),hash=n=>{let v=Math.sin(n*127.1+seed*.731)*43758.5453;return v-Math.floor(v)},ground=()=>H*.81;
function resize(){let r=c.getBoundingClientRect();let oldW=W,oldH=H;W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(nodes.length){let sx=W/oldW,sy=H/oldH;for(let n of nodes){n.x*=sx;n.y*=sy}}}new ResizeObserver(resize).observe(c);resize();
function newNode(x,y,parent=-1){let id=nodes.length;nodes.push({x,y,parent,alive:true});return id}
function reset(){seed+=137;epoch++;life=0;budget=capacity;nodes=[];edges=[];tips=[];bridges=[];cuts=[];let x=W*.5,y=ground(),root=newNode(x,y);tips.push({node:root,angle:-Math.PI/2,width:7,depth:0,steps:0,energy:1});}
function tendency(){let t=life*.012;return {arch:clamp(.55+.4*Math.sin(t*.48+seed*.02),.05,.98),branch:clamp(.5+.34*Math.sin(t*.65+1.1),.1,.9),leaf:clamp(.5+.48*Math.cos(t*.29),0,1)}}
function addEdge(a,b,width,kind,cost){let id=edges.length;edges.push({a,b,width,kind,cost,alive:true});return id}
function nearestTarget(tip,p){let a=nodes[tip.node],best=-1,dist=Infinity;for(let i=0;i<nodes.length;i++){let n=nodes[i];if(!n.alive||i===tip.node||i===a.parent)continue;let d=Math.hypot(n.x-a.x,n.y-a.y);if(d>12||d<4||d>=dist)continue;if(Math.abs(n.y-a.y)>9)continue;if(n.x===a.x)continue;let linked=edges.some(e=>e.alive&&((e.a===tip.node&&e.b===i)||(e.b===tip.node&&e.a===i)));if(linked)continue;best=i;dist=d}return best}
function grow(){if(budget<2||edges.length>2300||!tips.length)return;life+=.1;let p=tendency(),limit=Math.min(14,tips.length),out=[];for(let k=0;k<limit;k++){let tip=tips.shift(),a=nodes[tip.node];if(!a?.alive||tip.width<.45||tip.depth>12)continue;let target=nearestTarget(tip,p);if(target>=0&&p.arch>.28&&budget>6){let b=nodes[target],d=Math.hypot(b.x-a.x,b.y-a.y),cost=d*(.35+tip.width*.07);if(cost<=budget){addEdge(tip.node,target,Math.max(1,tip.width*.55),'fusion',cost);bridges.push({a:tip.node,b:target,alive:true});budget-=cost;continue}}
let n=edges.length,h=3.3+tip.width*.32,ang=tip.angle,turn=Math.atan2(Math.sin(-Math.PI/2-ang),Math.cos(-Math.PI/2-ang));ang+=turn*.06+(hash(n*13+epoch*7)-.5)*(.28+p.branch*.22);if(p.arch>.6&&tip.depth>0){let toward=tip.depth%2?1:-1;ang+=toward*.1*p.arch}
let x=clamp(a.x+Math.cos(ang)*h,6,W-6),y=clamp(a.y+Math.sin(ang)*h,18,ground()+8),d=Math.hypot(x-a.x,y-a.y);if(d<.5)continue;let cost=d*(.45+tip.width*.12);if(cost>budget){tips.unshift(tip);break}let b=newNode(x,y,tip.node);addEdge(tip.node,b,tip.width,p.arch>.55?'stone':'wood',cost);budget-=cost;let next={...tip,node:b,angle:ang,width:tip.width*.994,steps:tip.steps+1};out.push(next);
if(tip.steps>4&&hash(n*19+11)<.035+p.branch*.13&&tips.length+out.length<85&&budget>30){let sign=hash(n*17)>.5?1:-1;out.push({...next,angle:ang+sign*(.45+hash(n*7)*.8),width:tip.width*(.6+hash(n*3)*.13),depth:tip.depth+1,steps:0})}}
tips.push(...out);if(tips.length>100)tips=tips.slice(-100)}
function prune(edgeId){let edge=edges[edgeId];if(!edge?.alive)return;let node=nodes[edge.b];if(!node)return;if(node.parent<0||edge.a===0){reset();return}let dead=new Set([edge.b]);for(let i=edge.b+1;i<nodes.length;i++)if(dead.has(nodes[i].parent))dead.add(i);let refund=0;for(let e of edges){if(!e.alive)continue;if(dead.has(e.a)||dead.has(e.b)){e.alive=false;refund+=e.cost}}for(let i of dead)nodes[i].alive=false;tips=tips.filter(t=>!dead.has(t.node));budget=Math.min(capacity,budget+refund);bridges=bridges.filter(b=>edges.some(e=>e.alive&&e.kind==='fusion'&&((e.a===b.a&&e.b===b.b)||(e.a===b.b&&e.b===b.a))));let parent=nodes[edge.a];if(parent?.alive)tips.push({node:edge.a,angle:-Math.PI/2,width:Math.max(.8,edge.width*.75),depth:0,steps:0})}
function dist(x,y,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(x-a.x-t*dx,y-a.y-t*dy)}
function swipe(a,b){let d=Math.hypot(b.x-a.x,b.y-a.y),hits=new Set();for(let j=0;j<=Math.ceil(d/5);j++){let t=j/Math.max(1,Math.ceil(d/5)),x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;for(let i=edges.length-1;i>=0;i--){let e=edges[i];if(e.alive&&dist(x,y,nodes[e.a],nodes[e.b])<Math.max(4,e.width*.6))hits.add(i)}}for(let i of [...hits].sort((a,b)=>a-b))if(edges[i]?.alive)prune(i)}
function point(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);touch=point(e)});c.addEventListener('pointermove',e=>{if(!touch)return;let p=point(e);if(Math.hypot(p.x-touch.x,p.y-touch.y)>4){swipe(touch,p);cuts.push({a:touch,b:p,t:1});touch=p}});c.addEventListener('pointerup',e=>{if(!touch)return;let p=point(e);if(Math.hypot(p.x-W*.5,p.y-ground())<25)reset();else swipe({x:p.x-4,y:p.y-4},{x:p.x+4,y:p.y+4});touch=null});c.addEventListener('pointercancel',()=>touch=null);
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'▶':'Ⅱ'};document.querySelector('#speed').onclick=e=>{speed=speed===1?3:speed===3?8:1;e.target.textContent=speed+'×'};document.querySelector('#reset').onclick=reset;
function render(dt){let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#14232b');grad.addColorStop(.65,'#10181c');grad.addColorStop(1,'#29251d');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#5a5140';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,ground()+4);ctx.lineTo(W,ground()+4);ctx.stroke();for(let e of edges){if(!e.alive)continue;let a=nodes[e.a],b=nodes[e.b];ctx.lineCap='round';ctx.lineWidth=Math.max(.7,e.width);ctx.strokeStyle=e.kind==='fusion'?'#d6bb86':e.kind==='stone'?'#b5a18a':'#6e977c';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(e.kind==='fusion'){ctx.strokeStyle='#fff0c055';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y-2);ctx.lineTo(b.x,b.y-2);ctx.stroke()}}
for(let i=0;i<edges.length;i++){let e=edges[i];if(!e.alive||e.width>2)continue;let n=nodes[e.b];ctx.fillStyle=e.kind==='stone'?'#c4b38b88':'#7fa982aa';ctx.beginPath();ctx.ellipse(n.x,n.y,3,1.5,i*.3,0,7);ctx.fill()}
ctx.fillStyle='#e0bd80';ctx.beginPath();ctx.arc(W*.5,ground(),5,0,7);ctx.fill();for(let i=cuts.length-1;i>=0;i--){let q=cuts[i];q.t-=dt*3;ctx.strokeStyle='rgba(255,196,130,'+clamp(q.t,0,1)+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(q.a.x,q.a.y);ctx.lineTo(q.b.x,q.b.y);ctx.stroke();if(q.t<=0)cuts.splice(i,1)}
let p=tendency(),f=edges.filter(e=>e.alive&&e.kind==='fusion').length;phase.textContent=p.arch>.65?'VAULTING / FUSION':p.branch>.55?'BRANCHING / LATTICE':'ROOTS / RIBS';stock.textContent=Math.round(budget/capacity*100)+'% RESERVE';count.textContent=f+' FUSIONS · '+edges.filter(e=>e.alive).length+' RIBS';meter.style.width=(budget/capacity*100)+'%'}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){acc+=dt*speed;let n=0;while(acc>.018&&n++<36){grow();acc-=.018}}render(dt);requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
})();</script></body></html>
