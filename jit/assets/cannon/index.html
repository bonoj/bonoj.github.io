<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8e7dd"><title>The Cannon · Emoji Material Study</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e7dd;font-family:system-ui,sans-serif}#stage{position:relative;width:100%;height:100dvh;min-height:320px;overflow:hidden;touch-action:manipulation;user-select:none;background:#e8e7dd}.ground{position:absolute;left:0;right:0;bottom:53px;height:6px;background:#6c7566;border-radius:3px}.wall{position:absolute;right:13px;top:74px;bottom:53px;width:9px;border-radius:4px;background:#737a78}.entity{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none;white-space:nowrap}.cannon{position:absolute;left:30%;bottom:58px;font-size:65px;transform:translateX(-50%);filter:drop-shadow(0 6px 2px #0002)}.feed{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:6px;z-index:5}.controls{position:absolute;bottom:8px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:5}button{border:1px solid #8d9288;background:#ffffffdd;color:#333;border-radius:9px;padding:8px 11px;font-size:12px}.readout{font:11px ui-monospace,monospace;color:#51594f}
</style></head><body><main id="stage"><div class="feed"><span style="font:12px ui-monospace,monospace;color:#51594f">🐑 → ⚙️ → 🍖</span><button id="add">+ 🐑</button></div><div class="ground"></div><div class="wall"></div><div class="cannon">🛞</div><div id="barrel" style="position:absolute;left:30%;bottom:80px;width:79px;height:30px;border:5px solid #414c4c;background:#697776;border-radius:7px 15px 15px 7px;box-shadow:0 4px 0 #0002"></div><div id="world" style="position:absolute;inset:0;pointer-events:none"></div><div class="controls"><span class="readout" id="count">0 processed · 0 remains</span><button id="reset">↻ Reset</button></div></main>
<script>
(()=>{'use strict';
const root=document.getElementById('stage'),world=document.getElementById('world'),readout=document.getElementById('count');
const fauna=['🐑','🐏','🐐','🐄','🐂','🐃','🐖','🐎','🫏','🐓','🦃','🦆','🪿','🐇','🐆','🦌','🦬','🦡','🦨','🦫','🐿️','🦔','🐁','🐀','🐈','🐕','🦅'];
const big=new Set(['🐄','🐂','🐃','🐎','🫏','🦬']),birds=new Set(['🐓','🦃','🦆','🪿','🦅']),small=new Set(['🐇','🐿️','🦔','🐁','🐀']);
const rand=(a,b)=>a+Math.random()*(b-a),ground=()=>root.clientHeight-59,wall=()=>root.clientWidth-28,cx=()=>root.clientWidth*.3;
let animals=[],parts=[],fx=[],processed=0,spawnClock=0,last=performance.now();
function make(emoji,x,y,size){const el=document.createElement('div');el.className='entity';el.textContent=emoji;el.style.fontSize=size+'px';world.appendChild(el);return el}
function place(o){o.el.style.left=o.x+'px';o.el.style.top=o.y+'px';o.el.style.transform='translate(-50%,-50%) rotate('+(o.rot||0)+'deg) scaleX('+(o.flip?-1:1)+')'}
function spawn(){if(animals.length>7)return;let emoji=fauna[Math.floor(Math.random()*fauna.length)],size=big.has(emoji)?37:small.has(emoji)?23:31;animals.push({emoji,x:-35,y:ground()-size*.48,size,el:make(emoji,-35,0,size),v:rand(19,37),rot:0,flip:false})}
function eject(a){processed++;let n=big.has(a.emoji)?9:small.has(a.emoji)?3:birds.has(a.emoji)?5:6;let menu=birds.has(a.emoji)?['🍗','🍖','🦴','🪶']:small.has(a.emoji)?['🍖','🦴']:['🥩','🍖','🦴'];for(let j=0;j<n;j++){let emoji=menu[Math.floor(rand(0,menu.length))],mass=emoji==='🥩'?3.4:emoji==='🍖'?2.3:emoji==='🍗'?1.5:emoji==='🦴'?0.75:0.12;let size=emoji==='🥩'?29:emoji==='🍖'?26:emoji==='🍗'?23:emoji==='🦴'?20:15;parts.push({emoji,mass,size,x:cx()+74,y:ground()-77,vx:rand(95,245)/Math.sqrt(mass),vy:rand(-210,-70)/Math.sqrt(mass),rot:rand(-70,70),spin:rand(-300,300)/Math.sqrt(mass),age:0,decay:rand(12,24),el:make(emoji,0,0,size)})}fx.push({el:make('💥',cx()+72,ground()-76,34),x:cx()+72,y:ground()-76,age:0,rot:0})}
function reset(){[...animals,...parts,...fx].forEach(o=>o.el.remove());animals=[];parts=[];fx=[];processed=0;spawnClock=0;for(let i=0;i<3;i++)spawn()}
document.getElementById('add').onclick=spawn;document.getElementById('reset').onclick=reset;
function frame(now){if(!root.isConnected)return;let dt=Math.min(.04,(now-last)/1000);last=now;spawnClock+=dt;if(spawnClock>2.2){spawnClock=0;spawn()}
for(let i=animals.length-1;i>=0;i--){let a=animals[i];a.x+=a.v*dt;a.y=ground()-a.size*.46+Math.sin(now/170+i)*1.3;if(a.x>=cx()-20){eject(a);a.el.remove();animals.splice(i,1)}else place(a)}
for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.age+=dt;p.vy+=330*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;p.vx*=Math.exp(-dt*(p.mass<1?.4:.08));if(p.x>wall()-p.size*.4){p.x=wall()-p.size*.4;p.vx=-Math.abs(p.vx)*(p.mass<1?.55:.3);p.spin*=.8}if(p.x<p.size*.5){p.x=p.size*.5;p.vx=Math.abs(p.vx)*.35}if(p.y>ground()-p.size*.4){p.y=ground()-p.size*.4;p.vy=-Math.abs(p.vy)*(p.mass<1?.5:.27);p.vx*=.82;p.spin*=.75;if(Math.abs(p.vy)<13)p.vy=0}if(p.y<70){p.y=70;p.vy=Math.abs(p.vy)*.4}let decay=Math.max(0,(p.age-p.decay+4)/4);p.el.style.filter='grayscale('+decay+') brightness('+(1-decay*.65)+')';if(p.age>p.decay){p.el.remove();parts.splice(i,1)}else place(p)}
for(let i=fx.length-1;i>=0;i--){let p=fx[i];p.age+=dt;p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';p.el.style.opacity=String(Math.max(0,1-p.age/.32));if(p.age>.32){p.el.remove();fx.splice(i,1)}}
readout.textContent=processed+' processed · '+parts.length+' remains';requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);
})();
</script></body></html>
