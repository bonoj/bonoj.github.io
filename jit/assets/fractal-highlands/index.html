<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fractal Highlands · Procedural Terrain</title><style>body{margin:0;background:#08120f;color:#c9e8d8;font:12px system-ui}canvas{display:block;width:100%;height:78vh;touch-action:none}header,footer{padding:12px}footer{display:flex;flex-wrap:wrap;gap:12px;align-items:center}input{accent-color:#79d6a6}button{background:#12221c;color:inherit;border:1px solid #537361;border-radius:6px;padding:6px 10px}a{color:#a8efc7}</style></head><body><header>FRACTAL HIGHLANDS <span id="status">Initializing…</span></header><canvas id="canvas"></canvas><footer><label>Detail <input id="detail" type="range" min="1" max="9" value="6"></label><label>Roughness <input id="rough" type="range" min="20" max="80" value="52"></label><label>Relief <input id="relief" type="range" min="20" max="180" value="100"></label><button id="new">New seed</button><button id="reset">Reset view</button><a href="../">Assets</a></footer><script type="module">
const canvas=document.getElementById('canvas'),status=document.getElementById('status');
try{
let T;try{T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js')}catch(e){T=await import('https://esm.sh/three@0.170.0')}
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color(0x091813);scene.fog=new T.FogExp2(0x091813,.018);
const camera=new T.PerspectiveCamera(48,1,.1,200);scene.add(new T.HemisphereLight(0xc9ebdb,0x13211b,2));const sun=new T.DirectionalLight(0xffebbd,3);sun.position.set(-15,24,8);scene.add(sun);
const N=160,WIDTH=44,geom=new T.PlaneGeometry(WIDTH,WIDTH,N,N);geom.rotateX(-Math.PI/2);const pos=geom.attributes.position;let seed=19;
function hash(x,z){let a=Math.sin(x*127.1+z*311.7+seed*71.13)*43758.5453;return (a-Math.floor(a))*2-1;}
function noise(x,z){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,sx=fx*fx*(3-2*fx),sz=fz*fz*(3-2*fz);return T.MathUtils.lerp(T.MathUtils.lerp(hash(ix,iz),hash(ix+1,iz),sx),T.MathUtils.lerp(hash(ix,iz+1),hash(ix+1,iz+1),sx),sz);}
const mat=new T.MeshStandardMaterial({color:0x718879,roughness:1,metalness:0,side:T.DoubleSide,vertexColors:true}),mesh=new T.Mesh(geom,mat);scene.add(mesh);
const detail=document.getElementById('detail'),rough=document.getElementById('rough'),relief=document.getElementById('relief'),color=new Float32Array(pos.count*3),c=new T.Color();
function build(){const oct=+detail.value,r=+rough.value/100,scale=+relief.value/100;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),fold=Math.sin(x*.13+noise(x*.045,z*.045)*2.2)*Math.cos(z*.12);let h=fold*2.7,amplitude=3.4,frequency=.075;for(let k=0;k<oct;k++){const v=noise(x*frequency+13*k,z*frequency-7*k),ridge=1-Math.abs(v);h+=amplitude*(ridge*ridge-.34);amplitude*=r;frequency*=2;}h*=scale;pos.setY(i,h);const slopeColor=T.MathUtils.clamp((h+5)/14,0,1);if(h>8*scale)c.setRGB(.69,.72,.67);else if(h>4*scale)c.setRGB(.41,.48,.40);else if(h>0)c.setRGB(.25,.38,.30);else c.setRGB(.14,.27,.22);c.multiplyScalar(.8+slopeColor*.3);color[i*3]=c.r;color[i*3+1]=c.g;color[i*3+2]=c.b;}pos.needsUpdate=true;geom.setAttribute('color',new T.BufferAttribute(color.slice(),3));geom.computeVertexNormals();status.textContent=oct+' octaves · '+(N*N*2).toLocaleString()+' triangles';}
build();[detail,rough,relief].forEach(el=>el.addEventListener('input',build));document.getElementById('new').onclick=()=>{seed+=137;build()};
let az=.65,el=.62,dist=58,drag=null;function cam(){camera.position.set(dist*Math.cos(el)*Math.cos(az),dist*Math.sin(el),dist*Math.cos(el)*Math.sin(az));camera.lookAt(0,1,0)}cam();
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=Math.max(.08,Math.min(1.45,el+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY];cam()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(8,Math.min(120,dist*Math.exp(e.deltaY*.001)));cam()},{passive:false});document.getElementById('reset').onclick=()=>{az=.65;el=.62;dist=58;cam()};
function tick(){requestAnimationFrame(tick);const w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h&&(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio()))){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}renderer.render(scene,camera)}tick();
}catch(e){status.textContent='Renderer error: '+e.message;status.style.color='#ffb0a0'}
</script></body></html>
