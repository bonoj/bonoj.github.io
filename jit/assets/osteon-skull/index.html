<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e13"><title>Osteon · Anatomical Skull</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0e13;color:#e9e1d1;font:13px system-ui}header{position:absolute;top:16px;left:16px;z-index:1;pointer-events:none}h1{font-size:17px;letter-spacing:.22em;margin:0}header p{font-size:11px;letter-spacing:.13em;color:#b7b1a6}canvas{display:block;width:100%;height:calc(100dvh - 126px);min-height:290px;touch-action:none}footer{background:#20282d;padding:12px 14px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}button{background:#303e44;border:1px solid #62747a;color:white;border-radius:7px;padding:8px 12px;font:inherit}button.primary{background:#44584e;border-color:#788b7b}input{accent-color:#c8b79c}label{white-space:nowrap}a{color:#c8d6cc}#status{position:absolute;bottom:144px;left:14px;color:#d5c5a9;font-size:12px;max-width:90%;overflow-wrap:anywhere}.hint{color:#aeb8b5;width:100%}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<header><h1>OSTEON</h1><p>ANATOMICAL SPECIMEN / 051</p></header><canvas id="canvas"></canvas><div id="status">Initializing renderer…</div>
<footer><button class="primary" id="rotate">Ⅱ Rotate</button><button id="front">Front</button><button id="profile">Profile</button><button id="crown">Crown</button><button id="reset">Reset</button><label>Porosity <input id="pores" type="range" min="0" max="100" value="68"></label><label>Mineral <input id="mineral" type="range" min="0" max="100" value="50"></label><label><input id="wire" type="checkbox"> Wireframe</label><a href="../">Assets</a><div class="hint">Drag to orbit · Pinch or scroll to zoom · External Khronos GLB required; pores are shader shading, not physical perforations.</div></footer>
<script type="module">
const canvas=document.querySelector('#canvas'),status=document.querySelector('#status');
try{
const T=await import('three'),{GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'default'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
const scene=new T.Scene();scene.background=new T.Color(0x0b0e13);const camera=new T.PerspectiveCamera(38,1,.01,100);
scene.add(new T.HemisphereLight(0xf2e8d7,0x263540,2.1));function light(color,power,x,y,z){const l=new T.DirectionalLight(color,power);l.position.set(x,y,z);scene.add(l)}
light(0xffdfb8,3.7,-6,9,10);light(0x9bb8cf,2.6,8,4,-8);light(0xffffff,1.2,2,-7,6);
const modelRoot=new T.Group();scene.add(modelRoot);
const material=new T.MeshStandardMaterial({color:0xe2d3b7,roughness:.88,metalness:0,side:T.DoubleSide});
const uniforms={uPores:{value:.68},uMineral:{value:.5}};
material.onBeforeCompile=shader=>{
Object.assign(shader.uniforms,uniforms);
shader.vertexShader=shader.vertexShader.replace('#include <common>',`#include <common>
varying vec3 vBoneLocal;`);
shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
vBoneLocal=position;`);
shader.fragmentShader=shader.fragmentShader.replace('#include <common>',`#include <common>
varying vec3 vBoneLocal;uniform float uPores,uMineral;
float hashBone(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float noiseBone(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(mix(hashBone(i),hashBone(i+vec3(1,0,0)),f.x),mix(hashBone(i+vec3(0,1,0)),hashBone(i+vec3(1,1,0)),f.x),f.y),mix(mix(hashBone(i+vec3(0,0,1)),hashBone(i+vec3(1,0,1)),f.x),mix(hashBone(i+vec3(0,1,1)),hashBone(i+vec3(1,1,1)),f.x),f.y),f.z);}`);
shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>',`#include <color_fragment>
vec3 p=vBoneLocal;float coarse=noiseBone(p*2.8);float porous=noiseBone(p*35.0)*.7+noiseBone(p*89.0)*.3;float pit=(1.0-smoothstep(.30,.56,porous))*uPores;float mineral=noiseBone(p*7.0);
diffuseColor.rgb*=mix(vec3(.79,.74,.65),vec3(1.06,1.03,.96),coarse);diffuseColor.rgb*=1.0-pit*.43;diffuseColor.rgb*=mix(.88,1.08,mineral*uMineral);`);
};
let az=.2,el=.08,dist=12.5,auto=true,last=0,drag=null;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function view(){camera.position.set(dist*Math.sin(az)*Math.cos(el),dist*Math.sin(el),dist*Math.cos(az)*Math.cos(el));camera.lookAt(0,0,0)}view();
const rotate=document.querySelector('#rotate');function pause(){auto=false;rotate.textContent='▶ Rotate'}
rotate.onclick=()=>{auto=!auto;rotate.textContent=auto?'Ⅱ Rotate':'▶ Rotate'};
function pose(a,e){pause();az=a;el=e;view()}
document.querySelector('#front').onclick=()=>pose(0,0);document.querySelector('#profile').onclick=()=>pose(Math.PI/2,0);document.querySelector('#crown').onclick=()=>pose(0,1.45);
document.querySelector('#reset').onclick=()=>{az=.2;el=.08;dist=12.5;view()};
document.querySelector('#pores').oninput=e=>uniforms.uPores.value=+e.target.value/100;
document.querySelector('#mineral').oninput=e=>uniforms.uMineral.value=+e.target.value/100;
document.querySelector('#wire').onchange=e=>material.wireframe=e.target.checked;
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];pause();canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=clamp(el+(e.clientY-drag[1])*.008,-1.48,1.48);drag=[e.clientX,e.clientY];view()});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=clamp(dist*Math.exp(e.deltaY*.001),4,30);view()},{passive:false});
let pinch=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)dist=clamp(dist*pinch/d,4,30);pinch=d;view()}},{passive:true});canvas.addEventListener('touchend',()=>pinch=0);
function frame(ms){requestAnimationFrame(frame);if(auto&&last){az+=Math.min((ms-last)/1000,.05)*.19;view()}last=ms;const w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h&&(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio()))){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}renderer.render(scene,camera)}
requestAnimationFrame(frame);
const urls=['https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Assets@main/Models/ScatteringSkull/glTF-Binary/ScatteringSkull.glb','https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ScatteringSkull/glTF-Binary/ScatteringSkull.glb','https://cdn.statically.io/gh/KhronosGroup/glTF-Sample-Assets/main/Models/ScatteringSkull/glTF-Binary/ScatteringSkull.glb'];
let gltf=null,errors=[];const loader=new GLTFLoader();
for(let i=0;i<urls.length;i++){status.textContent='Loading skull geometry · source '+(i+1)+'/'+urls.length;try{gltf=await loader.loadAsync(urls[i]);break}catch(e){errors.push(e.message||String(e))}}
if(!gltf)throw Error('GLB failed on all hosts: '+errors.join(' | '));
const skull=gltf.scene;skull.updateMatrixWorld(true);const box=new T.Box3().setFromObject(skull),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());
if(!Number.isFinite(size.length())||size.length()===0)throw Error('Invalid skull bounds');
const scale=6.6/Math.max(size.x,size.y,size.z);skull.position.sub(center).multiplyScalar(scale);skull.scale.multiplyScalar(scale);modelRoot.add(skull);
let meshes=0,triangles=0;skull.traverse(o=>{if(!o.isMesh)return;meshes++;triangles+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;o.material=material});
status.textContent='LOADED · '+meshes+' meshes · '+Math.round(triangles).toLocaleString()+' triangles';
}catch(e){status.textContent='Error: '+(e.message||String(e));status.style.color='#efaaa0'}
</script></body></html>
