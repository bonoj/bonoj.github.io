<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b2d"><title>Strand · Plateau Island / WebGL</title><style>*{box-sizing:border-box}body{margin:0;background:#172725;color:#eee7d2;font:14px system-ui}main{max-width:940px;margin:auto;padding:14px}h1{margin:0;font-size:24px}p{color:#b6c8bd}canvas{width:100%;height:min(67vw,530px);min-height:320px;display:block;touch-action:none;background:#a3c5cc;border-radius:13px}nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}button{padding:10px 12px;border:1px solid #698075;background:#304942;color:#eee7d2;border-radius:9px;font:600 13px system-ui}button.on{background:#8d9f71;color:#142722}label{display:block;margin:10px 0}input{width:100%;accent-color:#b8c88b}.controls{display:grid;grid-template-columns:1fr 1fr;gap:15px}a{color:#d2c89b}#status{font-size:12px;color:#c3c5a7}</style></head><body><main><h1>STRAND · PLATEAU ISLAND</h1><p>Self-contained WebGL terrain study · three tiered plateaus · orbitable solid geometry</p><canvas id="view"></canvas><div class="controls"><label>Cliff height <b id="hv">1.0×</b><input id="height" type="range" min=".4" max="2.3" step=".1" value="1"></label><label>Zoom <b id="zv">1.0×</b><input id="zoom" type="range" min=".6" max="2.2" step=".05" value="1"></label></div><nav><button id="spin" class="on">◉ Auto orbit</button><button id="trees" class="on">♣ Trees</button><button id="houses" class="on">⌂ Houses</button><button id="top">Top view</button><button id="reset">↺ Reset</button></nav><p id="status">Initializing WebGL…</p><p><a href="../">← Strand collection</a></p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('view'),gl=cv.getContext('webgl',{antialias:true,depth:true,alpha:false});if(!gl){$('status').textContent='WebGL unavailable';return}
const vs='attribute vec3 p;attribute vec3 n;attribute vec3 c;uniform mat4 mvp;varying vec3 v;varying vec3 normal;void main(){gl_Position=mvp*vec4(p,1.);v=c;normal=n;}';
const fs='precision mediump float;varying vec3 v;varying vec3 normal;void main(){float light=.54+.46*max(dot(normalize(normal),normalize(vec3(-.45,.85,.5))),0.);gl_FragColor=vec4(v*light,1.);}';
function shader(t,s){let o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(o));return o}
let prog;try{prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(prog))}catch(e){$('status').textContent=e.message;return}
gl.useProgram(prog);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearColor(.64,.78,.82,1);
const loc={p:gl.getAttribLocation(prog,'p'),n:gl.getAttribLocation(prog,'n'),c:gl.getAttribLocation(prog,'c'),m:gl.getUniformLocation(prog,'mvp')};
const PI=Math.PI,sin=Math.sin,cos=Math.cos,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hash=n=>{let x=sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};
const colors={sand:[.85,.79,.63],g0:[.48,.66,.43],g1:[.55,.72,.47],g2:[.65,.77,.53],cliff:[.50,.53,.47],cliff2:[.59,.59,.52],bottom:[.43,.48,.44],trunk:[.38,.32,.23],leaf:[.27,.48,.31],leaf2:[.37,.57,.38],wall:[.84,.79,.66],roof:[.63,.31,.25],roof2:[.67,.44,.30]};
let yaw=.75,pitch=.68,zoom=1,hs=1,spin=true,showTrees=true,showHouses=true,groups={},last=0,drag=false;
const make=()=>({p:[],n:[],c:[]});
function tri(g,a,b,c,color){let u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]],n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],d=Math.hypot(...n)||1;n=n.map(x=>x/d);for(let x of [a,b,c]){g.p.push(...x);g.n.push(...n);g.c.push(...color)}}
function quad(g,a,b,c,d,col){tri(g,a,b,c,col);tri(g,a,c,d,col)}
function box(g,x,y,z,w,h,d,side,top){let a=[x-w/2,y,z-d/2],b=[x+w/2,y,z-d/2],c=[x+w/2,y,z+d/2],dd=[x-w/2,y,z+d/2],e=[x-w/2,y+h,z-d/2],f=[x+w/2,y+h,z-d/2],gg=[x+w/2,y+h,z+d/2],hh=[x-w/2,y+h,z+d/2];quad(g,a,b,f,e,side);quad(g,b,c,gg,f,side);quad(g,c,dd,hh,gg,side);quad(g,dd,a,e,hh,side);quad(g,e,f,gg,hh,top)}
function cone(g,x,y,z,r,h,col){for(let i=0;i<7;i++){let a=i*2*PI/7,b=(i+1)*2*PI/7;tri(g,[x+r*cos(a),y,z+r*sin(a)],[x+r*cos(b),y,z+r*sin(b)],[x,y+h,z],col)}}
const coast=a=>1+.075*sin(a*5+1.7)+.035*sin(a*9-1)+.016*cos(a*17),edge=(t,a)=>[.98,.79,.55,.28][t]+.012*sin(a*7+t*2)+.008*sin(a*13-t*3),xy=(r,a)=>[2.15*r*coast(a)*cos(a),1.72*r*coast(a)*sin(a)],levels=[.18,.63,1.18,1.84],tier=r=>r<.28?3:r<.55?2:r<.79?1:0;
function terrain(g){const N=160,h=t=>levels[t]*hs;for(let j=0;j<N;j++){let a=j*2*PI/N,b=(j+1)*2*PI/N;for(let t=0;t<4;t++){let ia=t===3?0:edge(t+1,a),ib=t===3?0:edge(t+1,b),oa=edge(t,a),ob=edge(t,b);for(let k=0;k<6;k++){let q=k/6,v=(k+1)/6,A=xy(ia+(oa-ia)*q,a),B=xy(ia+(oa-ia)*v,a),C=xy(ib+(ob-ib)*v,b),D=xy(ib+(ob-ib)*q,b),y=h(t);quad(g,[A[0],y,A[1]],[B[0],y,B[1]],[C[0],y,C[1]],[D[0],y,D[1]],t===0?colors.sand:colors['g'+(t-1)])}if(t<3){let p=xy(edge(t+1,a),a),q=xy(edge(t+1,b),b);quad(g,[p[0],h(t),p[1]],[q[0],h(t),q[1]],[q[0],h(t+1),q[1]],[p[0],h(t+1),p[1]],j%4===0?colors.cliff2:colors.cliff)}}let p=xy(edge(0,a),a),q=xy(edge(0,b),b);quad(g,[p[0],-.5,p[1]],[q[0],-.5,q[1]],[q[0],h(0),q[1]],[p[0],h(0),p[1]],colors.bottom);tri(g,[0,-.5,0],[q[0],-.5,q[1]],[p[0],-.5,p[1]],colors.bottom)}}
function vegetation(g){for(let i=0;i<95;i++){let r=.31+hash(i*7+1)*.58,a=hash(i*13+9)*2*PI;if(Math.abs(r-.55)<.05||Math.abs(r-.79)<.05)continue;let p=xy(r,a),y=levels[tier(r)]*hs,sz=.8+hash(i+31)*.55;box(g,p[0],y,p[1],.023*sz,.16*sz,.023*sz,colors.trunk,colors.trunk);cone(g,p[0],y+.10*sz,p[1],.085*sz,.26*sz,i%3?colors.leaf:colors.leaf2)}}
function buildings(g){[[.13,.3],[.42,1.6],[.67,3.3],[.87,4.8],[.40,5.7]].forEach(([r,a],i)=>{let p=xy(r,a),y=levels[tier(r)]*hs,x=p[0],z=p[1],roof=i%2?colors.roof2:colors.roof;box(g,x,y,z,.19,.17,.16,colors.wall,colors.wall);tri(g,[x-.12,y+.17,z-.10],[x+.12,y+.17,z-.10],[x,y+.29,z-.10],roof);tri(g,[x+.12,y+.17,z+.10],[x-.12,y+.17,z+.10],[x,y+.29,z+.10],roof);quad(g,[x-.12,y+.17,z-.10],[x,y+.29,z-.10],[x,y+.29,z+.10],[x-.12,y+.17,z+.10],roof);quad(g,[x,y+.29,z-.10],[x+.12,y+.17,z-.10],[x+.12,y+.17,z+.10],[x,y+.29,z+.10],roof);box(g,x,y+.01,z+.082,.045,.09,.006,colors.trunk,colors.trunk)})}
function upload(g){let o={count:g.p.length/3};for(let key of ['p','n','c']){o[key]=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,o[key]);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(g[key]),gl.STATIC_DRAW)}return o}
function rebuild(){for(let m of Object.values(groups))for(let key of ['p','n','c'])gl.deleteBuffer(m[key]);let a=make(),b=make(),c=make();terrain(a);vegetation(b);buildings(c);groups={terrain:upload(a),trees:upload(b),houses:upload(c)};$('status').textContent='WebGL ready · '+Math.round((a.p.length+b.p.length+c.p.length)/3).toLocaleString()+' vertices · depth tested'}
function multiply(a,b){let o=new Array(16).fill(0);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
function perspective(fov,aspect,near,far){let f=1/Math.tan(fov/2),q=1/(near-far);return[f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*q,-1,0,0,2*far*near*q,0]}
function lookAt(eye,target){let z=eye.map((x,i)=>x-target[i]),len=Math.hypot(...z);z=z.map(v=>v/len);let x=[z[2],0,-z[0]],xl=Math.hypot(...x);x=x.map(v=>v/xl);let y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x.reduce((s,v,i)=>s+v*eye[i],0),-y.reduce((s,v,i)=>s+v*eye[i],0),-z.reduce((s,v,i)=>s+v*eye[i],0),1]}
function renderMesh(m){for(let key of ['p','n','c']){gl.bindBuffer(gl.ARRAY_BUFFER,m[key]);gl.vertexAttribPointer(loc[key],3,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(loc[key])}gl.drawArrays(gl.TRIANGLES,0,m.count)}
function render(){let r=cv.getBoundingClientRect(),w=Math.max(1,Math.floor(r.width*Math.min(devicePixelRatio||1,2))),h=Math.max(1,Math.floor(r.height*Math.min(devicePixelRatio||1,2)));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let d=8/zoom,eye=[d*cos(pitch)*sin(yaw),d*sin(pitch)+.5,d*cos(pitch)*cos(yaw)],mvp=multiply(perspective(.75,w/h,.1,100),lookAt(eye,[0,.6,0]));gl.uniformMatrix4fv(loc.m,false,new Float32Array(mvp));renderMesh(groups.terrain);if(showTrees)renderMesh(groups.trees);if(showHouses)renderMesh(groups.houses)}
let pointers=new Map(),pinch=0;cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag=true;spin=false;$('spin').classList.remove('on')});cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)zoom=clamp(zoom*d/pinch,.6,2.2);pinch=d;$('zoom').value=zoom;$('zv').textContent=zoom.toFixed(1)+'×'}else{yaw-=(e.clientX-prev.x)*.009;pitch=clamp(pitch+(e.clientY-prev.y)*.007,-.2,1.5)}});function release(e){pointers.delete(e.pointerId);pinch=0;if(!pointers.size)drag=false}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);cv.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.001),.6,2.2);$('zoom').value=zoom;$('zv').textContent=zoom.toFixed(1)+'×'},{passive:false});
$('height').oninput=e=>{hs=+e.target.value;$('hv').textContent=hs.toFixed(1)+'×';rebuild()};$('zoom').oninput=e=>{zoom=+e.target.value;$('zv').textContent=zoom.toFixed(1)+'×'};$('reset').onclick=()=>{yaw=.75;pitch=.68;zoom=1;hs=1;$('height').value=1;$('zoom').value=1;$('hv').textContent='1.0×';$('zv').textContent='1.0×';rebuild()};$('spin').onclick=()=>{spin=!spin;$('spin').classList.toggle('on',spin)};$('trees').onclick=()=>{showTrees=!showTrees;$('trees').classList.toggle('on',showTrees)};$('houses').onclick=()=>{showHouses=!showHouses;$('houses').classList.toggle('on',showHouses)};$('top').onclick=()=>{pitch=1.49;spin=false;$('spin').classList.remove('on')};try{rebuild()}catch(e){$('status').textContent='Geometry failed: '+e.message;return}function loop(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;if(spin&&!drag)yaw+=dt*.16;render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
