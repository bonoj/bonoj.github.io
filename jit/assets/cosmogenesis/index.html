<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmogenesis · E1</title><style>body{margin:0;background:#080f17;color:#d7e0df;font:12px system-ui}main{max-width:900px;margin:auto}canvas{width:100%;height: min(65vh,600px);display:block;touch-action:none}header,.bar,.stats,#log{padding:12px}header{letter-spacing:3px}.bar,.stats{display:flex;gap:8px;flex-wrap:wrap}.stats>div{flex:1}small{display:block;color:#8fa4ac}b{font-size:17px}button{background:#23333e;color:#e4eeed;border:1px solid #40515a;border-radius:7px;padding:8px 12px}#log{color:#91b3a5}</style><main><header>COSMOGENESIS · E1 / LIVING MATTER</header><canvas></canvas><div class="stats"><div><small>ORBITAL</small><b id="orb"></b></div><div><small>SEQUESTERED</small><b id="res"></b></div><div><small>BIOMASS</small><b id="bio"></b></div><div><small>CONSERVATION</small><b id="mass"></b></div></div><div class="bar"><button id="pause">Pause</button><button id="speed">1×</button><button id="seed">+ Celestial matter</button><button id="reset">New world</button></div><div id="log">Drag to rotate. Tap a reliquary to inspect it.</div></main><script>
(()=>{
const c=document.querySelector('canvas'),g=c.getContext('2d'),el=id=>document.getElementById(id);
let bodies=[],vaults=[],nodes=[],edges=[],flux=[],initial=0,paused=false,speed=1,yaw=.3,pitch=.23,selected=-1,drag=null,seed=42;
const colors=['#e6b778','#81c9e8','#ba9ce9'],names=['Ferric','Volatile','Silicate'];
const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);
const sum=a=>a.reduce((x,y)=>x+y,0);
function add(n){for(let i=0;i<n;i++){let a=rand()*6.283,r=1.6+rand()*1.5,v=Math.sqrt(2/r)*(.57+rand()*.48),m=1+rand()*2;bodies.push({x:r*Math.cos(a),y:1.5+(rand()-.5)*.8,z:r*Math.sin(a),vx:-v*Math.sin(a),vy:(rand()-.5)*.3,vz:v*Math.cos(a),m,k:Math.floor(rand()*3)});initial+=m}}
function reset(){bodies=[];vaults=[];nodes=[];edges=[];flux=[];initial=0;selected=-1;for(let i=0;i<12;i++){let a=i*2.39996,r=.5+rand()*1.65;vaults.push({x:Math.cos(a)*r,y:-.1-rand()*.65,z:Math.sin(a)*r,stock:[0,0,0],received:0})}nodes.push({x:0,y:-2,z:0,m:0,k:0});add(85)}
reset();
function step(dt){
for(let i=bodies.length-1;i>=0;i--){let b=bodies[i],dy=b.y-1.5,r=Math.hypot(b.x,dy,b.z),a=-2/Math.pow(Math.max(.18,r),3);b.vx+=a*b.x*dt;b.vy+=a*dy*dt;b.vz+=a*b.z*dt;if(r<2.3){let d=Math.exp(-.16*dt);b.vx*=d;b.vy*=d;b.vz*=d}b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;if(r<.46){let v=vaults.reduce((p,q)=>Math.hypot(q.x-b.x*5,q.z-b.z*5)<Math.hypot(p.x-b.x*5,p.z-b.z*5)?q:p);v.stock[b.k]+=b.m;v.received+=b.m;flux.push({a:{x:b.x,y:b.y,z:b.z},b:v,t:0,k:b.k});bodies.splice(i,1)}}
for(let v of vaults){let stock=sum(v.stock);if(stock<.001)continue;let nearest=nodes[0],nd=dist(v,nearest);for(let n of nodes){let d=dist(v,n);if(d<nd){nearest=n;nd=d}}if(nd>.18&&nodes.length<1800&&rand()<dt*(.6+stock*.4)){let l=Math.min(.19,nd),k=v.stock.indexOf(Math.max(...v.stock)),cost=Math.min(v.stock[k],.09);v.stock[k]-=cost;let n={x:nearest.x+(v.x-nearest.x)*l/nd+(rand()-.5)*.10,y:nearest.y+(v.y-nearest.y)*l/nd+(rand()-.5)*.08,z:nearest.z+(v.z-nearest.z)*l/nd+(rand()-.5)*.10,m:cost,k};nodes.push(n);edges.push([nearest,n])}else if(nd<=.18){for(let k=0;k<3;k++){let q=Math.min(v.stock[k],dt*.09);v.stock[k]-=q;nearest.m+=q;nearest.k=k}}}
for(let f of flux)f.t+=dt*1.5;flux=flux.filter(f=>f.t<1)}
let W,H,S;
function project(p){let x=p.x*Math.cos(yaw)-p.z*Math.sin(yaw),z=p.x*Math.sin(yaw)+p.z*Math.cos(yaw),y=p.y*Math.cos(pitch)-z*Math.sin(pitch);z=p.y*Math.sin(pitch)+z*Math.cos(pitch);let k=8/Math.max(.2,8-z);return{x:W*.5+x*S*k,y:H*.49-y*S*k,z,k}}
function line(a,b,col,w=1){let p=project(a),q=project(b);g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke()}
function dot(p,r,col,glow=0){let q=project(p);g.fillStyle=col;g.shadowColor=typeof col==='string'?col:'transparent';g.shadowBlur=glow;g.beginPath();g.arc(q.x,q.y,Math.max(.5,r*q.k),0,6.283);g.fill();g.shadowBlur=0}
function ring(y,r,col){for(let i=0;i<64;i++){let a=i*6.283/64,b=(i+1)*6.283/64;line({x:r*Math.cos(a),y,z:r*Math.sin(a)},{x:r*Math.cos(b),y,z:r*Math.sin(b)},col)}}
function draw(){let rect=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);if(c.width!==Math.round(rect.width*dpr)||c.height!==Math.round(rect.height*dpr)){c.width=Math.round(rect.width*dpr);c.height=Math.round(rect.height*dpr)}g.setTransform(dpr,0,0,dpr,0,0);W=rect.width;H=rect.height;S=Math.min(W/7.3,H/6.5);g.fillStyle='#080f17';g.fillRect(0,0,W,H);for(let i=0;i<100;i++){g.fillStyle=i%7===0?'#80929e':'#263945';g.fillRect((i*137.39)%W,(i*83.71)%H,1,1)}for(let r of [1,1.7,2.4,3])ring(1.5,r,'#243641');let p=project({x:0,y:1.5,z:0}),gr=g.createRadialGradient(p.x-7,p.y-8,1,p.x,p.y,.45*S);gr.addColorStop(0,'#f4db9c');gr.addColorStop(.45,'#99845d');gr.addColorStop(1,'#293c43');dot({x:0,y:1.5,z:0},.45*S,gr);for(let b of bodies){line(b,{x:b.x-b.vx*.07,y:b.y-b.vy*.07,z:b.z-b.vz*.07},colors[b.k]+'55');dot(b,1.2+b.m*.5,colors[b.k],4)}for(let y of [.35,-.05,-.45,-.85,-1.25,-1.65,-2.05])ring(y,2.3,'#34473d55');for(let i=0;i<16;i++){let a=i*6.283/16;line({x:2.3*Math.cos(a),y:.35,z:2.3*Math.sin(a)},{x:2.3*Math.cos(a),y:-2.05,z:2.3*Math.sin(a)},'#34473d30')}for(let [a,b] of edges)line(a,b,colors[b.k]+'b0',1+Math.min(3,b.m*.7));for(let n of nodes)dot(n,1.3+Math.min(5,Math.sqrt(n.m)),n===nodes[0]?'#d8f4d2':'#a7d3b2');vaults.forEach((v,i)=>{let q=project(v),stock=sum(v.stock),r=(4+Math.sqrt(stock)*2)*q.k;g.strokeStyle=i===selected?'#fff':'#8e8269';g.fillStyle='#25332f';g.lineWidth=1.3;g.beginPath();for(let j=0;j<6;j++){let a=j*Math.PI/3;g.lineTo(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r)}g.closePath();g.fill();g.stroke();if(stock>.01)dot(v,Math.max(2,r*.55),colors[v.stock.indexOf(Math.max(...v.stock))],8)});for(let f of flux){line(f.a,f.b,colors[f.k]+'55');dot({x:f.a.x+(f.b.x-f.a.x)*f.t,y:f.a.y+(f.b.y-f.a.y)*f.t,z:f.a.z+(f.b.z-f.a.z)*f.t},3,colors[f.k],10)}g.font='10px system-ui';g.fillStyle='#8c9fa8';g.fillText('I   ORRERY',12,22);g.fillText('II   RELIQUARY',12,H*.49);g.fillText('III   MYCELIUM',12,H-18);let a=sum(bodies.map(b=>b.m)),b=sum(vaults.map(v=>sum(v.stock))),n=sum(nodes.map(v=>v.m));el('orb').textContent=a.toFixed(1);el('res').textContent=b.toFixed(1);el('bio').textContent=n.toFixed(1);el('mass').textContent=((a+b+n)/initial*100).toFixed(2)+'%';if(selected>=0){let v=vaults[selected];el('log').textContent='Reliquary '+(selected+1)+' · '+v.stock.map((x,i)=>names[i]+' '+x.toFixed(2)).join(' / ')+' · lifetime deposits '+v.received.toFixed(1)}}
function frame(){if(!paused)for(let i=0;i<speed*3;i++)step(.025);draw();requestAnimationFrame(frame)}frame();
el('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};el('speed').onclick=e=>{speed=speed===1?4:speed===4?12:1;e.target.textContent=speed+'×'};el('seed').onclick=()=>add(24);el('reset').onclick=()=>{seed=(seed+12345)>>>0;reset();el('log').textContent='A new celestial history begins.'};
c.onpointerdown=e=>{drag={x:e.offsetX,y:e.offsetY,m:0};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;let dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);yaw+=dx*.009;pitch=Math.max(-.65,Math.min(.65,pitch+dy*.006));drag.x=e.offsetX;drag.y=e.offsetY};c.onpointerup=e=>{if(drag&&drag.m<8){let best=25;vaults.forEach((v,i)=>{let q=project(v),d=Math.hypot(q.x-e.offsetX,q.y-e.offsetY);if(d<best){best=d;selected=i}})}drag=null};c.onpointercancel=()=>drag=null;
})();</script></html>
