<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e2c"><title>🧲 Pocket Magnetarium · JIT Assets</title><style>*{box-sizing:border-box}html,body{margin:0;background:#101923;color:#f6e8ca;font:14px system-ui}main{max-width:700px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}a{color:#d5c2f5}h1{font-size:21px;margin:0}.dish{height:min(53dvh,420px);min-height:260px;border:1px solid #5b647b;border-radius:17px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#273a4b,#151f31 68%,#10141f);touch-action:none}canvas{width:100%;height:100%;display:block}.stats{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:12px;color:#b8c4ce;margin:9px 2px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}button{background:#222d35;color:#f5e8c7;border:1px solid #53615b;border-radius:12px;min-height:43px;font:600 12px system-ui;touch-action:manipulation}button[aria-pressed=true]{background:#66512c;border-color:#e8bf5a}.extras{display:flex;gap:6px;margin-top:8px}.extras button{flex:1}.hint{text-align:center;color:#b6baa9;font-size:11px;margin:10px 0}</style></head><body><main><header><h1>🧲 Pocket Magnetarium</h1><a href="./">← Assets</a></header><div class="dish"><canvas></canvas></div><div class="stats"><span id="count">64 dipoles</span><span id="bonds">0 affinities</span><span id="status">🔗 Chain</span></div><div class="controls"></div><div class="extras"><button id="less">− 16</button><button id="more">+ 16</button><button id="gold">✨ Gold</button><button id="reset">↻ Reset</button></div><p class="hint">Tap or drag to steer the field · Bonds strengthen with proximity · No libraries or network</p></main><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),dish=document.querySelector('.dish'),controls=document.querySelector('.controls');const modes=[['attract','🧲 Attract'],['repel','💥 Repel'],['vortex','🌀 Vortex'],['sever','✂️ Sever'],['chain','🔗 Chain'],['lattice','🕸️ Lattice'],['pulse','⚡ Pulse'],['freeze','🧊 Freeze'],['melt','🔥 Melt'],['orbit','🪐 Orbit'],['divide','🧬 Divide'],['crown','👑 Crown']];let W=350,H=340,t=0,mode='chain',parts=[],links=new Map(),pointer={x:175,y:170,down:false},gold=-1,last=0;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function resize(){const r=dish.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);if(!t){pointer.x=W/2;pointer.y=H/2}}function add(){const id=parts.length;parts.push({id,x:rand(25,W-25),y:rand(25,H-25),vx:rand(-1,1),vy:rand(-1,1),angle:rand(0,Math.PI*2),spin:rand(-.02,.02),gold:false,r:5.5,heat:0})}function select(m){mode=m;for(const b of controls.children)b.setAttribute('aria-pressed',String(b.dataset.mode===m));document.querySelector('#status').textContent=modes.find(a=>a[0]===m)[1];if(m==='pulse')for(const p of parts){let dx=p.x-pointer.x,dy=p.y-pointer.y,d=Math.hypot(dx,dy)||1;p.vx+=dx/d*rand(3,6);p.vy+=dy/d*rand(3,6)}if(m==='sever'||m==='melt')links.clear();if(m==='melt')for(const p of parts)p.heat=140;if(m==='divide'){const n=Math.min(24,128-parts.length);for(let i=0;i<n;i++)add()}}for(const [m,label] of modes){const b=document.createElement('button');b.dataset.mode=m;b.textContent=label;b.onclick=()=>select(m);controls.append(b)}function reset(){t=0;parts=[];links.clear();gold=-1;for(let i=0;i<64;i++)add();select('chain')}document.querySelector('#more').onclick=()=>{for(let i=0;i<16&&parts.length<128;i++)add()};document.querySelector('#less').onclick=()=>{parts.splice(Math.max(8,parts.length-16));links.clear();if(gold>=parts.length)gold=-1};document.querySelector('#gold').onclick=()=>{if(gold>=0&&parts[gold])parts[gold].gold=false;gold=Math.floor(rand(0,parts.length));parts[gold].gold=true;parts[gold].x=pointer.x;parts[gold].y=pointer.y};document.querySelector('#reset').onclick=reset;function point(e){const r=canvas.getBoundingClientRect();pointer.x=clamp(e.clientX-r.left,5,W-5);pointer.y=clamp(e.clientY-r.top,5,H-5)}canvas.onpointerdown=e=>{pointer.down=true;canvas.setPointerCapture(e.pointerId);point(e)};canvas.onpointermove=e=>{if(pointer.down)point(e)};canvas.onpointerup=canvas.onpointercancel=()=>pointer.down=false;
function update(){t++;const n=parts.length,ax=new Float32Array(n),ay=new Float32Array(n);for(let i=0;i<n;i++){const p=parts[i];for(let j=i+1;j<n;j++){const q=parts[j],dx=q.x-p.x,dy=q.y-p.y,d2=dx*dx+dy*dy+16,d=Math.sqrt(d2);if(d>100)continue;const nx=dx/d,ny=dy/d,key=i+','+j;let affinity=links.get(key)||0;const near=d<24&&p.heat===0&&q.heat===0;if(near&&mode!=='repel'&&mode!=='melt'&&mode!=='sever')affinity=Math.min(1,affinity+.0018);else affinity=Math.max(0,affinity-.00018);if(affinity>.03)links.set(key,affinity);else links.delete(key);let force=0;if(mode==='repel')force=-Math.min(.12,90/d2);else if(mode==='lattice')force=clamp((d-31)*.005,-.09,.09);else if(mode==='melt')force=-Math.min(.045,25/d2);else{const target=affinity>.3?19:27;force=clamp((d-target)*(.0009+affinity*.005),-.08,.09);if(d<11)force-=.12}if(mode==='sever')force=-.035;if(p.gold||q.gold)force*=2.5;ax[i]+=nx*force;ay[i]+=ny*force;ax[j]-=nx*force;ay[j]-=ny*force}}
for(let i=0;i<n;i++){const p=parts[i],dx=pointer.x-p.x,dy=pointer.y-p.y,d=Math.hypot(dx,dy)||1;if(mode==='attract'||mode==='crown'){ax[i]+=dx/d*(pointer.down?.36:.065);ay[i]+=dy/d*(pointer.down?.36:.065)}if(mode==='repel'&&pointer.down){ax[i]-=dx/d*.55;ay[i]-=dy/d*.55}if(mode==='vortex'||mode==='orbit'){let s=mode==='orbit'?.11:.22;ax[i]+=-dy/d*s+dx/d*(d-85)*.002;ay[i]+=dx/d*s+dy/d*(d-85)*.002}if(mode==='sever'&&pointer.down&&d<55){ax[i]-=dx/d*.5;ay[i]-=dy/d*.5}if(mode==='lattice'&&pointer.down||mode==='chain'&&pointer.down){ax[i]+=dx/d*.07;ay[i]+=dy/d*.07}if(mode==='pulse'&&pointer.down){ax[i]-=dx/d*.22;ay[i]-=dy/d*.22}if(mode==='crown'&&gold>=0&&parts[gold]&&i!==gold){const q=parts[gold],sx=q.x-p.x,sy=q.y-p.y,sd=Math.hypot(sx,sy)||1;ax[i]+=sx/sd*.13;ay[i]+=sy/sd*.13}if(mode==='melt'){ax[i]+=Math.sin(t*.14+i*7)*.12;ay[i]+=Math.cos(t*.16+i*9)*.12}if(p.heat>0)p.heat--;if(mode!=='freeze'){p.vx=(p.vx+ax[i])*.982;p.vy=(p.vy+ay[i])*.982;let speed=Math.hypot(p.vx,p.vy);if(speed>4){p.vx*=4/speed;p.vy*=4/speed}p.x+=p.vx;p.y+=p.vy;p.angle+=p.spin+(p.vx+p.vy)*.008;if(p.x<9||p.x>W-9){p.vx*=-.85;p.x=clamp(p.x,9,W-9)}if(p.y<9||p.y>H-9){p.vy*=-.85;p.y=clamp(p.y,9,H-9)}}}}
function draw(){ctx.clearRect(0,0,W,H);ctx.strokeStyle='rgba(150,180,210,.055)';ctx.lineWidth=1;for(let x=0;x<W;x+=25){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const [key,v] of links){if(v<.12)continue;const [i,j]=key.split(',').map(Number),p=parts[i],q=parts[j];if(!p||!q)continue;ctx.strokeStyle='rgba(247,206,108,'+(v*.45)+')';ctx.lineWidth=.5+v*2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}for(const p of parts){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);if(p.gold){ctx.shadowColor='#ffdc68';ctx.shadowBlur=18}ctx.fillStyle=p.gold?'#f9ce57':'#eb7775';ctx.beginPath();ctx.roundRect(-p.r,-3,p.r,6,[3,0,0,3]);ctx.fill();ctx.fillStyle=p.gold?'#fff1a3':'#81c5e9';ctx.beginPath();ctx.roundRect(0,-3,p.r,6,[0,3,3,0]);ctx.fill();ctx.fillStyle='#e9efff';ctx.beginPath();ctx.arc(0,0,1,0,7);ctx.fill();ctx.restore()}ctx.strokeStyle='rgba(255,228,136,.55)';ctx.setLineDash([3,5]);ctx.beginPath();ctx.arc(pointer.x,pointer.y,12+Math.sin(t*.05)*2,0,7);ctx.stroke();ctx.setLineDash([]);document.querySelector('#count').textContent=parts.length+' dipoles';document.querySelector('#bonds').textContent=links.size+' affinities'}function frame(ms){requestAnimationFrame(frame);if(document.hidden||ms-last<16)return;last=ms;update();draw()}resize();reset();if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(dish);requestAnimationFrame(frame)})();
</script></body></html>
