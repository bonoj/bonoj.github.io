<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakwater II · Open Water</title><style>body{margin:0;background:#071923;color:#e4f3ee;font:13px monospace}main{max-width:960px;margin:auto;padding:14px}canvas{width:100%;height:65vh;min-height:350px;display:block;touch-action:none;border-radius:10px}section{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}label{display:flex;flex-direction:column;gap:6px}input{width:100%}button{padding:10px;background:#21434c;border:1px solid #608a92;color:inherit;border-radius:6px;margin-right:6px}</style><main><h2>Breakwater II · Open Water</h2><p>GPU Gerstner swell study · orbit by dragging · pinch to zoom · island is visual only, not a physical boundary</p><canvas id="c"></canvas><section><label>Swell<input id="s" type="range" min="10" max="100" value="68"></label><label>Steepness<input id="q" type="range" min="10" max="100" value="72"></label><label>Wind<input id="w" type="range" min="0" max="100" value="40"></label><label>Foam<input id="f" type="range" min="0" max="100" value="65"></label></section><button id="pause">Pause</button><button id="camera">Sea-level camera</button><button id="rock">Hide island</button><p id="status"></p></main><script>
(()=>{let c=document.querySelector('#c'),gl=c.getContext('webgl2',{antialias:true,alpha:false,depth:true}),status=document.querySelector('#status');if(!gl){status.textContent='WebGL2 unavailable';return}let vs=`#version 300 es
precision highp float;layout(location=0)in vec3 p;layout(location=1)in float kind;uniform mat4 vp;uniform float t,s,q,w;out vec3 pos;out float water,crest,shore;const float PI=3.14159265;
vec3 wave(vec2 p,vec2 d,float len,float a,float speed,float phase,float steep){float k=2.*PI/len;float ph=k*dot(d,p)-t*speed+phase;return vec3(d.x*steep*a*cos(ph),a*sin(ph),d.y*steep*a*cos(ph));}
void main(){vec2 x=p.xz;water=1.-kind;shore=clamp(1.-abs(length(x)-2.55)/1.7,0.,1.);vec3 v=p;crest=0.;if(kind<.5){vec3 a=wave(x,normalize(vec2(.86,.5)),13.5,s*.68,1.15,0.,q*.85)+wave(x,normalize(vec2(.98,-.2)),8.2,s*.31,1.58,1.2,q*.76)+wave(x,normalize(vec2(.62,.78)),5.,s*.16,2.1,2.5,q*.66)+wave(x,normalize(vec2(-.1,1.)),2.4,s*.07*w,3.1,1.4,q*.55)+wave(x,normalize(vec2(.7,-.7)),1.3,s*.045*w,4.2,3.1,q*.4);float near=exp(-pow((length(x)-2.7)/1.2,2.));a.y+=near*.24*s*sin(length(x)*4.4-t*2.6+sin(atan(x.y,x.x)*8.)*.18);v+=a;crest=clamp((a.y/max(s,.01)-.3)*.5+near*.28+length(a.xz)*.12,0.,1.);}else{float ang=atan(x.y,x.x),rad=2.35+.28*sin(ang*7.+1.)+.17*sin(ang*13.-1.5)+.09*sin(ang*23.);float r=length(x*vec2(.95,1.12)),body=clamp((rad-r)/.75,0.,1.);v.y=-.28+body*(.55+1.65*clamp((rad-r)/2.5,0.,1.)+.22*sin(x.x*3.2)*sin(x.y*4.1));}pos=v;gl_Position=vp*vec4(v,1.);}`;let fs=`#version 300 es
precision highp float;in vec3 pos;in float water,crest,shore;uniform vec3 eye;uniform float t,f;out vec4 color;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),v=fract(p);v=v*v*(3.-2.*v);return mix(mix(hash(i),hash(i+vec2(1,0)),v.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),v.x),v.y);}void main(){vec3 n=normalize(cross(dFdx(pos),dFdy(pos)));if(n.y<0.)n=-n;vec3 light=normalize(vec3(-.45,.83,.28)),view=normalize(eye-pos);float diffuse=clamp(dot(n,light),0.,1.);if(water>.5){float steep=clamp(crest*.7+pow(1.-n.y,1.4)*.5,0.,1.);float lum=clamp(.24+.6*diffuse+.25*steep,0.,1.);vec3 sea=mix(vec3(.008,.07,.105),vec3(.025,.33,.39),lum);sea=mix(sea,vec3(.12,.48,.48),steep*.4);float fres=pow(1.-clamp(dot(n,view),0.,1.),4.);sea=mix(sea,vec3(.38,.61,.65),fres*.7);float spec=pow(max(dot(n,normalize(light+view)),0.),110.);sea+=vec3(.9,.85,.65)*spec*1.6;float shorefoam=shore*pow(clamp(.5+.5*sin(length(pos.xz)*5.-t*2.6+noise(pos.xz*2.)*2.),0.,1.),5.);float fold=pow(clamp((steep-.34)*2.8,0.,1.),2.);float foam=clamp((fold*.72+shorefoam*.72)*f,0.,1.);foam*=.65+.35*noise(pos.xz*8.+vec2(t*.22));sea=mix(sea,vec3(.77,.91,.84),foam);color=vec4(pow(sea,vec3(.86)),1.);}else{float detail=noise(pos.xz*2.6)*.5+noise(pos.xz*8.)*.13;float lit=clamp(dot(n,light)*.7+.35,0.,1.);vec3 rock=mix(vec3(.105,.13,.125),vec3(.32,.33,.29),lit+detail*.25);rock=mix(rock,vec3(.035,.085,.09),(1.-smoothstep(0.,.55,pos.y))*.65);color=vec4(rock,1.);}}`;
function sh(type,src){let a=gl.createShader(type);gl.shaderSource(a,src);gl.compileShader(a);if(!gl.getShaderParameter(a,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(a));return a}let program;try{program=gl.createProgram();gl.attachShader(program,sh(gl.VERTEX_SHADER,vs));gl.attachShader(program,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program))}catch(e){status.textContent=e.message;return}gl.useProgram(program);let vertices=[],indices=[];function grid(n,size,kind){let base=vertices.length/4;for(let z=0;z<=n;z++)for(let x=0;x<=n;x++)vertices.push((x/n-.5)*size,0,(z/n-.5)*size,kind);for(let z=0;z<n;z++)for(let x=0;x<n;x++){let a=base+z*(n+1)+x,b=a+1,d=a+n+1;indices.push(a,d,b,b,d,d+1)}}grid(168,32,0);let waterCount=indices.length;grid(58,6.8,1);let vao=gl.createVertexArray();gl.bindVertexArray(vao);let vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,16,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,1,gl.FLOAT,false,16,12);let ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(indices),gl.STATIC_DRAW);let loc=n=>gl.getUniformLocation(program,n),u={vp:loc('vp'),t:loc('t'),s:loc('s'),q:loc('q'),w:loc('w'),f:loc('f'),eye:loc('eye')};function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function norm(a){let l=Math.hypot(...a)||1;return a.map(v=>v/l)}function mul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}function projection(aspect){let f=1/Math.tan(.82/2),m=new Float32Array(16);m[0]=f/aspect;m[5]=f;m[10]=-1.002;m[11]=-1;m[14]=-.2002;return m}function view(eye){let z=norm(eye.map(v=>v)),x=norm(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x.reduce((a,v,i)=>a+v*eye[i],0),-y.reduce((a,v,i)=>a+v*eye[i],0),-z.reduce((a,v,i)=>a+v*eye[i],0),1])}let angle=.52,elevation=.52,distance=17,paused=false,showRock=true,low=false,t=0,last=0,points=new Map();c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY])};c.onpointermove=e=>{if(!points.has(e.pointerId))return;let old=points.get(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size===1){angle+=(e.clientX-old[0])*.006;elevation=Math.max(.08,Math.min(1.35,elevation+(e.clientY-old[1])*.004))}else{let ps=[...points.values()],d=Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]);if(c._pinch)distance=Math.max(5,Math.min(35,distance*c._pinch/d));c._pinch=d}};c.onpointerup=c.onpointercancel=e=>{points.delete(e.pointerId);c._pinch=0};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};document.querySelector('#camera').onclick=e=>{low=!low;elevation=low?.13:.52;distance=low?13:17;e.target.textContent=low?'Elevated camera':'Sea-level camera'};document.querySelector('#rock').onclick=e=>{showRock=!showRock;e.target.textContent=showRock?'Hide island':'Show island'};gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);let frames=0;function frame(now){let d=Math.min(devicePixelRatio||1,1.5),w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;gl.viewport(0,0,w,h)}if(!paused)t+=Math.min(.04,(now-last)/1000||.016);last=now;let eye=[Math.sin(angle)*Math.cos(elevation)*distance,Math.sin(elevation)*distance*.75+1.5,Math.cos(angle)*Math.cos(elevation)*distance];gl.clearColor(.46,.66,.7,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(u.vp,false,mul(projection(w/h),view(eye)));gl.uniform3fv(u.eye,eye);gl.uniform1f(u.t,t);gl.uniform1f(u.s,+document.querySelector('#s').value/100*1.3);gl.uniform1f(u.q,+document.querySelector('#q').value/100*1.45);gl.uniform1f(u.w,+document.querySelector('#w').value/100);gl.uniform1f(u.f,+document.querySelector('#f').value/100);gl.bindVertexArray(vao);gl.drawElements(gl.TRIANGLES,waterCount,gl.UNSIGNED_INT,0);if(showRock)gl.drawElements(gl.TRIANGLES,indices.length-waterCount,gl.UNSIGNED_INT,waterCount*4);if(++frames%60===0)status.textContent='WebGL2 · '+(vertices.length/4).toLocaleString()+' vertices · 5 wave bands · '+(paused?'paused':'evolving');requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></html>
