<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030408"><title>Last Light · Redshift Observatory</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030408;color:#e4d9d0;font-family:system-ui,sans-serif}main{max-width:740px;height:100dvh;min-height:530px;margin:auto;display:flex;flex-direction:column;padding:16px 18px 18px;gap:14px}header,.line,.stats{display:flex;justify-content:space-between;align-items:center;gap:12px}header{font:10px ui-monospace,monospace;letter-spacing:.16em;color:#a7a0a4}a{color:inherit;text-decoration:none}#stage{position:relative;flex:1;min-height:180px;overflow:hidden;border:1px solid #181820;border-radius:12px}canvas{width:100%;height:100%;display:block}#poem{position:absolute;bottom:20px;left:20px;right:20px;text-align:center;font:italic 14px Georgia,serif;color:#b7a8a3;pointer-events:none}.controls{display:grid;gap:13px}.line{font:11px ui-monospace,monospace;letter-spacing:.09em;color:#9d9498}.line output{color:#e4d9d0;letter-spacing:0}input[type=range]{width:100%;accent-color:#b87473;touch-action:pan-x}.stats{border-top:1px solid #27242b;padding-top:12px}.stats>div{flex:1;min-width:0}.stats small{display:block;color:#9d9498;font:9px ui-monospace,monospace;letter-spacing:.07em;margin-bottom:5px}.stats strong{font-size:clamp(12px,3vw,18px);font-weight:450;white-space:nowrap}footer{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#aca1a3}button{background:transparent;border:1px solid #4b4148;border-radius:9px;padding:9px 12px;color:#e4d9d0;cursor:pointer}label{display:flex;gap:8px;align-items:center}input[type=checkbox]{accent-color:#ad716f}@media(max-height:650px){main{gap:8px;padding:9px 13px}.controls{gap:5px}#poem{bottom:10px}}
</style></head><body><main><header><span>THE LAST LIGHT OF EARTH</span><a href="./">← ASSETS</a></header>
<section id="stage"><canvas id="sky" aria-label="A distant Earth fading and reddening among stars"></canvas><div id="poem">We are still close enough to remember blue.</div></section>
<section class="controls"><div class="line"><label for="distance">DISTANCE FROM EARTH</label><output id="distanceLabel">Departure</output></div><input id="distance" type="range" min="0" max="50" step=".1" value="0"><div class="line"><label for="speed">RECEDING VELOCITY</label><output id="speedLabel">80.0% c</output></div><input id="speed" type="range" min="0" max=".999" step=".001" value=".8">
<div class="stats"><div><small>REDSHIFT</small><strong id="z">z = 2.00</strong></div><div><small>550 NM BECOMES</small><strong id="lambda">1650 nm</strong></div><div><small>SPECTRUM</small><strong id="region">INFRARED</strong></div></div>
<footer><label><input id="look" type="checkbox" checked>Look back at Earth</label><button id="reset">↺ Return</button></footer></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('sky'),ctx=canvas.getContext('2d'),stage=$('stage');const stars=Array.from({length:190},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.2+.2,a:Math.random()*.5+.15}));let tick=0;function frame(){const d=+$('distance').value,b=+$('speed').value,show=$('look').checked;const factor=Math.sqrt((1+b)/(1-b)),z=factor-1,lambda=550*factor;$('distanceLabel').textContent=d===0?'Departure':d.toFixed(1)+' million ly';$('speedLabel').textContent=(b*100).toFixed(1)+'% c';$('z').textContent='z = '+z.toFixed(2);$('lambda').textContent=lambda<1000?lambda.toFixed(0)+' nm':lambda<1e6?(lambda/1000).toFixed(2)+' µm':(lambda/1e6).toFixed(2)+' mm';$('region').textContent=lambda<700?'VISIBLE':lambda<1e6?'INFRARED':lambda<1e9?'MICROWAVE':'RADIO';$('poem').textContent=!show?'We turn away. The light continues without us.':d<1?'We are still close enough to remember blue.':d<5?'Every photon is a message from an earlier Earth.':d<15?'The cities have vanished into a single trembling ember.':d<35?'Even the Sun is only an old rumor of warmth.':'The universe keeps the light. It does not keep the names.';
const w=stage.clientWidth,h=stage.clientHeight,r=Math.min(2,devicePixelRatio||1);if(canvas.width!==Math.round(w*r)||canvas.height!==Math.round(h*r)){canvas.width=Math.round(w*r);canvas.height=Math.round(h*r)}ctx.setTransform(r,0,0,r,0,0);ctx.fillStyle='#030408';ctx.fillRect(0,0,w,h);tick+=.008;for(const s of stars){ctx.globalAlpha=s.a*(.85+.15*Math.sin(tick*1.5+s.x*20));ctx.fillStyle='#d7dbe5';ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(show){const apparent=Math.max(.1,Math.min(1,1/(1+z*.7))),rad=Math.max(1.6,56/(1+d*.55)*Math.pow(apparent,.65)),x=w*.5,y=h*.47,col=z<.22?'#8bbdf6':z<1?'#e8ad86':z<3?'#bc4c40':'#64252c';const glow=ctx.createRadialGradient(x,y,0,x,y,Math.max(rad*7,25));glow.addColorStop(0,col);glow.addColorStop(.18,col+'80');glow.addColorStop(.45,col+'18');glow.addColorStop(1,'#00000000');ctx.globalAlpha=Math.max(.12,1/(1+d*.12));ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,Math.max(rad*7,25),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;const g=ctx.createRadialGradient(x-rad*.35,y-rad*.3,0,x,y,rad);g.addColorStop(0,z<.22?'#c4e5f4':z<1?'#f1c9a5':'#d07461');g.addColorStop(.6,col);g.addColorStop(1,'#09080d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();if(rad>8){ctx.save();ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.clip();ctx.globalAlpha=.35;ctx.fillStyle=z<.22?'#395b6e':'#5b2729';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(x+Math.sin(i*4.3+tick*.15)*rad*.65,y+Math.cos(i*3.1)*rad*.5,rad*.32,rad*.15,i,0,Math.PI*2);ctx.fill()}ctx.restore()}}requestAnimationFrame(frame)}$('reset').addEventListener('click',()=>{$('distance').value=0;$('speed').value=.8;$('look').checked=true});frame()})();
</script></body></html>
