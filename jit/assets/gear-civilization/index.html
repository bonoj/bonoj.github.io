<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Great Turning · Gear Civilization</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e5dfd1;font:14px system-ui}main{max-width:960px;margin:auto;padding:12px}h1{font-size:19px;margin:5px 0 10px}.view{height:min(75dvh,690px);min-height:390px;position:relative;border-radius:12px;overflow:hidden;background:#111a24;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;top:12px;left:12px;pointer-events:none;text-shadow:0 2px 5px #000}.overlay small{display:block;color:#b8c5c7;margin-top:5px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{background:#283845;color:#e5dfd1;border:1px solid #647483;border-radius:9px;padding:10px 13px}.status{color:#a9b6bc;font-size:12px;display:flex;gap:16px;flex-wrap:wrap}</style></head><body><main><h1>⚙ The Great Turning</h1><div class="view" id="view"><canvas id="scene"></canvas><div class="overlay"><strong id="era">I · THE SETTLEMENT</strong><small id="caption">A civilization on borrowed ground</small></div></div><div class="controls"><button id="turn">⚙ Awaken the gear</button><button id="build">🏘 Build</button><button id="reset">↺ Rebuild</button><button id="pause">⏸ Pause</button></div><div class="status"><span id="population"></span><span id="buildings"></span><span id="rotation"></span><span>Drag to orbit · Pinch to zoom</span></div></main><script type="module">
const $=s=>document.querySelector(s),canvas=$('#scene'),view=$('#view');let T;try{T=await import('https://esm.sh/three@0.170.0')}catch(e){$('#caption').textContent='Three.js unavailable: '+e.message;throw e}let renderer;try{renderer=new T.WebGLRenderer({canvas,antialias:true})}catch(e){$('#caption').textContent='WebGL unavailable';throw e}renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(view.clientWidth,view.clientHeight,false);renderer.setClearColor(0x111a24);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;const scene=new T.Scene();scene.background=new T.Color(0x111a24);scene.fog=new T.FogExp2(0x111a24,.011);const camera=new T.PerspectiveCamera(46,view.clientWidth/view.clientHeight,.1,600);scene.add(new T.HemisphereLight(0xb9d4ef,0x332b24,2.2));const light=new T.DirectionalLight(0xffdfb1,3.5);light.position.set(-60,90,90);scene.add(light);const mat=(c,m=0)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:.65,side:T.DoubleSide}),steel=mat(0x596875,.8),edge=mat(0x9caab0,.7),dark=mat(0x26323b,.7),stone=[mat(0xa79b85),mat(0xb5aa93),mat(0x817f7b)],roof=[mat(0x7e4944),mat(0x506b6b),mat(0x8b7255)],skin=mat(0xe4c6a0),cloth=[mat(0x83b8a0),mat(0xc8a074),mat(0xabb4da)],wood=mat(0x715541),glow=new T.MeshStandardMaterial({color:0xffd58c,emissive:0xe2a34d,emissiveIntensity:1.6});const box=(w,h,d,m)=>new T.Mesh(new T.BoxGeometry(w,h,d),m),R=45,gear=new T.Group();scene.add(gear);const shape=new T.Shape(),N=112;for(let i=0;i<N;i++){let a=i*Math.PI*2/N,r=(i%4===1||i%4===2)?R+5:R;if(!i)shape.moveTo(Math.cos(a)*r,Math.sin(a)*r);else shape.lineTo(Math.cos(a)*r,Math.sin(a)*r)}shape.closePath();const hole=new T.Path();hole.absarc(0,0,12,0,Math.PI*2,true);shape.holes.push(hole);const geometry=new T.ExtrudeGeometry(shape,{depth:11,bevelEnabled:true,bevelSegments:1,steps:1,bevelSize:.7,bevelThickness:.7});geometry.translate(0,0,-5.5);gear.add(new T.Mesh(geometry,steel));for(let i=0;i<12;i++){let a=i*Math.PI/6,s=box(27,3.5,12,edge);s.position.set(Math.cos(a)*25,Math.sin(a)*25,0);s.rotation.z=a;gear.add(s)}let axle=new T.Mesh(new T.CylinderGeometry(11,11,29,40),dark);axle.rotation.x=Math.PI/2;gear.add(axle);let hub=new T.Mesh(new T.TorusGeometry(13,1.4,8,48),edge);hub.position.z=6.5;gear.add(hub);const rand=(a,b)=>a+Math.random()*(b-a);let homes=[],folk=[],angle=0,omega=0,awake=false,paused=false,age=0;function house(a){let holder=new T.Group(),h=rand(4,9),w=rand(3.3,5.5),base=box(w,h,3.6,stone[Math.floor(rand(0,3))]);base.position.y=h/2;holder.add(base);let top=new T.Mesh(new T.ConeGeometry(w*.83,3.2,4),roof[Math.floor(rand(0,3))]);top.rotation.y=Math.PI/4;top.position.y=h+1.4;holder.add(top);let door=box(.9,1.7,.12,wood);door.position.set(0,.85,1.86);holder.add(door);let window=box(.85,.9,.14,glow);window.position.set(-w*.25,h*.64,1.86);holder.add(window);holder.position.set(Math.cos(a)*50,Math.sin(a)*50,rand(-3.5,3.5));holder.rotation.z=a-Math.PI/2;gear.add(holder);homes.push({holder,a,fall:false,vel:new T.Vector3(),spin:new T.Vector3(rand(-2,2),rand(-2,2),rand(-2,2))})}function person(a){let holder=new T.Group(),body=box(.65,1.45,.55,cloth[Math.floor(rand(0,3))]);body.position.y=1.2;holder.add(body);let head=new T.Mesh(new T.SphereGeometry(.48,8,6),skin);head.position.y=2.3;holder.add(head);for(let s of [-1,1]){let leg=box(.25,.85,.3,wood);leg.position.set(s*.2,.38,0);holder.add(leg)}holder.position.set(Math.cos(a)*50.8,Math.sin(a)*50.8,rand(-4,4));holder.rotation.z=a-Math.PI/2;gear.add(holder);folk.push({holder,a,fall:false,vel:new T.Vector3(),spin:new T.Vector3(rand(-4,4),rand(-4,4),rand(-4,4))})}function detach(item){if(item.fall)return;let h=item.holder;h.updateMatrixWorld(true);let pos=new T.Vector3(),quat=new T.Quaternion(),scale=new T.Vector3();h.matrixWorld.decompose(pos,quat,scale);gear.remove(h);scene.add(h);h.position.copy(pos);h.quaternion.copy(quat);item.fall=true;item.vel.set(-omega*pos.y,omega*pos.x,rand(-2,2));item.vel.add(new T.Vector3(rand(-4,4),rand(0,3),rand(-4,4)))}function build(nh=2,np=7){for(let i=0;i<nh;i++)house(rand(.25,Math.PI-.25));for(let i=0;i<np;i++)person(rand(.18,Math.PI-.18))}function clear(){for(let item of [...homes,...folk])item.holder.parent?.remove(item.holder);homes=[];folk=[];angle=omega=age=0;awake=false;gear.rotation.z=0;build(9,27);$('#turn').textContent='⚙ Awaken the gear'}function update(dt){if(paused)return;age+=dt;if(!awake&&age<22&&Math.random()<dt*.7&&homes.length<19)house(rand(.25,Math.PI-.25));if(!awake&&Math.random()<dt*2&&folk.length<55)person(rand(.18,Math.PI-.18));if(awake){omega=Math.min(1.1,omega+dt*.10);angle+=omega*dt;gear.rotation.z=angle}for(let item of [...homes,...folk]){if(!item.fall){if(awake){let a=item.a+angle,threshold=omega>.35?-.12:.25;if(Math.cos(a)<threshold||omega>.94)if(Math.random()<dt*(omega>.94?5:1.6))detach(item)}}else{item.vel.y-=25*dt;item.holder.position.addScaledVector(item.vel,dt);item.holder.rotation.x+=item.spin.x*dt;item.holder.rotation.y+=item.spin.y*dt;item.holder.rotation.z+=item.spin.z*dt;if(item.holder.position.y < -180){scene.remove(item.holder);item.gone=true}}}homes=homes.filter(x=>!x.gone);folk=folk.filter(x=>!x.gone);$('#population').textContent='Standing: '+folk.filter(x=>!x.fall).length+' / '+folk.length;$('#buildings').textContent='Buildings: '+homes.filter(x=>!x.fall).length;$('#rotation').textContent='Rotation '+Math.round(angle*180/Math.PI)+'°';$('#era').textContent=awake?'II · THE GREAT TURNING':'I · THE SETTLEMENT';$('#caption').textContent=awake?'Gravity has not changed. Their world has.':'They believe the ground is permanent'}let yaw=.48,pitch=.18,dist=157;function placeCamera(){camera.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);camera.lookAt(0,0,0)}placeCamera();const pointers=new Map();let pinch=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){yaw-=(e.clientX-prev.x)*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-prev.y)*.008))}else if(pointers.size===2){let pts=[...pointers.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(pinch!==null)dist=Math.max(85,Math.min(290,dist*pinch/d));pinch=d}placeCamera()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>{pointers.delete(e.pointerId);pinch=null});canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(85,Math.min(290,dist*Math.exp(e.deltaY*.001)));placeCamera()},{passive:false});$('#turn').onclick=()=>{awake=true;$('#turn').textContent='⚙ Turning'};$('#build').onclick=()=>{if(awake)clear();else build(3,10)};$('#reset').onclick=clear;$('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ Resume':'⏸ Pause'};new ResizeObserver(()=>{let w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}).observe(view);clear();let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
