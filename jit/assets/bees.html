<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e2c"><title>🐝 Pocket Apiary · JIT Assets</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#101923;color:#fff1cb;font:14px system-ui,sans-serif}main{max-width:700px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}a{color:#d5c2f5}h1{font-size:21px;margin:0}.field{height:min(53dvh,420px);min-height:260px;position:relative;border:1px solid #5c7864;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#344d35,#1a352e 55%,#101e2c);touch-action:none}canvas{display:block;width:100%;height:100%}.stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:#e5d5a7;font-size:12px;margin:9px 2px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}button{background:#222d35;color:#f5e8c7;border:1px solid #53615b;border-radius:12px;min-height:43px;font:600 12px system-ui;touch-action:manipulation}button[aria-pressed=true]{background:#66512c;border-color:#e8bf5a}.extras{display:flex;gap:6px;margin-top:8px}.extras button{flex:1}.hint{text-align:center;color:#b6baa9;font-size:11px;margin:10px 0}</style></head><body><main><header><h1>🐝 Pocket Apiary</h1><a href="./">← Assets</a></header><div class="field"><canvas id="field"></canvas></div><div class="stats"><span id="count">🐝 72 bees</span><span id="nectar">🍯 0 nectar</span><span id="mode">🌼 Foraging</span></div><div class="grid" id="controls"></div><div class="extras"><button id="less">− 🐝</button><button id="more">+ 🐝</button><button id="bloom">🌸 Bloom</button><button id="reset">↻ Reset</button></div><p class="hint">Tap or drag the meadow to direct the swarm. No network or libraries.</p></main><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d'),field=document.querySelector('.field'),controls=document.querySelector('#controls');let W=360,H=330,t=0,mode='forage',honey=0,bees=[],flowers=[],last=0,target={x:180,y:150};const hive={x:180,y:280},names={forage:'🌼 Forage',orbit:'🌀 Orbit',heart:'💛 Heart',spiral:'🐚 Spiral',queen:'👑 Queen',dance:'💃 Dance',storm:'⚡ Chaos',hive:'🏠 Home',snake:'🐍 Snake',stars:'✨ Stars',freeze:'🧊 Freeze',scatter:'💥 Scatter'};const rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function resize(){const r=field.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(2,devicePixelRatio||1);c.width=Math.round(W*d);c.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0);hive.x=W/2;hive.y=H*.87;}function flower(x,y){flowers.push({x,y,p:rand(0,7),petals:Math.floor(rand(5,9)),stock:35});if(flowers.length>40)flowers.shift()}function bee(){return{x:rand(0,W),y:rand(0,H),vx:rand(-1,1),vy:rand(-1,1),p:rand(0,7),speed:rand(.7,1.3),f:Math.floor(rand(0,flowers.length)),load:0,trail:[],burst:0}}function select(m){mode=m;for(const b of controls.children)b.setAttribute('aria-pressed',String(b.dataset.mode===m));document.querySelector('#mode').textContent=names[m];if(m==='scatter')for(const b of bees){let a=Math.atan2(b.y-target.y,b.x-target.x);b.vx=Math.cos(a)*rand(6,11);b.vy=Math.sin(a)*rand(6,11);b.burst=55}}for(const [m,name] of Object.entries(names)){const b=document.createElement('button');b.textContent=name;b.dataset.mode=m;b.onclick=()=>select(m);controls.append(b)}function reset(){t=0;honey=0;flowers=[];target={x:W*.5,y:H*.45};for(let i=0;i<14;i++)flower(rand(20,W-20),rand(20,H-30));bees=Array.from({length:72},bee);select('forage')}document.querySelector('#less').onclick=()=>bees.splice(Math.max(12,bees.length-24));document.querySelector('#more').onclick=()=>{for(let i=0;i<24&&bees.length<240;i++)bees.push(bee())};document.querySelector('#bloom').onclick=()=>flower(target.x,target.y);document.querySelector('#reset').onclick=reset;let dragging=false;function point(e){const r=c.getBoundingClientRect();target.x=clamp(e.clientX-r.left,12,W-12);target.y=clamp(e.clientY-r.top,12,H-12)}c.onpointerdown=e=>{dragging=true;c.setPointerCapture(e.pointerId);point(e);if(mode==='forage')flower(target.x,target.y)};c.onpointermove=e=>{if(dragging)point(e)};c.onpointerup=c.onpointercancel=()=>dragging=false;
function update(){t++;const n=bees.length;for(let i=0;i<n;i++){const b=bees[i],a=i/n*Math.PI*2;let x=target.x,y=target.y;if(mode==='forage'){const f=flowers[b.f%flowers.length];if(f){x=f.x+Math.cos(t*.025+b.p)*7;y=f.y+Math.sin(t*.025+b.p)*7;if(Math.hypot(b.x-f.x,b.y-f.y)<12&&t%8===0){b.load++;if(--f.stock<=0){f.stock=35;b.f=(b.f+1)%flowers.length}if(b.load>=12){honey++;b.load=0;b.f=(b.f+1)%flowers.length}}}}else if(mode==='orbit'){let r=32+(i%6)*12;x+=Math.cos(a+t*.02)*r;y+=Math.sin(a+t*.02)*r}else if(mode==='heart'){let q=a;x+=55*Math.sin(q)**3;y-=3.4*(13*Math.cos(q)-5*Math.cos(2*q)-2*Math.cos(3*q)-Math.cos(4*q))}else if(mode==='spiral'){let r=8+i/n*Math.min(W,H)*.44,q=a*3+t*.026;x+=Math.cos(q)*r;y+=Math.sin(q)*r}else if(mode==='queen'){let r=15+(i%8)*9;x+=Math.cos(a+t*.03)*r;y+=Math.sin(a+t*.03)*r}else if(mode==='dance'){x+=Math.sin(t*.07+i*.33)*W*.36;y+=Math.cos(t*.11+i*.2)*H*.27}else if(mode==='storm'){x+=Math.sin(t*.07+i*2.7)*W*.45;y+=Math.cos(t*.085+i*1.9)*H*.4}else if(mode==='hive'){x=hive.x+Math.cos(a)*18;y=hive.y+Math.sin(a)*12}else if(mode==='snake'){x+=Math.sin(i*.19-t*.07)*W*.37;y+=Math.cos(i*.11-t*.045)*H*.3}else if(mode==='stars'){let cols=12,rows=Math.ceil(n/cols);x=W*.12+(i%cols)*W*.76/11;y=H*.15+Math.floor(i/cols)*H*.7/Math.max(1,rows-1)}else if(mode==='scatter'&&b.burst-->0){x=b.x+b.vx*6;y=b.y+b.vy*6}if(mode!=='freeze'){const dx=x-b.x,dy=y-b.y,dist=Math.hypot(dx,dy)||1;const j=mode==='stars'?.02:.15;b.vx=(b.vx+dx/dist*Math.min(dist*.025,.7)+Math.sin(t*.09+b.p)*j)*.89;b.vy=(b.vy+dy/dist*Math.min(dist*.025,.7)+Math.cos(t*.08+b.p)*j)*.89;const s=Math.hypot(b.vx,b.vy),max=mode==='storm'?5:mode==='scatter'?8:3.5;if(s>max){b.vx*=max/s;b.vy*=max/s}b.x+=b.vx*b.speed;b.y+=b.vy*b.speed}if(b.x<5||b.x>W-5)b.vx*=-1;if(b.y<5||b.y>H-5)b.vy*=-1;b.x=clamp(b.x,5,W-5);b.y=clamp(b.y,5,H-5);b.trail.push([b.x,b.y]);if(b.trail.length>7)b.trail.shift()}}
function draw(){g.clearRect(0,0,W,H);g.strokeStyle='#a7c4aa12';for(let x=0;x<W;x+=27){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=27){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}for(const f of flowers){g.save();g.translate(f.x,f.y);g.rotate(f.p);for(let k=0;k<f.petals;k++){let a=k*2*Math.PI/f.petals;g.fillStyle=['#f3b8d9','#c7b8f5','#f9ebaa','#ffa5a5'][Math.floor(f.p*3)%4];g.beginPath();g.ellipse(Math.cos(a)*6,Math.sin(a)*6,4.2,5.5,a,0,7);g.fill()}g.fillStyle='#f9cc53';g.beginPath();g.arc(0,0,4,0,7);g.fill();g.restore()}g.textAlign='center';g.font='26px system-ui';g.fillText('🍯',hive.x,hive.y);g.strokeStyle='#f7d67780';g.setLineDash([3,6]);g.beginPath();g.arc(target.x,target.y,13+Math.sin(t*.07)*2,0,7);g.stroke();g.setLineDash([]);if(mode==='queen'){g.font='23px system-ui';g.fillText('👑',target.x,target.y-17)}if(mode==='stars'){g.strokeStyle='#f9df8640';g.beginPath();for(let i=1;i<bees.length;i++){g.moveTo(bees[i-1].x,bees[i-1].y);g.lineTo(bees[i].x,bees[i].y)}g.stroke()}for(const b of bees){if(b.trail.length>1){g.strokeStyle='#fbd26535';g.beginPath();g.moveTo(...b.trail[0]);for(const p of b.trail)g.lineTo(...p);g.stroke()}g.save();g.translate(b.x,b.y);g.rotate(Math.atan2(b.vy,b.vx));g.fillStyle='#c3eaffaa';g.beginPath();g.ellipse(-1,-4,4,2,-.5,0,7);g.ellipse(-1,4,4,2,.5,0,7);g.fill();g.fillStyle='#f7c744';g.beginPath();g.ellipse(0,0,5.5,3.5,0,0,7);g.fill();g.strokeStyle='#423020';g.lineWidth=1.7;g.beginPath();g.moveTo(-2,-3);g.lineTo(-2,3);g.moveTo(1,-3);g.lineTo(1,3);g.stroke();g.restore()}document.querySelector('#count').textContent='🐝 '+bees.length+' bees';document.querySelector('#nectar').textContent='🍯 '+honey+' nectar'}
function frame(ms){requestAnimationFrame(frame);if(document.hidden||ms-last<16)return;last=ms;update();draw()}resize();reset();if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(field);requestAnimationFrame(frame)})();
</script></body></html>
