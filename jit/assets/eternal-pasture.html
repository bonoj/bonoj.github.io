<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>The Eternal Pasture · Musical Ecology</title><style>*{box-sizing:border-box}body{margin:0;background:#10171b;color:#e9e4d9;font:15px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center}main{width:min(100%,720px);background:#111b20;border-radius:15px;overflow:hidden}header{padding:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:18px;margin:0}small{opacity:.65}button{border:0;border-radius:9px;padding:10px 15px;font-weight:750;cursor:pointer}#start{background:#b9c99c;color:#15201b}#field{height:min(64dvh,460px);min-height:310px;position:relative;overflow:hidden;background:linear-gradient(#152536 0%,#293e43 61%,#263d2d 61%,#18291f 100%)}#field:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 13% 17%,#fff8 1px,transparent 2px),radial-gradient(circle at 68% 26%,#fff9 1px,transparent 2px),radial-gradient(circle at 85% 11%,#fff6 1px,transparent 2px),radial-gradient(circle at 41% 35%,#fff6 1px,transparent 2px)}#horizon{position:absolute;bottom:30%;width:100%;height:18%;border-radius:50% 50% 0 0;background:#36503b;opacity:.65}#entities{position:absolute;inset:0;pointer-events:none}#entities span{position:absolute;line-height:1;will-change:transform;text-shadow:0 3px 8px #0008;user-select:none;white-space:nowrap}#phase{position:absolute;left:12px;bottom:10px;font-size:12px;background:#0007;border-radius:7px;padding:5px 9px}#cycle{position:absolute;right:12px;bottom:11px;font-size:11px;opacity:.7}footer{padding:12px 15px 14px}#mute{border:1px solid #63756b;background:transparent;color:inherit;padding:7px 10px;font-size:12px}#meter{display:flex;gap:3px;margin-top:12px;height:5px;border-radius:4px;overflow:hidden}#meter i{flex:1;opacity:.4}#meter i.on{opacity:1}</style></head><body><main><header><div><h1>🐑 The Eternal Pasture</h1><small>An ecological requiem in seven transformations</small></div><button id="start">▶ Start</button></header><div id="field"><div id="horizon"></div><div id="entities"></div><div id="phase">Awaiting the first sheep</div><div id="cycle">Cycle 0</div></div><footer><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span id="score" style="font-size:12px;opacity:.8">♩ A pastoral melody awaits</span><button id="mute">♫ Sound on</button></div><div id="meter"></div></footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),field=$('field'),layer=$('entities'),phaseLabel=$('phase'),cycleLabel=$('cycle'),score=$('score'),start=$('start'),mute=$('mute'),meter=$('meter');let ac,master,filter,delay,feedback,wet,active=false,muted=false,cycle=0,phase=0,phaseTime=0,last=0,nextBeat=0,beat=0,objects=[],raf=0;const stages=[{name:'The Pasture',duration:5.4,caption:'A pastoral melody wanders',notes:[57,60,64,69,67,64,60,57]},{name:'The Sudden Ending',duration:3,caption:'A percussion catastrophe',notes:[45,46,40,38,35,33]},{name:'The Rot',duration:4.5,caption:'Dissonance dissolves into spores',notes:[53,56,59,60,56,53]},{name:'The Seed',duration:4,caption:'A small ascending phrase',notes:[48,52,55,57,60,64]},{name:'The Forest',duration:5.3,caption:'Harmony branches and expands',notes:[48,55,60,64,67,72,69,64]},{name:'The Sky',duration:4.5,caption:'The melody evaporates',notes:[72,76,79,81,79,76,72]},{name:'The Return',duration:3,caption:'A familiar motif reappears',notes:[57,60,64,69,67,64]}];const colors=['#c9c5b0','#9e5b53','#ae8458','#7fa16e','#48764e','#93a9b9','#c9c5b0'];colors.forEach(c=>{const el=document.createElement('i');el.style.background=c;meter.append(el)});function setup(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.36;filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=4400;delay=ac.createDelay(1);delay.delayTime.value=.27;feedback=ac.createGain();feedback.gain.value=.18;wet=ac.createGain();wet.gain.value=.18;master.connect(filter);filter.connect(ac.destination);filter.connect(delay);delay.connect(feedback);feedback.connect(delay);delay.connect(wet);wet.connect(ac.destination)}
function tone(midi,kind='pluck',vol=.15,dur=.5){if(!ac||muted)return;const t=ac.currentTime,f=440*Math.pow(2,(midi-69)/12),env=ac.createGain();env.gain.setValueAtTime(.0001,t);if(kind==='bow'){env.gain.exponentialRampToValueAtTime(vol,t+.14);env.gain.setTargetAtTime(.0001,t+dur,.25)}else if(kind==='cloud'){env.gain.exponentialRampToValueAtTime(vol,t+.34);env.gain.setTargetAtTime(.0001,t+dur,.7)}else{env.gain.exponentialRampToValueAtTime(vol,t+.009);env.gain.exponentialRampToValueAtTime(Math.max(.0001,vol*.23),t+.16);env.gain.setTargetAtTime(.0001,t+dur,.16)}env.connect(master);const hs=kind==='cloud'?[1,2,3]:kind==='bow'?[1,2,3,4,5]:kind==='wood'?[1,2.01,3.03]:[1,2.003,3.01,4.025];hs.forEach((h,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==='bow'?'triangle':'sine';o.frequency.value=f*h;g.gain.value=[.7,.21,.1,.06,.03][i];o.connect(g);g.connect(env);o.start(t);o.stop(t+dur+2)})}
function thud(){if(!ac||muted)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.25);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(master);o.start(t);o.stop(t+.5)}
function make(emoji,x,y,size=31,vx=0,vy=0){const el=document.createElement('span');el.textContent=emoji;layer.append(el);objects.push({el,emoji,x,y,size,vx,vy})}
function scene(){objects.forEach(o=>o.el.remove());objects=[];const w=field.clientWidth,h=field.clientHeight;if(phase===0||phase===6){for(let i=0;i<5;i++)make('🌿',w*(.12+i*.19),h*.73,22);make('🐑',w*.47,h*.62,57)}if(phase===1){for(let i=0;i<13;i++){const a=Math.PI*2*i/13;make(i%3===0?'🦴':'🍖',w*.5,h*.59,22+Math.random()*9,Math.cos(a)*(45+Math.random()*85),-70-Math.random()*105)}}if(phase===2)for(let i=0;i<9;i++)make('🍄',w*(.12+Math.random()*.76),h*(.67+Math.random()*.17),18+Math.random()*20);if(phase===3)for(let i=0;i<11;i++)make('🌱',w*(.08+i*.083),h*(.7+Math.random()*.1),19+Math.random()*8);if(phase===4)for(let i=0;i<7;i++)make('🌳',w*(.08+i*.14),h*(.62+Math.random()*.13),40+Math.random()*20);if(phase===5)for(let i=0;i<9;i++)make('☁️',w*(.05+Math.random()*.85),h*(.17+Math.random()*.38),36+Math.random()*35,-3-Math.random()*8);phaseLabel.textContent=stages[phase].name;score.textContent='♩ '+stages[phase].caption;cycleLabel.textContent='Cycle '+cycle;[...meter.children].forEach((e,i)=>e.classList.toggle('on',i===phase))}
function advance(){phase=(phase+1)%7;if(phase===0)cycle++;phaseTime=0;beat=0;nextBeat=0;scene();if(phase===1)thud()}
function music(){const s=stages[phase],n=s.notes[beat%s.notes.length];if(phase===0||phase===6){tone(n,'pluck',.16,.4);if(beat%4===0)tone(n-12,'wood',.08,1.1)}if(phase===1){thud();tone(n,'bow',.11,.3);if(beat%2===0)tone(n+13,'pluck',.09,.16)}if(phase===2){tone(n,'bow',.1,.9);if(beat%3===0)tone(n-12,'cloud',.055,1.6)}if(phase===3){tone(n,'wood',.12,.5);if(beat%3===0)tone(n+12,'pluck',.055,.3)}if(phase===4){tone(n,'pluck',.13,.7);tone(n-12,'bow',.065,1.3);if(beat%3===0)tone(n+7,'wood',.08,.6)}if(phase===5){tone(n,'cloud',.075,1.5);if(beat%3===0)tone(n+7,'cloud',.045,2)}beat++}
function frame(now){if(!active)return;const dt=Math.min(.06,(now-last)/1000||0);last=now;phaseTime+=dt;if(phaseTime>=stages[phase].duration)advance();const interval=[.44,.22,.63,.43,.38,.7,.46][phase];if(phaseTime>=nextBeat){music();nextBeat+=interval}const w=field.clientWidth,h=field.clientHeight;objects.forEach(o=>{if(phase===1){o.vy+=135*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.y>h*.85){o.y=h*.85;o.vy*=-.22;o.vx*=.8}}if(phase===5){o.x+=o.vx*dt;if(o.x< -50)o.x=w+30}const p=Math.min(1,phaseTime/stages[phase].duration);let scale=1,opacity=1;if(phase===2)scale=.65+p*.65;if(phase===3)scale=.4+p*.95;if(phase===4)scale=.45+p*.75;if(phase===5)opacity=1-p*.85;if(phase===1)opacity=1-p*.5;if(phase===6&&o.emoji==='🐑')scale=.6+p*.5;o.el.style.fontSize=o.size+'px';o.el.style.opacity=opacity;o.el.style.transform='translate('+o.x+'px,'+o.y+'px) translate(-50%,-50%) scale('+scale+')'});raf=requestAnimationFrame(frame)}
start.onclick=()=>{setup();ac.resume();if(active){active=false;cancelAnimationFrame(raf);start.textContent='▶ Resume';return}active=true;start.textContent='Ⅱ Pause';last=performance.now();raf=requestAnimationFrame(frame)};mute.onclick=()=>{muted=!muted;mute.textContent=muted?'♩ Sound off':'♫ Sound on'};scene()})();
</script></body></html>
