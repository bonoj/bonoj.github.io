<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Finger · Shared Switch</title><style>html,body{margin:0;width:100%;height:100%;background:#e8e7df;font-family:system-ui}#fingerSwitch{width:100%;height:100dvh;min-height:340px;position:relative;overflow:hidden;background:#e8e7df;touch-action:manipulation}#fingerSwitch *{box-sizing:border-box}#fingerSwitch svg{width:100%;height:calc(100% - 80px);display:block}#fingerSwitch .head{position:absolute;top:12px;left:14px;color:#59635d;font:12px ui-monospace,monospace}#fingerSwitch .bar{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center}#fingerSwitch button{border:1px solid #8d9a91;background:#fff;color:#344039;border-radius:10px;padding:12px 18px;font:600 14px system-ui;min-width:105px}#fingerSwitch button.on{background:#3e7966;color:#fff}#fingerSwitch .log{font:11px ui-monospace,monospace;color:#5b675f;flex:1;text-align:right}</style><div id="fingerSwitch"><div class="head" id="fsHead">FINGER IDLE · SWITCH OFF</div><svg viewBox="0 0 360 315" aria-label="Articulated finger bending to press a shared on-off button"><line x1="20" y1="273" x2="340" y2="273" stroke="#aeb6aa" stroke-width="2"/><g id="fsFinger" stroke-linecap="round" stroke-linejoin="round" fill="none"><path id="fsBone" stroke="#c79772" stroke-width="23"/><path id="fsDetail" stroke="#e7bd9b" stroke-width="15"/><circle id="fsTip" r="10" fill="#edc7a8" stroke="#a87755" stroke-width="2"/><circle cx="70" cy="230" r="14" fill="#bd8865" stroke="#916344" stroke-width="2"/></g><g id="fsPhysical" transform="translate(245 217)"><rect x="-50" y="0" width="100" height="49" rx="10" fill="#a5aca4" stroke="#64746a" stroke-width="3"/><rect id="fsCap" x="-41" y="-14" width="82" height="28" rx="10" fill="#e3a47e" stroke="#95664b" stroke-width="3"/><text id="fsCapText" x="0" y="5" text-anchor="middle" fill="#523e35" font-size="12" font-family="monospace">OFF</text></g></svg><div class="bar"><button id="fsToggle">OFF</button><button id="fsAuto">◉ Finger</button><span class="log" id="fsLog">0 taps</span></div></div><script>(()=>{const root=document.getElementById('fingerSwitch');if(root.dataset.ready)return;root.dataset.ready='1';const el=id=>root.querySelector('#'+id);let state=false,autonomous=true,taps=0,last=performance.now(),clock=0,phase='idle',phaseT=0,pressBy='finger',fingerPressCount=0;const base={x:70,y:230},lengths=[75,63,48],rest={x:150,y:110},target={x:245,y:202};function solve(goal){let pts=[{...base},{x:110,y:190},{x:150,y:165},{...goal}];const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),reach=lengths.reduce((a,b)=>a+b,0);let d=dist(base,goal);if(d>reach){goal={x:base.x+(goal.x-base.x)*reach/d,y:base.y+(goal.y-base.y)*reach/d}}for(let k=0;k<12;k++){pts[3]={...goal};for(let i=2;i>=0;i--){let dx=pts[i].x-pts[i+1].x,dy=pts[i].y-pts[i+1].y,n=Math.hypot(dx,dy)||1;pts[i]={x:pts[i+1].x+dx/n*lengths[i],y:pts[i+1].y+dy/n*lengths[i]}}pts[0]={...base};for(let i=1;i<4;i++){let dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y,n=Math.hypot(dx,dy)||1;pts[i]={x:pts[i-1].x+dx/n*lengths[i-1],y:pts[i-1].y+dy/n*lengths[i-1]}}}return pts}function toggle(actor){state=!state;taps++;if(actor==='finger')fingerPressCount++;el('fsToggle').textContent=state?'ON':'OFF';el('fsToggle').classList.toggle('on',state);el('fsCapText').textContent=state?'ON':'OFF';el('fsCap').setAttribute('fill',state?'#7ab39b':'#e3a47e');el('fsLog').textContent=taps+' taps · '+(actor==='finger'?'🤖':'👆')}function startPress(){if(phase!=='idle')return;phase='approach';phaseT=0}el('fsToggle').onclick=()=>toggle('user');el('fsPhysical').addEventListener('click',()=>toggle('user'));el('fsAuto').onclick=()=>{autonomous=!autonomous;el('fsAuto').textContent=autonomous?'◉ Finger':'○ Finger'};function frame(now){if(!root.isConnected)return;let dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;phaseT+=dt;if(autonomous&&phase==='idle'&&clock>2.7){clock=0;startPress()}let a=0;if(phase==='approach'){a=Math.min(1,phaseT/.52);if(a>=1){phase='contact';phaseT=0;toggle('finger')}}else if(phase==='contact'){a=1;if(phaseT>.19){phase='retract';phaseT=0}}else if(phase==='retract'){a=Math.max(0,1-phaseT/.65);if(a<=0){phase='idle';phaseT=0}}a=a*a*(3-2*a);let goal={x:rest.x+(target.x-rest.x)*a,y:rest.y+(target.y-rest.y)*a};let pts=solve(goal);const d='M'+pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' L');el('fsBone').setAttribute('d',d);el('fsDetail').setAttribute('d',d);el('fsTip').setAttribute('cx',pts[3].x);el('fsTip').setAttribute('cy',pts[3].y);el('fsCap').setAttribute('transform',phase==='contact'?'translate(0 5)':'');el('fsHead').textContent=(phase==='idle'?'FINGER IDLE':phase.toUpperCase())+' · SWITCH '+(state?'ON':'OFF');requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></html>
