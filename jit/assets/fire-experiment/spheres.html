<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spheres on Fire</title><style>body{margin:0;background:#080a0e;color:#e9e1d7;font:13px system-ui}main{max-width:760px;margin:auto;padding:15px}canvas{width:100%;height:390px;display:block;border-radius:12px;touch-action:none}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}button{background:#26222a;color:#f6e7d8;border:1px solid #51414b;border-radius:9px;padding:10px 14px}#title{flex:1;text-align:center}small{color:#a49a94}</style><main><h2>🔥 Spheres on Fire</h2><canvas></canvas><nav><button id="prev">←</button><div id="title"></div><button id="next">→</button><button id="ignite">🔥 Ignite</button></nav><p><small id="status"></small></p><p><small>Tap sphere: next experiment · Drag: orbit · Six different ignition patterns</small></p></main><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),N=780,phi=Math.PI*(3-Math.sqrt(5)),pts=[],neighbors=[],names=['Wildfire','Polar ignition','Meteor strike','Lava veins','Ember rain','Internal furnace'],desc=['Spreading ignition front','Fire descends from the crown','Hot impact crater','Cracks carry combustion','Embers seed scattered fires','Heat radiates from the core'];for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*phi;pts.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r})}for(let i=0;i<N;i++){const ns=[];for(let j=0;j<N;j++){if(i===j)continue;const a=pts[i],b=pts[j];if((a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2<.095)ns.push(j)}neighbors.push(ns)}
let scene=0,t=0,yaw=.25,pitch=.16,drag=false,moved=false,px=0,py=0,hot=[],fuel=[],particles=[],W=0,H=0,R=100,last=0,frame=0;
function reset(){t=0;particles=[];fuel=new Float32Array(N).fill(1);hot=new Float32Array(N);for(let i=0;i<N;i++){const p=pts[i];if(scene===0&&p.y<-.88)hot[i]=1.5;if(scene===1&&p.y>.88)hot[i]=1.5;if(scene===2&&p.z>.92)hot[i]=1.8;if(scene===3&&Math.abs(Math.sin(p.x*12+p.y*7)+Math.sin(p.z*9-p.y*11))<.12)hot[i]=1.25;if(scene===5)hot[i]=.08}}
function choose(n){scene=(n+6)%6;reset();document.querySelector('#title').innerHTML='<b>'+String(scene+1).padStart(2,'0')+' · '+names[scene]+'</b><br><small>'+desc[scene]+'</small>'}
function resize(){W=canvas.clientWidth;H=canvas.clientHeight;const d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}
function project(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x=p.x*cy+p.z*sy,z=-p.x*sy+p.z*cy;return{x:W/2+x*R,y:H*.51-(p.y*cp-z*sp)*R,z:p.y*sp+z*cp}}
function simulate(dt){t+=dt;const next=new Float32Array(N);for(let i=0;i<N;i++){const p=pts[i],h=hot[i];let sum=0;for(const j of neighbors[i])sum+=hot[j]-h;let force=0;if(scene===0&&p.y<-.92)force=.07;if(scene===1&&p.y>.9)force=.06;if(scene===2&&p.z>.88&&t<75)force=.13;if(scene===3&&Math.abs(Math.sin(p.x*12+p.y*7)+Math.sin(p.z*9-p.y*11))<.14)force=.045;if(scene===4&&Math.random()<.0007*dt)force=.95;if(scene===5)force=.003+(1-fuel[i])*.007;const burning=h>.55&&fuel[i]>.001,rate=burning?Math.min(fuel[i],(.0025+.0035*h)*dt):0;fuel[i]-=rate;next[i]=Math.max(0,Math.min(2.3,h+(sum*(scene===3?.012:scene===2?.026:.038)-h*.009+rate*(scene===5?12:8)+force)*dt));if(scene===5&&t>22)next[i]+=.002*dt;if(burning&&Math.random()<Math.min(.32,h*.17)*dt&&particles.length<900){const q=project(p);if(q.z>-.15)particles.push({x:q.x,y:q.y,vx:(Math.random()-.5)*1.8,vy:-1.1-Math.random()*2.5,life:20+Math.random()*38,age:0})}}hot=next;if(scene===4&&Math.random()<.4*dt)hot[Math.floor(Math.random()*N)]=1.25}
function render(now){const dt=Math.min(2,(now-last||16.7)/16.7);last=now;frame++;R=Math.min(W*.33,H*.34,147);simulate(dt);ctx.fillStyle='#080a0e';ctx.fillRect(0,0,W,H);const cx=W/2,cy=H*.51,disc=ctx.createRadialGradient(cx-R*.28,cy-R*.35,R*.05,cx,cy,R);disc.addColorStop(0,scene===5?'#6d4339':'#454b50');disc.addColorStop(.65,'#292d34');disc.addColorStop(1,'#0c0e12');ctx.fillStyle=disc;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fill();const ordered=[];for(let i=0;i<N;i++){const q=project(pts[i]);if(q.z>-.12)ordered.push({i,q})}ordered.sort((a,b)=>a.q.z-b.q.z);ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();for(const {i,q} of ordered){const f=fuel[i],h=hot[i],burn=Math.max(0,Math.min(1,(h-.28)*.8)),rad=R*.069*(.6+.4*q.z);let red=35+f*48+burn*180,green=37+f*48+burn*77,blue=41+f*48-burn*48;if(scene===3){const p=pts[i];if(Math.abs(Math.sin(p.x*12+p.y*7)+Math.sin(p.z*9-p.y*11))<.16){red+=70;green+=15}}ctx.fillStyle='rgb('+Math.min(255,red|0)+','+Math.max(0,green|0)+','+Math.max(0,blue|0)+')';ctx.beginPath();ctx.arc(q.x,q.y,rad,0,Math.PI*2);ctx.fill();if(burn>.25){const a=Math.min(.8,burn*.65),rr=rad*2.3,g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,rr);g.addColorStop(0,'rgba(255,215,92,'+a+')');g.addColorStop(.35,'rgba(255,94,15,'+(a*.5)+')');g.addColorStop(1,'rgba(255,30,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,Math.PI*2);ctx.fill()}}ctx.restore();ctx.globalCompositeOperation='lighter';for(const p of particles){p.age+=dt;p.vx+=Math.sin(now*.002+p.y*.03)*.06*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const q=p.age/p.life,rad=7*(1-q);if(rad<=0)continue;const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*2.2);g.addColorStop(0,'rgba(255,245,156,'+(.7*(1-q))+')');g.addColorStop(.4,'rgba(255,119,24,'+(.5*(1-q))+')');g.addColorStop(1,'rgba(220,33,4,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,rad*2.2,0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='source-over';particles=particles.filter(p=>p.age<p.life&&p.y>-30);if(frame%12===0)document.querySelector('#status').textContent=(scene+1)+'/6 · FUEL '+Math.round(fuel.reduce((a,b)=>a+b,0)/N*100)+'% · ACTIVE '+hot.reduce((a,b)=>a+(b>.55?1:0),0);requestAnimationFrame(render)}
document.querySelector('#prev').onclick=()=>choose(scene-1);document.querySelector('#next').onclick=()=>choose(scene+1);document.querySelector('#ignite').onclick=reset;canvas.onpointerdown=e=>{drag=true;moved=false;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;yaw+=dx*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+dy*.008));px=e.clientX;py=e.clientY};canvas.onpointerup=()=>{if(!moved)choose(scene+1);drag=false};canvas.onpointercancel=()=>drag=false;resize();choose(0);new ResizeObserver(resize).observe(canvas);requestAnimationFrame(render)})();
</script></html>
