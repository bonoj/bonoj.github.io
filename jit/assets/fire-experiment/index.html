<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fire · Experiment 01</title><style>body{margin:0;background:#080b0e;color:#ddd;font:14px system-ui}main{max-width:760px;margin:auto;padding:16px}canvas{width:100%;height:380px;display:block;touch-action:none}button{background:#36231c;color:#fff;border:1px solid #674331;border-radius:8px;padding:10px;margin:5px}small{color:#aaa}</style><main><h2>🔥 Fire · Experiment 01</h2><canvas></canvas><button id="ignite">🔥 Ignite</button><button id="wind">Wind: calm</button><button id="reset">Reset log</button><small id="status">FUEL 100%</small><p><small>Tap or drag to ignite. Heat propagates; fuel burns out.</small></p></main><script>
(()=>{const c=document.querySelector('canvas'),g=c.getContext('2d'),N=76;let W,H,wind=0,cells=[],flames=[],last=0;
function size(){W=c.clientWidth;H=c.clientHeight;const d=Math.min(2,devicePixelRatio||1);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}
function reset(){cells=Array.from({length:N},()=>({f:1,t:0}));flames=[]}
function ignite(i){for(let j=Math.max(0,i-2);j<=Math.min(N-1,i+2);j++)cells[j].t=Math.max(1.6,cells[j].t)}
function tick(now){const dt=Math.min(2,(now-last||16)/16.7);last=now;g.fillStyle='#080b0e';g.fillRect(0,0,W,H);const L=W*.12,len=W*.76,y=H*.74,next=cells.map(a=>a.t);
for(let i=0;i<N;i++){const a=cells[i],b=cells[Math.max(0,i-1)],d=cells[Math.min(N-1,i+1)],burn=a.f>.002&&a.t>.58,rate=burn?Math.min(a.f,(.0028+.004*a.t)*dt):0;a.f-=rate;next[i]=Math.max(0,a.t+((b.t+d.t-2*a.t)*.12-.009*a.t+rate*9)*dt);if(burn&&Math.random()<Math.min(.9,.45*a.t)*dt)flames.push({x:L+(i+.5)*len/N,y:y-8,vx:(Math.random()-.5)+wind*.3,vy:-1.3-Math.random()*2.3,life:22+Math.random()*35,age:0,ember:Math.random()<.13})}
for(let i=0;i<N;i++){const a=cells[i];a.t=Math.min(2.4,next[i]);const hot=Math.max(0,a.t-.45);g.fillStyle='rgb('+Math.round(32+a.f*76+hot*75)+','+Math.round(21+a.f*35+hot*14)+','+Math.round(16+a.f*19)+')';g.fillRect(L+i*len/N,y-8,len/N+1,18);if(hot>.05){g.fillStyle='rgba(255,150,35,'+Math.min(.8,hot*.7)+')';g.fillRect(L+i*len/N,y-9,len/N+1,2)}}
g.globalCompositeOperation='lighter';for(const p of flames){p.age+=dt;const q=p.age/p.life;p.vx+=(Math.sin(p.y*.035+now*.002)*.075+wind*.022)*dt;p.vx*=.985;p.vy-=.012*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;const radius=(p.ember?1.4:8)*(1-q);if(radius<=0)continue;const grad=g.createRadialGradient(p.x,p.y,0,p.x,p.y,radius*2);grad.addColorStop(0,'rgba(255,245,158,'+(.7*(1-q))+')');grad.addColorStop(.3,'rgba(255,133,19,'+(.55*(1-q))+')');grad.addColorStop(1,'rgba(220,37,4,0)');g.fillStyle=grad;g.beginPath();g.arc(p.x,p.y,radius*2,0,Math.PI*2);g.fill()}g.globalCompositeOperation='source-over';flames=flames.filter(p=>p.age<p.life&&p.y>-20).slice(-1800);document.querySelector('#status').textContent='FUEL '+Math.round(cells.reduce((s,a)=>s+a.f,0)/N*100)+'% · FLAMES '+flames.length;requestAnimationFrame(tick)}
document.querySelector('#ignite').onclick=()=>ignite(38);document.querySelector('#reset').onclick=reset;document.querySelector('#wind').onclick=e=>{wind=wind===0?1.5:wind===1.5?-1.5:0;e.target.textContent='Wind: '+(wind===0?'calm':wind>0?'→':'←')};function touch(e){const r=c.getBoundingClientRect();ignite(Math.max(0,Math.min(N-1,Math.floor(((e.clientX-r.left)/r.width-.12)/.76*N))))}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);touch(e)};c.onpointermove=e=>{if(e.buttons)touch(e)};size();reset();new ResizeObserver(size).observe(c);requestAnimationFrame(tick)})();
</script></html>
