<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08121d"><title>THAW · JIT Assets</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08121d;color:#9ab8c7;font-family:system-ui}main{position:relative;width:100%;height:100dvh;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.readout{position:absolute;top:20px;left:20px;font:11px ui-monospace,monospace;letter-spacing:2px;pointer-events:none}.meter{position:absolute;bottom:18px;left:20px;right:20px;height:2px;background:#ffffff24;pointer-events:none}.meter div{height:100%;background:#a8e8f5;width:100%}</style></head><body><main><canvas id="ice"></canvas><div class="readout" id="readout">100% SOLID</div><div class="meter"><div id="meter"></div></div></main><script>
(()=>{'use strict';const canvas=document.querySelector('#ice'),ctx=canvas.getContext('2d'),meter=document.querySelector('#meter div'),readout=document.querySelector('#readout');let w=0,h=0,dpr=1,holding=false,melt=0,last=performance.now(),drops=[],ripples=[];const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}resize();new ResizeObserver(resize).observe(canvas);
const inclusions=Array.from({length:95},()=>({x:rand(-.8,.8),y:rand(-.8,.8),z:rand(-.8,.8),r:rand(.5,2.5),a:rand(.06,.4)})),cracks=Array.from({length:22},()=>({x:rand(-.8,.8),y:rand(-.8,.8),dx:rand(-.35,.35),dy:rand(-.3,.3),a:rand(.08,.24)}));
function path(pts){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()}
function draw(t){ctx.clearRect(0,0,w,h);const cx=w/2,cy=h*.47,base=Math.min(w*.27,h*.29,160),s=base*Math.max(.025,1-melt*.94),angle=Math.sin(t*.00022)*.14+.2,X=(x,y,z)=>cx+s*(x*Math.cos(angle)+z*.63*Math.sin(angle)+z*.42),Y=(x,y,z)=>cy+s*(y*.93-z*.34+x*.08),p=(x,y,z)=>[X(x,y,z),Y(x,y,z)],a=p(-1,-1,-1),b=p(1,-1,-1),c=p(1,1,-1),d=p(-1,1,-1),e=p(-1,-1,1),f=p(1,-1,1),g=p(1,1,1),hh=p(-1,1,1),floor=cy+s*1.25;
let sh=ctx.createRadialGradient(cx,floor,2,cx,floor,base*1.7);sh.addColorStop(0,'#68b5ca2d');sh.addColorStop(1,'#68b5ca00');ctx.fillStyle=sh;ctx.beginPath();ctx.ellipse(cx,floor,base*1.5,base*.25,0,0,Math.PI*2);ctx.fill();
if(melt>.01){let puddle=base*(.7+melt*1.6);ctx.fillStyle='#80d6e820';ctx.strokeStyle='#a5edfa45';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(cx,cy+base*1.25,puddle,puddle*.18,0,0,Math.PI*2);ctx.fill();ctx.stroke()}
for(const face of [{pts:[a,b,c,d],colors:['#a2ddec50','#9bd7ed18']},{pts:[b,f,g,c],colors:['#5ba9c755','#1c759c28']},{pts:[e,f,g,hh],colors:['#a8e8f055','#3a9ac02a']},{pts:[a,b,f,e],colors:['#e0f9ffb0','#74c4df4a']}]){path(face.pts);const gr=ctx.createLinearGradient(cx-s,cy-s,cx+s,cy+s);gr.addColorStop(0,face.colors[0]);gr.addColorStop(1,face.colors[1]);ctx.fillStyle=gr;ctx.fill();ctx.strokeStyle='#c9f7ff70';ctx.lineWidth=1.2;ctx.stroke()}
ctx.save();path([a,b,f,g,hh,d]);ctx.clip();for(const q of inclusions){ctx.beginPath();ctx.arc(X(q.x,q.y,q.z),Y(q.x,q.y,q.z),q.r*s/100,0,Math.PI*2);ctx.fillStyle='rgba(229,251,255,'+q.a+')';ctx.fill()}for(const q of cracks){let x=X(q.x,q.y,0),y=Y(q.x,q.y,0);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+q.dx*s,y+q.dy*s);ctx.strokeStyle='rgba(225,250,255,'+q.a+')';ctx.lineWidth=.7;ctx.stroke()}for(let i=0;i<55;i++){let xx=Math.sin(i*19.37)*.88,yy=Math.cos(i*7.13)*.88;ctx.beginPath();ctx.arc(X(xx,yy,1),Y(xx,yy,1),.5+Math.abs(Math.sin(i*3.7))*1.3,0,Math.PI*2);ctx.fillStyle='#ffffff28';ctx.fill()}ctx.restore();
ctx.strokeStyle='#f0feff8a';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(...e);ctx.lineTo(...f);ctx.lineTo(...g);ctx.stroke();ctx.strokeStyle='#ffffff66';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(-.88,-.85,1),Y(-.88,-.85,1));ctx.lineTo(X(-.83,.5,1),Y(-.83,.5,1));ctx.stroke();
const gl=ctx.createRadialGradient(cx-s*.35,cy-s*.55,0,cx,cy,s*1.5);gl.addColorStop(0,'#e9ffff30');gl.addColorStop(1,'#d7faff00');ctx.fillStyle=gl;path([a,b,f,g,hh,d]);ctx.fill();
for(const q of drops){ctx.fillStyle='#b5eafa9a';ctx.beginPath();ctx.ellipse(q.x,q.y,q.r,q.r*1.45,0,0,Math.PI*2);ctx.fill()}for(const q of ripples){ctx.beginPath();ctx.ellipse(q.x,q.y,q.r,q.r*.23,0,0,Math.PI*2);ctx.strokeStyle='rgba(173,232,249,'+Math.max(0,1-q.r/65)*.5+')';ctx.stroke()}
return {cx,cy,base,s,floor}}
function frame(now){const dt=Math.min(.06,(now-last)/1000);last=now;if(holding)melt=Math.min(1,melt+dt*.052);const base=Math.min(w*.27,h*.29,160),s=base*Math.max(.025,1-melt*.94),floor=h*.47+s*1.25;if(holding&&melt<.99&&Math.random()<dt*17)drops.push({x:w/2+rand(-s,s),y:h*.47+rand(-s*.4,s*.8),r:rand(1,2.4),v:rand(25,65)});for(const q of drops){q.y+=q.v*dt;if(q.y>floor){ripples.push({x:q.x,y:floor,r:1});q.dead=true}}drops=drops.filter(q=>!q.dead);for(const q of ripples)q.r+=dt*45;ripples=ripples.filter(q=>q.r<65);draw(now);const pct=Math.max(0,Math.round((1-melt)*100));meter.style.width=pct+'%';readout.textContent=pct+'% SOLID';requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();holding=true;canvas.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>holding=false);requestAnimationFrame(frame);
})();
</script></body></html>
