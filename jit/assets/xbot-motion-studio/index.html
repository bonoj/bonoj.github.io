<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2028"><title>Xbot · Humanoid Motion Study</title><style>*{box-sizing:border-box}body{margin:0;background:#10141c;color:#e8f1f5;font:14px system-ui}main{max-width:900px;margin:auto;padding:12px}h1{font-size:21px;margin:6px 0 10px}.stage{height:min(65vh,580px);min-height:320px;position:relative;overflow:hidden;border-radius:12px;background:#1b2028;touch-action:none;user-select:none}.view{position:absolute;inset:0;touch-action:none}.status{position:absolute;top:12px;left:12px;background:#111a23df;padding:7px 10px;border-radius:7px;font-size:12px;pointer-events:none}.hint{position:absolute;bottom:10px;left:12px;color:#dce7ed;font-size:11px;pointer-events:none}.motions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}button{background:#303e4c;color:#edf4f7;border:1px solid #617282;border-radius:8px;padding:10px 6px;font:12px system-ui;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{background:#387b91;border-color:#a1d5e8}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0;font-size:12px}input{width:100%;accent-color:#64b4ce}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.bottom>div{display:flex;gap:6px}</style></head><body><main><h1>Xbot · Humanoid Motion Study</h1><div class="stage" id="stage"><div class="view" id="view"></div><div class="status" id="status">Loading Xbot skeleton…</div><div class="hint">Drag to orbit · Pinch to zoom</div></div><div class="motions" id="clips">Discovering animation clips…</div><div class="sliders"><label>Playback speed <span id="speedvalue">1.00×</span><input id="speed" type="range" min=".25" max="2" step=".05" value="1"></label><label>Crossfade <span id="fadevalue">0.25 s</span><input id="fade" type="range" min="0" max="1" step=".05" value=".25"></label></div><div class="bottom"><span id="current">—</span><div><button id="zoomout">−</button><button id="zoomin">+</button><button id="reset">Reset view</button></div></div><p style="font-size:11px;opacity:.65">Three.js · Xbot GLB · embedded skeletal animations · network required</p></main><script type="module">
const stage=document.querySelector('#stage'),view=document.querySelector('#view'),status=document.querySelector('#status'),clipBox=document.querySelector('#clips');
let renderer,scene,camera,mixer,clock,actions={},active=null,frame=0;
let yaw=.45,pitch=.14,radius=6.8,targetY=1,fade=.25,speed=1;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function cameraUpdate(){if(!camera)return;const c=Math.cos(pitch);camera.position.set(radius*Math.sin(yaw)*c,targetY+radius*Math.sin(pitch),radius*Math.cos(yaw)*c);camera.lookAt(0,targetY,0)}
function zoom(delta){radius=clamp(radius*Math.exp(delta),1.6,20);cameraUpdate()}
const pointers=new Map();let pinch=null;
stage.addEventListener('pointerdown',e=>{e.preventDefault();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null},{passive:false});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...pointers.values()];if(p.length===1){yaw-=(e.clientX-old.x)*.009;pitch=clamp(pitch+(e.clientY-old.y)*.006,-.6,1.35);cameraUpdate()}else if(p.length>=2){const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch!==null&&pinch>0)zoom(Math.log(pinch/Math.max(d,1)));pinch=d}},{passive:false});
function end(e){pointers.delete(e.pointerId);pinch=null}['pointerup','pointercancel','lostpointercapture'].forEach(k=>stage.addEventListener(k,end));
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY*.001)},{passive:false});
document.querySelector('#zoomout').onclick=()=>zoom(.18);document.querySelector('#zoomin').onclick=()=>zoom(-.18);
document.querySelector('#reset').onclick=()=>{yaw=.45;pitch=.14;radius=6.8;cameraUpdate()};
document.querySelector('#speed').oninput=e=>{speed=+e.target.value;document.querySelector('#speedvalue').textContent=speed.toFixed(2)+'×'};
document.querySelector('#fade').oninput=e=>{fade=+e.target.value;document.querySelector('#fadevalue').textContent=fade.toFixed(2)+' s'};
function play(name){const next=actions[name];if(!next)return;if(active!==next){next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1);next.play();if(active){if(fade>0)active.crossFadeTo(next,fade,true);else active.stop()}active=next}clipBox.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.clip===name)));document.querySelector('#current').textContent='Playing: '+name;status.textContent='Xbot · '+name}
try{const THREE=await import('https://esm.sh/three@0.160.1');const {GLTFLoader}=await import('https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js');
scene=new THREE.Scene();scene.background=new THREE.Color('#1b2028');camera=new THREE.PerspectiveCamera(38,1,.1,100);cameraUpdate();renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.domElement.style.cssText='width:100%;height:100%;display:block;touch-action:none';view.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f2ff,0x515565,2.4));const key=new THREE.DirectionalLight(0xffe9d6,3.2);key.position.set(-3,7,5);scene.add(key);const rim=new THREE.DirectionalLight(0x7ebeff,1.6);rim.position.set(4,4,-3);scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0x303c46,roughness:.95}));ground.rotation.x=-Math.PI/2;ground.position.y=-.015;scene.add(ground);const grid=new THREE.GridHelper(10,20,0x56616c,0x37434e);grid.position.y=.003;scene.add(grid);
const gltf=await new GLTFLoader().loadAsync('https://threejs.org/examples/models/gltf/Xbot.glb');const model=gltf.scene;scene.add(model);model.traverse(o=>{if(o.isSkinnedMesh)o.frustumCulled=false});const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3());const scale=2/Math.max(size.y,.001);model.scale.multiplyScalar(scale);model.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);targetY=1;cameraUpdate();mixer=new THREE.AnimationMixer(model);for(const clip of gltf.animations)actions[clip.name]=mixer.clipAction(clip);
const names=Object.keys(actions);clipBox.innerHTML='';if(!names.length){clipBox.textContent='This Xbot file contains no embedded animations.';status.textContent='Xbot loaded · no clips'}else{for(const name of names){const b=document.createElement('button');b.textContent=name;b.dataset.clip=name;b.onclick=()=>play(name);clipBox.appendChild(b)}play(names.find(n=>/idle/i.test(n))||names[0])}
clock=new THREE.Clock();new ResizeObserver(()=>{const w=view.clientWidth,h=view.clientHeight;if(w&&h){camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}}).observe(view);
function animate(){frame=requestAnimationFrame(animate);if(mixer){mixer.timeScale=speed;mixer.update(Math.min(clock.getDelta(),.05))}renderer.render(scene,camera)}animate();
}catch(e){status.textContent='Xbot failed: '+(e?.message||String(e));clipBox.textContent='Unable to load model or animation clips.'}
</script></body></html>
