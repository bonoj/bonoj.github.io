<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211a16"><title>Butter Thy Bread · JIT Assets</title>
<style>*{box-sizing:border-box}body{margin:0;background:#211a16;color:#f4e5c9;font-family:system-ui}main{max-width:680px;margin:auto}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}.bar{padding:12px 14px;background:#33261d;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}button{border:1px solid #806549;border-radius:8px;background:#59412b;color:#fff0d6;padding:9px 13px;font:12px system-ui}.meter{height:8px;border-radius:8px;background:#5d4733;overflow:hidden;flex:1;min-width:75px}.fill{height:100%;width:0;background:#f4c94e;transition:width .1s}a{color:#eec98b;font-size:12px}</style></head><body><main>
<canvas id="btcanvas" width="680" height="660" aria-label="Interactive butter spreading game"></canvas>
<div class="bar"><span id="btlabel">BUTTERED 0%</span><div class="meter"><div id="btfill" class="fill"></div></div><span id="btquality">A pristine slice</span><button id="btnew">New slice</button><a href="../">Assets</a></div>
</main><script>
(()=>{
const canvas=document.getElementById('btcanvas'),ctx=canvas.getContext('2d'),label=document.getElementById('btlabel'),fill=document.getElementById('btfill'),quality=document.getElementById('btquality');
const W=680,H=660;let down=false,knife={x:540,y:500},crumbs=[],score=0,over=0;
const cols=62,rows=56,grid=new Float32Array(cols*rows),rnd=(a,b)=>a+Math.random()*(b-a);
function pathBread(c){c.beginPath();c.moveTo(170,474);c.bezierCurveTo(145,440,152,345,151,285);c.bezierCurveTo(120,243,126,164,174,141);c.bezierCurveTo(220,115,265,141,340,139);c.bezierCurveTo(415,141,460,115,506,141);c.bezierCurveTo(554,164,560,243,529,285);c.bezierCurveTo(528,345,535,440,510,474);c.quadraticCurveTo(340,518,170,474);c.closePath()}
function reset(){grid.fill(0);crumbs=Array.from({length:180},()=>({x:rnd(168,512),y:rnd(164,470),r:rnd(.4,2.2),a:rnd(.15,.65)}));knife={x:550,y:510};down=false;score=0;over=0;update();draw()}
function breadAt(x,y){if(x<155||x>525||y<138||y>494)return false;pathBread(ctx);return ctx.isPointInPath(x,y)}
function apply(x,y){if(!breadAt(x,y))return;const gx=(x-151)/378*cols,gy=(y-139)/355*rows;for(let j=Math.max(0,Math.floor(gy-5));j<Math.min(rows,Math.ceil(gy+5));j++)for(let i=Math.max(0,Math.floor(gx-5));i<Math.min(cols,Math.ceil(gx+5));i++){const d=Math.hypot((i+.5-gx)*1.1,j+.5-gy);if(d<4.4){const idx=j*cols+i;grid[idx]=Math.min(3,grid[idx]+Math.max(0,1-d/4.4)*.14)}}update()}
function update(){let covered=0,thick=0;for(const v of grid){if(v>.18)covered++;if(v>1.1)thick++}score=Math.min(Math.round(100*covered/grid.length*1.23),100);over=thick;label.textContent='BUTTERED '+score+'%';fill.style.width=score+'%';quality.textContent=score<10?'A pristine slice':score<35?'A promising beginning':score<70?'Getting delicious':over>150?'A bit extravagant':score<94?'Almost golden':'BUTTERY PERFECTION ✨'}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createRadialGradient(340,310,80,340,310,550);bg.addColorStop(0,'#6e5140');bg.addColorStop(1,'#291c18');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#e2c7a0';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('BUTTER THY BREAD',340,54);ctx.fillStyle='#c3a18a';ctx.font='14px system-ui';ctx.fillText('DRAG THE KNIFE ACROSS THE TOAST',340,78);
ctx.save();ctx.translate(8,16);ctx.shadowColor='#160b08';ctx.shadowBlur=28;ctx.shadowOffsetY=18;pathBread(ctx);ctx.fillStyle='#20100c';ctx.fill();ctx.restore();pathBread(ctx);ctx.fillStyle='#7e421c';ctx.fill();ctx.save();ctx.clip();const crust=ctx.createLinearGradient(155,150,520,490);crust.addColorStop(0,'#a85e2a');crust.addColorStop(.5,'#c7843c');crust.addColorStop(1,'#9c5325');ctx.fillStyle=crust;ctx.fillRect(130,120,420,400);ctx.save();ctx.translate(340,316);ctx.scale(.944,.934);ctx.translate(-340,-316);pathBread(ctx);ctx.fillStyle='#e6ad65';ctx.fill();ctx.restore();ctx.save();ctx.translate(340,316);ctx.scale(.91,.90);ctx.translate(-340,-316);pathBread(ctx);ctx.fillStyle='#f1c88c';ctx.fill();ctx.restore();
for(const c of crumbs){ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fillStyle='rgba(135,76,31,'+c.a+')';ctx.fill()}
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const v=grid[j*cols+i];if(v<.015)continue;const x=151+(i+.5)*378/cols,y=139+(j+.5)*355/rows,a=Math.min(.95,v*.8);ctx.fillStyle='rgba(255,220,94,'+a+')';ctx.beginPath();ctx.ellipse(x,y,4.7,4.4,0,0,Math.PI*2);ctx.fill();if(v>.65){ctx.fillStyle='rgba(255,246,170,'+Math.min(.75,(v-.65)*.7)+')';ctx.beginPath();ctx.ellipse(x-1,y-1,2.6,2,0,0,Math.PI*2);ctx.fill()}}ctx.restore();
ctx.save();ctx.translate(knife.x,knife.y);ctx.rotate(-.65);ctx.shadowColor='#140c08';ctx.shadowBlur=9;ctx.shadowOffsetY=5;ctx.fillStyle='#ded7c5';ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-12,-80);ctx.quadraticCurveTo(-10,-110,0,-120);ctx.quadraticCurveTo(10,-110,12,-80);ctx.lineTo(7,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#a5a7a3';ctx.fillRect(-7,-81,14,78);ctx.fillStyle='#63412d';ctx.beginPath();ctx.roundRect(-10,-4,20,98,7);ctx.fill();ctx.fillStyle='#b18a60';ctx.beginPath();ctx.arc(0,12,2.5,0,7);ctx.arc(0,72,2.5,0,7);ctx.fill();ctx.restore();ctx.fillStyle='#bca18b';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText('A VERY SMALL CULINARY ACHIEVEMENT',340,623)}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();down=true;canvas.setPointerCapture(e.pointerId);const p=pos(e);knife=p;apply(p.x,p.y);draw()});
canvas.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e),old={...knife};knife=p;const d=Math.hypot(p.x-old.x,p.y-old.y),steps=Math.max(1,Math.ceil(d/4));for(let k=1;k<=steps;k++)apply(old.x+(p.x-old.x)*k/steps,old.y+(p.y-old.y)*k/steps);draw()});
canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false);document.getElementById('btnew').onclick=reset;reset();
})();
</script></body></html>
