<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15263a"><title>The Little God · JIT Assets</title><style>*{box-sizing:border-box}body{margin:0;background:#101a28;color:#e5e9e7;font:14px system-ui}main{max-width:800px;margin:auto;padding:16px}header,footer{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(18px,4vw,25px);letter-spacing:.1em;margin:0}small{font:11px monospace;color:#b8c9cf}canvas{display:block;width:100%;height:min(76vh,650px);min-height:340px;background:#15263a;border-radius:12px;touch-action:none}button{border:1px solid #687781;background:#263743;color:white;border-radius:8px;padding:8px 12px;white-space:nowrap}p{color:#a5b3bd;font-size:12px}a{color:#a9d4e3}</style></head><body><main><header><h1>THE LITTLE GOD</h1><small id="status">A NEW WORLD</small></header><p>A world under one sun. Drag the sun to intervene.</p><canvas id="world" width="640" height="560" aria-label="A miniature civilization beneath a movable sun"></canvas><footer><p id="caption">Drag the sun. Watch the world respond.</p><button id="reset">New world</button></footer><p><a href="../">← JIT Assets</a></p></main><script>
(function(){"use strict";var canvas=document.getElementById("world"),ctx=canvas.getContext("2d");if(!ctx)return;var W=640,H=560,C=48,R=32,TWO=Math.PI*2,cells=[],trees=[],houses=[],clouds=[],sun={x:320,y:85},drag=false,tick=0,year=1,last=0,caption=document.getElementById("caption"),status=document.getElementById("status");function rand(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function index(x,y){return clamp(Math.floor(y),0,R-1)*C+clamp(Math.floor(x),0,C-1)}function cell(x,y){return cells[index(x,y)]}function groundX(x){return x*W/C}function groundY(y){return 185+y*320/R}function init(){cells=[];trees=[];houses=[];clouds=[];tick=0;year=1;sun.x=320;sun.y=85;for(var y=0;y<R;y++)for(var x=0;x<C;x++){var h=.48+.15*Math.sin(x*.19)+.12*Math.cos(y*.24)+.1*Math.sin(x*.36+y*.18)+rand(-.035,.035);cells.push({h:h,wet:h<.43?1:.58,plant:h>.43?.65:0,heat:0,fire:0,river:0})}for(var k=0;k<150;k++){var tx=Math.floor(rand(0,C)),ty=Math.floor(rand(0,R));if(cell(tx,ty).h>.43)trees.push({x:tx,y:ty,size:rand(4,9)})}for(var j=0;j<6;j++){var hx=Math.floor(rand(8,C-8)),hy=Math.floor(rand(7,R-7));if(cell(hx,hy).h>.43)houses.push({x:hx,y:hy,age:0,kind:0})}for(var q=0;q<5;q++)clouds.push({x:rand(0,W),y:rand(195,310),mass:rand(.4,.8)});caption.textContent="Drag the sun. Watch the world respond."}function update(dt){tick+=dt;year=1+Math.floor(tick/30000);if(!drag){sun.x=320+210*Math.sin(tick*.00012);sun.y=88+25*Math.sin(tick*.00008)}var sx=sun.x/W*C,sy=clamp((sun.y-185)/320*R,0,R-1);for(var y=0;y<R;y++)for(var x=0;x<C;x++){var c=cell(x,y),dist=Math.hypot(x-sx,y-sy),light=Math.exp(-dist*dist/240);c.heat=c.heat*.97+light*.03;c.wet=clamp(c.wet-(.000008+c.heat*.00008)*dt,0,1);if(c.h<.43)c.wet=1;c.plant=clamp(c.plant+(c.wet>.25?.000008:-.000018)*dt,0,1);if(c.heat>.5&&c.wet<.15&&c.plant>.35&&Math.random()<.000005*dt)c.fire=1;if(c.fire>0){c.fire=Math.max(0,c.fire-.0003*dt);c.plant=Math.max(0,c.plant-.0003*dt)}c.river*=.999}for(var i=0;i<clouds.length;i++){var cloud=clouds[i];cloud.x+=dt*.014;if(cloud.x>W+60)cloud.x=-60;cloud.mass=clamp(cloud.mass+Math.sin(tick*.0005+i)*dt*.00004,.2,1);if(cloud.mass>.65){for(var z=0;z<6;z++){var gx=Math.floor((cloud.x+rand(-30,30))/W*C),gy=Math.floor((cloud.y+rand(10,75)-185)/320*R),tile=cell(gx,gy);tile.wet=clamp(tile.wet+.001*dt,0,1);tile.river=clamp(tile.river+.0004*dt,0,1)}cloud.mass-=dt*.000015}}for(var h of houses){h.age+=dt;if(h.age>12000&&h.kind===0){var nearby=cell(h.x,h.y);if(nearby.wet<.35){h.kind=1;caption.textContent="A village has built a cistern."}else if(nearby.river>.15){h.kind=2;caption.textContent="A village has diverted a river."}}}status.textContent="YEAR "+year+" · "+houses.length+" VILLAGES"}function render(){var sky=ctx.createLinearGradient(0,0,0,270);sky.addColorStop(0,"#14253f");sky.addColorStop(1,"#91a5a5");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);var halo=ctx.createRadialGradient(sun.x,sun.y,5,sun.x,sun.y,170);halo.addColorStop(0,"rgba(255,244,166,.65)");halo.addColorStop(1,"rgba(255,210,113,0)");ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff0ad";ctx.beginPath();ctx.arc(sun.x,sun.y,22,0,TWO);ctx.fill();var cw=W/C,ch=320/R;for(var y=0;y<R;y++)for(var x=0;x<C;x++){var c=cell(x,y),r,g,b;if(c.h<.43){r=36;g=104;b=148}else if(c.fire>.15){r=190;g=85;b=36}else{r=140-76*c.plant+30*(1-c.wet);g=105+72*c.plant;b=62+40*c.wet}ctx.fillStyle="rgb("+Math.round(r)+","+Math.round(g)+","+Math.round(b)+")";ctx.fillRect(groundX(x),groundY(y),cw+1,ch+1);if(c.river>.05){ctx.fillStyle="rgba(65,168,216,"+clamp(c.river,0,.8)+")";ctx.fillRect(groundX(x),groundY(y),cw+1,ch+1)}}for(var tree of trees){var tc=cell(tree.x,tree.y);if(tc.plant<.15)continue;var tx=groundX(tree.x+.5),ty=groundY(tree.y+.5),sz=tree.size;ctx.strokeStyle="#59422f";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx,ty-sz*1.8);ctx.stroke();ctx.fillStyle=tc.wet<.2?"#b2a458":"#326f4a";ctx.beginPath();ctx.moveTo(tx,ty-sz*3);ctx.lineTo(tx-sz,ty-sz*.7);ctx.lineTo(tx+sz,ty-sz*.7);ctx.fill()}for(var house of houses){var px=groundX(house.x),py=groundY(house.y);ctx.fillStyle=house.kind?"#9eb6bd":"#d2b18a";ctx.fillRect(px-5,py-9,12,11);ctx.fillStyle="#784c3c";ctx.beginPath();ctx.moveTo(px-8,py-9);ctx.lineTo(px+1,py-17);ctx.lineTo(px+10,py-9);ctx.fill()}for(var cloud of clouds){ctx.fillStyle="rgba(239,246,248,"+(.25+cloud.mass*.55)+")";for(var j=-1;j<=1;j++){ctx.beginPath();ctx.ellipse(cloud.x+j*18,cloud.y-(j===0?9:0),29,16,0,0,TWO);ctx.fill()}}ctx.fillStyle="#423c34";ctx.beginPath();ctx.moveTo(0,505);ctx.lineTo(W,505);ctx.lineTo(W-18,H);ctx.lineTo(18,H);ctx.fill()}function pos(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}canvas.addEventListener("pointerdown",function(e){drag=true;canvas.setPointerCapture(e.pointerId);var p=pos(e);sun.x=clamp(p.x,0,W);sun.y=clamp(p.y,30,440)});canvas.addEventListener("pointermove",function(e){if(!drag)return;var p=pos(e);sun.x=clamp(p.x,0,W);sun.y=clamp(p.y,30,440)});canvas.addEventListener("pointerup",function(){drag=false});canvas.addEventListener("pointercancel",function(){drag=false});document.getElementById("reset").addEventListener("click",init);function loop(now){var dt=Math.min(40,now-last||16);last=now;update(dt);render();requestAnimationFrame(loop)}init();render();requestAnimationFrame(loop)})();
</script></body></html>
