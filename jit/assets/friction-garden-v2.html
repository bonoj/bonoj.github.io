<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12131c"><title>Friction Garden v2 · Cat Patrol</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#12131c;color:#eee9e2;font:14px system-ui,sans-serif}main{height:100dvh;max-width:680px;margin:auto;display:flex;flex-direction:column;padding:18px 12px max(18px,env(safe-area-inset-bottom))}header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}h1{font-size:19px;margin:0}a{color:#b8a7cc;text-decoration:none}.sub{font-size:11px;letter-spacing:.12em;color:#b6acb8;margin:7px 0 12px}.stage{position:relative;flex:1;min-height:220px;max-height:550px;background:#1c1d2a;border-radius:12px;overflow:hidden}.columns{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:12px 8px 8px}.col{display:flex;flex-direction:column;align-items:center;min-width:0;touch-action:none;user-select:none;cursor:pointer}.num{height:17px;font-size:10px;font-variant-numeric:tabular-nums;opacity:.7}.track{width:100%;flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;background:#282937;border-radius:7px;overflow:hidden}.fill{width:100%;display:flex;justify-content:center;align-items:flex-start;padding-top:5px;overflow:hidden;border-radius:6px 6px 2px 2px;font-size:clamp(14px,4vw,24px)}.label{font-size:9px;line-height:1.12;text-align:center;white-space:pre-line;height:32px;margin-top:5px}.cat{position:absolute;pointer-events:none;z-index:20;font-size:29px;line-height:34px;width:36px;height:34px;text-align:center;transform-origin:center}.debris-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}.debris{position:absolute;font-size:18px;animation:drop .8s ease-in forwards}@keyframes drop{to{transform:translate(var(--dx),100px) rotate(var(--rot));opacity:0}}footer{padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#b6acb8;font-size:12px}.hint{text-align:center;font-size:12px;color:#c2b7bf;margin-top:10px}button{border:1px solid #676072;background:#262431;color:#eee9e2;border-radius:9px;padding:8px 13px;font:inherit}</style></head><body><main><header><h1>Corporate Friction Garden · v2</h1><a href="./">✦ Assets</a></header><div class="sub">HOLD TO DEFORM · CAT PATROL</div><div class="stage" id="stage"><div class="columns" id="columns"></div><div class="cat" id="cat">🐈</div><div class="debris-layer" id="debris"></div></div><div class="hint">Hold any stack to excavate. The cat works independently.</div><footer><span id="shed">🧹 0 removed</span><span id="mode">🐾 Excavating</span><button id="reset">↻</button></footer></main><script>
(()=>{'use strict';const seeds=[['Paywalls','💰','#b88648',38],['Cookie\nmazes','🍪','#aa6b48',49],['Sign-up\ngates','🔒','#8170b3',34],['Dark\npatterns','🕸️','#b75e79',58],['AI\nslop','🤖','#638ca8',44],['Support\nloops','☎️','#72917b',51]];const stage=document.getElementById('stage'),columns=document.getElementById('columns'),cat=document.getElementById('cat'),debris=document.getElementById('debris');let shed=0,index=0,next=1,direction=1,phase='work',clock=1.8,progress=0,last=performance.now(),fromX=0,fromY=0;const data=seeds.map(([name,emoji,color,value])=>{const el=document.createElement('div');el.className='col';el.innerHTML='<div class="num"></div><div class="track"><div class="fill"></div></div><div class="label"></div>';const d={name,emoji,color,v:value,holding:false,el,track:el.querySelector('.track'),fill:el.querySelector('.fill'),num:el.querySelector('.num')};d.fill.style.background=color;el.querySelector('.label').textContent=name;el.addEventListener('pointerdown',e=>{e.preventDefault();d.holding=true;el.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>d.holding=false);columns.append(el);return d});
function top(i){const r=data[i].track.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.bottom-s.top-r.height*data[i].v/100}}
function fragment(d){const r=d.track.getBoundingClientRect(),s=stage.getBoundingClientRect(),p=document.createElement('span');p.className='debris';p.textContent=d.emoji;p.style.left=(r.left-s.left+r.width*(.2+Math.random()*.6))+'px';p.style.top=(r.bottom-s.top-r.height*d.v/100)+'px';p.style.setProperty('--dx',((Math.random()-.5)*90)+'px');p.style.setProperty('--rot',((Math.random()-.5)*250)+'deg');debris.append(p);setTimeout(()=>p.remove(),800)}
function frame(t){if(!document.body.contains(stage))return;const dt=Math.min(.08,(t-last)/1000);last=t;clock-=dt;if(phase==='work'&&clock<=0){phase='hop';progress=0;next=index+direction;if(next<0||next>=data.length){direction*=-1;next=index+direction}const a=top(index);fromX=a.x;fromY=a.y;clock=.65}else if(phase==='hop'){progress=Math.min(1,progress+dt/.65);if(progress>=1){index=next;phase='work';clock=1.4+Math.random()*1.6}}data.forEach((d,i)=>{const working=phase==='work'&&i===index;const rate=(d.holding?28:0)+(working?19:0);if(rate>0){const lost=Math.min(d.v,rate*dt);d.v-=lost;shed+=lost;if(Math.random()<dt*11)fragment(d)}else d.v=Math.min(100,d.v+dt*(1.15+i*.16));d.fill.style.height=d.v+'%';d.fill.textContent=d.v>16?d.emoji:'';d.num.textContent=Math.round(d.v)});let x,y;if(phase==='work'){const p=top(index);x=p.x;y=p.y}else{const u=progress,landing=top(next);x=fromX+(landing.x-fromX)*u;y=fromY+(landing.y-fromY)*u-35*Math.sin(Math.PI*u)}cat.style.left=(x-18)+'px';cat.style.top=(y-33)+'px';cat.style.transform=direction===1?'scaleX(1)':'scaleX(-1)';document.getElementById('shed').textContent='🧹 '+Math.floor(shed)+' removed';document.getElementById('mode').textContent=phase==='hop'?'🐈 Hopping':'🐾 Excavating';requestAnimationFrame(frame)}document.getElementById('reset').onclick=()=>{data.forEach((d,i)=>{d.v=seeds[i][3];d.holding=false});shed=0;index=0;next=1;direction=1;phase='work';clock=1.8;debris.replaceChildren()};requestAnimationFrame(frame)})();
</script></body></html>
