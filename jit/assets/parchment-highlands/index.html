<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9bc8a"><title>Parchment Highlands · 3D Study</title><style>*{box-sizing:border-box}body{margin:0;background:#d9bc8a;font-family:system-ui;color:#57402b}main{max-width:900px;margin:auto;position:relative}#view{height:100dvh;min-height:360px}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:16px;left:16px;pointer-events:none;font-size:13px;font-weight:650;text-shadow:0 1px 2px #f7e7c7}.controls{position:absolute;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px}.controls span,.controls button{background:#f5e5c7df;border:1px solid #b79665;color:#614a30;border-radius:99px;padding:9px 12px}.controls button{cursor:pointer;font:inherit}</style></head><body><main><div id="view"></div><div class="hud">THE LITTLE HIGHLANDS · <span style="font-weight:400">a paper diorama</span></div><div class="controls"><span>Drag · orbit &nbsp; Wheel / pinch · zoom</span><button id="regrow">↻ Regrow forest</button></div></main><script type="module">
const viewport=document.querySelector('#view');
try{
const THREE=await import('https://esm.sh/three@0.170.0');
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9bc8a');scene.fog=new THREE.Fog('#d9bc8a',24,55);
const camera=new THREE.PerspectiveCamera(39,1,.1,100);let az=.75,el=.76,dist=20;const target=new THREE.Vector3(0,1,0);
function positionCamera(){camera.position.set(target.x+dist*Math.sin(az)*Math.cos(el),target.y+dist*Math.sin(el),target.z+dist*Math.cos(az)*Math.cos(el));camera.lookAt(target)}positionCamera();
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;viewport.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffe8c4,0x6c5541,2.1));const sun=new THREE.DirectionalLight(0xffe1b0,3.1);sun.position.set(-7,15,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;sun.shadow.bias=-.0003;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true});const paper=mat('#d9b88b'),soil=mat('#a48b69'),pine=['#294b39','#365c40','#456347','#536b49','#233f36'].map(mat),trunk=mat('#66503b');
function mesh(g,m,parent=scene){const o=new THREE.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const ground=mesh(new THREE.PlaneGeometry(120,120),paper);ground.rotation.x=-Math.PI/2;ground.position.y=-.23;ground.castShadow=false;
const plateau=mesh(new THREE.BoxGeometry(19,.38,13),paper);plateau.position.y=-.12;const rim=mesh(new THREE.BoxGeometry(19.04,.12,13.04),soil);rim.position.y=-.36;
let seed=1739;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function noise(x,z){return Math.sin(x*1.31+z*.72)*.23+Math.sin(x*2.81-z*1.67)*.11+Math.cos(z*3.11+x*.8)*.12}
const peaks=[[-4.7,-1.2,2.7,4.6,1],[-2.7,-2.4,2.6,6.2,2],[0,-2.3,3.2,7,3],[2.6,-1.7,2.7,5.4,4],[4.8,-1.1,2.1,3.6,5],[-3.4,.3,1.6,2.5,6],[1.4,.3,1.8,3.2,7],[4.2,.9,1.5,2.1,8]];
function peak(cx,cz,r,h,variant){const n=11,rings=5,verts=[],colors=[],indices=[];const low=new THREE.Color('#746d62'),mid=new THREE.Color('#aa9b88'),hi=new THREE.Color('#ddd7c9'),white=new THREE.Color('#f0eee6');
for(let j=0;j<=rings;j++){const t=j/rings;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,jag=1+Math.sin(a*3+variant)*.13+Math.cos(a*5-variant)*.09+noise(cx+Math.cos(a)*2,cz+Math.sin(a)*2)*.17,rr=r*(1-t)*jag,x=cx+Math.cos(a)*rr,z=cz+Math.sin(a)*rr,y=h*t+(1-t)*noise(x,z)*.35+(t>.7?Math.sin(a*4+variant)*.15:0);verts.push(x,y,z);const c=t>.78?white:t>.63?hi:t>.35?mid:low;colors.push(c.r,c.g,c.b)}}
for(let j=0;j<rings;j++)for(let i=0;i<n;i++){const a=j*n+i,b=j*n+(i+1)%n,c=(j+1)*n+i,d=(j+1)*n+(i+1)%n;indices.push(a,b,c,b,d,c)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(indices);g.computeVertexNormals();mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,side:THREE.DoubleSide}))}
peaks.forEach(p=>peak(...p));
const forest=new THREE.Group();scene.add(forest);const trunkGeo=new THREE.CylinderGeometry(.075,.11,.5,5),coneGeo=new THREE.ConeGeometry(1,1,6);
function tree(x,z,s){const group=new THREE.Group();group.position.set(x,0,z);forest.add(group);const stem=mesh(trunkGeo,trunk,group);stem.position.y=.24*s;stem.scale.setScalar(s);const shade=pine[Math.floor(rnd()*pine.length)];for(let i=0;i<3;i++){const foliage=mesh(coneGeo,shade,group),w=(.53-i*.105)*s,height=(1.05-i*.1)*s;foliage.scale.set(w,height,w);foliage.position.y=(.57+i*.37)*s;foliage.rotation.y=rnd()*Math.PI}group.rotation.y=rnd()*6.28}
function regrow(){while(forest.children.length){const c=forest.children[0];forest.remove(c)}seed=(seed+7177)>>>0;let placed=0;for(let i=0;i<650&&placed<175;i++){const x=(rnd()-.5)*17.5,z=(rnd()-.5)*11.5;if(peaks.some(([px,pz,r])=>Math.hypot(x-px,z-pz)<r*.85))continue;if(z>4.7&&rnd()>.45)continue;tree(x,z,.45+rnd()*.6);placed++}}
regrow();document.querySelector('#regrow').addEventListener('click',regrow);
const pointers=new Map();let pinch=null;
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null});
renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){az-=(e.clientX-old.x)*.007;el=Math.max(.18,Math.min(1.45,el+(e.clientY-old.y)*.005));positionCamera()}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch!==null){dist=Math.max(9,Math.min(36,dist*pinch/d));positionCamera()}pinch=d}});
for(const event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,e=>{pointers.delete(e.pointerId);pinch=null});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(9,Math.min(36,dist+e.deltaY*.012));positionCamera()},{passive:false});
const resize=()=>{const w=viewport.clientWidth,h=viewport.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)};const observer=new ResizeObserver(resize);observer.observe(viewport);resize();let running=true;function animate(){if(!running)return;renderer.render(scene,camera);requestAnimationFrame(animate)}animate();window.addEventListener('pagehide',()=>{running=false;observer.disconnect()},{once:true});
}catch(e){viewport.innerHTML='<div style="padding:80px 20px;text-align:center">3D renderer could not load: '+String(e.message||e)+'</div>'}
</script></body></html>
