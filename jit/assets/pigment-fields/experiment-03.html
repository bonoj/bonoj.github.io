<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material permeability</title><style>body{margin:0;background:#1c211d;color:#d9dfd2;font:14px system-ui}main{max-width:720px;margin:auto}canvas{width:100%;aspect-ratio:1.15;display:block}section{padding:16px;display:grid;gap:12px}input{width:100%;display:block;accent-color:#a6b59a}button{background:#384137;color:#eee;border:1px solid #626d5d;padding:9px 14px;border-radius:7px}a{color:#a6b59a}</style><main><canvas id="field"></canvas><section><div><button id="pause">Pause</button> <button id="mode">Pigment</button> <button id="reset">Reset</button></div><label>Permeability<input id="perm" type="range" min="0" max="100" value="80"></label><label>Branching complexity<input id="branch" type="range" min="0" max="100" value="65"></label><label>Geometric fusion<input id="fusion" type="range" min="0" max="100" value="30"></label><label>Pigment turbulence<input id="turb" type="range" min="0" max="100" value="60"></label><div id="status"></div><a href="./">Experiments</a></section></main><script>
const el=id=>document.getElementById(id),c=el('field'),gl=c.getContext('webgl2',{antialias:false});
if(!gl){el('status').textContent='WebGL2 unavailable';}else{
const vs=`#version 300 es
in vec2 p;
void main(){gl_Position=vec4(p,0.,1.);}`;
const fs=`#version 300 es
precision highp float;
out vec4 frag;
uniform vec2 res;
uniform float time,perm,branch,fusion,turb,mode;
float hash(vec3 p){
p=fract(p*.3183099+vec3(.1,.17,.23));p*=17.;
return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
float n(vec3 p){
vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fb(vec3 p){return .55*n(p)+.28*n(p*2.03)+.12*n(p*4.11)+.05*n(p*8.17);}
vec3 A(){return vec3(-.76+.34*sin(time*.62),.13+.14*sin(time*.91),.28*cos(time*.62));}
vec3 B(){return vec3(.76-.34*sin(time*.62),-.10+.18*cos(time*.91),-.28*cos(time*.62));}
vec2 distances(vec3 p){
vec3 a=p-A(),b=p-B();
return vec2(length(a)-.86+(fb(a*10.)-.5)*.075,length(b)-.79+(fb(b*11.)-.5)*.075);
}
float sdf(vec3 p){
vec2 d=distances(p);
float k=max(.0001,fusion*.65);
float h=max(k-abs(d.x-d.y),0.)/k;
return min(d.x,d.y)-h*h*k*.25;
}
vec3 normal(vec3 p){
vec2 e=vec2(.005,0.);
return normalize(vec3(sdf(p+e.xyy)-sdf(p-e.xyy),sdf(p+e.yxy)-sdf(p-e.yxy),sdf(p+e.yyx)-sdf(p-e.yyx)));
}
float material(vec3 p,vec2 d){
vec3 axis=normalize(B()-A());
vec3 q=p-(A()+B())*.5;
float longitudinal=dot(q,axis);
vec3 transverse=q-axis*longitudinal;
float scale=mix(3.,14.,branch);
vec3 warped=transverse*scale+axis*longitudinal*1.6;
warped+=turb*1.8*vec3(fb(q*5.),fb(q*5.+17.),fb(q*5.+41.));
float fingers=fb(warped);
float veins=1.-abs(2.*n(warped*2.3)-1.);
float invasion=(fingers-.5)*2.+(veins-.5)*.25*branch;
float proximity=exp(-max(0.,max(d.x,d.y))*.85);
float reach=perm*1.45*proximity;
float field=d.x-d.y+invasion*reach;
return smoothstep(-.025-perm*.035,.025+perm*.035,field);
}
void main(){
vec2 uv=(gl_FragCoord.xy-.5*res)/res.y;
vec3 ro=vec3(0.,.18,4.6),rd=normalize(vec3(uv*1.48,-1.));
float paper=n(vec3(gl_FragCoord.xy*.8,1.))-.5;
float wash=fb(vec3(uv*6.,3.));
vec3 bg=mix(vec3(.49,.53,.46),vec3(.85,.81,.69),clamp(uv.y+.5,0.,1.));
bg+=(wash-.5)*.12+paper*.045;
float shadow=exp(-pow(uv.x*2.4,2.)-pow((uv.y+.30)*13.,2.));
bg=mix(bg,vec3(.27,.32,.26),shadow*.25);
float z=0.,closest=10.;
vec3 p=ro;
bool hit=false;
for(int i=0;i<80;i++){
p=ro+rd*z;float d=sdf(p);closest=min(closest,d);
if(d<.0025){hit=true;break;}
z+=max(.003,d*.78);if(z>8.)break;
}
vec3 col=bg;
if(hit){
vec2 d=distances(p);
float m=material(p,d);
if(mode>.5&&mode<1.5)m=step(d.y,d.x);
vec3 norm=normal(p);
float l=dot(norm,normalize(vec3(-.6,.85,.7)))*.5+.5;
vec3 green=mix(vec3(.075,.19,.15),vec3(.67,.76,.43),l);
vec3 rust=mix(vec3(.31,.09,.055),vec3(.94,.67,.31),l);
vec3 ca=p-A(),cb=p-B();
float ga=fb(ca*24.),gb=fb(cb*23.+9.);
float strokeA=n(ca*vec3(42.,12.,23.)),strokeB=n(cb*vec3(19.,43.,14.));
green+=(ga-.5)*.29+(strokeA-.5)*.14;
rust+=(gb-.5)*.29+(strokeB-.5)*.14;
vec3 pigment=mix(green,rust,m);
float boundary=4.*m*(1.-m);
pigment=mix(pigment,vec3(.24,.23,.13)+l*.15,boundary*.20);
if(mode>1.5)pigment=mix(vec3(.12,.46,.30),vec3(.87,.37,.12),m);
float rim=abs(dot(norm,-rd));
float coverage=mix(.83,1.,smoothstep(0.,.22,rim));
col=mix(bg,pigment,coverage);
}else{
col=mix(bg,vec3(.43,.47,.33),exp(-closest/.018)*.18);
}
frag=vec4(clamp(col+paper*.024,0.,1.),1.);
}`;
function compile(type,src){
const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));
return s;
}
try{
const p=gl.createProgram();
gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(p);
if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));
gl.useProgram(p);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const u={};for(const k of ['res','time','perm','branch','fusion','turb','mode'])u[k]=gl.getUniformLocation(p,k);
let time=0,last=performance.now(),paused=false,mode=0;
el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Resume':'Pause';};
el('mode').onclick=()=>{mode=(mode+1)%3;el('mode').textContent=['Pigment','Geometric ownership','Material field'][mode];};
el('reset').onclick=()=>{time=0;mode=0;el('mode').textContent='Pigment';for(const [k,v] of Object.entries({perm:80,branch:65,fusion:30,turb:60}))el(k).value=v;};
function frame(now){
if(!paused)time+=Math.min(.05,(now-last)/1000);last=now;
const w=Math.max(1,Math.min(640,Math.round(c.clientWidth*1.4))),h=Math.max(1,Math.round(w/1.15));
if(c.width!==w||c.height!==h){c.width=w;c.height=h;gl.viewport(0,0,w,h);}
gl.uniform2f(u.res,w,h);gl.uniform1f(u.time,time);gl.uniform1f(u.mode,mode);
for(const k of ['perm','branch','fusion','turb'])gl.uniform1f(u[k],Number(el(k).value)/100);
gl.drawArrays(gl.TRIANGLES,0,3);
el('status').textContent='WebGL2 · Independent geometry and material fields · '+w+' × '+h;
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}catch(e){el('status').textContent=e.message;}
}
</script></html>
