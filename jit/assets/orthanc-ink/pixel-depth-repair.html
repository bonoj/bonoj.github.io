<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orthanc — Pixel Depth Repair</title><style>*{box-sizing:border-box}body{margin:0;background:#211c28;font:12px system-ui}#stage{width:100vw;height:100dvh;position:relative;overflow:hidden;touch-action:none;background:linear-gradient(#392d49,#a45156 68%,#211d2a)}canvas{width:100%;height:100%;display:block;touch-action:none}.heading{position:absolute;top:12px;left:12px;color:#ffe2b5;font-weight:700;letter-spacing:.12em;pointer-events:none}#status{position:absolute;top:34px;left:12px;color:#f5c59c;background:#17131ac9;padding:5px 7px;border-radius:5px;font:11px monospace}.controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #755d6d;border-radius:7px;background:#29232f;color:#ffe2b5;padding:10px;font:12px system-ui}#mode{border:0;background:#eab97f;color:#241b24;font-weight:700}</style><div id="stage"><canvas id="view"></canvas><div class="heading">ORTHANC / PIXEL DEPTH</div><div id="status">Initializing…</div><div class="controls"><button id="mode">Screen pixels</button><button id="res">240p</button><button id="sun">Turn sun</button><button id="orbit">Orbit OFF</button></div></div><script type="module">
const root=document.getElementById('stage'),canvas=document.getElementById('view'),status=document.getElementById('status');
let mode=0,res=240,auto=false,az=.55,el=.22,dist=31,sunAngle=0;
const names=['Screen pixels','Surface pixels','Smooth 3D'];
let T,renderer,scene,camera,sun,rt,screenScene,screenCamera,stoneMeshes=[],original=[],pixelMaterials=[],embers,torch,eg,emberPos,speed;
function resize(){if(!renderer||!camera||!rt)return;const w=Math.max(1,root.clientWidth),h=Math.max(1,root.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();rt.setSize(Math.max(1,Math.round(w*res/h)),res)}
function updateMaterials(){for(let i=0;i<stoneMeshes.length;i++)stoneMeshes[i].material=mode===1?pixelMaterials[i]:original[i];if(scene)scene.traverse(o=>{if(o.userData.surfacePixel)o.visible=mode===1})}
document.getElementById('mode').onclick=e=>{mode=(mode+1)%3;e.currentTarget.textContent=names[mode];updateMaterials();resize()};
document.getElementById('res').onclick=e=>{res=res===240?144:res===144?360:240;e.currentTarget.textContent=res+'p';resize()};
document.getElementById('sun').onclick=()=>{sunAngle+=Math.PI/3;if(sun)sun.position.set(-11*Math.cos(sunAngle),13,11*Math.sin(sunAngle)+7)};
document.getElementById('orbit').onclick=e=>{auto=!auto;e.currentTarget.textContent='Orbit '+(auto?'ON':'OFF')};
try{
T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
renderer=new T.WebGLRenderer({canvas,antialias:false});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;
scene=new T.Scene();scene.background=new T.Color('#673c4d');scene.fog=new T.FogExp2('#794153',.013);
camera=new T.PerspectiveCamera(37,1,.1,120);
scene.add(new T.HemisphereLight(0xb3a1b1,0x10101a,1.05));
sun=new T.DirectionalLight(0xff9870,3.2);sun.position.set(-11,13,7);scene.add(sun);
const blue=new T.DirectionalLight(0x657dbb,1.1);blue.position.set(9,8,-8);scene.add(blue);
torch=new T.PointLight(0xff772e,25,11,1.5);torch.position.set(0,2.5,3.3);scene.add(torch);
const stone=new T.MeshStandardMaterial({color:0x45434d,roughness:1,flatShading:true}),trim=new T.MeshStandardMaterial({color:0x68616b,roughness:1,flatShading:true}),dark=new T.MeshStandardMaterial({color:0x272b38,roughness:1,flatShading:true}),ground=new T.MeshStandardMaterial({color:0x39303c,roughness:1,flatShading:true}),black=new T.MeshBasicMaterial({color:0x0c0d16}),fire=new T.MeshBasicMaterial({color:0xffa447});
let seed=419;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function add(g,m,x=0,y=0,z=0,texture=true){const o=new T.Mesh(g,m);o.position.set(x,y,z);scene.add(o);if(texture){stoneMeshes.push(o);original.push(m);const shade=.65+rand()*.55;pixelMaterials.push(new T.MeshStandardMaterial({color:new T.Color(m.color).multiplyScalar(shade),roughness:1,flatShading:true}))}return o}
function box(w,h,d,x,y,z,m=stone,texture=true){return add(new T.BoxGeometry(w,h,d),m,x,y,z,texture)}
function taper(b,t,h,x,y,z,m=stone){const g=new T.BoxGeometry(1,1,1),p=g.attributes.position;for(let i=0;i<p.count;i++){const k=p.getY(i)<0?b:t;p.setXYZ(i,p.getX(i)*k,p.getY(i)*h,p.getZ(i)*k)}p.needsUpdate=true;g.computeVertexNormals();return add(g,m,x,y,z)}
add(new T.CylinderGeometry(6.7,7.2,.72,9),ground,0,-.48,0);taper(3.2,2.5,12.6,0,6.55,0);taper(2.5,2.05,2.5,0,14.1,0,trim);
box(3.5,.25,3.5,0,1,0,dark);box(2.8,.22,2.8,0,7.4,0,dark);box(2.45,.22,2.45,0,12.3,0,dark);
for(const x of [-1.13,1.13])for(const z of [-1.13,1.13]){taper(.78,.38,12.8,x,6.7,z,trim);taper(.38,.085,5.2,x,15.65,z,stone);taper(.085,.008,1.4,x,18.94,z,dark)}
for(const s of [-1,1]){taper(.72,.28,9.2,s*1.62,5.55,0,trim);taper(.72,.28,9.2,0,5.55,s*1.62,trim)}
taper(1.7,1.25,1.3,0,15.65,0,dark);taper(.22,.006,2,0,17.25,0,stone);
box(.85,1.85,.10,0,1.22,1.76,black,false);
for(const y of [4.2,6.1,8,9.9,11.4]){box(.16,.48,.08,0,y,1.61,black,false);box(.06,.22,.09,0,y,1.67,fire,false)}
for(let side=0;side<4;side++){const angle=side*Math.PI/2;for(let row=0;row<32;row++)for(let col=0;col<11;col++){if(rand()<.27)continue;const y=.55+row*.37,k=3.2-(y/13)*.7,across=(col-5)*.49,radius=k+.016,x=across*Math.cos(angle)+radius*Math.sin(angle),z=radius*Math.cos(angle)-across*Math.sin(angle),tone=.65+rand()*.7,mat=new T.MeshStandardMaterial({color:new T.Color('#55505d').multiplyScalar(tone),roughness:1});const chip=box(.44,.30,.045,x,y,z,mat,false);chip.rotation.y=angle;chip.userData.surfacePixel=true;chip.visible=false}}
emberPos=new Float32Array(120*3);speed=new Float32Array(120);
for(let i=0;i<120;i++){const a=rand()*Math.PI*2,r=1+rand()*7;emberPos[i*3]=Math.cos(a)*r;emberPos[i*3+1]=rand()*18;emberPos[i*3+2]=Math.sin(a)*r;speed[i]=.3+rand()}
eg=new T.BufferGeometry();eg.setAttribute('position',new T.BufferAttribute(emberPos,3));embers=new T.Points(eg,new T.PointsMaterial({color:0xffb26c,size:.085,transparent:true,opacity:.8,depthWrite:false}));scene.add(embers);
rt=new T.WebGLRenderTarget(320,240,{minFilter:T.NearestFilter,magFilter:T.NearestFilter});screenScene=new T.Scene();screenCamera=new T.OrthographicCamera(-1,1,1,-1,0,1);screenScene.add(new T.Mesh(new T.PlaneGeometry(2,2),new T.MeshBasicMaterial({map:rt.texture,depthTest:false,depthWrite:false,toneMapped:false})));
const pointers=new Map();canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});
canvas.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;if(pointers.size===1){az-=(e.clientX-p.x)*.008;el=Math.max(-.3,Math.min(.8,el+(e.clientY-p.y)*.005))}else if(pointers.size===2){const q=[...pointers].find(([id])=>id!==e.pointerId)[1];dist=Math.max(15,Math.min(55,dist+(Math.hypot(p.x-q.x,p.y-q.y)-Math.hypot(e.clientX-q.x,e.clientY-q.y))*.035))}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});
for(const type of ['pointerup','pointercancel'])canvas.addEventListener(type,e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(15,Math.min(55,dist+e.deltaY*.02))},{passive:false});
resize();new ResizeObserver(resize).observe(root);status.textContent='READY · 3D initialized';
let last=0,frames=0,start=0;
function frame(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(auto)az+=dt*.18;camera.position.set(Math.sin(az)*dist*Math.cos(el),8+dist*Math.sin(el),Math.cos(az)*dist*Math.cos(el));camera.lookAt(0,8,0);torch.intensity=22+3*Math.sin(t*.007);for(let i=0;i<120;i++){emberPos[i*3+1]+=dt*speed[i];if(emberPos[i*3+1]>19)emberPos[i*3+1]=0}eg.attributes.position.needsUpdate=true;if(mode===0){renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(screenScene,screenCamera)}else{renderer.setRenderTarget(null);renderer.render(scene,camera)}frames++;if(t-start>1200){status.textContent='READY · '+Math.round(frames*1000/(t-start))+' FPS · '+names[mode];frames=0;start=t}requestAnimationFrame(frame)}requestAnimationFrame(frame);
}catch(e){status.textContent='ERROR · '+e.message;console.error(e)}
</script></html>
