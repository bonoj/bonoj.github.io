<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e17"><title>Fullerene · 3D Shell</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e17;color:#e5edf5;font:14px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(20px,4vw,28px);margin:6px 0 14px}a{color:#93d7ed;text-decoration:none}.stage{position:relative;border:1px solid #28374a;border-radius:16px;overflow:hidden;background:#090e17}canvas{display:block;width:100%;height:min(65vh,560px);min-height:310px;touch-action:none}.overlay{position:absolute;pointer-events:none;color:#8b9bac;font-size:11px;letter-spacing:.08em}.top{top:14px;left:14px}.bottom{bottom:14px;left:14px}.right{bottom:14px;right:14px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0}label{font-size:13px;color:#acbdcd}label span{float:right;color:#e5edf5}input{display:block;width:100%;margin-top:10px;accent-color:#67cce9}.buttons{display:flex;align-items:center;flex-wrap:wrap;gap:10px}button{background:#182436;color:#e5edf5;border:1px solid #40536b;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer}.legend{font-size:12px;color:#a9b6c4;margin-left:auto}@media(max-width:460px){.right{display:none}.legend{width:100%}}
</style></head><body><main><header><h1>Fullerene · 3D Shell</h1><a href="../">Assets</a></header><div class="stage"><canvas id="view" aria-label="Rotatable three dimensional truncated icosahedron shell"></canvas><div class="overlay top">C₆₀ · TRUNCATED ICOSAHEDRON</div><div class="overlay bottom">Drag to rotate · Pinch to zoom</div><div class="overlay right">12 pentagons / 20 hexagons</div></div><div class="controls"><label>Rear opacity <span id="rear-value">12%</span><input id="rear" type="range" min="0" max="60" value="12"></label><label>Rotation speed <span id="speed-value">0.25</span><input id="speed" type="range" min="0" max="100" value="25"></label></div><div class="buttons"><button id="spin">Pause rotation</button><button id="reset">Reset view</button><span class="legend">Cyan: hexagons · Amber: pentagons</span></div></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d'),phi=(1+Math.sqrt(5))/2;
const base=[];for(const a of [-1,1])for(const b of [-1,1])base.push([0,a,b*phi],[a,b*phi,0],[a*phi,0,b]);
const norm=p=>{const l=Math.hypot(...p);return p.map(v=>v/l)},verts=base.map(norm),faces=[];
const edge=2/Math.sqrt(1+phi*phi),distance=(a,b)=>Math.hypot(...a.map((v,i)=>v-b[i]));
for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)for(let k=j+1;k<12;k++)if(Math.abs(distance(verts[i],verts[j])-edge)<1e-5&&Math.abs(distance(verts[j],verts[k])-edge)<1e-5&&Math.abs(distance(verts[k],verts[i])-edge)<1e-5){
const a=verts[i],b=verts[j],c=verts[k],u=b.map((v,t)=>v-a[t]),v=c.map((q,t)=>q-a[t]),n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],center=a.map((x,t)=>(x+b[t]+c[t])/3);faces.push(n.reduce((s,x,t)=>s+x*center[t],0)>0?[i,j,k]:[i,k,j]);}
const adjacency=Array.from({length:12},()=>new Set());for(const f of faces)for(let t=0;t<3;t++){let a=f[t],b=f[(t+1)%3];adjacency[a].add(b);adjacency[b].add(a)}
const nodes=[],nodeMap=new Map();function node(a,b){const key=a+','+b;if(!nodeMap.has(key)){nodeMap.set(key,nodes.length);nodes.push(norm(verts[a].map((x,t)=>(2*x+verts[b][t])/3)))}return nodeMap.get(key)}
const polys=[];for(const [a,b,c] of faces)polys.push({ids:[node(a,b),node(b,a),node(b,c),node(c,b),node(c,a),node(a,c)],kind:6});
for(let i=0;i<12;i++){const center=verts[i],ref=Math.abs(center[2])>.9?[0,1,0]:[0,0,1],ux=norm([ref[1]*center[2]-ref[2]*center[1],ref[2]*center[0]-ref[0]*center[2],ref[0]*center[1]-ref[1]*center[0]]),uy=[center[1]*ux[2]-center[2]*ux[1],center[2]*ux[0]-center[0]*ux[2],center[0]*ux[1]-center[1]*ux[0]];
const angle=j=>{const p=nodes[node(i,j)];return Math.atan2(p.reduce((s,x,t)=>s+x*uy[t],0),p.reduce((s,x,t)=>s+x*ux[t],0))};polys.push({ids:[...adjacency[i]].sort((a,b)=>angle(a)-angle(b)).map(j=>node(i,j)),kind:5})}
const edges=new Map();for(const p of polys)for(let i=0;i<p.ids.length;i++){const a=p.ids[i],b=p.ids[(i+1)%p.ids.length],key=[Math.min(a,b),Math.max(a,b)].join(',');if(!edges.has(key))edges.set(key,{a,b,kinds:[]});edges.get(key).kinds.push(p.kind)}
let yaw=.38,pitch=-.28,zoom=1,spin=true,rear=.12,speed=.25,last=0,drag=false,px=0,py=0;
function rotate(p){const [x,y,z]=p,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),xx=x*cy+z*sy,zz=-x*sy+z*cy;return [xx,y*cp-zz*sp,y*sp+zz*cp]}
function draw(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(spin&&!drag)yaw+=dt*speed*.5;
const w=canvas.clientWidth,h=canvas.clientHeight,d=Math.min(devicePixelRatio||1,2),cw=Math.round(w*d),ch=Math.round(h*d);if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);
const R=Math.min(w*.39,h*.41)*zoom,pts=nodes.map(rotate),screen=p=>{const perspective=3.9/(3.9-p[2]*.28);return [w/2+p[0]*R*perspective,h/2-p[1]*R*perspective]},projected=pts.map(screen);
const sorted=polys.map(p=>{const center=[0,0,0];for(const id of p.ids)for(let k=0;k<3;k++)center[k]+=pts[id][k]/p.ids.length;return {...p,center}}).sort((a,b)=>a.center[2]-b.center[2]);
for(const p of sorted){if(p.center[2]<0)continue;ctx.beginPath();p.ids.forEach((id,i)=>{const [x,y]=projected[id];i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=p.kind===5?'rgba(244,170,75,.13)':'rgba(80,195,229,.035)';ctx.fill()}
for(const e of [...edges.values()].map(e=>({...e,z:(pts[e.a][2]+pts[e.b][2])/2})).sort((a,b)=>a.z-b.z)){const f=Math.max(0,Math.min(1,(e.z+.18)/.42)),alpha=rear+(1-rear)*f,pent=e.kinds.includes(5);ctx.strokeStyle=pent?'rgba(255,183,96,'+alpha+')':'rgba(105,217,245,'+(alpha*.93)+')';ctx.lineWidth=f>.5?1.8:1.15;ctx.beginPath();ctx.moveTo(...projected[e.a]);ctx.lineTo(...projected[e.b]);ctx.stroke()}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
const pointers=new Map();let pinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);drag=true;px=e.clientX;py=e.clientY});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,[e.clientX,e.clientY]);const arr=[...pointers.values()];if(arr.length===2){const dist=Math.hypot(arr[0][0]-arr[1][0],arr[0][1]-arr[1][1]);if(pinch)zoom=Math.max(.55,Math.min(2,zoom*dist/pinch));pinch=dist}else if(arr.length===1){yaw+=(e.clientX-px)*.009;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-py)*.009));px=e.clientX;py=e.clientY}});
function end(e){pointers.delete(e.pointerId);pinch=0;drag=pointers.size>0;if(drag){const p=[...pointers.values()][0];px=p[0];py=p[1]}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2,zoom*Math.exp(-e.deltaY*.001)))},{passive:false});
$('rear').addEventListener('input',e=>{rear=+e.target.value/100;$('rear-value').textContent=e.target.value+'%'});$('speed').addEventListener('input',e=>{speed=+e.target.value/100;$('speed-value').textContent=speed.toFixed(2)});
$('spin').onclick=e=>{spin=!spin;e.target.textContent=spin?'Pause rotation':'Resume rotation'};$('reset').onclick=()=>{yaw=.38;pitch=-.28;zoom=1};
})();
</script></body></html>
