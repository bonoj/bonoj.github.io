<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fractal Highlands · Ridged Sphere</title><style>body{margin:0;background:#08120f;color:#c9e8d8;font:12px system-ui}canvas{width:100%;height:78vh;display:block;touch-action:none}header,footer{padding:12px}footer{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#12221c}input{accent-color:#79d6a6}button{background:#12221c;color:inherit;border:1px solid #537361;border-radius:6px;padding:6px 10px}a{color:#a8efc7}</style></head><body><header>FRACTAL HIGHLANDS / RIDGED SPHERE <span id="status">Initializing…</span></header><canvas id="canvas"></canvas><footer><label>Octaves <input id="oct" type="range" min="1" max="10" value="7"></label><label>Roughness <input id="rough" type="range" min="25" max="85" value="60"></label><label>Relief <input id="relief" type="range" min="20" max="220" value="125"></label><label>Frequency <input id="freq" type="range" min="50" max="240" value="125"></label><label><input id="wire" type="checkbox"> Wireframe</label><button id="seed">New seed</button><button id="reset">Reset</button><a href="../">Assets</a></footer><script type="module">
const canvas=document.getElementById('canvas'),status=document.getElementById('status');
try{
let T;try{T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js')}catch(e){T=await import('https://esm.sh/three@0.170.0')}
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=T.SRGBColorSpace;
const scene=new T.Scene();scene.background=new T.Color(0x091813);const camera=new T.PerspectiveCamera(45,1,.1,300);scene.add(new T.HemisphereLight(0xc9ebdb,0x13211b,1.8));const sun=new T.DirectionalLight(0xffebbd,3.2);sun.position.set(-22,30,28);scene.add(sun);
const R=17,phi=(1+Math.sqrt(5))/2;let verts=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]];verts=verts.map(v=>{const l=Math.hypot(...v);return v.map(n=>n/l)});
let faces=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
for(let level=0;level<6;level++){const mids=new Map(),next=[];function midpoint(a,b){const key=Math.min(a,b)+','+Math.max(a,b);if(mids.has(key))return mids.get(key);const v=verts[a].map((x,i)=>x+verts[b][i]),l=Math.hypot(...v),id=verts.length;verts.push(v.map(x=>x/l));mids.set(key,id);return id}for(const [a,b,c] of faces){const ab=midpoint(a,b),bc=midpoint(b,c),ca=midpoint(c,a);next.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca])}faces=next}
const directions=new Float32Array(verts.flat()),positions=new Float32Array(directions.length),colors=new Float32Array(directions.length),geom=new T.BufferGeometry();geom.setAttribute('position',new T.BufferAttribute(positions,3));geom.setAttribute('color',new T.BufferAttribute(colors,3));geom.setIndex(faces.flat());const mat=new T.MeshStandardMaterial({vertexColors:true,roughness:1,metalness:0,side:T.DoubleSide});scene.add(new T.Mesh(geom,mat));
let seed=19;function hash(x,y,z){let a=Math.sin(x*127.1+y*311.7+z*74.7+seed*71.13)*43758.5453;return (a-Math.floor(a))*2-1}
function noise(x,y,z){const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z),fx=x-ix,fy=y-iy,fz=z-iz,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy),sz=fz*fz*(3-2*fz),lerp=(a,b,t)=>a+(b-a)*t;function plane(z0){return lerp(lerp(hash(ix,iy,z0),hash(ix+1,iy,z0),sx),lerp(hash(ix,iy+1,z0),hash(ix+1,iy+1,z0),sx),sy)}return lerp(plane(iz),plane(iz+1),sz)}
const oct=document.getElementById('oct'),rough=document.getElementById('rough'),relief=document.getElementById('relief'),freq=document.getElementById('freq'),wire=document.getElementById('wire'),c=new T.Color();
function build(){const count=+oct.value,r=+rough.value/100,scale=+relief.value/100,fscale=+freq.value/100;for(let i=0;i<verts.length;i++){const nx=directions[i*3],ny=directions[i*3+1],nz=directions[i*3+2],x=nx*22,y=ny*22,z=nz*22,warp=noise(x*.045,y*.045,z*.045)*2.2,fold=Math.sin(x*.13+warp)*Math.cos(z*.12+y*.035);let h=fold*2.7,amp=3.4,f=.075*fscale;for(let k=0;k<count;k++){const v=noise(x*f+13*k,y*f-7*k,z*f+5*k),ridge=1-Math.abs(v);h+=amp*(ridge*ridge-.34);amp*=r;f*=2}h*=scale;const rad=R+h;positions[i*3]=nx*rad;positions[i*3+1]=ny*rad;positions[i*3+2]=nz*rad;const slopeColor=T.MathUtils.clamp((h+5)/14,0,1);if(h>8*scale)c.setRGB(.69,.72,.67);else if(h>4*scale)c.setRGB(.41,.48,.40);else if(h>0)c.setRGB(.25,.38,.30);else c.setRGB(.14,.27,.22);c.multiplyScalar(.8+slopeColor*.3);colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b}geom.attributes.position.needsUpdate=true;geom.attributes.color.needsUpdate=true;geom.computeVertexNormals();geom.computeBoundingSphere();status.textContent=faces.length.toLocaleString()+' triangles · '+verts.length.toLocaleString()+' shared vertices · '+count+' octaves'}
build();[oct,rough,relief,freq].forEach(el=>el.addEventListener('input',build));wire.addEventListener('change',()=>mat.wireframe=wire.checked);document.getElementById('seed').onclick=()=>{seed+=137;build()};
let az=.75,el=.35,dist=57,drag=null;function cam(){camera.position.set(dist*Math.cos(el)*Math.cos(az),dist*Math.sin(el),dist*Math.cos(el)*Math.sin(az));camera.lookAt(0,0,0)}cam();
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=Math.max(-1.48,Math.min(1.48,el+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY];cam()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(21,Math.min(125,dist*Math.exp(e.deltaY*.001)));cam()},{passive:false});document.getElementById('reset').onclick=()=>{az=.75;el=.35;dist=57;cam()};
function tick(){requestAnimationFrame(tick);const w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h&&(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio()))){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}renderer.render(scene,camera)}tick();
}catch(e){status.textContent='Renderer error: '+e.message;status.style.color='#ffb0a0'}
</script></body></html>
