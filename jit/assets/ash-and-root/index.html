<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d14"><title>Ash and Root</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d14}main{position:relative;width:100%;height:100dvh;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.controls{position:absolute;bottom:calc(13px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:none}button{pointer-events:auto;width:45px;height:45px;border-radius:50%;border:1px solid #caa47866;background:#17131baf;color:#f4d4a2;font-size:20px;backdrop-filter:blur(8px)}</style></head><body><main><canvas id="scene"></canvas><div class="controls"><button id="seed" aria-label="Regrow">↺</button><button id="wind" aria-label="Wind">≋</button><button id="fire" aria-label="Fire">♨</button><button id="pause" aria-label="Pause">Ⅱ</button></div></main><script>
(()=>{'use strict';const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,t=0,last=performance.now(),paused=false,wind=1,fire=1,seed=741,segments=[],embers=[],sand=[],touches=new Map(),pulses=[];const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(1.5,devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);init()}new ResizeObserver(resize).observe(canvas);
function hash(n){let v=Math.sin(n*127.1+seed*.113)*43758.5453;return v-Math.floor(v)}
function add(x,y,angle,len,width,depth,parent,kind){let s={x,y,angle,len,width,depth,parent,kind,age:rnd(0,18),burn:0,children:[],phase:rnd(0,6.28),id:segments.length};segments.push(s);if(parent!==null)segments[parent].children.push(s.id);return s.id}
function branch(parent,angle,len,width,depth,kind){let p=segments[parent],ex=p.x+Math.cos(p.angle)*p.len,ey=p.y+Math.sin(p.angle)*p.len;return add(ex,ey,angle,len,width,depth,parent,kind)}
function growTree(parent,depth,spread){if(depth<=0||segments.length>850)return;let p=segments[parent],dir=p.angle,base=p.len;for(let k=0;k<2;k++){let a=dir+(k?1:-1)*(.18+hash(p.id*9+k)*spread),id=branch(parent,a,base*(.67+hash(p.id*5+k)*.16),p.width*.72,depth,'stone');growTree(id,depth-1,spread*.9)}if(depth>2&&hash(p.id*11)>.6){let id=branch(parent,dir+(.5-hash(p.id*2))*.2,base*.75,p.width*.62,depth-1,'stone');growTree(id,depth-2,spread*.7)}}
function init(){segments=[];embers=[];sand=[];pulses=[];let ground=h*.87;for(let i=0;i<9;i++){let x=w*(.1+i*.1),height=h*(.23+hash(i+8)*.3),lean=(hash(i+3)-.5)*.22;let root=add(x,ground,-Math.PI/2+lean,height*.29,9+hash(i)*11,5,null,'trunk'),prev=root;for(let j=0;j<3;j++)prev=branch(prev,-Math.PI/2+lean+(hash(i*5+j)-.5)*.13,height*.21,(8+hash(i)*11)*(1-j*.19),4-j,'trunk');growTree(prev,3+(i%2),.65)}for(let i=0;i<240;i++)sand.push({x:rnd(0,w),y:rnd(h*.12,h),vx:rnd(.4,1.7),r:rnd(.35,1.2),a:rnd(.06,.35)})}
function line(x1,y1,x2,y2,width,color){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function draw(){let horizon=h*.87,sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#171426');sky.addColorStop(.42,'#533a45');sky.addColorStop(.75,'#b57852');sky.addColorStop(1,'#4a302c');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);let glow=ctx.createRadialGradient(w*.65,h*.64,0,w*.65,h*.64,w*.8);glow.addColorStop(0,'#ffb36445');glow.addColorStop(1,'#ffb36400');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);ctx.fillStyle='#3c2929';ctx.beginPath();ctx.moveTo(0,horizon);for(let x=0;x<=w;x+=5)ctx.lineTo(x,horizon+Math.sin(x*.014+seed)*7+Math.sin(x*.052)*3);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.save();for(const s of segments){let growth=clamp(s.age/8,0,1),ex=s.x+Math.cos(s.angle)*s.len*growth,ey=s.y+Math.sin(s.angle)*s.len*growth,heat=s.burn,stone=heat>.7?'#36282b':heat>.25?'#6b443e':'#aa8d72';line(s.x+2,s.y+2,ex+2,ey+2,s.width+3,'#271e27');line(s.x,s.y,ex,ey,s.width,stone);line(s.x-s.width*.13,s.y,ex-s.width*.13,ey,Math.max(.5,s.width*.17),'#e1bf9670');if(s.kind==='trunk'&&s.depth>=2){let dx=Math.cos(s.angle),dy=Math.sin(s.angle),nx=-dy,ny=dx;for(let k=1;k<=3;k++){let q=k/4,x=s.x+dx*s.len*q,y=s.y+dy*s.len*q;line(x-nx*s.width*.38,y-ny*s.width*.38,x+nx*s.width*.38,y+ny*s.width*.38,1.2,'#372d32a0')}}if(heat>.08){let alpha=Math.min(1,heat*1.3);line(s.x,s.y,ex,ey,Math.max(1,s.width*.22),'rgba(255,113,42,'+(alpha*.65)+')');if(heat>.45){ctx.fillStyle='rgba(255,196,82,'+(alpha*.5)+')';ctx.beginPath();ctx.arc(ex,ey,Math.max(1,s.width*.28),0,Math.PI*2);ctx.fill()}}}ctx.restore();for(let p of sand){ctx.fillStyle='rgba(247,208,159,'+p.a+')';ctx.fillRect(p.x,p.y,p.r*2,p.r*.6)}for(let p of embers){ctx.fillStyle='rgba(255,'+Math.floor(90+p.life*130)+',52,'+Math.min(1,p.life)+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}for(let p of pulses){ctx.strokeStyle='rgba(255,210,137,'+(p.life*.4)+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,(1-p.life)*90,0,Math.PI*2);ctx.stroke()}}
function update(dt){t+=dt;for(const s of segments){s.age+=dt*.8;let ex=s.x+Math.cos(s.angle)*s.len,ey=s.y+Math.sin(s.angle)*s.len,heat=.003*fire*dt;for(const p of pulses){let dist=Math.hypot(ex-p.x,ey-p.y);if(dist<100)heat+=dt*fire*.65*(1-dist/100)}if(s.burn>0)heat+=dt*fire*.025;if(s.parent!==null&&segments[s.parent].burn>.25)heat+=dt*fire*.025;s.burn=clamp(s.burn+heat-dt*.003,0,1);if(s.burn>.3&&Math.random()<dt*(.5+s.burn*2)&&embers.length<300)embers.push({x:ex,y:ey,vx:rnd(-13,13)+wind*12,vy:rnd(-35,-10),r:rnd(.6,2.2),life:rnd(.5,1.5)})}for(let p of sand){p.x+=dt*(wind*38+p.vx*12);p.y+=Math.sin(t*2+p.x*.02)*dt*5;if(p.x>w+5)p.x=-5;if(p.x< -5)p.x=w+5}for(let p of embers){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*.5}embers=embers.filter(p=>p.life>0);for(let p of pulses)p.life-=dt*.6;pulses=pulses.filter(p=>p.life>0)}
function perturb(e){let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;pulses.push({x,y,life:1});for(let s of segments){if(Math.hypot(s.x-x,s.y-y)<95){s.age+=2;s.burn=clamp(s.burn+.13*fire,0,1)}}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,performance.now());perturb(e)});canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;if(performance.now()-touches.get(e.pointerId)>70){touches.set(e.pointerId,performance.now());perturb(e)}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,e=>touches.delete(e.pointerId));document.querySelector('#seed').onclick=()=>{seed+=137;init()};document.querySelector('#wind').onclick=()=>{wind=wind===1?2:wind===2?-1:1};document.querySelector('#fire').onclick=()=>{fire=fire===1?2:fire===2?.25:1};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)update(dt);draw();requestAnimationFrame(frame)}resize();requestAnimationFrame(frame);
})();
</script></body></html>
