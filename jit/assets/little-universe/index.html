<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Little Universe · JIT</title><style>*{box-sizing:border-box}body{margin:0;background:#050710;color:#dce5ff;font:13px system-ui}#stage{position:relative;width:100vw;height:100dvh;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;top:16px;left:16px;pointer-events:none}.top b{font-size:16px;letter-spacing:.09em}.top small{display:block;opacity:.65;margin-top:5px}.actions{position:absolute;right:14px;top:14px;display:flex;gap:7px}.bottom{position:absolute;bottom:12px;left:12px;right:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.hint{position:absolute;bottom:65px;text-align:center;width:100%;pointer-events:none;color:#98a9c8;font-size:12px}button{background:#1b2440;color:#fff;border:1px solid #485477;border-radius:8px;padding:9px 12px}input{flex:1;min-width:65px;accent-color:#9baeff}</style><div id="stage"><canvas id="view"></canvas><div class="top"><b>LITTLE UNIVERSE</b><small id="status">Newtonian gravity</small></div><div class="actions"><button id="pause">Pause</button><button id="reset">Reset</button></div><div class="hint">Drag empty space to launch a world · tap a body to select</div><div class="bottom">Gravity <input id="gravity" type="range" min="0" max="200" value="100"> Speed <input id="speed" type="range" min="10" max="250" value="100"><button id="clear">Clear</button></div></div><script>
(()=>{'use strict';const root=document.querySelector('#stage'),canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),gravity=document.querySelector('#gravity'),speed=document.querySelector('#speed');let W=0,H=0,bodies=[],drag=null,selected=null,paused=false,last=0,frame=0;const G=1150,soft=9,colors=['#e5a36b','#87baf8','#b0a1ec','#8dd8c5','#f1c4c8','#d9d2a5'];function resize(){const r=root.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}function body(x,y,vx,vy,m,col){return{x,y,vx,vy,m,r:Math.max(3,Math.cbrt(m)*2.2),col,trail:[]}}function reset(){selected=null;bodies=[body(W*.5,H*.5,0,0,3500,'#ffce81'),body(W*.5+120,H*.5,0,-Math.sqrt(G*3500/120),18,'#80b8ff'),body(W*.5-185,H*.5,0,Math.sqrt(G*3500/185),11,'#b2a4fa')];bodies[0].r=19;bodies[1].r=6;bodies[2].r=5}function merge(a,b){let m=a.m+b.m,o=body((a.x*a.m+b.x*b.m)/m,(a.y*a.m+b.y*b.m)/m,(a.vx*a.m+b.vx*b.m)/m,(a.vy*a.m+b.vy*b.m)/m,m,a.m>=b.m?a.col:b.col);o.trail=a.m>=b.m?a.trail:b.trail;return o}function step(dt){const n=bodies.length,ax=new Float64Array(n),ay=new Float64Array(n),strength=+gravity.value/100;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=bodies[i],b=bodies[j],dx=b.x-a.x,dy=b.y-a.y,r2=dx*dx+dy*dy+soft*soft,f=G*strength/(r2*Math.sqrt(r2));ax[i]+=dx*f*b.m;ay[i]+=dy*f*b.m;ax[j]-=dx*f*a.m;ay[j]-=dy*f*a.m}for(let i=0;i<n;i++){let b=bodies[i];b.vx+=ax[i]*dt;b.vy+=ay[i]*dt;b.x+=b.vx*dt;b.y+=b.vy*dt}for(let i=bodies.length-1;i>=0;i--){let collided=false;for(let j=i-1;j>=0;j--){const a=bodies[i],b=bodies[j];if(Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r*.75){const o=merge(a,b);if(selected===a||selected===b)selected=o;bodies.splice(i,1);bodies.splice(j,1,o);collided=true;break}}if(collided)i=Math.min(i,bodies.length)}}function draw(){ctx.fillStyle='#050710';ctx.fillRect(0,0,W,H);ctx.fillStyle='#29344d';for(let x=18;x<W;x+=38)for(let y=22;y<H;y+=38){let v=Math.sin(x*17.1+y*3.7)*43758.5453;v-=Math.floor(v);ctx.globalAlpha=.13+v*.24;ctx.fillRect(x+v*7,y,1.2,1.2)}ctx.globalAlpha=1;for(const b of bodies){if(b.trail.length>1){ctx.beginPath();ctx.moveTo(...b.trail[0]);for(let k=1;k<b.trail.length;k++)ctx.lineTo(...b.trail[k]);ctx.strokeStyle=b.col;ctx.globalAlpha=.32;ctx.lineWidth=1.1;ctx.stroke();ctx.globalAlpha=1}}for(const b of bodies){let g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*3.2);g.addColorStop(0,b.col+'aa');g.addColorStop(.4,b.col+'35');g.addColorStop(1,'#00000000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r*3.2,0,Math.PI*2);ctx.fill();g=ctx.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,0,b.x,b.y,b.r);g.addColorStop(0,'#fff');g.addColorStop(.18,b.col);g.addColorStop(1,'#20263b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();if(b===selected){ctx.strokeStyle='#ffffff88';ctx.beginPath();ctx.arc(b.x,b.y,b.r+7,0,Math.PI*2);ctx.stroke()}}if(drag){ctx.strokeStyle='#dce5ff';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(drag.x,drag.y);ctx.lineTo(drag.toX,drag.toY);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(drag.x,drag.y,5,0,Math.PI*2);ctx.stroke()}status.textContent='Newtonian gravity · '+bodies.length+' bodies'+(paused?' · paused':'')}function loop(t){const dt=Math.min((t-last)/1000||.016,.04);last=t;if(!paused){for(let i=0;i<5;i++)step(dt*(+speed.value/100)/5);if(++frame%2===0)for(const b of bodies){b.trail.push([b.x,b.y]);if(b.trail.length>210)b.trail.shift()}}draw();requestAnimationFrame(loop)}function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);let p=point(e),hit=bodies.find(b=>Math.hypot(b.x-p.x,b.y-p.y)<Math.max(b.r+10,18));if(hit){selected=selected===hit?null:hit;drag=null}else drag={x:p.x,y:p.y,toX:p.x,toY:p.y}});canvas.addEventListener('pointermove',e=>{if(drag){let p=point(e);drag.toX=p.x;drag.toY=p.y}});canvas.addEventListener('pointerup',e=>{if(!drag)return;let p=point(e),b=body(drag.x,drag.y,-(p.x-drag.x)*1.2,-(p.y-drag.y)*1.2,25,colors[Math.floor(Math.random()*colors.length)]);b.r=6;bodies.push(b);drag=null});canvas.addEventListener('pointercancel',()=>drag=null);document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};document.querySelector('#reset').onclick=reset;document.querySelector('#clear').onclick=()=>{bodies=[];selected=null};new ResizeObserver(()=>{let old=W;resize();if(!old)reset()}).observe(root);resize();reset();requestAnimationFrame(loop)})();
</script></html>
