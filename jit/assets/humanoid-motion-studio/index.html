<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171c25"><title>Humanoid Motion Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#10141c;color:#e8f1f5;font:14px system-ui}main{max-width:900px;margin:auto;padding:12px}h1{font-size:21px;margin:6px 0 10px}.stage{height:min(65vh,580px);min-height:320px;position:relative;overflow:hidden;border-radius:12px;background:#171c25;touch-action:none;user-select:none}.view{position:absolute;inset:0;touch-action:none}.status{position:absolute;top:12px;left:12px;background:#10151cdd;padding:7px 10px;border-radius:7px;font-size:12px;pointer-events:none}.hint{position:absolute;bottom:10px;left:12px;color:#dce6ee;font-size:11px;pointer-events:none}.motions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}button{background:#303c4c;color:#eef5fa;border:1px solid #596b7b;border-radius:8px;padding:10px 5px;font:12px system-ui;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{background:#34718b;border-color:#80c7df}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0;font-size:12px}input{width:100%;accent-color:#5cabc6}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.bottom>div{display:flex;gap:6px}a{color:#a9d8eb}</style></head><body><main><h1>Humanoid Motion Studio</h1><div class="stage" id="stage"><div class="view" id="view"></div><div class="status" id="status">Loading skeletal character…</div><div class="hint">Drag to orbit · Pinch to zoom · Wheel to zoom</div></div><div class="motions" id="motions"><button data-motion="Idle">Idle</button><button data-motion="Walking">Walk</button><button data-motion="Running">Run</button><button data-motion="Jump">Jump</button><button data-motion="Wave">Wave</button><button data-motion="Dance">Dance</button><button data-motion="Punch">Punch</button><button data-motion="Sitting">Sit</button></div><div class="sliders"><label>Speed <span id="speedtext">1.00×</span><input id="speed" type="range" min=".25" max="2" step=".05" value="1"></label><label>Crossfade <span id="fadetext">0.25 s</span><input id="fade" type="range" min="0" max="1" step=".05" value=".25"></label></div><div class="bottom"><span id="motionlabel">Idle</span><div><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="reset">Reset view</button></div></div><p style="font-size:11px;opacity:.65">Three.js RobotExpressive GLB · skeletal clips · requires network access</p></main><script type="module">
const stage=document.querySelector('#stage'),view=document.querySelector('#view'),status=document.querySelector('#status');
let renderer,scene,camera,mixer,clock,actions={},active=null,ready=false,frame=0;
let selected='Idle',speed=1,fade=.25,yaw=.55,pitch=.2,radius=7.5;
const pointers=new Map();let previousPinch=null;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function updateCamera(){if(!camera)return;const cp=Math.cos(pitch);camera.position.set(radius*Math.sin(yaw)*cp,1.1+radius*Math.sin(pitch),radius*Math.cos(yaw)*cp);camera.lookAt(0,1.1,0)}
function zoom(delta){radius=clamp(radius*Math.exp(delta),2.3,15);updateCamera()}
stage.addEventListener('pointerdown',e=>{e.preventDefault();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});previousPinch=null},{passive:false});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...pointers.values()];if(pts.length===1){yaw-=(e.clientX-old.x)*.009;pitch=clamp(pitch+(e.clientY-old.y)*.006,-.35,1.25);updateCamera()}else if(pts.length>=2){const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(previousPinch!==null&&previousPinch>0)zoom(Math.log(previousPinch/Math.max(d,1)));previousPinch=d}},{passive:false});
function endPointer(e){pointers.delete(e.pointerId);previousPinch=null}
for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,endPointer);
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY*.001)},{passive:false});
document.querySelector('#minus').onclick=()=>zoom(.18);document.querySelector('#plus').onclick=()=>zoom(-.18);
document.querySelector('#reset').onclick=()=>{yaw=.55;pitch=.2;radius=7.5;updateCamera()};
document.querySelector('#speed').oninput=e=>{speed=+e.target.value;document.querySelector('#speedtext').textContent=speed.toFixed(2)+'×'};
document.querySelector('#fade').oninput=e=>{fade=+e.target.value;document.querySelector('#fadetext').textContent=fade.toFixed(2)+' s'};
function play(name){selected=name;document.querySelector('#motionlabel').textContent=name;document.querySelectorAll('[data-motion]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.motion===name)));if(!ready)return;const next=actions[name];if(!next){status.textContent='Animation unavailable: '+name;return}if(next===active)return;next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1);if(active&&fade>0){next.play();active.crossFadeTo(next,fade,true)}else{active?.stop();next.play()}active=next;status.textContent='Skeletal animation · '+name}
document.querySelectorAll('[data-motion]').forEach(b=>b.onclick=()=>play(b.dataset.motion));play('Idle');
try{const THREE=await import('https://esm.sh/three@0.160.1');const {GLTFLoader}=await import('https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js');
scene=new THREE.Scene();scene.background=new THREE.Color('#171c25');camera=new THREE.PerspectiveCamera(38,1,.1,100);updateCamera();renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;view.appendChild(renderer.domElement);renderer.domElement.style.cssText='width:100%;height:100%;display:block;touch-action:none';
scene.add(new THREE.HemisphereLight(0xe1efff,0x4c5262,2.3));const key=new THREE.DirectionalLight(0xffe6c9,3.4);key.position.set(-3,7,5);scene.add(key);const rim=new THREE.DirectionalLight(0x79baff,1.4);rim.position.set(4,3,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(5,64),new THREE.MeshStandardMaterial({color:0x29323c,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);const grid=new THREE.GridHelper(9,18,0x49515e,0x323b48);grid.position.y=.005;scene.add(grid);
const gltf=await new GLTFLoader().loadAsync('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb');const model=gltf.scene;scene.add(model);model.traverse(o=>{if(o.isMesh)o.frustumCulled=false});mixer=new THREE.AnimationMixer(model);
for(const clip of gltf.animations){const action=mixer.clipAction(clip);if(['Jump','Wave','Punch'].includes(clip.name)){action.setLoop(THREE.LoopOnce,1);action.clampWhenFinished=true}actions[clip.name]=action}
clock=new THREE.Clock();ready=true;play('Idle');
new ResizeObserver(()=>{const w=view.clientWidth,h=view.clientHeight;if(w&&h){camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}}).observe(view);
function animate(){frame=requestAnimationFrame(animate);mixer.timeScale=speed;mixer.update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera)}animate();
}catch(e){status.textContent='3D failed: '+(e?.message||e)}
</script></body></html>
