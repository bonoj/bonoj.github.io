<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matter Lab 002 — Emergent Structures</title><style>body{background:#101719;color:#e5efec;font:12px monospace;margin:0}main{max-width:1050px;margin:auto;padding:12px}canvas{width:100%;height:min(65vh,610px);display:block;touch-action:none;border-radius:10px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}button{background:#27383a;color:inherit;border:1px solid #57716f;border-radius:7px;padding:11px 4px}button.active{background:#39766d}section{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input{flex:1;min-width:75px}p{line-height:1.6}</style><main><h2>Matter Lab 002 / Emergent Structures</h2><canvas id="c"></canvas><nav id="tabs"></nav><section>Energy<input id="energy" type="range" min="0" max="100" value="60">Scale<input id="scale" type="range" min="1" max="5" value="3"><button id="reset">Reseed</button><button id="pause">Pause</button></section><p id="desc"></p><small id="status"></small></main><script>
(()=>{const c=document.querySelector('#c'),ctx=c.getContext('2d',{alpha:false}),tabs=document.querySelector('#tabs'),energy=document.querySelector('#energy'),scale=document.querySelector('#scale'),desc=document.querySelector('#desc'),status=document.querySelector('#status');const names=['Stress Fracture','Territory Wars','Wave Interference','Crystal Accretion','Granular Collapse','Ant Trail Ecology'],descs=['Stochastic damage propagates through a loaded brittle sheet. Touch to fracture.','Competing cellular colonies invade neighboring territories. Touch to plant a colony.','Superposed radial oscillations create interference fringes. Touch to add an emitter.','Random walkers adhere to a solid and produce dendritic growth. Touch to nucleate.','Conservative cellular sandpile redistributes overloaded cells. Touch to deposit.','Foragers lay and follow competing pheromone trails between nest and food. Touch to feed.'];let W=240,H=165,N=W*H,mode=0,tick=0,paused=false,down=false,seed=1,agents=[],sources=[],a,b,d,buffer=document.createElement('canvas');buffer.width=W;buffer.height=H;let bc=buffer.getContext('2d'),img=bc.createImageData(W,H),px=img.data;let rng=12345;function rand(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return(rng>>>0)/4294967296}const id=(x,y)=>((y+H)%H)*W+((x+W)%W),cl=x=>Math.max(0,Math.min(1,x));function noise(x,y){return (Math.sin(x*.131+y*.273+seed)+Math.sin(x*.049-y*.084+seed*2)+2)/4}function splat(x,y,r,fn){for(let yy=Math.max(1,Math.floor(y-r));yy<Math.min(H-1,Math.ceil(y+r));yy++)for(let xx=Math.max(1,Math.floor(x-r));xx<Math.min(W-1,Math.ceil(x+r));xx++){let t=1-Math.hypot(xx-x,yy-y)/r;if(t>0)fn(id(xx,yy),t)}}function init(){rng=(Math.random()*4294967295)|0;seed=rand()*100;tick=0;a=new Float32Array(N);b=new Float32Array(N);d=new Float32Array(N);agents=[];sources=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y);b[i]=noise(x,y);if(mode===1)a[i]=1+Math.floor(rand()*3);if(mode===0)d[i]=.15+.5*b[i]}if(mode===0)splat(W/2,H/2,4,i=>{a[i]=1;d[i]=0});if(mode===1)for(let k=0;k<3;k++)splat(W*(k+.5)/3,H/2,25,i=>a[i]=k+1);if(mode===2)for(let k=0;k<4;k++)sources.push({x:W*(.15+.7*rand()),y:H*(.15+.7*rand()),p:rand()*6.28});if(mode===3){splat(W/2,H/2,2,i=>a[i]=1);for(let k=0;k<1400;k++)agents.push({x:rand()*W,y:rand()*H})}if(mode===4)splat(W/2,H/2,12,(i,t)=>a[i]=Math.floor(t*24));if(mode===5){for(let k=0;k<300;k++)agents.push({x:W/2,y:H/2,angle:rand()*6.28,carrying:false});for(let k=0;k<7;k++)splat(rand()*W,rand()*H,7,(i,t)=>b[i]=Math.max(b[i],t))}}
function touch(x,y){if(mode===0)splat(x,y,4,(i,t)=>{a[i]=Math.max(a[i],t);d[i]=0});if(mode===1){let col=1+Math.floor(rand()*3);splat(x,y,12,i=>a[i]=col)}if(mode===2){sources.push({x,y,p:rand()*6.28});if(sources.length>12)sources.shift()}if(mode===3)splat(x,y,2,i=>a[i]=1);if(mode===4)splat(x,y,9,(i,t)=>a[i]+=Math.floor(t*25));if(mode===5)splat(x,y,9,(i,t)=>b[i]=Math.max(b[i],t))}
function step(){tick++;let e=+energy.value/100;if(mode===0)for(let k=0;k<2000;k++){let x=1+(rand()*(W-2)|0),y=1+(rand()*(H-2)|0),i=id(x,y);if(a[i]>.3){let j=id(x+(rand()<.5?-1:1),y+(rand()<.5?-1:1));if(a[j]<.1&&rand()<(.08+.35*e)*(.2+b[j])){a[j]=.8+rand()*.2;d[j]=0}}else if(rand()<.001*e*(1-d[i]))a[i]=1}if(mode===1)for(let k=0;k<200+Math.floor(e*4000);k++){let x=1+(rand()*(W-2)|0),y=1+(rand()*(H-2)|0),i=id(x,y),j=id(x+(rand()<.5?-1:1),y+(rand()<.5?-1:1));if(a[i]!==a[j]&&rand()<.48+.2*(b[i]-b[j]))a[j]=a[i]}if(mode===3)for(let p of agents){p.x+=(rand()-.5)*6*(.4+e);p.y+=(rand()-.5)*6*(.4+e);if(p.x<1||p.x>=W-1||p.y<1||p.y>=H-1){p.x=rand()*W;p.y=rand()*H;continue}let x=p.x|0,y=p.y|0,i=id(x,y);if(a[i]||a[id(x+1,y)]||a[id(x-1,y)]||a[id(x,y+1)]||a[id(x,y-1)]){a[i]=1;p.x=rand()*W;p.y=rand()*H}}if(mode===4)for(let n=0;n<2+e*7;n++)for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=id(x,y);if(a[i]>=4){let q=Math.floor(a[i]/4);a[i]-=q*4;a[id(x+1,y)]+=q;a[id(x-1,y)]+=q;a[id(x,y+1)]+=q;a[id(x,y-1)]+=q}}if(mode===5){for(let p of agents){let x=p.x|0,y=p.y|0;if(x<2||x>=W-2||y<2||y>=H-2){p.x=W/2;p.y=H/2;continue}let i=id(x,y);if(!p.carrying&&b[i]>.2){p.carrying=true;b[i]=Math.max(0,b[i]-.05);p.angle+=Math.PI}if(p.carrying&&Math.hypot(x-W/2,y-H/2)<8){p.carrying=false;p.angle+=Math.PI}let target=p.carrying?Math.atan2(H/2-y,W/2-x):p.angle,best=-1,dir=target;for(let j=-1;j<=1;j++){let angle=target+j*.55+(rand()-.5)*.2,sx=x+Math.cos(angle)*4,sy=y+Math.sin(angle)*4;if(sx<1||sx>=W-1||sy<1||sy>=H-1)continue;let score=(p.carrying?a[id(sx|0,sy|0)]:d[id(sx|0,sy|0)])*.9+rand()*.2;if(score>best){best=score;dir=angle}}p.angle=dir+(rand()-.5)*.5;p.x+=Math.cos(p.angle)*(1+e);p.y+=Math.sin(p.angle)*(1+e);let q=id(Math.max(1,Math.min(W-2,p.x|0)),Math.max(1,Math.min(H-2,p.y|0)));if(p.carrying)a[q]=Math.min(1,a[q]+.07);else d[q]=Math.min(1,d[q]+.07)}for(let i=0;i<N;i++){a[i]*=.998;d[i]*=.998}}}
function render(){let sc=+scale.value,e=+energy.value/100;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let i=id(x,y),n=noise(x*sc,y*sc),r=0,g=0,bl=0;if(mode===0){let v=a[i],edge=Math.abs(v-a[id(x+1,y)])+Math.abs(v-a[id(x,y+1)]);r=70+50*n-64*v+160*edge;g=77+55*n-70*v+145*edge;bl=84+50*n-74*v+128*edge}if(mode===1){let q=a[i]|0,edge=(a[id(x+1,y)]!==q?1:0)+(a[id(x,y+1)]!==q?1:0),colors=[[0,0,0],[168,76,76],[67,155,153],[193,162,74]],col=colors[q];r=col[0]*(.7+.3*n)+edge*43;g=col[1]*(.7+.3*n)+edge*43;bl=col[2]*(.7+.3*n)+edge*43}if(mode===2){let field=0;for(let s of sources){let dist=Math.hypot((x-s.x)/sc,(y-s.y)/sc);field+=Math.sin(dist*.27-tick*(.06+.11*e)+s.p)/Math.sqrt(1+dist*.07)}let v=Math.tanh(field*.5),rim=Math.pow(Math.abs(v),7);r=70+70*v+70*rim;g=94-64*v+70*rim;bl=135+65*v+50*rim}if(mode===3){let v=a[i],edge=Math.abs(v-a[id(x+1,y)])+Math.abs(v-a[id(x,y+1)]);r=13+80*n+137*v+72*edge;g=26+95*n+166*v+74*edge;bl=34+98*n+188*v+62*edge}if(mode===4){let v=a[i]/4,edge=Math.abs(a[i]-a[id(x+1,y)])+Math.abs(a[i]-a[id(x,y+1)]);r=20+175*v+Math.min(80,edge*18);g=24+128*v+Math.min(70,edge*16);bl=38+73*v+Math.min(50,edge*13)}if(mode===5){let food=b[i],pher=Math.max(a[i],d[i]),nest=Math.hypot(x-W/2,y-H/2)<6?1:0;r=20+35*n+100*food+108*pher+85*nest;g=26+48*n+145*food+80*pher+48*nest;bl=25+36*n+53*food+117*pher+44*nest}let j=i*4;px[j]=Math.max(0,Math.min(255,r));px[j+1]=Math.max(0,Math.min(255,g));px[j+2]=Math.max(0,Math.min(255,bl));px[j+3]=255}bc.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(buffer,0,0,c.width,c.height)}
function select(i){mode=i;desc.textContent=descs[i];[...tabs.children].forEach((b,j)=>b.classList.toggle('active',i===j));init()}names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+name;b.onclick=()=>select(i);tabs.append(b)});function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=Math.round(c.clientWidth*d);c.height=Math.round(c.clientHeight*d)}function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);touch(...point(e))};c.onpointermove=e=>{if(down)touch(...point(e))};c.onpointerup=c.onpointercancel=()=>down=false;document.querySelector('#reset').onclick=init;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};function frame(){if(!paused)step();render();status.textContent=W+' × '+H+' simulation cells · '+tick+' updates';requestAnimationFrame(frame)}new ResizeObserver(resize).observe(c);resize();select(0);frame()})();
</script></html>
