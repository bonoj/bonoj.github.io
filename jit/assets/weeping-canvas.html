<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171a19"><title>The Weeping Canvas · JIT Assets</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#171a19;color:#e5dfd1;font:13px system-ui,sans-serif}main{height:100dvh;max-width:1100px;margin:auto;display:flex;flex-direction:column;padding:9px;gap:7px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font:italic 22px Georgia,serif;margin:0}header small{font:9px monospace;letter-spacing:.18em;color:#aaa99e}a{color:#c3b9a6;text-decoration:none}#stage{flex:1;min-height:160px;position:relative;overflow:hidden;border:1px solid #514d47;border-radius:12px;background:#d9d0be}canvas{width:100%;height:100%;display:block;touch-action:none}#hint{position:absolute;top:10px;left:10px;color:#393934;font:10px monospace;letter-spacing:.1em;pointer-events:none;background:#e9e0cfaa;padding:6px;border-radius:4px}#stats{position:absolute;top:10px;right:10px;color:#45443f;background:#e9e0cfaa;padding:6px;border-radius:4px;font:10px monospace}.controls{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}button{min-width:0;padding:10px 2px;border:1px solid #605c56;border-radius:8px;background:#292e2b;color:#e7e0d2;font:11px system-ui;cursor:pointer}button.active{background:#a79d86;color:#171b1a;border-color:#e5d7b9}.bottom{display:flex;gap:7px;align-items:center}.bottom button{padding:8px 11px}.bottom label{display:flex;align-items:center;gap:7px;flex:1;font:10px monospace;color:#aaa99e}.bottom input{width:100%;accent-color:#a5a18f}.bottom output{width:24px;text-align:right}#msg{font:10px Georgia,serif;color:#b8b2a7;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}@media(max-width:420px){button{font-size:10px}.controls{gap:3px}main{gap:5px;padding:6px}h1{font-size:19px}}</style></head><body><main><header><div><small>JIT ASSETS · SPECIMEN 007</small><h1>The Weeping Canvas</h1></div><a href="./">← Cabinet</a></header><div id="stage"><canvas id="view"></canvas><div id="hint">TOUCH TO DISTURB THE PAPER</div><div id="stats">IDLE · 0 DRIPS</div></div><div class="controls"><button data-tool="bleed" class="active">◉ Bleed</button><button data-tool="scratch">╱ Scratch</button><button data-tool="summon">♟ Summon</button><button data-tool="door">▯ Door</button><button data-tool="rain">☂ Rain</button><button data-tool="light">✦ Light</button></div><div class="bottom"><button id="scene">↻ Story</button><button id="undo">↶</button><button id="clear">⌫</button><label>WETNESS <input id="wet" type="range" min="0" max="100" value="58"><output id="wetval">58</output></label></div><div id="msg">The paper remembers what the water has done.</div></main>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),canvas=$('#view'),stage=$('#stage'),ctx=canvas.getContext('2d',{alpha:false});
const W=480,H=640;const paper=document.createElement('canvas'),paint=document.createElement('canvas');for(const c of [paper,paint]){c.width=W;c.height=H}const p=paper.getContext('2d'),ink=paint.getContext('2d');let seed=741,tool='bleed',wet=.58,story=0,down=false,prev=null,active=[],history=[],pending=false,raf=0,last=0,runUntil=0,frames=0;
const palette=['#363f3d','#626e70','#856d64','#9a8875','#4d5961'];let tint=0;
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
function resize(){const r=stage.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);request()}
new ResizeObserver(resize).observe(stage);
function request(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render()})}
function render(){ctx.drawImage(paper,0,0);ctx.drawImage(paint,0,0);$('#stats').textContent=(active.length?'WET':'IDLE')+' · '+active.length+' DRIPS';}
function background(){p.fillStyle='#e8dfce';p.fillRect(0,0,W,H);const g=p.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f1e9d8');g.addColorStop(.6,'#e4d9c7');g.addColorStop(1,'#cfc4b4');p.fillStyle=g;p.fillRect(0,0,W,H);for(let i=0;i<3200;i++){const x=rnd()*W,y=rnd()*H;p.fillStyle=i%3?'#786e5e':'#ffffff';p.globalAlpha=.025+rnd()*.045;p.fillRect(x,y,.4+rnd()*1.4,.4+rnd()*1.4)}p.globalAlpha=1;
p.fillStyle='#5e655e';p.globalAlpha=.07;p.beginPath();p.moveTo(0,480);for(let x=0;x<=W;x+=8)p.lineTo(x,453-Math.sin(x*.024)*17-Math.sin(x*.066)*9);p.lineTo(W,H);p.lineTo(0,H);p.fill();p.globalAlpha=1}
function blob(x,y,r,col,alpha=.35){ink.save();ink.globalCompositeOperation='multiply';for(let k=0;k<3;k++){const rr=r*(1.32-k*.18);ink.beginPath();for(let i=0;i<=32;i++){const a=i/32*Math.PI*2,n=1+Math.sin(a*5+x*.07)*.09+Math.cos(a*9+y*.04)*.055,xx=x+Math.cos(a)*rr*n,yy=y+Math.sin(a)*rr*n;if(i)ink.lineTo(xx,yy);else ink.moveTo(xx,yy)}ink.closePath();ink.fillStyle=rgba(col,alpha*[.055,.10,.15][k]);ink.fill()}const grad=ink.createRadialGradient(x-r*.2,y-r*.15,0,x,y,r);grad.addColorStop(0,rgba(col,alpha*.65));grad.addColorStop(.72,rgba(col,alpha*.29));grad.addColorStop(1,rgba(col,0));ink.fillStyle=grad;ink.beginPath();ink.arc(x,y,r,0,7);ink.fill();ink.restore()}
function spawn(x,y,n=3,col=palette[tint]){for(let i=0;i<n&&active.length<65;i++){active.push({x:x+(rnd()-.5)*26,y:y+(rnd()-.5)*10,vy:.13+rnd()*.28,w:.5+rnd()*2,life:0,col,delay:rnd()*25})}wake()}
function mark(x,y,r=23){blob(x,y,r+rnd()*12,palette[tint],.4+wet*.4);if(wet>.1&&rnd()<.85)spawn(x,y+r*.35,1+Math.floor(wet*3));request()}
function stroke(x,y,xx,yy,width=2,color='#343e3b',a=.6){ink.save();ink.strokeStyle=rgba(color,a);ink.lineWidth=width;ink.lineCap='round';ink.beginPath();ink.moveTo(x,y);ink.lineTo(xx,yy);ink.stroke();ink.restore()}
function scratch(x,y){for(let i=0;i<5;i++){const dx=(rnd()-.5)*30,dy=20+rnd()*85;stroke(x+dx,y-dy*.6,x+dx+(rnd()-.5)*10,y+dy,.4+rnd()*1.4,'#3c4945',.1+rnd()*.3)}spawn(x,y,2);request()}
function silhouette(x,y,s=1){const c=palette[tint];ink.save();ink.translate(x,y);ink.scale(s,s);ink.fillStyle=rgba(c,.75);ink.beginPath();ink.ellipse(0,-39,11,17,-.13,0,7);ink.fill();ink.beginPath();ink.moveTo(-9,-27);ink.bezierCurveTo(-28,-8,-32,31,-23,67);ink.lineTo(-8,64);ink.lineTo(-3,17);ink.lineTo(8,67);ink.lineTo(23,64);ink.bezierCurveTo(30,18,26,-8,9,-27);ink.closePath();ink.fill();ink.strokeStyle=rgba(c,.53);ink.lineWidth=3;for(const sign of [-1,1]){ink.beginPath();ink.moveTo(sign*15,-19);ink.bezierCurveTo(sign*27,2,sign*37,21,sign*30,47);ink.stroke()}ink.restore();blob(x,y-30,32,c,.22);spawn(x,y+26,3,c);request()}
function doorway(x,y){const c=palette[tint];ink.save();ink.translate(x,y);ink.fillStyle=rgba(c,.55);ink.beginPath();ink.moveTo(-34,70);ink.lineTo(-34,-49);ink.quadraticCurveTo(0,-92,34,-49);ink.lineTo(34,70);ink.closePath();ink.fill();ink.fillStyle='rgba(32,38,36,.86)';ink.beginPath();ink.moveTo(-21,70);ink.lineTo(-21,-42);ink.quadraticCurveTo(0,-68,21,-42);ink.lineTo(21,70);ink.fill();ink.strokeStyle='rgba(218,206,181,.5)';ink.lineWidth=1;ink.strokeRect(-32,-32,1,98);ink.restore();spawn(x,y+42,4,c);request()}
function lantern(x,y){ink.save();const g=ink.createRadialGradient(x,y,1,x,y,95);g.addColorStop(0,'rgba(249,231,174,.74)');g.addColorStop(.25,'rgba(234,206,150,.26)');g.addColorStop(1,'rgba(235,201,146,0)');ink.globalCompositeOperation='screen';ink.fillStyle=g;ink.fillRect(x-100,y-100,200,200);ink.restore();ink.fillStyle='#e9d4a2';ink.beginPath();ink.arc(x,y,2+rnd()*4,0,7);ink.fill();request()}
function rainfall(x,y){for(let i=0;i<22;i++){const xx=x+(rnd()-.5)*125,yy=y+(rnd()-.5)*110;stroke(xx,yy,xx-2-rnd()*3,yy+10+rnd()*35,.5+rnd(),'#515c61',.15+rnd()*.23);if(rnd()<.18)spawn(xx,yy,1)}request()}
function act(x,y,drag=false){if(tool==='bleed'){mark(x,y,drag?9:22)}else if(tool==='scratch'){scratch(x,y)}else if(tool==='summon'&&!drag){silhouette(x,y,.55+rnd()*.7);$('#msg').textContent='Something has stepped out of the stain.'}else if(tool==='door'&&!drag){doorway(x,y);$('#msg').textContent='The doorway is darker on the inside.'}else if(tool==='rain'){rainfall(x,y)}else if(tool==='light'){lantern(x,y)}}
function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function save(){history.push(ink.getImageData(0,0,W,H));if(history.length>5)history.shift()}
canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);save();prev=coords(e);act(prev.x,prev.y)});
canvas.addEventListener('pointermove',e=>{if(!down)return;const q=coords(e);if(prev&&Math.hypot(q.x-prev.x,q.y-prev.y)>7){if(['bleed','scratch','rain','light'].includes(tool))act(q.x,q.y,true);prev=q}});
for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>{down=false;prev=null});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(z=>z.classList.toggle('active',z===b));$('#hint').textContent=({bleed:'PAINT WITH WATER AND INK',scratch:'SCRATCH THROUGH THE SILENCE',summon:'TAP TO SUMMON A STRANGER',door:'TAP TO OPEN A DOOR',rain:'DRAG A CURTAIN OF RAIN',light:'PAINT WITH FLICKERING LIGHT'})[tool]});
$('#wet').oninput=e=>{wet=+e.target.value/100;$('#wetval').textContent=e.target.value};
$('#undo').onclick=()=>{const img=history.pop();if(img){ink.putImageData(img,0,0);active=[];request()}};
$('#clear').onclick=()=>{save();ink.clearRect(0,0,W,H);active=[];request();$('#msg').textContent='The page is empty. For now.'};
function storyScene(){active=[];history=[];ink.clearRect(0,0,W,H);seed=741+story*117;background();tint=story%palette.length;
if(story%4===0){for(let i=0;i<7;i++)blob(90+i*46,270+Math.sin(i)*60,34+rnd()*45,palette[i%5],.18);doorway(238,385);silhouette(346,398,.75);$('#msg').textContent='THE HOUSE THAT HAD NO ROOMS'}
if(story%4===1){for(let i=0;i<11;i++){const x=30+i*44;stroke(x,535,x+(rnd()-.5)*50,120+rnd()*130,2+rnd()*6,'#3c4c47',.35)}silhouette(245,368,1.2);$('#msg').textContent='THE PEOPLE UNDER THE TREES'}
if(story%4===2){for(let i=0;i<12;i++)blob(60+rnd()*360,180+rnd()*260,20+rnd()*70,palette[(i+1)%5],.25);for(let i=0;i<5;i++)silhouette(65+i*82,410+rnd()*65,.4+rnd()*.4);$('#msg').textContent='THE RAIN THAT REMEMBERED NAMES'}
if(story%4===3){doorway(130,385);doorway(348,355);lantern(244,248);for(let i=0;i<16;i++)scratch(rnd()*W,130+rnd()*350);$('#msg').textContent='THE DOOR ON THE OTHER SIDE'}
request()}
$('#scene').onclick=()=>{story++;storyScene()};
function wake(){runUntil=performance.now()+5200;if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(now){raf=0;const dt=Math.min(45,now-last);last=now;if(active.length){ink.save();ink.lineCap='round';for(let i=active.length-1;i>=0;i--){const d=active[i];if(d.delay>0){d.delay-=dt*.07;continue}const old=d.y;d.vy=Math.min(2,d.vy+dt*.00035*wet);d.y+=d.vy*dt*.065*(.2+wet);d.x+=Math.sin(d.y*.031+i)*.055;ink.strokeStyle=rgba(d.col,.08+wet*.17);ink.lineWidth=d.w*2.2;ink.beginPath();ink.moveTo(d.x,old);ink.lineTo(d.x,d.y);ink.stroke();ink.fillStyle=rgba(d.col,.16+wet*.22);ink.beginPath();ink.ellipse(d.x,d.y,d.w*1.4,d.w*1.8,0,0,7);ink.fill();d.life+=dt;if(d.y>H||d.life>5200)active.splice(i,1)}ink.restore();request()}
if(active.length&&now<runUntil)raf=requestAnimationFrame(tick);else{active=[];request()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;active=[]}else request()});
storyScene();
})();
</script></body></html>
