<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#231914"><title>Idiot Sandwich · JIT Assets</title>
<style>*{box-sizing:border-box}body{margin:0;background:#231914;color:#f8e6ca;font-family:system-ui}main{max-width:680px;margin:auto}canvas{display:block;width:100%;height:auto}.tray{padding:13px;background:#39291f;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.ingredient{background:#59402d;border:1px solid #886647;border-radius:12px;padding:9px 0;min-height:57px;font-size:29px;cursor:pointer;touch-action:manipulation}.ingredient:active{transform:scale(.93)}.bottom{background:#39291f;padding:0 14px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.stamp{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-13deg) scale(1.7);font-weight:1000;font-size:clamp(27px,9vw,49px);letter-spacing:2px;border:7px solid;border-radius:10px;padding:8px 17px;white-space:nowrap;opacity:0;pointer-events:none;text-shadow:0 2px 1px #0003}.stamp.show{animation:idiotstamp .85s ease-out forwards}@keyframes idiotstamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-13deg) scale(2.8)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-13deg) scale(.92)}75%{opacity:1;transform:translate(-50%,-50%) rotate(-13deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-13deg) scale(1.08)}}.restart{background:#674c36;color:#fff0d8;border:1px solid #9b7857;border-radius:8px;padding:9px 13px}a{color:#f4cf9c;font-size:12px}</style></head><body><main>
<div style="position:relative"><canvas id="is-canvas" width="680" height="590"></canvas><div id="is-stamp" class="stamp">INCORRECT</div></div>
<div class="tray" id="is-tray">
<button class="ingredient" data-food="🥬">🥬</button><button class="ingredient" data-food="🧀">🧀</button><button class="ingredient" data-food="🍅">🍅</button><button class="ingredient" data-food="🥓">🥓</button><button class="ingredient" data-food="🥒">🥒</button><button class="ingredient" data-food="🥩">🥩</button><button class="ingredient" data-food="🥑">🥑</button><button class="ingredient" data-food="🍳">🍳</button><button class="ingredient" data-food="🧅">🧅</button><button class="ingredient" data-food="🍞">🍞</button></div>
<div class="bottom"><span id="is-caption" style="font-size:12px;color:#e2c5a4">Select an ingredient to construct your sandwich.</span><button class="restart" id="is-restart">Start over</button><a href="../">Assets</a></div>
</main><script>
(()=>{
const c=document.getElementById('is-canvas'),ctx=c.getContext('2d'),stamp=document.getElementById('is-stamp'),caption=document.getElementById('is-caption');
let finished=false,offset=0,stampTimer=0,anim=0,topY=-180;
function breadPath(){ctx.beginPath();ctx.moveTo(170,447);ctx.bezierCurveTo(145,420,152,330,151,271);ctx.bezierCurveTo(120,230,126,158,174,135);ctx.bezierCurveTo(220,110,265,137,340,135);ctx.bezierCurveTo(415,137,460,110,506,135);ctx.bezierCurveTo(554,158,560,230,529,271);ctx.bezierCurveTo(528,330,535,420,510,447);ctx.quadraticCurveTo(340,491,170,447);ctx.closePath()}
function slice(x,y,rot,scale,top=false){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(scale,scale);ctx.translate(-340,-305);
ctx.save();ctx.translate(8,12);ctx.shadowColor='#120904';ctx.shadowBlur=22;ctx.shadowOffsetY=13;breadPath();ctx.fillStyle='#1d0d09';ctx.fill();ctx.restore();
breadPath();ctx.fillStyle='#8d4c23';ctx.fill();ctx.save();ctx.clip();const crust=ctx.createLinearGradient(155,145,525,455);crust.addColorStop(0,'#a65b29');crust.addColorStop(.5,'#cc8843');crust.addColorStop(1,'#87421f');ctx.fillStyle=crust;ctx.fillRect(125,105,430,400);
ctx.save();ctx.translate(340,300);ctx.scale(.94,.93);ctx.translate(-340,-300);breadPath();ctx.fillStyle='#e3ad68';ctx.fill();ctx.restore();
ctx.save();ctx.translate(340,300);ctx.scale(.9,.89);ctx.translate(-340,-300);breadPath();ctx.fillStyle=top?'#f4cd8e':'#efc58a';ctx.fill();ctx.restore();
for(let i=0;i<140;i++){let xx=173+((i*73.73)%333),yy=153+((i*47.37)%289);ctx.beginPath();ctx.ellipse(xx,yy,(i%3+1)*.55,(i%4+1)*.42,0,0,7);ctx.fillStyle='rgba(136,78,36,.20)';ctx.fill()}
ctx.restore();ctx.restore()}
function draw(){const W=680,H=590;ctx.clearRect(0,0,W,H);const bg=ctx.createRadialGradient(340,290,40,340,290,500);bg.addColorStop(0,'#765541');bg.addColorStop(1,'#261a15');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ead0a6';ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillText('THE SANDWICH EXAMINATION',340,47);ctx.font='13px system-ui';ctx.fillStyle='#c8a98b';ctx.fillText('CHOOSE YOUR INGREDIENTS CAREFULLY',340,71);
ctx.fillStyle='#402a20';ctx.beginPath();ctx.ellipse(343,350,242,168,0,0,7);ctx.fill();ctx.strokeStyle='#a78365';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(343,345,240,166,0,0,7);ctx.stroke();
slice(340,312,0,.83);if(finished||anim>0)slice(340+offset,anim?topY:312,-.075,.83,true);
ctx.font='12px system-ui';ctx.fillStyle='#c6a78a';ctx.fillText(finished?'CULINARY CERTIFICATION COMPLETE':'AWAITING INGREDIENT SELECTION',340,552)}
function showStamp(text,good){clearTimeout(stampTimer);stamp.classList.remove('show');void stamp.offsetWidth;stamp.textContent=text;stamp.style.color=good?'#71d991':'#fa4545';stamp.style.borderColor=good?'#71d991':'#fa4545';stamp.style.background=good?'#12391fe0':'#451616e8';stamp.classList.add('show');stampTimer=setTimeout(()=>stamp.classList.remove('show'),950)}
let animationFrame=0;
function drop(){if(finished)return;finished=true;offset=18;topY=-190;anim=1;caption.textContent='IDIOT SANDWICH. Congratulations.';
function tick(){topY+=(312-topY)*.19;draw();if(Math.abs(topY-312)>1){animationFrame=requestAnimationFrame(tick)}else{topY=312;anim=0;draw();showStamp('CONGRATULATIONS',true)}}cancelAnimationFrame(animationFrame);tick()}
document.getElementById('is-tray').addEventListener('click',e=>{const b=e.target.closest('[data-food]');if(!b)return;if(b.dataset.food==='🍞'){if(finished)showStamp('CONGRATULATIONS',true);else drop()}else{showStamp('INCORRECT',false);caption.textContent=finished?'You have already achieved perfection.':'Unacceptable ingredient. Try again.'}});
document.getElementById('is-restart').onclick=()=>{cancelAnimationFrame(animationFrame);finished=false;anim=0;offset=0;topY=-180;caption.textContent='Select an ingredient to construct your sandwich.';stamp.classList.remove('show');draw()};draw();
})();
</script></body></html>
