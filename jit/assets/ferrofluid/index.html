<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e14"><title>Ferrofluid Laboratory · JIT Assets</title><style>*{box-sizing:border-box}body{margin:0;background:#090e14;color:#e4eeee;font:14px system-ui}header{position:absolute;z-index:2;top:16px;left:18px;pointer-events:none}h1{font-size:20px;font-weight:400;letter-spacing:.12em;margin:3px 0}small{color:#8eb3b5;letter-spacing:.15em}#stage{height:100dvh;min-height:430px;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.panel{position:absolute;bottom:12px;left:12px;right:12px;max-width:680px;margin:auto;padding:14px;background:#111b25eb;border:1px solid #40515b;border-radius:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;backdrop-filter:blur(12px)}label{font-size:12px;color:#b5c8cb}input{width:100%;accent-color:#65c9c4}output{float:right;color:#7ce5dc}button,a{color:#d9f1ef;background:#20323a;border:1px solid #4b6870;border-radius:8px;padding:8px;text-decoration:none;font:12px system-ui}nav{position:absolute;top:15px;right:15px;z-index:3;display:flex;gap:6px}#status{font-size:12px;color:#a0b6b9;margin-top:5px}@media(max-width:450px){.panel{gap:8px;padding:10px}header{top:12px;left:12px}h1{font-size:17px}}</style><div id="stage"><canvas id="view"></canvas><header><small>MATERIAL LABORATORY / 001</small><h1>FERROFLUID</h1><div id="status">Loading 3D surface…</div></header><nav><button id="reset">Reset view</button><a href="../">Assets</a></nav><div class="panel"><label>Field strength <output id="os">0.70</output><input id="s" type="range" min="0" max="1.8" step=".01" value=".7"></label><label>Magnet height <output id="oh">0.50</output><input id="h" type="range" min=".15" max="1.3" step=".01" value=".5"></label><label>Magnet X <output id="ox">0.00</output><input id="x" type="range" min="-1.1" max="1.1" step=".01" value="0"></label><label>Magnet Z <output id="oz">0.00</output><input id="z" type="range" min="-1.1" max="1.1" step=".01" value="0"></label></div></div><script type="module">
const stage=document.querySelector('#stage'),canvas=document.querySelector('#view'),status=document.querySelector('#status');const input={};for(const k of ['s','h','x','z']){input[k]=document.getElementById(k);input[k].addEventListener('input',()=>document.getElementById('o'+k).textContent=(+input[k].value).toFixed(2))}
let T;try{T=await import('https://esm.sh/three@0.170.0')}catch(e){status.textContent='3D engine unavailable';throw e}
const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setClearColor(0x090e14);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene();scene.fog=new T.FogExp2(0x090e14,.065);const camera=new T.PerspectiveCamera(39,1,.05,100);let az=.55,el=.57,dist=7.7;function cam(){camera.position.set(dist*Math.sin(az)*Math.cos(el),dist*Math.sin(el)+.6,dist*Math.cos(az)*Math.cos(el));camera.lookAt(0,.12,0)}cam();
scene.add(new T.HemisphereLight(0x9ec5d7,0x0b0d12,1.5));for(const [color,pos,power] of [[0xe5f9ff,[-3,6,4],3.4],[0x58c9ce,[4,3,-3],2.3],[0xffffff,[1,7,1],1.2]]){const l=new T.DirectionalLight(color,power);l.position.set(...pos);scene.add(l)}
const dishMat=new T.MeshStandardMaterial({color:0x344451,metalness:.85,roughness:.3}),metal=new T.MeshPhysicalMaterial({color:0x090f15,metalness:.92,roughness:.13,clearcoat:1,clearcoatRoughness:.08,side:T.DoubleSide});
const base=new T.Mesh(new T.CylinderGeometry(2.15,2.18,.14,100),dishMat);base.position.y=-.19;scene.add(base);const rim=new T.Mesh(new T.TorusGeometry(2.05,.075,12,120),new T.MeshStandardMaterial({color:0x8399a2,metalness:.9,roughness:.2}));rim.rotation.x=Math.PI/2;rim.position.y=-.055;scene.add(rim);
const N=116,verts=[],indices=[];for(let j=0;j<=N;j++)for(let i=0;i<=N;i++)verts.push((i/N*2-1)*2.03,0,(j/N*2-1)*2.03);for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=j*(N+1)+i,b=a+1,c=a+N+1,d=c+1;indices.push(a,c,b,b,c,d)}
const geom=new T.BufferGeometry();geom.setAttribute('position',new T.Float32BufferAttribute(verts,3));geom.setIndex(indices);const surf=new T.Mesh(geom,metal);scene.add(surf);
const magnet=new T.Mesh(new T.CylinderGeometry(.3,.3,.17,48),new T.MeshStandardMaterial({color:0x477b86,metalness:.85,roughness:.24,emissive:0x08323b,emissiveIntensity:.4}));scene.add(magnet);
const guide=new T.Mesh(new T.RingGeometry(.31,.34,64),new T.MeshBasicMaterial({color:0x7ce5dc,transparent:true,opacity:.45,side:T.DoubleSide}));guide.rotation.x=-Math.PI/2;scene.add(guide);
const heights=new Float32Array((N+1)*(N+1));function height(x,z,s,h,mx,mz,t){const r=Math.hypot(x,z);if(r>2.02)return-.025;const dx=x-mx,dz=z-mz,d=Math.hypot(dx,dz);const field=s*Math.pow(h*h+.4,1.15)/Math.pow(dx*dx+dz*dz+h*h+.4,1.15);const onset=Math.max(0,field-.28),k=13.5;const lattice=Math.max(0,(Math.cos(k*dx)+Math.cos(k*(-.5*dx+.8660254*dz))+Math.cos(k*(-.5*dx-.8660254*dz)))/3);const spike=Math.pow(lattice,5.2),amp=.68*(1-Math.exp(-2.4*onset)),broad=.055*Math.tanh(field*1.8),ripple=.007*Math.sin(15*d-t*2.2)*Math.exp(-d*1.7),edge=Math.min(1,Math.max(0,(2.02-r)*9));return edge*(broad+amp*spike+ripple)-.022}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
const pointers=new Map();let pinch=0;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){az-=(e.clientX-old.x)*.008;el=Math.max(.12,Math.min(1.42,el+(e.clientY-old.y)*.006));cam()}else{const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)dist=Math.max(3.8,Math.min(13,dist*pinch/d));pinch=d;cam()}});for(const name of ['pointerup','pointercancel'])canvas.addEventListener(name,e=>{pointers.delete(e.pointerId);pinch=0});canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3.8,Math.min(13,dist*Math.exp(e.deltaY*.001)));cam()},{passive:false});document.getElementById('reset').onclick=()=>{az=.55;el=.57;dist=7.7;cam()};
let last=performance.now(),tick=0;function animate(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick+=dt;const s=+input.s.value,h=+input.h.value,mx=+input.x.value,mz=+input.z.value;magnet.position.set(mx,-.39-h*.12,mz);guide.position.set(mx,-.286,mz);const arr=geom.attributes.position.array,alpha=1-Math.exp(-dt*6);for(let p=0;p<heights.length;p++){heights[p]+=(height(verts[p*3],verts[p*3+2],s,h,mx,mz,tick)-heights[p])*alpha;arr[p*3+1]=heights[p]}geom.attributes.position.needsUpdate=true;geom.computeVertexNormals();status.textContent=s>.5?'SPIKE FORMATION':s>.25?'FIELD ACTIVE':'BELOW INSTABILITY THRESHOLD';renderer.render(scene,camera);requestAnimationFrame(animate)}requestAnimationFrame(animate);
</script></html>
