<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fossil Cathedral · Structural Study</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e0d}main{position:relative;width:100%;height:100dvh;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.bar{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:none}button{pointer-events:auto;width:44px;height:44px;border:1px solid #b7a08b55;border-radius:50%;background:#161310ba;color:#e2c7a2;font-size:20px}</style></head><body><main><canvas></canvas><div class="bar"><button id="reset" aria-label="Regenerate">↺</button><button id="mode" aria-label="Structural view">◐</button><button id="wind" aria-label="Wind">≋</button><button id="pause" aria-label="Pause">Ⅱ</button></div></main><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d');let W=0,H=0,D=1,T=0,last=performance.now(),seed=741,mode=0,wind=1,paused=false,press=false,pointer={x:0,y:0},holes=[],dust=[],sparks=[],growth=0;const R=n=>{let x=Math.sin(n*127.1+seed*3.17)*43758.5453;return x-Math.floor(x)},clamp=(x,a,b)=>Math.max(a,Math.min(b,x));function resize(){let b=c.getBoundingClientRect();W=b.width;H=b.height;D=Math.min(1.5,devicePixelRatio||1);c.width=Math.round(W*D);c.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);reset()}new ResizeObserver(resize).observe(c);
function reset(){holes=[];dust=[];sparks=[];growth=0;for(let i=0;i<350;i++)dust.push({x:R(i*3)*W,y:R(i*7+1)*H,v:.3+R(i*9+4)*1.4,a:.06+R(i*13)*.32,r:.3+R(i*17)*1.1})}
function ground(x){return H*.87+Math.sin(x*.014+seed)*5+Math.sin(x*.039)*2}
function shape(x,y){let nx=(x-W*.5)/(W*.43),ny=(y-H*.84)/(H*.69),width=.26+.52*clamp((ny+1.1)/1.7,0,1),central=1-Math.abs(nx)/Math.max(.05,width),spire=Math.exp(-Math.pow((nx-.03)/.17,2))*.34,wing=Math.exp(-Math.pow((Math.abs(nx)-.43)/.2,2))*.17,ridge=-.86-spire-wing+.08*Math.sin(nx*19)+.035*Math.sin(nx*53),inside=central>0&&ny>ridge&&ny<.08,noise=.045*Math.sin(nx*27+Math.sin(ny*16))+.018*Math.sin(nx*81+ny*39);return inside&&central+noise>0}
function chamber(x,y){let nx=(x-W*.5)/(W*.43),ny=(y-H*.84)/(H*.69),arch=false;for(let row=0;row<4;row++){let yy=-.1-row*.18,count=row===3?3:5;for(let i=0;i<count;i++){let xx=(i-(count-1)/2)*(.18+row*.012),dx=(nx-xx)/(.065+row*.004),dy=(ny-yy)/(.09+row*.006);if(dy>-.85&&dy<.85&&dx*dx+Math.pow(Math.max(-.7,dy),2)*.85<1)arch=true}}return arch||Math.pow(nx/.11,2)+Math.pow((ny+.47)/.22,2)<1}
function solid(x,y){if(!shape(x,y)||chamber(x,y))return false;for(let h of holes)if(Math.hypot(x-h.x,y-h.y)<h.r)return false;return true}
function scene(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#17181a');sky.addColorStop(.65,'#756455');sky.addColorStop(1,'#b08a62');g.fillStyle=sky;g.fillRect(0,0,W,H);let haze=g.createRadialGradient(W*.55,H*.65,5,W*.55,H*.65,W*.7);haze.addColorStop(0,'#e4ab7140');haze.addColorStop(1,'#e4ab7100');g.fillStyle=haze;g.fillRect(0,0,W,H);const step=3;for(let y=Math.floor(H*.1);y<H*.89;y+=step){let start=-1;for(let x=0;x<=W+step;x+=step){let yes=solid(x,y);if(yes&&start<0)start=x;if((!yes||x>=W)&&start>=0){let shade=mode?205:clamp(55+18*Math.sin(y*.045)+9*Math.sin(start*.023),28,76);g.fillStyle=mode?'rgb('+shade+','+shade+','+shade+')':'hsl(31,17%,'+shade+'%)';g.fillRect(start,y,x-start,step+.7);start=-1}}}g.save();g.globalCompositeOperation='multiply';for(let k=0;k<75;k++){let x=W*(.12+R(k*11)*.76),y=H*(.25+R(k*23)*.65);if(!solid(x,y))continue;g.strokeStyle=mode?'#3338':'#382b2580';g.lineWidth=.6+R(k*5)*1.4;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+R(k)*15,y+10,x-20,y+25,x+R(k*7)*12-6,y+35);g.stroke()}g.restore();for(let h of holes){if(h.heat>0){let gl=g.createRadialGradient(h.x,h.y,1,h.x,h.y,h.r*2.2);gl.addColorStop(0,'rgba(255,158,59,'+(h.heat*.42)+')');gl.addColorStop(1,'rgba(255,98,18,0)');g.fillStyle=gl;g.beginPath();g.arc(h.x,h.y,h.r*2.2,0,Math.PI*2);g.fill()}}g.fillStyle=mode?'#353535':'#534539';g.beginPath();g.moveTo(0,H);g.lineTo(0,H*.88);for(let x=0;x<=W;x+=4)g.lineTo(x,ground(x));g.lineTo(W,H);g.fill();for(let p of dust){g.fillStyle='rgba(245,217,172,'+p.a+')';g.fillRect(p.x,p.y,p.r*2,p.r*.55)}for(let p of sparks){g.fillStyle='rgba(255,'+Math.round(100+100*p.life)+',65,'+Math.min(1,p.life)+')';g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()}}
function update(dt){T+=dt;growth=Math.min(1,growth+dt*.015);if(press&&T%0.1<dt*1.5)excavate(pointer.x,pointer.y);for(let h of holes){h.heat=Math.max(0,h.heat-dt*.017);h.r=Math.min(h.max,h.r+dt*1.6)}for(let p of dust){p.x+=dt*(wind*30+p.v*17);p.y+=Math.sin(T*2+p.x*.03)*dt*5;if(p.x>W+4)p.x=-4;if(p.x< -4)p.x=W+4}for(let p of sparks){p.x+=p.vx*dt+wind*10*dt;p.y+=p.vy*dt;p.life-=dt*.7}sparks=sparks.filter(p=>p.life>0);if(holes.length&&Math.random()<dt*26){let h=holes[Math.floor(Math.random()*holes.length)];if(h.heat>.1&&sparks.length<220)sparks.push({x:h.x+(Math.random()-.5)*h.r,y:h.y,vx:(Math.random()-.5)*14,vy:-12-Math.random()*25,life:.5+Math.random(),r:.5+Math.random()*1.5})}}
function excavate(x,y){if(!shape(x,y))return;let nearest=holes.find(h=>Math.hypot(h.x-x,h.y-y)<h.r*.7);if(nearest){nearest.max=Math.min(48,nearest.max+1.7);nearest.heat=1}else if(holes.length<120)holes.push({x,y,r:2,max:8+Math.random()*10,heat:1})}
c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);press=true;let r=c.getBoundingClientRect();pointer={x:e.clientX-r.left,y:e.clientY-r.top};excavate(pointer.x,pointer.y)});c.addEventListener('pointermove',e=>{if(!press)return;let r=c.getBoundingClientRect();pointer={x:e.clientX-r.left,y:e.clientY-r.top}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(ev,()=>press=false);document.querySelector('#reset').onclick=()=>{seed+=137;reset()};document.querySelector('#mode').onclick=()=>mode=1-mode;document.querySelector('#wind').onclick=()=>wind=wind===1?2:wind===2?-1:1;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)update(dt);scene();requestAnimationFrame(frame)}resize();requestAnimationFrame(frame);
})();
</script></body></html>
