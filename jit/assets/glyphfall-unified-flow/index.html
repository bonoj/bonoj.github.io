let elapsed=0,last=0;function draw(now){requestAnimationFrame(draw);const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused)elapsed+=dt;const n=+N.value,velocity=+S.value*.45,bankDrag=+D.value*.055,view=camera.position.clone();let k=0;
for(let i=0;i<n;i++){const raw=i/(n-1)*2-1,lane=Math.tanh(raw*1.25)/Math.tanh(1.25),bank=Math.pow(Math.abs(lane),3),rate=1-bankDrag*bank;for(let j=0;j<PER;j++){const u=((j/PER+phases[i]+elapsed*velocity*rate/LENGTH)%1+1)%1,{p,t}=sample(u,lane),facing=view.clone().sub(p).normalize();let horizontal=new T.Vector3().crossVectors(t,facing).normalize();if(horizontal.lengthSq()<.001)horizontal.set(0,0,1);const vertical=new T.Vector3().crossVectors(facing,horizontal).normalize(),size=.115;const corners=[p.clone().addScaledVector(horizontal,-size).addScaledVector(vertical,-size),p.clone().addScaledVector(horizontal,size).addScaledVector(vertical,-size),p.clone().addScaledVector(horizontal,size).addScaledVector(vertical,size),p.clone().addScaledVector(horizontal,-size).addScaledVector(vertical,size)];verts.set(corners.flatMap(q=>q.toArray()),k*12);const id=(i*13+j*7)%symbols.length,c=id%grid,r=Math.floor(id/grid),eps=.006,u0=(c+eps)/grid,u1=(c+1-eps)/grid,v0=(r+eps)/grid,v1=(r+1-eps)/grid;uvs.set([u0,1-v1,u1,1-v1,u1,1-v0,u0,1-v0],k*8);const b=.72+.28*Math.sin(elapsed*1.2+j*.12+i);for(let q=0;q<4;q++)colors.set([.12*b,1.35*b,.65*b],k*12+q*3);k++;}}
