<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitreous III · Spherical Pen</title><style>*{box-sizing:border-box}body{margin:0;background:#10171b;color:#dce7e4;font:13px ui-monospace,monospace}main{max-width:850px;margin:auto;padding:16px}h1{font:30px Georgia,serif;margin:6px 0 14px}canvas{display:block;width:100%;aspect-ratio:720/640;touch-action:none;border-radius:12px;background:#10171b}button{border:1px solid #58666c;background:#26343b;color:#e8f2ef;border-radius:7px;padding:10px;margin:5px 4px 5px 0}.stats{display:flex;gap:20px;margin:10px 0;flex-wrap:wrap}.hint{color:#9bafad;font-size:12px}</style></head><body><main><small>QUATERNION INSTRUMENT / 003</small><h1>Vitreous · The Invisible Sphere</h1><canvas id="c" width="720" height="640"></canvas><div class="stats"><span><b id="angle">0°</b> tilt</span><span><b id="points">0</b> stroke points</span><span><b id="fill">72%</b> reservoir</span></div><div><button id="draw">Lift pen</button><button id="spin">Auto tumble</button><button id="fluid">Ink: viscous</button><button id="erase">Erase</button><button id="reset">Reset pen</button></div><p class="hint">Drag to rotate the pen itself in 3D. The camera and invisible sphere remain fixed. Quaternion orientation; nib exactly on the drawing sphere. Ink stays inside the barrel.</p><p id="error"></p></main><script type="module">
let T;try{T=await import('https://esm.sh/three@0.170.0')}catch(e){document.getElementById('error').textContent='3D module unavailable: '+e.message;throw e}
const el=id=>document.getElementById(id),canvas=el('c');let renderer;try{renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setSize(720,640,false);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setClearColor(0x10171b);renderer.outputColorSpace=T.SRGBColorSpace}catch(e){el('error').textContent='WebGL unavailable: '+e.message;throw e}
const scene=new T.Scene(),camera=new T.PerspectiveCamera(40,720/640,.1,100);camera.position.set(0,.35,10.9);camera.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xe8f8ff,0x1d2d37,2.7));let key=new T.DirectionalLight(0xffffff,3.1);key.position.set(-4,6,8);scene.add(key);let rim=new T.DirectionalLight(0x77b4c6,1.5);rim.position.set(5,-3,-3);scene.add(rim);
const R=3.15,pen=new T.Group();scene.add(pen);
const glass=new T.MeshPhysicalMaterial({color:0xc9e8ee,transparent:true,opacity:.22,roughness:.08,metalness:.04,depthWrite:false,side:T.DoubleSide}),metal=new T.MeshStandardMaterial({color:0xc4d0d0,metalness:.85,roughness:.19}),darkMetal=new T.MeshStandardMaterial({color:0x566d75,metalness:.78,roughness:.25}),inkMat=new T.MeshPhysicalMaterial({color:0x203b8c,roughness:.19,metalness:.08,clearcoat:1,transparent:true,opacity:.94});
function cyl(a,b,h,y,mat,open=false){let m=new T.Mesh(new T.CylinderGeometry(a,b,h,32,1,open),mat);m.position.y=y;pen.add(m);return m}
cyl(.27,.27,4.75,.23,glass,true);cyl(.29,.29,.12,2.65,metal);cyl(.28,.28,.16,-2.23,darkMetal);let cone=new T.Mesh(new T.ConeGeometry(.165,.74,32),metal);cone.rotation.z=Math.PI;cone.position.y=-2.65;pen.add(cone);let nib=new T.Mesh(new T.SphereGeometry(.045,12,10),darkMetal);nib.position.y=-R;pen.add(nib);
const reservoir=cyl(.215,.215,2.9,.12,inkMat),capA=new T.Mesh(new T.SphereGeometry(.215,20,12),inkMat),capB=capA.clone();pen.add(capA,capB);
const beads=[];for(let i=0;i<12;i++){let m=new T.Mesh(new T.SphereGeometry(.025+Math.random()*.025,10,8),inkMat);pen.add(m);beads.push({mesh:m,p:new T.Vector3((Math.random()-.5)*.25,(Math.random()-.5)*2,(Math.random()-.5)*.25),v:new T.Vector3()})}
const tipDirection=new T.Vector3(0,-1,0),worldDown=new T.Vector3(0,-1,0),localDown=new T.Vector3(),inverse=new T.Quaternion(),qStep=new T.Quaternion(),axis=new T.Vector3();
const strokeMat=new T.MeshBasicMaterial({color:0x8dd2ef,side:T.DoubleSide,transparent:true,opacity:.95,depthWrite:true}),strokeGroup=new T.Group();scene.add(strokeGroup);
let strokes=[],active=null,pointCount=0,lastPoint=null,draw=true,auto=false,viscous=true,fluidY=-.4,fluidV=0,fill=.72,frame=0;
function startStroke(){active={points:[],mesh:null};strokes.push(active);lastPoint=null}
function appendPoint(p){if(!active)startStroke();if(lastPoint&&lastPoint.distanceTo(p)<.012)return;if(lastPoint&&lastPoint.distanceTo(p)>1.4)startStroke();active.points.push(p.clone());lastPoint=p.clone();pointCount++;if(pointCount>11000){let old=strokes.shift();if(old?.mesh){strokeGroup.remove(old.mesh);old.mesh.geometry.dispose()}pointCount-=old?.points.length||0}if(active.points.length<2)return;let pts=active.points,verts=[],indices=[];for(let i=0;i<pts.length;i++){let n=pts[i].clone().normalize(),tangent=i===0?pts[1].clone().sub(pts[0]).normalize():i===pts.length-1?pts[i].clone().sub(pts[i-1]).normalize():pts[i+1].clone().sub(pts[i-1]).normalize(),side=new T.Vector3().crossVectors(n,tangent).normalize();if(side.lengthSq()<.1)side.set(1,0,0);for(let s of [-1,1]){let v=pts[i].clone().addScaledVector(side,.022*s).normalize().multiplyScalar(R+.008);verts.push(v.x,v.y,v.z)}if(i>0){let k=i*2;indices.push(k-2,k-1,k,k-1,k+1,k)}}let geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();if(active.mesh){strokeGroup.remove(active.mesh);active.mesh.geometry.dispose()}active.mesh=new T.Mesh(geo,strokeMat);strokeGroup.add(active.mesh)}
function erase(){for(let s of strokes)if(s.mesh){strokeGroup.remove(s.mesh);s.mesh.geometry.dispose()}strokes=[];active=null;lastPoint=null;pointCount=0;el('points').textContent='0'}
function reset(){pen.quaternion.identity();fluidY=-.4;fluidV=0;fill=.72;erase()}
let drag=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY};startStroke()});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;let magnitude=Math.hypot(dx,dy);if(magnitude<.01)return;axis.set(dy,-dx,0).normalize();qStep.setFromAxisAngle(axis,magnitude*.009);pen.quaternion.premultiply(qStep).normalize()});canvas.addEventListener('pointerup',e=>{if(drag?.id===e.pointerId)drag=null});canvas.addEventListener('pointercancel',()=>drag=null);
el('draw').onclick=e=>{draw=!draw;startStroke();e.target.textContent=draw?'Lift pen':'Resume drawing'};el('spin').onclick=e=>{auto=!auto;e.target.textContent=auto?'Stop tumble':'Auto tumble'};el('fluid').onclick=e=>{viscous=!viscous;e.target.textContent=viscous?'Ink: viscous':'Ink: fluid'};el('erase').onclick=erase;el('reset').onclick=reset;
const direction=new T.Vector3(),point=new T.Vector3();let last=0;function animate(now){requestAnimationFrame(animate);let dt=Math.min(.04,(now-last)/1000||.016);last=now;if(auto){axis.set(.4,1,.6).normalize();qStep.setFromAxisAngle(axis,dt*.31);pen.quaternion.premultiply(qStep).normalize()}inverse.copy(pen.quaternion).invert();localDown.copy(worldDown).applyQuaternion(inverse);let goal=localDown.y*.72;fluidV+=(goal-fluidY)*dt*(viscous?8:20);fluidV*=Math.exp(-dt*(viscous?7:3));fluidY+=fluidV*dt*8;let height=2.9*fill;reservoir.scale.y=fill;reservoir.position.y=fluidY*.5;reservoir.rotation.z+=(localDown.x*.22-reservoir.rotation.z)*Math.min(1,dt*(viscous?3:12));reservoir.rotation.x+=(localDown.z*.22-reservoir.rotation.x)*Math.min(1,dt*(viscous?3:12));capA.position.set(0,reservoir.position.y+height/2,0);capB.position.set(0,reservoir.position.y-height/2,0);capA.scale.y=.16;capB.scale.y=.16;for(let b of beads){b.v.addScaledVector(localDown,dt*2);b.v.multiplyScalar(Math.exp(-dt*(viscous?8:3)));b.p.addScaledVector(b.v,dt);b.p.y=T.MathUtils.clamp(b.p.y,-1.3,1.3);let r=Math.hypot(b.p.x,b.p.z);if(r>.18){b.p.x*=.18/r;b.p.z*=.18/r;b.v.x*=-.3;b.v.z*=-.3}if(Math.abs(b.p.y)>=1.3)b.v.y*=-.2;b.mesh.position.copy(b.p)}direction.copy(tipDirection).applyQuaternion(pen.quaternion).normalize();point.copy(direction).multiplyScalar(R);if(draw&&frame%2===0){appendPoint(point);fill=Math.max(.1,fill-.000012)}el('angle').textContent=Math.round(Math.acos(T.MathUtils.clamp(-localDown.y,-1,1))*180/Math.PI)+'°';el('points').textContent=pointCount;el('fill').textContent=Math.round(fill*100)+'%';renderer.render(scene,camera);frame++}requestAnimationFrame(animate);
</script></body></html>
