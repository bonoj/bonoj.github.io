<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crimson / Glass — Splatter Laboratory</title><style>*{box-sizing:border-box}body{margin:0;background:#10141b;color:#dce5e9;font:14px system-ui}main{max-width:820px;margin:auto;padding:16px}h1{font-size:23px}canvas{display:block;width:100%;height:65vh;min-height:390px;max-height:700px;touch-action:none;border-radius:12px;background:#10141b}button{border:1px solid #52606c;border-radius:8px;background:#28333e;color:#dce5e9;padding:10px 12px}input{accent-color:#bd3044}nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.controls{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}small{color:#aab8c2}</style><main><h1>CRIMSON / GLASS</h1><p><small>Adhesion · viscosity · gravity · experimental, unoptimized</small></p><canvas id="scene"></canvas><nav><button id="blast">Blast</button><button id="reset">Clean glass</button><button id="pause">Pause</button><button id="view">Front view</button></nav><div class="controls"><span>Viscosity</span><input id="visc" type="range" min="1" max="100" value="68"><output id="vv">68</output><span>Blast spread</span><input id="spread" type="range" min="5" max="100" value="53"><output id="sv">53</output></div><p><small id="count">0 droplets</small></p><p><small>Tap glass to aim · drag to orbit · wheel to zoom. Fluid simulation is approximate, not volumetric. Performance optimization deferred.</small></p></main><script>(()=>{'use strict';const cv=document.querySelector('#scene'),g=cv.getContext('2d'),$=s=>document.querySelector(s);let W=400,H=440,dpr=1,az=.38,el=.16,zoom=1,visc=.68,spread=.53,playing=true,drop=[],air=[],pools=[],shots=[],aim={x:0,y:3},last=performance.now(),down=null,press=null,moved=false,viewFront=false;const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0)}function project(x,y,z){let ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el),xx=x*ca-z*sa,zz=x*sa+z*ca,yy=y*ce-zz*se,depth=y*se+zz*ce,scale=Math.min(W/13,H/12)*zoom;return{x:W/2+xx*scale,y:H*.77-yy*scale,depth,scale}}function poly(points,fill,stroke,width=1){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}function splat(x,y,mass=1){let n=Math.round(R(5,11)),r=R(.04,.15)*Math.sqrt(mass);drop.push({x:C(x,-4.95,4.95),y:C(y,.02,8.9),r,mass,vy:0,age:0,stuck:R(.3,1.4),lobes:Array.from({length:n},()=>R(.65,1.5)),trail:[],shade:R(0,1)})}function blast(x=aim.x,y=aim.y){shots.push({t:0,x,y});for(let i=0;i<180;i++){let a=R(0,Math.PI*2),rad=Math.pow(Math.random(),.6)*(1.1+spread*3.4),xx=x+Math.cos(a)*rad,yy=y+Math.sin(a)*rad*.85;if(xx<-5||xx>5||yy<0||yy>9){if(Math.random()<.35)air.push({x:xx,y:yy,z:R(.1,2.2),vx:R(-.03,.03),vy:R(-.04,.1),vz:R(-.03,.03),r:R(.015,.055)});continue}let mass=R(.2,1.7);splat(xx,yy,mass);if(Math.random()<.3){let theta=R(0,6.28);air.push({x:xx,y:yy,z:R(.2,2),vx:Math.cos(theta)*R(.01,.12),vy:Math.sin(theta)*R(.01,.12),vz:R(-.09,.02),r:R(.012,.06)})}}$('#count').textContent=drop.length+' adhered'}function update(dt){let slow=1-visc*.9;for(const d of drop){d.age+=dt;d.stuck-=dt*.003;let pull=(.00035+slow*.006)*Math.max(.1,d.mass);d.vy+=pull*dt;if(d.stuck>0)d.vy*=.9;else d.vy*=.975;let old=d.y;d.y-=d.vy*dt;if(d.y<d.r){pools.push({x:d.x,r:d.r*.9,mass:d.mass});d.y=d.r;d.vy=0;d.stuck=100000}else if(old-d.y>.007&&Math.random()<.16){d.trail.push({x:d.x+R(-.02,.02),y:old,r:d.r*R(.2,.65)});if(d.trail.length>40)d.trail.shift()}if(d.y<.35&&d.mass>.6&&Math.random()<.007*dt){d.mass*=.9;splat(d.x+R(-.15,.15),d.y+R(.1,.3),.25)}}for(let i=air.length-1;i>=0;i--){let p=air[i];p.vy-=.004*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<=0){pools.push({x:p.x,r:p.r*2,mass:.2});air.splice(i,1)}else if(p.z<=.02&&Math.abs(p.x)<5&&p.y<9){splat(p.x,p.y,.3);air.splice(i,1)}else if(p.y>15||Math.abs(p.x)>15)air.splice(i,1)}for(let i=shots.length-1;i>=0;i--){shots[i].t+=dt*.04;if(shots[i].t>1)shots.splice(i,1)}}function draw(){g.fillStyle='#10141b';g.fillRect(0,0,W,H);let bg=g.createRadialGradient(W*.5,H*.5,10,W*.5,H*.5,W*.7);bg.addColorStop(0,'#263341');bg.addColorStop(1,'#10141b');g.fillStyle=bg;g.fillRect(0,0,W,H);const floor=[project(-7,0,-3),project(7,0,-3),project(7,0,4),project(-7,0,4)];poly(floor,'rgba(79,94,107,.23)','rgba(135,157,166,.25)');const pane=[project(-5,0,0),project(5,0,0),project(5,9,0),project(-5,9,0)];poly(pane,'rgba(142,192,208,.09)','rgba(173,222,235,.72)',2);for(let k=1;k<5;k++){let p=project(-5+k*2,0,0),q=project(-5+k*2,9,0);g.strokeStyle='rgba(175,225,240,.065)';g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke()}for(const p of pools){let a=project(p.x,0,0);g.beginPath();g.ellipse(a.x,a.y,Math.max(1,p.r*a.scale*2),Math.max(1,p.r*a.scale*.55),-.12,0,6.28);g.fillStyle='rgba(121,9,25,.83)';g.fill()}for(const d of drop){for(const t of d.trail){let a=project(t.x,t.y,.014);g.beginPath();g.arc(a.x,a.y,Math.max(.6,t.r*a.scale),0,6.28);g.fillStyle='rgba(117,8,25,.65)';g.fill()}let a=project(d.x,d.y,.02),rr=d.r*a.scale;g.beginPath();for(let j=0;j<d.lobes.length;j++){let theta=j/d.lobes.length*6.283,rad=rr*d.lobes[j],xx=a.x+Math.cos(theta)*rad,yy=a.y+Math.sin(theta)*rad*(1+Math.min(1,d.vy*15));j?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.closePath();g.fillStyle=d.shade>.5?'rgba(164,14,36,.94)':'rgba(118,7,24,.94)';g.fill();g.strokeStyle='rgba(75,0,15,.4)';g.lineWidth=.5;g.stroke();g.beginPath();g.arc(a.x-rr*.22,a.y-rr*.24,Math.max(.3,rr*.17),0,6.28);g.fillStyle='rgba(245,102,115,.35)';g.fill()}for(const p of air){let a=project(p.x,p.y,p.z);g.beginPath();g.arc(a.x,a.y,Math.max(.7,p.r*a.scale),0,6.28);g.fillStyle='#d5334c';g.fill()}for(const s of shots){let a=project(s.x,s.y,.03);g.beginPath();g.arc(a.x,a.y,(.3+s.t*1.6)*a.scale,0,6.28);g.strokeStyle='rgba(240,72,91,'+((1-s.t)*.55)+')';g.lineWidth=2;g.stroke()}g.strokeStyle='rgba(196,232,240,.5)';g.lineWidth=3;g.beginPath();g.moveTo(pane[0].x,pane[0].y);g.lineTo(pane[1].x,pane[1].y);g.stroke();g.fillStyle='rgba(200,230,240,.5)';g.font='11px monospace';g.fillText('GLASS / Z=0',12,22)}function frame(t){let dt=Math.min(2,(t-last)/16.7);last=t;if(playing)update(dt);draw();requestAnimationFrame(frame)}function point(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function target(p){let a=project(-5,0,0),b=project(5,0,0),c=project(-5,9,0),ux=b.x-a.x,uy=b.y-a.y,vx=c.x-a.x,vy=c.y-a.y,det=ux*vy-uy*vx||1,dx=p.x-a.x,dy=p.y-a.y,u=(dx*vy-dy*vx)/det,v=(ux*dy-uy*dx)/det;return{x:C(u*10-5,-4.8,4.8),y:C(v*9,.2,8.8)}}cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);down=point(e);press=down;moved=false});cv.addEventListener('pointermove',e=>{if(!down)return;let p=point(e),dx=p.x-down.x,dy=p.y-down.y;if(Math.hypot(p.x-press.x,p.y-press.y)>5)moved=true;if(moved){az=C(az+dx*.007,-1.25,1.25);el=C(el+dy*.004,-.35,.85);viewFront=false}down=p});cv.addEventListener('pointerup',e=>{if(!moved){aim=target(point(e));blast()}down=null;press=null});cv.addEventListener('wheel',e=>{e.preventDefault();zoom=C(zoom*(e.deltaY>0?.92:1.08),.5,2)},{passive:false});$('#blast').onclick=()=>blast();$('#reset').onclick=()=>{drop=[];air=[];pools=[];shots=[];$('#count').textContent='0 droplets'};$('#pause').onclick=()=>{playing=!playing;$('#pause').textContent=playing?'Pause':'Resume'};$('#view').onclick=()=>{viewFront=!viewFront;az=viewFront?0:.38;el=viewFront?0:.16;$('#view').textContent=viewFront?'Angled view':'Front view'};$('#visc').oninput=e=>{visc=e.target.value/100;$('#vv').textContent=e.target.value};$('#spread').oninput=e=>{spread=e.target.value/100;$('#sv').textContent=e.target.value};resize();new ResizeObserver(resize).observe(cv);blast(0,4.7);requestAnimationFrame(frame)})();</script></html>
