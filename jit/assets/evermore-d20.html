<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evermore II · D20</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b111b}#die{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}</style></head><body><canvas id="die" aria-label="Tap to roll Evermore II twenty-sided emoji die"></canvas><script>
(()=>{'use strict';const c=document.querySelector('#die'),g=c.getContext('2d'),em=['🪱','🦅','🐜','🪵','🍄','🦂','🔥','☀️','🛡️','🏹','⚔️','🐙','🧊','🪨','🐉','🌲','🥚','🐣','⚗️','🧠'],p=(1+Math.sqrt(5))/2,V=[[-1,p,0],[1,p,0],[-1,-p,0],[1,-p,0],[0,-1,p],[0,1,p],[0,-1,-p],[0,1,-p],[p,0,-1],[p,0,1],[-p,0,-1],[-p,0,1]].map(a=>{let l=Math.hypot(...a);return a.map(v=>v/l)}),F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
let w=320,h=360,rot=[-.38,.48,.13],vel=[0,0,0],y=0,vy=0,active=false,t=0,last=0;
function size(){let d=Math.min(devicePixelRatio||1,2);w=c.clientWidth;h=c.clientHeight;c.width=Math.round(w*d);c.height=Math.round(h*d);g.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();
function turn(v){let [x,y,z]=v,[a,b,d]=rot;[y,z]=[y*Math.cos(a)-z*Math.sin(a),y*Math.sin(a)+z*Math.cos(a)];[x,z]=[x*Math.cos(b)+z*Math.sin(b),-x*Math.sin(b)+z*Math.cos(b)];return [x*Math.cos(d)-y*Math.sin(d),x*Math.sin(d)+y*Math.cos(d),z]}
function proj(v){let s=Math.min(w,h)*.36*3.8/(3.8-v[2]*.5);return [w/2+v[0]*s,h*.47-v[1]*s+y]}
function paint(){g.clearRect(0,0,w,h);let bg=g.createRadialGradient(w*.5,h*.38,4,w*.5,h*.45,Math.max(w,h)*.8);bg.addColorStop(0,'#28384b');bg.addColorStop(1,'#0b111b');g.fillStyle=bg;g.fillRect(0,0,w,h);
g.save();g.translate(w/2,h*.79);g.scale(1,.25);let sh=g.createRadialGradient(0,0,1,0,0,Math.min(w,h)*.5);sh.addColorStop(0,'#000a');sh.addColorStop(1,'#0000');g.fillStyle=sh;g.beginPath();g.arc(0,0,Math.min(w,h)*.5,0,Math.PI*2);g.fill();g.restore();
let v=V.map(turn),fs=F.map((f,i)=>{let pts=f.map(j=>v[j]),n=pts.reduce((a,q)=>a.map((z,k)=>z+q[k]/3),[0,0,0]);return {i,pts,n,z:n[2]}}).sort((a,b)=>a.z-b.z);
for(let f of fs){if(f.z<=0)continue;let pts=f.pts.map(proj),light=Math.max(0,-f.n[0]*.35+f.n[1]*.65+f.n[2]*.7);g.beginPath();g.moveTo(...pts[0]);g.lineTo(...pts[1]);g.lineTo(...pts[2]);g.closePath();g.fillStyle='hsl('+(210+f.i%5*7)+' 34% '+(19+light*27)+'%)';g.fill();g.strokeStyle='#c4dcf4c7';g.lineWidth=1.7;g.stroke();let q=proj(f.n);g.save();g.clip();g.textAlign='center';g.textBaseline='middle';g.font=Math.round(Math.min(w,h)*.109)+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';g.globalAlpha=Math.min(1,f.z*1.8+.15);g.fillText(em[f.i],q[0],q[1]+1);g.restore()}}
function step(now){let dt=Math.min((now-last)/1000||.016,.035);last=now;if(active){t+=dt;rot=rot.map((v,i)=>v+vel[i]*dt);vel=vel.map(v=>v*Math.exp(-1.45*dt));vy+=1400*dt;y+=vy*dt;if(y>38){y=38;vy=-Math.abs(vy)*.48;vel[0]+=.4;vel[1]+=.6}if(t>2.2)active=false}else{y+=(22-y)*Math.min(1,dt*7);vel=vel.map(v=>v*.88);rot=rot.map((v,i)=>v+vel[i]*dt)}paint();requestAnimationFrame(step)}
c.addEventListener('pointerdown',()=>{active=true;t=0;y=-32;vy=-240;vel=[(Math.random()-.5)*19,(Math.random()-.5)*22,(Math.random()-.5)*16];if(Math.hypot(...vel)<5)vel[1]=12});requestAnimationFrame(step);
})();</script></body></html>
