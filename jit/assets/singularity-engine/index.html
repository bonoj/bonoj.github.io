<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><title>Singularity Engine · JIT Assets</title><style>*{box-sizing:border-box}body{margin:0;background:#080b13;color:#d9d6c7;font:14px system-ui}main{max-width:800px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(17px,4vw,24px);letter-spacing:.12em;margin:0}small{font:11px monospace;color:#a2bac0}canvas{display:block;width:100%;height:min(76vh,650px);min-height:370px;background:#080b13;border-radius:12px;touch-action:none}p{color:#929da6;font-size:12px}a{color:#9ed7da}</style></head><body><main><header><h1>SINGULARITY ENGINE</h1><small id="status">DORMANT</small></header><p>A kinetic apparatus. Touch the mechanism to inject energy.</p><canvas id="machine" aria-label="Interactive kinetic sculpture"></canvas><p id="caption">TOUCH THE MACHINE</p><p><a href="../">← JIT Assets</a></p></main><script>
(()=>{'use strict';const cv=document.getElementById('machine'),ctx=cv.getContext('2d');if(!ctx)return;let W=400,H=440,energy=0,stress=0,phase=0,velocity=.002,rupture=0,impulses=0,last=0,particles=[],pulses=[],time=0;const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}resize();new ResizeObserver(resize).observe(cv);function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function ring(x,y,r,color,width=1){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function dot(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=color;ctx.fill()}function gear(radius,teeth,rotation,color){ctx.save();ctx.rotate(rotation);ctx.beginPath();for(let i=0;i<teeth*4;i++){const a=i*TAU/(teeth*4),r=radius*(i%4<2?1.055:.94);if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();ring(0,0,radius*.72,color,.8);ring(0,0,radius*.22,color,1.5);for(let i=0;i<6;i++){let a=i*TAU/6;line(Math.cos(a)*radius*.24,Math.sin(a)*radius*.24,Math.cos(a)*radius*.7,Math.sin(a)*radius*.7,color,.8)}ctx.restore()}function render(){ctx.fillStyle='rgba(8,11,19,.36)';ctx.fillRect(0,0,W,H);let cx=W/2,cy=H/2,s=Math.min(W/390,H/430,1.4);ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);const active=clamp(energy/9,0,1);for(let i=0;i<48;i++){let a=i*TAU/48;line(Math.cos(a)*169,Math.sin(a)*169,Math.cos(a)*(i%4===0?188:176),Math.sin(a)*(i%4===0?188:176),'rgba(186,171,136,.4)',i%4===0?1.7:.7)}ring(0,0,169,'rgba(180,167,139,.6)',2);ring(0,0,158,'rgba(124,151,160,.35)',1);ring(0,0,149,'rgba(184,170,137,.35)',1);ctx.save();ctx.rotate(phase*.13);for(let i=0;i<12;i++){let a=i*TAU/12;line(Math.cos(a)*138,Math.sin(a)*138,Math.cos(a+TAU/12)*138,Math.sin(a+TAU/12)*138,'rgba(197,178,137,.7)',2)}ctx.restore();for(let i=0;i<8;i++){let a=i*TAU/8+phase*.07,x=Math.cos(a)*115,y=Math.sin(a)*115;ctx.save();ctx.translate(x,y);gear(20,12,phase*(i%2?-.8:.8)+i,'rgba(199,175,126,.75)');ctx.restore()}ctx.save();ctx.rotate(-phase*.45);gear(86,38,0,'rgba(176,192,192,.85)');ctx.restore();ctx.save();ctx.rotate(phase*.84);gear(58,26,0,'rgba(230,181,115,.95)');ctx.restore();ctx.save();ctx.rotate(-phase*1.25);for(let i=0;i<8;i++){let a=i*TAU/8;line(Math.cos(a)*16,Math.sin(a)*16,Math.cos(a)*43,Math.sin(a)*43,'rgba(114,218,230,.85)',2)}ring(0,0,44,'rgba(124,219,229,.85)',2);ctx.restore();for(let i=0;i<12;i++){let a=i*TAU/12+phase*.11,r=124+Math.sin(time*.001+i)*7,x=Math.cos(a)*r,y=Math.sin(a)*r;line(x,y,x+Math.cos(a)*22,y+Math.sin(a)*22,'rgba(213,191,143,.75)',2);dot(x+Math.cos(a)*22,y+Math.sin(a)*22,4,'#d5bc85')}let glow=ctx.createRadialGradient(0,0,0,0,0,35+active*14);glow.addColorStop(0,'#eafff5');glow.addColorStop(.15,'#79e5ee');glow.addColorStop(.5,'rgba(40,150,177,.5)');glow.addColorStop(1,'rgba(30,100,140,0)');dot(0,0,35+active*14,glow);ring(0,0,16,'rgba(225,250,243,.95)',2);if(rupture>0){for(let i=0;i<16;i++){let a=i*TAU/16+phase*.3,r=35+rupture*70;line(Math.cos(a)*r,Math.sin(a)*r,Math.cos(a)*(r+16),Math.sin(a)*(r+16),'rgba(247,157,99,'+(rupture*.8)+')',2)}}ctx.restore();for(let p of pulses)ring(p.x,p.y,p.r,'rgba(115,223,226,'+(p.life*.65)+')',1.5);for(let p of particles)dot(p.x,p.y,Math.max(.1,p.life*2),'rgba(255,198,119,'+p.life+')')}function inject(x,y){impulses++;energy=Math.min(20,energy+2.8);stress+=.19+energy*.015;velocity+=(Math.random()-.15)*.025;pulses.push({x,y,r:2,life:1});for(let i=0;i<28;i++){let a=Math.random()*TAU,v=.4+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.6+Math.random()*.4})}document.getElementById('caption').textContent='IMPULSE '+String(impulses).padStart(3,'0')}cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect();inject(e.clientX-r.left,e.clientY-r.top)});function loop(now){let dt=Math.min(40,now-last||16),d=dt/16.67;last=now;time+=dt;energy*=Math.pow(.996,d);stress=Math.max(0,stress-.00028*dt);velocity+=energy*.00004*d;velocity*=Math.pow(.999,d);phase+=velocity*d;if(stress>1.55&&rupture===0){rupture=1;stress=.12;energy*=.45;document.getElementById('caption').textContent='STRUCTURAL CASCADE · REASSEMBLING'}rupture=Math.max(0,rupture-d*.002);for(let p of pulses){p.r+=dt*.23;p.life-=dt*.0009}pulses=pulses.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*d;p.y+=p.vy*d;p.life-=dt*.0017}particles=particles.filter(p=>p.life>0);document.getElementById('status').textContent=rupture>.1?'REASSEMBLING':energy>8?'RESONANCE':energy>1?'ACTIVE':'DORMANT';render();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
