<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101513"><title>Merchant · Ravnica</title><style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#101513;color:#e9ebdf}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:18px 16px 36px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #39433c;padding-bottom:12px}h1{font:600 27px Georgia,serif;letter-spacing:.04em;margin:0}small,.muted{color:#a4b0a7}button,select,input,textarea{font:inherit;color:inherit;background:#1c2621;border:1px solid #4b5c50;border-radius:8px;padding:10px;max-width:100%}button{cursor:pointer}button:focus,input:focus,textarea:focus{outline:2px solid #b5cba7}button.primary{background:#354b3d}nav{display:flex;gap:8px;margin:16px 0;overflow:auto}nav button{flex:1;min-width:70px}.active{border-color:#d2bd8c;color:#f7dca1}section{border:1px solid #36463b;border-radius:12px;padding:14px;margin:12px 0;background:#172019}h2{font:500 19px Georgia,serif;margin:0 0 12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px 8px;background:#202d24;border-radius:9px;text-align:center}.metric b{font-size:21px;display:block}.metric small{font-size:11px}.record{border-top:1px solid #39483d;padding:12px 0}.record:first-child{border:0}a{color:#d5c18c;overflow-wrap:anywhere}label{display:block;font-size:12px;color:#b4c0b6;margin:10px 0 4px}input,textarea,select{width:100%}textarea{min-height:68px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.tag{font-size:11px;border:1px solid #536454;border-radius:6px;padding:3px 5px}p{line-height:1.5}footer{font-size:11px;color:#91a197;margin-top:24px}
</style></head><body><main><header><div><h1>MERCHANT</h1><small>RAVNICA / commercial membrane</small></div><button id="export" title="Export JSON">👁</button></header><nav id="nav"><button data-tab="observe" class="active">👁 Observe</button><button data-tab="hunt">🎯 Hunt</button><button data-tab="record">📜 Record</button><button data-tab="ledger">💰 Ledger</button></nav><div id="view"></div><footer>Local-only instrument · Live public-data queries on Hunt · No transactions · No credentials · Evidence is not revenue</footer></main><script>
(()=>{'use strict';const KEY='merchant-v01',stages=['observed','qualified','offered','accepted','delivered','settled','rejected'],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let events=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))events=v.filter(x=>x&&typeof x==='object').slice(0,1000)}catch{}let tab='observe',hits=[],huntError='',huntLoading=false;const $=s=>document.querySelector(s),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(events))}catch(e){alert('Local storage unavailable. Export records before leaving.')}};const usd=n=>'$'+Number(n||0).toFixed(2);const card=e=>'<div class="record"><div><b>'+esc(e.habitat)+'</b> <span class="tag">'+esc(e.stage)+'</span></div><p>'+esc(e.problem)+'</p><small>'+esc(e.created)+'</small>'+(e.source?'<p><a href="'+esc(/^https:\/\//.test(e.source)?e.source:'#')+'" target="_blank" rel="noopener noreferrer">Evidence source</a></p>':'')+'<small>Receipt '+usd(e.receipt)+' · Cost '+usd(e.cost)+' · Human '+Number(e.minutes||0)+' min</small></div>';function render(){const settled=events.filter(e=>e.stage==='settled');const net=settled.reduce((s,e)=>s+Number(e.receipt||0)-Number(e.cost||0),0);const mins=events.reduce((s,e)=>s+Number(e.minutes||0),0);$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='observe'){html='<div class="metrics"><div class="metric"><b>'+events.length+'</b><small>Records</small></div><div class="metric"><b>'+settled.length+'</b><small>Settled</small></div><div class="metric"><b>'+usd(net)+'</b><small>Net settled*</small></div></div><section><h2>Habitat watch</h2><p>Find a buyer already spending money. Prove a reproducible result. Record the transaction only when independently confirmed.</p><div class="actions"><button data-action="new">＋ Evidence</button><button data-action="sources">⌕ Sources</button></div></section><section><h2>Recent evidence</h2>'+(events.length?events.slice().reverse().slice(0,8).map(card).join(''):'<p class="muted">No observations yet. The empty ledger is truthful.</p>')+'</section>'}else if(tab==='hunt'){html='<section><h2>Federal spending reconnaissance</h2><p>Search historical federal contract awards. Past spending is evidence of a market, not an open solicitation or reachable buyer.</p><form id="hunt"><label>Product or service keyword</label><input name="keyword" maxlength="80" required placeholder="software modernization"><div class="actions"><button class="primary" type="submit">Search public awards</button></div></form><small>USAspending API · No credentials · Read-only</small></section><section><h2>Results</h2>'+(huntLoading?'<p>Querying…</p>':huntError?'<p>'+esc(huntError)+'</p>':hits.length?hits.map(x=>'<div class="record"><b>'+esc(x["Recipient Name"]||"Recipient unavailable")+'</b><p>'+esc(x.Description||x["Award ID"]||"Award")+'</p><small>'+esc(x["Awarding Agency"]||"")+' · '+esc(x["Award Amount"]||"")+'</small></div>').join(''):'<p class="muted">No results loaded. Search to begin.</p>')+'</section>'}else if(tab==='record'){html='<section><h2>Record an economic event</h2><form id="entry"><label>Habitat</label><select name="habitat"><option>public-records</option><option>surplus</option><option>invoice-audit</option><option>other</option></select><label>Stage</label><select name="stage">'+stages.map(x=>'<option>'+x+'</option>').join('')+'</select><label>Independent buyer problem / observable event</label><textarea name="problem" required maxlength="1000" placeholder="Who needs what? What actually happened?"></textarea><label>Evidence URL (public or authorized)</label><input name="source" type="url" placeholder="https://"><label>Settled receipt USD (only for settled events)</label><input name="receipt" type="number" min="0" step=".01" value="0"><label>Attributable cost USD</label><input name="cost" type="number" min="0" step=".01" value="0"><label>Human minutes</label><input name="minutes" type="number" min="0" step="1" value="0"><div class="actions"><button type="submit" class="primary">Record locally</button></div></form></section>'}else{html='<div class="metrics"><div class="metric"><b>'+usd(net)+'</b><small>Settled net*</small></div><div class="metric"><b>'+mins+'</b><small>Human min</small></div><div class="metric"><b>'+(mins>0?usd(net/(mins/60)):'—')+'</b><small>Net / hour*</small></div></div><section><h2>Evidence ledger</h2>'+(events.length?events.slice().reverse().map(card).join(''):'<p class="muted">No entries.</p>')+'</section><p class="muted">*User-entered figures, not independently verified. Excludes taxes and unrecorded obligations. No automatic payments or external validation.</p>'}$('#view').innerHTML=html}
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('#view').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='new'){tab='record';render()}else if(b.dataset.action==='sources'){window.open('https://www.usaspending.gov/search','_blank','noopener')}};$('#view').onsubmit=async e=>{if(e.target.id==='hunt'){e.preventDefault();const q=String(new FormData(e.target).get('keyword')||'').trim();if(!q)return;huntLoading=true;huntError='';hits=[];render();try{const res=await fetch('https://api.usaspending.gov/api/v2/search/spending_by_award/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filters:{keywords:[q],award_type_codes:['A','B','C','D']},fields:['Award ID','Recipient Name','Award Amount','Awarding Agency','Description','generated_internal_id'],page:1,limit:10,sort:'Award Amount',order:'desc'})});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.results))throw Error('Unexpected API response');hits=data.results;huntError=hits.length?'':'No matching awards returned.'}catch(err){huntError='Live search unavailable: '+err.message+'. Open <a href="https://www.usaspending.gov/search" target="_blank" rel="noopener noreferrer">official USAspending search</a> instead.'}finally{huntLoading=false;render()}return}if(e.target.id!=='entry')return;e.preventDefault();const f=new FormData(e.target),stage=f.get('stage'),receipt=Number(f.get('receipt')||0);if(receipt>0&&stage!=='settled'){alert('Receipts may only be entered as settled.');return}events.push({schema:'merchant-event/v0.1',id:crypto.randomUUID?.()||String(Date.now()),created:new Date().toISOString(),habitat:f.get('habitat'),stage,problem:String(f.get('problem')).trim(),source:String(f.get('source')),receipt,cost:Number(f.get('cost')||0),minutes:Number(f.get('minutes')||0),verified:false,authority:'manual-entry'});save();tab='ledger';render()};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'merchant-ledger/v0.1',exported:new Date().toISOString(),events},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='merchant-ledger.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render()})();
</script></body></html>
