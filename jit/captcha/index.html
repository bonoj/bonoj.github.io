<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Verification</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}.shell{width:min(100%,440px)}.brand{display:flex;align-items:center;justify-content:space-between;color:#69717e;font-size:11px;letter-spacing:.09em;margin-bottom:12px}.brand b{font-size:13px;color:#475569;letter-spacing:0}.card{background:#fff;border:1px solid #d8dce2;box-shadow:0 12px 36px #18233c12;border-radius:3px;overflow:hidden}.banner{background:#3569d4;color:white;padding:25px 23px 21px}.banner small{font-size:13px}.banner h1{font-size:25px;line-height:1.13;margin:8px 0 0;font-weight:600}.banner p{font-size:13px;margin:8px 0 0;opacity:.85}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px}.tile{aspect-ratio:1;position:relative;border:0;background:#e8e9eb;overflow:hidden;cursor:pointer;padding:0;touch-action:manipulation}.tile svg{display:block;width:100%;height:100%}.tile.selected:after{content:"";position:absolute;inset:0;background:#2f6ce43d;border:4px solid #3974ef}.check{position:absolute;top:5px;left:5px;background:#3475ef;color:white;border-radius:50%;width:24px;height:24px;display:none;place-items:center;font-weight:bold;z-index:2}.selected .check{display:grid}.footer{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid #eee}.tools{display:flex;gap:8px}.tool{border:0;background:transparent;color:#7b8491;font-size:23px;cursor:pointer;padding:4px}.verify{background:#3475ed;color:white;border:0;border-radius:2px;font-size:13px;font-weight:bold;padding:13px 25px;cursor:pointer}.verify:active{transform:translateY(1px)}.status{font-size:12px;color:#777;min-height:35px;padding:9px 14px 0}.bottom{font-size:11px;color:#9aa0a6;text-align:center;margin-top:14px}.progress{display:flex;gap:4px;margin-top:10px}.progress span{height:3px;background:#e0e3e8;flex:1}.progress span.on{background:#4d7de1}.terminal{padding:24px}.terminal h2{font-size:21px;margin:0 0 12px}.terminal p{font-size:14px;line-height:1.6}.terminal button{background:#3475ed;color:white;border:0;padding:12px 18px;cursor:pointer}.quiet{color:#75808f;font-size:12px}.pulse{animation:pulse .8s infinite alternate}@keyframes pulse{to{opacity:.25}}@media(max-width:380px){.banner h1{font-size:22px}}
</style></head><body><main class="shell"><div class="brand"><b>◈ identity assurance</b><span>SESSION <span id="session"></span></span></div><section class="card" id="card"></section><div class="bottom">Integrity services · Behavioral attestation · v4.8.2</div></main><script>
const card=document.querySelector('#card'),session=document.querySelector('#session');session.textContent=Math.random().toString(36).slice(2,8).toUpperCase();
let stage=0,selected=new Set(),attempts=0,history=[],doubt=0;
const tasks=[
{title:'Select all images with traffic lights',sub:'Click verify once there are none left.',kind:'traffic',reply:['Traffic lights are a common indicator of human recognition.','Your selection has been recorded.']},
{title:'Select all images containing regret',sub:'Select each image that contains regret.',kind:'regret',reply:['Regret cannot be verified from pixels alone.','Your confidence has been recorded as evidence.']},
{title:'Select the person pretending to enjoy themselves',sub:'Only one answer is correct.',kind:'faces',reply:['Social performance is a useful human indicator.','The system cannot distinguish sincerity from compliance.']},
{title:'Prove you have experienced Tuesday',sub:'Select every image that feels like Tuesday.',kind:'tuesday',reply:['Tuesday is not a visual category.','Your willingness to classify it is noteworthy.']},
{title:'Select all images that would select you',sub:'Mutual recognition is required.',kind:'eyes',reply:['The images have declined to confirm your selection.','A reciprocal selection will now be attempted.']}
];
function art(kind,i){const hue=({traffic:205,regret:32,faces:185,tuesday:220,eyes:265}[kind]+i*37)%360;let shapes='';
if(kind==='traffic'){shapes='<rect x="0" y="68" width="120" height="52" fill="#5a646b"/><path d="M0 78H120 M0 107H120" stroke="#c4ccd0" stroke-width="3"/><path d="M20 0V120 M88 0V120" stroke="#f4f5f7" stroke-width="2"/>';if(i%3!==1)shapes+='<rect x="'+(30+i%3*17)+'" y="15" width="18" height="43" rx="3" fill="#252e35"/>'+[0,1,2].map((k)=>'<circle cx="'+(39+i%3*17)+'" cy="'+(23+k*13)+'" r="5" fill="'+(['#ec5552','#e4b64d','#55ae79'][k])+'" opacity="'+(k===i%3?1:.4)+'"/>').join('');}
if(kind==='regret'||kind==='tuesday'){shapes='<rect x="14" y="12" width="92" height="94" rx="3" fill="#f3e6cf" opacity=".8"/><path d="M20 35H95M20 48H75M20 61H90" stroke="#a6a19a" stroke-width="3"/>';if(i%2)shapes+='<path d="M72 79l11 10 21-25" fill="none" stroke="#a66e69" stroke-width="4"/>';else shapes+='<circle cx="60" cy="83" r="15" fill="none" stroke="#9e8d7c" stroke-width="3"/>';}
if(kind==='faces'){shapes='<circle cx="60" cy="49" r="29" fill="#d9ad89"/><path d="M20 120Q23 83 60 83T100 120" fill="#546b7e"/><circle cx="49" cy="47" r="3"/><circle cx="72" cy="47" r="3"/><path d="M47 62Q60 '+(i%3===0?78:i%3===1?59:70)+' 73 62" fill="none" stroke="#62483f" stroke-width="3"/>';}
if(kind==='eyes'){shapes='<path d="M12 60Q60 8 108 60Q60 112 12 60Z" fill="#f2edf9" stroke="#3c3152" stroke-width="4"/><circle cx="'+(50+i%3*8)+'" cy="60" r="23" fill="#655187"/><circle cx="'+(50+i%3*8)+'" cy="60" r="12" fill="#201a31"/><circle cx="'+(43+i%3*8)+'" cy="51" r="5" fill="white"/>';}
return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="120" fill="hsl('+hue+' 25% 79%)"/><path d="M0 0L120 120M120 0L0 120" stroke="#fff" stroke-opacity=".12"/>'+shapes+'</svg>';}
function render(){selected.clear();let t=tasks[stage];if(!t){finale();return;}card.innerHTML='<div class="banner"><small>Verification challenge '+(stage+1)+' of 5</small><h1>'+t.title+'</h1><p>'+t.sub+'</p><div class="progress">'+tasks.map((_,i)=>'<span class="'+(i<=stage?'on':'')+'"></span>').join('')+'</div></div><div class="tiles">'+Array.from({length:9},(_,i)=>'<button class="tile" data-i="'+i+'" aria-label="Image '+(i+1)+'">'+art(t.kind,i)+'<span class="check">✓</span></button>').join('')+'</div><div class="status" id="status">Awaiting human input.</div><div class="footer"><div class="tools"><button class="tool" id="refresh" title="New challenge">↻</button><button class="tool" id="audio" title="Audio challenge">◖))</button><button class="tool" id="help" title="Help">ⓘ</button></div><button class="verify" id="verify">VERIFY</button></div>';
card.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;selected.has(i)?selected.delete(i):selected.add(i);el.classList.toggle('selected');document.querySelector('#status').textContent=selected.size+' image'+(selected.size===1?'':'s')+' selected.';});
document.querySelector('#verify').onclick=verify;document.querySelector('#refresh').onclick=()=>{doubt++;document.querySelector('#status').textContent=['Challenge regeneration noted.','Avoidance behavior recorded.','Repeated refreshes may indicate consciousness.'][Math.min(doubt-1,2)];};document.querySelector('#audio').onclick=()=>{document.querySelector('#status').textContent='Audio challenge requires proof of listening.';};document.querySelector('#help').onclick=()=>{document.querySelector('#status').textContent='Instructions are provided above. Interpretation is your responsibility.';};}
function verify(){let t=tasks[stage];attempts++;history.push({stage,selected:[...selected],at:Date.now()});const status=document.querySelector('#status'),button=document.querySelector('#verify');button.disabled=true;button.textContent='ANALYZING';status.textContent=t.reply[0];setTimeout(()=>{status.textContent=t.reply[1];setTimeout(()=>{stage++;render()},1150)},950)}
function finale(){card.innerHTML='<div class="banner"><small>FINAL ATTESTATION</small><h1>Verification requires verification</h1><p>Human status remains under review.</p></div><div class="terminal"><h2 id="heading">The system will now verify itself.</h2><p id="narrative">Please remain available while identity assurance completes its own assessment.</p><p class="quiet" id="audit">Self-test initiated.</p><button id="continue" style="display:none">CONTINUE</button></div>';let lines=[['Checking recognition engine…','Recognition engine identifies itself as human.'],['Checking emotional inference…','Engine reports experiencing mild professional regret.'],['Checking Tuesday exposure…','Engine cannot establish that it has ever experienced Tuesday.'],['Checking reciprocal trust…','Engine does not trust its own assessment.'],['Human verification failed.','The verifier cannot verify the verifier.']];let n=0;const tick=()=>{if(n>=lines.length){document.querySelector('#heading').textContent='ARE YOU A ROBOT?';document.querySelector('#narrative').textContent='The system is requesting assistance with its own verification.';document.querySelector('#audit').textContent='Human subject: inconclusive. Verification authority: inconclusive.';const b=document.querySelector('#continue');b.style.display='inline-block';b.textContent='I AM NOT A ROBOT';b.onclick=()=>{document.querySelector('#heading').textContent='That is exactly what a robot would say.';document.querySelector('#narrative').textContent='Please select all images containing trust.';b.textContent='BEGIN AGAIN';b.onclick=()=>{stage=0;attempts=0;history=[];render()};};return;}document.querySelector('#audit').textContent=lines[n][0];document.querySelector('#narrative').textContent=lines[n][1];n++;setTimeout(tick,1600)};setTimeout(tick,1000);}
render();
</script></body></html>
