<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11141a"><title>Material Forge · JIT</title><style>*{box-sizing:border-box}body{margin:0;background:#101319;color:#eee7db;font:14px system-ui}main{height:100dvh;min-height:420px;display:flex;flex-direction:column}header{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:8px}header b{letter-spacing:.15em}header button{background:#302d38;color:#e7d9c3;border:1px solid #756958;border-radius:9px;padding:7px 12px;cursor:pointer}#view{position:relative;flex:1;min-height:160px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;top:10px;left:12px;color:#c2b6a7;font-size:11px;pointer-events:none}.panel{padding:10px 13px 17px;background:#1a1c24;border-top:1px solid #45414a}.signs{display:flex;gap:5px}.signs button{flex:1;min-width:0;padding:10px 2px;background:#292a34;border:1px solid #48444e;color:#c9c1b9;border-radius:9px;font-size:12px}.signs button.active{border-color:#d5b47c;background:#423a35;color:#ffe1a6}.sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}label{font-size:11px;color:#c5b9ac;display:flex;flex-direction:column;gap:6px}input{width:100%;accent-color:#d8b27b}.catalog{display:flex;gap:8px;align-items:center;margin-top:10px}.catalog select{flex:1;min-width:0;background:#292a34;color:#eee7db;border:1px solid #756958;border-radius:8px;padding:9px}.catalog button{background:#302d38;color:#e7d9c3;border:1px solid #756958;border-radius:8px;padding:9px;cursor:pointer}.countline{display:flex;align-items:center;gap:10px;margin-top:12px}.countline label{flex:1}.countline strong{min-width:58px;text-align:right;font-variant-numeric:tabular-nums}.status{font-size:11px;color:#a69c95;margin-top:9px}@media(min-width:750px){main{max-width:1050px;margin:auto}.panel{padding:15px 22px 22px}}</style></head><body><main><header><b>✧ MATERIAL FORGE</b><button id="eye" title="Copy diagnostics">👁 Copy</button></header><div id="view"><div class="hint">Drag to orbit · pinch / scroll to zoom · drag light slider</div></div><section class="panel"><div class="signs" id="signs"><button data-i="0">AARD</button><button data-i="1" class="active">IGNI</button><button data-i="2">YRDEN</button><button data-i="3">QUEN</button><button data-i="4">AXII</button></div><div class="catalog"><select id="catalog" aria-label="Material catalog"></select><button id="recipe">Copy recipe</button></div><div class="sliders"><label>Energy<input id="energy" type="range" min="0" max="2" step=".01" value="1"></label><label>Relief<input id="relief" type="range" min="0" max="2" step=".01" value="1"></label><label>Light angle<input id="light" type="range" min="-3.14" max="3.14" step=".01" value="-.7"></label></div><div class="countline"><label>Specimens · <span id="countText">1</span><input id="count" type="range" min="0" max="7" step="1" value="0"></label><strong id="fps">— fps</strong></div><div class="status" id="status">Procedural 3D field · no textures · no UVs</div></section></main><script type="module">
const view=document.querySelector('#view'),status=document.querySelector('#status');
// Indexed, portable known-good treatments. Add entries here; shader mode maps to the branches below.
// A recipe is a visual starting point, not a separate shader implementation.
const MATERIALS=Object.freeze([
 {id:"aard-pressure",name:"Aard · Pressure stone",mode:0,energy:1,relief:1,lightAngle:-.7,description:"Blue-grey stone with propagating pressure bands"},
 {id:"igni-ember",name:"Igni · Living ember",mode:1,energy:1,relief:1,lightAngle:-.7,description:"Charcoal with glowing molten veins"},
 {id:"yrden-crystal",name:"Yrden · Arcane crystal",mode:2,energy:1,relief:1,lightAngle:-.7,description:"Purple crystalline fissures and rim light"},
 {id:"quen-amber",name:"Quen · Shield amber",mode:3,energy:1,relief:1,lightAngle:-.7,description:"Golden translucent-looking stress bands"},
 {id:"axii-glass",name:"Axii · Hypnotic glass",mode:4,energy:1,relief:1,lightAngle:-.7,description:"Smoky green swirling optical bands"}
]);
const byId=Object.fromEntries(MATERIALS.map(m=>[m.id,m]));
const catalog=document.querySelector('#catalog');
for(const m of MATERIALS){const o=document.createElement('option');o.value=m.id;o.textContent=m.name;catalog.append(o)}
let activeRecipe=MATERIALS[1];catalog.value=activeRecipe.id;
function exportRecipe(m){return JSON.stringify({schema:"jit-material-recipe/v1",source:"jit/materials/",...m},null,2)}
function saveText(text,name){try{const blob=new Blob([text],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){status.textContent="Export unavailable"}}
try{
const T=await import('https://esm.sh/three@0.170.0');const scene=new T.Scene();scene.background=new T.Color('#11141a');const camera=new T.PerspectiveCamera(42,1,.1,100);let az=.55,el=.3,dist=7.3;
function cameraPos(){camera.position.set(dist*Math.sin(az)*Math.cos(el),dist*Math.sin(el)+.3,dist*Math.cos(az)*Math.cos(el));camera.lookAt(0,0,0)}cameraPos();
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;view.appendChild(renderer.domElement);
scene.add(new T.AmbientLight(0x6f7899,1.15));const light=new T.PointLight(0xffdfb0,80,20);scene.add(light);const back=new T.DirectionalLight(0x8ea9ef,2);back.position.set(-3,4,-5);scene.add(back);
const geometry=new T.IcosahedronGeometry(1.65,3);const pos=geometry.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i),n=1+.12*Math.sin(x*3.1+Math.sin(z*2.3))+.09*Math.cos(y*4.1-z*1.8)+.05*Math.sin(x*7+z*6);pos.setXYZ(i,x*n,y*n,z*n)}geometry.computeVertexNormals();
const vertex=`varying vec3 vP;varying vec3 vN;varying vec3 vW;uniform float uTime;uniform float uRelief;
void main(){vP=position;vec3 p=position;float d=sin(p.x*5.+sin(p.z*3.))*sin(p.y*4.+p.z*2.);p+=normalize(position)*d*.035*uRelief;vec4 wp=modelMatrix*instanceMatrix*vec4(p,1.);vW=wp.xyz;vN=normalize(mat3(modelMatrix*instanceMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*wp;}`;
const fragment=`precision highp float;varying vec3 vP;varying vec3 vN;varying vec3 vW;uniform float uTime,uEnergy,uRelief,uMode;uniform vec3 uLight,uEye;
float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,v=0.;for(int i=0;i<4;i++){v+=a*noise(p);p=p*2.04+7.1;a*=.5;}return v;}
void main(){vec3 p=vP;float t=uTime;float n=fbm(p*2.6+vec3(0,t*.16,0));float detail=fbm(p*10.+n*3.);vec3 N=normalize(vN);float bumps=(fbm(p*14.+n*2.)-.5)*uRelief;N=normalize(N+vec3(dFdx(bumps),dFdy(bumps),0.)*.32);
vec3 L=normalize(uLight-vW),V=normalize(uEye-vW),H=normalize(L+V);float diffuse=max(dot(N,L),0.),rim=pow(1.-max(dot(N,V),0.),2.5),spec=pow(max(dot(N,H),0.),28.);
vec3 base=vec3(.3),glow=vec3(0.);float shine=.1;
if(uMode<.5){float waves=sin(length(p)*14.-t*3.+n*6.);base=mix(vec3(.085,.15,.2),vec3(.24,.42,.48),n);glow=vec3(.26,.68,1.)*(pow(max(waves,0.),7.)*.7+rim*.5)*uEnergy;shine=.6;}
else if(uMode<1.5){float veins=pow(1.-abs(sin((p.x+p.y*.37+p.z*.6)*12.+n*13.+t*.55)),13.);base=mix(vec3(.045,.039,.035),vec3(.24,.105,.055),detail);glow=vec3(1.8,.29,.025)*(veins*.9+pow(n,5.)*.5)*uEnergy;shine=.15;}
else if(uMode<2.5){float cells=abs(sin(p.x*9.+n*4.)*sin(p.y*8.-n*5.)*sin(p.z*7.));float fissure=pow(1.-cells,14.);base=mix(vec3(.085,.045,.17),vec3(.31,.19,.48),n);glow=vec3(.62,.2,1.6)*(fissure*.48+rim*.55)*uEnergy;shine=.6;}
else if(uMode<3.5){float band=pow(abs(sin(n*18.+length(p)*6.-t*.6)),18.);base=mix(vec3(.23,.14,.035),vec3(.67,.41,.12),n);glow=vec3(1.1,.61,.13)*(rim*.9+band*.32)*uEnergy;shine=1.2;}
else{float spiral=sin(atan(p.y,p.x)*5.+length(p)*7.+n*6.-t*.65);base=mix(vec3(.025,.11,.085),vec3(.12,.39,.27),.5+.5*spiral);glow=vec3(.09,.9,.43)*(pow(max(spiral,0.),9.)*.5+rim*.45)*uEnergy;shine=.9;}
vec3 color=base*(.23+diffuse*.9)+glow+vec3(1.,.85,.66)*spec*shine*(.4+uEnergy*.3);color+=rim*base*.28;gl_FragColor=vec4(color,1.);}`;
const uniforms={uTime:{value:0},uEnergy:{value:1},uRelief:{value:1},uMode:{value:1},uLight:{value:new T.Vector3()},uEye:{value:new T.Vector3()}};
const material=new T.ShaderMaterial({vertexShader:vertex,fragmentShader:fragment,uniforms,extensions:{derivatives:true}});const MAX=1000,steps=[1,10,25,50,100,250,500,1000];let count=1;
const specimen=new T.InstancedMesh(geometry,material,MAX);specimen.frustumCulled=false;scene.add(specimen);
const dummy=new T.Object3D();
function populate(n){count=n;specimen.count=n;const columns=Math.ceil(Math.sqrt(n));const spacing=n===1?0:3;for(let i=0;i<n;i++){const x=i%columns-(columns-1)/2,z=Math.floor(i/columns)-(Math.ceil(n/columns)-1)/2;dummy.position.set(x*spacing,Math.sin(i*1.73)*.18,z*spacing);dummy.rotation.set(i*.71,i*1.13,i*.37);dummy.scale.setScalar(n===1?1:.64);dummy.updateMatrix();specimen.setMatrixAt(i,dummy.matrix)}specimen.instanceMatrix.needsUpdate=true;const extent=n===1?0:columns*spacing*.5;dist=n===1?7.3:Math.max(10,extent*2.9);cameraPos();document.querySelector('#countText').textContent=n.toLocaleString()}
populate(1);document.querySelector('#count').oninput=e=>populate(steps[+e.target.value]);
const ring=new T.Mesh(new T.TorusGeometry(2.38,.012,5,120),new T.MeshBasicMaterial({color:0x82755f,transparent:true,opacity:.38}));ring.rotation.x=Math.PI/2.7;scene.add(ring);
function choose(m){activeRecipe=m;catalog.value=m.id;uniforms.uMode.value=m.mode;uniforms.uEnergy.value=m.energy;uniforms.uRelief.value=m.relief;lightAngle=m.lightAngle;document.querySelector('#energy').value=m.energy;document.querySelector('#relief').value=m.relief;document.querySelector('#light').value=m.lightAngle;document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('active',+b.dataset.i===m.mode));status.textContent=m.description}
catalog.onchange=e=>choose(byId[e.target.value]);
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>choose(MATERIALS[+b.dataset.i]));
document.querySelector('#recipe').onclick=async()=>{const data=exportRecipe({...activeRecipe,energy:uniforms.uEnergy.value,relief:uniforms.uRelief.value,lightAngle});try{await navigator.clipboard.writeText(data);status.textContent="Recipe copied · "+activeRecipe.id}catch(e){saveText(data,activeRecipe.id+".json");status.textContent="Recipe downloaded · "+activeRecipe.id}};
document.querySelector('#energy').oninput=e=>uniforms.uEnergy.value=+e.target.value;document.querySelector('#relief').oninput=e=>uniforms.uRelief.value=+e.target.value;
let lightAngle=-.7;document.querySelector('#light').oninput=e=>lightAngle=+e.target.value;
const pointers=new Map();let pinch=null;const c=renderer.domElement;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pinch=null};c.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){az-=(e.clientX-old.x)*.007;el=Math.max(-1.25,Math.min(1.25,el+(e.clientY-old.y)*.006));cameraPos()}else if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch!==null){dist=Math.max(3.5,Math.min(14,dist*pinch/d));cameraPos()}pinch=d}};for(const event of ['pointerup','pointercancel'])c.addEventListener(event,e=>{pointers.delete(e.pointerId);pinch=null});c.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(3.5,Math.min(14,dist+e.deltaY*.009));cameraPos()},{passive:false});
const resize=()=>{const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)};const ro=new ResizeObserver(resize);ro.observe(view);resize();const clock=new T.Clock();let running=true;const samples=[];let last=performance.now(),fpsAt=last,frames=0;const build="materials/03";function frame(){if(!running)return;uniforms.uTime.value=clock.getElapsedTime();light.position.set(Math.cos(lightAngle)*5,4,Math.sin(lightAngle)*5);uniforms.uLight.value.copy(light.position);uniforms.uEye.value.copy(camera.position);renderer.render(scene,camera);const now=performance.now(),delta=now-last;last=now;if(delta>0&&delta<500){samples.push(delta);if(samples.length>240)samples.shift()}frames++;if(now-fpsAt>=1000){document.querySelector("#fps").textContent=Math.round(frames*1000/(now-fpsAt))+" fps";frames=0;fpsAt=now}requestAnimationFrame(frame)}frame();document.querySelector('#eye').onclick=async()=>{const sorted=[...samples].sort((a,b)=>a-b);const percentile=p=>sorted.length?+sorted[Math.min(sorted.length-1,Math.floor((sorted.length-1)*p))].toFixed(2):null;const data={schema:"jit-materials-eye/v1",build,at:new Date().toISOString(),specimens:count,recipeId:activeRecipe.id,material:["Aard","Igni","Yrden","Quen","Axii"][uniforms.uMode.value],energy:uniforms.uEnergy.value,relief:uniforms.uRelief.value,lightAngle,viewport:{width:view.clientWidth,height:view.clientHeight,pixelRatio:renderer.getPixelRatio()},geometry:{trianglesPerSpecimen:geometry.index?geometry.index.count/3:geometry.attributes.position.count/3},render:{drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles},frameMs:{samples:sorted.length,p50:percentile(.5),p95:percentile(.95),p99:percentile(.99)},userAgent:navigator.userAgent,notes:"Frame intervals include browser scheduling and are not GPU timings; one instanced draw for specimens."};const json=JSON.stringify(data,null,2);try{await navigator.clipboard.writeText(json);status.textContent="👁 Diagnostics copied · "+count+" specimens"}catch(e){const blob=new Blob([json],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="materials-eye.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent="👁 Diagnostics downloaded (clipboard unavailable)"}};window.addEventListener('pagehide',()=>{running=false;ro.disconnect()},{once:true});
}catch(e){status.textContent='WebGL unavailable: '+String(e.message||e)}
</script></body></html>
