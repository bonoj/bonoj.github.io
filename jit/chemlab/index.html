<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b151a"><title>ChemLab · Pocket Chemistry</title><style>
:root{color-scheme:dark;--ink:#f2f7f4;--muted:#adc7c4;--mint:#a2e8d5;--line:#38565b}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{font:14px system-ui,sans-serif;color:var(--ink);background:#0b151a}main{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}header{padding:max(9px,env(safe-area-inset-top)) 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(100deg,#1b3a3d,#0d1c25)}h1{font:clamp(24px,5vw,34px)/1 Georgia,serif;margin:0}.sub{color:var(--muted);font-size:11px;text-align:right}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:7px 8px;background:#102229;border-bottom:1px solid var(--line)}button{background:#233a40;border:1px solid #45656a;color:var(--ink);border-radius:10px;min-height:47px;padding:5px 3px;font:inherit;cursor:pointer;touch-action:manipulation}button[aria-selected=true]{background:#d5f3e8;color:#142d31;border-color:#d5f3e8;font-weight:800}button:focus-visible{outline:3px solid #ffd294;outline-offset:1px}.tabname{display:block;font-weight:800;font-size:13px}.tabdesc{display:block;font-size:10px;opacity:.83}#workbench{position:relative;min-height:0;overflow:hidden}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b151a;display:none}iframe.active{display:block}@media(max-height:550px){header{padding-top:4px;padding-bottom:4px}h1{font-size:22px}.sub,.tabdesc{display:none}.tabs{padding:4px}.tabs button{min-height:34px}}@media(max-width:340px){.tabname{font-size:11px}}
</style></head><body><main><header><h1>ChemLab ⚗</h1><div class="sub">Oli's pocket laboratory<br>Two experiments. One home.</div></header>
<nav class="tabs" role="tablist" aria-label="Chemistry laboratory"><button id="tab-ion" role="tab" aria-selected="true" aria-controls="panel-ion" tabindex="0"><span class="tabname">Ion Garden</span><span class="tabdesc">Balance charges</span></button><button id="tab-acid" role="tab" aria-selected="false" aria-controls="panel-acid" tabindex="-1"><span class="tabname">Acid–Base</span><span class="tabdesc">Classify compounds</span></button><button id="tab-guide" role="tab" aria-selected="false" aria-controls="panel-guide" tabindex="-1"><span class="tabname">CHE 001</span><span class="tabdesc">Field guide</span></button></nav>
<div id="workbench"><iframe id="panel-ion" class="active" title="Ion Garden: charge balancing laboratory" src="../ion-garden/" loading="eager"></iframe><iframe id="panel-acid" title="Acid–Base classification laboratory" data-src="../acid-base/" loading="lazy"></iframe><iframe id="panel-guide" title="CHE 001 field guide and calculators" data-src="../chem001/" loading="lazy"></iframe></div></main>
<script>
'use strict';
const keys=['ion','acid','guide'];let active='ion';const $=id=>document.getElementById(id);
function show(key,updateHash=true){if(!keys.includes(key))return false;active=key;for(const k of keys){const on=k===key,tab=$('tab-'+k),panel=$('panel-'+k);tab.setAttribute('aria-selected',String(on));tab.tabIndex=on?0:-1;panel.classList.toggle('active',on);panel.setAttribute('aria-hidden',String(!on));if(on&&panel.dataset.src&&!panel.src){panel.src=panel.dataset.src}}if(updateHash&&location.hash!=='#'+key)history.replaceState(null,'','#'+key);return true}
for(const key of keys){const tab=$('tab-'+key);tab.addEventListener('click',()=>show(key));tab.addEventListener('keydown',e=>{const i=keys.indexOf(key);let next;if(e.key==='ArrowRight')next=keys[(i+1)%keys.length];else if(e.key==='ArrowLeft')next=keys[(i+keys.length-1)%keys.length];else if(e.key==='Home')next=keys[0];else if(e.key==='End')next=keys[keys.length-1];if(next){e.preventDefault();show(next);$('tab-'+next).focus()}})}
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));show(keys.includes(location.hash.slice(1))?location.hash.slice(1):'ion',false);
function regression(){if(keys.length!==3||new Set(keys).size!==3)throw Error('Tab keys');for(const k of keys){if(!$('tab-'+k)||!$('panel-'+k))throw Error('Missing '+k)}return true}window.chemLabRegression=regression;regression();
</script></body></html>
