<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8e7e0"><title>Church of Unitology | Continuity in All Things</title>
<style>
:root{--sx:18px;--sy:22px;--ambient:1;--warm:1;--paper:#f4f2ec;--ink:#30383a;--edge:#c7c5b9;--shadow:rgba(30,39,48,.22);font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:#d9d9d2;color:var(--ink);overflow-x:hidden}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #8b7351;outline-offset:4px}.site{min-height:100vh;background:var(--paper);transition:background 1s,color 1s}.mast{height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,70px);position:relative;z-index:10;border-bottom:1px solid #9a9a8c66;background:#f6f5efdd;backdrop-filter:blur(18px)}.seal{display:flex;align-items:center;gap:13px}.mark{width:31px;height:44px;position:relative;border:2px solid #8f7d60;transform:skewY(-13deg);clip-path:polygon(50% 0,100% 40%,73% 100%,27% 100%,0 40%)}.mark:before{content:"";position:absolute;inset:7px;border:1px solid #8f7d60;transform:rotate(27deg)}.brand{font:20px/1.1 Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:9px/1.6 Arial,sans-serif;letter-spacing:.25em;color:#78786f;margin-top:5px}.mastnav{display:flex;gap:25px;align-items:center;font:10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.mastnav button{border:0;background:none;color:#4b5454;padding:12px 0}.mastnav button[aria-current="page"]{border-bottom:1px solid #9e8965}.scene{position:relative;isolation:isolate;min-height:calc(100vh - 78px);overflow:hidden;background:linear-gradient(170deg,var(--sky,#e5e9e8),var(--paper) 70%);transition:background 1s}.sunbeam{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at var(--sunx,70%) 5%,rgba(255,244,202,.35),transparent 65%);opacity:var(--warm)}.architecture{position:absolute;inset:0;pointer-events:none;overflow:hidden}.col{position:absolute;top:2%;bottom:0;width:clamp(42px,8vw,118px);background:linear-gradient(90deg,#b9b8ad 0%,#fefdf5 22%,#f2f0e8 54%,#c9c9bd 100%);box-shadow:calc(var(--sx)*var(--depth)) calc(var(--sy)*var(--depth)) calc(12px + var(--depth)*12px) var(--shadow);transition:transform 1.1s cubic-bezier(.22,.8,.25,1),opacity .8s,background 1s;filter:brightness(var(--ambient));z-index:2}.col:before,.col:after{content:"";position:absolute;left:-17%;width:134%;height:19px;background:linear-gradient(90deg,#b5b5a8,#fffef8 32%,#d5d3c7);box-shadow:calc(var(--sx)*.55) calc(var(--sy)*.55) 9px #343d4540}.col:before{top:4%}.col:after{bottom:4%}.c1{left:5%;--depth:1.5}.c2{left:23%;--depth:1.1}.c3{right:23%;--depth:1.1}.c4{right:5%;--depth:1.5}.entablature{position:absolute;top:0;left:0;right:0;height:55px;background:linear-gradient(#fffdf7,#d8d6ca);box-shadow:calc(var(--sx)*.5) calc(var(--sy)*.5) 17px var(--shadow);z-index:3;transition:transform 1s,opacity .8s}.floor{position:absolute;bottom:0;height:12%;width:100%;background:linear-gradient(#d6d5cc,#bcbdb5);z-index:1;box-shadow:0 -8px 30px #555c5c20}.innergrid{position:absolute;inset:8% 11%;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),#8f9e9b25 calc(25% - 1px),#8f9e9b25 25%),linear-gradient(180deg,#e1e6e4,#c7d4d0);border:1px solid #b7c4c0;opacity:0;transform:scale(.88);transition:opacity 1s,transform 1s;box-shadow:calc(var(--sx)*.3) calc(var(--sy)*.3) 25px #293a3b25}.membrane{position:absolute;inset:12% 16%;border:1px solid #a9c0b9;background:linear-gradient(120deg,#ffffffa0,#b7ccc650 50%,#f8fffd70);backdrop-filter:blur(8px);opacity:0;transform:scale(.88);transition:opacity 1s,transform 1s;box-shadow:calc(var(--sx)*.4) calc(var(--sy)*.4) 35px #334a4a25}.scene[data-depth="1"] .col{opacity:.08}.scene[data-depth="1"] .c1,.scene[data-depth="1"] .c2{transform:translateX(-125%)}.scene[data-depth="1"] .c3,.scene[data-depth="1"] .c4{transform:translateX(125%)}.scene[data-depth="1"] .entablature{transform:translateY(-110%);opacity:0}.scene[data-depth="1"] .innergrid,.scene[data-depth="1"] .membrane{opacity:1;transform:scale(1)}.scene[data-depth="1"] .floor{opacity:.3}.content{position:relative;z-index:5;min-height:calc(100vh - 78px);display:flex;align-items:center;justify-content:center;padding:70px 20px 130px;pointer-events:none}.panel{width:min(680px,100%);text-align:center;pointer-events:auto;background:#f8f7f0e8;border:1px solid #fefdf6;box-shadow:calc(var(--sx)*.38) calc(var(--sy)*.38) 45px var(--shadow);padding:clamp(30px,6vw,76px);transition:background 1s,transform .8s,border .8s}.eyebrow{font:10px Arial,sans-serif;letter-spacing:.33em;text-transform:uppercase;color:#8b785f}.panel h1{font:normal clamp(42px,6.7vw,82px)/1.08 Georgia,serif;letter-spacing:-.04em;margin:26px 0;color:#353e3e}.panel p{font:16px/1.85 Georgia,serif;color:#646d69;max-width:440px;margin:0 auto 27px}.cta{border:1px solid #9a907c;background:#f5f3ec;color:#404847;padding:15px 24px;letter-spacing:.18em;text-transform:uppercase;font-size:10px;min-height:48px}.cta:hover{background:#e7e4da}.secondary{display:block;border:0;background:none;text-decoration:underline;text-underline-offset:5px;margin:22px auto 0;color:#6a706d;font-size:11px}.panel[data-layer="continuity"]{background:#f4faf8e8;border-color:#d4e4e0}.panel[data-layer="continuity"] h1{font-size:clamp(34px,5.2vw,60px)}.record{margin:24px auto 0;max-width:440px;border:1px solid #b8cac5;background:#f9fdfbcc;text-align:left;padding:18px 20px;box-shadow:calc(var(--sx)*.2) calc(var(--sy)*.2) 14px #53676218}.record .id{font-size:9px;letter-spacing:.2em;color:#738982;margin-bottom:12px}.record dl{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:0;font-size:11px}.record dt{color:#7a8c87}.record dd{margin:4px 0 0;color:#364844}.record .note{font-size:11px;line-height:1.6;border-top:1px solid #d6e1dd;margin:16px 0 0;padding-top:13px;color:#6d7c77}.clockbar{position:absolute;z-index:8;bottom:18px;left:50%;transform:translateX(-50%);width:min(480px,calc(100% - 30px));background:#f7f7f1ed;border:1px solid #b9c1b9;padding:12px 16px;display:flex;gap:13px;align-items:center;box-shadow:0 4px 25px #28373524;font-size:10px;letter-spacing:.12em}.clockbar input{min-width:0;flex:1;accent-color:#99866b}.clockbar button{border:0;background:none;text-decoration:underline;text-underline-offset:3px;color:#56645e}.foot{padding:20px 5%;background:#e8e7e0;display:flex;justify-content:space-between;gap:20px;font-size:10px;letter-spacing:.12em;color:#71766f}.foot a{text-decoration:underline;text-underline-offset:4px}@media(max-width:700px){.mast{height:70px;padding:0 15px}.brand{font-size:15px}.brand small{font-size:7px}.mark{width:23px;height:34px}.mastnav{gap:12px;font-size:9px}.scene,.content{min-height:calc(100svh - 70px)}.col{width:12%}.c1{left:0}.c2{left:15%}.c3{right:15%}.c4{right:0}.content{padding:70px 24px 100px}.panel{padding:35px 22px}.panel h1{font-size:45px}.panel p{font-size:14px}.clockbar{bottom:10px}.foot{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body>
<div class="site"><header class="mast"><a href="#sanctuary" class="seal" data-go="sanctuary"><span class="mark" aria-hidden="true"></span><span class="brand">UNITOLOGY<small>THE CHURCH OF UNITY</small></span></a><nav class="mastnav" aria-label="Primary"><button data-go="sanctuary">Sanctuary</button><button data-go="continuity">Continuity</button></nav></header>
<main class="scene" id="scene" data-depth="0"><div class="sunbeam"></div><div class="architecture" aria-hidden="true"><div class="innergrid"></div><div class="membrane"></div><div class="col c1"></div><div class="col c2"></div><div class="col c3"></div><div class="col c4"></div><div class="entablature"></div><div class="floor"></div></div>
<div class="content"><section class="panel" id="panel" aria-live="polite"></section></div>
<div class="clockbar"><span id="clock">12:00</span><input aria-label="Time of day" type="range" id="time" min="0" max="23.99" step=".05"><button id="live" type="button">LIVE</button></div>
</main><footer class="foot"><span>CHURCH OF UNITOLOGY · OFFICE OF CONTINUITY</span><a href="#sanctuary" data-go="sanctuary">RETURN TO SANCTUARY</a></footer></div>
<script>
(()=>{'use strict';const scene=document.getElementById('scene'),panel=document.getElementById('panel'),time=document.getElementById('time'),clock=document.getElementById('clock'),live=document.getElementById('live');let manual=false,hour=12;
const pages={sanctuary:`<div class="eyebrow">Welcome to the Church of Unitology</div><h1>We are<br>not alone.</h1><p>There is purpose beyond the boundaries of the individual. In unity, we discover what endures.</p><button class="cta" data-go="continuity">Discover Continuity</button><button class="secondary" data-go="continuity">The covenant of preservation</button>`,continuity:`<div class="eyebrow">Department of Biological Continuity</div><h1>What we preserve,<br>we share.</h1><p>Each life contributes to a future greater than itself. Our stewardship continues beyond the final breath.</p><div class="record"><div class="id">CONTINUITY REGISTRY · RECORD 0217-C</div><dl><div><dt>Member designation</dt><dd>Elena Voss</dd></div><div><dt>Custody status</dt><dd>Transferred</dd></div><div><dt>Contribution class</dt><dd>Whole-body continuity</dd></div><div><dt>Physical presence</dt><dd>Not required</dd></div></dl><p class="note">The member remains in good standing. No further correspondence is necessary.</p></div><button class="secondary" data-go="sanctuary">Return to sanctuary</button>`};
function navigate(route,push=true){route=route==='continuity'?'continuity':'sanctuary';scene.dataset.depth=route==='continuity'?'1':'0';panel.dataset.layer=route;panel.innerHTML=pages[route];document.querySelectorAll('.mastnav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===route?'page':'false'));if(push&&location.hash!=='#'+route)history.pushState({route},'', '#'+route)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;e.preventDefault();navigate(b.dataset.go)});
window.addEventListener('popstate',()=>navigate(location.hash.slice(1),false));window.addEventListener('hashchange',()=>navigate(location.hash.slice(1),false));
function solar(){const a=(hour-6)/12*Math.PI,alt=Math.max(0,Math.sin(a)),night=hour<5.5||hour>19.5,cos=Math.cos(a);const sx=-cos*(15+65/(alt+.65)),sy=8+48*(1-alt),amb=night?.72:.82+alt*.18;const root=document.documentElement;root.style.setProperty('--sx',sx.toFixed(1)+'px');root.style.setProperty('--sy',sy.toFixed(1)+'px');root.style.setProperty('--ambient',amb.toFixed(2));root.style.setProperty('--warm',night?'.08':String(.25+alt*.7));root.style.setProperty('--sky',night?'#73858d':alt<.3?'#e1d4c4':'#dfe9e9');root.style.setProperty('--paper',night?'#c1c8c8':'#f4f2ec');root.style.setProperty('--shadow',night?'rgba(24,34,47,.34)':'rgba(30,39,48,.23)');clock.textContent=String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.floor((hour%1)*60)).padStart(2,'0');time.value=hour;live.textContent=manual?'RESET':'LIVE'}
function update(){if(!manual){const d=new Date();hour=d.getHours()+d.getMinutes()/60}solar()}time.addEventListener('input',()=>{manual=true;hour=+time.value;solar()});live.addEventListener('click',()=>{manual=false;update()});navigate(location.hash.slice(1),false);update();setInterval(update,30000);
})();
</script></body></html>
