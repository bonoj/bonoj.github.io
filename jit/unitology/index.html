<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b20"><title>Unitology | Continuity Passage</title><style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10191d;color:#dce7e0}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #e9e2c9;outline-offset:3px}.app{height:100dvh;display:flex;flex-direction:column;min-height:0}.head{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,40px);border-bottom:1px solid #75878140;background:#18272a}.brand{font:17px Georgia,serif;letter-spacing:.18em}.brand small{display:block;font:9px Arial,sans-serif;letter-spacing:.2em;color:#a9bbb3;margin-top:5px}.status{font-size:10px;letter-spacing:.17em;color:#afc0b7}.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 46%,#31443f 0%,#152326 43%,#0b1419 100%);perspective:650px;perspective-origin:50% 50%;isolation:isolate}.stage:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#ffffff05,transparent 22%,transparent 78%,#00000044);z-index:3}.world{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}.frame{position:absolute;left:50%;top:50%;width:270px;height:245px;margin-left:-135px;margin-top:-122.5px;border:solid #b9c9c3;border-width:10px 12px 13px;box-shadow:inset 0 0 0 2px #f5f1df;background:transparent;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform,opacity;pointer-events:none}.frame:before{content:"";position:absolute;top:-8px;left:22%;width:56%;height:3px;background:#f7f4df}.frame:after{content:"";position:absolute;inset:-10px -12px -13px;border:1px solid #758d83;pointer-events:none}.label{position:absolute;z-index:4;top:18px;left:20px;font-size:10px;letter-spacing:.23em;color:#dce7e0}.hint{position:absolute;z-index:4;bottom:20px;left:20px;font-size:10px;letter-spacing:.13em;color:#b9cbc1}.depth{position:absolute;z-index:4;bottom:20px;right:20px;font-size:10px;letter-spacing:.13em;color:#b9cbc1}.controls{min-height:82px;flex:none;background:#172629;border-top:1px solid #75878140;padding:15px clamp(15px,4vw,40px);display:flex;gap:15px;align-items:center;flex-wrap:wrap}.controls button{border:1px solid #82978c;background:#dce4de;color:#1d3030;padding:12px 20px;min-height:44px;border-radius:4px;font-size:12px;cursor:pointer}.controls button.alt{background:transparent;color:#dce4de}.control-label{font-size:11px;color:#c2d0c9;letter-spacing:.07em}.controls input{flex:1;min-width:90px;accent-color:#dce4de}.foot{flex:none;padding:10px 20px;font-size:9px;letter-spacing:.15em;color:#a0b2a9;background:#10191d;text-align:center}@media(max-width:520px){.head{height:58px}.brand{font-size:14px}.status{font-size:8px}.controls{gap:10px;padding:12px 14px}.controls button{padding:10px 13px}.hint{font-size:9px;max-width:60%}.label{font-size:9px}.foot{font-size:8px}}@media(prefers-reduced-motion:reduce){.frame{will-change:auto}}
</style></head><body><div class="app"><header class="head"><div class="brand">UNITOLOGY<small>DEPARTMENT OF CONTINUITY</small></div><div class="status">PASSAGE 07 · ACTIVE</div></header><main id="stage" class="stage" aria-label="Continuity passage, an interactive telescoping corridor"><div id="world" class="world" aria-hidden="true"></div><div class="label">CONTINUITY PASSAGE · 07</div><div class="hint">DRAG TO BEND THE PASSAGE</div><div id="depth" class="depth">DEPTH 000</div></main><section class="controls" aria-label="Passage controls"><button id="travel" type="button">Pause</button><button id="reset" type="button" class="alt">Straighten</button><label class="control-label" for="twist">TORSION</label><input id="twist" type="range" min="-3" max="3" step=".05" value="1.3"></section><footer class="foot">THE PATH REMAINS OPEN</footer></div>
<script>(()=>{'use strict';
const stage=document.getElementById('stage'),world=document.getElementById('world'),depth=document.getElementById('depth'),twistSlider=document.getElementById('twist'),travel=document.getElementById('travel'),reset=document.getElementById('reset');
const N=19,frames=[];for(let i=0;i<N;i++){const el=document.createElement('div');el.className='frame';world.appendChild(el);frames.push(el)}
let progress=0,last=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,twist=1.3,bendX=0,bendY=0,dragging=false,raf=0;
function render(){const wrap=progress%N;for(let i=0;i<N;i++){const pos=((i+wrap)%N+N)%N;const d=pos/N;const curve=d*d;const x=curve*bendX*200+Math.sin(d*5+progress*.015)*curve*28;const y=curve*bendY*130;const rot=twist*curve*145+Math.sin(progress*.005+d*5)*d*8;const z=160-d*2200;const el=frames[i];el.style.transform='translate3d('+x.toFixed(2)+'px,'+y.toFixed(2)+'px,'+z.toFixed(2)+'px) rotateZ('+rot.toFixed(2)+'deg)';// Fade only the individual frame as it crosses the wrap seam, never the entire corridor.
const nearFade=Math.min(1,pos/.65);const farFade=Math.min(1,(N-pos)/.85);el.style.opacity=String(Math.max(0,Math.min(nearFade,farFade,1-d*.65)));}depth.textContent='DEPTH '+String(Math.floor(progress*100)).padStart(3,'0')}
function tick(ms){if(last===null)last=ms;const dt=Math.min(.05,Math.max(0,(ms-last)/1000));last=ms;if(playing)progress+=dt*.85;render();raf=requestAnimationFrame(tick)}
function setPlaying(v){playing=v;travel.textContent=v?'Pause':'Travel'}
stage.addEventListener('pointerdown',e=>{dragging=true;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!dragging)return;const r=stage.getBoundingClientRect();bendX=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2));bendY=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2))});
stage.addEventListener('pointerup',()=>dragging=false);stage.addEventListener('pointercancel',()=>dragging=false);
travel.addEventListener('click',()=>setPlaying(!playing));reset.addEventListener('click',()=>{bendX=0;bendY=0;twist=0;twistSlider.value='0'});twistSlider.addEventListener('input',()=>twist=Number(twistSlider.value));
document.addEventListener('visibilitychange',()=>{last=null});setPlaying(playing);raf=requestAnimationFrame(tick);
})();</script></body></html>
