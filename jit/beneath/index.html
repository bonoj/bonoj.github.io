<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>The World Beneath</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#030909;color:#e0f2ee;font:13px system-ui}canvas{display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between}h1{font-size:14px;letter-spacing:.2em;margin:0}#bottom{pointer-events:auto;position:absolute;bottom:12px;left:12px;right:12px;background:#081a1cdd;border:1px solid #47645b77;border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{border:1px solid #496a67;background:#153638;color:#e1f3ec;border-radius:7px;padding:9px 12px;font:inherit}button{touch-action:none}#error{position:absolute;top:80px;left:16px;color:#f5a6a6}#info{color:#a4c2b9}#pad{margin-left:auto;display:flex;gap:6px}small{color:#92afa7}</style></head><body><div id="ui"><div id="top"><div><h1>THE WORLD BENEATH</h1><small>Living limestone · subterranean exploration</small></div><div id="info">Depth 42 m</div></div><div id="error"></div><div id="bottom"><button id="run">Ⅱ Erosion</button><button id="lamp">Headlamp</button><button id="reset">Entrance</button><select id="speed"><option value="1">1×</option><option value="10" selected>10×</option><option value="100">100×</option></select><small id="age">0 years</small><div id="pad"><button id="back">◀</button><button id="forward">▶</button></div></div></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x040a0b);scene.fog=new THREE.FogExp2(0x071213,.016);
const camera=new THREE.PerspectiveCamera(73,innerWidth/innerHeight,.03,450);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x668a87,0x17130e,1.5));const headlamp=new THREE.PointLight(0xc4eee3,35,38,1.5);camera.add(headlamp);scene.add(camera);
for(const [x,y,z,color] of [[-6,-5,-34,0xf3ae64],[7,-12,-75,0x4caddb],[-3,-20,-120,0x6df0b6]]){const l=new THREE.PointLight(color,85,36,2);l.position.set(x,y,z);scene.add(l)}
const center=t=>new THREE.Vector3(Math.sin(t*.055)*7+Math.sin(t*.13)*2,-t*.14+Math.sin(t*.09)*2,5-t);
const noise=(a,b,c)=>Math.sin(a*1.37+b*.77+c*.37)*Math.sin(b*1.91-c*.47+a*.23);
const radius=(t,a)=>4.4+1.35*Math.sin(t*.115)+.8*Math.sin(t*.29+2)+.52*noise(t*.13,Math.cos(a)*2,Math.sin(a)*2);
const verts=[],colors=[],indices=[],bases=[],rings=240,sides=36,maxT=155;
for(let i=0;i<=rings;i++){const t=maxT*i/rings,c=center(t),f=center(t+.1).sub(c).normalize(),right=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),f).normalize(),up=new THREE.Vector3().crossVectors(f,right).normalize();for(let j=0;j<=sides;j++){const a=j/sides*Math.PI*2,r=radius(t,a)*(1+.11*noise(t*.8,Math.cos(a)*3,Math.sin(a)*3)),p=c.clone().addScaledVector(right,Math.cos(a)*r).addScaledVector(up,Math.sin(a)*r*.88);verts.push(p.x,p.y,p.z);bases.push(p.x,p.y,p.z);const v=.72+.24*noise(t*.21,Math.cos(a)*5,Math.sin(a)*5);colors.push(.33*v,.39*v,.34*v);if(i<rings&&j<sides){const k=i*(sides+1)+j;indices.push(k,k+sides+1,k+1,k+1,k+sides+1,k+sides+2)}}}
const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.setIndex(indices);geo.computeVertexNormals();scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.93,side:THREE.DoubleSide,flatShading:true})));
const spike=new THREE.InstancedMesh(new THREE.ConeGeometry(1,1,6),new THREE.MeshStandardMaterial({color:0x9bafa1,roughness:.8,flatShading:true}),400),dummy=new THREE.Object3D();const hash=n=>Math.abs(Math.sin(n*127.1+78.233)*43758.5453)%1;
for(let i=0;i<400;i++){const t=5+(i*31.71)%146,c=center(t),a=Math.PI/2+(hash(i+3)-.5)*1.3,r=radius(t,a);dummy.position.set(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r*.86-.6,c.z);dummy.scale.set(.13+hash(i*4)*.25,.4+hash(i*7+1)*2.7,.13+hash(i*4)*.25);dummy.rotation.set(Math.PI,0,0);dummy.updateMatrix();spike.setMatrixAt(i,dummy.matrix)}scene.add(spike);
const crystal=new THREE.InstancedMesh(new THREE.OctahedronGeometry(1,0),new THREE.MeshStandardMaterial({color:0x79d4b3,metalness:.32,roughness:.3,emissive:0x124c3e,emissiveIntensity:.6}),150);
for(let i=0;i<150;i++){const t=10+(i*19.13)%140,c=center(t),a=hash(i*2)*Math.PI*2,r=radius(t,a)*.94;dummy.position.set(c.x+Math.cos(a)*r,c.y+Math.sin(a)*r*.88,c.z);dummy.scale.set(.1,.2+hash(i+20)*.8,.12);dummy.rotation.set(i*2,i*.37,i*.9);dummy.updateMatrix();crystal.setMatrixAt(i,dummy.matrix)}scene.add(crystal);
const waterPoints=[];for(let i=0;i<=320;i++){const t=i/320*maxT,c=center(t);waterPoints.push(new THREE.Vector3(c.x,c.y-radius(t,-Math.PI/2)*.7,c.z))}const stream=new THREE.CatmullRomCurve3(waterPoints);const water=new THREE.Mesh(new THREE.TubeGeometry(stream,500,.55,8,false),new THREE.MeshStandardMaterial({color:0x238e99,transparent:true,opacity:.68,metalness:.22,roughness:.16}));scene.add(water);
const droplets=new THREE.InstancedMesh(new THREE.SphereGeometry(.05,5,4),new THREE.MeshBasicMaterial({color:0xa7e7de}),90);scene.add(droplets);
let t=0,yaw=0,pitch=0,drag=false,px=0,py=0,run=true,age=0,erosion=0,go=0;const keys={};const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-px)*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch-(e.clientY-py)*.004));px=e.clientX;py=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('wheel',e=>{t=Math.max(0,Math.min(153,t+Math.sign(e.deltaY)*2));e.preventDefault()},{passive:false});
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(const [id,n] of [['forward',1],['back',-1]]){const el=document.getElementById(id);el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);go=n};el.onpointerup=el.onpointercancel=()=>go=0}
document.getElementById('run').onclick=()=>{run=!run;document.getElementById('run').textContent=run?'Ⅱ Erosion':'▶ Erosion'};document.getElementById('lamp').onclick=()=>headlamp.visible=!headlamp.visible;document.getElementById('reset').onclick=()=>{t=0;yaw=0;pitch=0};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);t=Math.max(0,Math.min(153,t+dt*8*(go+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0))));if(keys.a)yaw+=dt;if(keys.d)yaw-=dt;const p=center(t),f=center(t+.1).sub(p).normalize();camera.position.lerp(p.add(new THREE.Vector3(0,1.1,0)),Math.min(1,dt*9));camera.rotation.order='YXZ';camera.rotation.y=Math.atan2(-f.x,-f.z)+yaw;camera.rotation.x=pitch;
if(run){age+=dt*Number(document.getElementById('speed').value)*180;erosion=Math.min(.85,erosion+dt*Number(document.getElementById('speed').value)*.004);const ar=geo.attributes.position.array;for(let i=0;i<ar.length;i+=3){const x=bases[i],y=bases[i+1],z=bases[i+2],w=Math.sin(z*.24+x*.5)*Math.cos(y*.39+z*.18);ar[i]=x+w*erosion*.16;ar[i+1]=y-Math.max(0,-w)*erosion*.11;ar[i+2]=z}geo.attributes.position.needsUpdate=true;if(Math.floor(age/500)!==frame.normal){geo.computeVertexNormals();frame.normal=Math.floor(age/500)}}
for(let i=0;i<90;i++){const q=stream.getPoint((i/90+age*.00012)%1);dummy.position.copy(q);dummy.position.y+=.12;dummy.scale.setScalar(.6+Math.sin(i+age*.04)*.15);dummy.rotation.set(0,0,0);dummy.updateMatrix();droplets.setMatrixAt(i,dummy.matrix)}droplets.instanceMatrix.needsUpdate=true;document.getElementById('info').textContent='Depth '+Math.round(42+t*.14)+' m · '+Math.round(t)+'/155 m';document.getElementById('age').textContent=Math.floor(age).toLocaleString()+' years';renderer.render(scene,camera)}frame();
</script></body></html>
