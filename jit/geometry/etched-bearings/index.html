function build(){const margin=6,scale=Math.min((W-margin*2)/source.width,(H-margin*2)/source.height),ww=source.width*scale,hh=source.height*scale,x0=(W-ww)/2,y0=(H-hh)/2;const step=Math.max(3.3,Math.min(4.9,W/105));const cols=Math.max(1,Math.floor(ww/step)),rows=Math.max(1,Math.floor(hh/step));off.width=cols;off.height=rows;oc.drawImage(source,0,0,cols,rows);const pix=oc.getImageData(0,0,cols,rows).data;points=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let i=(y*cols+x)*4;const r=pix[i],g=pix[i+1],b=pix[i+2];const px=x0+(x+.5)*ww/cols,py=y0+(y+.5)*hh/rows;points.push({x:px,y:py,tx:px,ty:py,vx:0,vy:0,r,g,b,size:step*.41,phase:Math.random()*6.283})}initialized=true}
source.onload=resize;addEventListener('resize',resize);resize();
function pos(e){return{x:e.clientX,y:e.clientY}}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);down=true;touch=pos(e)});c.addEventListener('pointermove',e=>{if(down)touch=pos(e)});for(const name of ['pointerup','pointercancel'])c.addEventListener(name,()=>{down=false;touch=null});let previousTap=0;c.addEventListener('pointerdown',()=>{let now=performance.now();if(now-previousTap<330){scatter=1;for(const p of points){p.vx+=(Math.random()-.5)*20;p.vy+=(Math.random()-.5)*20}}previousTap=now});
function draw(now){let dt=Math.min((now-last)/16.667,2);last=now;time+=dt/60;scatter*=.996;ctx.fillStyle='#100d11';ctx.fillRect(0,0,W,H);if(!initialized){requestAnimationFrame(draw);return}
for(const p of points){let ax=(p.tx-p.x)*(.019-scatter*.011),ay=(p.ty-p.y)*(.019-scatter*.011);ax+=Math.sin(time*1.3+p.phase)*.004;ay+=Math.cos(time+p.phase)*.004;if(touch){const dx=p.x-touch.x,dy=p.y-touch.y,d2=dx*dx+dy*dy,rad=115;if(d2<rad*rad){const dist=Math.sqrt(d2)+.1,f=(1-dist/rad)*2.3;ax+=dx/dist*f;ay+=dy/dist*f}}p.vx=(p.vx+ax*dt)*.89;p.vy=(p.vy+ay*dt)*.89;p.x+=p.vx*dt;p.y+=p.vy*dt;
ctx.fillStyle='rgb('+p.r+','+p.g+','+p.b+')';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(p.x-p.size*.27,p.y-p.size*.29,p.size*.23,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
