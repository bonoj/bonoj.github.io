import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const lineGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-8,0),new THREE.Vector3(0,8,0)]);scene.add(new THREE.Line(lineGeo,new THREE.LineBasicMaterial({color:0x527081,transparent:true,opacity:.75})));

const trace=boids.map(()=>[]),dummy=new THREE.Object3D(),d=new THREE.Vector3(),a=new THREE.Vector3(),c=new THREE.Vector3(),s=new THREE.Vector3(),f=new THREE.Vector3();let pointer=null,held=false,tick=0,last=performance.now(),phase=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);const ar=innerWidth/innerHeight;camera.left=-8*ar;camera.right=8*ar;camera.top=8;camera.bottom=-8;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();

function frame(now){const dt=Math.min((now-last)/1000,.033);last=now;tick++;phase+=dt;
for(let i=0;i<n;i++){const b=boids[i];a.set(0,0,0);c.set(0,0,0);s.set(0,0,0);let near=0;
for(let j=0;j<n;j++){if(i===j)continue;const o=boids[j];d.subVectors(o.p,b.p);const q=d.lengthSq();if(q>.0&&q<5){near++;a.add(o.v);c.add(o.p);if(q<.65)s.addScaledVector(d,-1/(q+.08));}}
f.set(0,0,0);if(near){a.divideScalar(near).normalize().multiplyScalar(1.4).sub(b.v);c.divideScalar(near).sub(b.p).multiplyScalar(.26);f.addScaledVector(a,.9).add(c).addScaledVector(s,.22)}

let k=0;for(let i=0;i<n;i++){const b=boids[i];b.v.addScaledVector(b.f,dt);const sp=b.v.length();if(sp>2.3)b.v.multiplyScalar(2.3/sp);if(sp<.5)b.v.multiplyScalar(.5/Math.max(sp,.001));b.p.addScaledVector(b.v,dt);
