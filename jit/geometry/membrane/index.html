<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c14"><title>Membrane</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c14;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style><canvas id="view"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false}),N=82,TAU=Math.PI*2;let W,H,D,agents=[],edges=new Map(),pointer=null,held=false,last=performance.now(),clock=0;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}function seed(){const r=Math.min(W,H)*.23;agents=Array.from({length:N},(_,i)=>{const a=i*2.399963,rad=Math.sqrt(i/N)*r;return{x:W/2+Math.cos(a)*rad,y:H/2+Math.sin(a)*rad,vx:Math.cos(a+1)*.8,vy:Math.sin(a+1)*.8,fx:0,fy:0}})}
resize();seed();addEventListener('resize',resize);
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);held=true;pointer={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointermove',e=>{if(held)pointer={x:e.clientX,y:e.clientY}});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>{held=false;pointer=null});
function frame(now){const dt=Math.min((now-last)/16.667,2);last=now;clock+=dt*.016667;const unit=Math.min(W,H)/650,join=76*unit,breakAt=116*unit,join2=join*join,break2=breakAt*breakAt;
for(let i=0;i<N;i++){const a=agents[i];let fx=0,fy=0,ax=0,ay=0,cx=0,cy=0,n=0;for(let j=0;j<N;j++){if(i===j)continue;const b=agents[j],dx=b.x-a.x,dy=b.y-a.y,q=dx*dx+dy*dy;if(q>1&&q<12500*unit*unit){n++;ax+=b.vx;ay+=b.vy;cx+=b.x;cy+=b.y;if(q<850*unit*unit){fx-=dx/(q+25)*8;fy-=dy/(q+25)*8}}}
if(n){const v=Math.hypot(ax,ay)||1;fx+=(ax/v*1.2-a.vx)*.04+(cx/n-a.x)*.00035;fy+=(ay/v*1.2-a.vy)*.04+(cy/n-a.y)*.00035}
fx+=(W/2-a.x)*.00015+Math.sin(clock*.7+i*1.8)*.015;fy+=(H/2-a.y)*.00015+Math.cos(clock*.9+i*1.3)*.015;
if(pointer){const dx=pointer.x-a.x,dy=pointer.y-a.y,q=dx*dx+dy*dy;const strength=Math.min(.045,700/(q+6000));fx+=dx*strength*.045;fy+=dy*strength*.045}a.fx=fx;a.fy=fy}
for(const a of agents){a.vx+=a.fx*dt;a.vy+=a.fy*dt;const v=Math.hypot(a.vx,a.vy)||1;if(v>2.5){a.vx*=2.5/v;a.vy*=2.5/v}a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.x<0||a.x>W)a.vx+=(W/2-a.x)*.004;if(a.y<0||a.y>H)a.vy+=(H/2-a.y)*.004}
for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=agents[i],b=agents[j],dx=a.x-b.x,dy=a.y-b.y,q=dx*dx+dy*dy,key=i*N+j,edge=edges.get(key);if(edge){if(q>break2)edges.delete(key);else edge.age=Math.min(1,edge.age+.025*dt)}else if(q<join2&&edges.size<390)edges.set(key,{age:0})}
ctx.fillStyle='rgba(8,12,20,.19)';ctx.fillRect(0,0,W,H);
// Local triangular skins: only closed triples of live edges receive a membrane.
const adjacency=Array.from({length:N},()=>[]);for(const [key] of edges){const i=Math.floor(key/N),j=key%N;adjacency[i].push(j);adjacency[j].push(i)}
const membrane=new Path2D();let faces=0;for(let i=0;i<N;i++){const nei=adjacency[i].filter(j=>j>i);for(let a=0;a<nei.length;a++)for(let b=a+1;b<nei.length;b++){const j=nei[a],k=nei[b],key=Math.min(j,k)*N+Math.max(j,k);if(!edges.has(key))continue;const p=agents[i],q=agents[j],r=agents[k];const area=Math.abs((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x))*.5;if(area<3*unit*unit||area>1800*unit*unit)continue;membrane.moveTo(p.x,p.y);membrane.lineTo(q.x,q.y);membrane.lineTo(r.x,r.y);membrane.closePath();faces++}}
ctx.fillStyle='rgba(96,175,204,.055)';ctx.fill(membrane);ctx.strokeStyle='rgba(141,213,228,.025)';ctx.lineWidth=.7;ctx.stroke(membrane);
for(const [key,edge] of edges){const i=Math.floor(key/N),j=key%N,a=agents[i],b=agents[j];ctx.strokeStyle='rgba(142,211,226,'+(.12+edge.age*.33)+')';ctx.lineWidth=.55+edge.age*.35;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
for(const a of agents){ctx.fillStyle='#c6eaf3';ctx.beginPath();ctx.arc(a.x,a.y,1.8,0,TAU);ctx.fill()}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
