<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c14"><title>Weave</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c14;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style><canvas id="view"></canvas><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false}),ink=document.createElement('canvas'),brush=ink.getContext('2d');const N=78,TAU=Math.PI*2;let W,H,dpr,agents=[],edges=new Map(),finger=null,held=false,dragged=false,prev=null,last=performance.now(),time=0,frameCount=0;
function resize(){const old=document.createElement('canvas');old.width=ink.width;old.height=ink.height;if(old.width)old.getContext('2d').drawImage(ink,0,0);W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ink.width=Math.round(W*dpr);ink.height=Math.round(H*dpr);brush.setTransform(dpr,0,0,dpr,0,0);if(old.width)brush.drawImage(old,0,0,old.width,old.height,0,0,W,H)}
function seed(){const size=Math.min(W,H);agents=Array.from({length:N},(_,i)=>{const a=i*2.399963,r=Math.sqrt(i/N)*size*.28;return{x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:Math.cos(a+1)*.7,vy:Math.sin(a+1)*.7,fx:0,fy:0}})}
resize();seed();addEventListener('resize',resize);
function touch(e){return{x:e.clientX,y:e.clientY}}canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);finger=touch(e);prev=finger;held=true;dragged=false});canvas.addEventListener('pointermove',e=>{if(!held)return;const next=touch(e);if(Math.hypot(next.x-prev.x,next.y-prev.y)>2)dragged=true;prev=next;finger=next});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>{held=false;finger=null;prev=null});
function stroke(a,b,opacity,width){brush.strokeStyle='rgba(121,194,217,'+opacity+')';brush.lineWidth=width;brush.beginPath();brush.moveTo(a.x,a.y);brush.lineTo(b.x,b.y);brush.stroke()}
function frame(now){const dt=Math.min((now-last)/16.667,2);last=now;time+=dt*.016667;frameCount++;
const unit=Math.min(W,H)/650,join=76*unit,breakAt=115*unit,join2=join*join,break2=breakAt*breakAt;
for(let i=0;i<N;i++){const a=agents[i];let fx=0,fy=0,ax=0,ay=0,cx=0,cy=0,n=0;for(let j=0;j<N;j++){if(i===j)continue;const b=agents[j],dx=b.x-a.x,dy=b.y-a.y,q=dx*dx+dy*dy;if(q<12500*unit*unit&&q>1){n++;ax+=b.vx;ay+=b.vy;cx+=b.x;cy+=b.y;if(q<850*unit*unit){fx-=dx/(q+25)*8;fy-=dy/(q+25)*8}}}
if(n){const v=Math.hypot(ax,ay)||1;fx+=(ax/v*1.2-a.vx)*.04+(cx/n-a.x)*.00035;fy+=(ay/v*1.2-a.vy)*.04+(cy/n-a.y)*.00035}
fx+=(W/2-a.x)*.00015+Math.sin(time*.7+i*1.8)*.015;fy+=(H/2-a.y)*.00015+Math.cos(time*.9+i*1.3)*.015;
if(finger){const dx=finger.x-a.x,dy=finger.y-a.y,q=dx*dx+dy*dy;const strength=held?Math.min(.045,700/(q+6000)):.0;fx+=dx*strength*.045;fy+=dy*strength*.045}
a.fx=fx;a.fy=fy}
for(const a of agents){const ox=a.x,oy=a.y;a.vx+=a.fx*dt;a.vy+=a.fy*dt;const v=Math.hypot(a.vx,a.vy)||1;if(v>2.5){a.vx*=2.5/v;a.vy*=2.5/v}a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.x<0||a.x>W)a.vx+=(W/2-a.x)*.004;if(a.y<0||a.y>H)a.vy+=(H/2-a.y)*.004;if(frameCount%3===0)stroke({x:ox,y:oy},a,.045,.5)}
// Edges have identity and lifetime independent of their visual representation.
for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=agents[i],b=agents[j],dx=a.x-b.x,dy=a.y-b.y,q=dx*dx+dy*dy,key=i*N+j,edge=edges.get(key);
if(edge){if(q>break2){stroke(a,b,.21,1.05);edges.delete(key)}else{edge.age=Math.min(1,edge.age+.025*dt);if(frameCount%4===0)stroke(a,b,.008+edge.age*.01,.5)}}
else if(q<join2&&edges.size<380)edges.set(key,{age:0})}
brush.fillStyle='rgba(8,12,20,.0025)';brush.fillRect(0,0,W,H);
ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);ctx.drawImage(ink,0,0,ink.width,ink.height,0,0,W,H);
for(const [key,edge] of edges){const i=Math.floor(key/N),j=key%N,a=agents[i],b=agents[j];ctx.strokeStyle='rgba(134,206,224,'+(.13+edge.age*.42)+')';ctx.lineWidth=.55+edge.age*.4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
for(const a of agents){ctx.fillStyle='#c4eaf2';ctx.beginPath();ctx.arc(a.x,a.y,1.8,0,TAU);ctx.fill()}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
