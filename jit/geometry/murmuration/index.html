<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c14"><title>Murmuration</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c14;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style>
<canvas id="world"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const canvas=document.getElementById('world'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x080c14,1);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-8,8,8,-8,.1,100);
camera.position.set(0,0,24);camera.lookAt(0,0,0);
scene.add(new THREE.AmbientLight(0x9db7d0,1.1));
const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(-5,8,12);scene.add(light);
const count=110,span=7.5;
const boids=Array.from({length:count},(_,i)=>{const a=i*2.39996,r=Math.sqrt(i/count)*4;return {p:new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r*.6,(Math.random()-.5)*3),v:new THREE.Vector3(Math.cos(a+1),Math.sin(a+1),Math.sin(a*.8)).multiplyScalar(.7),a:new THREE.Vector3()}});
const geometry=new THREE.SphereGeometry(.085,10,8),material=new THREE.MeshStandardMaterial({color:0xa5d6ed,metalness:.82,roughness:.19});
const mesh=new THREE.InstancedMesh(geometry,material,count);mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(mesh);
const dummy=new THREE.Object3D();
const traces=Array.from({length:count},()=>[]);
const tracePositions=new Float32Array(count*12*3);
const traceGeom=new THREE.BufferGeometry();traceGeom.setAttribute('position',new THREE.BufferAttribute(tracePositions,3).setUsage(THREE.DynamicDrawUsage));
const traceMat=new THREE.LineBasicMaterial({color:0x3c839c,transparent:true,opacity:.21,depthWrite:false});
const trails=new THREE.LineSegments(traceGeom,traceMat);scene.add(trails);
let pointer=null,held=false,rotation=0,last=performance.now(),tick=0;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);const aspect=w/h;camera.left=-8*aspect;camera.right=8*aspect;camera.top=8;camera.bottom=-8;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function project(e){const x=(e.clientX/innerWidth)*2-1,y=1-(e.clientY/innerHeight)*2;return new THREE.Vector3(x*(camera.right-camera.left)/2,y*8,0)}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointer=project(e);held=true});
canvas.addEventListener('pointermove',e=>{if(held)pointer=project(e)});
for(const type of ['pointerup','pointercancel'])canvas.addEventListener(type,()=>{held=false;pointer=null});
const delta=new THREE.Vector3(),align=new THREE.Vector3(),cohere=new THREE.Vector3(),separate=new THREE.Vector3(),force=new THREE.Vector3();
function step(dt){tick++;
 for(let i=0;i<count;i++){
  const b=boids[i];align.set(0,0,0);cohere.set(0,0,0);separate.set(0,0,0);let near=0;
  for(let j=0;j<count;j++){if(i===j)continue;const o=boids[j];delta.subVectors(o.p,b.p);const d2=delta.lengthSq();if(d2>6.25||d2<.00001)continue;near++;align.add(o.v);cohere.add(o.p);if(d2<.7)separate.addScaledVector(delta,-1/(d2+.05));}
  force.set(0,0,0);
  if(near){align.divideScalar(near).normalize().multiplyScalar(1.3).sub(b.v);cohere.divideScalar(near).sub(b.p).multiplyScalar(.22);force.addScaledVector(align,.85).add(cohere).addScaledVector(separate,.18)}
  force.addScaledVector(b.p,-.045);
  if(pointer){delta.subVectors(pointer,b.p);const d2=delta.lengthSq();force.addScaledVector(delta,(held?2.8:0)/(1+d2*.3));}
  const wander=.35;force.x+=Math.sin(tick*.011+i*1.7)*wander;force.y+=Math.cos(tick*.013+i*2.3)*wander;force.z+=Math.sin(tick*.008+i*1.1)*wander;
  b.a.copy(force).clampLength(0,3);
 }
 for(let i=0;i<count;i++){
  const b=boids[i];b.v.addScaledVector(b.a,dt);const speed=b.v.length();if(speed>2.35)b.v.multiplyScalar(2.35/speed);if(speed<.6)b.v.multiplyScalar(.6/Math.max(speed,.001));
  b.p.addScaledVector(b.v,dt);
  if(b.p.length()>span*1.6)b.v.addScaledVector(b.p,-dt*.7);
  dummy.position.copy(b.p);dummy.scale.setScalar(.75+Math.min(b.v.length()/3,.5));dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix);
  if(tick%3===0){const t=traces[i];t.push(b.p.clone());if(t.length>7)t.shift()}
 }
 mesh.instanceMatrix.needsUpdate=true;
 let k=0;for(let i=0;i<count;i++){const t=traces[i];for(let j=1;j<t.length;j++){const a=t[j-1],b=t[j];tracePositions[k++]=a.x;tracePositions[k++]=a.y;tracePositions[k++]=a.z;tracePositions[k++]=b.x;tracePositions[k++]=b.y;tracePositions[k++]=b.z;}}
 tracePositions.fill(0,k);traceGeom.setDrawRange(0,k/3);traceGeom.attributes.position.needsUpdate=true;
}
function frame(now){const dt=Math.min((now-last)/1000,.033);last=now;step(dt);rotation+=dt*.035;scene.rotation.y=Math.sin(rotation)*.22;scene.rotation.x=Math.cos(rotation*.7)*.12;renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
