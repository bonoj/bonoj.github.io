<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111d27"><title>Bearings · Arch</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111d27;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:fixed;left:15px;top:16px;color:#f4dfb7;font:12px system-ui;pointer-events:none;text-shadow:0 1px 6px #071019}#top b{font:600 18px Georgia,serif;letter-spacing:.05em}#top small{display:block;max-width:270px;margin-top:5px;color:#c7c5b8}#actions{position:fixed;right:14px;top:14px;display:flex;gap:8px}button{border:1px solid #a18e70;background:#25353e;color:#ffe6b6;border-radius:30px;width:42px;height:42px;font-size:21px}#status{position:fixed;bottom:16px;left:16px;color:#e5d6b8;font:11px ui-monospace,monospace;pointer-events:none;white-space:pre-line;background:#14222bba;padding:8px;border-radius:8px}</style><canvas id="world"></canvas><div id="top"><b>BEARINGS / 01</b><small>Tap a glowing abutment to release its bearing. Tap stone to inspect. Drag to orbit.</small></div><div id="actions"><button id="eye" aria-label="Toggle diagnostics">◉</button><button id="reset" aria-label="Reset">↺</button></div><div id="status"></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x111d27);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x111d27,24,52);const camera=new THREE.PerspectiveCamera(38,1,.1,100);let yaw=.18;function cameraPose(){camera.position.set(Math.sin(yaw)*17,9.4,Math.cos(yaw)*17);camera.lookAt(0,1.3,0)}cameraPose();scene.add(new THREE.HemisphereLight(0xaac5d2,0x5b4535,2.1));const sun=new THREE.DirectionalLight(0xffd9a4,3.4);sun.position.set(-6,13,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;scene.add(sun);
const stone=new THREE.MeshStandardMaterial({color:0xc9ad83,roughness:1,flatShading:true}),stoneAlt=new THREE.MeshStandardMaterial({color:0x9f896f,roughness:1,flatShading:true}),rock=new THREE.MeshStandardMaterial({color:0x5b6a6a,roughness:1,flatShading:true}),gold=new THREE.MeshStandardMaterial({color:0xffc46e,emissive:0x9c5b12,emissiveIntensity:.45}),stress=new THREE.LineBasicMaterial({color:0x6edfd0,transparent:true,opacity:.8});
const world=new THREE.Group();scene.add(world);const blocks=[],lines=[],ray=new THREE.Raycaster(),pointer=new THREE.Vector2();const cube=new THREE.BoxGeometry(1,1,1);
function mesh(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;world.add(m);return m}
function box(x,y,z,w,h,d,mat){const m=mesh(cube,mat,x,y,z);m.scale.set(w,h,d);return m}
for(const side of [-1,1]){box(side*6.9,-1.1,0,6.2,3.3,7,rock);for(let j=0;j<6;j++){const x=side*(5.2+j*.53);box(x,.65+(j%3)*.12,0, .55,.35,6.8,rock)}}const abyss=box(0,-4.4,0,30,.2,30,rock);abyss.receiveShadow=true;
const N=19,R=6.1,centerY=-1.25,theta0=Math.PI*.17,theta1=Math.PI*.83,thickness=.72,depth=2.25,positions=[];for(let i=0;i<N;i++){const a=theta0+(theta1-theta0)*(i+.5)/N;positions.push({x:-R*Math.cos(a),y:centerY+R*Math.sin(a),angle:a})}
function wedgeGeometry(a0,a1){const vertices=[],idx=[];for(const radius of [R-thickness/2,R+thickness/2])for(const a of [a0,a1])for(const z of [-depth/2,depth/2])vertices.push(-radius*Math.cos(a),centerY+radius*Math.sin(a),z);
const faces=[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]];for(const f of faces){idx.push(f[0],f[1],f[2],f[0],f[2],f[3])}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setIndex(idx);g.computeVertexNormals();return g}
let particles=[],constraints=[],release=-1,selected=-1,diagnostics=false,stepCount=0,energy=0,maxError=0;const STEP=1/120,GRAVITY=9.8,ITER=12;
function reset(){for(const b of blocks)world.remove(b.mesh);blocks.length=0;for(const l of lines)world.remove(l);lines.length=0;particles=[];constraints=[];release=-1;selected=-1;stepCount=0;
for(let i=0;i<N;i++){const a0=theta0+(theta1-theta0)*i/N,a1=theta0+(theta1-theta0)*(i+1)/N,p=positions[i],body=mesh(wedgeGeometry(a0,a1),i%3?stone:stoneAlt);body.userData.block=i;blocks.push({mesh:body,index:i});particles.push({x:p.x,y:p.y,px:p.x,py:p.y,mass:1,angle:p.angle})}
for(let i=0;i<N-1;i++)constraints.push({a:i,b:i+1,rest:Math.hypot(particles[i].x-particles[i+1].x,particles[i].y-particles[i+1].y),active:true});
for(const side of [0,N-1]){const p=particles[side],bearing=mesh(new THREE.SphereGeometry(.22,14,10),gold,p.x,p.y,1.35);bearing.userData.bearing=side;lines.push(bearing)}
}
reset();
function integrate(){stepCount++;const released=release!==-1;for(let i=0;i<N;i++){const p=particles[i],vx=(p.x-p.px)*.995,vy=(p.y-p.py)*.995;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy-GRAVITY*STEP*STEP}
for(let it=0;it<ITER;it++){for(const c of constraints){if(!c.active)continue;const a=particles[c.a],b=particles[c.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,delta=(d-c.rest)/d*.5;a.x+=dx*delta;a.y+=dy*delta;b.x-=dx*delta;b.y-=dy*delta;if(released&&Math.abs(d-c.rest)>c.rest*.24)c.active=false}
for(const end of [0,N-1]){if(end===release)continue;const p=particles[end],q=positions[end];p.x=q.x;p.y=q.y}
for(const p of particles){if(p.y<-.28&&Math.abs(p.x)>5.0){p.y=-.28;p.py=Math.min(p.py,p.y);p.x=Math.max(-8,Math.min(8,p.x))}}}
energy=0;maxError=0;for(let i=0;i<N;i++){const p=particles[i];energy+=((p.x-p.px)**2+(p.y-p.py)**2)/(STEP*STEP);const b=blocks[i].mesh;b.position.set(p.x-positions[i].x,p.y-positions[i].y,0);const left=particles[Math.max(0,i-1)],right=particles[Math.min(N-1,i+1)];const dx=right.x-left.x,dy=right.y-left.y;const desired=Math.atan2(dy,dx),base=Math.atan2(positions[Math.min(N-1,i+1)].y-positions[Math.max(0,i-1)].y,positions[Math.min(N-1,i+1)].x-positions[Math.max(0,i-1)].x);b.rotation.z=desired-base}
for(const c of constraints)if(c.active){const a=particles[c.a],b=particles[c.b];maxError=Math.max(maxError,Math.abs(Math.hypot(a.x-b.x,a.y-b.y)-c.rest))}}
const status=document.querySelector('#status');function info(){status.textContent='bonded arch proxy · NOT frictional masonry\n'+ 'units '+N+'  bonds '+constraints.filter(c=>c.active).length+'/'+constraints.length+'  dt 1/120  iterations '+ITER+'\n'+'released '+(release<0?'none':release===0?'left':'right')+'  max error '+maxError.toFixed(4)+'\n'+'kinetic proxy '+energy.toFixed(1)+'  steps '+stepCount+(selected>=0?'\ninspecting stone '+selected:'')}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();function pick(e){pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(pointer,camera);return ray.intersectObjects([...lines,...blocks.map(b=>b.mesh)])[0]?.object}
let gesture=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);gesture={x:e.clientX,y:e.clientY,dist:0}});canvas.addEventListener('pointermove',e=>{if(!gesture)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture.dist+=Math.abs(dx)+Math.abs(dy);gesture.x=e.clientX;gesture.y=e.clientY;if(gesture.dist>5){yaw-=dx*.008;cameraPose()}});canvas.addEventListener('pointerup',e=>{if(!gesture)return;if(gesture.dist<8){const m=pick(e);if(m?.userData.bearing!==undefined){release=m.userData.bearing;m.material=stoneAlt}else if(m?.userData.block!==undefined)selected=m.userData.block}gesture=null});document.querySelector('#reset').onclick=reset;document.querySelector('#eye').onclick=()=>{diagnostics=!diagnostics;for(const b of blocks)b.mesh.material=diagnostics?stoneAlt:stone;info()};
let last=performance.now(),acc=0;function frame(now){acc+=Math.min((now-last)/1000,.05);last=now;let loops=0;while(acc>=STEP&&loops++<6){integrate();acc-=STEP}info();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
