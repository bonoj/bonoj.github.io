<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Relational Architecture</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#182026;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#label{position:fixed;top:16px;left:16px;color:#f0d7a4;font:12px system-ui;letter-spacing:.08em;pointer-events:none}#label b{font-size:16px}#reset{position:fixed;top:16px;right:16px;border:1px solid #bba47b;background:#253039;color:#f0d7a4;border-radius:50%;width:42px;height:42px;font-size:23px}</style><canvas></canvas><div id="label"><b>RELATIONAL ARCHITECTURE</b><div>DRAG AMBER ANCHORS · TAP TO GROW · SWIPE TO ORBIT</div></div><button id="reset">↺</button><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const c=document.querySelector('canvas'),r=new T.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setClearColor(0x182026);r.shadowMap.enabled=true;
const s=new T.Scene(),cam=new T.PerspectiveCamera(40,1,.1,100);let az=.65;function view(){cam.position.set(Math.sin(az)*19,15,Math.cos(az)*19);cam.lookAt(0,2,0)}view();s.add(new T.HemisphereLight(0xbad6f0,0x674e37,2));const sun=new T.DirectionalLight(0xffe1ae,3);sun.position.set(-8,16,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;s.add(sun);
const mats=[0x9c8063,0xd9b98a,0xf2bd62,0x79b8ba].map(color=>new T.MeshStandardMaterial({color,roughness:1,flatShading:true})),g=new T.Group();s.add(g);const floor=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x40433e}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;s.add(floor);
let nodes=[],anchors=[],people=[];const cube=new T.BoxGeometry(1,1,1);function box(x,y,z,w,h,d,mat=0){const m=new T.Mesh(cube,mats[mat]);m.position.set(x,y,z);m.scale.set(w,h,d);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}function add(x,z,h,parent){nodes.push({x,z,h,parent,id:nodes.length})}
function rebuild(){g.clear();anchors=[];for(const n of nodes){box(n.x,n.h/2,n.z,2.6,n.h,2.6);box(n.x,n.h+.08,n.z,3.1,.2,3.1,1);for(const sx of [-1,1])for(const sz of [-1,1])box(n.x+sx*1.4,n.h+.5,n.z+sz*1.4,.15,.9,.15,0);const m=new T.Mesh(new T.SphereGeometry(.26,12,8),mats[2]);m.position.set(n.x,n.h+.95,n.z);m.userData.id=n.id;g.add(m);anchors.push(m)}
for(const n of nodes){if(n.parent<0)continue;const p=nodes[n.parent],a=new T.Vector3(p.x,p.h,p.z),b=new T.Vector3(n.x,n.h,n.z),v=b.clone().sub(a),length=v.length();if(length<.5)continue;const deck=new T.Mesh(cube,mats[1]);deck.position.copy(a).add(b).multiplyScalar(.5);deck.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),v.clone().normalize());deck.scale.set(1.6,.17,length);deck.castShadow=true;g.add(deck);const steps=Math.max(3,Math.ceil(Math.abs(n.h-p.h)/.24));for(let i=0;i<=steps;i++){const t=i/steps,q=a.clone().lerp(b,t);box(q.x,q.y+.12,q.z,1.7,.1,.14,1)}}
for(const p of people){const m=new T.Mesh(new T.ConeGeometry(.16,.5,5),mats[3]);m.rotation.x=Math.PI;g.add(m);p.mesh=m}}
function reset(){nodes=[];add(-4,0,1.4,-1);add(0,0,3.3,0);add(4,0,4.6,1);add(4,-4,3.5,2);people=Array.from({length:10},(_,i)=>({a:i%4,b:(i+1)%4,t:i/11,speed:.08+i*.008}));rebuild()}reset();
const ray=new T.Raycaster(),pt=new T.Vector2();function pick(e){pt.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(pt,cam);return ray.intersectObjects(anchors)[0]?.object.userData.id??null}let drag=null;c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={id:pick(e),x:e.clientX,y:e.clientY,originX:e.clientX,originY:e.clientY,moved:false}});c.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(Math.hypot(e.clientX-drag.originX,e.clientY-drag.originY)>8)drag.moved=true;if(drag.id===null){az-=dx*.008;view()}else if(drag.moved){const n=nodes[drag.id];n.x=T.MathUtils.clamp(n.x+dx*.015,-9,9);n.h=T.MathUtils.clamp(n.h-dy*.018,.7,9);rebuild()}});c.addEventListener('pointerup',()=>{if(drag&&!drag.moved&&drag.id!==null&&nodes.length<14){const n=nodes[drag.id],a=nodes.length*2.39996;add(n.x+Math.cos(a)*4,n.z+Math.sin(a)*4,Math.max(1,n.h+(nodes.length%2?1:-.7)),drag.id);rebuild()}drag=null});document.querySelector('#reset').onclick=reset;
function resize(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;for(const p of people){p.t+=dt*p.speed;if(p.t>=1){p.a=p.b;const neighbors=nodes.filter(n=>n.parent===p.a||nodes[p.a].parent===n.id);p.b=neighbors.length?neighbors[Math.floor(Math.random()*neighbors.length)].id:p.a;p.t=0}const a=nodes[p.a],b=nodes[p.b];if(a&&b)p.mesh.position.set(T.MathUtils.lerp(a.x,b.x,p.t),T.MathUtils.lerp(a.h,b.h,p.t)+.42,T.MathUtils.lerp(a.z,b.z,p.t))}r.render(s,cam);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
