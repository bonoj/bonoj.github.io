function latticeParseNdbc(body){const lines=body.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const head=lines.find(x=>/^#?YY\s+MM\s+DD\s+hh\s+mm\b/i.test(x));if(!head)throw Error('Missing NDBC columns');const keys=head.replace(/^#/,'').split(/\s+/),rows=[];for(const line of lines){if(line.startsWith('#'))continue;const values=line.split(/\s+/);if(values.length<keys.length)continue;const x=Object.fromEntries(keys.map((k,i)=>[k,values[i]]));const yr=Number(x.YY),mo=Number(x.MM),day=Number(x.DD),hh=Number(x.hh),mm=Number(x.mm);if(![yr,mo,day,hh,mm].every(Number.isFinite))continue;const time=new Date(Date.UTC(yr<100?2000+yr:yr,mo-1,day,hh,mm));if(!Number.isFinite(time.getTime()))continue;const row={time:time.toISOString()};for(const k of ['WVHT','PRES']){const n=Number(x[k]);if(x[k]!=null&&!/^MM$/i.test(x[k])&&Number.isFinite(n)&&n>=0)row[k]=n}if(row.WVHT!==undefined||row.PRES!==undefined)rows.push(row);if(rows.length>=10)break}if(!rows.length)throw Error('No valid NDBC wave/pressure values');return {rows,station:'41009'} }

function draw(){frame++;const w=cw,h=ch;if(!w||!h){requestAnimationFrame(draw);return}ctx.clearRect(0,0,w,h);const R=Math.min(w*.43,h*.45)*Math.min(selected.scale,1.25),cx=w/2,cy=h/2;const glow=ctx.createRadialGradient(cx,cy,R*.45,cx,cy,R*1.45);glow.addColorStop(0,'#1d6680');glow.addColorStop(.68,'#0c3549');glow.addColorStop(1,'#06121b');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,R*1.4,0,Math.PI*2);ctx.fill();const sea=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);sea.addColorStop(0,'#1a617b');sea.addColorStop(1,'#071c30');ctx.fillStyle=sea;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();ctx.strokeStyle='#3b81904a';ctx.lineWidth=.7;for(let lat=-75;lat<=75;lat+=15){ctx.beginPath();let open=false;for(let lon=-180;lon<=180;lon+=2){const [x,y,z]=xyz(lat,lon);if(z<=0){open=false;continue}if(!open){ctx.moveTo(cx+x*R,cy-y*R);open=true}else ctx.lineTo(cx+x*R,cy-y*R)}ctx.stroke()}for(let lon=-180;lon<=180;lon+=15){ctx.beginPath();let open=false;for(let lat=-90;lat<=90;lat+=2){const [x,y,z]=xyz(lat,lon);if(z<=0){open=false;continue}if(!open){ctx.moveTo(cx+x*R,cy-y*R);open=true}else ctx.lineTo(cx+x*R,cy-y*R)}ctx.stroke()}ctx.fillStyle='#386c64';ctx.strokeStyle='#8ac4ac';ctx.lineWidth=1.2;for(const poly of land){ctx.beginPath();let open=false;for(let i=0;i<poly.length;i++){const [lat,lon]=poly[i],[x,y,z]=xyz(lat,lon);if(z<=0){open=false;continue}if(!open){ctx.moveTo(cx+x*R,cy-y*R);open=true}else ctx.lineTo(cx+x*R,cy-y*R)}ctx.stroke()}for(const r of regions.slice(1,8)){const [x,y,z]=xyz(r.lat,r.lon);if(z<=0)continue;ctx.fillStyle=r.id===selected.id?'#ffe7a2':'#a3d5d3';ctx.beginPath();ctx.arc(cx+x*R,cy-y*R,r.id===selected.id?4:2.5,0,7);ctx.fill()}if(issPos){const [x,y,z]=xyz(issPos.lat,issPos.lon);if(z>0){ctx.fillStyle='#ffde9c';ctx.beginPath();ctx.arc(cx+x*R,cy-y*R,5,0,7);ctx.fill();ctx.font='12px system-ui';ctx.fillText('ISS',cx+x*R+9,cy-y*R-6)}}ctx.restore();ctx.strokeStyle='#65b7c3';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();$('orbit').textContent=issPos?'ISS · '+issPos.lat.toFixed(1)+'°, '+issPos.lon.toFixed(1)+'° · '+fmt(issPos.alt,'km'):'ISS · awaiting position';requestAnimationFrame(draw)}
