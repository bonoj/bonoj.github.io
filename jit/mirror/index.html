<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9f2"><title>The Kind Mirror</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,serif}body{background:#191625;color:#4a3c5b}.scene{height:100dvh;min-height:430px;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;touch-action:manipulation;background:radial-gradient(ellipse at 50% 55%,#554761,#1a1727 75%)}.halo{position:absolute;width:min(94vw,75vh);height:93%;border-radius:48% 48% 43% 43%;background:conic-gradient(#d3b7cb,#e6d8ae,#c5e0cf,#b8d6e7,#d4c1e8,#e8c4c8,#d3b7cb);filter:blur(22px);opacity:.5;animation:breathe 8s ease-in-out infinite}.frame{position:absolute;inset:3% max(3%,calc((100vw - 650px)/2));border-radius:48% 48% 43% 43%;padding:clamp(10px,2.5vw,22px);background:linear-gradient(125deg,#fff6e2,#b5a5ba 19%,#faf4e3 37%,#9fabb9 57%,#f8e5c7 79%,#a79fb3);box-shadow:0 9px 35px #0008,inset 0 0 0 2px #fff9,inset 0 0 0 7px #7b7182}.glass{position:relative;width:100%;height:100%;border-radius:47% 47% 42% 42%;overflow:hidden;display:grid;place-items:center;padding:12%;border:2px solid #ffffff9c;background:radial-gradient(ellipse at 48% 38%,#fdf9f0,#e7e8ee 43%,#c9d7dc 75%,#aeb5ca);box-shadow:inset 0 0 40px #64718966}.glass:before{content:"";position:absolute;inset:-30%;background:conic-gradient(transparent,#f7bddb55,transparent,#b9e4db66,transparent,#c9b5ef55,transparent);filter:blur(28px);animation:turn 23s linear infinite}.glass:after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,#ffffff88,transparent 32%,#ffffff22 54%,transparent 75%);pointer-events:none}.message{position:relative;z-index:2;text-align:center;color:#453a56;font-size:clamp(38px,9.4vw,78px);line-height:1.16;letter-spacing:-.025em;text-wrap:balance;text-shadow:0 2px 1px #fff9;transition:opacity .3s,transform .3s;overflow-wrap:break-word}.message.out{opacity:0;transform:translateY(9px)}.star{position:absolute;z-index:3;color:#fffef2;text-shadow:0 0 7px #fff,0 0 15px #e6bce9;animation:twinkle var(--dur) ease-in-out infinite alternate;pointer-events:none}.caption{position:absolute;z-index:3;bottom:8%;left:0;right:0;text-align:center;font:clamp(12px,2.5vw,17px) system-ui,sans-serif;letter-spacing:.14em;color:#655b73}.hint{position:absolute;z-index:5;bottom:1%;color:#ddd0e3;font:13px system-ui,sans-serif;letter-spacing:.05em}@keyframes breathe{50%{opacity:.7;transform:scale(1.025)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes twinkle{from{opacity:.12;transform:scale(.65)}to{opacity:.9;transform:scale(1.3)}}@media(prefers-reduced-motion:reduce){.halo,.glass:before,.star{animation:none}}
</style></head><body><main class="scene" id="scene" role="button" tabindex="0" aria-label="Touch for another affirmation"><div class="halo"></div><div class="frame"><div class="glass" id="glass"><div class="message" id="message" aria-live="polite">You are loved.</div><div class="caption">A LITTLE LIGHT FOR YOU</div></div></div><div class="hint">Touch the mirror for another kindness ✧</div></main><script>
(()=>{const glass=document.getElementById('glass'),message=document.getElementById('message'),scene=document.getElementById('scene');
const lines=['You are loved.','You matter.','You are enough.','You belong.','You are precious.','You are cherished.','You are worthy.','You are a gift.','You are wonderful.','You are beautiful.','You are appreciated.','You are important.','You deserve kindness.','You deserve peace.','You deserve rest.','You deserve joy.','You deserve gentleness.','You deserve good things.','You deserve to be heard.','You deserve tenderness.','You deserve care.','You deserve comfort.','Your heart matters.','Your voice matters.','Your story matters.','Your presence matters.','Your feelings matter.','Your happiness matters.','Your needs matter.','Your dreams matter.','Your peace matters.','You bring warmth.','You bring light.','You bring joy.','You make a difference.','You have so much to give.','Your kindness shines.','Your smile is a gift.','Your love is meaningful.','Your life is meaningful.','You can take your time.','You can rest now.','You can begin again.','You can go gently.','You can slow down.','You can just be.','You can ask for help.','You can choose peace.','You can breathe easy.','You need not be perfect.','You need not rush.','You need not prove anything.','You need not do it all.','You need not have answers.','You need not earn love.','You need not be strong today.','Small joys count.','Quiet moments count.','Your best is enough.','Today is a new day.','There is room for joy.','There is beauty ahead.','Hope can be gentle.','Softness is strength.','Rest is worthwhile.','Peace begins small.','You are not alone.','You are deeply valued.','You are easy to love.','You are allowed to laugh.','You are allowed to pause.','You are allowed to bloom.','You are still growing.','You are still becoming.','You are wonderfully human.','Your light is yours.','Your pace is yours.','Your path is yours.','Your joy is yours.','Your heart is beautiful.','Your courage is real.','Your efforts matter.','Your love leaves traces.','You make the world warmer.','May today be gentle.','May you feel loved.','May you find peace.','May you feel safe.','May you find wonder.','May you feel cherished.','May kindness find you.','May joy surprise you.','May you rest well.','May your heart be light.'];
let deck=[],busy=false;function refill(){deck=lines.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function next(){if(busy)return;busy=true;message.classList.add('out');setTimeout(()=>{if(!deck.length)refill();message.textContent=lines[deck.pop()];message.classList.remove('out');busy=false},310)}for(let i=0;i<18;i++){const s=document.createElement('span');s.className='star';s.textContent=i%3===0?'✦':'✧';s.style.left=(8+Math.random()*84)+'%';s.style.top=(9+Math.random()*80)+'%';s.style.fontSize=(9+Math.random()*13)+'px';s.style.setProperty('--dur',(2+Math.random()*4)+'s');s.style.animationDelay=(-Math.random()*5)+'s';glass.appendChild(s)}refill();scene.addEventListener('click',next);scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}})})();
</script><!-- Mirror publication recovery: fresh Pages artifact. --></body></html>
