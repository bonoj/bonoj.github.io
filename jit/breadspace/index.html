<!doctype html><html lang="en"><meta charset="utf-8"><title>BREADSPACE · Ballistic Bakery</title><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#10171b;color:#e6eee8;font-family:system-ui}main{height:100dvh;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 38%,#435047,#1a292d 70%,#10171b)}.floor{position:absolute;top:59%;bottom:0;width:100%;background:repeating-linear-gradient(115deg,transparent 0 48px,#a4bbab18 49px 50px),linear-gradient(#303b37,#151d1d)}.target{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-size:80px;cursor:crosshair;filter:drop-shadow(0 10px 10px #0008)}.label{position:absolute;top:15px;left:16px;font:11px monospace;letter-spacing:2px;color:#c4d7ca}.inv{position:absolute;right:16px;top:15px;color:#ffe5a0}.msg{position:absolute;top:45%;width:100%;text-align:center;font:13px monospace;color:#e8d9a8}.shot{position:absolute;left:50%;bottom:27%;font-size:45px;animation:fly .4s ease-in forwards;pointer-events:none}@keyframes fly{to{bottom:68%;transform:scale(.3);opacity:0}}button{touch-action:manipulation;cursor:pointer}a{color:#9bd6bd}</style><style>.gun{position:absolute;bottom:-18px;right:7%;width:165px;height:215px;transform:rotate(-16deg);pointer-events:none}.barrel{position:absolute;left:40px;top:0;width:77px;height:170px;border:4px solid #172329;border-radius:23px;background:linear-gradient(90deg,#26373c,#93a3a0 30%,#34494f 65%,#18272c)}.grip{position:absolute;left:73px;top:125px;width:80px;height:110px;transform:skew(-13deg);background:linear-gradient(90deg,#263238,#687979,#26373b);border-radius:15px}.dial{position:absolute;left:51px;top:65px;width:55px;height:55px;border:3px solid #a8d6bd;border-radius:50%;background:#203738;display:grid;place-items:center;font-size:32px}.controls{position:absolute;bottom:18px;left:12px;display:flex;gap:10px}.controls button{font-size:22px;background:#263b40;color:white;border:1px solid #91ada0;border-radius:12px;padding:13px}.name{position:absolute;bottom:95px;left:16px;font:12px monospace;color:#c6e0d0}.kick{animation:kick .32s}@keyframes kick{50%{translate:0 18px}}</style><main id="world"><div class="floor"></div><div class="label">BREADSPACE / TEST CHAMBER 01<br><a href="mechanism.html">MECHANISM TEST →</a></div><div class="inv" id="inv">🎒 🍞 × 0</div><div class="target" id="target">🌾</div><div class="msg" id="msg">SELECT INGREDIENT · FIRE AT TARGET</div><div class="gun" id="gun"><div class="grip"></div><div class="barrel"></div><div class="dial" id="ammo">🪨</div></div><div class="name" id="name">🪨 MILLSTONE</div><div class="controls"><button id="prev">◀</button><button id="fire">💥 FIRE</button><button id="next">▶</button></div></main><script>const ammo=['🪨','💧','🦠','🔥'];const names=['MILLSTONE','WATER','YEAST','PLASMA'];const needs=[0,1,2,3],targets=['🌾','🥣','🥣','🫓','🍞'];let sel=0,stage=0,loaves=0,busy=false;const $=id=>document.getElementById(id);function render(){$('target').textContent=targets[stage];$('inv').textContent='🎒 🍞 × '+loaves;$('ammo').textContent=ammo[sel];$('name').textContent=ammo[sel]+' '+names[sel]}function fire(){if(busy)return;busy=true;let p=document.createElement('div');p.className='shot';p.textContent=ammo[sel];$('world').append(p);$('gun').classList.add('kick');setTimeout(()=>{p.remove();$('gun').classList.remove('kick');if(sel===needs[stage]){stage++;$('msg').textContent=['','🌾 → 🥣 FLOUR','💧 ABSORBED','🦠 → 🫓 DOUGH','🔥 → 🍞 BREAD'][stage];if(stage===4){loaves++;render();$('msg').textContent='🎒 +1 🍞 ACQUIRED';setTimeout(()=>{stage=0;render();$('msg').textContent='NEW WHEAT READY'},950)}}else $('msg').textContent='💨 NO REACTION';render();busy=false},410)}$('target').onclick=fire;function cycle(d){sel=(sel+d+4)%4;render()}$('prev').onclick=()=>cycle(-1);$('next').onclick=()=>cycle(1);$('fire').onclick=fire;render();</script></html>
