<!doctype html><html lang="en"><meta charset="utf-8"><title>BREADSPACE · Mechanism Test</title><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#10171b;color:#e6eee8;font-family:system-ui}main{height:100dvh;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 38%,#435047,#1a292d 70%,#10171b)}.floor{position:absolute;top:59%;bottom:0;width:100%;background:repeating-linear-gradient(115deg,transparent 0 48px,#a4bbab18 49px 50px),linear-gradient(#303b37,#151d1d)}.target{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-size:80px;cursor:crosshair;filter:drop-shadow(0 10px 10px #0008)}.label{position:absolute;top:15px;left:16px;font:11px monospace;letter-spacing:2px;color:#c4d7ca}.inv{position:absolute;right:16px;top:15px;color:#ffe5a0}.msg{position:absolute;top:45%;width:100%;text-align:center;font:13px monospace;color:#e8d9a8}.shot{position:absolute;left:50%;bottom:27%;font-size:45px;animation:fly .4s ease-in forwards;pointer-events:none}@keyframes fly{to{bottom:68%;transform:scale(.3);opacity:0}}button{touch-action:manipulation;cursor:pointer}a{color:#9bd6bd}</style><style>.gun{position:absolute;bottom:-30px;left:50%;width:310px;height:310px;transform:translateX(-50%);pointer-events:none}.barrel{position:absolute;left:117px;top:0;width:76px;height:164px;border-radius:18px;background:linear-gradient(90deg,#25363b,#849694 30%,#31474c 70%,#1b2b30);border:4px solid #121f24}.body{position:absolute;left:88px;top:90px;width:135px;height:174px;border-radius:18px;background:linear-gradient(90deg,#27383e,#708182 35%,#2b3c42);border:4px solid #17252b}.slide{position:absolute;left:104px;top:78px;width:101px;height:53px;border:3px solid #1a272c;border-radius:9px;background:repeating-linear-gradient(90deg,#394c51 0 10px,#879795 11px 15px)}.drum{position:absolute;left:10px;top:142px;width:120px;height:120px;border-radius:50%;background:repeating-conic-gradient(#354c50 0deg 40deg,#17282d 40deg 60deg);border:12px solid #8a9e98;box-shadow:0 0 0 4px #18272b}.drum:after{content:'';position:absolute;inset:31px;border-radius:50%;background:#1d2d31;border:7px solid #a4b0a7}.cylinder{position:absolute;left:179px;top:129px;width:115px;height:115px;border-radius:50%;border:10px solid #a1afa6;background:#26393d;display:grid;place-items:center;font-size:30px}.mag{position:absolute;left:196px;top:226px;width:79px;height:100px;background:linear-gradient(90deg,#22343a,#84938d,#293d42);clip-path:polygon(0 0,100% 0,95% 72%,62% 100%,8% 83%);transform:rotate(-25deg)}.module{position:absolute;left:119px;top:161px;width:75px;height:75px;border-radius:15px;border:4px solid #b3e0c5;background:#1b383b;box-shadow:0 0 18px #8fdeb775;display:grid;place-items:center;font-size:40px;pointer-events:auto;cursor:pointer}.spin{animation:spin .75s ease-in-out}.rack{animation:rack .6s ease-in-out}.rock{animation:rock .75s ease-in-out}.kick{animation:kick .35s}@keyframes spin{to{rotate:360deg}}@keyframes rack{45%{translate:0 25px}}@keyframes rock{50%{transform:rotate(-44deg) translateY(14px)}}@keyframes kick{50%{transform:translateX(-50%) translateY(22px)}}.hint{position:absolute;bottom:12px;left:12px;font:11px monospace;color:#b3c8ba}.hint span{font-size:16px}</style><main id="world"><div class="floor"></div><div class="label">BREADSPACE / MECHANISM TEST 01<br><a href="index.html">← ORIGINAL PROTOTYPE</a></div><div class="inv" id="inv">🎒 🍞 × 0</div><div class="target" id="target">🌾</div><div class="msg" id="msg">TAP THE GLOWING GUN MODULE TO CYCLE</div><div class="gun" id="gun"><div class="mag" id="mag"></div><div class="barrel"></div><div class="body"></div><div class="slide" id="slide"></div><div class="drum" id="drum"></div><div class="cylinder" id="cylinder">💧 🦠<br>🔥 🪨</div><div class="module" id="ammo" role="button" aria-label="Cycle ammunition">🪨</div></div><div class="hint"><span id="name">🪨 MILLSTONE</span><br>TAP MODULE ↻ · TAP WORLD TO FIRE</div></main><script>const ammo=['🪨','💧','🦠','🔥'];const names=['MILLSTONE','WATER','YEAST','PLASMA'];const needs=[0,1,2,3],targets=['🌾','🥣','🥣','🫓','🍞'];let sel=0,stage=0,loaves=0,busy=false;const $=id=>document.getElementById(id);function render(){$('target').textContent=targets[stage];$('inv').textContent='🎒 🍞 × '+loaves;$('ammo').textContent=ammo[sel];$('name').textContent=ammo[sel]+' '+names[sel]}function fire(){if(busy)return;busy=true;let p=document.createElement('div');p.className='shot';p.textContent=ammo[sel];$('world').append(p);$('gun').classList.add('kick');setTimeout(()=>{p.remove();$('gun').classList.remove('kick');if(sel===needs[stage]){stage++;$('msg').textContent=['','🌾 → 🥣 FLOUR','💧 ABSORBED','🦠 → 🫓 DOUGH','🔥 → 🍞 BREAD'][stage];if(stage===4){loaves++;render();$('msg').textContent='🎒 +1 🍞 ACQUIRED';setTimeout(()=>{stage=0;render();$('msg').textContent='NEW WHEAT READY'},950)}}else $('msg').textContent='💨 NO REACTION';render();busy=false},410)}$('target').onclick=fire;function animate(id,cls){let e=$(id);e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls);setTimeout(()=>e.classList.remove(cls),800)}function cycle(){if(busy)return;busy=true;sel=(sel+1)%4;animate('drum','spin');animate('cylinder','spin');animate('slide','rack');animate('mag','rock');$('msg').textContent='↻ FEEDING '+names[sel];setTimeout(()=>{render();$('msg').textContent='CHAMBER LOCKED';busy=false},780)}$('ammo').onclick=e=>{e.stopPropagation();cycle()};$('world').onclick=e=>{if(e.target.closest('#ammo'))return;fire()};render();</script></html>
