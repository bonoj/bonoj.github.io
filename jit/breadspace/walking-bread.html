<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Breadspace: The Walking Bread</title><style>*{box-sizing:border-box}body{margin:0;background:#101b1b;color:#e6ebdb;font:12px monospace}.app{height:100dvh;display:flex;flex-direction:column}.world{position:relative;flex:1;min-height:300px;touch-action:none;background:radial-gradient(ellipse at 52% 55%,#35433a,#101b1b 80%)}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;color:#bcd0b8;font-size:10px;pointer-events:none}.panel{padding:12px;background:#1b2927;border-top:1px solid #536b59}.small{font-size:11px;color:#a8c3af}.chain{text-align:center;font-size:22px;padding:13px;background:#111d1c;border-radius:10px;margin:9px 0}button{background:#34473b;border:1px solid #7e9a7d;border-radius:8px;color:#e9edda;padding:8px}</style><div class="app"><div class="world" id="world"><canvas id="cv"></canvas><div class="top"><span>WALKING BREAD / SEED 741</span><span id="clock">00:00</span></div></div><div class="panel"><div style="display:flex;align-items:center;justify-content:space-between"><div><div class="small" id="type">LIVING STRUCTURE</div><b id="name">🪱 WORM TOWER</b></div><button id="pause">Ⅱ PAUSE</button></div><div class="chain" id="chain">🍂 → 🪱 → 🪱 → ☀️</div><div class="small" id="desc">Worms cling, climb, and wriggle toward the sun.</div><div class="small" id="stats" style="margin-top:8px"></div></div></div><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),world=document.getElementById('world'),$=id=>document.getElementById(id);let seed=741;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const meals=['🍔','🍕','🍞','🥐','🥯','🥨','🥪','🌮','🌯','🍜','🍝','🍚','🍙','🍣','🍤','🍗','🥩','🥓','🥞','🧇','🍳','🥗','🥘','🍲','🎂','🍰','🧁','🥧','🍪','🍩','🍦','🍨','🍫','🍎','🍌','🍓','🍇','🍉','🥑','🥔','🌽','🥕','🫘','🧀'];
const recipes={'🍔':['🍞','🥩','🧀','🥬','🍅'],'🍕':['🌾','🍅','🧀','🫒'],'🍞':['🌾','💧','🦠'],'🥐':['🌾','🧈','🥛'],'🥯':['🌾','💧'],'🥨':['🌾','🧂'],'🥪':['🍞','🧀','🥬','🍅'],'🌮':['🌽','🥩','🥬','🍅'],'🌯':['🌾','🫘','🍚','🧀'],'🍜':['🌾','🥚','🍄','🧅'],'🍝':['🌾','🥚','🍅'],'🍚':['🌾','💧'],'🍙':['🍚','🐟'],'🍣':['🍚','🐟'],'🍤':['🦐','🌾'],'🍗':['🐔','🔥'],'🥩':['🐄'],'🥓':['🐖','🧂'],'🥞':['🌾','🥚','🥛','🧈'],'🧇':['🌾','🥚','🥛'],'🍳':['🥚','🔥'],'🥗':['🥬','🥒','🍅','🥑'],'🥘':['🍚','🥩','🫑'],'🍲':['🥔','🥕','🧅'],'🎂':['🌾','🥚','🥛','🧈','🍬'],'🍰':['🌾','🥚','🧈','🍬'],'🧁':['🌾','🥚','🍬'],'🥧':['🌾','🧈','🍎'],'🍪':['🌾','🧈','🍬','🍫'],'🍩':['🌾','🧈','🍬'],'🍦':['🥛','🍬','❄️'],'🍨':['🥛','🍓','🍬'],'🍫':['🍫','🥛'],'🧀':['🥛','🦠']};
const roles=['👨‍🌾','👩‍🍳','👨‍🏭','👩‍🔧','👩‍🔬','👨‍⚕️','👨‍🚒','👩‍✈️','👨‍⚖️','👩‍💼','👩‍🚀','👮','💂','🕵️','👷'];
const spots=Array.from({length:23},()=>({x:.06+rand()*.84,y:.21+rand()*.54,e:meals[Math.floor(rand()*meals.length)]})),factory={x:.49,y:.4,e:'🏭'},heap={x:.65,y:.78,e:'🍂'},tower={x:.83,y:.82,e:'🪱'},sun={x:.83,y:.10};
const humans=Array.from({length:35},(_,i)=>({x:.06+rand()*.84,y:.2+rand()*.55,e:roles[i%roles.length],to:spots[Math.floor(rand()*spots.length)],history:[],phase:'forage',t:0,speed:.035+rand()*.03})),parcels=[],worms=[];
let extracted=0,ingredients=0,compost=0,spawned=0,fallen=0,elapsed=0,paused=false;
function choose(h){h.to=spots[Math.floor(rand()*spots.length)]}
function parcel(e,x,y){parcels.push({e,x,y,speed:.09+rand()*.08})}
function extract(h){for(let m of h.history){extracted++;let parts=recipes[m]||[m];for(let p of parts)parcel(p,factory.x+(rand()-.5)*.03,factory.y+(rand()-.5)*.03);ingredients+=parts.length}h.history=[]}
function addWorm(){spawned++;let n=worms.length;worms.push({x:heap.x,y:heap.y,tx:tower.x,ty:tower.y-.015*n,phase:'crawl',age:0,offset:rand()*6.28,lean:(rand()-.5)*.06})}
function move(o,to,speed,dt){let dx=to.x-o.x,dy=to.y-o.y,d=Math.hypot(dx,dy);if(d<.014)return true;let step=Math.min(d,speed*dt);o.x+=dx/d*step;o.y+=dy/d*step;return false}
function update(dt){elapsed+=dt;for(let h of humans){h.t+=dt;if(h.phase==='forage'){if(move(h,h.to,h.speed,dt)&&h.t>.6){h.history.push(h.to.e);h.t=0;if(h.history.length>=2+Math.floor(rand()*3)){h.phase='factory';h.to=factory}else choose(h)}}else if(move(h,factory,h.speed*1.4,dt)){extract(h);h.phase='forage';h.t=0;choose(h)}}
for(let i=parcels.length-1;i>=0;i--){let p=parcels[i];if(move(p,heap,p.speed,dt)){parcels.splice(i,1);compost++;if(compost%4===0)addWorm()}}
for(let w of worms){w.age+=dt;if(w.phase==='crawl'){if(move(w,{x:w.tx,y:w.ty},.05,dt))w.phase='stack'}else{w.x=tower.x+w.lean+Math.sin(elapsed*1.8+w.offset)*(.009+worms.length*.00006);w.y=w.ty+Math.sin(elapsed*2+w.offset)*.004;if(worms.length>30&&rand()<dt*.002){w.phase='crawl';w.x+=.06;w.y+=.03;fallen++}}}}
function emoji(e,x,y,size){ctx.font=size+'px "Noto Color Emoji","Apple Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y)}
function draw(){let w=world.clientWidth,h=world.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=w*dpr;cv.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#62796555';ctx.lineWidth=1;for(let s of spots){ctx.beginPath();ctx.moveTo(s.x*w,s.y*h);ctx.lineTo(factory.x*w,factory.y*h);ctx.stroke()}ctx.beginPath();ctx.moveTo(factory.x*w,factory.y*h);ctx.lineTo(heap.x*w,heap.y*h);ctx.lineTo(tower.x*w,tower.y*h);ctx.stroke();for(let s of spots){ctx.beginPath();ctx.arc(s.x*w,s.y*h,11,0,Math.PI*2);ctx.fillStyle='#32463a';ctx.fill();emoji(s.e,s.x*w,s.y*h,16)}for(let n of [factory,heap,tower]){ctx.beginPath();ctx.arc(n.x*w,n.y*h,25,0,Math.PI*2);ctx.fillStyle='#43503b';ctx.fill();ctx.strokeStyle='#c3aa76';ctx.stroke();emoji(n.e,n.x*w,n.y*h,25)}emoji('☀️',sun.x*w,sun.y*h,42);for(let a of humans){emoji(a.e,a.x*w,a.y*h,15);if(a.history.length){ctx.fillStyle='#f6d990';ctx.beginPath();ctx.arc(a.x*w+8,a.y*h-9,2.4+a.history.length*.35,0,Math.PI*2);ctx.fill()}}for(let p of parcels)emoji(p.e,p.x*w,p.y*h,14);for(let a of worms)emoji('🪱',a.x*w+Math.sin(elapsed*4+a.offset)*3,a.y*h,17)}
function inspect(id){let d={factory:['REVERSE KITCHEN','🏭 MEAL EXTRACTION','👨‍🌾 → 🍔 → 🥩 🧀 🍞','Meals are extracted from humans and divided into ingredients.'],heap:['COMPOST','🍂 COMPOST HEAP','🥩 🥬 🌾 → 🍂 → 🪱','Every four ingredient deliveries produces a worm.'],tower:['LIVING STRUCTURE','🪱 WORM TOWER','🍂 → 🪱🪱🪱 → ☀️','Only worms: climbing, clinging, wriggling and falling.'],human:['MOBILE INVENTORY','👨‍🌾 WALKING BREAD','🍕 🍔 🍰 → 👨‍🌾 → 🏭','Humans collect meals and deliver their histories to the factory.']}[id];$('type').textContent=d[0];$('name').textContent=d[1];$('chain').textContent=d[2];$('desc').textContent=d[3]}
world.addEventListener('pointerup',e=>{let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;let best='tower',d=Infinity;for(let [id,n] of [['factory',factory],['heap',heap],['tower',tower],...humans.map(n=>['human',n])]){let v=Math.hypot((x-n.x)*r.width,(y-n.y)*r.height);if(v<d){d=v;best=id}}if(d<35)inspect(best);else{let m=meals[Math.floor(rand()*meals.length)];for(let p of recipes[m]||[m])parcel(p,x,y)}});
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE'};
let last=0;function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused)update(dt);draw();$('clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('stats').textContent='HUMANS '+humans.length+' · MEALS '+extracted+' · INGREDIENTS '+ingredients+' · COMPOST '+compost+' · WORMS '+spawned+' · FALLS '+fallen;requestAnimationFrame(frame)}inspect('tower');requestAnimationFrame(frame);
</script></html>
