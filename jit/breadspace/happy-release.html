<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breadspace · Happy Release</title><style>*{box-sizing:border-box}body{margin:0;background:#101b1a;color:#dbe7d8;font-family:ui-monospace,monospace}.app{height:100dvh;display:flex;flex-direction:column}.world{position:relative;flex:1;min-height:320px;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 62% 45%,#33453b,#101a1b 78%)}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.07em;pointer-events:none;color:#c6d9c7}.panel{border-top:1px solid #51675a;padding:12px;background:#1a2928}.small{font-size:11px;color:#a9c0b0}.process{display:flex;justify-content:center;align-items:center;gap:10px;min-height:54px;background:#12201f;border-radius:10px;margin:9px 0;font-size:23px}button{border:1px solid #688677;background:#2d4039;color:#e6e8d9;padding:7px 10px;border-radius:8px;font-size:11px}</style><div class="app"><div class="world" id="world"><canvas id="cv"></canvas><div class="top"><span>BREADSPACE / HUMAN ECOLOGY</span><span id="clock">00:00</span></div></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="small" id="type">TERMINAL</div><strong id="name">🏛️ HAPPY RELEASE</strong></div><button id="pause">Ⅱ PAUSE</button></div><div class="process" id="process"></div><div class="small" id="desc"></div><div class="small" id="stats" style="margin-top:8px"></div><div class="small" style="margin-top:8px"><a href="map.html" style="color:#a9c0b0">← MATERIAL FLOW MAP</a></div></div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),world=document.getElementById('world'),$=s=>document.getElementById(s);
let seed=741;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const roles=[['👨‍🌾','FARMER'],['👩‍🍳','CHEF'],['👨‍🏭','MAKER'],['👩‍🔧','MECHANIC'],['👩‍🔬','SCIENTIST'],['👨‍⚕️','MEDIC'],['👨‍🚒','FIREFIGHTER'],['👩‍✈️','PILOT'],['👨‍⚖️','JUDGE'],['👩‍💼','CLERK'],['👩‍🚀','ASTRONAUT'],['👮','OFFICER'],['💂','GUARD'],['🕵️','DETECTIVE'],['👷','BUILDER']];
const tools=['🌾','🚜','💧','🥣','🔥','🍞','⚙️','🔧','🧪','🔬','🩺','💊','🧯','🚁','⚖️','📋','🚀','🔍','🛡️','🧱','🥛','🧀','🥚','🔩','🔨','🪚','📡','🔋','🛢️','🧲','🥩','🫓'];
const nodes=[];function add(e,name,x,y,kind){let n={id:nodes.length,e,name,x,y,kind,visits:0,flash:0};nodes.push(n);return n}
const release=add('🏛️','HAPPY RELEASE',.77,.71,'release'),processor=add('🏭','BURGER WORKS',.90,.84,'processor'),nursery=add('🏥','RECONSTITUTION',.16,.83,'nursery'),stations=[];
for(let i=0;i<tools.length;i++){let x=.09+rand()*.82,y=.13+rand()*.72;if(Math.hypot((x-.77)*1.2,y-.71)<.14){x-=.16;y-=.16}stations.push(add(tools[i],['GROW','CUT','HEAT','MIX','ASSEMBLE','MEASURE','REPAIR','INSPECT'][i%8]+' / '+tools[i],Math.max(.06,Math.min(.94,x)),Math.max(.1,Math.min(.92,y)),'tool'))}
const links=[];for(let a of stations){let sorted=stations.filter(n=>n!==a).sort((u,v)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(a.x-v.x,a.y-v.y));for(let j=0;j<2;j++){let b=sorted[j];if(!links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a)))links.push({a,b})}}
let workers=[],released=0,burgers=0,reborn=0,tasks=0,elapsed=0,paused=false,selected=release,disturb=null;
function makeWorker(role,x,y){let n=stations[Math.floor(rand()*stations.length)];return{role,e:roles[role][0],x,y,from:{x,y},to:n,t:0,duration:1+rand()*2,phase:'move',jobs:0,needed:3+Math.floor(rand()*5),orbit:rand()*6.28,wait:0}}
for(let i=0;i<65;i++)workers.push(makeWorker(i%roles.length,nursery.x+(rand()-.5)*.06,nursery.y+(rand()-.5)*.06));
function go(w,n){w.from={x:w.x,y:w.y};w.to=n;w.t=0;w.duration=.9+Math.hypot(n.x-w.x,n.y-w.y)*4;w.phase='move'}
function nextStation(w){let options=stations.filter(n=>n!==w.to).sort((a,b)=>Math.hypot(a.x-w.x,a.y-w.y)-Math.hypot(b.x-w.x,b.y-w.y));return options[Math.floor(rand()*Math.min(9,options.length))]}
function update(dt){elapsed+=dt;for(let w of workers){w.t+=dt;if(w.phase==='move'){let p=Math.min(1,w.t/w.duration),s=p*p*(3-2*p);w.x=w.from.x+(w.to.x-w.from.x)*s;w.y=w.from.y+(w.to.y-w.from.y)*s;if(p>=1){w.phase='work';w.t=0;w.wait=.5+rand()*1.9;w.to.visits++;w.to.flash=1}}else if(w.phase==='work'){let n=w.to;w.orbit+=dt*2.3;w.x=n.x+Math.cos(w.orbit)*.021;w.y=n.y+Math.sin(w.orbit)*.028;if(w.t>w.wait){if(n===release){released++;go(w,processor)}else if(n===processor){burgers++;w.e='🍔';go(w,nursery)}else if(n===nursery){reborn++;w.role=Math.floor(rand()*roles.length);w.e=roles[w.role][0];w.jobs=0;w.needed=3+Math.floor(rand()*5);go(w,nextStation(w))}else{tasks++;w.jobs++;go(w,w.jobs>=w.needed?release:nextStation(w))}}}}for(let n of nodes)n.flash=Math.max(0,n.flash-dt*1.7);if(disturb){disturb.life-=dt;if(disturb.life<=0)disturb=null}}
function emoji(e,x,y,size){ctx.font=size+'px "Noto Color Emoji","Apple Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e,x,y)}
function draw(){const w=world.clientWidth,h=world.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=w*dpr;cv.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.lineWidth=1;for(let l of links){ctx.beginPath();ctx.moveTo(l.a.x*w,l.a.y*h);ctx.lineTo(l.b.x*w,l.b.y*h);ctx.strokeStyle='#526a5860';ctx.stroke()}for(let n of stations){let x=n.x*w,y=n.y*h;ctx.beginPath();ctx.arc(x,y,14+n.flash*5,0,Math.PI*2);ctx.fillStyle='#2b4035';ctx.fill();ctx.strokeStyle=n===selected?'#f4d28b':'#708f76';ctx.lineWidth=n===selected?2.5:1;ctx.stroke();emoji(n.e,x,y,17)}for(let n of [release,processor,nursery]){let x=n.x*w,y=n.y*h;ctx.beginPath();ctx.arc(x,y,25+n.flash*5,0,Math.PI*2);ctx.fillStyle='#485040';ctx.fill();ctx.strokeStyle=n===selected?'#f7d991':'#bca774';ctx.lineWidth=n===selected?3:1.8;ctx.stroke();emoji(n.e,x,y,24);ctx.fillStyle='#e3d5a5';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(n.name,x,y+39)}for(let worker of workers)emoji(worker.e,worker.x*w,worker.y*h,13);if(disturb){ctx.beginPath();ctx.arc(disturb.x*w,disturb.y*h,(1-disturb.life)*65,0,Math.PI*2);ctx.strokeStyle='#e4d18c88';ctx.lineWidth=2;ctx.stroke()}}
function select(n){selected=n;$('type').textContent=n.kind.toUpperCase();$('name').textContent=n.e+' '+n.name;$('process').textContent=n===release?'👩‍🔬 → 🏛️ → 👩‍🔬':n===processor?'👷 → 🏭 → 🍔':n===nursery?'🍔 → 🏥 → 👨‍🌾':'👨‍🔧 + '+n.e+' → ✓';$('desc').textContent=n===release?'Workers gather after completing their rounds. The release is ceremonial; the burger works await.':n===processor?'A completed worker becomes one burger.':n===nursery?'A burger becomes a newly assigned human.':'Workers visit this tool or product node as part of their profession’s task rounds.'}
world.addEventListener('pointerup',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;let best=null,d=Infinity;for(let n of nodes){let q=Math.hypot((n.x-x)*r.width,(n.y-y)*r.height);if(q<d){d=q;best=n}}if(d<32)select(best);else{disturb={x,y,life:1};for(let w of workers)if(Math.hypot(w.x-x,w.y-y)<.18&&w.phase==='work')go(w,nextStation(w))}});
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE'};
let last=0;function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused)update(dt);draw();$('clock').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');$('stats').textContent='HUMANS '+workers.filter(w=>w.e!=='🍔').length+' · TASKS '+tasks+' · RELEASES '+released+' · 🍔 '+burgers+' · REBORN '+reborn;requestAnimationFrame(frame)}select(release);requestAnimationFrame(frame);
</script></html>
