<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BREADSPACE · Edible Network</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10171b;color:#e2eee5;font-family:ui-monospace,monospace}.app{height:100dvh;display:flex;flex-direction:column}.map{flex:1;min-height:300px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#223b3a,#10191e 80%)}svg{width:100%;height:100%;display:block}.edge{fill:none;stroke:#668d80;stroke-width:1.5;opacity:.55}.node{cursor:pointer}.node circle{fill:#223b3d;stroke:#7c9b89;stroke-width:1.5}.node.selected circle{stroke:#f3d18c;stroke-width:3;fill:#39463c}.node text{font-size:23px;text-anchor:middle;dominant-baseline:central;pointer-events:none}.node .name{font-size:9px;fill:#b5c9bc}.flow-dot{font-size:15px;pointer-events:none;text-anchor:middle;dominant-baseline:central}.detail{background:#1c292e;border-top:1px solid #536b63;padding:13px;min-height:155px}.machine{min-height:78px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;background:#142024;border-radius:12px;margin-top:10px}.part{font-size:27px}.running{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.16)}}.status{font-size:10px;color:#a7c1b4;letter-spacing:.12em}.header{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:18px;font-weight:bold}.small{font-size:12px;color:#a9c2b6;margin-top:8px}a{color:#a9d6c0}</style>
<div class="app"><div class="map"><svg viewBox="0 0 390 480" preserveAspectRatio="xMidYMid meet"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#668d80"/></marker></defs><g id="lines"></g><g id="particles"></g><g id="nodes"></g><text x="13" y="20" fill="#a3c0b0" font-size="10" letter-spacing="2">BREADSPACE / MATERIAL FLOW</text><text x="13" y="35" fill="#a3c0b0" font-size="9"><a href="index.html">← BAKERY</a> · TAP A NODE TO INSPECT</text><text x="13" y="470" fill="#7c9b8e" font-size="9">SCHEMATIC FLOW · SIMPLIFIED RECIPES</text></svg></div><div class="detail"><div class="header"><div><div class="status" id="type">PROCESSING CENTER</div><div class="title" id="title">🪨 MILL</div></div><div class="small" id="rate">ACTIVE</div></div><div class="machine" id="machine"></div><div class="small" id="description"></div></div></div>
<script>
const ns='http://www.w3.org/2000/svg',nodes=[
{id:'sun',x:40,y:78,emoji:'☀️',name:'SUN',type:'SOURCE',inputs:[],outputs:['🌾'],desc:'Sunlight supports growing wheat.'},
{id:'water',x:40,y:196,emoji:'💧',name:'WATER',type:'SOURCE',inputs:[],outputs:['💧'],desc:'Water is distributed to crops and mixing centers.'},
{id:'field',x:128,y:88,emoji:'🌾',name:'FIELD',type:'GROWTH',inputs:['☀️','💧'],outputs:['🌾'],desc:'Light and water grow wheat.'},
{id:'mill',x:223,y:88,emoji:'🪨',name:'MILL',type:'PROCESSING CENTER',inputs:['🌾'],outputs:['🥣'],desc:'Millstones grind wheat into flour.'},
{id:'mixer',x:321,y:88,emoji:'🥣',name:'MIXER',type:'PROCESSING CENTER',inputs:['🥣','💧','🦠'],outputs:['🫓'],desc:'Flour, water, and yeast become dough.'},
{id:'yeast',x:321,y:194,emoji:'🦠',name:'YEAST',type:'SOURCE',inputs:[],outputs:['🦠'],desc:'A supply of fermentation culture.'},
{id:'oven',x:321,y:302,emoji:'🔥',name:'OVEN',type:'PROCESSING CENTER',inputs:['🫓'],outputs:['🍞'],desc:'Heat bakes dough into bread.'},
{id:'cow',x:122,y:200,emoji:'🐄',name:'DAIRY',type:'HARVESTING',inputs:['🌾'],outputs:['🥛','🥩'],desc:'Feed supports milk production. Meat is a separate harvesting branch.'},
{id:'cheese',x:220,y:202,emoji:'🧀',name:'DAIRY WORKS',type:'PROCESSING CENTER',inputs:['🥛','🦠'],outputs:['🧀'],desc:'Milk and cultures produce cheese.'},
{id:'chicken',x:122,y:307,emoji:'🐔',name:'COOP',type:'HARVESTING',inputs:['🌾'],outputs:['🥚'],desc:'Fed chickens produce eggs.'},
{id:'meat',x:221,y:307,emoji:'🍖',name:'GRILL',type:'PROCESSING CENTER',inputs:['🥩'],outputs:['🍖'],desc:'Meat is cooked.'},
{id:'burger',x:321,y:411,emoji:'🍔',name:'ASSEMBLY',type:'ASSEMBLY',inputs:['🍞','🍖','🧀'],outputs:['🍔'],desc:'Bread, cooked meat, and cheese assemble into a burger. Vegetables are omitted from this small schematic.'},
{id:'cake',x:122,y:411,emoji:'🎂',name:'CAKE',type:'ASSEMBLY',inputs:['🥚','🥣','🧈','🍬'],outputs:['🎂'],desc:'The promised cake requires eggs, flour, butter, and sugar. Butter and sugar are not yet supplied on this schematic.'}
],edges=[['sun','field','☀️'],['water','field','💧'],['field','mill','🌾'],['mill','mixer','🥣'],['water','mixer','💧'],['yeast','mixer','🦠'],['mixer','oven','🫓'],['field','cow','🌾'],['field','chicken','🌾'],['cow','cheese','🥛'],['yeast','cheese','🦠'],['cow','meat','🥩'],['oven','burger','🍞'],['cheese','burger','🧀'],['meat','burger','🍖'],['chicken','cake','🥚'],['mill','cake','🥣']];
const lookup=Object.fromEntries(nodes.map(n=>[n.id,n])),$=id=>document.getElementById(id);
function svg(tag,attrs,parent){let e=document.createElementNS(ns,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e}
const paths=edges.map(([a,b,emoji],i)=>{let A=lookup[a],B=lookup[b],dx=B.x-A.x,dy=B.y-A.y;let d=Math.abs(dx)<50?`M${A.x} ${A.y} C${A.x+26} ${A.y+dy*.35},${B.x-26} ${B.y-dy*.35},${B.x} ${B.y}`:`M${A.x} ${A.y} C${A.x+dx*.48} ${A.y},${B.x-dx*.48} ${B.y},${B.x} ${B.y}`;let path=svg('path',{d,class:'edge','marker-end':'url(#arrow)'},$('lines'));let p=svg('text',{class:'flow-dot'},$('particles'));p.textContent=emoji;return{path,p,offset:(i*.17)%1,len:path.getTotalLength()}});
nodes.forEach(n=>{let g=svg('g',{class:'node','data-id':n.id},$('nodes'));svg('circle',{cx:n.x,cy:n.y,r:25},g);let t=svg('text',{x:n.x,y:n.y-2},g);t.textContent=n.emoji;let label=svg('text',{x:n.x,y:n.y+37,class:'name'},g);label.textContent=n.name;g.onclick=()=>select(n.id)});
function select(id){let n=lookup[id];document.querySelectorAll('.node').forEach(g=>g.classList.toggle('selected',g.dataset.id===id));$('type').textContent=n.type;$('title').textContent=n.emoji+' '+n.name;$('rate').textContent=n.inputs.length+' IN / '+n.outputs.length+' OUT';$('description').textContent=n.desc;$('machine').replaceChildren();function part(s,cl='part'){let e=document.createElement('span');e.className=cl;e.textContent=s;$('machine').append(e)}if(n.inputs.length)n.inputs.forEach(x=>part(x));else part('∞');part('→');part(n.emoji,'part running');part('→');n.outputs.forEach(x=>part(x))}
function frame(t){for(let e of paths){let pos=e.path.getPointAtLength(((t*.000075+e.offset)%1)*e.len);e.p.setAttribute('x',pos.x);e.p.setAttribute('y',pos.y)}requestAnimationFrame(frame)}select('mill');requestAnimationFrame(frame);
</script></html>
