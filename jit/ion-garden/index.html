<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10191c"><title>Ion Garden · Charge Balancer</title>
<style>
:root{color-scheme:dark;--bg:#0b1318;--line:#304753;--ink:#f3f5ee;--muted:#b0c2c6;--a:#89d9d0;--b:#ffc58d;--good:#b0efbf;--bad:#ffb6ac}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(circle at 20% -15%,#214c51,transparent 52%),var(--bg);color:var(--ink);font:14px/1.25 system-ui,-apple-system,sans-serif}
main{height:100vh;height:100dvh;max-width:1050px;margin:auto;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:35px}h1{font:clamp(25px,5vw,38px)/1 Georgia,serif;margin:0;white-space:nowrap}h2{font:600 14px/1.2 system-ui;margin:0 0 7px}.ey{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--a);font-weight:800}.subtitle{color:var(--muted);font-size:12px;text-align:right;margin:0}
.board{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0}
.card{background:linear-gradient(150deg,#1a2b32,#111c23);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:0}
.row{display:flex;gap:6px;flex-wrap:nowrap}button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #3b5661;background:#213640;color:var(--ink);padding:6px 8px;min-height:40px;touch-action:manipulation}button:focus-visible{outline:3px solid var(--a);outline-offset:1px}button.active{background:#d3f0df;color:#132325;border-color:#d3f0df;font-weight:800}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ion{flex:1;min-width:0;text-align:center;padding:6px 3px}.ion strong{font-size:20px}.ion small{display:block;font-size:10px;opacity:.8}.ion.negative.active{background:#ffe2c0}
.lab{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:5px}.lab h2{margin:0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.counter{border:1px solid var(--line);border-radius:10px;padding:5px;text-align:center}.counter label{display:block;color:var(--muted);font-size:11px}.counter .step{display:flex;justify-content:center;align-items:center;gap:9px}.counter output{font-size:23px;min-width:24px;font-variant-numeric:tabular-nums}.counter button{min-width:42px;min-height:40px;padding:4px}
.visual{display:flex;flex-direction:column;justify-content:center;min-height:0;gap:2px}.atoms{display:flex;justify-content:center;align-items:center;gap:14px;min-height:24px}.atomgroup{display:flex;gap:3px;justify-content:center;align-items:center}.atom{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800}.atom.pos{background:var(--a);color:#11242a}.atom.neg{background:var(--b);color:#3b281b}.atom-more{font-size:11px;color:var(--muted)}
.balance{text-align:center;font-weight:750;font-size:12px;min-height:17px}.ok{color:var(--good)}.warn{color:var(--bad)}.formula{font:clamp(30px,7vw,48px)/1.1 Georgia,serif;text-align:center;color:white}.formula sub{font-size:.5em;vertical-align:-.3em}.trial{text-align:center;color:var(--muted);font-size:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.primary{background:#a8e8d7;color:#132729;font-weight:850;border-color:#a8e8d7}.feedback{min-height:30px;display:grid;place-items:center;text-align:center;font-size:12px}.hint{background:#23363c;border-left:3px solid var(--b);padding:7px;border-radius:7px;font-size:12px}.hidden{display:none}
.progress-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px}.progress-card h2{grid-column:1/-1;margin:0}.progress{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.progress button{min-height:38px;padding:4px 2px;font-size:11px}.progress-actions{display:flex;gap:5px}.progress-actions button{min-height:38px;padding:5px 8px;font-size:11px}.footnote{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}a{color:var(--a)}
@media(min-width:740px){main{gap:12px;padding:14px}.board{grid-template-columns:1fr 1.2fr;grid-template-rows:minmax(0,1fr) auto}.choose{grid-column:1;grid-row:1}.lab{grid-column:2;grid-row:1/3;padding:16px}.progress-card{grid-column:1;grid-row:2}.pick{grid-template-columns:1fr;gap:18px}.ion{min-height:62px}.visual{gap:10px}.atom{width:34px;height:34px}.formula{font-size:52px}}
@media(max-height:720px){main{gap:5px;padding-top:5px;padding-bottom:5px}header{min-height:30px}h1{font-size:26px}.card{padding:7px}.board{gap:5px}h2{font-size:12px;margin-bottom:4px}.ion{padding:4px 2px;min-height:35px}.ion strong{font-size:17px}.ion small{font-size:9px}.counter{padding:3px}.counter button{min-height:35px}.counter output{font-size:19px}.atom{width:23px;height:23px}.formula{font-size:31px}.progress button,.progress-actions button{min-height:32px}.feedback{min-height:23px}.actions button{min-height:36px}.subtitle{font-size:10px}}
@media(max-height:570px){.subtitle,.footnote,.atoms,.trial{display:none}.lab{grid-template-rows:auto auto minmax(0,1fr) auto auto}.progress-card h2{display:none}.balance{font-size:11px}.formula{font-size:27px}}
</style></head><body><main>
<header><h1>Ion Garden ⚗</h1><p class="subtitle">Balance the charges · find all four</p></header>
<div class="board">
<section class="card choose"><h2>1 · Choose ions</h2><div class="pick"><div><div class="ey">Positive · cation</div><div class="row" id="cations"></div></div><div><div class="ey">Negative · anion</div><div class="row" id="anions"></div></div></div></section>
<section class="card lab"><h2>2 · Make the total charge zero</h2>
<div class="controls"><div class="counter"><label id="posLabel">Positive ions</label><div class="step"><button type="button" id="pminus" aria-label="Remove one positive ion">−</button><output id="pc">1</output><button type="button" id="pplus" aria-label="Add one positive ion">+</button></div></div><div class="counter"><label id="negLabel">Negative ions</label><div class="step"><button type="button" id="nminus" aria-label="Remove one negative ion">−</button><output id="nc">1</output><button type="button" id="nplus" aria-label="Add one negative ion">+</button></div></div></div>
<div class="visual"><div class="atoms" id="atoms" aria-label="Ions in the formula unit"></div><div class="balance" id="balance" aria-live="polite"></div><div class="trial">Your trial formula</div><div class="formula" id="formula" aria-label="Current trial formula"></div></div>
<div class="actions"><button class="primary" id="check">Check formula ✓</button><button id="hint">Hint ?</button></div>
<div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="hint hidden" id="hintText"></div></div>
</section>
<section class="card progress-card"><h2>3 · Discover four simplest ratios</h2><div id="progress" class="progress" aria-live="polite"></div><div class="progress-actions"><button id="next" aria-label="Try an unfinished pair">Next →</button><button id="reset" aria-label="Reset progress">↻</button></div></section>
</div>
<div class="footnote" title="Charge balance predicts the simplest ion ratio, not whether a compound is stable or isolable.">Charge neutrality predicts a ratio, not chemical stability. · <a href="../chem001/">CHE 001</a></div>
</main><script>
'use strict';
const positive=[{s:'Mg',q:2,name:'magnesium'},{s:'V',q:5,name:'vanadium(V)'}],negative=[{s:'Br',q:-1,name:'bromide'},{s:'S',q:-2,name:'sulfide'}];
let pi=0,ni=0,p=1,n=1,hints=0;const solved=new Set();const $=id=>document.getElementById(id);const gcd=(a,b)=>b?gcd(b,a%b):a;
function key(){return pi+':'+ni}function minimalRatio(a,b){const g=gcd(a,b);return [b/g,a/g]}function target(){return minimalRatio(positive[pi].q,-negative[ni].q)}
function renderChoices(){for(const [id,arr,selected,fn] of [['cations',positive,pi,choosePos],['anions',negative,ni,chooseNeg]]){$(id).replaceChildren();arr.forEach((ion,i)=>{const b=document.createElement('button');b.type='button';b.className='ion '+(id==='anions'?'negative ':'')+(i===selected?'active':'');b.setAttribute('aria-pressed',String(i===selected));b.innerHTML='<strong>'+ion.s+'<sup>'+(ion.q>0?ion.q+'+':(-ion.q)+'−')+'</sup></strong><small>'+ion.name+'</small>';b.onclick=()=>fn(i);$(id).append(b)})}}
function choosePos(i){pi=i;fresh()}function chooseNeg(i){ni=i;fresh()}function fresh(){p=1;n=1;hints=0;$('hintText').classList.add('hidden');$('feedback').textContent='';render()}
function sub(k){return k===1?'':'<sub>'+k+'</sub>'}function render(){renderChoices();const a=positive[pi],b=negative[ni],net=p*a.q+n*b.q;$('pc').textContent=p;$('nc').textContent=n;$('posLabel').textContent=a.s+' ('+a.q+'+)';$('negLabel').textContent=b.s+' ('+(-b.q)+'−)';$('formula').innerHTML=a.s+sub(p)+b.s+sub(n);$('formula').setAttribute('aria-label',a.s+' '+p+', '+b.s+' '+n);$('atoms').replaceChildren();for(const [ion,count,cls] of [[a,p,'pos'],[b,n,'neg']]){const group=document.createElement('div');group.className='atomgroup';for(let i=0;i<Math.min(count,4);i++){const dot=document.createElement('div');dot.className='atom '+cls;dot.textContent=ion.s;group.append(dot)}if(count>4){const more=document.createElement('span');more.className='atom-more';more.textContent='+'+(count-4);group.append(more)}$('atoms').append(group)}$('balance').className='balance '+(net===0?'ok':'warn');$('balance').textContent='('+p+' × +'+a.q+') + ('+n+' × '+b.q+') = '+(net>0?'+':'')+net+(net===0?'  ✓ Balanced':'  · Not balanced yet');$('progress').replaceChildren();for(let i=0;i<2;i++)for(let j=0;j<2;j++){const item=document.createElement('button');item.type='button';const done=solved.has(i+':'+j);item.textContent=(done?'✓ ':'○ ')+positive[i].s+' + '+negative[j].s;item.className=done?'active':'';item.onclick=()=>{pi=i;ni=j;fresh()};$('progress').append(item)}}
function change(which,delta){if(which==='p')p=Math.min(10,Math.max(1,p+delta));else n=Math.min(10,Math.max(1,n+delta));$('feedback').textContent='';render()}
$('pminus').onclick=()=>change('p',-1);$('pplus').onclick=()=>change('p',1);$('nminus').onclick=()=>change('n',-1);$('nplus').onclick=()=>change('n',1);
$('check').onclick=()=>{const [tp,tn]=target();const net=p*positive[pi].q+n*negative[ni].q;if(p===tp&&n===tn){solved.add(key());$('feedback').innerHTML='<span class="ok">Beautiful! Charges cancel and the ratio is simplest. '+solved.size+' of 4 discovered.</span>'}else if(net===0){$('feedback').innerHTML='<span class="warn">You balanced the charge! But can you divide both counts by the same number to make the smallest ratio?</span>'}else{$('feedback').innerHTML='<span class="warn">Not quite. '+(net>0?'Too much positive charge.':'Too much negative charge.')+' Adjust the counts until the sum is zero.</span>'}render()};
$('hint').onclick=()=>{hints++;const a=positive[pi].q,b=-negative[ni].q,[tp,tn]=target();$('hintText').classList.remove('hidden');$('hintText').textContent=hints===1?'Each '+positive[pi].s+' contributes +'+a+'. Each '+negative[ni].s+' contributes −'+b+'. How many would cancel?':hints===2?'Look for the smallest shared total charge that both '+a+' and '+b+' divide into.':'Try '+tp+' positive ion'+(tp===1?'':'s')+' and '+tn+' negative ion'+(tn===1?'':'s')+'. Then check!'};
$('next').onclick=()=>{let found=false;for(let i=0;i<2&&!found;i++)for(let j=0;j<2&&!found;j++)if(!solved.has(i+':'+j)){pi=i;ni=j;found=true}if(!found){$('feedback').textContent='You found all four! Try making one without looking at the hints.';return}fresh()};
$('reset').onclick=()=>{solved.clear();pi=0;ni=0;fresh()};render();
function regression(){const expected=['MgBr2','MgS','VBr5','V2S5'];let index=0;for(const a of positive)for(const b of negative){const [x,y]=minimalRatio(a.q,-b.q);const formula=a.s+(x===1?'':x)+b.s+(y===1?'':y);if(formula!==expected[index++])throw Error('Formula mismatch: '+formula);if(x*a.q+y*b.q!==0||gcd(x,y)!==1)throw Error('Charge/minimality mismatch: '+formula);for(let m=1;m<=10;m++)for(let n=1;n<=10;n++){const balanced=m*a.q+n*b.q===0;if(balanced!==(m*y===n*x))throw Error('Neutrality ratio mismatch: '+formula)}}if(index!==4)throw Error('Pair count mismatch');return true}
window.ionGardenRegression=regression;regression();
</script></body></html>
