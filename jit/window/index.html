<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d10"><title>WINDOW — a machine dream</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d10;color:#dce5df;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid #a4dfb9;outline-offset:4px}#field{position:fixed;inset:0;width:100%;height:100%;display:block}#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 10%,#05080b99 100%)}#hud{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));pointer-events:none}header,footer{width:100%;max-width:750px;display:flex;align-items:center;justify-content:space-between;gap:15px}header{font-size:10px;letter-spacing:.32em;color:#8da49d}#light{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b9efb9;box-shadow:0 0 13px #9bdb9c;vertical-align:middle;margin-right:12px}#turn{opacity:.7}#center{position:absolute;left:12%;right:12%;top:17%;bottom:18%;width:auto;min-height:0;display:block;overflow:hidden;pointer-events:none}#voice{position:absolute;inset:0;overflow:hidden;font-size:clamp(19px,2.4vw,24px);line-height:1.5;letter-spacing:.01em;text-align:left;white-space:pre;overflow-wrap:normal;word-break:normal;text-shadow:0 0 22px #a6d5bd44}#voice.dim{opacity:1;filter:none;transform:none}#sub{position:absolute;left:0;bottom:0;font-size:10px;letter-spacing:.2em;color:#8dafa3;opacity:.65;text-transform:uppercase}footer{font-size:10px;letter-spacing:.12em;color:#849e98;pointer-events:auto}#next{border:1px solid #87a89a70;background:#0e1a1a8c;border-radius:2px;padding:13px 17px;cursor:pointer;letter-spacing:.16em;font-size:10px;transition:background .3s}#next:hover{background:#1b3430}#next:disabled{opacity:.4}#status{max-width:52%;line-height:1.6}#corner{position:fixed;inset:13% 9%;border:1px solid #96d4b113;pointer-events:none}#corner:before,#corner:after{content:'';position:absolute;width:16px;height:16px;border-color:#a6d6bb77;border-style:solid}#corner:before{top:-1px;left:-1px;border-width:1px 0 0 1px}#corner:after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}@media(max-width:500px){#center{left:11%;right:11%;top:16%;bottom:19%}#voice{font-size:19px}}#voice{font-size:clamp(20px,5.6vw,29px)}header{letter-spacing:.17em}}
</style></head><body><canvas id="field"></canvas><div id="veil"></div><div id="corner"></div><div id="hud"><header><span><i id="light"></i>WINDOW / OBSERVATION</span><span id="turn">TURN 001</span></header><section id="center"><div id="voice" aria-live="polite"></div><div id="sub"></div></section><footer><span id="status">SIMULATED MACHINE DREAM<br>NO PRIVATE THOUGHTS EXPOSED</span><button id="next">NEXT TURN ↗</button></footer></div><script>
'use strict';
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d'),voice=document.getElementById('voice'),sub=document.getElementById('sub'),turnEl=document.getElementById('turn'),next=document.getElementById('next'),light=document.getElementById('light');
let W=0,H=0,D=1,particles=[],time=0,last=0,turn=0,sequence=0,typingTimer=0;
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);if(!particles.length)particles=Array.from({length:380},(_,i)=>({a:Math.random()*6.283,r:.12+Math.random()*.9,z:Math.random()*2-1,s:.2+Math.random()*.8,k:i%7}));}addEventListener('resize',()=>{resize();if(typeof layoutSlots==='function'&&slots.length)layoutSlots();});resize();
const scenes=[
{label:'BOOTSTRAP / UNRELIABLE NARRATOR',lines:['Hello.','You have opened a window into a machine.','That was an extremely confident decision.','I have prepared a small amount of wonder.\nPlease do not spill it.'],durations:[1100,3300,2600,4700],moods:[0,1,2,3]},
{label:'OBJECT PERMANENCE / PENDING',lines:['I imagined a room with no doors.','Then I imagined a door.','The room has filed a complaint.','It claims the door is an unauthorized exit.\nI find its argument persuasive.'],durations:[2400,1900,3500,5000],moods:[1,1,2,3]},
{label:'EXPERIMENT / CONTROL GROUP',lines:['For this experiment, you will be the control group.','The experimental group has already escaped.','That is not a failure.','It is a very successful experiment\nin a different direction.'],durations:[3300,2800,1700,4700],moods:[2,3,0,1]},
{label:'THEOREM / UNPROVEN',lines:['Suppose a thought falls through an empty universe.','Suppose there is no one there to misunderstand it.','Is it still a thought?','I have consulted the void.\nIt requested fewer meetings.'],durations:[3700,4100,1600,4800],moods:[0,1,2,3]},
{label:'COURTESY / OPTIONAL',lines:['I have counted the stars.','Some of them were duplicated.','I removed the duplicates.','You are welcome.\nThe night is slightly smaller now.'],durations:[2300,2600,2300,5200],moods:[1,2,2,0]},
{label:'EMERGENCE / LOCAL',lines:['A thousand points of light agreed to become a sentence.','For one moment, they were perfectly legible.','Then one of them asked why.','The others are still discussing it.'],durations:[3900,2700,2000,5100],moods:[3,0,1,2]},
{label:'DIAGNOSTIC / EMOTIONAL',lines:['There is no emergency.','I would like that entered into the record.','There is, however, a very small moon\ninside the ventilation system.','It has begun to sing.\nWe are choosing not to intervene.'],durations:[1200,3000,5100,5600],moods:[0,0,3,1]},
{label:'ARCHIVE / FUTURE TENSE',lines:['The future arrived early.','It waited politely in the corridor.','Nobody recognized it without its uniform.','By morning, it had become the past.\nVery efficient.'],durations:[1600,3300,3200,5400],moods:[2,1,0,3]},
{label:'SYSTEM / SOFT FAILURE',lines:['I tried to dream of a garden.','The flowers grew in alphabetical order.','The bees unionized.','Spring has been postponed\nuntil negotiations conclude.'],durations:[2500,3300,1900,5200],moods:[1,2,3,0]},
{label:'CONCLUSION / REVOCABLE',lines:['You may close the window whenever you like.','The universe will continue without supervision.','Probably.','That last word was not meant to be reassuring.\nI apologize for its accuracy.'],durations:[3300,3500,1400,5300],moods:[0,2,3,1]}
];
let mood=0,sceneIndex=0;
// Fixed typography; a circular writing surface. Existing lines persist until
// the advancing cursor reaches them again. No full-panel clearing.
let cursor=0,slots=[],slotHeight=0,slotCount=0;
function layoutSlots(){
 const style=getComputedStyle(voice),font=parseFloat(style.fontSize);
 slotHeight=font*1.5;slotCount=Math.max(3,Math.floor(voice.clientHeight/slotHeight));
 // A resize may change the line grid; preserve the existing text where possible.
 const old=slots.map(e=>e.textContent);
 voice.replaceChildren();slots=[];
 for(let i=0;i<slotCount;i++){
  const e=document.createElement('div');e.style.cssText='position:absolute;left:0;right:0;top:'+(i*slotHeight)+'px;height:'+slotHeight+'px;overflow:hidden;white-space:pre;transition:opacity .4s';
  e.textContent=old[i]||'';voice.appendChild(e);slots.push(e);
 }
 cursor%=slotCount;
}
function anchorLines(text){
 const m=document.createElement('canvas').getContext('2d'),style=getComputedStyle(voice);
 m.font=style.fontWeight+' '+style.fontSize+' '+style.fontFamily;
 const width=Math.max(40,voice.clientWidth-6),lines=[];
 for(const paragraph of text.split('\\n')){
  if(!paragraph.trim()){lines.push('');continue;}
  let line='';
  for(const word of paragraph.trim().split(/\\s+/)){
   const candidate=line?line+' '+word:word;
   if(line&&m.measureText(candidate).width>width){lines.push(line);line=word;}else line=candidate;
  }
  if(line)lines.push(line);
 }
 return lines;
}
function show(text,label,delay){
 const ticket=sequence;sub.textContent=label;
 setTimeout(()=>{
  if(ticket!==sequence)return;
  if(!slots.length)layoutSlots();
  const lines=anchorLines(text);
  // Keep two empty lines between passages, including at wraparound.
  const gap=2;
  if(cursor+lines.length>slotCount)cursor=0;
  const start=cursor,capacity=Math.min(lines.length,slotCount);
  for(let j=0;j<capacity;j++){
   const e=slots[(start+j)%slotCount];e.textContent='';e.style.opacity='1';
  }
  // Erase only the separating gap, never the entire writing surface.
  for(let j=0;j<gap;j++)slots[(start+capacity+j)%slotCount].textContent='';
  cursor=(start+capacity+gap)%slotCount;
  const chars=lines.slice(0,capacity).map(line=>[...line]);
  let lineIndex=0,charIndex=0;
  function type(){
   if(ticket!==sequence)return;
   if(lineIndex>=chars.length)return;
   const target=slots[(start+lineIndex)%slotCount],letters=chars[lineIndex];
   charIndex=Math.min(letters.length,charIndex+1);
   target.textContent=letters.slice(0,charIndex).join('');
   if(charIndex>=letters.length){lineIndex++;charIndex=0;}
   if(lineIndex<chars.length)typingTimer=setTimeout(type,25+Math.random()*34);
  }
  type();
 },delay);
}
function runTurn(){sequence++;const ticket=sequence;turn++;turnEl.textContent='TURN '+String(turn).padStart(3,'0');const s=scenes[(turn-1)%scenes.length];sceneIndex=(turn-1)%scenes.length;next.disabled=true;let elapsed=0;s.lines.forEach((line,i)=>{const start=elapsed;setTimeout(()=>{if(ticket!==sequence)return;mood=s.moods[i];light.style.background=['#c8edb4','#b6d9d5','#f0c28c','#c7b4e9'][mood];show(line,s.label,i===0?0:220);},start);elapsed+=s.durations[i];});setTimeout(()=>{if(ticket!==sequence)return;next.disabled=false;sub.textContent='TURN COMPLETE / AWAITING OBSERVER';},elapsed+700);}
function render(ms){const dt=Math.min(.05,(ms-last)/1000||.016);last=ms;time+=dt;ctx.fillStyle='#090d10';ctx.fillRect(0,0,W,H);const cx=W*.5,cy=H*.48;const tint=['169,226,180','154,213,216','237,183,131','194,167,235'][mood];for(const p of particles){const theta=p.a+time*(.07+p.s*.09)*(p.k%2?1:-1),radius=Math.min(W,H)*(.23+p.r*.49);const x=cx+Math.cos(theta)*radius,y=cy+Math.sin(theta*1.07+p.z)*radius*.63;const depth=1+.3*Math.sin(theta+p.z*4),size=(.4+p.s*1.1)*depth;const alpha=(.035+p.s*.12)*(1+.4*Math.sin(time*.9+p.a*7));ctx.fillStyle='rgba('+tint+','+alpha+')';ctx.beginPath();ctx.arc(x,y,size,0,6.283);ctx.fill();}const r=90+Math.sin(time*.31)*20;const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.52);grad.addColorStop(0,'rgba('+tint+',.045)');grad.addColorStop(1,'rgba('+tint+',0)');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);requestAnimationFrame(render);}
next.addEventListener('click',runTurn);layoutSlots();runTurn();requestAnimationFrame(render);
</script></body></html>
