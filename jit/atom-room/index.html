<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0a1114"><title>ATOM ROOM · Reactor Toy</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#081014;color:#c7e4df;font:12px system-ui}button,input{touch-action:manipulation}button{cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;padding:9px;gap:8px;max-width:980px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font:800 22px/1 'Arial Narrow',system-ui;letter-spacing:.15em;color:#d2e5d8}.tiny{font:10px monospace;color:#86a9a6;letter-spacing:.07em}.lights{display:flex;gap:6px;align-items:center}.lamp{width:9px;height:9px;border-radius:50%;background:#526963;box-shadow:0 0 4px #1a2424}.lamp.on{background:#6dff9c;box-shadow:0 0 12px #6dff9c}.lamp.hot{background:#ff694f;box-shadow:0 0 12px #ff694f}.console{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1.06fr) minmax(0,1fr);gap:8px}.upper{display:grid;grid-template-columns:1.18fr .82fr;gap:8px;min-height:0}.lower{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}.panel{min-height:0;border:1px solid #345451;background:linear-gradient(135deg,#18292b,#0f1c20);border-radius:8px;box-shadow:inset 0 0 0 2px #091416;overflow:hidden;display:flex;flex-direction:column;padding:9px}.label{font:700 10px monospace;letter-spacing:.12em;color:#94b7ae;margin-bottom:6px}.reactor{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.reactor svg{width:100%;height:100%;max-height:350px}.gauges{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;flex:1;min-height:0}.gauge{min-height:0;position:relative;text-align:center;border:1px solid #29423f;border-radius:6px;background:#0c1719;display:flex;flex-direction:column;justify-content:center}.gauge svg{width:100%;height:76%;max-height:135px}.gauge .value{font:700 14px monospace;color:#e4ddad;margin-top:-8px}.gauge .name{font:9px monospace;color:#9fbdb5;letter-spacing:.04em}.control{display:flex;flex-direction:column;gap:8px;justify-content:space-between;flex:1;min-height:0}.slide{display:grid;grid-template-columns:72px 1fr 35px;gap:5px;align-items:center}.slide label{font:10px monospace;color:#a4c9c0}.slide output{font:11px monospace;text-align:right;color:#f2d79c}input[type=range]{width:100%;accent-color:#d1ae69}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.buttons button{padding:9px 2px;border-radius:5px;background:#1f3b3a;border:1px solid #52756c;color:#cce3d5;font:800 11px monospace}.buttons button:active{background:#436b5b}.buttons .scram{background:#662c27;border-color:#cf6c58;color:#ffe4d5}.buttons .on{background:#42664a;border-color:#9dc19b}.diagram{flex:1;min-height:0;position:relative}.diagram svg{width:100%;height:100%}.foot{display:flex;justify-content:space-between;gap:6px;align-items:center;font:9px monospace;color:#9fb9b1}.alarm{color:#ff9d78}.muted{opacity:.7}@media(max-width:530px){.app{padding:6px;gap:5px}.console,.upper,.lower{gap:5px}.panel{padding:6px}.title{font-size:17px}.label{font-size:9px;margin-bottom:2px}.slide{grid-template-columns:53px 1fr 29px;gap:3px}.slide label,.slide output{font-size:9px}.control{gap:4px}.buttons button{font-size:9px;padding:8px 1px}.gauge .value{font-size:12px}.gauge .name{font-size:8px}}@media(max-height:650px){.app{gap:4px}.panel{padding:5px}.control{gap:3px}.buttons button{padding:5px 1px}.label{margin-bottom:2px}.head{height:21px}.title{font-size:16px}}
</style></head><body><div class="app"><div class="head"><div><span class="title">⚛ ATOM ROOM</span> <span class="tiny"> / 741</span></div><div class="lights"><span class="tiny" id="state">STANDBY</span><i class="lamp" id="ready"></i><i class="lamp" id="alarm"></i></div></div><div class="console"><div class="upper"><section class="panel"><div class="label">01 / CORE · ROD BANK</div><div class="reactor"><svg viewBox="0 0 320 290" aria-label="Stylized reactor core and control rods"><defs><radialGradient id="core"><stop stop-color="#b7f1d0" stop-opacity=".6"/><stop offset="1" stop-color="#376f74" stop-opacity=".08"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><ellipse cx="160" cy="150" rx="115" ry="111" fill="url(#core)" id="halo"/><rect x="72" y="42" width="176" height="219" rx="43" fill="#1a3a42" stroke="#668c89" stroke-width="4"/><rect x="87" y="68" width="146" height="174" rx="17" fill="#17353a" stroke="#426a6b"/><g id="fuel"></g><g id="rods"></g><path d="M 72 88 H 30 V 119 H 72 M 248 185 H 291 V 217 H 248" stroke="#74b9b7" stroke-width="9" fill="none"/><g id="bubbles"></g><text x="160" y="279" fill="#a4c7c2" font-size="10" text-anchor="middle" font-family="monospace">FICTIONAL CORE / NOT TO SCALE</text></svg></div></section><section class="panel"><div class="label">02 / INSTRUMENTS</div><div class="gauges" id="gauges"></div></section></div><div class="lower"><section class="panel"><div class="label">03 / CONTROL</div><div class="control"><div class="slide"><label for="rod">RODS ↑</label><input id="rod" type="range" min="0" max="100" value="15"><output id="rodv">15%</output></div><div class="slide"><label for="flow">PUMP</label><input id="flow" type="range" min="0" max="100" value="65"><output id="flowv">65%</output></div><div class="slide"><label for="load">LOAD</label><input id="load" type="range" min="0" max="100" value="30"><output id="loadv">30%</output></div><div class="buttons"><button id="start">▶ START</button><button id="trip" class="scram">■ SCRAM</button><button id="reset">↺ RESET</button></div></div></section><section class="panel"><div class="label">04 / HEAT → STEAM → POWER</div><div class="diagram"><svg viewBox="0 0 320 180" aria-label="Simplified closed loop heat transfer and turbine diagram"><g stroke="#45696a" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M73 65 H132 V31 H178"/><path d="M178 66 H143 V138 H73"/><path d="M203 31 H252 V66"/><path d="M252 102 V140 H203"/></g><g stroke="#a6c1b6" fill="#1e383c" stroke-width="2"><rect x="17" y="65" width="91" height="76" rx="12"/><rect x="173" y="18" width="51" height="70" rx="9"/><rect x="219" y="66" width="65" height="38" rx="8"/></g><text x="62" y="96" text-anchor="middle" fill="#e5d8a8" font-size="11" font-family="monospace">CORE</text><text x="62" y="112" text-anchor="middle" fill="#98c4bd" font-size="9" font-family="monospace">HEAT</text><text x="199" y="45" text-anchor="middle" fill="#e5d8a8" font-size="10" font-family="monospace">HX</text><text x="199" y="59" text-anchor="middle" fill="#98c4bd" font-size="8" font-family="monospace">STEAM</text><text x="251" y="90" text-anchor="middle" fill="#e5d8a8" font-size="10" font-family="monospace">TURBINE</text><g id="spin" transform="translate(251 85)"><path d="M-10 0H10M0-10V10M-7-7L7 7M-7 7L7-7" stroke="#d9bc7d" stroke-width="2"/></g><g id="flowdots" fill="#75d9cb"></g><text x="199" y="158" fill="#a2bdb3" font-size="10" text-anchor="middle" font-family="monospace">GENERATOR</text><text id="watts" x="199" y="174" fill="#ebd89f" font-size="13" text-anchor="middle" font-family="monospace">0 kW</text></svg></div></section></div></div><div class="foot"><span>EDUCATIONAL TOY · GENERIC PHYSICS · NOT A NAVAL MODEL</span><span id="clock">T+0000s</span></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let running=false,tripped=false,power=0,temp=22,steam=0,output=0,seconds=0,phase=0,rod=15,flow=65,load=30;const names=[['POWER','%'],['CORE TEMP','°C'],['STEAM','%'],['OUTPUT','kW']];const gs=$('gauges');gs.innerHTML=names.map((x,i)=>'<div class="gauge"><div class="name">'+x[0]+'</div><svg viewBox="0 0 120 84"><path d="M17 70 A49 49 0 0 1 103 70" fill="none" stroke="#34514c" stroke-width="8" stroke-linecap="round"/><path d="M17 70 A49 49 0 0 1 103 70" fill="none" stroke="#b6a073" stroke-width="3" stroke-dasharray="3 6"/><line id="needle'+i+'" x1="60" y1="70" x2="60" y2="28" stroke="#f1c783" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="70" r="5" fill="#e6ddbc"/></svg><div class="value" id="v'+i+'">0</div></div>').join('');let fuel='',rods='';for(let y=0;y<6;y++)for(let x=0;x<5;x++){fuel+='<rect x="'+(103+x*24)+'" y="'+(83+y*25)+'" width="16" height="19" rx="3" fill="#517e79" stroke="#7ab4aa" opacity=".85"/>'}for(let x=0;x<4;x++)rods+='<rect id="r'+x+'" x="'+(122+x*24)+'" y="60" width="7" height="153" rx="3" fill="#b8b4a0" stroke="#dcd0ad"/>';$('fuel').innerHTML=fuel;$('rods').innerHTML=rods;
const setNeedle=(i,p)=>{let a=(-135+clamp(p,0,1)*270)*Math.PI/180;let x=60+42*Math.sin(a),y=70-42*Math.cos(a);$('needle'+i).setAttribute('x2',x);$('needle'+i).setAttribute('y2',y)};function reset(){running=false;tripped=false;power=0;temp=22;steam=0;output=0;seconds=0;rod=15;flow=65;load=30;for(let k of ['rod','flow','load']){$(k).value=({rod,flow,load})[k]};paint()}function scram(){tripped=true;running=false;rod=0;$('rod').value=0;paint()}function paint(){for(let k of ['rod','flow','load'])$(k+'v').textContent=($(k).value|0)+'%';const values=[power,temp,steam,output];const scales=[110,400,110,900];values.forEach((v,i)=>{$('v'+i).textContent=(i===1?Math.round(v):Math.round(v))+(i===1?'°':i===3?'':'%');setNeedle(i,v/scales[i])});for(let x=0;x<4;x++)$('r'+x).setAttribute('transform','translate(0 '+(-rod*1.35)+')');$('halo').setAttribute('opacity',String(.1+power/120));$('ready').className='lamp'+(running?' on':'');const danger=temp>335||power>103||tripped;$('alarm').className='lamp'+(danger?' hot':'');$('state').textContent=tripped?'TRIPPED':danger?'WARNING':running?'RUNNING':'STANDBY';$('watts').textContent=Math.round(output)+' kW';$('clock').textContent='T+'+String(Math.floor(seconds)).padStart(4,'0')+'s';}
$('start').onclick=()=>{if(!tripped)running=true};$('trip').onclick=scram;$('reset').onclick=reset;for(let k of ['rod','flow','load'])$(k).oninput=()=>{if(k==='rod')rod=+$('rod').value;if(k==='flow')flow=+$('flow').value;if(k==='load')load=+$('load').value;paint()};
let last=performance.now();function frame(now){let dt=Math.min((now-last)/1000,.06);last=now;seconds+=dt;phase+=dt;const target=running&&!tripped?clamp((rod-9)*1.55,0,115):0;power+=(target-power)*Math.min(1,dt*.48);const heat=22+power*3.05;const cooling=flow*.6+load*.18;temp+=(Math.max(22,heat-cooling)-temp)*Math.min(1,dt*.36);steam+=(clamp((temp-85)*.41,0,115)-steam)*Math.min(1,dt*.4);const targetOutput=steam*(load/100)*8.1;output+=(targetOutput-output)*Math.min(1,dt*.7);if(temp>365||power>110){scram()}$('spin').setAttribute('transform','translate(251 85) rotate('+(phase*output*.25)+')');paint();requestAnimationFrame(frame)}requestAnimationFrame(frame);paint();
})();
</script></body></html>
