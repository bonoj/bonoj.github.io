<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060b17"><title>BALLATA · Hermeticon</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050912;color:#e9d8b7;font-family:Georgia,serif}canvas{display:block;touch-action:none}#v{position:fixed;inset:0}#top{position:fixed;top:max(17px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 3px 18px #000}h1{font-weight:400;font-size:clamp(20px,5vw,38px);letter-spacing:.23em;margin:0}small{font:10px system-ui;letter-spacing:.23em;color:#b6a98d}#foot{position:fixed;bottom:calc(17px + env(safe-area-inset-bottom));width:100%;text-align:center}button{background:#101c29c9;border:1px solid #a98d55;color:#f1d6a4;padding:13px 21px;border-radius:100px;font:14px system-ui;min-width:62px}#credit{margin:11px auto 0;font:11px system-ui;color:#aeb4b5}a{color:#dfc48f}#notice{position:fixed;top:42%;width:100%;text-align:center;font:12px system-ui;color:#d7c4a6;pointer-events:none}#input{display:none}#build{position:fixed;right:10px;top:10px;color:#677987;font:9px monospace}</style></head><body><div id="v"></div><div id="top"><h1>BALLATA</h1><small>DI OMBRE AL CREPUSCOLO · HERMETICON</small></div><div id="build">music/01</div><div id="notice">A small world waits for its music.</div><div id="foot"><button id="play">▶ AWAKEN</button> <button id="choose">♫</button><input type="file" id="input" accept="audio/*"><div id="credit">Music: <a href="https://darkscores.itch.io/dark-scores-cinematic-fantasy-orchestral-music" target="_blank">Dark Scores</a> · Noncommercial, attributed experience · Drag to orbit</div></div><audio id="audio" preload="auto" loop src="./ballata.mp3"></audio><script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const host=document.getElementById('v'),scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x060a17,.012);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,200);camera.position.set(0,4,31);

scene.add(new THREE.AmbientLight(0x8b99bd,.8));let l=new THREE.PointLight(0xe5b56b,70,40);l.position.set(4,7,8);scene.add(l);l=new THREE.PointLight(0x6ba2ff,60,35);l.position.set(-6,-3,-5);scene.add(l);
const world=new THREE.Group();scene.add(world);const glass=new THREE.Mesh(new THREE.SphereGeometry(10.2,64,40),new THREE.MeshPhysicalMaterial({color:0x5b90a9,metalness:.1,roughness:.13,transmission:.92,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false}));world.add(glass);
const ringmat=new THREE.MeshStandardMaterial({color:0xb89559,metalness:.92,roughness:.24,emissive:0x39240d});function ring(r,t,y,rx=0,rz=0){const o=new THREE.Mesh(new THREE.TorusGeometry(r,t,12,180),ringmat);o.rotation.set(Math.PI/2+rx,0,rz);o.position.y=y;world.add(o);return o}
ring(10.25,.09,0);ring(10.24,.038,0,.4);ring(10.24,.038,0,-.4);for(let j=0;j<8;j++){const mer=new THREE.Mesh(new THREE.TorusGeometry(10.22,.017,7,150),ringmat);mer.rotation.y=j*Math.PI/8;world.add(mer)}
const ground=new THREE.Mesh(new THREE.CircleGeometry(8.8,100),new THREE.MeshStandardMaterial({color:0x101d32,roughness:.8,metalness:.25,side:THREE.DoubleSide}));ground.rotation.x=-Math.PI/2;ground.position.y=-7.7;world.add(ground);
const stars=2600,pos=new Float32Array(stars*3),col=new Float32Array(stars*3),sizes=new Float32Array(stars);const rng=(()=>{let x=741;return()=>((x=(Math.imul(x,1664525)+1013904223)>>>0)/4294967296)})();for(let i=0;i<stars;i++){const a=rng()*Math.PI*2,r=1.3+Math.sqrt(rng())*7.6,y=(rng()-.5)*12;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=y;pos[i*3+2]=Math.sin(a)*r;col[i*3]=.35+rng()*.65;col[i*3+1]=.4+rng()*.35;col[i*3+2]=.65+rng()*.35;sizes[i]=rng()}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.055,vertexColors:true,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending}));world.add(pts);
const ribbons=[];for(let k=0;k<9;k++){const n=240,arr=new Float32Array(n*3),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));const m=new THREE.LineBasicMaterial({color:new THREE.Color().setHSL(.1+k*.065,.65,.63),transparent:true,opacity:.58,blending:THREE.AdditiveBlending});const line=new THREE.Line(g,m);world.add(line);ribbons.push({k,n,arr,g,line})}
const core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,4),new THREE.MeshPhysicalMaterial({color:0xc5a4ef,metalness:.55,roughness:.18,emissive:0x261648,transmission:.22,transparent:true,opacity:.85}));world.add(core);
let ctx,analyser,levels=new Uint8Array(256),playing=false;const audio=document.getElementById('audio'),play=document.getElementById('play'),notice=document.getElementById('notice');async function awaken(){try{if(!ctx){ctx=new AudioContext();const source=ctx.createMediaElementSource(audio);analyser=ctx.createAnalyser();analyser.fftSize=1024;levels=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);analyser.connect(ctx.destination)}await ctx.resume();if(audio.paused){await audio.play();playing=true;play.textContent='Ⅱ REST';notice.textContent=''}else{audio.pause();playing=false;play.textContent='▶ AWAKEN'}}catch(e){notice.textContent='Choose the music file with ♫ to awaken this world';console.warn(e)}}play.onclick=awaken;document.getElementById('choose').onclick=()=>document.getElementById('input').click();document.getElementById('input').onchange=e=>{if(e.target.files[0]){audio.src=URL.createObjectURL(e.target.files[0]);audio.load();awaken()}};
let drag=false,lastX=0,lastY=0,ry=.2,rx=-.08;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lastX)*.005;rx=Math.max(-.5,Math.min(.5,rx+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);
let tick=0;function frame(){requestAnimationFrame(frame);tick+=.012;if(analyser)analyser.getByteFrequencyData(levels);const low=analyser?levels.slice(0,25).reduce((a,b)=>a+b,0)/(25*255):.15;const mid=analyser?levels.slice(25,115).reduce((a,b)=>a+b,0)/(90*255):.12;const high=analyser?levels.slice(115,250).reduce((a,b)=>a+b,0)/(135*255):.08;world.rotation.y+=(ry-world.rotation.y)*.045+.0007;world.rotation.x+=(rx-world.rotation.x)*.045;core.rotation.y+=.004+low*.025;core.rotation.z+=.003+mid*.015;core.scale.setScalar(1+low*.55);pts.rotation.y+=.0007+high*.006;for(const {k,n,arr,g,line} of ribbons){const freq=(k%3===0?low:k%3===1?mid:high);for(let i=0;i<n;i++){const u=i/(n-1),a=u*Math.PI*2* (1.3+k*.11)+tick*(.13+(k%3)*.08)+k*2.4;const radius=2.1+u*4.2+Math.sin(a*2.2+tick)*(.22+freq*1.9);arr[i*3]=Math.cos(a)*radius;arr[i*3+1]=(u-.5)*10+Math.sin(a*1.8+tick)*(.4+freq*1.4);arr[i*3+2]=Math.sin(a)*radius}g.attributes.position.needsUpdate=true;line.material.opacity=.3+freq*.65}glass.material.opacity=.10+low*.13;renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
