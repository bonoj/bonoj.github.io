<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a0d"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;color:#ddd;font-family:system-ui,sans-serif}main{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 8px 0}.stage img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}.nav{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:#080a0d}.nav button{appearance:none;background:#24282d;border:1px solid #484d53;color:#eee;border-radius:999px;width:35px;height:35px;display:grid;place-items:center;font-size:15px;cursor:pointer;touch-action:manipulation}.nav button[aria-current="true"]{background:#e7dfc8;border-color:#e7dfc8;color:#111}.nav .arrow{border:0;background:transparent;font-size:23px;width:38px}.nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}@media(max-width:400px){.nav{gap:5px}.nav button{width:32px;height:32px}.nav .arrow{width:31px}}
</style></head><body><main><div class="stage"><img id="art" alt="Fantasy civilization artwork" draggable="false"></div><nav class="nav" aria-label="Gallery navigation"><button class="arrow" id="prev" aria-label="Previous image">‹</button><div id="dots" style="display:flex;gap:7px"></div><button class="arrow" id="next" aria-label="Next image">›</button></nav></main><script>
const images=Array.from({length:6},(_,i)=>"image-"+(i+1)+".b64");let index=0;const art=document.getElementById("art"),dots=document.getElementById("dots");images.forEach((_,i)=>{let b=document.createElement("button");b.textContent=i+1;b.setAttribute("aria-label","Show image "+(i+1));b.onclick=()=>show(i);dots.append(b)});function show(i){index=(i+images.length)%images.length;art.src=images[index].startsWith("data:")?images[index]:"";const selected=index;fetch(images[selected]).then(r=>{if(!r.ok)throw Error("Image unavailable");return r.text()}).then(b64=>{if(index===selected)art.src="data:image/jpeg;base64,"+b64.trim()});[...dots.children].forEach((b,j)=>b.setAttribute("aria-current",String(j===index)))}document.getElementById("prev").onclick=()=>show(index-1);document.getElementById("next").onclick=()=>show(index+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(index+1);if(e.key==="ArrowLeft")show(index-1)});let startX=0;art.addEventListener("touchstart",e=>startX=e.touches[0].clientX,{passive:true});art.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50)show(index+(dx<0?1:-1))},{passive:true});show(0);
</script></body></html>
