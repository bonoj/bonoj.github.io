<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>🌙 Worldshaper</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#eee9de;font:14px system-ui}main{max-width:600px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}small{color:#a9b6b7}button{cursor:pointer;color:inherit}#reset{background:#243039;border:1px solid #607078;border-radius:18px;padding:8px 12px}.stage{height:min(58vh,440px);min-height:290px;position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(ellipse at center,#273d38,#111f29 80%);touch-action:none}canvas{width:100%;height:100%;display:block}.status{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.tip{position:absolute;bottom:10px;width:100%;text-align:center;color:#d4dfd8;font-size:11px;pointer-events:none}.powers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.pill{border:1px solid #4c5b61;border-radius:12px;padding:11px 4px;text-align:center;background:#202e36;font:12px system-ui}.pill.active{outline:2px solid #b5a1f8;background:#39364e}.symbol{font-size:24px}#desc{margin:12px 2px;color:#b4bcbf;font-size:12px}</style><main><header><div><b>🌙 The Becoming</b><div><small>Level 1 · A character in progress</small></div></div><button id="reset">↺ New world</button></header><div class="stage"><canvas></canvas><div class="status"><span id="stats">🌿 0 · ✨ 0</span><span id="identity">🧙 Wanderer</span></div><div class="tip">Tap to cast · Drag to wander</div></div><div class="powers" id="powers"><button class="pill active" data-power="grow"><div class="symbol">🌱</div>Grow</button><button class="pill" data-power="water"><div class="symbol">💧</div>Water</button><button class="pill" data-power="fire"><div class="symbol">🔥</div>Flame</button><button class="pill" data-power="charm"><div class="symbol">💜</div>Charm</button><button class="pill" data-power="stone"><div class="symbol">🪨</div>Shape</button><button class="pill" data-power="heal"><div class="symbol">✨</div>Heal</button><button class="pill" data-power="summon"><div class="symbol">🐈</div>Familiar</button><button class="pill" data-power="storm"><div class="symbol">⚡</div>Storm</button></div><div id="desc">🌱 Grow — plant seeds. Water them to grow trees.</div></main><script>
(()=>{const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),stage=document.querySelector('.stage');let W,H,power='grow',plants=[],stones=[],friends=[],sparks=[],critters=[],xp=0,hero={x:170,y:150},dest=null,last=0,clock=0;const names={grow:'🌱 Grow — plant seeds. Water them to grow trees.',water:'💧 Water — nurture plants and make ponds.',fire:'🔥 Flame — light campfires, or burn vegetation.',charm:'💜 Charm — make friends with wandering creatures.',stone:'🪨 Shape — raise stones and build a little landscape.',heal:'✨ Heal — restore scorched ground and help creatures.',summon:'🐈 Familiar — summon a companion that follows you.',storm:'⚡ Storm — summon lightning and rainfall.'};const emoji=(s,x,y,size=25)=>{ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y)};function resize(){let r=stage.getBoundingClientRect();W=r.width;H=r.height;let d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);hero.x=Math.min(W-20,hero.x)}resize();new ResizeObserver(resize).observe(stage);const rnd=(a,b)=>a+Math.random()*(b-a);function newWorld(){plants=[];stones=[];friends=[];sparks=[];critters=[];xp=0;hero={x:W/2,y:H/2};dest=null;for(let i=0;i<5;i++)critters.push({x:rnd(30,W-30),y:rnd(45,H-35),e:['🐇','🦊','🦋','🐸','🐿️'][i],a:rnd(0,7),friend:false});for(let i=0;i<4;i++)plants.push({x:rnd(30,W-30),y:rnd(45,H-35),growth:2,burn:false});update()}function update(){document.querySelector('#stats').textContent='🌿 '+plants.filter(p=>!p.burn).length+' · ✨ '+xp;document.querySelector('#identity').textContent=xp>20?'🧙‍♂️ Worldshaper':xp>9?'🧝 Spellweaver':'🧙 Wanderer'}function burst(x,y,e,n=6){for(let i=0;i<n;i++)sparks.push({x:x+rnd(-15,15),y:y+rnd(-15,15),vx:rnd(-35,35),vy:rnd(-55,-10),life:rnd(.5,1),e})}function cast(x,y){xp++;if(power==='grow'){plants.push({x,y,growth:0,burn:false});burst(x,y,'🌱',3)}if(power==='water'){let hit=0;for(let p of plants)if(Math.hypot(p.x-x,p.y-y)<75&&!p.burn){p.growth=Math.min(3,p.growth+2);hit++}burst(x,y,'💧',8);if(!hit)stones.push({x,y,e:'💦',life:10})}if(power==='fire'){for(let p of plants)if(Math.hypot(p.x-x,p.y-y)<45)p.burn=true;stones.push({x,y,e:'🔥',life:14});burst(x,y,'🔥',5)}if(power==='charm'){let nearest=critters.filter(c=>!c.friend).sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y))[0];if(nearest&&Math.hypot(nearest.x-x,nearest.y-y)<85){nearest.friend=true;burst(nearest.x,nearest.y,'💜',6)}else burst(x,y,'💜',4)}if(power==='stone'){stones.push({x,y,e:'🪨',life:Infinity});burst(x,y,'✨',3)}if(power==='heal'){for(let p of plants)if(Math.hypot(p.x-x,p.y-y)<95){p.burn=false;p.growth=Math.max(2,p.growth)}burst(x,y,'✨',9)}if(power==='summon'){friends.push({x:hero.x+rnd(-20,20),y:hero.y+rnd(-20,20),e:['🐈','🦉','🐉','🐕'][friends.length%4]});burst(hero.x,hero.y,'✨',5)}if(power==='storm'){for(let p of plants)if(Math.hypot(p.x-x,p.y-y)<110&&!p.burn)p.growth=Math.min(3,p.growth+1);burst(x,y,'⚡',12)}update()}let down=null;cv.addEventListener('pointerdown',e=>{let r=cv.getBoundingClientRect();down={x:e.clientX-r.left,y:e.clientY-r.top,moved:false};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!down)return;let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-down.x,y-down.y)>12)down.moved=true;if(down.moved)dest={x,y}});cv.addEventListener('pointerup',e=>{if(!down)return;let r=cv.getBoundingClientRect();if(!down.moved)cast(e.clientX-r.left,e.clientY-r.top);down=null});document.querySelectorAll('[data-power]').forEach(b=>b.addEventListener('click',()=>{power=b.dataset.power;document.querySelectorAll('[data-power]').forEach(q=>q.classList.toggle('active',q===b));document.querySelector('#desc').textContent=names[power]}));document.querySelector('#reset').addEventListener('click',newWorld);function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;clock+=dt;ctx.clearRect(0,0,W,H);ctx.fillStyle='#8cae93';ctx.globalAlpha=.35;for(let x=20;x<W;x+=36)for(let y=20;y<H;y+=36){ctx.beginPath();ctx.arc(x,y,1,0,7);ctx.fill()}ctx.globalAlpha=1;if(dest){let dx=dest.x-hero.x,dy=dest.y-hero.y,d=Math.hypot(dx,dy);if(d>3){hero.x+=dx/d*Math.min(d,110*dt);hero.y+=dy/d*Math.min(d,110*dt)}else dest=null}for(let s of stones){if(s.life!==Infinity)s.life-=dt;if(s.life>0)emoji(s.e,s.x,s.y,23)}stones=stones.filter(s=>s.life>0);for(let p of plants){if(!p.burn&&p.growth<3)p.growth=Math.min(3,p.growth+dt*.055);emoji(p.burn?'🥀':p.growth<1?'🌱':p.growth<2?'🌿':'🌳',p.x,p.y,p.growth>=2?29:22)}for(let c of critters){c.a+=dt;c.x=Math.max(15,Math.min(W-15,c.x+Math.sin(c.a*1.7)*dt*7));c.y=Math.max(35,Math.min(H-15,c.y+Math.cos(c.a*1.3)*dt*7));if(c.friend){c.x+=(hero.x-c.x)*dt*.16;c.y+=(hero.y-c.y)*dt*.16;emoji('💜',c.x,c.y-21,11)}emoji(c.e,c.x,c.y+Math.sin(c.a*2)*2,23)}for(let i=0;i<friends.length;i++){let f=friends[i],angle=clock*.7+i*6.28/Math.max(1,friends.length),tx=hero.x+Math.cos(angle)*35,ty=hero.y+Math.sin(angle)*35;f.x+=(tx-f.x)*Math.min(1,dt*2);f.y+=(ty-f.y)*Math.min(1,dt*2);emoji(f.e,f.x,f.y,23)}emoji('🧙',hero.x,hero.y+Math.sin(clock*3)*2,32);for(let p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,Math.min(1,p.life));emoji(p.e,p.x,p.y,15);ctx.globalAlpha=1}sparks=sparks.filter(p=>p.life>0);requestAnimationFrame(frame)}newWorld();requestAnimationFrame(frame)})();
</script></html>
