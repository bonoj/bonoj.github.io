const professions={
 ant:{body:'🐜',native:-1,tool:'🪓',depot:'🛖',land:4,motion:'walk',speed:48,work:2,range:22,find:()=>crops.find(p=>p.stage==='tree'&&!p.burnAt&&!p.witherAt&&!p.workerClaim),valid:p=>crops.includes(p)&&p.stage==='tree'&&!p.burnAt&&!p.witherAt&&!p.witherAt,harvest:p=>{crops.splice(crops.indexOf(p),1);return 'wood'}},

function moveWorker(a,x,y,speed,dt,stop=0){const dx=x-a.x,dy=y-a.y,d=Math.hypot(dx,dy);if(d<=stop+.01)return true;const step=Math.min(d-stop,speed*dt);a.x+=dx/d*step;a.y+=dy/d*step;if(Math.abs(dx)>.01)a.facing=dx>0?1:-1;return d-step<=stop+.01}

function lazyWander(a,home,dt,speed,radius=34){
 if(!a.wander)a.wander={wait:rand(0,1.8),x:a.x,y:a.y};
