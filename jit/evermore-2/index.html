<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#140d23"><title>EVERMORE 2.0™ · TIFFINITY SURVIVORS</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100b1d;color:#fff0d8;font-family:system-ui,sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,520px);display:flex;flex-direction:column;min-height:100dvh;background:linear-gradient(#23132e,#100b1d)}header{padding:14px 14px 6px;text-align:center}h1{font-size:clamp(19px,5vw,28px);margin:0;color:#ffdc88;letter-spacing:.05em}header p{margin:4px 0 8px;font-size:11px;color:#d8b9dc;letter-spacing:.15em}.hud{display:flex;justify-content:space-between;gap:5px;font-size:12px;font-weight:750;padding:8px 12px}.arena{position:relative;width:100%;flex:1;min-height:340px;max-height:68dvh}canvas{width:100%;height:100%;display:block;touch-action:none}.spells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:9px}.spell{min-width:0;border:1px solid #72557b;border-radius:12px;background:#281c35;color:#f8eddd;padding:9px 2px;cursor:pointer;font-size:11px}.spell b{display:block;font-size:26px}.spell.active{background:#533553;border-color:#ffdd83;box-shadow:0 0 14px #f5bc7255}.bottom{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 12px 16px;color:#cfbcd8;font-size:11px}button{font:inherit}.restart{padding:9px 13px;background:#39253f;color:white;border:1px solid #866e91;border-radius:10px}.hint{padding:0 12px 5px;text-align:center;color:#d6b9db;font-size:12px}.back{color:#dfbded;text-decoration:none}#notice{position:absolute;top:12px;left:10%;right:10%;text-align:center;pointer-events:none;color:#ffe49b;font-weight:900;text-shadow:0 2px 8px black}
</style></head><body><main class="app"><header><h1>🧛‍♀️ TIFFINITY SURVIVORS™</h1><p>EVERMORE GAMES · THERE'S ALWAYS MORE</p></header><div class="hud"><span id="wave">WAVE 1</span><span id="kills">0 AUDITED</span><span id="hp">♥ ♥ ♥ ♥ ♥</span></div><div class="arena"><canvas id="game" aria-label="Stationary Tiffany survival game"></canvas><div id="notice"></div></div><div class="hint">CHOOSE A LAND · TAP TIFFANY TO CAST</div><div class="spells" id="spells"><button class="spell active" data-n="0"><b>☀️</b>Plains</button><button class="spell" data-n="1"><b>💧</b>Island</button><button class="spell" data-n="2"><b>💀</b>Swamp</button><button class="spell" data-n="3"><b>🔥</b>Mountain</button><button class="spell" data-n="4"><b>🌳</b>Forest</button></div><div class="bottom"><span id="status">PLAIN'S DIVINE AUDIT</span><a class="back" href="../evermore/">EVERMORE 1.0 ↗</a><button class="restart" id="restart">↻ Restart</button></div></main><script>
(()=>{'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d'),arena=c.parentElement,colors=['#ffe1a0','#79caff','#c08beb','#ff8457','#87d78b'],names=['PLAIN OF JUDGMENT','ISLAND OF REPOSSESSION','SWAMP OF COMPLIANCE','MOUNTAIN OF HOSTILE ACQUISITION','FOREST OF COMPOUND INTEREST'];let w=400,h=450,cx=200,cy=225,selected=0,enemies=[],fx=[],rings=[],zones=[],hp=5,kills=0,elapsed=0,spawnClock=0,last=0,lastCast=-10000,invuln=0,over=false,noticeTime=0;const rand=(a,b)=>a+Math.random()*(b-a),icons=['🦇','🕷️','👹','💀','🐀'];function resize(){const r=arena.getBoundingClientRect();w=Math.max(240,r.width);h=Math.max(320,r.height);const d=Math.min(2,devicePixelRatio||1);c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);cx=w/2;cy=h/2}addEventListener('resize',resize);resize();function hud(){document.querySelector('#wave').textContent='WAVE '+(1+Math.floor(elapsed/18000));document.querySelector('#kills').textContent=kills+' AUDITED';document.querySelector('#hp').textContent='♥ '.repeat(hp)||'♡';document.querySelector('#status').textContent=over?'TIFFANY HAS BEEN AUDITED':names[selected]}function reset(){enemies=[];fx=[];rings=[];zones=[];hp=5;kills=0;elapsed=0;spawnClock=0;lastCast=-10000;invuln=0;over=false;noticeTime=0;hud()}function spawn(){const edge=Math.floor(Math.random()*4),pad=25,x=edge===0?-pad:edge===1?w+pad:rand(0,w),y=edge===2?-pad:edge===3?h+pad:rand(0,h),wave=1+Math.floor(elapsed/18000);enemies.push({x,y,hp:1+(wave>=4&&Math.random()<.25?1:0),speed:rand(24,42)+wave*3,icon:icons[Math.floor(Math.random()*icons.length)],slow:0,poison:0,pt:0,dead:false})}function burst(x,y,color,n=10){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(35,135);fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.25,.7),color,r:rand(2,5)})}}function hit(e,dmg,color){if(e.dead)return;e.hp-=dmg;burst(e.x,e.y,color,4);if(e.hp<=0){e.dead=true;kills++;burst(e.x,e.y,color,9)}}function cast(){if(over)return;const now=performance.now();if(now-lastCast<350)return;lastCast=now;const R=Math.min(w,h)*.43,col=colors[selected];rings.push({x:cx,y:cy,r:3,max:R,life:.5,color:col});if(selected===0){enemies.forEach(e=>{if(Math.hypot(e.x-cx,e.y-cy)<R)hit(e,1,col)});burst(cx,cy,col,28)}if(selected===1){enemies.forEach(e=>{const dx=e.x-cx,dy=e.y-cy,d=Math.hypot(dx,dy)||1;if(d<R){e.slow=4;e.x+=dx/d*55;e.y+=dy/d*55;if(d<R*.55)hit(e,1,col)}});burst(cx,cy,col,20)}if(selected===2){enemies.forEach(e=>{if(Math.hypot(e.x-cx,e.y-cy)<R*1.2){e.poison=5;e.pt=0}});zones.push({r:R*1.15,life:1.2,color:col})}if(selected===3){enemies.slice().sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy)).slice(0,8).forEach(e=>{if(Math.hypot(e.x-cx,e.y-cy)<R*1.5){hit(e,2,col);rings.push({x:e.x,y:e.y,r:2,max:35,life:.4,color:col})}});burst(cx,cy,col,25)}if(selected===4){enemies.forEach(e=>{if(Math.hypot(e.x-cx,e.y-cy)<R*.9)hit(e,1,col)});zones.push({r:R*.85,life:3,color:col});burst(cx,cy,col,17)}enemies=enemies.filter(e=>!e.dead);hud()}document.querySelectorAll('.spell').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.n);document.querySelectorAll('.spell').forEach(z=>z.classList.toggle('active',z===b));hud()}));document.querySelector('#restart').addEventListener('click',reset);c.addEventListener('pointerdown',e=>{e.preventDefault();const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*w/r.width,y=(e.clientY-r.top)*h/r.height;if(Math.hypot(x-cx,y-cy)<Math.max(65,Math.min(w,h)*.17))cast()});function frame(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;if(!over){const oldWave=Math.floor(elapsed/18000);elapsed+=dt*1000;spawnClock+=dt;const wave=1+Math.floor(elapsed/18000),interval=Math.max(.23,1.05-wave*.075);while(spawnClock>interval){spawnClock-=interval;spawn()}invuln=Math.max(0,invuln-dt);for(const e of enemies){const dx=cx-e.x,dy=cy-e.y,d=Math.hypot(dx,dy)||1;e.slow=Math.max(0,e.slow-dt);const speed=e.speed*(e.slow>0?.3:1);e.x+=dx/d*speed*dt;e.y+=dy/d*speed*dt;if(e.poison>0){e.poison-=dt;e.pt+=dt;if(e.pt>.7){e.pt=0;hit(e,1,colors[2])}}if(zones.some(z=>z.color===colors[4]&&Math.hypot(e.x-cx,e.y-cy)<z.r))e.slow=Math.max(e.slow,.2);if(d<28&&!e.dead){e.dead=true;if(invuln<=0){hp--;invuln=1.1;if(hp<=0)over=true;hud()}}}enemies=enemies.filter(e=>!e.dead);if(Math.floor(elapsed/18000)!==oldWave){hud();noticeTime=2}}for(const p of fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt}fx=fx.filter(p=>p.life>0);for(const r of rings){r.r+=(r.max-r.r)*Math.min(1,dt*9);r.life-=dt}rings=rings.filter(r=>r.life>0);zones.forEach(z=>z.life-=dt);zones=zones.filter(z=>z.life>0);noticeTime=Math.max(0,noticeTime-dt);document.querySelector('#notice').textContent=noticeTime>0?'THE BOARD DEMANDS MORE':'';ctx.clearRect(0,0,w,h);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.75);g.addColorStop(0,'#392443');g.addColorStop(1,'#12101d');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#a083bd20';ctx.lineWidth=1;for(let x=0;x<w;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='#b38d6a66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,47,0,Math.PI*2);ctx.stroke();for(const z of zones){ctx.globalAlpha=Math.min(.22,z.life*.12);ctx.fillStyle=z.color;ctx.beginPath();ctx.arc(cx,cy,z.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.textAlign='center';ctx.textBaseline='middle';for(const e of enemies){ctx.font='27px system-ui';ctx.fillText(e.icon,e.x,e.y);if(e.slow>0){ctx.strokeStyle='#79caff';ctx.beginPath();ctx.arc(e.x,e.y,16,0,Math.PI*2);ctx.stroke()}}for(const r of rings){ctx.globalAlpha=Math.min(1,r.life*2);ctx.strokeStyle=r.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}for(const p of fx){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.shadowColor=colors[selected];ctx.shadowBlur=23;ctx.fillStyle='#452748';ctx.beginPath();ctx.arc(cx,cy,33,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=invuln>0?.55:1;ctx.font='49px system-ui';ctx.fillText('🧛‍♀️',cx,cy-3);ctx.globalAlpha=1;ctx.font='bold 12px system-ui';ctx.fillStyle='#ffe4a3';ctx.fillText('TIFFANY™',cx,cy+49);if(over){ctx.fillStyle='#100b1ddc';ctx.fillRect(0,0,w,h);ctx.font='bold 27px system-ui';ctx.fillStyle='#ffcf9e';ctx.fillText('HOSTILE TAKEOVER',cx,cy-36);ctx.font='17px system-ui';ctx.fillText(kills+' attackers audited',cx,cy+5);ctx.fillText('↻ Restart to reclaim the realm',cx,cy+36)}requestAnimationFrame(frame)}reset();requestAnimationFrame(frame)})();
</script></body></html>
