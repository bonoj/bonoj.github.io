<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d12"><title>Lovecraft · Gnashing Ecology</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d12}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="world"></canvas><script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d');let w,h,t=0,last=0,seed=741,actors=[],fragments=[],pulses=[],rain=[],nodes=[],edges=[],mouths=[];const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296},range=(a,b)=>a+(b-a)*rand(),one=a=>a[Math.floor(rand()*a.length)];function size(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}size();addEventListener('resize',size);function icon(s,x,y,z=22,a=1,r=0){g.save();g.translate(x*w,y*h);g.rotate(r);g.globalAlpha=a;g.font=z+'px "Noto Color Emoji","Apple Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(s,0,0);g.restore()}function edge(a,b,c,d,alpha){g.beginPath();g.moveTo(a*w,b*h);g.lineTo(c*w,d*h);g.strokeStyle='rgba(154,141,159,'+alpha+')';g.lineWidth=1;g.stroke()}for(let i=0;i<44;i++){const a=i*2.39996+range(-.3,.3),r=range(.15,.47);nodes.push({x:Math.max(.06,Math.min(.94,.5+Math.cos(a)*r)),y:Math.max(.08,Math.min(.92,.5+Math.sin(a)*r)),symbol:one(['🌱','🍄','☁️','🪨','🦴','🌳','💧']),clock:range(1,8),glow:0})}for(let i=0;i<nodes.length;i++){edges.push([i,(i+1)%nodes.length],[i,Math.floor(rand()*nodes.length)]);if(i%3===0)edges.push([i,Math.floor(rand()*nodes.length)])}for(let i=0;i<4;i++){const a=i*Math.PI/2+.3;mouths.push({x:.5+Math.cos(a)*.33,y:.5+Math.sin(a)*.32,a,phase:range(0,6),cool:range(.2,2)})}function creature(m){actors.push({kind:'creature',symbol:one(['🐑','🐄','🐖','🐐','🐓','🦌','🐇']),x:m.x+Math.cos(m.a)*.18,y:m.y+Math.sin(m.a)*.18,target:m,age:0,speed:range(.05,.11)})}function grow(x,y){actors.push({kind:'growth',x,y,age:0,life:range(2,5),stage:0})}function scatter(x,y){const ingredients=['🥩','🦴','🥚','🥛','🧀','🌾','🫘','🍖','💧','✨'];for(let i=0;i<24;i++){const a=rand()*Math.PI*2,v=range(.04,.24);fragments.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,symbol:one(ingredients),age:0,life:range(.6,2),z:range(11,23)})}for(let i=0;i<3;i++)actors.push({kind:'mushroom',x:x+range(-.06,.06),y:y+range(-.06,.06),age:0,life:range(2,4)})}c.addEventListener('pointerdown',e=>{const x=e.clientX/w,y=e.clientY/h;pulses.push({x,y,age:0});if(Math.hypot(x-.5,y-.5)<.16){mouths.forEach(creature)}else{const n=nodes.reduce((a,b)=>Math.hypot(b.x-x,b.y-y)<Math.hypot(a.x-x,a.y-y)?b:a);n.symbol=one(['🔥','🌧️','🌱','🍄','☁️']);n.clock=.3;grow(x,y)}for(const n of nodes)if(Math.hypot(n.x-x,n.y-y)<.28)n.glow=1});let spawn=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000||.016);last=now;t+=dt;const bg=g.createRadialGradient(w*.5,h*.5,0,w*.5,h*.5,Math.max(w,h)*.7);bg.addColorStop(0,'#242235');bg.addColorStop(.45,'#121823');bg.addColorStop(1,'#080b10');g.fillStyle=bg;g.fillRect(0,0,w,h);for(const [i,j] of edges){const a=nodes[i],b=nodes[j];edge(a.x,a.y,b.x,b.y,.09+a.glow*.2)}for(const n of nodes){n.clock-=dt;n.glow=Math.max(0,n.glow-dt*.7);if(n.clock<=0){n.clock=range(3,9);const k=n.symbol;if(k==='🌱')n.symbol='🌳';else if(k==='🌳')n.symbol='🔥';else if(k==='🔥'){n.symbol='🪨';if(rand()<.7)grow(n.x,n.y)}else if(k==='🍄')n.symbol='🌱';else if(k==='☁️'){n.symbol='🌧️';for(let i=0;i<8;i++)rain.push({x:n.x+range(-.07,.07),y:n.y,vy:range(.12,.28),life:range(.6,1.4)})}else if(k==='🌧️')n.symbol='💧';else if(k==='💧')n.symbol='🌱';else n.symbol=one(['🍄','🌱','☁️','🦴'])}icon(n.symbol,n.x,n.y,18+n.glow*7,.7+n.glow*.3)}
for(const m of mouths){m.phase+=dt*9;m.cool-=dt;if(m.cool<=0){m.cool=range(1.5,3.7);creature(m)}g.save();g.translate(m.x*w,m.y*h);g.rotate(m.a+Math.PI/2);g.fillStyle='#17070c';g.strokeStyle='#663a41';g.lineWidth=7;g.beginPath();g.ellipse(0,0,29,16+Math.sin(m.phase)*4,0,0,Math.PI*2);g.fill();g.stroke();g.restore();for(let i=-3;i<=3;i++){const q=i*.019,dx=Math.cos(m.a),dy=Math.sin(m.a);icon('🔪',m.x-dy*q+dx*.025,m.y+dx*q+dy*.025,17,.9,m.a+Math.PI/2+Math.sin(m.phase)*.3);icon('🔪',m.x-dy*q-dx*.025,m.y+dx*q-dy*.025,17,.9,m.a-Math.PI/2-Math.sin(m.phase)*.3)}}
for(let i=actors.length-1;i>=0;i--){const a=actors[i];a.age+=dt;if(a.kind==='creature'){const dx=a.target.x-a.x,dy=a.target.y-a.y,d=Math.hypot(dx,dy);if(d<.035){scatter(a.x,a.y);actors.splice(i,1);continue}a.x+=dx/d*a.speed*dt;a.y+=dy/d*a.speed*dt;icon(a.symbol,a.x,a.y+Math.sin(t*11+i)*.005,25)}else if(a.kind==='mushroom'){if(a.age>a.life){grow(a.x,a.y);actors.splice(i,1);continue}icon('🍄',a.x,a.y,20,Math.min(1,(a.life-a.age)*.65))}else{if(a.age>a.life){a.stage++;a.age=0;a.life=range(2,5);if(a.stage===4){for(let j=0;j<15;j++)fragments.push({x:a.x,y:a.y,vx:range(-.1,.1),vy:range(-.25,-.06),symbol:one(['🔥','✨','💨','🚀']),age:0,life:range(.6,1.7),z:range(13,24)});actors.splice(i,1);continue}}icon(['🌱','🌿','🌳','🔥'][a.stage],a.x,a.y,20+Math.min(2,a.stage)*6,.85)}}
spawn-=dt;if(spawn<=0){spawn=range(.8,1.8);grow(range(.1,.9),range(.12,.9))}for(let i=fragments.length-1;i>=0;i--){const f=fragments[i];f.age+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=dt*.06;icon(f.symbol,f.x,f.y,f.z,Math.max(0,1-f.age/f.life));if(f.age>f.life)fragments.splice(i,1)}for(let i=rain.length-1;i>=0;i--){const r=rain[i];r.y+=r.vy*dt;r.life-=dt;icon('💧',r.x,r.y,13,.6);if(r.life<=0){if(rand()<.65)grow(r.x,r.y);rain.splice(i,1)}}for(let i=0;i<5;i++){g.beginPath();g.arc(w*.5,h*.5,(.08+i*.045+(t*.018)%.045)*Math.min(w,h),0,Math.PI*2);g.strokeStyle='rgba(178,105,159,'+(.17-i*.024)+')';g.lineWidth=1.4;g.stroke()}for(const p of pulses){p.age+=dt;g.beginPath();g.arc(p.x*w,p.y*h,p.age*.35*Math.min(w,h),0,Math.PI*2);g.strokeStyle='rgba(217,154,201,'+Math.max(0,.7-p.age*.7)+')';g.lineWidth=2;g.stroke()}pulses=pulses.filter(p=>p.age<1);for(let i=0;i<14;i++){const a=t*.12+i*Math.PI/7;edge(.5,.5,.5+Math.cos(a)*.115,.5+Math.sin(a)*.115,.18)}icon('🧠',.5,.5,53+8*Math.sin(t*2.3));if(rand()<dt*1.5)one(nodes).glow=1}requestAnimationFrame(frame)})();</script></body></html>
