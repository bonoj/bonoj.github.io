<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><title>🥁</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151e;color:#f1f2f4;font-family:system-ui,sans-serif;touch-action:manipulation}.app{height:100dvh;max-width:620px;margin:auto;padding:12px;display:flex;flex-direction:column;justify-content:center;gap:12px}.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.pad{border:1px solid #ffffff36;min-height:0;aspect-ratio:1/1;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:radial-gradient(circle at 35% 25%,var(--a),#171d28 83%);box-shadow:inset 0 2px 15px #ffffff10,0 5px 12px #0004;transition:transform .06s,filter .06s}.pad.hit{transform:scale(.94);filter:brightness(1.8)}.pad span{font-size:clamp(30px,9vw,58px);pointer-events:none}.pad:before{content:"";position:absolute;inset:12%;border:1px solid #ffffff28;border-radius:50%;pointer-events:none}.footer{display:flex;justify-content:center;align-items:center;gap:18px;padding:5px}.footer button{width:47px;height:47px;border-radius:50%;border:1px solid #64717e;background:#222c38;color:#fff;font-size:20px}.footer button.on{background:#24604e;border-color:#7de7c7}.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#8b9baa;opacity:.25}.dots i.on{background:#a4e8ed;opacity:1}@media(max-height:550px){.app{max-width:430px;padding:5px;gap:5px}.pads{gap:5px}.pad{aspect-ratio:auto;height:calc((100dvh - 100px)/3)}.footer button{height:38px;width:38px}}
</style></head><body><main class="app"><section class="pads">
<div class="pad" data-sound="kick" style="--a:#704c49"><span>🥁</span></div><div class="pad" data-sound="snare" style="--a:#4b6587"><span>🪘</span></div><div class="pad" data-sound="hat" style="--a:#897744"><span>✨</span></div><div class="pad" data-sound="tom1" style="--a:#645080"><span>🔴</span></div><div class="pad" data-sound="tom2" style="--a:#39746c"><span>🟢</span></div><div class="pad" data-sound="tom3" style="--a:#756446"><span>🟡</span></div><div class="pad" data-sound="clap" style="--a:#84516d"><span>👏</span></div><div class="pad" data-sound="ride" style="--a:#4d7b89"><span>🔔</span></div><div class="pad" data-sound="crash" style="--a:#936d39"><span>💥</span></div>
</section><section class="footer"><button id="rec">⏺️</button><div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><button id="play">▶️</button><button id="clear">↺</button></section></main><script>
(()=>{'use strict';let ac,noise,recording=false,events=[],recordStart=0,playing=false,timers=[];const pads=[...document.querySelectorAll('.pad')],rec=document.querySelector('#rec'),play=document.querySelector('#play'),clear=document.querySelector('#clear'),dots=[...document.querySelectorAll('.dots i')];
function init(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise=b}if(ac.state==='suspended')ac.resume()}
function env(g,t,vol,decay){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+decay)}
function tone(f,end,decay,vol,type='sine'){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(end,t+decay);env(g,t,vol,decay);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+decay+.03)}
function hiss(decay,vol,hp=1000){const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=hp;env(g,t,vol,decay);s.connect(f).connect(g).connect(ac.destination);s.start(t);s.stop(t+decay+.04)}
function sound(k){switch(k){case'kick':tone(155,42,.4,.85);tone(60,39,.22,.35);break;case'snare':hiss(.18,.48,1300);tone(190,105,.14,.3,'triangle');break;case'hat':hiss(.075,.25,6500);break;case'tom1':tone(260,125,.32,.62);break;case'tom2':tone(190,90,.38,.65);break;case'tom3':tone(140,58,.48,.7);break;case'clap':hiss(.13,.5,1800);setTimeout(()=>{if(ac)hiss(.09,.18,2200)},25);break;case'ride':hiss(.55,.17,4500);tone(880,820,.7,.08,'triangle');break;case'crash':hiss(1.4,.4,2300);tone(480,330,.7,.1,'sawtooth')}}
function hit(k,log=true){init();sound(k);const p=pads.find(p=>p.dataset.sound===k);p.classList.remove('hit');void p.offsetWidth;p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),160);if(recording&&log)events.push({k,t:performance.now()-recordStart})}
pads.forEach(p=>p.addEventListener('pointerdown',e=>{e.preventDefault();hit(p.dataset.sound)}));
rec.onclick=()=>{init();recording=!recording;rec.classList.toggle('on',recording);if(recording){events=[];recordStart=performance.now()}};
play.onclick=()=>{init();if(playing){timers.forEach(clearTimeout);timers=[];playing=false;play.classList.remove('on');return}if(!events.length)return;recording=false;rec.classList.remove('on');playing=true;play.classList.add('on');for(const e of events)timers.push(setTimeout(()=>{if(playing)hit(e.k,false)},e.t));timers.push(setTimeout(()=>{playing=false;play.classList.remove('on')},events[events.length-1].t+300))};
clear.onclick=()=>{events=[];recording=false;playing=false;timers.forEach(clearTimeout);timers=[];rec.classList.remove('on');play.classList.remove('on')};
setInterval(()=>{const index=Math.floor(performance.now()/240)%8;dots.forEach((d,i)=>d.classList.toggle('on',i===index))},80);
})();
</script></body></html>
