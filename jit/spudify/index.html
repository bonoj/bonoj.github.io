<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#081713"><title>SPUDIFY · Play Reality</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081713;color:#e5e5c9;font-family:ui-sans-serif,system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d6c88d}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}header{position:absolute;top:env(safe-area-inset-top);left:0;right:0;padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}h1{font-weight:500;letter-spacing:.28em;font-size:15px;margin:0}small{font-size:9px;letter-spacing:.18em;color:#9cae9e}.badge{border:1px solid #617b66;border-radius:50px;padding:8px 11px;background:#071711a8;color:#b4c8b3;font-size:10px;letter-spacing:.12em}.controls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:12px;right:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;pointer-events:auto}.controls button{background:#10251fdd;border:1px solid #496453;border-radius:15px;padding:11px 1px 9px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:22px;backdrop-filter:blur(8px)}.controls button span{font-size:9px;letter-spacing:.07em}.controls button.active{background:#38503a;border-color:#e1cf86}#message{position:absolute;left:20px;right:20px;bottom:calc(98px + env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.06em;color:#d6d7b8;text-shadow:0 2px 6px #000;transition:opacity .4s}#stats{position:absolute;right:18px;top:calc(75px + env(safe-area-inset-top));font-size:10px;line-height:1.8;text-align:right;color:#a3b7a4}#hint{position:absolute;top:calc(90px + env(safe-area-inset-top));left:20px;font-size:11px;color:#c5cfb2;max-width:160px;line-height:1.5}#reset{position:absolute;top:calc(42px + env(safe-area-inset-top));right:18px;pointer-events:auto;border:0;background:transparent;color:#b9cba9;font-size:20px}#share{position:absolute;top:calc(42px + env(safe-area-inset-top));right:54px;pointer-events:auto;border:0;background:transparent;color:#b9cba9;font-size:19px}@media(min-width:750px){.controls{max-width:500px;margin:auto}#hint{max-width:240px}}
</style></head><body><canvas id="world"></canvas><div id="ui"><header><div><h1>SPUDIFY <span style="color:#d9bd74">✳</span></h1><small>PLAY REALITY · EXPERIMENT 001</small></div><div class="badge" id="mode">THE LIVING CIRCUIT</div></header><button id="share" aria-label="Copy world link">↗</button><button id="reset" aria-label="Reset world">↺</button><div id="hint">Touch the soil. Plant something.<br>Drag to explore above and below.</div><div id="stats"></div><div id="message">A forest is waiting for a potato.</div><div class="controls" id="tools"><button data-tool="plant" class="active">🥔<span>PLANT</span></button><button data-tool="water">💧<span>WATER</span></button><button data-tool="wire">⚡<span>WIRE</span></button><button data-tool="launch">🚀<span>LAUNCH</span></button><button data-tool="time">⏩<span>GROW</span></button></div></div><script>
(()=>{'use strict';
const c=document.querySelector('canvas'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,dpr=1,cam=0,tool='plant',drag=null,clock=0,last=0,flash=0,particles=[],tubers=[],water=[],projectiles=[],wires=[],seeds=0,shots=0,energy=0,cycle=0;let seed=741;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const ground=()=>H*.49+cam;const say=t=>{document.querySelector('#message').textContent=t;flash=4};const saved=()=>{try{localStorage.setItem('spudify-v1',JSON.stringify({tubers,water,wires,shots,seed,cycle}))}catch(e){}};try{const s=JSON.parse(localStorage.getItem('spudify-v1'));if(s){Object.assign({},{}) ;tubers=s.tubers||[];water=s.water||[];wires=s.wires||[];shots=s.shots||0;seed=s.seed||741;cycle=s.cycle||0}}catch(e){}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function line(points,color,width,alpha=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.globalAlpha=1}
function ellipse(x,y,rx,ry,color,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function branch(x,y,len,ang,depth,t,bright){if(depth<0||len<2)return;let x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;line([[x,y],[x2,y2]],bright?'#9b9d74':'#6e7459',Math.max(.7,depth*1.8),.8);if(depth<2){ellipse(x2,y2,5+depth*3,3+depth*2,bright?'#a7b86c':'#3c6b54',ang);return}branch(x2,y2,len*.73,ang-.38+Math.sin(t*.4+depth)*.04,depth-1,t,bright);branch(x2,y2,len*.68,ang+.52,depth-1,t,bright);if(depth%2===0)branch(x2,y2,len*.55,ang-.1,depth-2,t,bright)}
function draw(t){let g=ground();const sky=ctx.createLinearGradient(0,0,0,g);sky.addColorStop(0,'#071a1a');sky.addColorStop(1,'#304d41');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const soil=ctx.createLinearGradient(0,g,0,H);soil.addColorStop(0,'#443b2c');soil.addColorStop(.35,'#211f1b');soil.addColorStop(1,'#090f11');ctx.fillStyle=soil;ctx.fillRect(0,g,W,H-g);
for(let i=0;i<90;i++){let x=((i*137.508+41)%W),y=((i*91.71+19)%H);if(y>g){ctx.fillStyle=i%4?'#64544333':'#b5a47733';ctx.fillRect(x,y,2,1)}else{ellipse(x,y,1,1,'#b9d4a533')}}
const cx=W*.5;ctx.save();ctx.shadowBlur=35;ctx.shadowColor='#c7d9a52a';branch(cx,g,Math.min(W*.18,75),-Math.PI/2,7,t,false);ctx.restore();
for(let i=0;i<10;i++){const xx=cx+Math.sin(i*2.4)*W*.39, yy=g-50-(i%4)*33;branch(xx,yy,25+(i%3)*10,-Math.PI/2,3,t,true)}
for(let i=0;i<13;i++){let a=i*2.4,ex=cx+Math.cos(a)*W*.55,ey=g+50+(i%5)*43;line([[cx,g],[cx+Math.cos(a)*40,g+35],[ex,ey]],i%3?'#665c40':'#9c7951',i%3?2:3,.7);for(let j=0;j<3;j++){let f=(j+1)/4;line([[cx+(ex-cx)*f,g+(ey-g)*f],[cx+(ex-cx)*f+Math.sin(i+j)*32,g+(ey-g)*f+24]],'#66513d',1,.5)}}
for(let i=0;i<water.length;i++){let p=water[i];ellipse(p.x*W,g+p.y,18+p.amount*3,7+p.amount,'#4b95a0aa')}
for(let i=0;i<tubers.length;i++){let p=tubers[i],x=p.x*W,y=g+p.y,sz=clamp(8+p.age*2.5,8,27);line([[x,g],[x+Math.sin(i)*12,g+30],[x,y]],'#9b7c49',2,.7);ctx.save();ctx.shadowColor=p.power?'#e4d18c':'#000';ctx.shadowBlur=p.power?22:0;ellipse(x,y,sz*1.18,sz*.75,p.power?'#c6ad65':'#aa8653',i*.2);ctx.restore();for(let j=0;j<4;j++)ellipse(x+Math.cos(j*2.4)*sz*.65,y+Math.sin(j*2.4)*sz*.4,1.5,1.5,'#665039');if(p.age>1){let h=Math.min(p.age*13,130);line([[x,g],[x+Math.sin(i*3)*8,g-h]],'#6c9864',3);for(let j=0;j<Math.floor(h/22);j++){let yy=g-j*22-14,xx=x+Math.sin(i*3)*8;ellipse(xx+(j%2?13:-13),yy,15,6,'#6b9e72',j%2?.5:-.5)}}}
for(let i=0;i<wires.length;i++){let p=wires[i],x=p.x*W,y=g+p.y;line([[x,y],[x+24,y-14],[x+40,g-28],[cx,g-75]],'#e3bb72',2);ellipse(x,y,4,4,'#f1d99b');ellipse(x+24,y-14,4,4,'#b0c4bb')}
for(let i=0;i<projectiles.length;i++){let p=projectiles[i];ellipse(p.x,p.y,12,9,'#d4b176',p.angle);line([[p.x-12,p.y+3],[p.x-33,p.y+10]],'#c4ac70',2,.45)}
for(let p of particles){ellipse(p.x,p.y,p.r,p.r,p.col)}
ctx.strokeStyle='#acb98b77';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,g);ctx.lineTo(W,g);ctx.stroke();
const fog=ctx.createRadialGradient(cx,g-100,20,cx,g-100,Math.max(W,H)*.8);fog.addColorStop(0,'#00000000');fog.addColorStop(1,'#030d0bd9');ctx.fillStyle=fog;ctx.fillRect(0,0,W,H);
}
function tick(ts){let dt=Math.min((ts-last)/1000||.016,.05);last=ts;clock+=dt;cycle+=dt;let wet=water.reduce((a,b)=>a+b.amount,0);for(let p of tubers){let w=water.some(q=>Math.abs(q.x-p.x)<.2&&q.amount>.05);p.age=Math.min(p.age+dt*(w?.16:.04),15);p.power=w&&p.age>2}for(let p of water)p.amount=Math.max(0,p.amount-dt*.012);energy=tubers.filter(p=>p.power).length*wires.length;for(let p of projectiles){p.vy+=400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=dt*8;if(p.y>ground()+15){if(p.x>0&&p.x<W){tubers.push({x:p.x/W,y:45+rand()*65,age:0,power:false});seeds++;say('A flying potato has planted another future.')}p.dead=true}}projectiles=projectiles.filter(p=>!p.dead&&p.x>-60&&p.x<W+60&&p.y<H+100);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(Math.floor(cycle)%7===0&&Math.floor((cycle-dt))%7!==0)saved();ctx.setTransform(dpr,0,0,dpr,0,0);draw(clock);document.querySelector('#stats').innerHTML='TUBERS '+tubers.length+'<br>CHARGE '+energy+'<br>LAUNCHES '+shots; if(flash>0){flash-=dt;document.querySelector('#message').style.opacity=1}else document.querySelector('#message').style.opacity=.45;requestAnimationFrame(tick)}
requestAnimationFrame(tick);
function action(x,y){let g=ground(),nx=clamp(x/W,.04,.96),depth=clamp(y-g,30,Math.min(220,H*.35));if(tool==='plant'){tubers.push({x:nx,y:depth,age:.2,power:false});say('Buried. Now give it time, and perhaps water.')}else if(tool==='water'){water.push({x:nx,y:Math.max(15,depth-25),amount:3});say('Water finds its way down.')}else if(tool==='wire'){if(!tubers.length){say('Plant a potato first.');return}let nearest=tubers.reduce((a,b)=>Math.abs(b.x-nx)<Math.abs(a.x-nx)?b:a);wires.push({x:nearest.x,y:nearest.y});say('Copper meets starch. A tiny circuit awakens.')}else if(tool==='launch'){if(!tubers.length){say('You need ammunition. Grow a potato.');return}let p=tubers.pop(),sx=p.x*W,sy=g-45;projectiles.push({x:sx,y:sy,vx:(x>W*.5?1:-1)*(130+energy*20),vy:-240-energy*10,angle:0});shots++;say('For science. And possibly for Sam.')}else if(tool==='time'){tubers.forEach(p=>p.age=Math.min(15,p.age+2));water.forEach(p=>p.amount=Math.max(0,p.amount-.4));say('A season passes through the roots.')}saved()}
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,start:e.clientY,moved:false};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;let dy=e.clientY-drag.y;if(Math.abs(e.clientY-drag.start)>9)drag.moved=true;if(drag.moved){cam=clamp(cam+dy,-H*.55,H*.55);drag.y=e.clientY}});c.addEventListener('pointerup',e=>{if(drag&&!drag.moved)action(e.clientX,e.clientY);drag=null});document.querySelector('#tools').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;tool=b.dataset.tool;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('active',x===b));say(({plant:'Touch the earth to plant a tuber.',water:'Touch the soil to send water down.',wire:'Touch near a tuber to connect copper.',launch:'Touch the world to launch a potato.',time:'Touch anywhere to advance a season.'})[tool])});document.querySelector('#reset').onclick=()=>{tubers=[];water=[];wires=[];projectiles=[];shots=0;energy=0;cam=0;seed=741;saved();say('A new forest. A new experiment.')};document.querySelector('#share').onclick=async()=>{let data=JSON.stringify({tubers,water,wires,shots});try{await navigator.clipboard.writeText(location.href+'#'+encodeURIComponent(btoa(data)));say('This world is ready to share.')}catch(e){say('Sharing unavailable in this browser.')}};if(location.hash.length>1){try{let s=JSON.parse(atob(decodeURIComponent(location.hash.slice(1))));tubers=s.tubers||[];water=s.water||[];wires=s.wires||[];shots=s.shots||0;say('A shared world has taken root.')}catch(e){}}
})();
</script></body></html>
