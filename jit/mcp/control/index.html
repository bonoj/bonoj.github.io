<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIT · Chat-controlled page</title><style>body{background:#10141b;color:#f4f5f7;font:16px system-ui;margin:0;min-height:100dvh;display:grid;place-items:center}main{width:min(90vw,480px);text-align:center}h1{font-size:1.7rem}#count{font-size:clamp(5rem,24vw,9rem);font-weight:700;font-variant-numeric:tabular-nums;margin:20px}button{border:0;border-radius:12px;padding:16px 24px;background:#c9e8ff;color:#12202e;font-weight:700;font-size:1.1rem}p{color:#a8b4c2}#events{font:13px ui-monospace,monospace;min-height:48px;overflow-wrap:anywhere}</style><main><h1>Chat controls this page</h1><p>First-party JIT experiment · Android Chrome</p><div id="count">—</div><button id="local">Increment locally</button><p id="status">Connecting…</p><p id="events" aria-live="polite"></p></main><script>const api='https://iqglyokmcobegledbfcm.supabase.co/functions/v1/jit-page-demo';let busy=false;const el=id=>document.getElementById(id);async function sync(){if(busy)return;busy=true;try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();el('count').textContent=s.counter;el('status').textContent='Connected · checking for chat commands';if(s.command){el('events').textContent='Received '+s.command.action+' #'+s.command.id;const ack=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.command.id})});if(!ack.ok)throw Error('Command HTTP '+ack.status);const result=await ack.json();el('count').textContent=result.counter;el('events').textContent='Executed '+s.command.action+' #'+s.command.id+' → '+result.counter}}catch(e){el('status').textContent='Connection error: '+e.message}finally{busy=false}}el('local').onclick=()=>{el('events').textContent='Local button pressed; remote commands remain independent'};sync();setInterval(sync,1500);</script></html>
