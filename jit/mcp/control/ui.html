<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIT · Live UI control</title><style>:root{color-scheme:dark}body{background:#10141b;color:#f4f5f7;font:16px system-ui;margin:0;min-height:100dvh;display:grid;place-items:center}main{width:min(90vw,520px)}h1{font-size:1.65rem}p{color:#aab8c9}section{border:1px solid #394451;border-radius:16px;padding:20px;margin:16px 0}#stage{display:flex;gap:18px;align-items:center;justify-content:center;min-height:120px}#orbit{width:82px;height:82px;border:3px solid #75b6ed;border-radius:50%;display:grid;place-items:center}#orbit:after{content:'●';color:#75b6ed}#grove{font-size:70px} .selected{outline:3px solid #a8f1b3;outline-offset:8px}button{border:1px solid #536273;border-radius:10px;background:#1b2939;color:white;padding:12px;font:inherit}button:disabled{opacity:.5}#details{background:#182432;border-radius:10px;padding:12px}code{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}#status{font-size:13px}</style><main><h1>JIT · Live UI control</h1><p>First-party page · inspect / act / acknowledge</p><section><div id="stage"><div id="orbit" aria-label="Orbit"></div><div id="grove" aria-label="Grove">🌳</div></div><p id="selected">Selection: none</p><button id="panel" disabled>Panel: closed</button><div id="details" hidden><p>Live inspector panel</p><code id="snapshot"></code></div></section><p id="status">Connecting…</p><p id="events" aria-live="polite"></p><p>All controls on this page are driven by the shared command channel. No pairing required.</p></main><script>const api='https://iqglyokmcobegledbfcm.supabase.co/functions/v1/jit-page-demo';let busy=false;const el=id=>document.getElementById(id);function render(s){el('selected').textContent='Selection: '+s.selection;el('orbit').classList.toggle('selected',s.selection==='orbit');el('grove').classList.toggle('selected',s.selection==='grove');el('panel').textContent='Panel: '+(s.panel_open?'open':'closed');el('details').hidden=!s.panel_open;el('snapshot').textContent=JSON.stringify({protocol:s.protocol,revision:s.revision,counter:s.counter,selection:s.selection,panel_open:s.panel_open,updated_at:s.updated_at},null,2)}async function sync(){if(busy)return;busy=true;try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let s=await r.json();render(s);el('status').textContent='Connected · polling for chat commands';if(s.command){el('events').textContent='Received '+s.command.action+' #'+s.command.id;const ack=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:s.command.id})});if(!ack.ok)throw Error('Command HTTP '+ack.status);const result=await ack.json();el('events').textContent='Executed '+result.action+' #'+result.command_id;render({...s,...result})}}catch(e){el('status').textContent='Connection error: '+e.message}finally{busy=false}}sync();setInterval(sync,1500);</script></html>
