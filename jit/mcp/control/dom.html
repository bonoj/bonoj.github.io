<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIT · Observe and Act</title><style>:root{color-scheme:dark}body{margin:0;background:#111821;color:#edf3f8;font:16px system-ui;min-height:100dvh;display:grid;place-items:center}main{width:min(90vw,520px);padding:20px 0}h1{font-size:1.6rem}p{color:#b3c1d0}button,input{font:inherit;border-radius:12px;padding:14px;background:#213346;color:#f1f7fc;border:1px solid #597087}button{cursor:pointer}input{box-sizing:border-box;width:100%}.controls{display:grid;gap:14px}#status,#events{font-size:13px}#events{min-height:2em}#panel{padding:14px;background:#23344b;border-radius:12px}#panel[hidden]{display:none}small{color:#aabaca}</style><main><h1>JIT · Observe / Act</h1><p>First-party Android Chrome page. Chat can discover these controls, click them, and fill the form.</p><div class="controls"><button id="select-orbit" data-action="click">Select Orbit</button><button id="select-grove" data-action="click">Select Grove</button><button id="toggle-panel" data-action="click">Toggle inspector panel</button><label for="note-input">Note</label><input id="note-input" type="text" maxlength="120" placeholder="Chat can fill this field" autocomplete="off"></div><p id="selection">Selection: none</p><div id="panel" hidden>Inspector panel is open.</div><p id="status">Connecting…</p><p id="events" aria-live="polite"></p><small>Demo only · no private information · no authentication yet</small></main><script>const api='https://iqglyokmcobegledbfcm.supabase.co/functions/v1/jit-page-demo';let busy=false,lastSnapshot='';const el=id=>document.getElementById(id);function render(s){el('selection').textContent='Selection: '+s.selection;el('panel').hidden=!s.panel_open;el('note-input').value=s.form_text??''}function snapshot(){return {elements:['select-orbit','select-grove','toggle-panel','note-input'].map(id=>{const n=el(id);return{id,label:id==='note-input'?'Note':n.textContent.trim(),kind:n.tagName.toLowerCase(),value:id==='note-input'?n.value:'',disabled:!!n.disabled}})}}async function post(payload){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function sync(){if(busy)return;busy=true;try{const r=await fetch(api,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();render(s);el('status').textContent='Connected · observing DOM and polling commands';if(s.command){const c=s.command;const target=c.args?.target;const node=target?el(target):null;if((c.action==='click'||c.action==='fill')&&(!node||!['select-orbit','select-grove','toggle-panel','note-input'].includes(target)))throw Error('Unknown DOM target');if(c.action==='click'&&node.tagName!=='BUTTON')throw Error('Target is not a button');if(c.action==='fill'&&node.tagName!=='INPUT')throw Error('Target is not an input');const result=await post({id:c.id});if(c.action==='click')node.click();if(c.action==='fill'){node.value=result.form_text;node.dispatchEvent(new Event('input',{bubbles:true}))}render({...s,...result});el('events').textContent='Executed '+c.action+(target?' '+target:'')+' #'+c.id+' → acknowledged'}const snap=JSON.stringify(snapshot());if(snap!==lastSnapshot||s.command){await post({type:'snapshot',snapshot:JSON.parse(snap)});lastSnapshot=snap}}catch(e){el('status').textContent='Connection error: '+e.message}finally{busy=false}}sync();setInterval(sync,1500);</script></html>
