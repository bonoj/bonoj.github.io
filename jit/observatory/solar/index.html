<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermeticon / Solar Origin</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#fff;color:#111;font:12px Helvetica,Arial,sans-serif}main{height:100dvh;max-width:1200px;margin:auto;padding:clamp(16px,3vw,36px);display:flex;flex-direction:column}header,footer{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #111;padding-bottom:16px}h1{font-size:24px;letter-spacing:-1px;margin:0}button{border:0;background:none;font-size:25px;cursor:pointer}#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;padding:18px 0}.cell{border-top:1px solid #aaa;padding:10px 0;display:flex;flex-direction:column;justify-content:space-between;min-width:0}.label{font-size:11px;letter-spacing:.06em}.value{font-size:clamp(16px,3vw,31px);font-variant-numeric:tabular-nums}.meta{font-size:10px;color:#777;overflow-wrap:anywhere}footer{border:0;border-top:1px solid #111;padding-top:12px;color:#777;font-size:10px}a{color:inherit}@media(max-width:550px){.value{font-size:19px}}</style><main><header><h1>HERMETICON</h1><div><span id="status">SOLAR · ACQUIRING</span><button id="eye" aria-label="Copy solar observation report">👁</button></div></header><div id="grid"></div><footer><span>SOLAR ORIGIN · GOES X-RAY · <a href="../l1/">L1</a> · <a href="../geo/">GEO</a></span><span id="utc"></span></footer></main><script>
const build='solar/01',base='https://services.swpc.noaa.gov/json/goes/',feeds=[{key:'primary',url:base+'primary/xrays-6-hour.json'},{key:'secondary',url:base+'secondary/xrays-6-hour.json'}];const report={schema:'hermeticon-solar-eye/v1',build,capturedAt:null,kind:'solar-emission-measured-at-GEO',warnings:['X-ray photons originate at Sun; GOES sensors are in Earth orbit, not at solar surface.','X-ray timing is not CME/plasma transit timing.','No physical cone geometry or CME arrival is inferred.'],feeds:{}};const grid=document.getElementById('grid');const slots={};for(const f of feeds)for(const channel of ['short','long']){const e=document.createElement('div');e.className='cell';e.innerHTML='<div class="label">'+f.key.toUpperCase()+' · '+channel.toUpperCase()+' X-RAY</div><div class="value">—</div><div class="meta">WAITING</div>';grid.append(e);slots[f.key+channel]=e}const number=x=>{if(x===null||x===undefined||x==='')return null;const n=Number(x);return Number.isFinite(n)&&n>=0&&n<1e20?n:null};const date=x=>{const t=Date.parse(x);return Number.isFinite(t)?t:null};async function acquire(f){const entry={url:f.url,kind:'solar-emission-measured-at-GEO',attemptedAt:new Date().toISOString(),status:'ACQUIRING',http:null,error:null,records:0,keys:[],channels:{}};report.feeds[f.key]=entry;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);try{const response=await fetch(f.url,{cache:'no-store',signal:controller.signal});entry.http=response.status;if(!response.ok)throw Error('HTTP '+response.status);const length=Number(response.headers.get('content-length')||0);if(length>800000)throw Error('Payload exceeds 800k bound');const raw=await response.text();entry.bytes=raw.length;if(raw.length>800000)throw Error('Payload exceeds 800k bound');const rows=JSON.parse(raw);if(!Array.isArray(rows))throw Error('Expected array');entry.records=rows.length;entry.keys=Object.keys(rows[0]||{});entry.sample=rows.at(-1)||null;const grouped={short:[],long:[]};for(const r of rows){const t=date(r.time_tag||r.time||r.timestamp);if(t===null||t>Date.now()+60000)continue;const v=number(r.flux);if(v===null)continue;const e=String(r.energy||r.energy_band||r.channel||'').toLowerCase();const channel=e.includes('0.05')||e.includes('0.5-4')||e.includes('short')?'short':e.includes('0.1')||e.includes('1-8')||e.includes('long')?'long':null;if(channel)grouped[channel].push({time:r.time_tag||r.time||r.timestamp,epoch:t,flux:v,satellite:r.satellite??r.satellite_id??null,energy:r.energy??r.energy_band??null,quality:r.quality??r.quality_flag??null})}for(const channel of ['short','long']){const observations=grouped[channel].sort((a,b)=>a.epoch-b.epoch);const latest=observations.at(-1)||null;const ageMs=latest?Date.now()-latest.epoch:null;entry.channels[channel]={validCount:observations.length,latest,ageMs,stale:ageMs===null||ageMs>20*60000};const el=slots[f.key+channel];el.querySelector('.value').textContent=latest?latest.flux.toExponential(3):'—';el.querySelector('.meta').textContent=latest?(latest.time+' · '+(latest.satellite??'GOES')+' · '+(ageMs>20*60000?'STALE':'RECENT')+' · W/m²'):'NO RECOGNIZED RECORDS'}entry.status=Object.values(entry.channels).some(x=>x.latest&&!x.stale)?'RECENT_DATA':'STALE_OR_UNRECOGNIZED';}catch(e){entry.status='ERROR';entry.error=String(e);for(const channel of ['short','long'])slots[f.key+channel].querySelector('.meta').textContent='UNAVAILABLE'}finally{clearTimeout(timeout)}}async function refresh(){document.getElementById('status').textContent='SOLAR · ACQUIRING';for(const f of feeds)await acquire(f);document.getElementById('status').textContent='SOLAR · '+(Object.values(report.feeds).some(x=>x.status==='RECENT_DATA')?'OBSERVING':'UNVERIFIED');document.getElementById('utc').textContent=new Date().toISOString().slice(11,19)+' UTC'}document.getElementById('eye').onclick=async()=>{report.capturedAt=new Date().toISOString();const data=JSON.stringify(report,null,2);try{await navigator.clipboard.writeText(data);document.getElementById('status').textContent='SOLAR · 👁 COPIED'}catch(e){document.getElementById('status').textContent='SOLAR · COPY FAILED'}};refresh();setInterval(()=>{if(!document.hidden)refresh()},120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></html>
