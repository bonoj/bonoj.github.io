<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hermeticon · Observatory Study</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Helvetica,Arial,sans-serif;color:#111;background:white}main{height:100dvh;display:flex;flex-direction:column;padding:clamp(15px,3vw,42px);max-width:1500px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #111;padding-bottom:16px;gap:12px}h1{font-size:clamp(18px,2vw,27px);font-weight:600;margin:0;letter-spacing:-.045em}header span{font-size:12px;color:#555}.hero{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:25px}.price{font-size:clamp(40px,8vw,110px);font-weight:500;letter-spacing:-.065em;line-height:1;font-variant-numeric:tabular-nums}.correspondence{color:#444;font-size:14px;text-decoration:none;border-bottom:1px solid #999;padding-bottom:4px}.heading{font-size:12px;font-weight:600;display:flex;justify-content:space-between;border-bottom:1px solid #111;padding-bottom:12px}.experiments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,28px);padding:12px 0}.instrument{appearance:none;text-align:left;background:white;border:0;padding:0;min-width:0;color:inherit;cursor:pointer}.instrument:focus-visible{outline:2px solid #111}.instrument[aria-pressed=true]{background:#f3f3f3}.trace{width:100%;height:clamp(45px,10vh,105px)}.value{font-size:clamp(14px,2.4vw,25px);font-weight:500}.unit,.place{font-size:10px;color:#777}.name{font-size:clamp(9px,1.15vw,13px);font-weight:600;margin-top:12px}footer{border-top:1px solid #111;padding-top:12px;display:flex;justify-content:space-between;color:#777;font-size:10px}@media(max-height:550px){.hero{gap:12px}.experiments{padding:6px 0}.name{margin-top:4px}}
</style></head><body><main><header><h1>HERMETICON</h1><span>Zürich, Switzerland</span></header><section class="hero"><div class="price">CHF 250’000</div><a class="correspondence" href="mailto:">Correspondence</a></section><section aria-label="Observatory"><div class="heading"><span>OBSERVATORY</span><span>2026</span></div><div class="experiments" id="experiments"></div></section><footer><span>© 2026</span><span>47°22′ N · 8°32′ E</span></footer></main><script>
const feeds=[
{name:'POLAR ATMOSPHERE',place:'SVALBARD',unit:'°C',url:'https://api.open-meteo.com/v1/forecast?latitude=78.22&longitude=15.65&current=temperature_2m&timezone=GMT',parse:j=>({value:j.current?.temperature_2m,time:j.current?.time})},
{name:'OCEAN SURFACE',place:'NORTH ATLANTIC',unit:'m',url:'https://marine-api.open-meteo.com/v1/marine?latitude=58&longitude=-30&current=wave_height&timezone=GMT',parse:j=>({value:j.current?.wave_height,time:j.current?.time})},
{name:'PARTICULATE MATTER',place:'ZÜRICH',unit:'µg/m³',url:'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=47.37&longitude=8.54&current=pm2_5&timezone=GMT',parse:j=>({value:j.current?.pm2_5,time:j.current?.time})}
];
const host=document.getElementById('experiments');
const nodes=feeds.map((d,k)=>{const b=document.createElement('button');b.className='instrument';b.type='button';b.setAttribute('aria-pressed','false');b.innerHTML='<svg class="trace" viewBox="0 0 240 70" preserveAspectRatio="none" aria-hidden="true"><path fill="none" stroke="#111" stroke-width="1.5"/></svg><div class="value">—</div><div class="unit">'+d.unit+'</div><div class="name">'+d.name+'</div><div class="place">'+d.place+'</div><div class="place status">Fetching…</div>';b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';host.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',String(!on))};host.append(b);return b});
const history=feeds.map(()=>[]);
function render(k){const arr=history[k],b=nodes[k];if(!arr.length)return;const last=arr[arr.length-1];b.querySelector('.value').textContent=last.value.toLocaleString('en-US',{maximumFractionDigits:2});b.querySelector('.status').textContent='OBS '+last.time+' UTC';const vals=arr.map(x=>x.value),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(max-min,.01);b.querySelector('path').setAttribute('d',arr.length<2?'':arr.map((x,i)=>(i?'L':'M')+(i/(arr.length-1)*240).toFixed(1)+' '+(60-(x.value-min)/span*50).toFixed(1)).join(' '))}
async function refresh(k){const d=feeds[k],b=nodes[k],controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const res=await fetch(d.url,{signal:controller.signal,cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const obs=d.parse(await res.json());if(typeof obs.value!=='number'||!Number.isFinite(obs.value)||!obs.time)throw Error('No measurement');const stamp=obs.time.replace(' ','T');const arr=history[k];if(!arr.length||arr[arr.length-1].time!==stamp){arr.push({value:obs.value,time:stamp});if(arr.length>40)arr.shift()}render(k)}catch(e){b.querySelector('.status').textContent='UNAVAILABLE · '+e.message}finally{clearTimeout(timeout)}}
function refreshAll(){feeds.forEach((_,i)=>refresh(i))}refreshAll();setInterval(refreshAll,5*60*1000);
</script></body></html>
