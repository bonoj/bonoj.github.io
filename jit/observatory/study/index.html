<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hermeticon · Observatory Study</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Helvetica,Arial,sans-serif;color:#111;background:white}main{height:100dvh;display:flex;flex-direction:column;padding:clamp(15px,3vw,42px);max-width:1500px;margin:auto}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #111;padding-bottom:16px;gap:12px}h1{font-size:clamp(18px,2vw,27px);font-weight:600;margin:0;letter-spacing:-.045em}header span{font-size:12px;color:#555}.hero{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:25px}.price{font-size:clamp(40px,8vw,110px);font-weight:500;letter-spacing:-.065em;line-height:1;font-variant-numeric:tabular-nums}.correspondence{color:#444;font-size:14px;text-decoration:none;border-bottom:1px solid #999;padding-bottom:4px}.heading{font-size:12px;font-weight:600;display:flex;justify-content:space-between;border-bottom:1px solid #111;padding-bottom:12px}.experiments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,28px);padding:12px 0}.instrument{appearance:none;text-align:left;background:white;border:0;padding:0;min-width:0;color:inherit;cursor:pointer}.instrument:focus-visible{outline:2px solid #111}.instrument[aria-pressed=true]{background:#f3f3f3}.trace{width:100%;height:clamp(45px,10vh,105px)}.value{font-size:clamp(14px,2.4vw,25px);font-weight:500}.unit,.place{font-size:10px;color:#777}.name{font-size:clamp(9px,1.15vw,13px);font-weight:600;margin-top:12px}footer{border-top:1px solid #111;padding-top:12px;display:flex;justify-content:space-between;color:#777;font-size:10px}@media(max-height:550px){.hero{gap:12px}.experiments{padding:6px 0}.name{margin-top:4px}}
</style></head><body><main><header><h1>HERMETICON</h1><span>Zürich, Switzerland</span></header><section class="hero"><div class="price">CHF 250’000</div><a class="correspondence" href="mailto:">Correspondence</a></section><section aria-label="Observatory"><div class="heading"><span>OBSERVATORY</span><span>2026</span></div><div class="experiments" id="experiments"></div></section><footer><span>© 2026</span><span>47°22′ N · 8°32′ E</span></footer></main><script>
const data=[['COSMIC FLUX','SOUTH POLE','9,426','cpm'],['GEOMAGNETIC','EARTH','18,342','nT'],['ABYSSAL EXCHANGE','NORTH ATLANTIC','3.42','°C']];
const host=document.getElementById('experiments');data.forEach((d,k)=>{const b=document.createElement('button');b.className='instrument';b.type='button';b.setAttribute('aria-pressed','false');const path=Array.from({length:140},(_,i)=>{const t=i/139,y=k===0?34+Math.sin(i*9.3)*5+Math.sin(i*2.6)*4:k===1?34+Math.sin(t*14)*14+Math.cos(t*32)*3:34+Math.sin(t*8)*11+Math.sin(t*19)*3;return (i?'L':'M')+(t*240).toFixed(1)+' '+y.toFixed(1)}).join(' ');b.innerHTML='<svg class="trace" viewBox="0 0 240 70" preserveAspectRatio="none" aria-hidden="true"><path d="'+path+'" fill="none" stroke="#111" stroke-width="1.5"/></svg><div class="value">'+d[2]+'</div><div class="unit">'+d[3]+'</div><div class="name">'+d[0]+'</div><div class="place">'+d[1]+'</div>';b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';host.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',String(!on))};host.append(b)});
</script></body></html>
