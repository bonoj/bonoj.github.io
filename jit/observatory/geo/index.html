const build='geo/11',base='https://services.swpc.noaa.gov/json/goes/',config=[['mapping','instrument-sources.json'],['longitudes','satellite-longitudes.json'],['primaryMag','primary/magnetometers-6-hour.json'],['secondaryMag','secondary/magnetometers-6-hour.json'],['primaryProtons','primary/integral-protons-6-hour.json'],['secondaryProtons','secondary/integral-protons-6-hour.json']];
const buildState=document.getElementById('buildState');let publishedBuild=null,publicationCheckedAt=null,publicationError=null,eyeInspected=false;function showBuild(){let state=publishedBuild===null?'unknown':publishedBuild===build?'current':'stale';buildState.dataset.state=state;buildState.textContent=build+' · '+(state==='stale'?'REFRESH AVAILABLE':state==='current'?'CURRENT':'UNCONFIRMED')+' · '+(eyeInspected?'👁 INSPECTED':'👁 UNINSPECTED')}async function checkPublishedBuild(){try{const url='https://raw.githubusercontent.com/bonoj/bonoj.github.io/refs/heads/master/jit/observatory/geo/index.html?probe='+Date.now();const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const source=await response.text(),match=source.match(/const build=['\"]([^'\"]+)['\"]/);if(!match)throw Error('Build marker missing');publishedBuild=match[1];publicationError=null}catch(e){publishedBuild=null;publicationError=String(e)}publicationCheckedAt=new Date().toISOString();showBuild()};showBuild();const report={schema:'hermeticon-geo-eye/v1',build,capturedAt:null,geometryMethod:'approximate solar declination/equation of time; NOAA geostationary longitude; not orbital ephemeris',requests:{},mapping:null,longitudes:null,platforms:{},alignment:{},warnings:['Sun visibility and umbra are APPROXIMATIONS from nominal circular equatorial GEO orbit, not authoritative ephemerides; penumbra not modeled.','L1/GEO time alignment is descriptive nearest-sample comparison, not causal propagation.']};
const series={};const grid=document.getElementById('grid'),panels={};for(const [key,title] of [['primaryMag','PRIMARY MAGNETIC'],['secondaryMag','SECONDARY MAGNETIC'],['primaryProtons','PRIMARY PROTONS'],['secondaryProtons','SECONDARY PROTONS']]){let e=document.createElement('div');e.className='cell';e.innerHTML='<div class="label">'+title+'</div><div class="value">—</div><div class="meta">WAITING</div>';grid.append(e);panels[key]=e}

async function fetchOne(key,path){let url=base+path,started=performance.now(),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),16000),st={url,http:null,latencyMs:null,error:null,records:0,keys:[],first:null,last:null,samples:[],validNumericFields:{},status:'PROBED'};report.requests[key]=st;try{let res=await fetch(url,{cache:'no-store',signal:controller.signal});st.http=res.status;if(!res.ok)throw Error('HTTP '+res.status);let raw=await res.text();let data=JSON.parse(raw.replace(/:\s*NaN\b/g,':null'));if(!Array.isArray(data))throw Error('Expected JSON array');st.records=data.length;st.keys=[...new Set(data.slice(0,30).flatMap(x=>Object.keys(x)))];st.samples=[...data.slice(0,2),...data.slice(-2)];st.first=data[0]||null;st.last=data.at(-1)||null;if(key==='mapping')report.mapping=data;if(key==='longitudes')report.longitudes=data;if(panels[key]){let timed=data.filter(x=>time(x.time_tag)!==null).sort((a,b)=>time(a.time_tag)-time(b.time_tag));series[key]=timed;let numeric={};for(let x of timed){for(let [field,value] of Object.entries(x)){if(valid(value)&&field!=='satellite'&&field!=='arcjet_flag'){let channel=key.toLowerCase().includes('protons')?field+'|'+(x.energy||'unknown'):field;let f=numeric[channel];if(!f){f={count:0,last:null};numeric[channel]=f}f.count++;f.last={value,observedAt:x.time_tag,record:x}}}}st.validNumericFields=Object.fromEntries(Object.entries(numeric).map(([k,v])=>[k,{count:v.count,lastValue:v.last.value,lastAt:v.last.observedAt}]));st.normalizationDiagnostics={channelKeys:Object.keys(numeric),channelCounts:Object.fromEntries(Object.entries(numeric).map(([k,v])=>[k,v.count])),inputRecords:timed.length,energyLabels:[...new Set(timed.map(x=>x.energy).filter(Boolean))]};st.channels=Object.fromEntries(Object.entries(numeric).map(([field,v])=>[field,{count:v.count,...v.last,ageMinutes:(Date.now()-time(v.last.observedAt))/60000}]));const preferred=key.toLowerCase().includes('protons')?'flux|>=1 MeV':'total';st.latestNumeric=numeric[ async function alignL1(){let sources=[['plasma','https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json'],['magnetic','https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json']];let result={method:'nearest observed UTC minute; NOAA timezone-less timestamps parsed as UTC; no propagation correction',feeds:{},comparisons:[]};for(let [name,url] of sources){let st={url,http:null,error:null,records:0,latest:null};result.feeds[name]=st;try{let r=await fetch(url,{cache:'no-store'});st.http=r.status;if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();if(!Array.isArray(data))throw Error('Not an array');st.records=data.length;let timed=data.filter(x=>time(x.time_tag)!==null).sort((a,b)=>time(a.time_tag)-time(b.time_tag));st.latest=timed.at(-1)||null;st.latestActiveQuality=timed.filter(x=>x.active===true&&x.overall_quality===0).at(-1)||null;st.sourceDiagnostics={sourceCounts:timed.reduce((o,x)=>(o[x.source||'UNKNOWN']=(o[x.source||'UNKNOWN']||0)+1,o),{}),activeQualityCounts:timed.filter(x=>x.active===true&&x.overall_quality===0).reduce((o,x)=>(o[x.source||'UNKNOWN']=(o[x.source||'UNKNOWN']||0)+1,o),{}),timeBasis:'NOAA timezone-less timestamp interpreted as UTC; provider propagation semantics unverified',sampleSelection:'latest is unfiltered for backward compatibility; latestActiveQuality explicitly filtered'};series['l1_'+name]=timed;for(let key of ['primaryMag','secondaryMag','primaryProtons','secondaryProtons']){let g=report.requests[key]?.latestNumeric?.observedAt,gt=time(g);if(gt==null)continue;let closest=null,delta=Infinity;for(let x of timed){let d=Math.abs(time(x.time_tag)-gt);if(d<delta){delta=d;closest=x}}let eligible=null,eligibleDelta=Infinity;for(const x of timed){if(x.active!==true||x.overall_quality!==0)continue;let d=Math.abs(time(x.time_tag)-gt);if(d<eligibleDelta){eligibleDelta=d;eligible=x}}result.comparisons.push({geoFeed:key,l1Feed:name,geoObservedAt:g,l1ObservedAt:closest?.time_tag||null,absoluteDeltaSeconds:closest?delta/1000:null,withinF function lagStudy(){

 out.controls={l1Total:l1.length,l1Eligible:src.length,l1Rejected:l1.length-src.length,eligibleSourceCounts:src.reduce((o,x)=>(o[x.source]=(o[x.source]||0)+1,o),{})};

function controlledLagStudy(){

function falsificationStudy(){
 const lags=[30,45,60,75,90,105,120], magnetic=(series.l1_magnetic||[]).filter(x=>x.active===true&&x.overall_quality===0&&valid(x.bz_gsm)&&time(x.time_tag)!==null);
