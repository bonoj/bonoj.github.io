<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermeticon / GEO Probe</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:12px Helvetica,Arial,sans-serif;background:#fff;color:#111}main{height:100dvh;max-width:1200px;margin:auto;padding:clamp(16px,3vw,36px);display:flex;flex-direction:column}header,footer{display:flex;align-items:center;justify-content:space-between}header{border-bottom:1px solid #111;padding-bottom:16px}h1{margin:0;font-size:24px;letter-spacing:-1px}button{border:0;background:none;font-size:25px;cursor:pointer}#status{font-size:11px;color:#666}#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;padding:18px 0}.cell{border-top:1px solid #aaa;padding:10px 0;display:flex;flex-direction:column;justify-content:space-between;min-width:0}.label{font-size:11px;letter-spacing:.06em}.value{font-size:clamp(16px,3vw,32px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.meta{font-size:11px;color:#777;overflow-wrap:anywhere}footer{border-top:1px solid #111;padding-top:12px;color:#777;font-size:10px}@media(max-width:550px){.value{font-size:19px}.meta{font-size:10px}}</style><main><header><h1>HERMETICON</h1><div><span id="status">GEO · ACQUIRING</span><button id="eye" aria-label="Copy GEO acquisition report">👁</button></div></header><div id="grid"></div><footer><span>GEO / ACQUISITION PROBE</span><span id="utc"></span></footer></main><script>
const build='geo/04',base='https://services.swpc.noaa.gov/json/goes/',config=[['mapping','instrument-sources.json'],['longitudes','satellite-longitudes.json'],['primaryMag','primary/magnetometers-6-hour.json'],['secondaryMag','secondary/magnetometers-6-hour.json'],['primaryProtons','primary/integral-protons-6-hour.json'],['secondaryProtons','secondary/integral-protons-6-hour.json']];
const report={schema:'hermeticon-geo-eye/v1',build,capturedAt:null,geometryMethod:'approximate solar declination/equation of time; NOAA geostationary longitude; not orbital ephemeris',requests:{},mapping:null,longitudes:null,platforms:{},alignment:{},warnings:['Sun visibility and umbra are APPROXIMATIONS from nominal circular equatorial GEO orbit, not authoritative ephemerides; penumbra not modeled.','L1/GEO time alignment is descriptive nearest-sample comparison, not causal propagation.']};
const grid=document.getElementById('grid'),panels={};for(const [key,title] of [['primaryMag','PRIMARY MAGNETIC'],['secondaryMag','SECONDARY MAGNETIC'],['primaryProtons','PRIMARY PROTONS'],['secondaryProtons','SECONDARY PROTONS']]){let e=document.createElement('div');e.className='cell';e.innerHTML='<div class="label">'+title+'</div><div class="value">—</div><div class="meta">WAITING</div>';grid.append(e);panels[key]=e}
function time(x){let d=Date.parse(x);return Number.isFinite(d)?d:null}
function valid(v){if(typeof v!=='number'||!Number.isFinite(v)||v<=-99900||v===-9999)return false;return true}
function solar(now,west){let y=now.getUTCFullYear(),start=Date.UTC(y,0,0),n=Math.floor((now.getTime()-start)/86400000),hour=now.getUTCHours()+now.getUTCMinutes()/60+now.getUTCSeconds()/3600,g=2*Math.PI/365*(n-1+(hour-12)/24),eq=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g)),dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g),local=(hour*60-4*west+eq+1440)%1440,ha=(local/4-180)*Math.PI/180,cosZenith=Math.cos(dec)*Math.cos(ha);return {solarLocalTimeHours:local/60,solarDeclinationDeg:dec*180/Math.PI,solarHourAngleDeg:ha*180/Math.PI,subsolarAxisOffsetDeg:Math.acos(Math.max(-1,Math.min(1,cosZenith)))*180/Math.PI,sunward:cosZenith>0,sunVisible:cosZenith>0||Math.sqrt(1-cosZenith*cosZenith)>6378.137/42164,eclipsed:cosZenith<0&&Math.sqrt(1-cosZenith*cosZenith)<=6378.137/42164,earthShadowAngularRadiusDeg:Math.asin(6378.137/42164)*180/Math.PI,assumedOrbitalRadiusKm:42164,method:'Approximate spherical Earth umbra, parallel Sun rays, circular equatorial GEO radius 42164 km; ignores penumbra, actual inclination/ephemeris and atmospheric refraction',epoch:now.toISOString()}}
async function fetchOne(key,path){let url=base+path,started=performance.now(),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),16000),st={url,http:null,latencyMs:null,error:null,records:0,keys:[],first:null,last:null,samples:[],validNumericFields:{},status:'PROBED'};report.requests[key]=st;try{let res=await fetch(url,{cache:'no-store',signal:controller.signal});st.http=res.status;if(!res.ok)throw Error('HTTP '+res.status);let raw=await res.text();let data=JSON.parse(raw.replace(/:\s*NaN\b/g,':null'));if(!Array.isArray(data))throw Error('Expected JSON array');st.records=data.length;st.keys=[...new Set(data.slice(0,30).flatMap(x=>Object.keys(x)))];st.samples=[...data.slice(0,2),...data.slice(-2)];st.first=data[0]||null;st.last=data.at(-1)||null;if(key==='mapping')report.mapping=data;if(key==='longitudes')report.longitudes=data;if(panels[key]){let timed=data.filter(x=>time(x.time_tag)!==null).sort((a,b)=>time(a.time_tag)-time(b.time_tag));let numeric={};for(let x of timed){for(let [field,value] of Object.entries(x)){if(valid(value)&&field!=='satellite'&&field!=='arcjet_flag'){let channel=key.toLowerCase().includes('protons')?field+'|'+(x.energy||'unknown'):field;let f=numeric[channel];if(!f){f={count:0,last:null};numeric[channel]=f}f.count++;f.last={value,observedAt:x.time_tag,record:x}}}}st.validNumericFields=Object.fromEntries(Object.entries(numeric).map(([k,v])=>[k,{count:v.count,lastValue:v.last.value,lastAt:v.last.observedAt}]));st.normalizationDiagnostics={channelKeys:Object.keys(numeric),channelCounts:Object.fromEntries(Object.entries(numeric).map(([k,v])=>[k,v.count])),inputRecords:timed.length,energyLabels:[...new Set(timed.map(x=>x.energy).filter(Boolean))]};st.channels=Object.fromEntries(Object.entries(numeric).map(([field,v])=>[field,{count:v.count,...v.last,ageMinutes:(Date.now()-time(v.last.observedAt))/60000}]));st.latestNumeric=Object.entries(numeric).map(([field,v])=>({field,...v.last,count:v.count})).sort((a,b)=>time(b.observedAt)-time(a.observedAt))[0]||null;st.status=st.latestNumeric?'BROWSER_VERIFIED':'PROBED';st.quality={arcjetFlagged:data.filter(x=>x.arcjet_flag===true).length,arcjetFlagFalse:data.filter(x=>x.arcjet_flag===false).length,unknown:data.filter(x=>x.arcjet_flag===undefined).length};panels[key].querySelector('.value').textContent=st.latestNumeric?st.latestNumeric.value.toLocaleString()+' · '+st.latestNumeric.field:'NO NUMERIC DATA';panels[key].querySelector('.meta').textContent=(st.latestNumeric?.observedAt||'NO TIMED SAMPLE')+' · '+st.records+' records'}else st.status='METADATA_VERIFIED';}catch(e){st.error=String(e);st.status='BLOCKED';if(panels[key]){panels[key].querySelector('.value').textContent='UNAVAILABLE';panels[key].querySelector('.meta').textContent=st.error}}finally{clearTimeout(timer);st.latencyMs=Math.round(performance.now()-started)}}
async function alignL1(){let sources=[['plasma','https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json'],['magnetic','https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json']];let result={method:'nearest observed UTC minute, no propagation correction',feeds:{},comparisons:[]};for(let [name,url] of sources){let st={url,http:null,error:null,records:0,latest:null};result.feeds[name]=st;try{let r=await fetch(url,{cache:'no-store'});st.http=r.status;if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();if(!Array.isArray(data))throw Error('Not an array');st.records=data.length;let timed=data.filter(x=>time(x.time_tag)!==null).sort((a,b)=>time(a.time_tag)-time(b.time_tag));st.latest=timed.at(-1)||null;for(let key of ['primaryMag','secondaryMag','primaryProtons','secondaryProtons']){let g=report.requests[key]?.latestNumeric?.observedAt,gt=time(g);if(gt==null)continue;let closest=null,delta=Infinity;for(let x of timed){let d=Math.abs(time(x.time_tag)-gt);if(d<delta){delta=d;closest=x}}result.comparisons.push({geoFeed:key,l1Feed:name,geoObservedAt:g,l1ObservedAt:closest?.time_tag||null,absoluteDeltaSeconds:closest?delta/1000:null,withinFiveMinutes:delta<=300000,l1Sample:closest||null,interpretation:'timestamp proximity only; no inferred transit'})}}catch(e){st.error=String(e)}}report.alignment=result}
async function run(){document.getElementById('status').textContent='GEO · ACQUIRING';await Promise.all(config.slice(0,2).map(([k,p])=>fetchOne(k,p)));let map=report.mapping?.at(-1),longitudes=report.longitudes||[];for(let [instrument,key] of [['magnetometers','Mag'],['protons','Protons']])for(let role of ['primary','secondary']){let id=map?.[instrument]?.[role],position=longitudes.find(x=>x.satellite===id),name=role+(instrument==='magnetometers'?'Mag':'Protons');report.platforms[name]={instrument,role,satellite:id??null,longitudeDegreesWest:position?.longitude??null,geometry:typeof position?.longitude==='number'?solar(new Date(),position.longitude):null,longitudeSource:base+'satellite-longitudes.json',mappingSource:base+'instrument-sources.json'}}await Promise.all(config.slice(2).map(([k,p])=>fetchOne(k,p)));await alignL1();report.capturedAt=new Date().toISOString();document.getElementById('status').textContent='GEO · '+Object.values(report.requests).filter(x=>x.status==='BROWSER_VERIFIED').length+'/4 SCIENCE';document.getElementById('utc').textContent=report.capturedAt.slice(11,19)+' UTC'}
document.getElementById('eye').onclick=()=>{report.capturedAt=new Date().toISOString();let s=JSON.stringify(report,null,2);navigator.clipboard.writeText(s).then(()=>{document.getElementById('eye').textContent='✓';setTimeout(()=>document.getElementById('eye').textContent='👁',1000)}).catch(()=>prompt('Copy GEO report',s))};run();
</script></html>
