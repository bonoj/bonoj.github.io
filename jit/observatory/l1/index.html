<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermeticon / L1</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:12px Helvetica,Arial,sans-serif;color:#111;background:#fff}main{height:100dvh;display:flex;flex-direction:column;padding:clamp(15px,3vw,38px);max-width:1500px;margin:auto}header,footer{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111;padding-bottom:14px}h1{font-size:23px;letter-spacing:-1px;margin:0}button{border:0;background:transparent;font-size:24px;cursor:pointer}#grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,24px);padding:20px 0}.cell{border-top:1px solid #aaa;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding-top:9px}.name{font-size:10px;letter-spacing:.07em}.num{font-size:clamp(18px,3vw,43px);letter-spacing:-.05em;font-variant-numeric:tabular-nums}.unit,.meta{font-size:10px;color:#777}.trace{height:32px;width:100%}.trace path{stroke:#111;stroke-width:1.2;fill:none}footer{border:0;border-top:1px solid #111;padding:10px 0 0;color:#777;font-size:10px}@media(max-width:650px){#grid{gap:10px;padding:12px 0}.num{font-size:clamp(19px,5vw,32px)}.trace{height:23px}.name,.unit,.meta{font-size:9px}}</style><main><header><h1>HERMETICON</h1><div><span id="status">L1 · ACQUIRING</span><button id="eye" aria-label="Copy telemetry report">👁</button></div></header><div id="grid"></div><footer><span>SUN–EARTH L1</span><span id="utc"></span></footer></main><script>
const base='https://services.swpc.noaa.gov/json/rtsw/';
const streams=[{key:'plasma',url:base+'rtsw_wind_1m.json',fields:[['proton_speed','SOLAR WIND SPEED','km/s'],['proton_density','PROTON DENSITY','cm⁻³'],['proton_temperature','PROTON TEMPERATURE','K'],['proton_vy_gse','TRANSVERSE FLOW Y','km/s'],['proton_vz_gse','TRANSVERSE FLOW Z','km/s']]},{key:'magnetic',url:base+'rtsw_mag_1m.json',fields:[['bt','FIELD MAGNITUDE','nT'],['bx_gsm','MAGNETIC X','nT'],['by_gsm','MAGNETIC Y','nT'],['bz_gsm','MAGNETIC Z','nT']]}];
const state=streams.map(x=>({stream:x.key,url:x.url,attempts:0,successes:0,failures:0,http:null,latencyMs:null,error:null,records:0,sources:[],activeSources:[],latest:null,fields:{},sample:null}));
const grid=document.getElementById('grid'),cells={};
streams.forEach(s=>s.fields.forEach(([key,name,unit])=>{let e=document.createElement('div');e.className='cell';e.innerHTML='<div class="name">'+name+'</div><div><div class="num">—</div><div class="unit">'+unit+'</div></div><svg class="trace" viewBox="0 0 240 45" preserveAspectRatio="none"><path/></svg><div class="meta">WAITING</div>';grid.append(e);cells[s.key+':'+key]=e}));
function number(v){let n=Number(v);return v===null||v===undefined||v===''||!Number.isFinite(n)||Math.abs(n)>=99999||n===-9999?null:n}
function draw(el,rows,key){let points=rows.map(r=>({v:number(r[key]),t:r.time_tag})).filter(x=>x.v!==null);let last=points.at(-1);if(!last){el.querySelector('.meta').textContent='NO VALID DATA';return}el.querySelector('.num').textContent=last.v.toLocaleString('en-US',{maximumFractionDigits:2});let vals=points.slice(-80),lo=Math.min(...vals.map(x=>x.v)),hi=Math.max(...vals.map(x=>x.v)),span=Math.max(.00001,hi-lo);el.querySelector('path').setAttribute('d',vals.length<2?'':vals.map((p,i)=>(i?'L':'M')+(i/(vals.length-1)*240).toFixed(1)+' '+(40-(p.v-lo)/span*35).toFixed(1)).join(' '));el.querySelector('.meta').textContent=(last.t||'').slice(11,19)+' UTC · '+(rows.at(-1)?.source||'SOURCE UNKNOWN')}
async function acquire(s,i){let st=state[i],t=performance.now(),c=new AbortController(),timeout=setTimeout(()=>c.abort(),18000);st.attempts++;try{let r=await fetch(s.url,{cache:'no-store',signal:c.signal});st.http=r.status;if(!r.ok)throw Error('HTTP '+r.status);let raw=await r.text(),data;try{data=JSON.parse(raw)}catch(e){data=JSON.parse(raw.replace(/:\s*NaN\b/g,':null'))}if(!Array.isArray(data))throw Error('Expected array');st.records=data.length;st.sources=[...new Set(data.map(x=>x.source).filter(Boolean))];st.activeSources=[...new Set(data.filter(x=>x.active).map(x=>x.source).filter(Boolean))];st.sample=data.slice(0,2);let rows=data.filter(x=>x.active===true);if(!rows.length)rows=data;rows=rows.filter(x=>x.time_tag).sort((a,b)=>Date.parse(a.time_tag.endsWith('Z')?a.time_tag:a.time_tag+'Z')-Date.parse(b.time_tag.endsWith('Z')?b.time_tag:b.time_tag+'Z'));if(!rows.length)throw Error('No timed observations');st.latest=rows.at(-1).time_tag;st.fields={};for(let [key,name] of s.fields){let valid=rows.filter(x=>number(x[key])!==null);st.fields[key]={valid:valid.length,last:valid.length?{value:number(valid.at(-1)[key]),time:valid.at(-1).time_tag,source:valid.at(-1).source}:null};draw(cells[s.key+':'+key],valid,key)}st.successes++;st.error=null}catch(e){st.failures++;st.error=String(e);s.fields.forEach(([key])=>cells[s.key+':'+key].querySelector('.meta').textContent='UNAVAILABLE')}finally{clearTimeout(timeout);st.latencyMs=Math.round(performance.now()-t);document.getElementById('status').textContent=state.map(x=>x.successes?'●':'○').join(' ')+' · L1'}}
function run(){streams.forEach(acquire);document.getElementById('utc').textContent=new Date().toISOString().slice(0,19)+'Z'}run();setInterval(run,60000);
document.getElementById('eye').onclick=()=>{let report={schema:'hermeticon-l1-eye/v1',capturedAt:new Date().toISOString(),build:'l1/01',streams:state};let value=JSON.stringify(report,null,2);navigator.clipboard.writeText(value).then(()=>{document.getElementById('eye').textContent='✓';setTimeout(()=>document.getElementById('eye').textContent='👁',1000)}).catch(()=>prompt('Copy report',value))};
</script></html>
