<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermeticon · Telemetry</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#fff;color:#111;font:13px Helvetica,Arial,sans-serif}main{height:100dvh;max-width:1500px;margin:auto;padding:clamp(16px,3vw,40px);display:flex;flex-direction:column}header,footer{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #111;padding-bottom:14px}h1{font-size:24px;letter-spacing:-1px;margin:0}button{background:none;border:0;font:inherit;cursor:pointer;color:inherit}#eye{font-size:25px;padding:0 6px}#clock{font-variant-numeric:tabular-nums;color:#777}section{flex:1;min-height:0;display:flex;align-items:end;padding-bottom:6vh}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,3vw,45px);width:100%}.tile{min-width:0;border-top:1px solid #111;padding-top:15px}.name{font-size:11px;letter-spacing:1px}.value{font-size:clamp(30px,5vw,76px);font-weight:400;letter-spacing:-.055em;margin:16px 0 3px;font-variant-numeric:tabular-nums}.unit,.status{font-size:11px;color:#777;overflow-wrap:anywhere}.trace{width:100%;height:80px;margin-top:16px}.trace path{fill:none;stroke:#111;stroke-width:1.2}footer{border-bottom:0;border-top:1px solid #111;padding-top:13px;font-size:11px;color:#666}@media(max-width:650px){.grid{grid-template-columns:1fr;gap:16px}.tile{padding-top:8px}.value{font-size:clamp(25px,7vh,45px);margin:4px 0}.trace{height:30px;margin-top:4px}section{align-items:center;padding-bottom:0}}</style><main><header><h1>HERMETICON</h1><div><span id="clock"></span> <button id="eye" aria-label="Copy instrumentation report">👁</button></div></header><section><div class="grid" id="grid"></div></section><footer><span>Zürich, Switzerland</span><span>© 2026</span></footer></main><script>
const sources=[
{title:'ORBITAL VECTOR',unit:'km · ISS',url:'https://api.wheretheiss.at/v1/satellites/25544',read:j=>({value:j.altitude,time:new Date(j.timestamp*1000).toISOString(),meta:{latitude:j.latitude,longitude:j.longitude,velocity:j.velocity}})},
{title:'AURORAL ELECTROJET',unit:'nT · KYOTO',url:()=>{let end=new Date(Date.now()-3600000),start=new Date(end-86400000);return 'https://wdc.kugi.kyoto-u.ac.jp/hapi/data?id=min_ae_realtime&time.min='+encodeURIComponent(start.toISOString().slice(0,19)+'Z')+'&time.max='+encodeURIComponent(end.toISOString().slice(0,19)+'Z')+'&format=json'},read:j=>{let rows=(j.data||[]).filter(r=>Number.isFinite(r[1])&&r[1]!==99999);if(!rows.length)throw Error('No valid AE readings');let r=rows.at(-1);return {value:r[1],time:r[0],series:rows.slice(-60).map(x=>({value:x[1],time:x[0]})),meta:{samples:rows.length}}}},
{title:'TECTONIC DISPLACEMENT',unit:'km · GLOBAL / NON-US',url:'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson',read:j=>{let rows=(j.features||[]).filter(x=>x.geometry?.coordinates?.length===3&&Number.isFinite(x.geometry.coordinates[2])&&!(x.properties?.place||'').match(/Alaska|California|Hawaii|Nevada|Oregon|Washington|Puerto Rico|United States/i)).sort((a,b)=>a.properties.time-b.properties.time);if(!rows.length)throw Error('No non-US event in current feed');let x=rows.at(-1);return {value:x.geometry.coordinates[2],time:new Date(x.properties.time).toISOString(),series:rows.slice(-40).map(x=>({value:x.geometry.coordinates[2],time:new Date(x.properties.time).toISOString()})),meta:{place:x.properties.place,magnitude:x.properties.mag,events:rows.length}}}}
];
const grid=document.getElementById('grid'),state=sources.map(s=>({name:s.title,attempts:0,successes:0,failures:0,history:[],last:null,error:null,url:null,http:null,latencyMs:null}));
const nodes=sources.map(s=>{let el=document.createElement('article');el.className='tile';el.innerHTML='<div class="name">'+s.title+'</div><div class="value">—</div><div class="unit">'+s.unit+'</div><svg class="trace" viewBox="0 0 240 70" preserveAspectRatio="none"><path/></svg><div class="status">ACQUIRING</div>';grid.append(el);return el});
function render(i){let s=state[i],el=nodes[i];if(s.last){el.querySelector('.value').textContent=s.last.value.toLocaleString('en-US',{maximumFractionDigits:2});el.querySelector('.status').textContent='OBS '+s.last.time.replace('T',' ').slice(0,19)+' UTC'}else el.querySelector('.status').textContent=s.error||'ACQUIRING';let h=s.history.slice(-60),lo=Math.min(...h.map(x=>x.value)),hi=Math.max(...h.map(x=>x.value)),span=Math.max(hi-lo,.001);el.querySelector('path').setAttribute('d',h.length<2?'':h.map((p,k)=>(k?'L':'M')+(k/(h.length-1)*240).toFixed(1)+' '+(60-(p.value-lo)/span*50).toFixed(1)).join(' '))}
async function acquire(i){let s=state[i],def=sources[i],url=typeof def.url==='function'?def.url():def.url,c=new AbortController(),timer=setTimeout(()=>c.abort(),16000),t=performance.now();s.attempts++;s.url=url;try{let r=await fetch(url,{cache:'no-store',signal:c.signal});s.http=r.status;if(!r.ok)throw Error('HTTP '+r.status);let o=def.read(await r.json());if(!Number.isFinite(o.value)||!o.time)throw Error('Invalid observation');s.last={value:o.value,time:o.time,meta:o.meta||{}};s.successes++;s.error=null;if(o.series)s.history=o.series;else if(!s.history.length||s.history.at(-1).time!==o.time)s.history.push({value:o.value,time:o.time});s.history=s.history.slice(-60)}catch(e){s.failures++;s.error=e.name==='AbortError'?'TIMEOUT':String(e.message||e)}finally{clearTimeout(timer);s.latencyMs=Math.round(performance.now()-t);render(i)}}
function refresh(){sources.forEach((_,i)=>acquire(i));document.getElementById('clock').textContent=new Date().toISOString().slice(11,19)+' UTC'}refresh();setInterval(refresh,60000);setInterval(()=>document.getElementById('clock').textContent=new Date().toISOString().slice(11,19)+' UTC',1000);
document.getElementById('eye').onclick=()=>{let report={schema:'hermeticon-telemetry-eye/v1',capturedAt:new Date().toISOString(),build:'telemetry/01',sources:state.map(s=>({...s,history:s.history.slice(-8)}))};let value=JSON.stringify(report,null,2);navigator.clipboard.writeText(value).then(()=>{document.getElementById('eye').textContent='✓';setTimeout(()=>document.getElementById('eye').textContent='👁',1200)}).catch(()=>prompt('Copy report',value))};
</script></html>
