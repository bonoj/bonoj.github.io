<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#080f19"><title>OBSERVATORY · JIT</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060b15;color:#d7e9f3;font-family:system-ui,sans-serif}button,input{touch-action:manipulation}button{cursor:pointer}.app{height:100dvh;max-width:1100px;margin:auto;padding:10px;display:flex;flex-direction:column;gap:9px}.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:18px;font-weight:850;letter-spacing:.22em}.sub{font:10px monospace;color:#7fa6bd}.status{font:10px monospace;color:#b5c7b9;text-align:right}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f4a86e;margin-right:5px}.dot.ok{background:#83e9b7}.main{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr .75fr;gap:9px}.left,.right{display:flex;flex-direction:column;gap:9px;min-height:0}.panel{background:linear-gradient(145deg,#101d2b,#0a1521);border:1px solid #263b50;border-radius:9px;padding:10px;min-height:0;display:flex;flex-direction:column}.plot{flex:1;min-height:0;position:relative}.plot canvas,.curve canvas{width:100%;height:100%;display:block;touch-action:none}.panelhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.tag{font:10px monospace;color:#7fa6bd;letter-spacing:.1em}.pill{font:10px monospace;color:#a9c9d9}.star{position:relative;flex:1;min-height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#1b2b3a 0,#0b1724 48%,transparent 75%);border-radius:6px}.sun{width:min(30vw,135px);height:min(30vw,135px);max-height:85%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 36% 32%,#fff9df,#e8d3a0 45%,#bc7e62 82%,#714b49);box-shadow:0 0 38px #c5a27042,0 0 85px #c5a27015}.planet{position:absolute;top:50%;left:50%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#4d647b,#070e18 70%);box-shadow:0 0 0 1px #a9c9dd50;transform:translate(-50%,-50%)}.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.read{border:1px solid #263e51;border-radius:5px;padding:6px;text-align:center}.read strong{display:block;font:700 15px monospace;color:#f1dfb2}.read span{font:9px monospace;color:#81a8b9}.curve{height:31%;min-height:85px}.controls{display:flex;gap:8px;align-items:center}.controls input{flex:1;min-width:0;accent-color:#d7b87c}.controls button,.nav button{background:#183047;color:#bfe0ef;border:1px solid #38576a;border-radius:5px;padding:8px 10px;font:700 11px monospace}.nav{display:flex;gap:5px}.nav button.active{background:#3a5364;color:white}.detail{font:11px monospace;color:#aac3cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{font:9px monospace;color:#789aac}.error{color:#e9a27c}@media(max-width:620px){.app{padding:6px;gap:6px}.main{grid-template-columns:1fr;grid-template-rows:1.05fr .95fr;gap:6px}.left,.right{gap:6px}.panel{padding:7px}.brand{font-size:15px}.sub,.status{font-size:9px}.curve{height:38%;min-height:60px}.star{min-height:60px}.sun{width:min(24vw,105px);height:min(24vw,105px)}.read strong{font-size:12px}.read span{font-size:8px}.readouts{margin-top:3px}.tag{font-size:9px}.controls button{padding:6px}.bottom{font-size:8px}}@media(max-height:680px){.app{gap:4px}.main,.left,.right{gap:4px}.panel{padding:5px}.panelhead{margin-bottom:2px}.read{padding:3px}.curve{min-height:50px}.brand{font-size:14px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">✦ OBSERVATORY</div><div class="sub">JIT / TRANSIT SURVEY / 01</div></div><div class="status"><span id="led" class="dot"></span><span id="status">CONNECTING</span></div></header><div class="main"><div class="left"><section class="panel" style="flex:1"><div class="panelhead"><span class="tag">01 / EXOPLANET FIELD</span><span class="pill" id="count">—</span></div><div class="plot"><canvas id="scatter" aria-label="Scatter plot of real NASA exoplanet archive orbital periods and radii"></canvas></div><div class="controls"><span class="tag">PERIOD</span><input type="range" id="period" min="0" max="100" value="100" aria-label="Maximum orbital period"><span class="pill" id="periodValue">ALL</span></div></section></div><div class="right"><section class="panel" style="flex:1"><div class="panelhead"><span class="tag">02 / SELECTED WORLD</span><span class="pill" id="index">—</span></div><div class="detail" id="name">Waiting for catalog…</div><div class="star" id="star"><div class="sun"></div><div class="planet" id="planet"></div></div><div class="readouts"><div class="read"><strong id="days">—</strong><span>DAYS / ORBIT</span></div><div class="read"><strong id="radius">—</strong><span>EARTH RADII</span></div><div class="read"><strong id="depth">—</strong><span>DEPTH / ppm</span></div></div></section><section class="panel curve"><div class="panelhead"><span class="tag">03 / TRANSIT SHAPE</span><span class="pill">IDEALIZED MODEL</span></div><div class="plot"><canvas id="lightcurve"></canvas></div></section><div class="nav"><button id="prev" aria-label="Previous planet">◀</button><button id="next" aria-label="Next planet">▶</button><button id="random" style="flex:1">✧ EXPLORE</button><button id="reload" aria-label="Reload data">↻</button></div></div></div><footer class="bottom"><span id="source">SOURCE · NASA EXOPLANET ARCHIVE / TAP</span><span>REAL CATALOG · SYNTHETIC TRANSIT</span></footer></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x),sc=$('scatter'),lc=$('lightcurve'),S=sc.getContext('2d'),L=lc.getContext('2d');let data=[],shown=[],selected=null,t=0,animation=0,loaded=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=(v,n=1)=>Number.isFinite(v)?v.toFixed(n):'—';const q="select+top+400+pl_name,hostname,pl_orbper,pl_rade,pl_trandep+from+pscomppars+where+tran_flag=1+and+pl_orbper+is+not+null+and+pl_rade+is+not+null+and+pl_orbper>0+and+pl_rade>0+order+by+pl_orbper+asc";const url='https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query='+q+'&format=json';function size(canvas){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(r.width*d)||canvas.height!==Math.round(r.height*d)){canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d)}const c=canvas.getContext('2d');c.setTransform(d,0,0,d,0,0);return [r.width,r.height]}function filter(){let max=Math.pow(10,.1+(+$('period').value/100)*3.9);shown=data.filter(p=>p.pl_orbper<=max);$('periodValue').textContent=max>=9000?'ALL':max<10?fmt(max,1)+'d':Math.round(max)+'d';$('count').textContent=shown.length+' / '+data.length;if(!shown.includes(selected))select(shown[0]||null);draw()}function select(p){selected=p;$('name').textContent=p?p.pl_name:'NO MATCH';$('index').textContent=p?String(data.indexOf(p)+1).padStart(3,'0'):'—';$('days').textContent=p?fmt(p.pl_orbper,2):'—';$('radius').textContent=p?fmt(p.pl_rade,2):'—';$('depth').textContent=p&&Number.isFinite(p.pl_trandep)?Math.round(p.pl_trandep*10000):'—';draw()}function draw(){let [w,h]=size(sc);S.clearRect(0,0,w,h);S.fillStyle='#0b1724';S.fillRect(0,0,w,h);let l=35,r=12,top=13,b=24,W=Math.max(1,w-l-r),H=Math.max(1,h-top-b);S.strokeStyle='#284153';S.lineWidth=1;S.font='10px monospace';S.fillStyle='#6e9aad';for(let i=0;i<=4;i++){let y=top+H*i/4;S.beginPath();S.moveTo(l,y);S.lineTo(w-r,y);S.stroke();S.fillText(String(20-i*5),5,y+3)}for(let i=0;i<=4;i++){let x=l+W*i/4;S.beginPath();S.moveTo(x,top);S.lineTo(x,top+H);S.stroke();S.fillText(['0.1','1','10','100','1000'][i],x-8,h-7)}for(let p of shown){let x=l+clamp((Math.log10(p.pl_orbper)+1)/4,0,1)*W,y=top+H*(1-clamp(p.pl_rade/20,0,1));p._x=x;p._y=y;S.beginPath();S.arc(x,y,p===selected?5:2.3,0,Math.PI*2);S.fillStyle=p===selected?'#ffdf9c':'#73b9cf99';S.fill();if(p===selected){S.strokeStyle='#ffdf9c88';S.beginPath();S.arc(x,y,9,0,Math.PI*2);S.stroke()}}S.fillStyle='#7297a9';S.fillText('R⊕',4,10);S.fillText('P / DAYS',Math.max(0,w-73),h-7);drawCurve()}function drawCurve(){let [w,h]=size(lc);L.clearRect(0,0,w,h);L.fillStyle='#0b1724';L.fillRect(0,0,w,h);const d=selected&&Number.isFinite(selected.pl_trandep)?clamp(selected.pl_trandep/100,0,.2):selected?clamp(Math.pow(selected.pl_rade/110,2),.00005,.08):0;L.strokeStyle='#294558';for(let i=1;i<4;i++){L.beginPath();L.moveTo(0,h*i/4);L.lineTo(w,h*i/4);L.stroke()}L.strokeStyle='#c5d7c7';L.lineWidth=2;L.beginPath();for(let i=0;i<=w;i++){let x=i/w,z=(x-.5)/.12;let dip=selected?Math.exp(-Math.pow(Math.abs(z),8))*.66:0;let y=h*.22+dip*h*.6; i?L.lineTo(i,y):L.moveTo(i,y)}L.stroke();L.fillStyle='#a8c4cd';L.font='9px monospace';L.fillText(selected?'MODEL / DEPTH '+Math.round(d*1e6)+' ppm':'SELECT A WORLD',6,h-6)}function pointer(e){const rect=sc.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;let best=null,dist=Infinity;for(let p of shown){let dd=(p._x-x)**2+(p._y-y)**2;if(dd<dist){dist=dd;best=p}}if(best)select(best)}sc.addEventListener('pointerdown',pointer);$('period').oninput=filter;$('prev').onclick=()=>{if(shown.length)select(shown[(shown.indexOf(selected)-1+shown.length)%shown.length])};$('next').onclick=()=>{if(shown.length)select(shown[(shown.indexOf(selected)+1)%shown.length])};$('random').onclick=()=>{if(shown.length)select(shown[Math.floor(Math.random()*shown.length)])};$('reload').onclick=load;function tick(now){t=now/1000;const p=$('planet');const w=$('star').clientWidth;const depth=selected&&Number.isFinite(selected.pl_trandep)?selected.pl_trandep/100:0.01;const radius=clamp(Math.sqrt(depth)*100,9,26);p.style.width=radius+'px';p.style.height=radius+'px';p.style.left=(50+Math.sin(t*.5)*Math.min(42,16000/Math.max(w,1)))+'%';p.style.opacity=selected?'1':'0';animation=requestAnimationFrame(tick)}requestAnimationFrame(tick);window.addEventListener('resize',draw);async function load(){$('status').textContent='CONNECTING';$('led').className='dot';$('source').textContent='SOURCE · NASA EXOPLANET ARCHIVE / TAP';try{let controller=new AbortController();let timeout=setTimeout(()=>controller.abort(),14000);let res;try{res=await fetch(url,{signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timeout)}if(!res.ok)throw Error('HTTP '+res.status);let json=await res.json();if(!Array.isArray(json))throw Error('Unexpected catalog');data=json.map(p=>({...p,pl_orbper:Number(p.pl_orbper),pl_rade:Number(p.pl_rade),pl_trandep:p.pl_trandep===null?NaN:Number(p.pl_trandep)})).filter(p=>Number.isFinite(p.pl_orbper)&&Number.isFinite(p.pl_rade)&&p.pl_orbper>0&&p.pl_rade>0);if(!data.length)throw Error('Empty catalog');loaded=true;$('status').textContent='CATALOG ONLINE';$('led').className='dot ok';filter()}catch(e){loaded=false;data=[];shown=[];select(null);$('status').textContent='FEED UNAVAILABLE';$('status').className='status error';$('source').textContent='NASA TAP UNAVAILABLE · ↻ TO RETRY';$('count').textContent='0 / 0';console.warn('NASA TAP',e)}}load();
})();
</script></body></html>
