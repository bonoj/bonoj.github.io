<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermeticon / Sun–Earth Stack</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:12px Helvetica,Arial,sans-serif;background:white;color:#111}main{max-width:1200px;height:100dvh;margin:auto;padding:clamp(15px,3vw,34px);display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111;padding-bottom:14px}h1{font-size:24px;letter-spacing:-1px;margin:0}button{border:0;background:transparent;font-size:24px;cursor:pointer}#lanes{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;padding:16px 0}.lane{border-top:1px solid #aaa;display:grid;grid-template-columns:80px minmax(0,1fr) 80px;gap:8px;align-items:center;min-height:0}.stage{font-weight:bold;letter-spacing:.1em}.value{font-size:clamp(14px,3vw,28px);font-variant-numeric:tabular-nums}.detail{font-size:10px;color:#777;overflow-wrap:anywhere}.age{text-align:right;font-variant-numeric:tabular-nums}.trace{display:block;width:100%;height:clamp(20px,5vh,44px);margin-top:5px}.trace path{fill:none;stroke:#111;stroke-width:1.5;vector-effect:non-scaling-stroke}.bar{height:2px;background:#ddd;position:relative;margin-top:8px}.availability{height:4px;display:flex;overflow:hidden;margin-top:5px;background:#e7e7e7}.availability span{height:100%;display:block}.availability .lead{background:#c5c5c5}.availability .internal{background:#ad684b}.availability .tail{background:#777}.availability .observed{background:#d9e7df}.mark{position:absolute;width:5px;height:9px;top:-4px;background:#111}footer{border:0;border-top:1px solid #111;padding:10px 0 0;font-size:10px;color:#777}a{color:inherit}@media(max-width:500px){.lane{grid-template-columns:55px minmax(0,1fr) 52px}.detail{font-size:9px}.age{font-size:10px}}</style><main><header><h1>HERMETICON</h1><div><span id="status">STACK · ACQUIRING</span><button id="copy" aria-label="Copy observation report" title="Copy JSON">⧉</button><button id="eye" aria-label="Download observation report" title="Download JSON">👁</button></div></header><div id="lanes"></div><footer><span><a href="../solar/">SOLAR</a> · <a href="../l1/">L1</a> · <a href="../geo/">GEO</a> · STACK/14</span><span id="clock"></span></footer></main><script>
const build='stack/14';const feeds=[
{id:'solar',label:'SUN',url:'https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json',kind:'solar-Xray-measured-at-GEO',valueKey:'flux',unit:'W/m²',select:r=>r.energy==='0.1-0.8nm',source:r=>'GOES-'+r.satellite},
{id:'l1',label:'L1',url:'https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json',kind:'in-situ-upstream-magnetic',valueKey:'bz_gsm',unit:'nT GSM Bz',select:r=>r.active===true&&r.overall_quality===0,source:r=>r.source||'unknown'},
{id:'geo',label:'GEO',url:'https://services.swpc.noaa.gov/json/goes/primary/magnetometers-6-hour.json',kind:'geostationary-local-magnetic',valueKey:'total',unit:'nT local total',select:r=>r.arcjet_flag===false,source:r=>'GOES-'+(r.satellite||r.satellite_id||'?')}
];const report={schema:'hermeticon-stack-eye/v1',build,capturedAt:null,sourceRegistry:{},warnings:['Lanes are co-timed observations, NOT a continuous measured cone.','X-ray photons and CME plasma propagate on different timescales.','No lag, causal coupling or CME arrival inferred.','Ground Boulder K is a station-derived geomagnetic index, NOT a direct magnetic-field component or planetary Kp.','L1 and GEO use different magnetic frames and spatial locations.','Six-hour traces are individually scaled, not cross-lane comparable; Boulder K can repeat each minute without independent minute-resolution measurements.','Gaps over three minutes break trace segments; raw timestamp cadence is not instrument cadence.','Coverage diagnostics refer to the displayed six-hour window, not the full source history; minute-slot fraction is descriptive only.']};const lanes=document.getElementById('lanes');for(const f of feeds){const e=document.createElement('div');e.className='lane';e.innerHTML='<div class="stage">'+f.label+'</div><div><div class="value">—</div><div class="detail">WAITING</div><svg class="trace" viewBox="0 0 300 45" preserveAspectRatio="none"><path/></svg><div class="availability" aria-label="Timestamp availability"></div><div class="bar"><span class="mark" hidden></span></div></div><div class="age">—</div>';lanes.append(e);f.el=e}const ground=document.createElement('div');ground.className='lane';ground.innerHTML='<div class="stage">EARTH</div><div><div class="value">—</div><div class="detail">BOULDER · ACQUIRING</div><svg class="trace" viewBox="0 0 300 45" preserveAspectRatio="none"><path/></svg><div class="availability" aria-label="Timestamp availability"></div><div class="bar"><span class="mark" hidden></span></div></div><div class="age">—</div>';lanes.append(ground);const plot=(el,points,windowEnd)=>{const path=el.querySelector('.trace path');if(!path)return;const start=windowEnd-6*3600000;const selected=points.filter(p=>p.t>=start&&p.t<=windowEnd);if(selected.length<2){path.setAttribute('d','');return}const vals=selected.map(p=>p.v),lo=Math.min(...vals),hi=Math.max(...vals),span=Math.max(1e-12,hi-lo);let d='',previous=null;for(const p of selected){const x=300*(p.t-start)/(windowEnd-start),y=41-36*(p.v-lo)/span;if(previous!==null&&p.t-previous>180000)d+=' ';d+=(previous===null||p.t-previous>180000?'M':'L')+x.toFixed(2)+' '+y.toFixed(2);previous=p.t}path.setAttribute('d',d)};const coverage=(records,windowEnd=Date.now())=>{const windowStart=windowEnd-6*3600000;const windowRecords=records.filter(p=>p.t>=windowStart&&p.t<=windowEnd);const times=[...new Set(windowRecords.map(p=>p.t))].sort((a,b)=>a-b);const deltas=times.slice(1).map((t,i)=>t-times[i]);const sorted=deltas.slice().sort((a,b)=>a-b);const cadenceMs=sorted.length?sorted[Math.floor(sorted.length/2)]:null;return {firstAt:times.length?new Date(times[0]).toISOString():null,lastAt:times.length?new Date(times.at(-1)).toISOString():null,uniqueTimestamps:times.length,medianCadenceMs:cadenceMs,gapsOverThreeMinutes:deltas.filter(d=>d>180000).length,maxGapMs:deltas.length?Math.max(...deltas):null,distinctValues:new Set(windowRecords.map(p=>p.v)).size,windowStart:new Date(windowStart).toISOString(),windowEnd:new Date(windowEnd).toISOString(),windowPointCount:windowRecords.length,expectedOneMinuteSlots:360,coverageFractionOfMinuteSlots:times.length/360,sourceHistoryPointCount:records.length}};/* Lattice transport contract: one shared bounded governor, no parallel same-host requests. */
const transport=(()=>{const queue=[],inflight=new Map(),cache=new Map(),hosts=new Set(),due=new Map();let active=0,wake=null;const stats={started:0,ok:0,failed:0,deduped:0,cacheHits:0};function pump(){if(wake){clearTimeout(wake);wake=null}let soon=Infinity;for(let i=0;i<queue.length&&active<2;){const j=queue[i],when=due.get(j.host)||0;if(hosts.has(j.host)){i++;continue}if(Date.now()<when){soon=Math.min(soon,when);i++;continue}queue.splice(i,1);execute(j)}if(queue.length&&active<2&&Number.isFinite(soon))wake=setTimeout(pump,Math.max(10,soon-Date.now()))}
async function execute(j){active++;hosts.add(j.host);due.set(j.host,Date.now()+1000);stats.started++;const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),16000);try{const res=await fetch(j.url,{cache:'no-store',signal:ctl.signal,headers:{Accept:'application/json'}});if(!res.ok){const e=Error('HTTP '+res.status);e.status=res.status;e.retryAfter=res.headers.get('Retry-After');throw e}const raw=await res.text();if(raw.length>j.limit)throw Error('payload exceeds '+j.limit+' byte source-specific limit');const value={status:res.status,body:raw};cache.set(j.url,{value,expires:Date.now()+120000,fail:0});stats.ok++;j.resolve(value)}catch(e){stats.failed++;const prior=cache.get(j.url)||{fail:0};const fail=(prior.fail||0)+1;let delay=Math.min(3600000,30000*2**Math.min(fail,7));if(e.retryAfter){const n=Number(e.retryAfter);delay=Math.max(delay,Number.isFinite(n)?n*1000:Math.max(0,Date.parse(e.retryAfter)-Date.now())||0)}cache.set(j.url,{...prior,fail,expires:Date.now()+delay,error:String(e)});j.reject(e)}finally{clearTimeout(timer);active--;hosts.delete(j.host);inflight.delete(j.url);pump()}}
function request(url,limit){const u=new URL(url);if(u.protocol!=='https:')return Promise.reject(Error('HTTPS only'));const c=cache.get(url),now=Date.now();if(c&&now<c.expires){if(c.value){stats.cacheHits++;return Promise.resolve(c.value)}return Promise.reject(Error(c.error||'backoff'))}if(inflight.has(url)){stats.deduped++;return inflight.get(url)}if(queue.length>=64)return Promise.reject(Error('governor queue full'));let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b});inflight.set(url,promise);queue.push({url,host:u.host,limit,resolve,reject});pump();return promise}
function snapshot(){return {...stats,active,queued:queue.length,hostsActive:[...hosts],endpoints:[...cache].map(([url,c])=>({url,expiresAt:c.expires,failures:c.fail||0,error:c.error||null}))}}return {request,snapshot}})();
const groundUrl='https://services.swpc.noaa.gov/json/boulder_k_index_1m.json';async function acquireGround(){const st={url:groundUrl,kind:'ground-derived-local-K-index',station:'Boulder',http:null,status:'FETCHING',records:0,eligible:0,latest:null,error:null,keys:[],sample:null};report.sourceRegistry.earth=st;try{const response=await transport.request(groundUrl,250000);st.http=response.status;const raw=response.body;st.bytes=raw.length;const rows=JSON.parse(raw);if(!Array.isArray(rows))throw Error('expected array');st.records=rows.length;st.keys=Object.keys(rows[0]||{});st.sample=rows.at(-1)||null;const candidates=['k_index','k','k_value','estimated_k','estimated_k_index','k_index_estimated','kindex'];const keys=st.keys;const field=candidates.find(k=>keys.includes(k))||keys.find(k=>/^k(_index|_value)?$/i.test(k));st.field=field||null;if(!field)throw Error('unknown K schema: '+keys.join(','));const records=rows.map(r=>({r,t:ts(r),v:Number(r[field])})).filter(x=>x.t!==null&&x.t<=Date.now()+60000&&x.r[field]!==null&&x.r[field]!==''&&Number.isFinite(x.v)&&x.v>=0&&x.v<=9).sort((a,b)=>a.t-b.t);st.eligible=records.length;st.coverage=coverage(records);st.trace=records.filter(p=>p.t>=Date.now()-6*3600000).map(p=>({observedAt:new Date(p.t).toISOString(),value:p.v}));plot(ground,records,Date.now());const item=records.at(-1);if(!item)throw Error('no eligible ground K observations');const ageMs=Date.now()-item.t;st.latest={observedAt:new Date(item.t).toISOString(),sourceTimeTag:item.r.time_tag||item.r.time,value:item.v,unit:'Boulder K (dimensionless)',ageMs,raw:item.r};st.status=ageMs<=30*60000?'RECENT_DATA':'STALE';ground.querySelector('.value').textContent=item.v.toFixed(2)+' K';ground.querySelector('.detail').textContent='BOULDER · '+st.latest.observedAt+' · '+st.status;ground.querySelector('.age').textContent=Math.round(ageMs/60000)+'m';const marker=ground.querySelector('.mark');marker.hidden=false;marker.style.left=Math.max(0,Math.min(99,100-ageMs/(6*3600000)*100))+'%'}catch(e){st.status='ERROR';st.error=String(e);ground.querySelector('.detail').textContent='GROUND SCHEMA / SOURCE UNVERIFIED';}}const valid=n=>typeof n==='number'&&Number.isFinite(n)&&n>-99900&&n!==-9999&&Math.abs(n)<1e10;const ts=r=>{const raw=r.time_tag||r.time||'';if(typeof raw!=='string')return null;const utc=/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?$/.test(raw)?raw+'Z':raw;const t=Date.parse(utc);return Number.isFinite(t)?t:null};async function one(f){const state={url:f.url,kind:f.kind,startedAt:new Date().toISOString(),http:null,records:0,eligible:0,status:'FETCHING',latest:null,error:null};report.sourceRegistry[f.id]=state;try{const response=await transport.request(f.url,f.id==='l1'?2500000:800000);state.http=response.status;const raw=response.body;state.bytes=raw.length;const rows=JSON.parse(raw);if(!Array.isArray(rows))throw Error('not an array');state.records=rows.length;const eligible=rows.filter(r=>f.select(r)&&valid(r[f.valueKey])&&ts(r)!==null&&ts(r)<=Date.now()+60000).sort((a,b)=>ts(a)-ts(b));state.eligible=eligible.length;const points=eligible.map(r=>({t:ts(r),v:r[f.valueKey]}));state.coverage=coverage(points);state.trace=points.filter(p=>p.t>=Date.now()-6*3600000).map(p=>({observedAt:new Date(p.t).toISOString(),value:p.v}));plot(f.el,points,Date.now());const r=eligible.at(-1);if(!r)throw Error('no eligible measurements; inspect field mapping and quality');const ageMs=Date.now()-ts(r);state.latest={observedAt:new Date(ts(r)).toISOString(),sourceTimeTag:r.time_tag||r.time,value:r[f.valueKey],unit:f.unit,source:f.source(r),ageMs,quality:{overall_quality:r.overall_quality??null,arcjet_flag:r.arcjet_flag??null},raw:r};state.status=ageMs<20*60000?'RECENT_DATA':'STALE';f.el.querySelector('.value').textContent=Number(r[f.valueKey]).toPrecision(4)+' '+f.unit;f.el.querySelector('.detail').textContent=state.latest.source+' · '+state.latest.observedAt+' · '+state.status;f.el.querySelector('.age').textContent=Math.round(ageMs/60000)+'m';const marker=f.el.querySelector('.mark');marker.hidden=false;marker.style.left=Math.max(0,Math.min(99,100-ageMs/(6*3600000)*100))+'%'}catch(e){state.status='ERROR';state.error=String(e);f.el.querySelector('.detail').textContent='UNAVAILABLE · '+String(e).slice(0,80)}}async function refresh(){document.getElementById('status').textContent='STACK · ACQUIRING';await Promise.all([one(feeds[0]),one(feeds[1])]);await Promise.all([one(feeds[2]),acquireGround()]);report.refreshedAt=new Date().toISOString();document.getElementById('status').textContent='STACK · '+[...feeds.map(f=>f.id),'earth'].filter(id=>report.sourceRegistry[id]?.status==='RECENT_DATA').length+'/4 RECENT';document.getElementById('clock').textContent=new Date().toISOString().slice(11,19)+' UTC'}const align=()=>{const ids=['solar','l1','geo','earth'];const ends=ids.map(id=>Date.parse(report.sourceRegistry[id]?.coverage?.windowEnd)).filter(Number.isFinite);const acquisitionEnd=ends.length?Math.min(...ends):Date.now();const end=Math.floor(acquisitionEnd/60000)*60000,start=end-360*60000;const slots=Array.from({length:360},(_,i)=>start+i*60000);const masks={},sets={};for(const id of ids){const s=report.sourceRegistry[id],times=new Set((s?.trace||[]).map(p=>Date.parse(p.observedAt)).filter(t=>Number.isFinite(t)&&t>=start&&t<end).map(t=>Math.floor(t/60000)*60000));sets[id]=times;const observed=slots.map(t=>times.has(t));const missingRuns=[];let from=-1;observed.forEach((yes,i)=>{if(!yes&&from<0)from=i;if(from>=0&&(yes||i===359)){const to=yes?i-1:i;missingRuns.push({startAt:new Date(slots[from]).toISOString(),endAt:new Date(slots[to]).toISOString(),slots:to-from+1});from=-1}});const first=observed.indexOf(true),last=observed.lastIndexOf(true);const leading=first<0?360:first,trailing=last<0?0:359-last;const internal=first<0?0:observed.slice(first,last+1).filter(x=>!x).length;const latest=Date.parse(s?.latest?.observedAt);masks[id]={observedMinuteSlots:times.size,missingMinuteSlots:360-times.size,missingRuns,missingness:{leadingBeforeFirstObservation:leading,internalBetweenObservations:internal,trailingAfterLastObservation:trailing,latestObservationAgeMs:Number.isFinite(latest)?Math.max(0,Date.now()-latest):null,classification:first<0?'NO_OBSERVATIONS':'BOUNDARY_AND_INTERNAL',note:'Leading/trailing bins describe source window availability, not proven outages; trailing bins may include reporting delay.'},rawDistinctValues:s?.coverage?.distinctValues??null,rawMedianTimestampCadenceMs:s?.coverage?.medianCadenceMs??null,semantics:id==='earth'?'Repeated station K values are not independent minute-resolution field measurements':id==='solar'?'X-ray flux measured at GEO':id==='l1'?'Upstream point sample, GSM Bz':'Local GEO total field, not comparable directly to GSM Bz'};}const all=slots.filter(t=>ids.every(id=>sets[id].has(t))).length;return {kind:'timestamp-coincidence-only',binConvention:'360 fully elapsed UTC minute bins [start,end); acquisition end is floored to UTC minute; partial current minute excluded',windowStart:new Date(start).toISOString(),windowEnd:new Date(end).toISOString(),acquisitionWindowEnd:new Date(acquisitionEnd).toISOString(),minuteSlots:360,allFourObservedMinuteSlots:all,lanes:masks,warnings:['Missing slots classify observed timestamp availability, not instrument outages.','No interpolation, time shifting, lag or causality inferred.']}};const paintAvailability=()=>{const a=align(),els=[...feeds.map(f=>f.el),ground];['solar','l1','geo','earth'].forEach((id,i)=>{const el=els[i].querySelector('.availability'),lane=a.lanes[id],m=lane.missingness;if(!el)return;const n=360;el.replaceChildren();const runs=[['lead',m.leadingBeforeFirstObservation],['observed',n-m.leadingBeforeFirstObservation-m.trailingAfterLastObservation],['tail',m.trailingAfterLastObservation]];for(const [cls,count] of runs){if(!count)continue;const span=document.createElement('span');span.className=cls;span.style.width=100*count/n+'%';el.append(span)}const internals=lane.missingRuns.filter(run=>Date.parse(run.startAt)>=Date.parse(a.windowStart)+m.leadingBeforeFirstObservation*60000&&Date.parse(run.endAt)<Date.parse(a.windowEnd)-m.trailingAfterLastObservation*60000);for(const run of internals){const gap=document.createElement('span');gap.className='internal';gap.style.position='absolute';gap.style.left=100*(Date.parse(run.startAt)-Date.parse(a.windowStart))/(360*60000)+'%';gap.style.width=100*run.slots/360+'%';el.append(gap)}el.style.position='relative';el.title='UTC minute slots · '+lane.observedMinuteSlots+' observed · '+m.leadingBeforeFirstObservation+' leading · '+m.internalBetweenObservations+' internal · '+m.trailingAfterLastObservation+' trailing';el.setAttribute('aria-label',el.title)})};const refreshWithAvailability=refresh;refresh=async()=>{await refreshWithAvailability();paintAvailability()};const sourceRegistrySnapshot=()=>({schema:'observatory-source-registry/v1',generatedAt:new Date().toISOString(),entries:['solar','l1','geo','earth'].map(id=>{const s=report.sourceRegistry[id]||{};const latest=s.latest||{};return {id,provider:'NOAA SWPC',endpoint:s.url||null,measurementKind:s.kind||null,platform:latest.source||s.station||null,observedAtUTC:latest.observedAt||null,fetchedAtUTC:report.refreshedAt||null,unit:latest.unit||null,quality:latest.quality||null,http:s.http||null,status:s.status||'UNKNOWN',ageMs:latest.ageMs??null,recordCount:s.records||0,error:s.error||null}}),candidates:[{id:'l1-plasma',endpoint:'https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json',lifecycle:'CANDIDATE',note:'Separate L1 wall; not yet integrated'},{id:'goes-secondary',lifecycle:'CANDIDATE',note:'Unverified candidate family'}]});const observation=()=>{report.alignment=align();report.registry=sourceRegistrySnapshot();paintAvailability();report.transport=transport.snapshot();report.capturedAt=new Date().toISOString();return JSON.stringify(report,null,2)};document.getElementById('eye').onclick=()=>{try{const payload=observation(),blob=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hermeticon-stack-'+build.replace('/','-')+'-'+report.capturedAt.replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);document.getElementById('status').textContent='STACK · 👁 DOWNLOADED'}catch(e){document.getElementById('status').textContent='STACK · DOWNLOAD FAILED'}};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(observation());document.getElementById('status').textContent='STACK · ⧉ COPIED'}catch(e){document.getElementById('status').textContent='STACK · COPY FAILED'}};refresh();setInterval(()=>{if(!document.hidden)refresh()},120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
