<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermeticon / Sun–Earth Stack</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:12px Helvetica,Arial,sans-serif;background:white;color:#111}main{max-width:1200px;height:100dvh;margin:auto;padding:clamp(15px,3vw,34px);display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111;padding-bottom:14px}h1{font-size:24px;letter-spacing:-1px;margin:0}button{border:0;background:transparent;font-size:24px;cursor:pointer}#lanes{flex:1;min-height:0;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:10px;padding:16px 0}.lane{border-top:1px solid #aaa;display:grid;grid-template-columns:80px minmax(0,1fr) 80px;gap:8px;align-items:center;min-height:0}.stage{font-weight:bold;letter-spacing:.1em}.value{font-size:clamp(14px,3vw,28px);font-variant-numeric:tabular-nums}.detail{font-size:10px;color:#777;overflow-wrap:anywhere}.age{text-align:right;font-variant-numeric:tabular-nums}.bar{height:2px;background:#ddd;position:relative;margin-top:8px}.mark{position:absolute;width:5px;height:9px;top:-4px;background:#111}footer{border:0;border-top:1px solid #111;padding:10px 0 0;font-size:10px;color:#777}a{color:inherit}@media(max-width:500px){.lane{grid-template-columns:55px minmax(0,1fr) 52px}.detail{font-size:9px}.age{font-size:10px}}</style><main><header><h1>HERMETICON</h1><div><span id="status">STACK · ACQUIRING</span><button id="eye" aria-label="Copy observation report">👁</button></div></header><div id="lanes"></div><footer><span><a href="../solar/">SOLAR</a> · <a href="../l1/">L1</a> · <a href="../geo/">GEO</a> · STACK/02</span><span id="clock"></span></footer></main><script>
const build='stack/02';const feeds=[
{id:'solar',label:'SUN',url:'https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json',kind:'solar-Xray-measured-at-GEO',valueKey:'flux',unit:'W/m²',select:r=>r.energy==='0.1-0.8nm',source:r=>'GOES-'+r.satellite},
{id:'l1',label:'L1',url:'https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json',kind:'in-situ-upstream-magnetic',valueKey:'bz_gsm',unit:'nT GSM Bz',select:r=>r.active===true&&r.overall_quality===0,source:r=>r.source||'unknown'},
{id:'geo',label:'GEO',url:'https://services.swpc.noaa.gov/json/goes/primary/magnetometers-6-hour.json',kind:'geostationary-local-magnetic',valueKey:'total',unit:'nT local total',select:r=>r.arcjet_flag===false,source:r=>'GOES-'+(r.satellite||r.satellite_id||'?')}
];const report={schema:'hermeticon-stack-eye/v1',build,capturedAt:null,sourceRegistry:{},warnings:['Lanes are co-timed observations, NOT a continuous measured cone.','X-ray photons and CME plasma propagate on different timescales.','No lag, causal coupling or CME arrival inferred.','Ground layer is NOT YET ACQUIRED.','L1 and GEO use different magnetic frames and spatial locations.']};const lanes=document.getElementById('lanes');for(const f of feeds){const e=document.createElement('div');e.className='lane';e.innerHTML='<div class="stage">'+f.label+'</div><div><div class="value">—</div><div class="detail">WAITING</div><div class="bar"><span class="mark" hidden></span></div></div><div class="age">—</div>';lanes.append(e);f.el=e}const ground=document.createElement('div');ground.className='lane';ground.innerHTML='<div class="stage">EARTH</div><div><div class="value">UNINSTRUMENTED</div><div class="detail">No measured ground feed yet</div><div class="bar"></div></div><div class="age">—</div>';lanes.append(ground);const valid=n=>typeof n==='number'&&Number.isFinite(n)&&n>-99900&&n!==-9999&&Math.abs(n)<1e10;const ts=r=>{const t=Date.parse(r.time_tag||r.time||'');return Number.isFinite(t)?t:null};async function one(f){const state={url:f.url,kind:f.kind,startedAt:new Date().toISOString(),http:null,records:0,eligible:0,status:'FETCHING',latest:null,error:null};report.sourceRegistry[f.id]=state;const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),16000);try{const response=await fetch(f.url,{cache:'no-store',signal:ctl.signal});state.http=response.status;if(!response.ok)throw Error('HTTP '+response.status);const raw=await response.text();state.bytes=raw.length;const byteLimit=f.id==='l1'?2500000:800000;if(raw.length>byteLimit)throw Error('payload exceeds '+byteLimit+' byte source-specific limit');const rows=JSON.parse(raw);if(!Array.isArray(rows))throw Error('not an array');state.records=rows.length;const eligible=rows.filter(r=>f.select(r)&&valid(r[f.valueKey])&&ts(r)!==null&&ts(r)<=Date.now()+60000).sort((a,b)=>ts(a)-ts(b));state.eligible=eligible.length;const r=eligible.at(-1);if(!r)throw Error('no eligible measurements; inspect field mapping and quality');const ageMs=Date.now()-ts(r);state.latest={observedAt:r.time_tag||r.time,value:r[f.valueKey],unit:f.unit,source:f.source(r),ageMs,quality:{overall_quality:r.overall_quality??null,arcjet_flag:r.arcjet_flag??null},raw:r};state.status=ageMs<20*60000?'RECENT_DATA':'STALE';f.el.querySelector('.value').textContent=Number(r[f.valueKey]).toPrecision(4)+' '+f.unit;f.el.querySelector('.detail').textContent=state.latest.source+' · '+state.latest.observedAt+' · '+state.status;f.el.querySelector('.age').textContent=Math.round(ageMs/60000)+'m';const marker=f.el.querySelector('.mark');marker.hidden=false;marker.style.left=Math.max(0,Math.min(99,100-ageMs/(6*3600000)*100))+'%'}catch(e){state.status='ERROR';state.error=String(e);f.el.querySelector('.detail').textContent='UNAVAILABLE · '+String(e).slice(0,80)}finally{clearTimeout(timer)}}async function refresh(){document.getElementById('status').textContent='STACK · ACQUIRING';await Promise.all([one(feeds[0]),one(feeds[1])]);await one(feeds[2]);report.refreshedAt=new Date().toISOString();document.getElementById('status').textContent='STACK · '+feeds.filter(f=>report.sourceRegistry[f.id]?.status==='RECENT_DATA').length+'/3 RECENT';document.getElementById('clock').textContent=new Date().toISOString().slice(11,19)+' UTC'}document.getElementById('eye').onclick=async()=>{report.capturedAt=new Date().toISOString();try{await navigator.clipboard.writeText(JSON.stringify(report,null,2));document.getElementById('status').textContent='STACK · 👁 COPIED'}catch(e){document.getElementById('status').textContent='STACK · COPY FAILED'}};refresh();setInterval(()=>{if(!document.hidden)refresh()},120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></html>
