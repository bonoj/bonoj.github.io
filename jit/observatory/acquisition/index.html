<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Observatory · Acquisition</title><style>body{font:14px Helvetica,Arial,sans-serif;background:#fff;color:#111;margin:24px;max-width:850px}h1{font-size:24px}button{padding:12px;border:1px solid #111;background:white}section{border-top:1px solid #bbb;margin-top:20px;padding-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px monospace;background:#f4f4f4;padding:12px}small{color:#555}</style><h1>Observatory / acquisition</h1><p>Real provider requests only. No simulated readings. Browser CORS and HTTP errors reported.</p><button id="run">Acquire three experiments</button><small id="clock"></small><div id="results"></div><script>
const now=new Date(),stop=now.toISOString(),start=new Date(now-6*3600000).toISOString(),fmt=t=>t.slice(0,19)+'Z';
const sources=[
{name:'Cosmic Flux · NMDB SOPO',url:'https://www.nmdb.eu/nest/draw_graph.php?formchk=1&stations%5B%5D=SOPO&output=ascii&tabchoice=ori&dtype=uncorrected&date_choice=last&last_days=1&last_label=days_label&yunits=0&tresolution=0',kind:'text'},
{name:'Geomagnetic Response · INTERMAGNET ABK',url:'https://imag-data.bgs.ac.uk/GIN_V1/hapi/data?id=ABK/best-avail/PT1M/xyzf&time.min='+encodeURIComponent(fmt(start))+'&time.max='+encodeURIComponent(fmt(stop))+'&format=json',kind:'json'},
{name:'Geomagnetic Response · Kyoto',url:'https://wdc.kugi.kyoto-u.ac.jp/hapi/catalog',kind:'json'},
{name:'Abyssal Exchange · OOI ERDDAP search',url:'https://erddap.dataexplorer.oceanobservatories.org/erddap/search/index.json?page=1&itemsPerPage=20&searchFor=GI01SUMO+oxygen',kind:'json'}
];
const host=document.getElementById('results');async function run(){host.replaceChildren();document.getElementById('clock').textContent=' '+new Date().toISOString();await Promise.all(sources.map(async s=>{const el=document.createElement('section');el.innerHTML='<strong></strong><pre>Requesting…</pre>';el.querySelector('strong').textContent=s.name;host.append(el);const out=el.querySelector('pre');const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);try{const r=await fetch(s.url,{signal:c.signal,cache:'no-store'}),raw=await r.text();let parsed;try{parsed=JSON.parse(raw)}catch{}const preview=parsed?JSON.stringify(parsed).slice(0,1400):raw.slice(0,1400);out.textContent=JSON.stringify({url:s.url,status:r.status,ok:r.ok,contentType:r.headers.get('content-type'),bytes:raw.length,preview},null,2)}catch(e){out.textContent=JSON.stringify({url:s.url,error:String(e),note:'Browser network or CORS failure; not a verified measurement'},null,2)}finally{clearTimeout(timer)}}))}
document.getElementById('run').onclick=run;run();
</script>
