<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>Diff Eq · Pocket Lab</title>
<style>
:root{color-scheme:dark;--bg:#0d1520;--panel:#172637;--edge:#345069;--ink:#f1f5f9;--muted:#afc3d2;--cyan:#83e0e6;--orange:#ffbf7b;--green:#b2f0bb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}body{background:radial-gradient(circle at 50% 0%,#23435a,var(--bg) 70%);color:var(--ink);font:14px/1.25 system-ui,sans-serif}main{height:100vh;height:100dvh;max-width:1100px;margin:auto;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font:clamp(25px,5vw,38px)/1 Georgia,serif;margin:0}.sub{font-size:11px;color:var(--muted);text-align:right}.layout{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;min-height:0}.panel{background:linear-gradient(145deg,#1b2e40,#111d2b);border:1px solid var(--edge);border-radius:14px;padding:10px;min-height:0}.section-title{font-size:11px;color:var(--cyan);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}button{font:inherit;color:var(--ink);background:#263e52;border:1px solid #42617a;border-radius:10px;padding:7px 6px;min-height:43px;touch-action:manipulation;cursor:pointer}button[aria-pressed=true]{background:#c8f0e9;color:#122832;border-color:#c8f0e9;font-weight:800}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}.mode-name{display:block;font-weight:800;font-size:12px}.mode-eq{display:block;font-size:11px;opacity:.8}.plot-panel{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:5px}.plot-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.equation{font:20px Georgia,serif;color:var(--cyan)}.plot-caption{font-size:11px;color:var(--muted);text-align:right}canvas{display:block;width:100%;height:100%;min-height:0;border-radius:9px;background:#0b1826;touch-action:none}.readout{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.readout strong{color:var(--green)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.control{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;min-width:0}.control label{font-size:12px;font-weight:750}.control output{color:var(--orange);font-variant-numeric:tabular-nums}.control input{grid-column:1/-1;width:100%;accent-color:var(--cyan);height:26px;margin:0}.explain{grid-column:1/-1;color:var(--muted);font-size:12px;min-height:27px}.footer{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}a{color:var(--cyan)}
@media(min-width:760px){.layout{grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}.mode-panel{grid-column:1;grid-row:1}.modes{grid-template-columns:1fr}.plot-panel{grid-column:2;grid-row:1/3}.controls{grid-column:1;grid-row:2;grid-template-columns:1fr}.explain{font-size:13px}.mode-name{font-size:14px}.mode-eq{font-size:12px}}
@media(max-height:690px){main{gap:5px;padding-top:5px;padding-bottom:5px}.layout{gap:5px}.panel{padding:7px}.section-title{margin-bottom:4px}.modes button{min-height:36px;padding:3px}.equation{font-size:17px}.readout{font-size:11px}.control input{height:19px}.explain{font-size:11px;min-height:22px}.footer{display:none}}
@media(max-height:520px){.sub,.mode-eq,.section-title{display:none}.modes button{min-height:32px}.controls{gap:4px}.explain{min-height:0}}
</style></head><body><main><header><h1>Diff Eq <span aria-hidden="true">∿</span></h1><div class="sub">A pocket laboratory<br>Change a rule. Watch a solution.</div></header>
<div class="layout"><section class="panel mode-panel"><div class="section-title">1 · Choose a system</div><div class="modes" id="modes" role="group" aria-label="Differential equation examples"></div></section>
<section class="panel plot-panel"><div class="plot-heading"><div class="equation" id="equation"></div><div class="plot-caption" id="plotCaption"></div></div><canvas id="plot" role="img" aria-label="Graph of a differential equation solution and direction field"></canvas><div class="readout"><span id="readout"></span><span id="legend"></span></div></section>
<section class="panel controls"><div class="control"><label for="initial" id="initialLabel">Initial value</label><output id="initialValue" for="initial"></output><input id="initial" type="range" min="-3" max="3" step=".1" value="1"></div><div class="control"><label for="rate" id="rateLabel">Rate</label><output id="rateValue" for="rate"></output><input id="rate" type="range" min="-2" max="2" step=".1" value=".7"></div><div class="explain" id="explain" aria-live="polite"></div></section></div>
<div class="footer">Illustrative mathematical models, not predictions of real systems. · Tap or drag the graph to move the initial condition. · <a href="../ion-garden/">Ion Garden</a></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const models=[
{id:'growth',name:'Growth & decay',short:'y′ = ky',eq:'y′ = ky',init:'y(0)',rate:'k',min:-2,max:2,step:.1,defaultRate:.7,defaultInit:1,range:5,explain:'The rate of change is proportional to the current amount. Positive k grows; negative k decays.',fn:(t,y,k)=>y*Math.exp(k*t),slope:(t,y,k)=>k*y},
{id:'equilibrium',name:'Approach a target',short:'y′ = k(2 − y)',eq:'y′ = k(2 − y)',init:'y(0)',rate:'k',min:.1,max:2,step:.1,defaultRate:.8,defaultInit:-1,range:5,explain:'The farther from 2, the faster the system moves toward it. A larger k means faster convergence.',fn:(t,y,k)=>2+(y-2)*Math.exp(-k*t),slope:(t,y,k)=>k*(2-y)},
{id:'oscillator',name:'Oscillation',short:'y″ + ω²y = 0',eq:'y″ + ω²y = 0',init:'y(0)',rate:'ω',min:.3,max:3,step:.1,defaultRate:1.3,defaultInit:2,range:4,explain:'A restoring force creates repeated motion. Here y′(0) = 0; ω changes frequency, not amplitude.',fn:(t,y,w)=>y*Math.cos(w*t),slope:null}
];
let mode=0,initial=1,rate=.7;
function fmt(n){return Number(n).toFixed(1).replace(/\.0$/,'')};
function select(i){mode=i;const m=models[i];initial=m.defaultInit;rate=m.defaultRate;$('initial').value=initial;$('rate').min=m.min;$('rate').max=m.max;$('rate').step=m.step;$('rate').value=rate;$('initialLabel').textContent=m.init;$('rateLabel').textContent=m.rate;renderModes();render()}
function renderModes(){$('modes').replaceChildren();models.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',String(i===mode));b.innerHTML='<span class="mode-name">'+m.name+'</span><span class="mode-eq">'+m.short+'</span>';b.onclick=()=>select(i);$('modes').append(b)})}
function render(){const m=models[mode];$('equation').textContent=m.eq;$('plotCaption').textContent=m.slope?'Direction field + solution':'Solution · zero initial velocity';$('initialValue').textContent=fmt(initial);$('rateValue').textContent=fmt(rate);$('explain').textContent=m.explain;$('readout').innerHTML='At t = 2: <strong>y = '+fmt(m.fn(2,initial,rate))+'</strong>';$('legend').textContent=m.slope?'↗ local slopes · ━ solution':'━ solution';draw()}
function draw(){const canvas=$('plot'),r=canvas.getBoundingClientRect();if(r.width<=50||r.height<=50)return;const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const W=r.width,H=r.height,m=models[mode],T=5,Y=m.range,pad=25;const X=t=>pad+(t+T)/(2*T)*(W-2*pad),Yp=y=>H/2-y/Y*(H/2-pad);c.clearRect(0,0,W,H);c.lineWidth=1;c.strokeStyle='#30475c';for(let t=-4;t<=4;t+=2){c.beginPath();c.moveTo(X(t),0);c.lineTo(X(t),H);c.stroke()}for(let y=-4;y<=4;y+=2){if(Math.abs(y)>Y)continue;c.beginPath();c.moveTo(0,Yp(y));c.lineTo(W,Yp(y));c.stroke()}c.strokeStyle='#8398a8';c.beginPath();c.moveTo(X(0),0);c.lineTo(X(0),H);c.moveTo(0,Yp(0));c.lineTo(W,Yp(0));c.stroke();c.fillStyle='#a9bdcc';c.font='10px system-ui';c.fillText('t',W-12,Yp(0)-6);c.fillText('y',X(0)+6,12);
if(m.slope){c.strokeStyle='#4c7084';c.lineWidth=1;for(let t=-4.5;t<=4.5;t+=1)for(let y=-4;y<=4;y+=1){const a=m.slope(t,y,rate)*(H/2-pad)/Y/((W-2*pad)/(2*T)),dx=7/Math.sqrt(1+a*a),dy=dx*a,xx=X(t),yy=Yp(y);c.beginPath();c.moveTo(xx-dx,yy+dy);c.lineTo(xx+dx,yy-dy);c.stroke()}}
c.save();c.beginPath();c.rect(0,0,W,H);c.clip();c.strokeStyle='#83e0e6';c.lineWidth=2.7;c.beginPath();let started=false;for(let i=0;i<=500;i++){const t=-T+i*2*T/500,y=m.fn(t,initial,rate);if(!Number.isFinite(y)||Math.abs(y)>1e7){started=false;continue}const x=X(t),v=Yp(y);if(!started){c.moveTo(x,v);started=true}else c.lineTo(x,v)}c.stroke();c.restore();c.fillStyle='#ffbf7b';c.beginPath();c.arc(X(0),Yp(initial),5,0,Math.PI*2);c.fill()}
$('initial').oninput=()=>{initial=Number($('initial').value);render()};$('rate').oninput=()=>{rate=Number($('rate').value);render()};
let activePointer=null;
function dragInitial(e){const r=$('plot').getBoundingClientRect(),m=models[mode],pad=25;if(r.height<=50)return false;const y=(r.height/2-(e.clientY-r.top))*m.range/(r.height/2-pad);const value=Math.max(-3,Math.min(3,Math.round(y*10)/10));if(!Number.isFinite(value))return false;initial=value;$('initial').value=initial;render();return true}
function finishDrag(e){if(activePointer!==e.pointerId)return;activePointer=null;if($('plot').hasPointerCapture?.(e.pointerId))$('plot').releasePointerCapture(e.pointerId)}
$('plot').addEventListener('pointerdown',e=>{if(activePointer!==null||e.isPrimary===false)return;if(!dragInitial(e))return;activePointer=e.pointerId;$('plot').setPointerCapture?.(e.pointerId)});
$('plot').addEventListener('pointermove',e=>{if(activePointer===e.pointerId)dragInitial(e)});
$('plot').addEventListener('pointerup',finishDrag);
$('plot').addEventListener('pointercancel',finishDrag);
$('plot').addEventListener('lostpointercapture',e=>{if(activePointer===e.pointerId)activePointer=null});
window.addEventListener('resize',draw);select(0);
function regression(){const near=(a,b)=>Math.abs(a-b)<1e-9;if(!near(models[0].fn(0,2,1),2)||!near(models[0].fn(1,2,0),2))throw Error('Growth initial/zero rate');if(!near(models[1].fn(0,-1,.8),-1)||!near(models[1].fn(100,-1,1),2))throw Error('Equilibrium');if(!near(models[2].fn(0,2,1),2)||!near(models[2].fn(Math.PI,2,1),-2))throw Error('Oscillator');for(const m of models)for(const y of [-3,0,3])for(const k of [m.min,m.max])if(!near(m.fn(0,y,k),y))throw Error('Initial condition '+m.id);return true}function differentialRegression(){const near=(a,b,tol)=>Math.abs(a-b)<=tol;let checks=0;for(const m of models){for(const y0 of [-3,-1,0,1,3])for(const k of [m.min,(m.min+m.max)/2,m.max]){if(!near(m.fn(0,y0,k),y0,1e-10))throw Error('Initial condition: '+m.id);checks++;for(const t of [-2,-1,0,1,2]){const h=1e-4,v=m.fn(t,y0,k);if(m.slope){const derivative=(m.fn(t+h,y0,k)-m.fn(t-h,y0,k))/(2*h);if(!near(derivative,m.slope(t,v,k),1e-4))throw Error('ODE mismatch: '+m.id)}else{const acceleration=(m.fn(t+h,y0,k)-2*v+m.fn(t-h,y0,k))/(h*h);if(!near(acceleration,-k*k*v,1e-5))throw Error('Oscillator mismatch')}checks++}}}return checks}
window.diffEqRegression=()=>regression()&&differentialRegression()>0;window.diffEqRegression();
</script></body></html>
