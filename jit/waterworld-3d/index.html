<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Waterworld 3D · physics laboratory</title><style>*{box-sizing:border-box}body{margin:0;background:#06101b;color:#e5d6b8;font:12px system-ui;overflow:hidden}canvas{display:block;touch-action:none}#ui{position:fixed;top:12px;left:12px;right:12px;pointer-events:none;text-shadow:0 2px 5px #000}h1{font:24px Georgia;margin:0}#stats{white-space:pre-line;margin-top:8px;font:12px/1.5 monospace}#controls{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:10px}button{background:#213744;color:#fff1d4;border:1px solid #a7b5b8;border-radius:8px;min-height:48px;padding:12px}#note{position:fixed;right:10px;top:12px;width:38%;max-width:180px;color:#c8d7d9;font:11px/1.4 system-ui;text-align:right}</style></head><body><div id="ui"><h1>WATERWORLD 3D</h1><div>EXPERIMENT A · VOLUMETRIC PARTICLE PHYSICS</div><div id="stats"></div></div><div id="note">Physics proof, not final water rendering. No heightfield or wall vertex clamping.</div><div id="controls"><button id="pulse">SLOSH</button><button id="reset">RESET</button><button id="fresh">↻ FRESH</button></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const R=8.8, N=1152, rad=.32, spacing=.51, H=.95, H2=H*H, DT=1/90;
const scene=new T.Scene();scene.background=new T.Color('#06101b');
const camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,6,27);camera.lookAt(0,-1,0);
const renderer=new T.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0x9bc5da,0x132d3b,2));const light=new T.DirectionalLight(0xffdbad,2);light.position.set(-8,12,10);scene.add(light);
const shell=new T.Mesh(new T.SphereGeometry(R+.18,48,32),new T.MeshPhysicalMaterial({color:0x9bd7e3,transparent:true,opacity:.10,roughness:.08,side:T.BackSide,depthWrite:false}));scene.add(shell);
const rim=new T.Mesh(new T.TorusGeometry(R+.18,.065,7,96),new T.MeshStandardMaterial({color:0xc6a36d,metalness:.8,roughness:.3}));rim.rotation.x=Math.PI/2;scene.add(rim);
const geo=new T.SphereGeometry(rad,7,5),mat=new T.MeshPhysicalMaterial({color:0x24b2d8,metalness:.08,roughness:.14,transparent:true,opacity:.77});
const mesh=new T.InstancedMesh(geo,mat,N);mesh.instanceMatrix.setUsage(T.DynamicDrawUsage);scene.add(mesh);
const pos=new Float32Array(N*3),prev=new Float32Array(N*3),vel=new Float32Array(N*3),temp=new Float32Array(N*3);
let steps=0,collisions=0,sloshCount=0,freeze=false,simMs=0;
function reset(){let k=0;for(let y=-7.2;y<-1.8&&k<N;y+=spacing)for(let z=-3.5;z<=3.5&&k<N;z+=spacing)for(let x=-3.5;x<=3.5&&k<N;x+=spacing){if(x*x+y*y+z*z>(R-rad-.2)**2)continue;const i=k++*3;pos[i]=x;pos[i+1]=y;pos[i+2]=z;}for(let i=k;i<N;i++){const a=i*3;pos[a]=0;pos[a+1]=-5;pos[a+2]=0}vel.fill(0);steps=0;collisions=0;sloshCount=0}
reset();
const buckets=new Map();const key=(x,y,z)=>x+','+y+','+z;
function grid(){buckets.clear();for(let i=0;i<N;i++){const a=i*3,k=key(Math.floor(pos[a]/H),Math.floor(pos[a+1]/H),Math.floor(pos[a+2]/H));let b=buckets.get(k);if(!b){b=[];buckets.set(k,b)}b.push(i)}}
function constrain(){for(let i=0;i<N;i++){const a=i*3,x=pos[a],y=pos[a+1],z=pos[a+2],r=Math.hypot(x,y,z),lim=R-rad*.9;if(r>lim){const s=lim/r;pos[a]=x*s;pos[a+1]=y*s;pos[a+2]=z*s;collisions++}}}
function step(){const t0=performance.now();
for(let i=0;i<N;i++){const a=i*3;prev[a]=pos[a];prev[a+1]=pos[a+1];prev[a+2]=pos[a+2];vel[a+1]-=9.8*DT;pos[a]+=vel[a]*DT;pos[a+1]+=vel[a+1]*DT;pos[a+2]+=vel[a+2]*DT}
constrain();
for(let iteration=0;iteration<3;iteration++){grid();temp.fill(0);
for(let i=0;i<N;i++){const a=i*3,x=pos[a],y=pos[a+1],z=pos[a+2],gx=Math.floor(x/H),gy=Math.floor(y/H),gz=Math.floor(z/H);
let dx=0,dy=0,dz=0;
for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++)for(let oz=-1;oz<=1;oz++){const b=buckets.get(key(gx+ox,gy+oy,gz+oz));if(!b)continue;for(const j of b){if(j===i)continue;const q=j*3,rx=x-pos[q],ry=y-pos[q+1],rz=z-pos[q+2],d2=rx*rx+ry*ry+rz*rz;const min=spacing*.94;if(d2>=min*min)continue;const d=Math.sqrt(Math.max(d2,1e-8)),push=(min-d)/d*.23;dx+=rx*push;dy+=ry*push;dz+=rz*push}}
temp[a]=dx;temp[a+1]=dy;temp[a+2]=dz}
for(let a=0;a<pos.length;a++)pos[a]+=temp[a];constrain()}
for(let i=0;i<N;i++){const a=i*3;for(let c=0;c<3;c++)vel[a+c]=(pos[a+c]-prev[a+c])/DT*.985}
steps++;simMs+=performance.now()-t0}
const dummy=new T.Object3D();function draw(){for(let i=0;i<N;i++){const a=i*3;dummy.position.set(pos[a],pos[a+1],pos[a+2]);dummy.updateMatrix();mesh.setMatrixAt(i,dummy.matrix)}mesh.instanceMatrix.needsUpdate=true}
let orbit=.35,elev=.18,dist=27,active=null;
renderer.domElement.addEventListener('pointerdown',e=>{active={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!active||active.id!==e.pointerId)return;orbit+=(e.clientX-active.x)*.006;elev=T.MathUtils.clamp(elev+(e.clientY-active.y)*.004,-.5,1.2);active.x=e.clientX;active.y=e.clientY});
renderer.domElement.addEventListener('pointerup',()=>active=null);
document.querySelector('#pulse').onclick=()=>{sloshCount++;for(let i=0;i<N;i++){const a=i*3;vel[a]+=2.4;vel[a+1]+=.5}};
document.querySelector('#reset').onclick=reset;
document.querySelector('#fresh').onclick=()=>{const u=new URL(location.href);u.searchParams.set('fresh',Date.now().toString(36));location.replace(u.href)};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
let last=performance.now(),acc=0,frames=0,fpsT=last,fps=0;
function frame(now){requestAnimationFrame(frame);acc=Math.min(.04,acc+(now-last)/1000);last=now;let n=0;while(acc>=DT&&n++<3){step();acc-=DT}draw();camera.position.set(Math.sin(orbit)*Math.cos(elev)*dist,Math.sin(elev)*dist+1,Math.cos(orbit)*Math.cos(elev)*dist);camera.lookAt(0,-1,0);renderer.render(scene,camera);frames++;if(now-fpsT>1000){fps=frames*1000/(now-fpsT);fpsT=now;frames=0;document.querySelector('#stats').textContent='FPS '+fps.toFixed(1)+'\nparticles '+N+' · 3D positions\nsteps '+steps+' · wall contacts '+collisions+'\nsolver '+(simMs/Math.max(1,steps)).toFixed(2)+' ms/step\nsloshes '+sloshCount;simMs=0;steps=0}}
requestAnimationFrame(frame);
</script></body></html>
