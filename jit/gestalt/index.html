<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIT Gestalt</title><style>
*{box-sizing:border-box}body{margin:0;background:#efefed;color:#242424;font:14px/1.5 system-ui}main{max-width:850px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{font-size:18px;margin:0}small{color:#777}button{cursor:pointer;font:inherit;border:1px solid #ddd;border-radius:10px;padding:9px 13px;background:white}button.active{background:#242424;color:white}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.panel{border:1px solid #ddd;border-radius:16px;overflow:hidden;background:white}textarea{width:100%;height:55vh;min-height:280px;padding:14px;border:0;resize:vertical;font:12px/1.5 monospace}pre{padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;overflow:auto;font:12px/1.5 monospace}.toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.status{font-size:12px;color:#666;margin:10px 0}.screen{max-width:440px;min-height:530px;margin:auto;padding:22px}.screen h2{font-size:30px;line-height:1.1;margin:12px 0}.screen p{opacity:.75}.chips{display:flex;flex-wrap:wrap;gap:8px}.card{background:white;border:1px solid #e4e4e4;border-radius:16px;padding:20px;margin-top:15px}.hero{padding:24px 0}.hero .eyebrow{letter-spacing:2px;font-size:11px}.screen .primary{width:100%;color:white;border:0;margin-top:16px}.screen .chip.selected{color:white}
</style></head><body><main><header><div><h1>✿ JIT Gestalt</h1><small>Model-directed · one contract, three representations</small></div><a href="./README.md">README</a></header><div class="tabs" id="tabs"><button data-tab="preview" class="active">Web</button><button data-tab="compose">Compose</button><button data-tab="xml">XML</button><button data-tab="contract">Contract</button></div><div class="panel" id="output"></div><div class="toolbar"><button id="apply" hidden>Apply JSON</button><button id="copy">Copy</button><button id="reset">Reload contract</button></div><div class="status" id="status">Loading contract…</div></main><script>
let spec,tab='preview',saved=false,selected='';const out=document.querySelector('#output'),status=document.querySelector('#status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;',"'":'&#39;'}[c]));const q=s=>JSON.stringify(String(s??''));const hex=s=>'0xFF'+String(s||'#ffffff').replace('#','').toUpperCase();
async function load(){try{let r=await fetch('./contract.json?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);spec=await r.json();status.textContent='Contract loaded · '+spec.schema;render()}catch(e){status.textContent='Load failed: '+e.message}}
function web(){let t=spec.tokens,s=spec.screen;out.innerHTML='<div class="screen" id="screen"></div>';let el=document.querySelector('#screen');el.style.cssText='background:'+t.background+';color:'+t.ink+';';let h=document.createElement('div');h.innerHTML='<div style="color:'+t.accent+';font-size:25px">✿</div><h3>'+esc(s.title)+'</h3><small>'+esc(s.subtitle)+'</small>';el.append(h);for(let c of s.components){let node=document.createElement('section');if(c.type==='hero'){node.className='hero';node.innerHTML='<div class="eyebrow" style="color:'+t.accent+'">INSPIRED BY YOU</div><h2>'+esc(c.title)+'</h2><p>'+esc(c.body)+'</p>'}else if(c.type==='chips'){node.className='chips';for(let v of c.items||[]){let b=document.createElement('button');b.className='chip'+(selected===v?' selected':'');b.textContent=v;b.style.background=selected===v?t.accent:'white';b.onclick=()=>{selected=v;web()};node.append(b)}}else if(c.type==='card'){node.className='card';node.style.borderRadius=(Number(t.radius)||16)+'px';node.innerHTML='<div style="height:80px;border-radius:12px;background:linear-gradient(130deg,#e5d7c8,#bc8e8d);display:grid;place-items:center;font-size:35px">✦</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.body)+'</p>';let b=document.createElement('button');b.textContent=saved?'✓ Saved':c.action||'Save';b.onclick=()=>{saved=!saved;web()};node.append(b)}else if(c.type==='button'){let b=document.createElement('button');b.className='primary';b.textContent=c.label;b.style.background=t.accent;b.style.borderRadius=(Number(t.radius)||16)+'px';b.onclick=()=>status.textContent='Action: '+c.label;node.append(b)}else{node.textContent='Unsupported: '+c.type}node.style.marginBottom=(Number(t.spacing)||12)+'px';el.append(node)}}
function compose(){let s=spec.screen,t=spec.tokens,l=['// Illustrative Compose; imports/theme integration omitted','@Composable','fun MiniGestaltScreen() {','  var saved by remember { mutableStateOf(false) }','  var selected by remember { mutableStateOf("") }','  Column(Modifier.fillMaxSize().background(Color('+hex(t.background)+')).padding(20.dp),','    verticalArrangement = Arrangement.spacedBy('+(Number(t.spacing)||12)+'.dp)) {','    Text('+q(s.title)+', style = MaterialTheme.typography.titleMedium)','    Text('+q(s.subtitle)+')'];for(let c of s.components){if(c.type==='hero')l.push('    Text('+q(c.title)+', style = MaterialTheme.typography.headlineMedium)','    Text('+q(c.body)+')');if(c.type==='chips')l.push('    Row {',...(c.items||[]).map(v=>'      FilterChip(selected = selected == '+q(v)+', onClick = { selected = '+q(v)+' }, label = { Text('+q(v)+') })'),'    }');if(c.type==='card')l.push('    Card { Column(Modifier.padding(16.dp)) {','      Text('+q(c.title)+')','      Text('+q(c.body)+')','      Button(onClick = { saved = !saved }) { Text(if (saved) "✓ Saved" else '+q(c.action||'Save')+') }','    } }');if(c.type==='button')l.push('    Button(onClick = { /* wire action */ }) { Text('+q(c.label)+') }')}return l.concat(['  }','}']).join('\n')}
function xml(){let s=spec.screen,l=['<?xml version="1.0" encoding="utf-8"?>','<!-- Layout skeleton; styling/actions require native bindings -->','<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"',' android:orientation="vertical" android:padding="20dp"',' android:layout_width="match_parent" android:layout_height="match_parent">'];const tv=(v,n)=>l.push(' <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="'+esc(v)+'" android:textSize="'+n+'sp" />');tv(s.title,20);tv(s.subtitle,13);for(let c of s.components){if(c.type==='hero'){tv(c.title,28);tv(c.body,14)}if(c.type==='chips'){l.push(' <!-- Replace with Material ChipGroup -->');(c.items||[]).forEach(v=>tv(v,14))}if(c.type==='card'){tv(c.title,20);tv(c.body,14)}if(c.type==='card'||c.type==='button')l.push(' <Button android:layout_width="match_parent" android:layout_height="wrap_content" android:text="'+esc(c.type==='card'?c.action:c.label)+'" />')}return l.concat(['</LinearLayout>']).join('\n')}
function current(){return tab==='contract'?document.querySelector('textarea')?.value:tab==='compose'?compose():tab==='xml'?xml():JSON.stringify(spec,null,2)}
function render(){if(!spec)return;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelector('#apply').hidden=tab!=='contract';if(tab==='preview')web();else if(tab==='contract'){out.innerHTML='<textarea spellcheck="false" aria-label="UI contract"></textarea>';out.querySelector('textarea').value=JSON.stringify(spec,null,2)}else{out.innerHTML='<pre></pre>';out.querySelector('pre').textContent=current()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#apply').onclick=()=>{try{let v=JSON.parse(current());if(v.schema!=='mini-gestalt/v1'||!Array.isArray(v.screen?.components))throw Error('Invalid mini-gestalt/v1');spec=v;tab='preview';status.textContent='Edited contract applied locally (not committed)';render()}catch(e){status.textContent=e.message}};document.querySelector('#reset').onclick=load;document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(current());status.textContent='Copied'}catch(e){status.textContent='Clipboard unavailable'}};load();
</script></body></html>
