<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>External Revenue Service</title><meta name="description" content="Public records of intervention, assistance, procurement and reconstruction."><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#222;background:#fff}*{box-sizing:border-box}body{margin:0}a{color:#005ea8}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffbe2e;outline-offset:2px}.wrap{max-width:1120px;margin:auto;padding:0 20px}.mast{border-bottom:1px solid #dfe1e2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:23px;padding-bottom:23px}.brand{font-size:31px;font-weight:700;color:#162e51;text-decoration:none}.brand small{display:block;font-size:12px;font-weight:400;color:#565c65;margin-top:4px}.searchbar{display:flex;gap:0}.searchbar input{min-width:170px;padding:10px;border:1px solid #565c65}.btn{background:#005ea8;color:white;border:0;padding:11px 17px;font-weight:700}.nav{background:#162e51;color:#fff;border-bottom:4px solid #005ea8}.nav-inner{display:flex;flex-wrap:wrap}.nav a{color:white;text-decoration:none;padding:15px 16px;display:inline-block}.nav a:hover,.nav a[aria-current=page]{background:#005ea8}.hero{background:#f0f6fa;padding:56px 0;border-bottom:1px solid #c7d6e2}.hero h1{font-size:38px;line-height:1.18;margin:0 0 12px;color:#162e51}.hero p{font-size:18px;max-width:750px}.hero .searchbar{max-width:680px}.hero input{flex:1}.section{padding:32px 0}.section h2{font-size:26px;color:#162e51}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.tile{border:1px solid #dfe1e2;border-top:4px solid #005ea8;padding:24px;min-height:145px;background:white;box-shadow:0 1px 3px #0000000b}.tile h3{margin:0 0 12px;font-size:19px}.tile p{font-size:14px;line-height:1.5;margin:0}.muted{color:#565c65}.breadcrumbs{font-size:14px;padding:22px 0}.panel{border:1px solid #dfe1e2;padding:22px;margin:18px 0}.panel h2{margin-top:0}.notice{border-left:5px solid #005ea8;background:#f1f3f5;padding:16px;margin:18px 0}.data{width:100%;border-collapse:collapse;margin:20px 0}.data th,.data td{padding:12px;border-bottom:1px solid #dfe1e2;text-align:left;vertical-align:top}.data th{background:#eee}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.tabs a{border:1px solid #005ea8;padding:9px 12px;text-decoration:none}.tabs a.active{background:#005ea8;color:white}.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.filters input,.filters select{padding:10px;border:1px solid #777}.footer{background:#f1f3f5;border-top:1px solid #dfe1e2;padding:30px 0;margin-top:30px;font-size:14px}.footer a{margin-right:20px}details{border-bottom:1px solid #dfe1e2;padding:15px 0}summary{cursor:pointer;font-weight:bold;color:#005ea8}.tag{display:inline-block;background:#eee;padding:4px 7px;font-size:12px;margin:3px}.source{overflow-wrap:anywhere}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;background:white;padding:12px;z-index:99}@media(max-width:760px){.grid{grid-template-columns:1fr}.mast{display:block}.mast .searchbar{margin-top:16px}.hero{padding:30px 0}.hero h1{font-size:29px}.nav a{padding:12px 10px;font-size:14px}.data{display:block;overflow-x:auto}.searchbar input{min-width:0;width:100%}}
</style></head><body><a class="skip" href="#main">Skip to main content</a><header class="wrap mast"><a class="brand" href="#/">ERS <small>External Revenue Service</small></a><form class="searchbar" id="topsearch"><input aria-label="Search ERS" placeholder="Search records and forms" id="topq"><button class="btn">Search</button></form></header><nav class="nav" aria-label="Main navigation"><div class="wrap nav-inner" id="nav"></div></nav><main id="main" tabindex="-1"></main><footer class="footer"><div class="wrap"><strong>External Revenue Service</strong><a href="#/methodology">Methodology</a><a href="#/sources">Sources</a><a href="#/help">Help & contact</a><a href="#/corrections">Corrections</a></div></footer>
<script>
const sources=[
{id:'s1',title:'Special Inspector General for Afghanistan Reconstruction — Reports',publisher:'SIGAR',url:'https://www.sigar.mil/quarterlyreports/'},
{id:'s2',title:'Iraq Reconstruction — Reports and Testimony',publisher:'U.S. Government Accountability Office',url:'https://www.gao.gov/search?search=Iraq%20reconstruction'},
{id:'s3',title:'Foreign Relations of the United States: Iran 1951–1954',publisher:'U.S. Department of State, Office of the Historian',url:'https://history.state.gov/historicaldocuments/frus1951-54Iran'},
{id:'s4',title:'Foreign Relations of the United States: Chile 1969–1973',publisher:'U.S. Department of State, Office of the Historian',url:'https://history.state.gov/historicaldocuments/frus1969-76v21'},
{id:'s5',title:'Foreign Relations of the United States: Guatemala 1952–1954',publisher:'U.S. Department of State, Office of the Historian',url:'https://history.state.gov/historicaldocuments/frus1952-54Guat'},
{id:'s6',title:'U.S. Security Assistance to Israel',publisher:'Congressional Research Service',url:'https://www.congress.gov/crs-products'},
{id:'s7',title:'Arms Transfers Database',publisher:'Stockholm International Peace Research Institute',url:'https://armstransfers.sipri.org/'},
{id:'s8',title:'USAspending — Federal spending data',publisher:'U.S. Treasury',url:'https://www.usaspending.gov/'},
{id:'s9',title:'U.S. Foreign Assistance',publisher:'U.S. Department of State',url:'https://foreignassistance.gov/'},
{id:'s10',title:'Costs of War',publisher:'Brown University',url:'https://watson.brown.edu/costsofwar/'},
{id:'s11',title:'Defense Security Cooperation Agency',publisher:'DSCA',url:'https://www.dsca.mil/'},
{id:'s12',title:'UN OCHA — Humanitarian Data Exchange',publisher:'United Nations',url:'https://data.humdata.org/'}
];
const countries=[
{id:'afghanistan',name:'Afghanistan',region:'Asia',description:'U.S. intervention, reconstruction and security assistance; SIGAR reporting provides a substantial oversight record.',src:['s1','s8','s9'],events:[{date:'2001–2021',title:'U.S. military intervention and withdrawal',src:['s10']},{date:'2002–2021',title:'Reconstruction and oversight reporting',src:['s1']}],schedules:{W:['Security assistance and military expenditure records'],P:['Reconstruction and development oversight'],R:[],C:['Reconstruction contracting and audits'],D:['Long-term security assistance and institutional capacity programs']}},
{id:'iraq',name:'Iraq',region:'Asia',description:'2003 invasion and subsequent reconstruction and procurement oversight.',src:['s2','s8','s10'],events:[{date:'2003',title:'U.S.-led invasion of Iraq',src:['s10']},{date:'2003 onward',title:'Reconstruction programs and oversight',src:['s2']}],schedules:{W:['Military operations and procurement'],P:['Reconstruction projects'],R:['Oil-sector questions require separate contract-level evidence'],C:['Reconstruction contracting'],D:[]}},
{id:'iran',name:'Iran',region:'Asia',description:'Historical U.S. policy and intervention documentation; claims must be evaluated against primary records.',src:['s3'],events:[{date:'1953',title:'Coup against Prime Minister Mohammad Mosaddegh and U.S. involvement',src:['s3']}],schedules:{W:['Covert intervention historical record'],P:[],R:['Oil nationalization was a central historical context; do not infer a specific financial transfer'],C:[],D:[]}},
{id:'chile',name:'Chile',region:'South America',description:'Declassified U.S. foreign policy records concerning Chile in the early 1970s.',src:['s4'],events:[{date:'1970–1973',title:'U.S. policy and covert activities in Chile',src:['s4']}],schedules:{W:['Covert action historical record'],P:[],R:[],C:[],D:[]}},
{id:'guatemala',name:'Guatemala',region:'North America',description:'Historical U.S. foreign policy and covert action documentation.',src:['s5'],events:[{date:'1954',title:'U.S.-backed coup against Jacobo Árbenz',src:['s5']}],schedules:{W:['Covert intervention historical record'],P:[],R:[],C:[],D:[]}},
{id:'israel-palestine',name:'Israel / Palestinian territories',region:'Asia',description:'U.S. security assistance, arms transfers and humanitarian programs require separate actor and recipient accounting.',src:['s6','s7','s9','s12'],events:[{date:'Ongoing',title:'U.S. security assistance and regional humanitarian reporting',src:['s6','s9','s12']}],schedules:{W:['U.S. security assistance and arms transfers'],P:['Humanitarian assistance and reconstruction'],R:[],C:['Defense procurement records'],D:['Recurring assistance agreements']}},
{id:'yemen',name:'Yemen',region:'Asia',description:'Arms-transfer and humanitarian records concerning the conflict and regional actors.',src:['s7','s11','s12'],events:[{date:'2015 onward',title:'Regional intervention, arms transfers and humanitarian response',src:['s7','s12']}],schedules:{W:['Regional arms transfers'],P:['Humanitarian assistance'],R:[],C:[],D:[]}},
{id:'ukraine',name:'Ukraine',region:'Europe',description:'U.S. assistance and defense procurement in response to Russia’s full-scale invasion; assistance is not presumed extractive.',src:['s8','s9','s11'],events:[{date:'2022 onward',title:'U.S. security and economic assistance following Russia’s full-scale invasion',src:['s8','s9']}],schedules:{W:['Security assistance'],P:['Economic and humanitarian support'],R:[],C:['Defense procurement'],D:[]}}
];
const forms=[['ERS-1040-S','Sovereign Revenue Return','Annual documentary overview'],['ERS-SCH-W','Schedule W — War','Arms transfers, intervention and procurement'],['ERS-SCH-P','Schedule P — Peace','Reconstruction and humanitarian assistance'],['ERS-SCH-R','Schedule R — Resources','Concessions, exports and resource flows'],['ERS-SCH-C','Schedule C — Contractors','Awards, obligations and actual payments'],['ERS-SCH-D','Schedule D — Dependency','Long-term obligations and program conditions'],['ERS-CP504','Notice of Assessment Review','Evidence-linked notice template'],['ERS-AP','Request for Review','Local analytical worksheet']];
const nav=[['File','file'],['Pay','pay'],['Refunds','refunds'],['Credits & Deductions','credits'],['Forms','forms'],['Report Fraud','oversight']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(href,label)=>'<a href="'+href+'">'+esc(label)+'</a>';
const srcLinks=ids=>ids.map(id=>{let s=sources.find(x=>x.id===id);return s?'<a class="source" href="'+s.url+'" target="_blank" rel="noopener noreferrer">'+esc(s.publisher)+'</a>':''}).join(' · ');
const tile=(title,desc,url)=>'<article class="tile"><h3>'+link(url,title)+'</h3><p>'+esc(desc)+'</p></article>';
const panel=(title,body)=>'<section class="panel"><h2>'+esc(title)+'</h2>'+body+'</section>';
const params=()=>new URLSearchParams(location.hash.split('?')[1]||'');
const route=()=>location.hash.slice(2).split('?')[0]||'';
const qs=(k,v)=>{let p=params();v?p.set(k,v):p.delete(k);location.hash='#/'+route()+(p.size?'?'+p:'');};
function render(){const path=route(),p=params();document.querySelector('#nav').innerHTML=nav.map(([name,id])=>'<a '+(path===id?'aria-current="page"':'')+' href="#/'+id+'">'+name+'</a>').join('');let out='';
if(!path){out='<div class="hero"><div class="wrap"><h1>What do you need today?</h1><p>Find forms, review your account, check notices, and get answers.</p><form class="searchbar" id="herosearch"><input id="heroq" aria-label="Search public records" placeholder="Search jurisdictions, forms, sources and programs"><button class="btn">Search</button></form></div></div><div class="wrap section"><h2>Popular tasks</h2><div class="grid">'+tile('Get a sovereign transcript','Review a country’s documented intervention and assistance history.','#/jurisdictions')+tile('Review an assessment','Examine published evidence and accounting schedules.','#/jurisdictions')+tile('Find a form','Browse analytical returns and instructions.','#/forms')+tile('Check a notice','Review oversight findings and notices.','#/notices')+tile('Examine payments','Distinguish appropriations, obligations, outlays and awards.','#/pay')+tile('Report fraud','Review documented oversight findings and correction procedures.','#/oversight')+'</div><h2>Popular topics</h2><div class="grid">'+tile('Jurisdictions','Browse real-world sovereign account records.','#/jurisdictions')+tile('Source library','Inspect the primary and secondary reference corpus.','#/sources')+tile('Accounting methodology','Understand what can and cannot be added together.','#/methodology')+'</div>'+panel('Find your account records','<p>Select the type of records you need.</p><div class="filters"><label for="guide">I am looking for</label><select id="guide"><option value="jurisdictions">A government or jurisdiction</option><option value="forms">A form or schedule</option><option value="sources">An original source</option><option value="oversight">An oversight finding</option></select><button class="btn" id="guidego">Continue</button></div>')+'<h2>Help & contact</h2>'+['Sovereign governments','Contractors and suppliers','Relief organizations','Researchers and journalists','Affected populations'].map(x=>'<details><summary>'+x+'</summary><p>Find documented public records and trace their source material. '+link('#/help','View help and guidance')+'.</p></details>').join('')+'</div>';}
else if(path==='jurisdictions'){let q=(p.get('q')||'').toLowerCase(),reg=p.get('region')||'',found=countries.filter(c=>(c.name+' '+c.description).toLowerCase().includes(q)&&(!reg||c.region===reg));out='<div class="wrap section"><h1>Jurisdictions</h1><p class="muted">Browse public-source records. Coverage varies by jurisdiction.</p><div class="filters"><label>Search <input id="countryq" value="'+esc(p.get('q')||'')+'" placeholder="Country or topic"></label><label>Region <select id="region"><option value="">All regions</option>'+[...new Set(countries.map(c=>c.region))].map(r=>'<option '+(r===reg?'selected':'')+'>'+r+'</option>').join('')+'</select></label></div><p>'+found.length+' matching accounts</p><div class="grid">'+found.map(c=>tile(c.name,c.description,'#/jurisdiction/'+c.id)).join('')+'</div></div>';}
else if(path.startsWith('jurisdiction/')){let c=countries.find(x=>x.id===path.split('/')[1]);if(!c){out=missing()}else{let schedule=p.get('schedule')||'W';out='<div class="wrap section"><div class="breadcrumbs">'+link('#/jurisdictions','Jurisdictions')+' / '+esc(c.name)+'</div><h1>'+esc(c.name)+'</h1><p>'+esc(c.description)+'</p><div class="notice"><strong>Coverage note:</strong> </div><h2>Public account schedules</h2><div class="tabs">'+Object.entries({W:'War',P:'Peace',R:'Resources',C:'Contractors',D:'Dependency'}).map(([id,name])=>'<a class="'+(schedule===id?'active':'')+'" href="#/jurisdiction/'+c.id+'?schedule='+id+'">Schedule '+id+' · '+name+'</a>').join('')+'</div>'+panel('Schedule '+esc(schedule),c.schedules[schedule]?.length?'<ul>'+c.schedules[schedule].map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul><p>Source material: '+srcLinks(c.src)+'</p>':'<p>No source-verified entries have been indexed for this schedule.</p>')+'<h2>Event chronology</h2><table class="data"><thead><tr><th>Period</th><th>Event</th><th>References</th></tr></thead><tbody>'+c.events.map(e=>'<tr><td>'+esc(e.date)+'</td><td>'+esc(e.title)+'</td><td>'+srcLinks(e.src)+'</td></tr>').join('')+'</tbody></table><p><button class="btn" id="export">Export account JSON</button> <button id="print">Print transcript</button></p></div>';}}
else if(path==='search'){let q=(p.get('q')||'').trim().toLowerCase();let results=[...countries.map(c=>({title:c.name,desc:c.description,url:'#/jurisdiction/'+c.id})),...forms.map(f=>({title:f[0]+' — '+f[1],desc:f[2],url:'#/form/'+f[0]})),...sources.map(s=>({title:s.title,desc:s.publisher,url:s.url}))].filter(x=>q&&(x.title+' '+x.desc).toLowerCase().includes(q));out='<div class="wrap section"><h1>Search results</h1><form class="searchbar" id="resultsearch"><input id="resultq" value="'+esc(p.get('q')||'')+'" aria-label="Search"><button class="btn">Search</button></form><p>'+results.length+' results</p>'+results.map(r=>panel(r.title,'<p>'+esc(r.desc)+'</p>'+link(r.url,'View record'))).join('')+(results.length?'':'<p>No matches. Try a jurisdiction name, program, source or form number.</p>')+'</div>';}
else if(path==='forms'){out='<div class="wrap section"><h1>Forms and instructions</h1><p>Find forms, schedules, and instructions.</p><table class="data"><thead><tr><th>Form</th><th>Title</th><th>Purpose</th></tr></thead><tbody>'+forms.map(f=>'<tr><td>'+link('#/form/'+f[0],f[0])+'</td><td>'+esc(f[1])+'</td><td>'+esc(f[2])+'</td></tr>').join('')+'</tbody></table></div>';}
else if(path.startsWith('form/')){let f=forms.find(x=>x[0]===path.split('/')[1]);out=f?'<div class="wrap section"><div class="breadcrumbs">'+link('#/forms','Forms')+' / '+esc(f[0])+'</div><h1>'+esc(f[0])+'</h1><h2>'+esc(f[1])+'</h2><p>'+esc(f[2])+'</p>'+panel('Instructions','<p>Choose a jurisdiction, review the linked primary records and the applicable accounting schedule. Do not treat a contract ceiling as a payment or a transfer value as Treasury income.</p><p>'+link('#/jurisdictions','Browse jurisdiction records')+'</p>')+'<button class="btn" id="print">Print form and instructions</button></div>':missing();}
else if(path==='sources'){out='<div class="wrap section"><h1>Sources</h1><p>Publications and source documents.</p>'+sources.map(s=>panel(s.title,'<p>'+esc(s.publisher)+'</p><p>'+link(s.url,'Open source collection')+'</p>')).join('')+'</div>';}
else if(path==='methodology'){out='<div class="wrap section"><h1>Methodology</h1>'+panel('Accounting conventions','<p>Appropriations, obligations, outlays, contract awards, contract payments, arms-transfer valuations, foreign assistance, loans, guarantees, resource exports and private profits are distinct categories. They must not be added as if they were equivalent cash receipts.</p><p>Unknown amounts remain unknown. No global net-profit figure is generated.</p>')+panel('Attribution and evidence','<p>Records identify sources and distinguish documented events, allegations, disputed motives and analytical interpretation. A strategic or commercial consequence does not by itself establish an intervention’s motive.</p>')+panel('Coverage','<p>Records are updated as supporting documentation becomes available.</p>')+'</div>';}
else if(path==='file'||path==='pay'||path==='refunds'||path==='credits'||path==='oversight'||path==='notices'||path==='help'||path==='corrections'){let cfg={file:['File a sovereign return','Choose a jurisdiction to review its chronological public return and schedules.'],pay:['Payments and disbursements','Review available public records of appropriations, obligations, outlays and transfers. '],refunds:['Refunds and restitution','Examine documented restitution, returned assets, debt relief and reconstruction commitments. '],credits:['Credits and deductions','Inspect assistance, guarantees, offsets and grants without treating them as Treasury revenue.'],oversight:['Report fraud and oversight','Review oversight source collections and documented findings. '],notices:['Notices','Review source-backed notices and records. '],help:['Help & contact','Browse sources, methodology and public records. '],corrections:['Corrections','Corrections to source claims should preserve provenance and change history in the public repository.']}[path];out='<div class="wrap section"><h1>'+cfg[0]+'</h1><p>'+cfg[1]+'</p><div class="grid">'+tile('Browse jurisdictions','Find source-linked sovereign records.','#/jurisdictions')+tile('Forms and instructions','Inspect schedules and print analytical worksheets.','#/forms')+tile('Source library','Open underlying public records.','#/sources')+tile('Methodology','Review evidence and accounting conventions.','#/methodology')+'</div>'+((path==='oversight')?panel('Oversight resources','<p>'+srcLinks(['s1','s2','s8'])+'</p>'):'')+'</div>';}
else out=missing();
document.querySelector('#main').innerHTML=out;document.title=(path?path.replaceAll('/',' · ')+' | ':'')+'External Revenue Service';bind();}
function missing(){return '<div class="wrap section"><h1>Record not found</h1><p>'+link('#/','Return to home')+'</p></div>'}
function search(q){location.hash='#/search?q='+encodeURIComponent(q)}
function bind(){for(let id of ['topsearch','herosearch','resultsearch']){let f=document.getElementById(id);if(f)f.onsubmit=e=>{e.preventDefault();search(document.getElementById({topsearch:'topq',herosearch:'heroq',resultsearch:'resultq'}[id]).value)}}let cq=document.getElementById('countryq');if(cq)cq.oninput=e=>qs('q',e.target.value);let reg=document.getElementById('region');if(reg)reg.onchange=e=>qs('region',e.target.value);let guide=document.getElementById('guidego');if(guide)guide.onclick=()=>location.hash='#/'+document.getElementById('guide').value;let print=document.getElementById('print');if(print)print.onclick=()=>window.print();let exp=document.getElementById('export');if(exp)exp.onclick=()=>{let c=countries.find(x=>x.id===route().split('/')[1]);let blob=new Blob([JSON.stringify({schema:'ers-account/v1',account:c,sources:sources.filter(s=>c.src.includes(s.id))},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ers-'+c.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
window.addEventListener('hashchange',render);render();
</script></body></html>
