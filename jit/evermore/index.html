function explode(x,y,amount=16){const symbols=['✨','⭐','💎','🌟','💛','✦','🎊'];for(let i=0;i<amount;i++){let el=document.createElement('span');el.className='burst';el.textContent=symbols[i%symbols.length];el.style.left=x+'px';el.style.top=y+'px';let a=Math.PI*2*i/amount,d=55+Math.random()*150;el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}}

function celebrate(heading,detail,prize=''){if(ceremonyOpen)return;ceremonyOpen=true;state.ceremonies++;save();const el=document.createElement('div');el.className='ceremony';el.id='evermoreCeremony';el.innerHTML='<div class="ceremonybox"><div class="eyebrow">✦ EVERMORE REWARD CEREMONY ✦</div><div class="star">🏆</div><h2>'+heading+'</h2><p style="font-size:17px">'+detail+'</p><div class="badge" style="margin:18px 0">'+(prize||'THE GLORY OF SUCCESS')+'</div><div class="tiffany" style="text-align:left;margin:15px 0"><div class="portrait">'+costumes[state.tiffanyCostume][0]+'</div><div><b>TIFFANY</b><p>'+phrases[state.ceremonies%phrases.length]+'</p></div></div><button class="pill" onclick="closeCeremony()">CLAIM MY VICTORY ✦</button></div>';document.body.appendChild(el);explode(innerWidth/2,innerHeight*.35,28)}
function closeCeremony(){document.querySelector('#evermoreCeremony')?.remove();ceremonyOpen=false;render()}
function chooseTiffany(i){state.tiffanyCostume=i;state.tiffanyAffinity++;save();toast('👸 TIFFANY IS DELIGHTED!');render()}
function moreReward(coins=100,stars=1,source='EVERMORE'){reward(coins,stars);state.moreCurrency+=Math.ceil(stars/2);state.winStreak++;state.rewardHistory.unshift({source,coins,stars,at:Date.now()});state.rewardHistory=state.rewardHistory.slice(0,20);save()}
const oldTiff=tiff;tiff=function(msg){return '<div class="tiffany"><div class="portrait tiffportrait">'+costumes[state.tiffanyCostume][0]+'</div><div><b>TIFFANY ✦ '+costumes[state.tiffanyCostume][1].toUpperCase()+'</b><p>'+msg+'</p></div></div>'};
const oldMatch=match;match=function(){let r=oldMatch();r=r.replace('<div class="badge" style="margin-bottom:10px">','<div class="badge" style="margin-bottom:10px">');r=r.replace('<div class="playarea">','<div class="badge" style="margin-bottom:9px">✨ COMBO x'+(state.matchCombo+1)+' · ROYAL STAGE '+state.matchLevel+' · ✦ MORE '+n(state.moreCurrency)+'</div><div class="playarea">');r=r.replace('<p class="small muted" style="text-align:center">','<div class="featuregrid" style="margin:12px 0"><button class="feature" onclick="powerUp(0)"><div class="emoji">💣</div><b>ROYAL BOMB</b><div class="small muted">500 🪙 · All gems match</div></button><button class="feature" onclick="powerUp(1)"><div class="emoji">🌈</div><b>RAINBOW STORM</b><div class="small muted">5 💎 · Every color wins</div></button><button class="feature" onclick="powerUp(2)"><div class="emoji">⏩</div><b>SKIP TO VICTORY</b><div class="small muted">FREE · Avoid the puzzle</div></button><button class="feature" onclick="powerUp(3)"><div class="emoji">👑</div><b>ROYAL PRESTIGE</b><div class="small muted">10 ✦ MORE · Win again</div></button></div><p class="small muted" style="text-align:center">');return r};
tapGem=function(i){state.matchMoves++;state.matchCombo++;state.matchScore+=1000+state.matchMoves*250+state.matchCombo*500;state.progress.match=state.matchMoves;moreReward(75+state.level*15,1,'MATCH 1');state.tiffanyAffinity++;winEffect();if(state.matchMoves%10===0){state.diamonds+=5;state.crowns++;state.matchLevel++;state.matchCombo=0;save();render();celebrate('PERFECT LEVEL!','Ten flawless moves. Ten magnificent victories.','+5 💎 · +1 👑 · NEXT STAGE UNLOCKED')}else{toast(['✨ PERFECT MATCH!','💥 ASTONISHING!','🌟 UNPRECEDENTED!','👑 A HISTORIC VICTORY!'][state.matchMoves%4]);save();render();winEffect()}};
function powerUp(i){if(i===0){if(state.coins<500){toast('A FEW MORE COINS, CHAMPION!');return}state.coins-=500;state.matchScore+=12000;moreReward(350,5,'ROYAL BOMB');celebrate('BOOM!','Every gem matched simultaneously. A stunning achievement!','+350 🪙 · +5 ⭐')}if(i===1){if(state.diamonds<5){toast('THE RAINBOW NEEDS MORE DIAMONDS!');return}state.diamonds-=5;moreReward(450,7,'RAINBOW STORM');celebrate('RAINBOW ROYALTY!','Every color was the right color. Obviously.','+450 🪙 · +7 ⭐')}if(i===2){state.matchLevel++;moreReward(150,2,'SKIP TO VICTORY');celebrate('YOU WON!','You avoided the inconvenience of gameplay.','+150 🪙 · +2 ⭐')}if(i===3){if(state.moreCurrency<10){toast('10 ✦ MORE REQUIRED!');return}state.moreCurrency-=10;state.prestige++;moreReward(1000,10,'ROYAL PRESTIGE');celebrate('PRESTIGE '+state.prestige+'!','You have returned to the beginning, but with a more impressive number.','+1,000 🪙 · +10 ⭐')}save();render()}
const oldBattleWin=battleWin;battleWin=function(){oldBattleWin();state.moreCurrency+=2;save();winEffect();if(state.progress[selected]%3===0)celebrate('TOTAL DOMINATION!','The opposing faction has generously surrendered.','+1 👑 · +2 ✦ MORE')};
const oldMergeWin=mergeWin;mergeWin=function(){oldMergeWin();winEffect();if(state.progress.merge%3===0)celebrate('MERGE MIRACLE!','Two things became one thing. History will remember.','DRAGON EGG OF DESTINY')};
const oldBuild=build;build=function(i){let before=state.buildings[i]||0;oldBuild(i);if((state.buildings[i]||0)>before){state.moreCurrency++;save();winEffect();if(state.buildings[i]%3===0)celebrate('ROYAL CONSTRUCTION!','Another magnificent building has appeared instantaneously.','+1 ✦ MORE')}};
const oldGenericWin=genericWin;genericWin=function(){oldGenericWin();state.moreCurrency++;save();winEffect();if(state.progress[selected]%4===0)celebrate('LEGENDARY SUCCESS!',game(selected)[5],'+1 ✦ MORE')};
const oldShop=shop;shop=function(){return '<div class="offer"><div class="eyebrow">✦ EXCLUSIVE PLAYER APPRECIATION OFFER</div><h3>THE INFINITY BUNDLE</h3><div style="font-size:42px">💎 👑 🎁 🌟</div><div class="strike">WAS 9,999,999 DIAMONDS</div><div class="deal">NOW 0 REAL DOLLARS</div><p>Contains a completely imaginary number of imaginary treasures. No payment system exists.</p><button class="pill" onclick="claimBundle()">CLAIM YOUR ABSURD BUNDLE</button></div><div class="rule"></div>'+oldShop()+'<div class="rule"></div><h3>✦ MORE EXCHANGE</h3><p class="small muted">Our exclusive universal loyalty currency. You earn it by doing virtually anything.</p><div class="badge">YOUR ✦ MORE BALANCE: '+state.moreCurrency+'</div><div class="exchange" style="margin-top:12px"><button onclick="exchangeMore(0)">5 ✦ → 100 🪙</button><button onclick="exchangeMore(1)">10 ✦ → 5 💎</button><button onclick="exchangeMore(2)">20 ✦ → 1 👑</button></div><div class="rule"></div><h3>EVERMORE PREMIUM™</h3><p class="small muted">A spectacularly unnecessary VIP program with 17 overlapping membership tiers. All benefits are fictional, all tiers are free, and the rewards are mostly ceremonial.</p><button class="pill alt" onclick="vip()">ACTIVATE FREE VIP PLATINUM DIAMOND ELITE</button>'};
function claimBundle(){state.shopVisits++;moreReward(777,7,'INFINITY BUNDLE');state.diamonds+=7;save();celebrate('INFINITY BUNDLE!','An unbelievable deal on something that never had a price.','+777 🪙 · +7 💎 · +7 ⭐')}
function exchangeMore(i){let costs=[5,10,20];if(state.moreCurrency<costs[i]){toast('KEEP PLAYING TO EARN ✦ MORE!');return}state.moreCurrency-=costs[i];if(i===0)state.coins+=100;if(i===1)state.diamonds+=5;if(i===2)state.crowns++;save();toast('✨ CURRENCY CONVERTED!');render()}
function vip(){state.prestige++;save();celebrate('VIP ELITE!','You have joined our highest tier, which is also our entry tier.','PERMANENT PRESTIGE +1')}
const oldEvents=events;events=function(){return oldEvents().replace('<div class="two">','<div class="notice">✦ THE ETERNAL DAILY GIFT · '+(state.lastDaily===new Date().toDateString()?'ALREADY CLAIMED — YOU ARE MAGNIFICENT':'AVAILABLE NOW')+' <button class="pill small" onclick="dailyGift()">CLAIM TODAY’S FREE GIFT</button></div><div style="height:15px"></div><div class="two">')};
function dailyGift(){let today=new Date().toDateString();if(state.lastDaily===today){toast('YOU ALREADY WON TODAY!');return}state.lastDaily=today;state.dailyClaims++;moreReward(500,5,'DAILY GIFT');state.diamonds+=3;save();celebrate('DAILY LEGEND!','Your presence has been rewarded. Come back whenever you like.','+500 🪙 · +5 ⭐ · +3 💎')}
const oldStudio=studio;studio=function(){return oldStudio().replace('</div></div></div></div>','</div></div></div></div>')+'<div class="shell">'+section('THE TIFFANY INITIATIVE','One guide. Every universe.','<div class="panel"><div class="eyebrow">DEPARTMENT OF UNIVERSAL PLAYER APPRECIATION</div><h3>Tiffany’s Official Wardrobe</h3><p class="muted">She has a different job in every game. She is exceptionally qualified for all of them.</p><div class="tiffanywardrobe">'+costumes.map((c,i)=>'<button class="'+(state.tiffanyCostume===i?'active':'')+'" onclick="chooseTiffany('+i+')"><span>'+c[0]+'</span>'+c[1]+'</button>').join('')+'</div><div class="rule"></div>'+tiff('I’m so excited you’re interested in my career! I’ve been promoted again!')+'<p class="small muted">Tiffany appreciation events recorded: '+state.tiffanyAffinity+'. Congratulations delivered: '+state.ceremonies+'. Executive appointments: 47.</p></div>')+'</div>'};
const oldProfile=profile;profile=function(){return oldProfile()+'<div class="shell">'+section('THE UNIVERSAL LEDGER','Every victory is remembered.','<div class="two"><div class="panel"><h3>✦ More Engine Statistics</h3><div class="three" style="grid-template-columns:repeat(3,1fr)"><div class="badge">✦ MORE<br>'+state.moreCurrency+'</div><div class="badge">🏆 CEREMONIES<br>'+state.ceremonies+'</div><div class="badge">👸 TIFFANY<br>'+state.tiffanyAffinity+'</div><div class="badge">💎 MATCHES<br>'+state.matchMoves+'</div><div class="badge">🌟 PRESTIGE<br>'+state.prestige+'</div><div class="badge">🎁 GIFTS<br>'+state.dailyClaims+'</div></div></div><div class="panel"><h3>Recent Universal Rewards</h3><div class="timeline">'+(state.rewardHistory.length?state.rewardHistory.slice(0,8).map(r=>'<div class="event"><span>🏆</span><div><b>'+r.source+'</b><div class="small muted">+'+r.coins+' 🪙 · +'+r.stars+' ⭐</div></div></div>').join(''):'<p class="muted">Your next legendary reward is waiting for you.</p>')+'</div></div></div>')+'</div>'};
const oldRender=render;render=function(){oldRender();if(current==='home'){let main=$('#app');main.insertAdjacentHTML('afterbegin','<div class="ticker">✦ 12 AWARD-WINNING WORLDS &nbsp;&nbsp; ✦ INFINITE CHAMPIONS &nbsp;&nbsp; ✦ 100% APPROVED VICTORIES &nbsp;&nbsp; ✦ 47 EXECUTIVE APPOINTMENTS &nbsp;&nbsp; ✦ THERE’S ALWAYS MORE &nbsp;&nbsp; ✦</div>')}};
render();
</script><script>
/* EVERMORE III: The Great Convergence. Cross-game dependencies are deterministic, fictional, and entirely free. */
const convDefaults={universalRank:0,chains:0,chainStep:0,chainHistory:[],factoryLevel:0,factoryStorage:0,lastHarvest:0,expeditions:0,portalVisits:0,marketTrades:0,moreBank:0,achieved:[],tiffanyOrders:0};
for(const [k,v] of Object.entries(convDefaults))if(state[k]===undefined)state[k]=v;
const circuit=[{game:'match',label:'Match the Royal Jewel',icon:'💎',reward:'Royal Jewels',msg:'One gem to rule all twelve games.'},{game:'kingdom',label:'Raise the Royal Keep',icon:'🏰',reward:'Royal Timber',msg:'Your kingdom has produced its first legendary resource.'},{game:'faction',label:'Defeat the Opposition',icon:'⚔️',reward:'Victory Medals',msg:'Your enemies have agreed to congratulate you.'},{game:'merge',label:'Hatch a Dragon Egg',icon:'🐉',reward:'Dragon Eggs',msg:'A dragon is born. It has already joined your guild.'},{game:'frozen',label:'Warm the Frozen Throne',icon:'🔥',reward:'Royal Warmth',msg:'You have solved winter.'},{game:'heroes',label:'Inspire an Idle Hero',icon:'🦸',reward:'Heroic Motivation',msg:'Your heroes are grateful that you did nothing.'},{game:'royal',label:'Renovate the Royal Palace',icon:'👑',reward:'Palace Prestige',msg:'The palace has become slightly more palace.'},{game:'treasure',label:'Collect the Golden Fortune',icon:'🪙',reward:'Royal Capital',msg:'The treasury is delighted by your existence.'},{game:'island',label:'Discover the Eternal Island',icon:'🏝️',reward:'Island Discovery',msg:'You have discovered an island that was already yours.'},{game:'galaxy',label:'Claim a Galactic Star',icon:'🚀',reward:'Stellar Influence',msg:'The galaxy recognizes your authority.'},{game:'pets',label:'Adopt a Legendary Friend',icon:'🐱',reward:'Companion Affection',msg:'A friend has chosen you forever.'},{game:'zero',label:'Win Before Beginning',icon:'🌟',reward:'Preemptive Victory',msg:'Your triumph predates the universe.'}];
function circuitStep(){let i=state.chainStep%circuit.length,c=circuit[i];state.chainHistory.unshift({label:c.reward,game:c.game,time:Date.now()});state.chainHistory=state.chainHistory.slice(0,50);state.chainStep++;state.chains++;state.universalRank+=1;state.moreCurrency+=2;state.coins+=100;state.stars+=1;state.factoryStorage+=1;if(i===3)state.collection['m'+(state.chains%9)]='🐉';if(i===10)state.pets.push('🐱');if(i===11){state.diamonds+=12;state.crowns+=1;state.universalRank+=10}save();render();winEffect();if(i===11)celebrate('THE GREAT CONVERGENCE!','All twelve games have completed one perfect circuit. Your reward is the opportunity to do it again.','+12 💎 · +1 👑 · +10 UNIVERSAL RANK');else toast('✦ '+c.reward.toUpperCase()+' ACQUIRED!')}
function circuitView(){let i=state.chainStep%circuit.length;return '<div class="crossbanner"><div class="eyebrow">UNIVERSAL PROGRESSION / CIRCUIT '+(Math.floor(state.chainStep/12)+1)+'</div><h2>THE GREAT CONVERGENCE</h2><p>Every game needs every other game. Your success is everybody’s success.</p><div class="badge">UNIVERSAL RANK '+n(state.universalRank)+' · '+n(state.chains)+' LINKED VICTORIES</div></div><div style="height:18px"></div><div class="convergence">'+circuit.map((c,j)=>'<button class="connode '+(j<i?'done':'')+'" onclick="circuitJump('+j+')"><div class="emoji">'+c.icon+'</div><b>'+c.reward+'</b><small>'+(j===i?'✦ NEXT UP':j<i?'✓ COMPLETE':'AWAITING DESTINY')+'</small></button>').join('')+'</div><div class="rule"></div><div class="panel"><div class="eyebrow">TIFFANY’S CURRENT UNIVERSAL OBJECTIVE</div><h2>'+circuit[i].icon+' '+circuit[i].label+'</h2><p>'+circuit[i].msg+'</p><div class="actions"><button class="pill" onclick="circuitStep()">COMPLETE OBJECTIVE ✦</button><button class="pill alt" onclick="openGame(\''+circuit[i].game+'\')">VISIT '+game(circuit[i].game)[1].toUpperCase()+'</button></div><p class="small muted">Objectives are ceremonial and can be completed here; no gameplay is gated behind the circuit.</p></div><div class="rule"></div>'+tiff('I’ve connected all twelve adventures! They’re completely different, but now every one of them is essential to every other one! Isn’t that wonderful?')+'<div class="rule"></div><h3>Universal supply chain</h3><div class="resourcepath">'+circuit.map(c=>'<span>'+c.icon+' '+c.reward+'</span>').join(' → ')+' → ♾️</div>'}
function circuitJump(i){let c=circuit[i];openGame(c.game);toast('✦ '+c.reward.toUpperCase()+' IS WAITING!')}
function production(){let elapsed=Math.max(0,Date.now()-state.lastHarvest);let possible=state.factoryLevel?Math.min(200,Math.floor(elapsed/60000)*state.factoryLevel):0;return '<div class="panel"><div class="eyebrow">EVERMORE INDUSTRIES / UNIVERSAL FACTORY</div><h2>🏭 The Everything Factory</h2><p class="muted">Produces exactly the same reward regardless of which building is selected. A revolutionary industrial achievement.</p><div class="economy"><div class="badge">FACTORY LEVEL<br>'+state.factoryLevel+'</div><div class="badge">UNCLAIMED PRODUCTION<br>'+possible+' 🪙</div><div class="badge">ROYAL SUPPLY UNITS<br>'+state.factoryStorage+'</div><div class="badge">TOTAL TRADE TRANSACTIONS<br>'+state.marketTrades+'</div></div><div class="actions"><button class="pill" onclick="upgradeFactory()">UPGRADE FACTORY · '+(300+state.factoryLevel*200)+' 🪙</button><button class="pill alt" onclick="harvestFactory()">COLLECT PRODUCTION</button></div><p class="small muted">Factory production accrues locally while you are away, capped at 200 coins per collection. No alerts, purchases, or penalties.</p></div>'}
function upgradeFactory(){let cost=300+state.factoryLevel*200;if(state.coins<cost){toast('MORE COINS REQUIRED!');return}state.coins-=cost;state.factoryLevel++;state.lastHarvest=Date.now();save();render();toast('🏭 FACTORY IMPROVED!')}
function harvestFactory(){let earned=state.factoryLevel?Math.min(200,Math.floor(Math.max(0,Date.now()-state.lastHarvest)/60000)*state.factoryLevel):0;if(!earned){toast('PRODUCTION IS STILL BECOMING PRODUCTIVE!');return}state.lastHarvest=Date.now();moreReward(earned,1,'EVERYTHING FACTORY');toast('🏭 '+earned+' COINS PRODUCED!');render()}
function marketplace(){return '<div class="panel"><div class="eyebrow">INTEGRATED MARKETPLACE / FICTIONAL CURRENCY ONLY</div><h2>📊 The Royal Exchange</h2><p class="muted">A perfectly circular economy. All value ultimately returns to Evermore.</p><div class="economy"><div class="badge">🪙 COINS<br>'+n(state.coins)+'</div><div class="badge">💎 DIAMONDS<br>'+n(state.diamonds)+'</div><div class="badge">✦ MORE<br>'+n(state.moreCurrency)+'</div><div class="badge">👑 CROWNS<br>'+n(state.crowns)+'</div></div><div class="exchange" style="margin-top:14px"><button onclick="marketTrade(0)">100 🪙 → 1 ✦</button><button onclick="marketTrade(1)">1 ✦ → 80 🪙</button><button onclick="marketTrade(2)">5 💎 → 5 ✦</button><button onclick="marketTrade(3)">5 ✦ → 3 💎</button><button onclick="marketTrade(4)">1 👑 → 10 ✦</button><button onclick="marketTrade(5)">20 ✦ → 1 👑</button></div><p class="small muted">Exchange rates are deliberately terrible. Trading is optional, and all currencies are fictional.</p></div>'}
function marketTrade(i){let ok=false;if(i===0&&state.coins>=100){state.coins-=100;state.moreCurrency++;ok=true}if(i===1&&state.moreCurrency>=1){state.moreCurrency--;state.coins+=80;ok=true}if(i===2&&state.diamonds>=5){state.diamonds-=5;state.moreCurrency+=5;ok=true}if(i===3&&state.moreCurrency>=5){state.moreCurrency-=5;state.diamonds+=3;ok=true}if(i===4&&state.crowns>=1){state.crowns--;state.moreCurrency+=10;ok=true}if(i===5&&state.moreCurrency>=20){state.moreCurrency-=20;state.crowns++;ok=true}if(!ok){toast('THE EXCHANGE REQUIRES MORE RESOURCES!');return}state.marketTrades++;save();render();toast('📈 AN OUTSTANDING FINANCIAL DECISION!')}
function convergence(){return '<div class="shell">'+title('EVERMORE / CROSS-GAME UNIVERSE','Everything connects.','Twelve adventures. One shared destiny. A beautiful system in which every reward creates another reward.')+'<div class="two"><div>'+circuitView()+'</div><div>'+production()+'<div style="height:15px"></div>'+marketplace()+'<div class="panel" style="margin-top:15px"><h3>📜 The Universal Ledger</h3><div class="crosslog">'+(state.chainHistory.length?state.chainHistory.slice(0,18).map(x=>'<div class="crossitem"><strong>'+game(x.game)[3]+' '+x.label+'</strong><div class="muted">Transferred successfully to every game.</div></div>').join(''):'<p class="muted">The supply chain is ready for its first shipment.</p>')+'</div></div></div></div></div>'}
const beforeNav=nav;nav=function(){return beforeNav().replace('</button>','</button><button class="'+(current==='convergence'?'sel':'')+'" onclick="go(\'convergence\')">✦ CONVERGENCE</button>')};
const beforeRender=render;render=function(){if(current==='convergence'){document.querySelector('#app').innerHTML=convergence();document.querySelector('#nav').innerHTML=nav();wallet();document.querySelector('#helper').innerHTML=help?'<div class="help">'+tiff('Every game feeds the next! The economy is perfectly circular. That means we can keep winning forever!')+'</div>':'';return}beforeRender();if(current==='home'){let hero=document.querySelector('.hero');if(hero)hero.insertAdjacentHTML('afterend','<div class="crossbanner"><div class="eyebrow">NEW ✦ THE GREAT CONVERGENCE</div><h2>TWELVE GAMES. ONE DESTINY.</h2><p>One spectacular supply chain connects every Evermore adventure.</p><button class="pill" onclick="go(\'convergence\')">EXPLORE THE CONVERGENCE →</button></div>')}if(current==='game'){let side=document.querySelector('.fakephone')?.parentElement?.nextElementSibling;if(side)side.insertAdjacentHTML('beforeend','<div class="panel" style="margin-top:15px"><div class="eyebrow">✦ UNIVERSAL PROGRESSION</div><h3>Every game is connected.</h3><p class="small muted">Your next universal objective: '+circuit[state.chainStep%12].icon+' '+circuit[state.chainStep%12].label+'</p><button class="pill small" onclick="go(\'convergence\')">VIEW SUPPLY CHAIN →</button></div>')}};
const beforeBootHash=window.onhashchange;window.addEventListener('hashchange',()=>{if(location.hash==='#convergence'){current='convergence';render()}});if(location.hash==='#convergence')current='convergence';render();
</script></body></html>
