const currencies=['coins','diamonds','stars','energy','crowns','tickets'];const defaultState={coins:2500,diamonds:75,stars:0,energy:100,crowns:0,tickets:3,xp:0,level:1,matchScore:0,matchMoves:0,buildings:{},heroes:[],pets:[],collection:{},progress:{},daily:[],guild:'The Eternal Beginners',season:1,unlocks:[],tutorial:0,events:[],lastSeen:Date.now()};let state;try{state={...defaultState,...JSON.parse(localStorage.getItem('evermore-save-v1')||'{}')}}catch(e){state={...defaultState}}let current='home',selected='match',tab='play',help=false,toastTimer=0;const $=s=>document.querySelector(s),save=()=>{try{localStorage.setItem('evermore-save-v1',JSON.stringify(state))}catch(e){}},n=x=>Math.floor(x).toLocaleString('en-US'),game=id=>G.find(x=>x[0]===id)||G[0],title=(small,big,desc)=>'<div class="hero compact"><div class="eyebrow">'+small+'</div><h1>'+big+'</h1><p class="lead">'+desc+'</p></div>',button=(label,fn,alt=false)=>'<button class="pill'+(alt?' alt':'')+'" onclick="'+fn+'">'+label+'</button>',card=g=>'<article class="gamecard"><div class="cover" style="--accent:'+g[4]+'"><span class="mini">'+g[6]+'</span><span class="bigicon">'+g[3]+'</span><span class="sticker">'+(g[0]==='zero'?'COMING SOON':'TOP RATED ★★★★★')+'</span></div><div class="gamebody"><h3>'+g[1]+'</h3><div class="sub">'+g[2]+'</div><p>'+g[5]+'</p>'+button(g[0]==='zero'?'PRE-REGISTER FREE':'PLAY FREE →',"openGame('"+g[0]+"')")+'</div></article>',section=(label,name,content)=>'<section class="section"><div class="sectiontitle"><div><div class="eyebrow">'+label+'</div><h2>'+name+'</h2></div></div>'+content+'</section>',bar=(v,max=100)=>'<div class="progress"><div style="width:'+Math.min(100,100*v/max)+'%"></div></div>',frame=(g,content)=>'<div class="fakephone"><div class="screen"><div class="screenhead"><div><div class="eyebrow">EVERMORE / '+g[6]+'</div><h2>'+g[1]+'</h2></div><div class="badge">⭐ LV '+state.level+'<br>⚡ '+state.energy+'/100</div></div>'+content+'<div class="rule"></div><div class="navtiles" very game. Every level. Every decision.</p></div><div class="panel"><div style="font-size:38px">🏆</div><h3>One endless journey</h3><p>Every tap advances your legendary Evermore profile. There is no finish line.</p></div></div>')+'</div>'}

cate","Appeal time paradox"],["Tomorrow Tokens","Yesterday Credits"]],["news","📰","Evermore News Network","Real headlines from the empire's own event ledger",["Publish front page","Interview Tiffany","Issue breaking news","Broadcast market report"],["Headlines","Press Credentials"]],["museum","🏛️","Museum of Everything","An archive for every ceremony, legal dispute and collectible",["Acquire historical artifact","Open miniature museum","Sell commemorative ticket","Restore ancient receipt"],["Artifacts","Museum Tickets"]],["achievements","🏆","Achievement Authority","Certify achievements for having certified achievements",["Award an achievement","Certify certificate","Honor an awards ceremony","Grant Prestige Prestige"],["Medals","Prestige Prestige"]],["liveops","🎉","Evermore Live Operations","Weekly jubilees, fictional festivals and birthday calendars",["Celebrate Tiffany's birthday","Host guild festival","Issue patch notes","Crown seasonal champion"],["Festival Tickets","Jubilee Stars"]]];

function omGamePlay(id){let g=omGames.find(x=>x[0]===id);if(!g)return;let idx=omGames.findIndex(x=>x[0]===id);let produced=['Jewel Pairs','Legendary Fish','Dragon Eggs','Parking Permits','Pet Marriage Licenses','Academic Papers','Planet Wallpaper','Passports','Confetti Ammunition','Tax Refunds','Bullish Shares','Infinite Matches'][idx];omAdd(produced,1);omAdd('Cargo',1);omAdd('Museum Interest',1);state.coins+=15+idx;state.stars=(state.stars||0)+1;omEvent(id,'Victory in '+g[2],produced+' × 1');omCelebrate(idx===8?'confetti':idx===1?'gold':'gem');toast('🏆 UNCONDITIONAL VICTORY! +'+(15+idx)+' COINS · +1 '+produced);render()}
