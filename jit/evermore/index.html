<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12"><title>EVERMORE</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b12;color:#f4f0e9;font-family:system-ui,-apple-system,sans-serif}
main{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:26px;padding:24px}
button{appearance:none;width:min(65vw,220px);aspect-ratio:1;border-radius:50%;border:2px solid #d7d1c9;background:#e7e0d7;color:#14151b;font-size:clamp(20px,5vw,29px);font-weight:600;cursor:pointer;transition:none;touch-action:manipulation}
button:disabled{cursor:default;opacity:1}button.tapped{background:#171c27;color:#e7e0d7;border-color:#5d6573}
#status{min-height:1.5em;color:#8f96a3;font-size:13px;text-align:center;max-width:300px}
small{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#616875;font-size:11px}
</style></head><body><main><button id="one" type="button" disabled aria-label="Checking the shared state">…</button><div id="status" role="status" aria-live="polite">Checking the world.</div></main><small>EVERMORE</small>
<script>
'use strict';
/*
 EVERMORE ZIMA BLUE.
 One global logical bit. ntfy is a relay with limited retention, NOT permanent durable storage.
 Fail closed if the relay cannot be read. No legacy routes, games or navigation remain.
 No analytics or identity. User explicitly declined to test this release.
*/
const TOPIC='evermore-zima-blue-one-tap-v1-7f91e8c6a4d2';
const URL='https://ntfy.sh/'+TOPIC;
const LOCAL='evermore-zima-blue-seen-v1';
const button=document.getElementById('one');
const status=document.getElementById('status');
let tapped=localStorage.getItem(LOCAL)==='1',busy=false;
function show(done,message){
 tapped=done||tapped;
 if(tapped){try{localStorage.setItem(LOCAL,'1')}catch(e){}}
 button.disabled=tapped||busy;
 button.className=tapped?'tapped':'';
 button.textContent=tapped?'Tapped':'Tap';
 button.setAttribute('aria-label',tapped?'Already tapped by someone':'Tap once for everyone');
 status.textContent=message||(tapped?'':'');
}
function messageIsTap(x){return x&&x.event==='message'&&x.message==='EVERMORE_TAPPED_V1'}
async function history(){
 const response=await fetch(URL+'/json?poll=1&since=all',{cache:'no-store'});
 if(!response.ok)throw Error('relay history unavailable');
 const raw=await response.text();
 return raw.split('\n').filter(Boolean).some(line=>{try{return messageIsTap(JSON.parse(line))}catch(e){return false}});
}
async function check(){
 busy=true;show(tapped,tapped?'':'Checking the world.');
 try{
   if(await history()){show(true);status.textContent='';return}
   if(tapped){show(true);status.textContent='';return}
   busy=false;show(false,'');
 }catch(e){busy=true;show(tapped,tapped?'':'Shared state unavailable.');}
}
button.addEventListener('click',async()=>{
 if(busy||tapped)return;
 busy=true;show(false,'');
 try{
   // Check again immediately before attempting the only transition.
   if(await history()){show(true);status.textContent='';return}
   const response=await fetch(URL,{method:'POST',headers:{'Content-Type':'text/plain','Title':'EVERMORE','Cache':'yes'},body:'EVERMORE_TAPPED_V1'});
   if(!response.ok)throw Error('publish failed');
   show(true);status.textContent='';
 }catch(e){busy=true;show(false,'Could not confirm the shared tap.');}
});
if(tapped){show(true);status.textContent=''}else check();
// Observe changes while the page remains open; history is bounded by ntfy retention.
setInterval(async()=>{if(tapped||busy)return;try{if(await history()){show(true);status.textContent=''}}catch(e){busy=true;show(false,'Shared state unavailable.')}},15000);
</script></body></html>
