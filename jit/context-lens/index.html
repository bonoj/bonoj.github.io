<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Context Lens</title>
<style>
:root{color-scheme:dark;font:15px/1.45 system-ui;background:#090d12;color:#dce3ea}*{box-sizing:border-box}body{max-width:900px;margin:auto;padding:24px 16px 50px}header{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}h1{font-size:1.35rem;margin:0}small,.muted{color:#7d8996}.route{font:13px ui-monospace,monospace;color:#8ee6a8;margin:8px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.card{border:1px solid #27313b;background:#111820;border-radius:9px;padding:14px;cursor:pointer}.card:hover,.card.on{border-color:#8ee6a8}.tag{font:12px ui-monospace,monospace;color:#8ee6a8}.card b{display:block;margin:5px 0}.card p{margin:0;color:#aab5c0}.panel{margin-top:14px;border:1px solid #27313b;border-radius:9px;padding:15px;background:#0d141b}.panel h2{font-size:1rem;margin:0 0 8px}.steps{margin:0;padding-left:20px}.steps li{margin:6px 0}code{color:#8ee6a8}.footer{margin-top:20px;color:#66727e;font-size:12px}
</style>
<header><h1>Context Lens</h1><small>v1 · public instrument / private coordinates</small></header>
<div class="route">question → lens → coordinate → authoritative evidence → action</div>
<div class="grid" id="cards"></div><div class="panel" id="panel"></div>
<div class="footer">This surface contains no private context. Coordinates live outside the public instrument. Authority remains with the source reached through a coordinate.</div>
<script>
const modes=[
{id:"cold",name:"Cold start",why:"Orient without swallowing the whole graph.",steps:["Resolve private coordinate sheet.","Read orientation + current aperture.","Retrieve only authority implicated by the work.","Descend to the project that owns executable truth."]},
{id:"betwixt",name:"Betwixt truth",why:"Find the executable owner before reconstructing history.",steps:["Start at the executable owner.","Inspect relevant implementation/evidence.","Use orchestration authority only for pin/build/publication topology.","Stop when executable evidence answers the question."]},
{id:"deploy",name:"Publication disagreement",why:"Separate intended, committed, deployed and observed state.",steps:["Establish build identity.","Check publisher/pin.","Check publication provenance and terminal deployment gate.","Observe canonical public surface.","Never infer live state from Git alone."]},
{id:"history",name:"Archaeology",why:"Descend into ancestry only when present work earns it.",steps:["Start from current evidence.","Resolve one specific ancestry handle.","Inspect exact historical artifact.","Return to current executable consequence."]},
{id:"repair",name:"Protected seam",why:"Diagnose a boundary without silently changing its authority.",steps:["Observe seam read-only.","Locate the failed transition.","Consult private authority for mutation rules.","If authorization is absent, stop at the boundary."]},
{id:"raw",name:"Coordinate protocol",why:"The public side supplies grammar; private space supplies addresses.",steps:["A coordinate names a source, never copies it.","Retrieval happens through existing authorization.","Retrieved content remains private unless separately authorized.","The lens never outranks what it points to."]}
];
const cards=document.querySelector("#cards"),panel=document.querySelector("#panel");
function show(m){document.querySelectorAll(".card").forEach(x=>x.classList.toggle("on",x.dataset.id===m.id));panel.innerHTML='<h2>'+m.name+'</h2><ol class="steps">'+m.steps.map(s=>'<li>'+s+'</li>').join("")+'</ol>'}
modes.forEach((m,i)=>{let d=document.createElement("div");d.className="card";d.dataset.id=m.id;d.innerHTML='<span class="tag">'+m.id.toUpperCase()+'</span><b>'+m.name+'</b><p>'+m.why+'</p>';d.onclick=()=>show(m);cards.appendChild(d);if(!i)show(m)});
</script>
