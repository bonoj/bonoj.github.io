<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Durin the Deathless · The Many Deaths</title><style>
:root{color-scheme:dark;font-family:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:#090e17;color:#e9d9ae;overflow:hidden}canvas{display:block}#stage{position:fixed;inset:0}#top{position:fixed;top:0;left:0;right:0;padding:22px 20px 8px;text-align:center;pointer-events:none;background:linear-gradient(#090e17dd,transparent)}h1{font-size:clamp(23px,6vw,43px);letter-spacing:.1em;margin:0;color:#f3dca5}#sub{font:10px system-ui;letter-spacing:.27em;color:#bca57b;margin-top:7px}#hud{position:fixed;bottom:0;left:0;right:0;padding:10px 12px max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#090e17 25%);text-align:center}#status{font:12px system-ui;color:#d4c3a3;margin:4px 0 12px}#spells{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;max-width:600px;margin:auto}.spell{width:calc((100vw - 55px)/6);max-width:73px;min-width:45px;height:60px;border:1px solid #65563c;border-radius:10px;background:#151c28;color:#cfba8c;font:10px system-ui;cursor:pointer}.spell b{display:block;font-size:23px;font-weight:normal;margin-bottom:2px}.spell.on{border-color:#eac67b;background:#453a27;box-shadow:0 0 18px #bb9a4b55;color:#fff0c0}#actions{display:flex;justify-content:center;gap:12px;margin-top:11px}#actions button{background:none;color:#bca780;border:0;font:12px system-ui;cursor:pointer;padding:6px 10px}#hint{position:fixed;top:89px;width:100%;text-align:center;font:11px system-ui;color:#9e9c9b;pointer-events:none}#error{position:fixed;top:35%;width:100%;text-align:center;color:#ffaaa0;font:14px system-ui;white-space:pre-wrap}</style></head><body><div id="stage"></div><div id="top"><h1>DURIN THE DEATHLESS</h1><div id="sub">THE MANY DEATHS OF ONE DWARF</div></div><div id="hint">DRAG TO ORBIT · TAP SPELLS TO RESPEC</div><div id="hud"><div id="status">WAVE I · THE PURSUIT</div><div id="spells"></div><div id="actions"><button id="flood">≈ FLOOD</button><button id="meteor">☄ METEOR</button><button id="reset">↻ REBIRTH</button></div></div><div id="error"></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {createTerrainSystem} from './terrain/terrain-system.js';
import {createWater} from './liquids/liquids.js';
try{
const scene=new T.Scene();scene.background=new T.Color(0x090e17);scene.fog=new T.FogExp2(0x090e17,.013);
const world=new T.Group();scene.add(world);
const camera=new T.PerspectiveCamera(40,1,.1,180),renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;document.querySelector('#stage').appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xb9d8ff,0x31221b,2.0));const key=new T.DirectionalLight(0xffdfa4,3);key.position.set(-9,18,14);scene.add(key);const rim=new T.PointLight(0x56a7f5,65,38);rim.position.set(7,8,-5);scene.add(rim);
const terrain=createTerrainSystem({THREE:T,scene:world});terrain.apparatus.material=new T.MeshStandardMaterial({color:0x252b31,metalness:.73,roughness:.37});terrain.mesh.traverse(o=>{if(o.isMesh)o.material.color.setHex(0x55554b)});
const water=createWater({THREE:T,owner:world,terrain,look:{color:0x377f99,opacity:.42,sideColor:0x183c55,sideOpacity:.32}});water.initializeToLevel(-.2);water.setEnabled(true);water.setDisplayDensity(16);
const mat=(c,metal=.2)=>new T.MeshStandardMaterial({color:c,metalness:metal,roughness:.57});
const brass=mat(0xb99555,.8),gold=mat(0xe1c17e,.8),stone=mat(0x6b7181,.1),black=mat(0x242735,.35),skin=mat(0xa69c8b),red=mat(0xb95648),green=mat(0x72b8a0),blue=mat(0x6a9cda);
function mesh(parent,geo,m,x=0,y=0,z=0){const o=new T.Mesh(geo,m);o.position.set(x,y,z);parent.add(o);return o}
function sphere(p,r,m,x=0,y=0,z=0){return mesh(p,new T.SphereGeometry(r,10,8),m,x,y,z)}
function cylinder(p,r1,r2,h,m,x=0,y=0,z=0){return mesh(p,new T.CylinderGeometry(r1,r2,h,8),m,x,y,z)}
function torus(p,r,t,m,y){const o=mesh(p,new T.TorusGeometry(r,t,8,96),m,0,y,0);o.rotation.x=Math.PI/2;return o}
torus(world,9.6,.22,brass,-1.12);torus(world,9.7,.1,gold,-6.02);
const base=cylinder(world,10.3,10.7,.45,black,0,-6.42,0);cylinder(world,10.5,10.4,.12,brass,0,-6.68,0);
const glass=new T.Mesh(new T.SphereGeometry(10.45,48,24,0,Math.PI*2,0,Math.PI/2),new T.MeshPhysicalMaterial({color:0xa8c8e0,metalness:0,roughness:.12,transparent:true,opacity:.07,side:T.BackSide,depthWrite:false}));glass.position.y=-1.1;world.add(glass);
const ruins=new T.Group();world.add(ruins);
for(let i=0;i<11;i++){const a=i*Math.PI*2/11,r=5.5+Math.sin(i*5)*1.3,x=Math.cos(a)*r,z=Math.sin(a)*r,y=terrain.groundHeight(x,z);if(!Number.isFinite(y))continue;const h=.5+(i%4)*.42;cylinder(ruins,.25,.33,h,stone,x,y+h/2,z);if(i%3===0)cylinder(ruins,.39,.38,.12,brass,x,y+h+.05,z)}
const durin=new T.Group();world.add(durin);const body=cylinder(durin,.42,.48,.85,brass,0,.75,0);sphere(durin,.34,skin,0,1.42,0);cylinder(durin,.37,.4,.3,black,0,1.75,0);const beard=mesh(durin,new T.ConeGeometry(.33,.57,7),mat(0xb1a29a),0,1.1,.22);beard.rotation.x=Math.PI;const axe=mesh(durin,new T.BoxGeometry(.09,1.45,.09),stone,.58,.75,0);mesh(durin,new T.BoxGeometry(.52,.33,.15),gold,.58,1.4,0);sphere(durin,.08,blue,0,1.84,0);
const aura=sphere(durin,1.25,new T.MeshBasicMaterial({color:0x6baeff,transparent:true,opacity:.12,depthWrite:false}),0,1,0);aura.visible=false;
const ring=torus(durin,1.25,.045,gold,.08);ring.visible=false;
const enemyMat=[red,mat(0xa87352),mat(0x8c5465)];let enemies=[],shots=[],particles=[],wave=1,kills=0,deaths=0,health=100,ward=100,spawnClock=0,waveClock=0,alive=true,rebirthAt=0,worldTime=0,last=performance.now(),yaw=.4,pitch=.45,zoom=35;
const spells=[['ward','◈','WARD'],['repel','↗','REPEL'],['sanctuary','◌','VEIL'],['blink','✧','BLINK'],['retaliate','✹','THORNS'],['renew','✚','RENEW']];const active=new Set(['ward','repel']);const buttons=document.querySelector('#spells');
for(const [id,icon,label] of spells){const b=document.createElement('button');b.className='spell'+(active.has(id)?' on':'');b.innerHTML='<b>'+icon+'</b>'+label;b.onclick=()=>{if(active.has(id))active.delete(id);else {if(active.size>=3)active.delete(active.values().next().value);active.add(id)}bump();for(const child of buttons.children)child.classList.toggle('on',active.has(child.dataset.id));};b.dataset.id=id;buttons.appendChild(b)}
function bump(){aura.visible=active.has('ward');ring.visible=active.has('repel');}
bump();
function burst(x,y,z,color=0xe3bc70,n=12){const m=mat(color);for(let i=0;i<n;i++){const p=sphere(world,.07+Math.random()*.07,m,x,y,z);particles.push({o:p,v:new T.Vector3((Math.random()-.5)*6,Math.random()*4,(Math.random()-.5)*6),life:.5+Math.random()*.6})}}
function enemy(){const a=Math.random()*Math.PI*2,r=7.5,x=Math.cos(a)*r,z=Math.sin(a)*r;if(!terrain.insideMaterial(x,z))return;const g=new T.Group();world.add(g);const m=enemyMat[(Math.random()*3)|0];cylinder(g,.31,.4,.8,m,0,.5,0);sphere(g,.27,m,0,1.12,0);cylinder(g,.29,.36,.15,black,0,1.37,0);sphere(g,.075,red,-.1,1.15,.25);sphere(g,.075,red,.1,1.15,.25);g.position.set(x,terrain.groundHeight(x,z),z);enemies.push({g,x,z,hp:2+Math.floor(wave/3),cool:0,speed:.6+Math.random()*.4+wave*.06,archer:wave>=2&&Math.random()<.32})}
function projectile(x,y,z,dx,dz){const o=sphere(world,.12,gold,x,y,z);shots.push({o,vx:dx*7,vz:dz*7,life:3})}
function kill(e){burst(e.x,e.g.position.y+.7,e.z,0xc57c55,9);world.remove(e.g);e.dead=true;kills++}
function strike(){const x=(Math.random()-.5)*7,z=(Math.random()-.5)*7;terrain.impact(new T.Vector3(x,terrain.groundHeight(x,z),z),{magnitude:1.1});water.inject(2,x,z);burst(x,terrain.groundHeight(x,z)+.5,z,0xe5a455,30);for(const e of enemies)if(Math.hypot(e.x-x,e.z-z)<2.4)e.hp-=2}
document.querySelector('#meteor').onclick=strike;document.querySelector('#flood').onclick=()=>water.inject(42,0,0);
function rebirth(full=false){if(full){terrain.reset();water.reset();water.initializeToLevel(-.2);wave=1;kills=0;deaths=0}health=100;ward=100;alive=true;durin.visible=true;for(const e of enemies)world.remove(e.g);enemies=[];for(const s of shots)world.remove(s.o);shots=[];spawnClock=0;waveClock=0;burst(0,terrain.groundHeight(0,0)+1,0,0x9ed8ff,24)}
document.querySelector('#reset').onclick=()=>rebirth(true);
function hit(amount){if(!alive)return;if(active.has('ward')&&ward>0){const blocked=Math.min(ward,amount*2);ward-=blocked;amount=Math.max(0,amount-blocked*.5);aura.material.opacity=.14+Math.random()*.2}health-=amount;if(active.has('retaliate'))for(const e of enemies)if(Math.hypot(e.x,e.z)<2.2)e.hp-=1;if(health<=0){alive=false;deaths++;durin.visible=false;rebirthAt=worldTime+2.1;burst(0,terrain.groundHeight(0,0)+1,0,0xf5b66e,35)}}
function update(dt){worldTime+=dt;water.update(performance.now());const gy=terrain.groundHeight(0,0);durin.position.set(0,gy,0);aura.material.opacity=.1+.035*Math.sin(worldTime*4);ring.rotation.z=worldTime*.7;if(!alive){if(worldTime>rebirthAt)rebirth();return}
if(active.has('renew'))health=Math.min(100,health+dt*3);if(active.has('ward'))ward=Math.min(100,ward+dt*2);
spawnClock+=dt;waveClock+=dt;if(spawnClock>Math.max(.6,2.3-wave*.14)){spawnClock=0;if(enemies.length<Math.min(45,5+wave*4))enemy()}
if(waveClock>17){wave++;waveClock=0;burst(0,gy+3,0,0xf7d37d,26);if(wave%3===0)strike()}
for(const e of enemies){if(e.dead)continue;const dist=Math.hypot(e.x,e.z)||.001;e.cool-=dt;let dx=-e.x/dist,dz=-e.z/dist;if(active.has('sanctuary')&&dist<3.4){dx=-dx;dz=-dz}else if(active.has('repel')&&dist<2.2){dx=-dx*2;dz=-dz*2;e.hp-=dt*.5}e.x+=dx*e.speed*dt;e.z+=dz*e.speed*dt;if(!terrain.insideMaterial(e.x,e.z)){e.x-=dx*e.speed*dt;e.z-=dz*e.speed*dt}e.g.position.set(e.x,terrain.groundHeight(e.x,e.z),e.z);e.g.rotation.y=Math.atan2(-dx,-dz);if(dist<1.3&&e.cool<=0&&!active.has('sanctuary')){e.cool=1.2;if(active.has('blink')&&Math.random()<.6){burst(0,gy+1,0,0x8baaff,7)}else hit(10+wave*.8)}if(e.archer&&dist<7&&e.cool<=0&&!active.has('sanctuary')){e.cool=2.5;projectile(e.x,e.g.position.y+1,e.z,dx,dz)}if(e.hp<=0)kill(e)}
enemies=enemies.filter(e=>!e.dead);for(const s of shots){s.o.position.x+=s.vx*dt;s.o.position.z+=s.vz*dt;s.life-=dt;if(Math.hypot(s.o.position.x,s.o.position.z)<.55){if(!active.has('sanctuary'))hit(active.has('blink')&&Math.random()<.65?0:12);s.life=0}if(s.life<=0){world.remove(s.o);s.dead=true}}shots=shots.filter(s=>!s.dead);
for(const p of particles){p.o.position.addScaledVector(p.v,dt);p.v.y-=8*dt;p.life-=dt;p.o.scale.setScalar(Math.max(.01,p.life));if(p.life<=0){world.remove(p.o);p.dead=true}}particles=particles.filter(p=>!p.dead);
document.querySelector('#status').textContent='WAVE '+wave+' · '+Math.ceil(health)+' LIFE · '+kills+' FALLEN · '+deaths+' REBIRTHS';
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();const vfov=40*Math.PI/180;zoom=Math.max(30,12/Math.tan(vfov/2)*Math.max(1,1/(w/h))*.9)}
addEventListener('resize',resize);resize();
let drag=false,px=0,py=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-px)*.008;pitch=T.MathUtils.clamp(pitch+(e.clientY-py)*.005,.13,1.12);px=e.clientX;py=e.clientY});
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);camera.position.set(Math.sin(yaw)*Math.cos(pitch)*zoom,Math.sin(pitch)*zoom-1,Math.cos(yaw)*Math.cos(pitch)*zoom);camera.lookAt(0,-.7,0);renderer.render(scene,camera)}requestAnimationFrame(frame);
}catch(e){document.querySelector('#error').textContent='DURIN FAILED TO RISE\n'+(e.stack||e.message);console.error(e)}
</script></body></html>
